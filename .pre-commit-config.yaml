repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.4.0
    hooks:
      - id: check-yaml
        # Helm templates are Go templates that render to YAML, not YAML. The
        # chart CI job renders them and validates the output (kubeconform).
        exclude: '^charts/[^/]+/templates/'
      - id: check-json
        # tsconfig files are JSONC: TypeScript reads `//` comments in them, and
        # tsconfig.core.json documents why the core type-check exists at all.
        # The hook is a strict JSON parser, so it is wrong about these two.
        exclude: '(^|/)tsconfig[^/]*\.json$'
      - id: check-added-large-files
        # The two OpenAPI snapshots under docs/api/ (the core one 711 KB, the
        # full one 925 KB) are generated text that the snapshot test diffs
        # operation by operation; they are the only files over the default
        # 500 KB and they are supposed to be large.
        args: ['--maxkb=1024']
      - id: check-merge-conflict
      - id: debug-statements
        exclude: ^(.*\.venv\/.*|.*venv\/.*)$
      - id: detect-private-key
      - id: check-toml
      - id: check-case-conflict

  # Frontend checks

  # Python lint + format. Same ruff version, the same [tool.ruff] config and the
  # same five trees as `make lint` and the `lint` CI job (backend/, modules/,
  # scripts/, tests/acceptance/, tests/ground_truth/), so a clean commit is a
  # green job. Scoped to ^backend/ the hook let a modules/ or scripts/ change
  # through and the gate then failed on it.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(backend|modules|scripts|tests/acceptance|tests/ground_truth)/
      - id: ruff-format
        files: ^(backend|modules|scripts|tests/acceptance|tests/ground_truth)/

  # The publication gate, run locally so it fails before a push rather than
  # after one. This repository is public and development happens in it, so a
  # push IS publication -- there is no export step downstream to strip
  # anything out. `git push --no-verify` skips this; CI runs the same script
  # on every push and pull request and does not skip.
  #
  # Two stages on purpose:
  #   pre-commit  the staged files, so the feedback lands while you are still
  #               in the change that caused it.
  #   pre-push    the whole tree AND every commit message about to leave, which
  #               is the part that matters -- the tree was clean and sixteen
  #               commit MESSAGES carried an absolute home path the one time
  #               this actually escaped.
  - repo: local
    hooks:
      - id: leak-guard
        name: leak guard (staged)
        entry: python3 scripts/leak_guard.py --staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: leak-guard-push
        name: leak guard (tree and outgoing commit messages)
        entry: python3 scripts/leak_guard.py --push
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

# MkDocs Material configuration for the public documentation site.
#
# The nav below was generated ONCE (P3.4, #136) from the in-app docs hub --
# the sections and labels of frontend/src/pages/docs/index.tsx and the slug
# map that page used to render markdown inside the dashboard -- and is
# hand-maintained from here. One entry per page: where the hub listed one
# file under several labels, the first label won. Pages not listed are still
# built and searchable, reachable by URL.
#
# `strict: true` fails the build on any broken link or anchor, in CI on every
# pull request (.github/workflows/docs.yml). Fix the link; do not relax it.
site_name: Controlvar
site_description: 'Open-source experimentation platform: A/B testing, feature flags, sequential and Bayesian
  statistics, sixteen SDKs.'
site_url: https://docs.controlvar.com/
repo_url: https://github.com/Controlvar/controlvar
repo_name: Controlvar/controlvar
edit_uri: edit/main/docs/
copyright: 'Copyright &copy; 2024-2026 The Controlvar authors. Apache-2.0. Built by <a href="https://www.linkedin.com/in/ashish-markanday/"
  target="_blank" rel="noopener noreferrer">Ashish Markanday</a>.'
extra:
  social:
  - icon: fontawesome/brands/github
    link: https://github.com/Controlvar/controlvar
    name: Controlvar on GitHub
docs_dir: docs
site_dir: site
# _claims/ holds the claims registries (scripts/doc_claims.py): data the
# checker reads, not pages; without this MkDocs would publish them.
exclude_docs: |
  planning/
  _claims/
strict: true
# A link to an anchor a page does not have is logged at INFO by default, which
# strict does not fail on; at "warn" it does.
validation:
  anchors: warn
theme:
  name: material
  features:
  - navigation.tabs
  - navigation.sections
  - navigation.top
  - navigation.footer
  - search.suggest
  - search.highlight
  - content.code.copy
  - content.action.edit
  - toc.follow
  palette:
  - media: '(prefers-color-scheme: light)'
    scheme: default
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-7
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    scheme: slate
    primary: indigo
    accent: indigo
    toggle:
      icon: material/brightness-4
      name: Switch to light mode
markdown_extensions:
- admonition
- attr_list
- md_in_html
- tables
- toc
- pymdownx.details: null
- pymdownx.superfences: null
- pymdownx.tabbed:
    alternate_style: true
- pymdownx.highlight:
    anchor_linenums: true
- pymdownx.inlinehilite: null
- pymdownx.snippets:
    base_path:
    - docs
    check_paths: true
plugins:
- search

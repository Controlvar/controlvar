# Advisories accepted in the DEVELOPMENT closure, with reasons.
#
# There is no such list for the shipped closure. `backend/requirements/runtime.lock`
# and `modules/requirements.lock` are what the images install, and
# scripts/audit_dependencies.py fails on any advisory there, full stop -- an
# exception would be a decision to ship a known vulnerability, which is not a
# decision a config file should be able to express.
#
# This file covers `backend/requirements.txt`, the closure every test job and
# developer venv installs. Entries here are for packages that do NOT reach an
# image. That is not taken on trust: the script refuses an entry whose package
# appears in a shipped closure, and refuses a stale entry whose advisory no
# longer fires -- so an exception cannot quietly outlive its reason.
#
# Adding one is a review decision. Say why, and set `review_by`.

# PYSEC-2026-1845 (pytest, GHSA-6w46-j5rx-g56g) was listed here and has been
# removed: pytest moved from 7.4.4 to 9.0.3, the fixed release (#136). Left in,
# it would have failed the stale-exception check.

# PYSEC-2026-1325 (ecdsa) was listed here and has been removed. It never
# belonged: it reached the audit only because the first version of
# scripts/audit_dependencies.py passed --no-deps without --disable-pip, so
# pip-audit resolved 179 packages for a file with 75 pins and reported
# transitives the file does not pin. With resolution actually disabled the
# advisory does not fire, and the script's own stale-exception check is what
# caught the leftover.

# python-jose is pinned for moto 4.2.14 alone: its `cognitoidp` extra requires
# `python-jose[cryptography]`. moto 5.x replaced it with joserfc, so dropping
# the pin is a moto major bump, its own change.
[[ignore]]
id = "PYSEC-2026-4298"  # aliases CVE-2026-85394, CVE-2024-33663, GHSA-6c5p-j8vq-pqhj
package = "python-jose"
reason = "python-jose is installed only because moto's cognitoidp mock imports it; the application authenticates with PyJWT and does not import jose (grep backend/app modules/backend/app for 'jose' gives no hit). It appears in no shipped closure, which the script checks. No fixed release exists yet; re-check for one by the review date."
review_by = 2026-11-05

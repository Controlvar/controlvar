# Controlvar dashboard — nginx server block (nginxinc/nginx-unprivileged, port 8080).
#
# This file is a template: `${API_UPSTREAM}` is substituted by
# frontend/docker-entrypoint.sh (envsubst) at container start, default
# http://api:8000. Everything else that looks like a variable ($uri, $host, ...)
# is nginx syntax and is left untouched because only API_UPSTREAM is expanded.
#
# Routing:
#   /api/*      -> API (REST + the /api/v1/ws/... WebSocket, upgrade headers set)
#   /api/v1/docs, /api/v1/redoc -> API, with the API's own CSP only (see below)
#   /ws/*       -> API (WebSocket paths mounted at the root, if any)
#   /health*    -> API health probes (so `curl :3000/health/ready` reaches the API)
#   /healthz    -> this container (static liveness for orchestrators)
#   everything else -> the static export in /usr/share/nginx/html; dynamic Next
#                      routes come from the generated controlvar-routes.conf.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# The access log: the base image's `main` format with the request line written
# as method, path and protocol, so no query string reaches the log. A query can
# carry a value that does not belong in a log: a results WebSocket's `?token=`,
# the OIDC callback's `code` and `state`. `$uri` is the path without the query
# (after nginx's own rewrites, such as try_files), and it, like the other
# variables here, is left alone by the entrypoint's envsubst. The error log is
# not covered: when nginx cannot reach the API it writes an error line that
# carries the full request line, query included.
# backend/tests/unit/security/test_dashboard_access_log.py pins this, and
# tests/web/access_log.sh checks it in the built image.
log_format noquery '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Replaces the http-level `access_log ... main` of the base image's
    # nginx.conf for every location below (the ones with `access_log off`
    # keep it off).
    access_log /var/log/nginx/access.log noquery;

    # Security headers. HSTS is intentionally not set here: TLS terminates at
    # the edge/CDN, which owns that header.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src ${CSP_CONNECT_SRC}; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # Static liveness for this container (no upstream involved).
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API proxy -------------------------------------------------------
    location /api/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        # WebSocket (/api/v1/ws/experiments/{id}/results)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        client_max_body_size 5m;
    }

    # The API reference pages (Swagger UI, ReDoc). The API sends them a
    # Content-Security-Policy that allows the assets they load; the dashboard
    # policy above would block those, and browsers enforce every policy
    # present. So these exact locations set their own add_header lines, which
    # stops nginx inheriting the server-level ones, and deliberately set no
    # Content-Security-Policy. They must keep at least one add_header: a block
    # with none inherits every server-level header, the dashboard CSP included.
    # backend/tests/unit/security/test_dashboard_csp.py pins this.
    location = /api/v1/docs {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location = /api/v1/redoc {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }

    location /ws/ {
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # API health probes through the same origin (/health, /health/live, /health/ready).
    location /health {
        access_log off;
        proxy_pass ${API_UPSTREAM};
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Static export ---------------------------------------------------

    # Hashed build assets: immutable.
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # Dynamic Next.js routes (/experiments/<id>, /results/<id>, ...) generated
    # from .next/routes-manifest.json by scripts/nginx-routes.mjs at build time.
    include /etc/nginx/controlvar-routes.conf;

    # Static pages: /login -> /login.html, directories -> index.html, else the
    # exported 404 page with a real 404 status (error_page below).
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # Cache other static assets briefly (they are not content-hashed).
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 7d;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}

{{- $fullname := include "controlvar.fullname" . }}
{{- $image := include "controlvar.image" (dict "ctx" . "image" .Values.image.api) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "controlvar.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  # The first new pod's `migrate` applies the upgrade while the old pods keep
  # serving; if it fails, the rollout stalls with the old version still up.
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "controlvar.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controlvar.selectorLabels" (dict "ctx" . "component" "api") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "controlvar.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- include "controlvar.podSecurity" (dict "uid" 1001 "gid" 1001) | nindent 8 }}
      # The bootstrap (create or `alembic upgrade heads`, then the first admin)
      # runs here, once per pod start, under the bootstrap's advisory lock --
      # never in the serving container.
      initContainers:
        - name: migrate
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["true"]
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "controlvar.secretEnv" . | trim | nindent 12 }}
            {{- include "controlvar.pinnedEnv" (dict "ctx" . "runMigrations" "true") | nindent 12 }}
            {{- with (include "controlvar.extraEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          securityContext:
            {{- include "controlvar.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: api
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ $fullname }}-config
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          env:
            {{- include "controlvar.secretEnv" . | trim | nindent 12 }}
            {{- include "controlvar.pinnedEnv" (dict "ctx" . "runMigrations" "false") | nindent 12 }}
            {{- with (include "controlvar.extraEnv" . | trim) }}
            {{- . | nindent 12 }}
            {{- end }}
          # Probes are exempt from the Host check, so the kubelet's pod-IP Host
          # works. That also means they stay green when publicBaseUrl is wrong:
          # `helm test` and a request through the Ingress are what catch that.
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            {{- include "controlvar.containerSecurity" . | nindent 12 }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}

{{- /*
Rendered only when no existingSecret is named. Nothing is generated: a value
the chart invented would be regenerated by every `helm template`, Argo CD sync
or `--dry-run`, and a new AUDIT_HMAC_KEY silently makes the existing audit
signatures unverifiable. A missing required value stops the render here.
*/ -}}
{{- if not .Values.existingSecret }}
{{- $s := .Values.secrets }}
{{- $hint := "(generate one with: openssl rand -hex 32)" }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "controlvar.secretName" . }}
  labels:
    {{- include "controlvar.labels" . | nindent 4 }}
type: Opaque
stringData:
  SECRET_KEY: {{ required (printf "secrets.secretKey is required %s, or name an existingSecret" $hint) $s.secretKey | quote }}
  FIRST_SUPERUSER_PASSWORD: {{ required "secrets.firstSuperuserPassword is required (at least 8 characters), or name an existingSecret" $s.firstSuperuserPassword | quote }}
  POSTGRES_USER: {{ required "secrets.postgresUser is required, or name an existingSecret" $s.postgresUser | quote }}
  POSTGRES_PASSWORD: {{ required (printf "secrets.postgresPassword is required %s, or name an existingSecret" $hint) $s.postgresPassword | quote }}
  {{- if eq .Values.profile "full" }}
  AUDIT_HMAC_KEY: {{ required (printf "secrets.auditHmacKey is required for profile=full %s, or name an existingSecret" $hint) $s.auditHmacKey | quote }}
  {{- end }}
  {{- with $s.redisPassword }}
  REDIS_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with $s.metricsToken }}
  METRICS_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}

{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "controlvar.serviceAccountName" . }}
  labels:
    {{- include "controlvar.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Nothing in Controlvar talks to the Kubernetes API.
automountServiceAccountToken: false
{{- end }}

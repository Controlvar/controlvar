{{- /*
The bundled Redis: one replica, append-only, on the development compose's
image. Multi-arch, so no amd64 nodeSelector. ClusterIP only.
*/ -}}
{{- if and .Values.redis.enabled .Values.redis.bundled }}
{{- $fullname := include "controlvar.fullname" . }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "controlvar.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  ports:
    - name: redis
      port: {{ .Values.redis.port }}
      targetPort: redis
      protocol: TCP
  selector:
    {{- include "controlvar.selectorLabels" (dict "ctx" . "component" "redis") | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "controlvar.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.redis.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.redis.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-redis
  labels:
    {{- include "controlvar.labels" . | nindent 4 }}
    app.kubernetes.io/component: redis
spec:
  replicas: 1
  # One ReadWriteOnce volume: the old pod must stop before the new one mounts it.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "controlvar.selectorLabels" (dict "ctx" . "component" "redis") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controlvar.selectorLabels" (dict "ctx" . "component" "redis") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "controlvar.serviceAccountName" . }}
      automountServiceAccountToken: false
      # redis:7-alpine's `redis` user.
      securityContext:
        {{- include "controlvar.podSecurity" (dict "uid" 999 "gid" 1000) | nindent 8 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          imagePullPolicy: IfNotPresent
          # A password is enforced only when one is in the Secret.
          command: ["sh", "-c", 'exec redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass "$REDIS_PASSWORD"}']
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "controlvar.secretName" . }}
                  key: REDIS_PASSWORD
                  optional: true
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: redis
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: redis
            initialDelaySeconds: 15
            periodSeconds: 20
          securityContext:
            {{- include "controlvar.containerSecurity" . | nindent 12 }}
          {{- with .Values.redis.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ $fullname }}-redis
        - name: tmp
          emptyDir: {}
      {{- with .Values.redis.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.redis.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}

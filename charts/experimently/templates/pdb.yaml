{{- if gt (int .Values.api.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "controlvar.fullname" . }}-api
  labels:
    {{- include "controlvar.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "controlvar.selectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
{{- end }}

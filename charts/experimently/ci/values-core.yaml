profile: core
firstSuperuser: admin@example.com
secrets:
  secretKey: render-only-placeholder-secret-key-value
  firstSuperuserPassword: render-only-placeholder-password
  postgresUser: experimently
  postgresPassword: render-only-placeholder-db-password

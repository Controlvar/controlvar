# A tag becomes signed, multi-architecture images and a GitHub release with an
# SBOM. Nothing here is run by hand.
#
# Entered three ways:
#   * `workflow_call` from release-please.yml -- the normal path (a tag that
#     action pushes with GITHUB_TOKEN cannot start a workflow on its own);
#   * a hand-pushed `v*` tag -- the rehearsal path, e.g. `v0.1.0-rc.1`;
#   * `workflow_dispatch` on a tag ref, to re-run a release whose publish step
#     failed after the tag already existed.
#
# What it produces, for VERSION=X.Y.Z:
#   ghcr.io/<owner>/<repo>:core-X.Y.Z   linux/amd64  (see #181)
#   ghcr.io/<owner>/<repo>:full-X.Y.Z   linux/amd64  (see #181)
#   ghcr.io/<owner>/<repo>-web:core-X.Y.Z   linux/amd64
#   ghcr.io/<owner>/<repo>-web:full-X.Y.Z   linux/amd64
# plus the floating `:core` / `:full` tags, which move only for a final
# release -- a pre-release must never become what `docker pull ...:core` gets.
#
# The dashboard images are amd64 only, deliberately: their payload is a static
# Next.js export, which is architecture-independent, but the Dockerfile builds
# it inside the image, so an arm64 variant means running `next build` under
# QEMU for no difference in the bytes served. Tracked as a follow-up rather
# than pretended away; `docker pull` on arm64 runs the amd64 image under
# emulation (nginx serving static files -- the cost is negligible) and anyone
# who minds builds locally, which is what docker-compose.yml does anyway.
#
# The image name comes from `github.repository`, so the private repository
# rehearses to ghcr.io/amarkanday/experimentation-platform and the public one
# publishes to ghcr.io/controlvar/controlvar with no edit at the cut.
name: Release

on:
  workflow_call:
    inputs:
      tag:
        description: 'The tag to release, e.g. v1.2.3.'
        type: string
        required: true
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'The tag to release, e.g. v1.2.3. Must already exist.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  # Per tag: two runs pushing the same image tags would race to the same digest.
  group: release-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # The platforms each image family is built for -- the ONE place they are
  # written. The build steps read these and so does the release-notes step, so
  # the notes cannot describe a platform that was not built (#239: they said
  # arm64 for a release after the arm64 variant was dropped). Comma-separated,
  # as docker/build-push-action takes them. Adding a platform here is not
  # enough on its own: see the header and #181 first.
  API_PLATFORMS: linux/amd64
  WEB_PLATFORMS: linux/amd64
  # The trivy release the image jobs scan with, installed from its release
  # tarball and checked against this sha256 (of trivy_<v>_Linux-64bit.tar.gz,
  # as the release's checksums file gives it). No action, no apt: what runs is
  # exactly this binary.
  TRIVY_VERSION: '0.74.0'
  TRIVY_SHA256: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'

jobs:
  # ---------------------------------------------------------------------------
  # Nothing is built until the tag and the tree agree. `--expect` compares the
  # tag against VERSION, the release-please manifest, the version the build
  # backend resolves, settings.VERSION, Chart.yaml's version and appVersion
  # and the compose file's image lines; a tag on the wrong commit, or a
  # VERSION that release-please did not bump, stops here rather than becoming
  # images that claim a version they are not.
  # ---------------------------------------------------------------------------
  verify:
    name: tag matches the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag: ${{ steps.resolve.outputs.tag }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
      image: ${{ steps.resolve.outputs.image }}
      web_image: ${{ steps.resolve.outputs.web_image }}
    steps:
      - name: Resolve the tag
        id: resolve
        env:
          # `github.ref_name` on a tag push; the explicit input otherwise.
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::no tag input and the ref ($REF_NAME) is not a tag"
              exit 1
            fi
            tag="$REF_NAME"
          fi
          version="${tag#v}"
          # A hyphen is SemVer's pre-release marker and the only thing that
          # distinguishes v1.2.3-rc.1 from v1.2.3. The floating :core / :full
          # tags and the GitHub release's "latest" flag both hang off this.
          case "$version" in
            *-*) prerelease=true ;;
            *)   prerelease=false ;;
          esac
          # GHCR rejects an upper-case path; github.repository preserves the
          # case the owner typed.
          image="${REGISTRY}/$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "tag=$tag"
            echo "version=$version"
            echo "prerelease=$prerelease"
            echo "image=$image"
            echo "web_image=${image}-web"
          } >> "$GITHUB_OUTPUT"
          echo "releasing $tag (version $version, prerelease=$prerelease) as $image"

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # runtime.txt, not requirements.txt: the checker imports
      # backend.app.core.config (for settings.VERSION) and calls the build
      # backend (for the distribution metadata), and the runtime closure is
      # both smaller -- no pytest, moto, locust or their transitive weight on
      # the critical path of every tag -- and the *right* one, since it is what
      # the image installs. Verifying settings.VERSION under the test closure
      # would have proved something about an environment no release ever runs.
      - name: Install the runtime dependencies
        run: |
          python -m pip install --upgrade pip
          # setuptools explicitly: it is a *build* dependency
          # (pyproject's [build-system]) and not a runtime one, so a venv on
          # 3.12+ does not have it and the metadata check dies with
          # "No module named setuptools". Measured by installing runtime.txt
          # alone into a clean venv and watching the check fail.
          # setuptools explicitly, at pyproject's own floor: it is a *build*
          # dependency ([build-system] requires = ["setuptools>=77"]), not a
          # runtime one, so runtime.txt does not carry it -- and the version a
          # venv happens to bundle can be years old. Measured: with the 65.5.0
          # that python3.11 -m venv ships, the metadata check dies on
          # `project.license` (PEP 639 needs 77+), which reads as a broken
          # pyproject rather than an old tool.
          pip install "setuptools>=77" -r backend/requirements/runtime.txt

      - name: Version sources agree with the tag
        run: python scripts/check_version_sources.py --expect "${{ steps.resolve.outputs.version }}"

  # ---------------------------------------------------------------------------
  # The API images: both profiles, both architectures, signed, with an SBOM.
  # ---------------------------------------------------------------------------
  api-images:
    name: API image (${{ matrix.profile }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write   # cosign keyless signing (Fulcio/Rekor)
    # No job outputs: a matrix job's outputs are last-writer-wins across the
    # matrix, so a `digest` here would silently mean "whichever profile
    # finished last". The SBOMs travel to `publish` as artifacts instead, which
    # is per-profile by construction.
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          PROFILE: ${{ matrix.profile }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # ONLY the versioned tag here. The floating `:core` / `:full` tags are
          # moved by the `floating-tags` job, after every image has been built,
          # signed and attested -- see the note on that job.
          tags="${IMAGE}:${PROFILE}-${VERSION}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          # org.opencontainers.image.created must be the build time; the
          # repository's updated_at, which is what is easily to hand in an
          # expression, is neither this build nor this tag.
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "$tags"

      # The UTC date, passed to the image builds below as OS_PACKAGES_REFRESHED:
      # a new date re-runs the Dockerfiles' OS package upgrade layer even when
      # the build cache holds an older copy of it (see backend/Dockerfile).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The credential scan (#748). Nothing reaches the registry until trivy's
      # secret scanner has reported zero findings on the image as built.
      #
      # The image is built first into the runner's Docker ("Build for the
      # scan"), scanned there, and only then built again with `push: true`,
      # which the builder serves from the first build's cache; "The pushed
      # image is the scanned image" proves afterwards that the layers pushed
      # are the layers scanned. Two scans, both before the push:
      #
      #   * the whole image, with trivy's default rules. Those skip /usr/share
      #     and /usr/lib, vendor/ and locale/ directories, *.md files, file
      #     names containing `example` or `_test`, and node_modules/ (skipped
      #     even with every allow rule off);
      #   * this project's own payload, /app, copied out of the image without
      #     running it and scanned with every allow rule and every skip
      #     pattern off (.github/trivy/secret-payload.yaml).
      #
      # So what neither scan reads is third-party files on the paths above.
      # A finding fails the job before anything is pushed. There is no
      # allow-list: the fix is to remove the file and cut a new release (see
      # CONTRIBUTING.md, "When a release's image scan fails"). The
      # report goes to a file under $RUNNER_TEMP and only path, rule,
      # severity and line are printed (scripts/render_secret_findings.py),
      # because this log is public. trivy's own exit status is kept.
      - name: Install trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          install -m 0755 "$RUNNER_TEMP/trivy" "$bin/trivy"
          "$bin/trivy" --version > "$RUNNER_TEMP/trivy-version.txt"
          grep -Fx "Version: ${TRIVY_VERSION}" "$RUNNER_TEMP/trivy-version.txt"
          printf 'TRIVY=%s\n' "$bin/trivy" >> "$GITHUB_ENV"

      # The same file, target, build arguments and platforms as "Build and
      # push" -- a test holds them equal -- so the second build is this one,
      # from cache. No `id: build`: the label check, signing, SBOM and
      # attestation all read steps.build.outputs.digest, which is the push.
      # Only the push writes the cache.
      - name: Build for the scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: ${{ matrix.profile }}
          platforms: ${{ env.API_PLATFORMS }}
          load: true
          push: false
          tags: release-scan/api:${{ matrix.profile }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
            GIT_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-api-${{ matrix.profile }}

      - name: Scan the image for stored credentials
        env:
          SCAN_IMAGE: release-scan/api:${{ matrix.profile }}
          LABEL: controlvar:${{ matrix.profile }}-${{ needs.verify.outputs.version }} (whole image)
          TRIVY_CONF: ${{ github.workspace }}/.github/trivy
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/trivy-image.json"
          rm -f "$report"
          # An empty working directory, so no trivy.yaml, trivy-secret.yaml or
          # .trivyignore from the tree can apply; the three are named below.
          cd "$(mktemp -d "$RUNNER_TEMP/trivy-cwd.XXXXXX")"
          status=0
          "$TRIVY" image --image-src docker --scanners secret --skip-version-check \
            --exit-code 1 --format json --output "$report" --timeout 15m \
            --config "$TRIVY_CONF/trivy.yaml" \
            --ignorefile "$TRIVY_CONF/trivyignore" \
            --secret-config "$TRIVY_CONF/secret-default.yaml" \
            "$SCAN_IMAGE" || status=$?
          render=0
          python3 "$GITHUB_WORKSPACE/scripts/render_secret_findings.py" "$report" --label "$LABEL" || render=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$render"

      - name: Scan the payload with every allow rule off
        env:
          SCAN_IMAGE: release-scan/api:${{ matrix.profile }}
          LABEL: controlvar:${{ matrix.profile }}-${{ needs.verify.outputs.version }} (/app, every allow rule off)
          TRIVY_CONF: ${{ github.workspace }}/.github/trivy
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload"
          report="$RUNNER_TEMP/trivy-payload.json"
          rm -rf "$payload" "$report"
          mkdir -p "$payload"
          # `docker create` makes a container without starting it: nothing in
          # the image runs. `docker cp` fails on a path the image lacks.
          cid="$(docker create "$SCAN_IMAGE")"
          docker cp "$cid:/app" "$payload/app"
          docker rm -f "$cid" > /dev/null
          for dir in app; do
            if [ -z "$(find "$payload/$dir" -type f -print -quit)" ]; then
              printf '::error::/%s holds no files in the image; nothing to scan\n' "$dir"
              exit 1
            fi
          done
          cd "$(mktemp -d "$RUNNER_TEMP/trivy-cwd.XXXXXX")"
          status=0
          "$TRIVY" fs --scanners secret --skip-version-check \
            --exit-code 1 --format json --output "$report" --timeout 15m \
            --config "$TRIVY_CONF/trivy.yaml" \
            --ignorefile "$TRIVY_CONF/trivyignore" \
            --secret-config "$TRIVY_CONF/secret-payload.yaml" \
            "$payload" || status=$?
          render=0
          python3 "$GITHUB_WORKSPACE/scripts/render_secret_findings.py" "$report" --label "$LABEL" || render=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$render"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: ${{ matrix.profile }}
          # amd64 only, like the dashboard images below. The arm64 variant
          # was published and could not run: `import
          # cryptography.hazmat.backends.openssl` exits 132 (SIGILL, no
          # traceback) in it, so every module importing
          # backend.app.core.security -- the whole API -- was unimportable.
          # See #181. Publishing it meant an arm64 host pulling `:core` got an
          # image that dies at import with nothing to explain why; without it,
          # Docker falls back to amd64 under emulation, which works.
          platforms: ${{ env.API_PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
            GIT_COMMIT=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha,scope=release-api-${{ matrix.profile }}
          cache-to: type=gha,scope=release-api-${{ matrix.profile }},mode=max

      # Before the label check and signing: an image whose layers differ from
      # the scanned ones is not signed. If this fails, the versioned tag has
      # already been pushed; see "When a release's image scan fails" in
      # CONTRIBUTING.md.
      - name: The pushed image is the scanned image
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SCAN_IMAGE: release-scan/api:${{ matrix.profile }}
        run: |
          set -euo pipefail
          docker image inspect "$SCAN_IMAGE" > "$RUNNER_TEMP/scanned-image.json"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .Image }}' > "$RUNNER_TEMP/pushed-image.json"
          python3 scripts/check_scanned_layers.py \
            --loaded "$RUNNER_TEMP/scanned-image.json" \
            --pushed "$RUNNER_TEMP/pushed-image.json"

      # The label is metadata anyone can read off the published image, and it
      # is the only place the version appears outside the tag. Assert it rather
      # than trust the build-arg plumbing: a renamed ARG would silently leave
      # every released image labelled 0.0.0+unknown.
      - name: Image carries the version it claims
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .Image }}' > image.json
          python3 scripts/check_image_labels.py \
            --file image.json --version "$VERSION" --profile "$PROFILE"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      # Keyless: the signature is bound to this workflow's OIDC identity
      # (repository + ref + workflow path) and recorded in Rekor. No private
      # key exists to leak or rotate. Verify with:
      #   cosign verify ghcr.io/<owner>/<repo>:core-X.Y.Z \
      #     --certificate-identity-regexp '^https://github\.com/<owner>/<repo>/\.github/workflows/release\.yml@refs/(heads/main|tags/v[0-9].*)$' \
      #     --certificate-oidc-issuer https://token.actions.githubusercontent.com
      # That is the identity docs/self-hosting/releases.md uses: release.yml,
      # run from main or from a v tag.
      - name: Sign the image
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      # NOTE: syft is handed the image with no platform, so it resolves the
      # runner's -- amd64. With one platform in API_PLATFORMS that is the whole
      # image. If a second is ever added, one SBOM would be attested against
      # the whole multi-architecture index and the other variant's
      # `cosign verify-attestation` would *succeed* while listing amd64
      # packages; the release notes then say so (see `publish`), and the fix
      # is a per-platform SBOM, not the note.
      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.verify.outputs.image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ github.workspace }}/sbom-api-${{ matrix.profile }}.spdx.json
          # The action uploads an artifact of its own by default, which would
          # be the same bytes under a second name; `publish` collects the one
          # below instead, so there is one artifact per image and its name is
          # predictable.
          upload-artifact: false

      # Attached to the image as a Sigstore attestation, so `cosign verify-attestation`
      # answers "what is in this digest" without the GitHub release.
      - name: Attest the SBOM
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "sbom-api-${PROFILE}.spdx.json" \
            "${IMAGE}@${DIGEST}"

      - name: Upload the SBOM for the release
        uses: actions/upload-artifact@v7
        with:
          name: sbom-api-${{ matrix.profile }}
          path: sbom-api-${{ matrix.profile }}.spdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # The dashboard images. amd64 only -- see the header.
  # ---------------------------------------------------------------------------
  web-images:
    name: dashboard image (${{ matrix.profile }})
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: tags
        env:
          IMAGE: ${{ needs.verify.outputs.web_image }}
          PROFILE: ${{ matrix.profile }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          # ONLY the versioned tag here. The floating `:core` / `:full` tags are
          # moved by the `floating-tags` job, after every image has been built,
          # signed and attested -- see the note on that job.
          tags="${IMAGE}:${PROFILE}-${VERSION}"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "build_date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
          echo "$tags"

      # The UTC date, passed to the image builds below as OS_PACKAGES_REFRESHED:
      # a new date re-runs the Dockerfiles' OS package upgrade layer even when
      # the build cache holds an older copy of it (see backend/Dockerfile).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The credential scan, as in the API images above (#748). The whole
      # dashboard payload lives under /usr/share/nginx/html, which trivy's
      # default rules skip with the rest of /usr/share, so the payload scan
      # is the one that reads this project's files: /usr/share/nginx/html and
      # /etc/nginx, copied out without running the image and scanned with
      # every allow rule and skip pattern off. The image scan's defaults also
      # skip /usr/lib, vendor/, locale/, *.md, file names containing
      # `example` or `_test`, and node_modules/; what neither scan reads is
      # third-party files on those paths.
      - name: Install trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          install -m 0755 "$RUNNER_TEMP/trivy" "$bin/trivy"
          "$bin/trivy" --version > "$RUNNER_TEMP/trivy-version.txt"
          grep -Fx "Version: ${TRIVY_VERSION}" "$RUNNER_TEMP/trivy-version.txt"
          printf 'TRIVY=%s\n' "$bin/trivy" >> "$GITHUB_ENV"

      # Same file, build arguments and platforms as "Build and push"; no
      # `id: build`; only the push writes the cache. See the API images.
      - name: Build for the scan
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ env.WEB_PLATFORMS }}
          load: true
          push: false
          tags: release-scan/web:${{ matrix.profile }}
          build-args: |
            EXPERIMENTLY_PROFILE=${{ matrix.profile }}
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
            GIT_COMMIT=${{ github.sha }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=release-web-${{ matrix.profile }}

      - name: Scan the image for stored credentials
        env:
          SCAN_IMAGE: release-scan/web:${{ matrix.profile }}
          LABEL: experimently-web:${{ matrix.profile }}-${{ needs.verify.outputs.version }} (whole image)
          TRIVY_CONF: ${{ github.workspace }}/.github/trivy
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/trivy-image.json"
          rm -f "$report"
          # An empty working directory, so no trivy.yaml, trivy-secret.yaml or
          # .trivyignore from the tree can apply; the three are named below.
          cd "$(mktemp -d "$RUNNER_TEMP/trivy-cwd.XXXXXX")"
          status=0
          "$TRIVY" image --image-src docker --scanners secret --skip-version-check \
            --exit-code 1 --format json --output "$report" --timeout 15m \
            --config "$TRIVY_CONF/trivy.yaml" \
            --ignorefile "$TRIVY_CONF/trivyignore" \
            --secret-config "$TRIVY_CONF/secret-default.yaml" \
            "$SCAN_IMAGE" || status=$?
          render=0
          python3 "$GITHUB_WORKSPACE/scripts/render_secret_findings.py" "$report" --label "$LABEL" || render=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$render"

      - name: Scan the payload with every allow rule off
        env:
          SCAN_IMAGE: release-scan/web:${{ matrix.profile }}
          LABEL: experimently-web:${{ matrix.profile }}-${{ needs.verify.outputs.version }} (/usr/share/nginx/html and /etc/nginx, every allow rule off)
          TRIVY_CONF: ${{ github.workspace }}/.github/trivy
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/payload"
          report="$RUNNER_TEMP/trivy-payload.json"
          rm -rf "$payload" "$report"
          mkdir -p "$payload"
          # `docker create` makes a container without starting it: nothing in
          # the image runs. `docker cp` fails on a path the image lacks.
          cid="$(docker create "$SCAN_IMAGE")"
          docker cp "$cid:/usr/share/nginx/html" "$payload/html"
          docker cp "$cid:/etc/nginx" "$payload/nginx"
          docker rm -f "$cid" > /dev/null
          for dir in html nginx; do
            if [ -z "$(find "$payload/$dir" -type f -print -quit)" ]; then
              printf '::error::the copied %s payload holds no files; nothing to scan\n' "$dir"
              exit 1
            fi
          done
          cd "$(mktemp -d "$RUNNER_TEMP/trivy-cwd.XXXXXX")"
          status=0
          "$TRIVY" fs --scanners secret --skip-version-check \
            --exit-code 1 --format json --output "$report" --timeout 15m \
            --config "$TRIVY_CONF/trivy.yaml" \
            --ignorefile "$TRIVY_CONF/trivyignore" \
            --secret-config "$TRIVY_CONF/secret-payload.yaml" \
            "$payload" || status=$?
          render=0
          python3 "$GITHUB_WORKSPACE/scripts/render_secret_findings.py" "$report" --label "$LABEL" || render=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$render"

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          platforms: ${{ env.WEB_PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            EXPERIMENTLY_PROFILE=${{ matrix.profile }}
            VERSION=${{ needs.verify.outputs.version }}
            BUILD_DATE=${{ steps.tags.outputs.build_date }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
            GIT_COMMIT=${{ github.sha }}
          provenance: mode=max
          cache-from: type=gha,scope=release-web-${{ matrix.profile }}
          cache-to: type=gha,scope=release-web-${{ matrix.profile }},mode=max

      - name: The pushed image is the scanned image
        env:
          IMAGE: ${{ needs.verify.outputs.web_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          SCAN_IMAGE: release-scan/web:${{ matrix.profile }}
        run: |
          set -euo pipefail
          docker image inspect "$SCAN_IMAGE" > "$RUNNER_TEMP/scanned-image.json"
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .Image }}' > "$RUNNER_TEMP/pushed-image.json"
          python3 scripts/check_scanned_layers.py \
            --loaded "$RUNNER_TEMP/scanned-image.json" \
            --pushed "$RUNNER_TEMP/pushed-image.json"

      # The same assertion the API images get: a renamed ARG would otherwise
      # leave every released dashboard image labelled 0.0.0+unknown, and
      # nothing else in the pipeline looks.
      - name: Image carries the version it claims
        env:
          IMAGE: ${{ needs.verify.outputs.web_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ needs.verify.outputs.version }}
          PROFILE: ${{ matrix.profile }}
        run: |
          set -euo pipefail
          docker buildx imagetools inspect "${IMAGE}@${DIGEST}" \
            --format '{{ json .Image }}' > image.json
          python3 scripts/check_image_labels.py \
            --file image.json --version "$VERSION" --profile "$PROFILE"

      - name: Install cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign the image
        env:
          IMAGE: ${{ needs.verify.outputs.web_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"

      - name: Generate the SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ needs.verify.outputs.web_image }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: ${{ github.workspace }}/sbom-web-${{ matrix.profile }}.spdx.json
          # The action uploads an artifact of its own by default, which would
          # be the same bytes under a second name; `publish` collects the one
          # below instead, so there is one artifact per image and its name is
          # predictable.
          upload-artifact: false

      - name: Attest the SBOM
        env:
          IMAGE: ${{ needs.verify.outputs.web_image }}
          DIGEST: ${{ steps.build.outputs.digest }}
          PROFILE: ${{ matrix.profile }}
        run: |
          cosign attest --yes --type spdxjson \
            --predicate "sbom-web-${PROFILE}.spdx.json" \
            "${IMAGE}@${DIGEST}"

      - name: Upload the SBOM for the release
        uses: actions/upload-artifact@v7
        with:
          name: sbom-web-${{ matrix.profile }}
          path: sbom-web-${{ matrix.profile }}.spdx.json
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Move the floating `:core` / `:full` tags -- last, and all four together.
  #
  # These were pushed inside each matrix leg, which is wrong in a way that only
  # shows up on a bad day: `fail-fast: false` means the `core` leg completes and
  # moves `ghcr.io/...:core` while the `full` leg fails in cosign, leaving
  # `docker pull ...:core` on the new version and `...:full` on the old one,
  # with no GitHub release and no SBOMs to explain it. docker-compose.yml
  # resolves exactly those tags, so two self-hosters on the same compose file
  # would be running different versions, and nothing rolls a tag back.
  #
  # `imagetools create` re-points a tag at an existing digest; nothing is
  # rebuilt, so the floating tag and the versioned tag are the same bytes by
  # construction rather than by a second build that could differ.
  #
  # It runs last of all, after `publish`, because moving a floating tag is the
  # one irreversible half of a release: there is no rollback, and a release
  # that failed to produce its GitHub release and SBOMs should not have moved
  # what `docker pull ...:core` returns. `publish` does NOT depend on this job
  # in turn -- a skipped job skips its dependents, and this one is skipped for
  # every pre-release, which would have silently suppressed the release notes
  # and SBOM upload for exactly the rc runs the launch plan rehearses with.
  #
  # It also waits for `chart`: a release whose Helm chart did not package or
  # attach is not finished, and the floating tags are the one step that cannot
  # be undone.
  #
  # A pre-release never moves them: `docker pull ...:core` must not hand anyone
  # an rc.
  # ---------------------------------------------------------------------------
  floating-tags:
    name: move :core and :full
    needs: [verify, api-images, web-images, publish, chart]
    if: needs.verify.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Point :core and :full at this release
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          WEB_IMAGE: ${{ needs.verify.outputs.web_image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          for repo in "$IMAGE" "$WEB_IMAGE"; do
            for profile in core full; do
              echo "==> ${repo}:${profile} -> ${repo}:${profile}-${VERSION}"
              docker buildx imagetools create \
                --tag "${repo}:${profile}" \
                "${repo}:${profile}-${VERSION}"
            done
          done

      - name: The floating tags resolve to this release
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          WEB_IMAGE: ${{ needs.verify.outputs.web_image }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{ json .Manifest }}' \
              | python3 -c 'import json,sys; print(json.load(sys.stdin)["digest"])'
          }
          failed=0
          for repo in "$IMAGE" "$WEB_IMAGE"; do
            for profile in core full; do
              floating="$(digest_of "${repo}:${profile}")"
              pinned="$(digest_of "${repo}:${profile}-${VERSION}")"
              if [ "$floating" != "$pinned" ]; then
                echo "::error::${repo}:${profile} is $floating, expected $pinned"
                failed=1
              else
                echo "${repo}:${profile} = $floating"
              fi
            done
          done
          exit "$failed"

  # ---------------------------------------------------------------------------
  # The GitHub release: the four SBOMs, and the pull/verify commands that go
  # with this exact tag.
  # ---------------------------------------------------------------------------
  publish:
    name: GitHub release
    needs: [verify, api-images, web-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: sbom-*
          path: sboms
          merge-multiple: true

      - name: List what will be attached
        run: ls -l sboms

      - name: Release notes
        env:
          IMAGE: ${{ needs.verify.outputs.image }}
          WEB_IMAGE: ${{ needs.verify.outputs.web_image }}
          VERSION: ${{ needs.verify.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          # The platform text is built from API_PLATFORMS / WEB_PLATFORMS, the
          # values the build steps used, never typed here (#239).
          code_list() {
            local out="" p
            IFS=',' read -ra ps <<< "$1"
            for p in "${ps[@]}"; do
              p="$(echo "$p" | tr -d '[:space:]')"
              [ -n "$p" ] && out="${out:+$out, }\`$p\`"
            done
            echo "$out"
          }
          api_platforms="$(code_list "$API_PLATFORMS")"
          web_platforms="$(code_list "$WEB_PLATFORMS")"
          # Two statements, not `test -n a && test -n b`: under `set -e` a
          # failure on the left of && does not stop the script.
          if [ -z "$api_platforms" ] || [ -z "$web_platforms" ]; then
            echo "::error::API_PLATFORMS or WEB_PLATFORMS is empty"
            exit 1
          fi
          sbom_note="The same SBOMs are attached below."
          if [[ "$API_PLATFORMS" == *,* ]]; then
            sbom_note="$sbom_note Note that the API images' SBOM is generated
          for the runner's platform and attested against the whole
          multi-architecture index, so verifying any other variant succeeds
          against that platform's package list. The variants are built from
          one Dockerfile and one hashed dependency lock, so the Python
          distributions are identical; the base OS package layer is not
          separately described."
          fi
          # The identity docs/self-hosting/releases.md verifies with:
          # release.yml, run from main or from a v tag.
          identity="^https://github\\.com/${REPOSITORY}/\\.github/workflows/release\\.yml@refs/(heads/main|tags/v[0-9].*)\$"
          cat > notes.md <<EOF
          ## Images

          \`\`\`
          docker pull ${IMAGE}:core-${VERSION}      # API, core profile
          docker pull ${IMAGE}:full-${VERSION}      # API, full profile
          docker pull ${WEB_IMAGE}:core-${VERSION}  # dashboard, core profile
          docker pull ${WEB_IMAGE}:full-${VERSION}  # dashboard, full profile
          \`\`\`

          API images are built for ${api_platforms}; dashboard images for
          ${web_platforms}. A host on any other architecture runs them under
          emulation.

          ## Verifying

          Every image is signed with cosign keyless and carries an SPDX SBOM
          attestation:

          \`\`\`
          cosign verify ${IMAGE}:core-${VERSION} \\
            --certificate-identity-regexp '${identity}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com

          cosign verify-attestation --type spdxjson ${IMAGE}:core-${VERSION} \\
            --certificate-identity-regexp '${identity}' \\
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          \`\`\`

          ${sbom_note}
          EOF
          cat notes.md

      # release-please has already created the release for a normal release;
      # `gh release edit`/`upload` on an existing one and `create` otherwise.
      - name: Attach the SBOMs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json body --jq .body > existing.md
            # Re-running this workflow on an existing tag is the documented way
            # to recover a release whose publish step failed, so appending
            # unconditionally would add a second and third copy of the same
            # section each time. The marker is what makes the append idempotent:
            # everything from it onwards is this job's output and is replaced,
            # everything before it is release-please's changelog and is kept.
            python3 - <<'PY'
          import pathlib

          MARKER = "<!-- experimently:release-artifacts -->"
          existing = pathlib.Path("existing.md").read_text(encoding="utf-8")
          generated = pathlib.Path("notes.md").read_text(encoding="utf-8")
          kept = existing.split(MARKER)[0].rstrip()
          pathlib.Path("combined.md").write_text(
              f"{kept}\n\n{MARKER}\n{generated}", encoding="utf-8"
          )
          PY
            echo "release $TAG exists; replacing the image section and re-uploading the SBOMs"
            gh release edit "$TAG" --notes-file combined.md
          else
            echo "creating release $TAG"
            { echo "<!-- experimently:release-artifacts -->"; cat notes.md; } > created.md
            flags=(--title "$TAG" --notes-file created.md)
            if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
            gh release create "$TAG" "${flags[@]}"
          fi
          gh release upload "$TAG" sboms/* --clobber

  # ---------------------------------------------------------------------------
  # The Helm chart, packaged and attached to the GitHub release as
  # `controlvar-X.Y.Z.tgz`, for `helm install ./controlvar-X.Y.Z.tgz`.
  #
  # After `publish`, because the release has to exist before an asset can be
  # attached to it, and `publish` is what creates it on the hand-pushed-tag
  # path. `verify` has already compared Chart.yaml in the tree with the tag;
  # this checks the archive itself, which is what a user installs.
  #
  # `helm package` is given no `--version` or `--app-version`: those override
  # Chart.yaml and would make the version check below compare the tag with
  # itself.
  # ---------------------------------------------------------------------------
  chart:
    name: Helm chart
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      # The same pin as chart.yml and chart-kind.yml.
      HELM_VERSION: '3.19.0'
      # sha256 of helm-v3.19.0-linux-amd64.tar.gz
      HELM_SHA256: 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify.outputs.tag }}

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # The runner image ships its own helm; the pinned one goes first on PATH
      # and the version is asserted, so the job never runs the runner's.
      - name: Install helm (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          printf '%s  %s\n' "$HELM_SHA256" "$RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$bin/helm"
          printf '%s\n' "$bin" >> "$GITHUB_PATH"
          printf 'HELM=%s\n' "$bin/helm" >> "$GITHUB_ENV"

      - name: Tool version
        run: |
          set -euo pipefail
          test "$(helm version --template '{{.Version}}')" = "v${HELM_VERSION}"
          test "$(command -v helm)" = "$HELM"

      - name: helm lint --strict
        run: |
          set -euo pipefail
          for values in charts/experimently/ci/values-core.yaml charts/experimently/ci/values-full.yaml; do
            helm lint --strict charts/experimently -f "$values"
          done

      - name: helm package
        run: |
          set -euo pipefail
          mkdir -p dist
          helm package charts/experimently --destination dist
          ls -l dist

      - name: The packaged chart is this release
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: python scripts/check_chart_package.py "dist/controlvar-${VERSION}.tgz" --expect "$VERSION"

      # --clobber: re-running this workflow on an existing tag is the documented
      # recovery for a failed release, and must replace the asset, not fail on it.
      - name: Attach the chart to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "dist/controlvar-${VERSION}.tgz" --clobber
          gh release view "$TAG" --json assets --jq '.assets[].name' > assets.txt
          grep -Fx "controlvar-${VERSION}.tgz" assets.txt

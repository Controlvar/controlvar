# One SDK, one tag, one publish.
#
# SDKs version independently of the platform -- a fix to the JavaScript client
# should not force a release of the API images -- so each has its own tag:
#
#   sdk/js/v1.2.3        @controlvar/js-sdk 1.2.3                  -> npm
#   sdk/python/v1.2.3    controlvar 1.2.3                          -> PyPI
#   sdk/dotnet/v1.2.3    Controlvar.SDK 1.2.3                      -> NuGet
#   sdk/go/v1.2.3       github.com/controlvar/controlvar/sdk/go   -> the Go module proxy
#                        (the module path is lower case; the repository it is
#                        fetched from is github.com/Controlvar/controlvar)
#
# That shape is Go's requirement (a module in a subdirectory is released by a
# `<subdir>/vX.Y.Z` tag), reused for every SDK so there is one convention.
#
# Publishing is by trusted publishing -- OIDC, no long-lived token in any
# secret. Each registry must be told, once, to trust this repository and this
# workflow file:
#
#   PyPI   Manage project -> Publishing -> Add a GitHub publisher:
#          owner + repository + workflow `sdk-release.yml` + environment `sdk-release`
#   npm    Package settings -> Trusted publisher -> GitHub Actions, same three
#   NuGet  a trusted publishing policy for GitHub Actions on nuget.org, same
#          three; the `sdk-release` environment's variable NUGET_USER names
#          the nuget.org account (its profile name) that created the policy.
#          The `nuget` job exchanges the OIDC token for a short-lived API key
#          (nuget.org's documentation: one hour).
#
# Until that is done, a publish is meant to stop at the registry's
# authentication check: nothing is published by a fallback nobody audited.
# That is intent, read from the npm and pypa sources; no run has shown it.
# The founder owns this (tracked in P3.8, issue #140).
#
# `environment: sdk-release` is also where a human approval belongs. NOTE, as
# intent rather than a working gate: an environment with no protection rule is
# created on first use and approves nothing. The required-reviewer rule is
# repository configuration, not something this file can assert, so it is on the
# P3.8 checklist beside the registry configuration above.
#
# Each registry has two jobs. `pypi-build`, `npm-build` and `nuget-build`
# install, test and build, and cannot request an OIDC token. `pypi`, `npm` and
# `nuget` hold the token and the environment, install nothing from this
# repository, and check the package they upload against the tag before
# uploading it. So the environment's approval is asked for
# after the tests and checks have passed. An npm prerelease (a version with a
# `-`, such as 1.0.0-rc.1) publishes under the `next` dist-tag; a stable
# version gets `latest`. backend/tests/smoke/test_sdk_release_wiring.py pins
# this shape.
name: SDK Release

on:
  push:
    tags: ['sdk/*/v*']
  workflow_dispatch:
    inputs:
      sdk:
        description: 'SDK directory name under sdk/, e.g. js or openfeature-python.'
        type: string
        required: true
      version:
        description: 'Version to publish. Must equal the manifest version on this ref.'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Work out which SDK is being released, and refuse anything the plumbing
  # cannot actually publish -- including an SDK that has no registry account
  # yet, which would otherwise build, test, publish nothing and go green.
  # ---------------------------------------------------------------------------
  resolve:
    name: resolve the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      sdk: ${{ steps.parse.outputs.sdk }}
      version: ${{ steps.parse.outputs.version }}
      ecosystem: ${{ steps.parse.outputs.ecosystem }}
      name: ${{ steps.parse.outputs.name }}
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # A tag push releases the SDK and version its tag names. A dispatch
      # names them in its inputs, and when it runs at a release tag
      # (`--ref sdk/<name>/v<version>`) they must be that tag's own. The
      # environment's policy (repository configuration: tags matching
      # `sdk/*/v*`) looks at the ref, not at what the run builds, so without
      # this a dispatch at one SDK's tag could build another SDK from that
      # tag's commit (`--ref sdk/react/v0.1.0 -f sdk=js`). A dispatch from a
      # branch keeps its inputs; its publish jobs are left to that tag-only
      # policy (intent: this file cannot assert repository configuration).
      - name: Parse and check
        id: parse
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
          INPUT_SDK: ${{ inputs.sdk }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # sdk/<name>/v<version> -- the name may contain a hyphen
          # (openfeature-python, react-native) but never a slash.
          release_tag=false
          tag_sdk=""
          tag_version=""
          if [ "$REF_TYPE" = "tag" ]; then
            case "$REF_NAME" in
              sdk/*/v*)
                release_tag=true
                tag_sdk="${REF_NAME#sdk/}"
                tag_sdk="${tag_sdk%%/*}"
                tag_version="${REF_NAME##*/v}"
                ;;
            esac
          fi

          if [ -n "$INPUT_SDK" ]; then
            sdk="$INPUT_SDK"
            version="${INPUT_VERSION#v}"
          else
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::not a tag ref: $REF_NAME"
              exit 1
            fi
            if [ "$release_tag" != "true" ]; then
              echo "::error::$REF_NAME is not sdk/<name>/v<version>"
              exit 1
            fi
            sdk="$tag_sdk"
            version="$tag_version"
          fi

          # At a release tag, the run releases that tag and nothing else.
          if [ "$release_tag" = "true" ]; then
            if [ "$sdk" != "$tag_sdk" ] || [ "$version" != "$tag_version" ]; then
              printf '%s\n' "::error::this run is at the tag $REF_NAME (sdk $tag_sdk, version $tag_version), but its inputs ask for sdk $sdk, version $version. A dispatch at a release tag must name that tag's own SDK and version; to release $sdk $version, dispatch at its own tag."
              exit 1
            fi
          fi

          # Refuses an unknown name, an SDK with no publishing identity, and a
          # version that does not match the manifest this ref carries.
          python scripts/check_sdk_version.py "$sdk" --expect "$version"
          ecosystem="$(python scripts/check_sdk_version.py "$sdk" --print-ecosystem)"
          # The registry name, from the manifest. It is not derivable from the
          # directory: sdk/openfeature is @controlvar/openfeature-provider
          # while sdk/js is @controlvar/js-sdk, and sdk/dotnet is
          # Controlvar.SDK.
          name=""
          if [ "$ecosystem" = "pypi" ] || [ "$ecosystem" = "npm" ] || [ "$ecosystem" = "nuget" ]; then
            name="$(python scripts/check_sdk_version.py "$sdk" --print-name)"
          fi

          {
            echo "sdk=$sdk"
            echo "version=$version"
            echo "ecosystem=$ecosystem"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"
          echo "releasing sdk/$sdk $version via $ecosystem"

      # A prerelease is a version with a `-` once any `+build` metadata is
      # removed: `1.0.0-rc.1` is one, `1.0.0` and `1.0.0+build.5` are not.
      # Read from the version only, never the tag, whose SDK name can carry a
      # hyphen of its own (sdk/react-native/v1.0.0). The npm publish job puts
      # a prerelease under the `next` dist-tag.
      - name: Classify the version
        id: classify
        env:
          VERSION: ${{ steps.parse.outputs.version }}
        run: |
          set -euo pipefail
          core="${VERSION%%+*}"
          case "$core" in
            *-*) prerelease=true ;;
            *) prerelease=false ;;
          esac
          printf 'prerelease=%s\n' "$prerelease" >> "$GITHUB_OUTPUT"
          printf '%s is a prerelease: %s\n' "$VERSION" "$prerelease"

  # ---------------------------------------------------------------------------
  # PyPI: sdk/python, sdk/openfeature-python
  #
  # Two jobs. `pypi-build` installs, tests and builds, and cannot request an
  # OIDC token: its permissions are `contents: read` and nothing else. It
  # uploads `dist/` and records a digest of what it uploaded. `pypi` holds the
  # token and the `sdk-release` environment, installs nothing, and publishes
  # only after checking the files it downloaded against that digest and
  # against the tag. The environment's approval is therefore asked for after
  # the tests and checks have passed.
  # ---------------------------------------------------------------------------
  pypi-build:
    name: test and build for PyPI
    needs: resolve
    if: needs.resolve.outputs.ecosystem == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install build tooling
        run: python -m pip install --upgrade pip build twine

      - name: Run the SDK's tests
        working-directory: sdk/${{ needs.resolve.outputs.sdk }}
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest -q

      - name: Build
        working-directory: sdk/${{ needs.resolve.outputs.sdk }}
        run: python -m build

      # `twine check` catches a README that PyPI will reject *before* the
      # upload, which is the difference between a failed job and a version
      # number burned on a half-published project.
      - name: Check the distributions
        working-directory: sdk/${{ needs.resolve.outputs.sdk }}
        run: twine check dist/*

      - name: Built version matches the tag
        working-directory: sdk/${{ needs.resolve.outputs.sdk }}
        env:
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          # PyPI normalises: the file name carries the PEP 440 spelling, so
          # compare on the parsed version rather than the string.
          python - <<'PY'
          import os, pathlib, sys
          from packaging.utils import parse_wheel_filename
          from packaging.version import Version

          expected = Version(os.environ["VERSION"])
          wheels = sorted(pathlib.Path("dist").glob("*.whl"))
          if not wheels:
              sys.exit("no wheel was built")
          for wheel in wheels:
              _, built, _, _ = parse_wheel_filename(wheel.name)
              if built != expected:
                  sys.exit(f"{wheel.name} is version {built}, expected {expected}")
          # The publish job compares file names with the tag as strings, so a
          # tag in any other spelling would only be refused after approval.
          if str(expected) != os.environ["VERSION"]:
              sys.exit(
                  f"the tag says {os.environ['VERSION']}, which PEP 440 spells "
                  f"{expected}; tag and manifest must use that spelling"
              )
          print(f"{len(wheels)} wheel(s) at {expected}")
          PY

      # One line per file, `<sha256>  <name>`, sorted by name; the digest is
      # the sha256 of that listing. The publish job recomputes it over what it
      # downloaded and compares it with this job's output.
      - name: Record the distributions
        id: record
        working-directory: sdk/${{ needs.resolve.outputs.sdk }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, sys

          files = sorted(pathlib.Path("dist").iterdir(), key=lambda p: p.name)
          if not files or not all(p.is_file() for p in files):
              sys.exit("dist/ must hold files only, and at least one")
          listing = "".join(
              f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files
          )
          digest = hashlib.sha256(listing.encode()).hexdigest()
          print(listing, end="")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"digest={digest}\n")
          print(f"digest {digest}")
          PY

      - name: Upload the checked distributions
        uses: actions/upload-artifact@v7
        with:
          name: pypi-dist
          path: sdk/${{ needs.resolve.outputs.sdk }}/dist/
          if-no-files-found: error
          overwrite: false

  pypi:
    name: publish to PyPI
    needs: [resolve, pypi-build]
    if: needs.resolve.outputs.ecosystem == 'pypi'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: sdk-release
      url: https://pypi.org/project/${{ needs.resolve.outputs.name }}
    permissions:
      contents: read
      id-token: write   # trusted publishing
    steps:
      - name: Download the checked distributions
        uses: actions/download-artifact@v8
        with:
          name: pypi-dist
          path: ${{ github.workspace }}/dist

      # Standard library only: this job installs nothing. Every file must be a
      # wheel or an sdist whose name and version are the tag's, compared on
      # the PEP 503 normalised name, exactly; nothing else may be present; and
      # the digest of the set must equal the one `pypi-build` recorded.
      - name: Check the distributions against the tag
        env:
          NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          DIGEST: ${{ needs.pypi-build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, sys

          def normalise(name):
              return re.sub(r"[-_.]+", "-", name).lower()

          name = os.environ["NAME"]
          version = os.environ["VERSION"]
          expected_digest = os.environ["DIGEST"]
          dist = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "dist"

          problems = []
          if not name or not version:
              problems.append("the tag resolved no name or no version")
          if not re.fullmatch(r"[0-9a-f]{64}", expected_digest):
              problems.append(f"the build job recorded no usable digest: {expected_digest!r}")
          files = sorted(dist.iterdir(), key=lambda p: p.name) if dist.is_dir() else []
          if not files:
              problems.append(f"nothing was downloaded into {dist}")
          for path in files:
              filename = path.name
              if path.is_symlink() or not path.is_file():
                  problems.append(f"{filename} is not a regular file")
                  continue
              if filename.endswith(".whl"):
                  project, _, rest = filename[: -len(".whl")].partition("-")
                  file_version = rest.split("-", 1)[0]
              elif filename.endswith(".tar.gz"):
                  project, _, file_version = filename[: -len(".tar.gz")].partition("-")
              else:
                  problems.append(f"{filename} is neither a wheel nor an sdist")
                  continue
              if normalise(project) != normalise(name):
                  problems.append(f"{filename} is for {project!r}, not {name!r}")
              if file_version != version:
                  problems.append(f"{filename} is version {file_version!r}, not {version!r}")

          if not problems:
              listing = "".join(
                  f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}\n" for p in files
              )
              digest = hashlib.sha256(listing.encode()).hexdigest()
              if digest != expected_digest:
                  problems.append(
                      f"the downloaded files have digest {digest}; the build job "
                      f"recorded {expected_digest}"
                  )

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"{len(files)} file(s) for {name} {version}, digest {expected_digest}")
          PY

      # Pinned to a commit. Dependabot moves the pin, and CI never runs this
      # job, so a pin bump merges on checks that do not exercise it.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/

  # ---------------------------------------------------------------------------
  # npm: sdk/js, sdk/edge, sdk/openfeature, sdk/react, sdk/react-native
  #
  # Two jobs, the same shape as PyPI. `npm-build` installs, tests, pins,
  # packs and checks the tarball, and cannot request an OIDC token: its
  # permissions are `contents: read` and nothing else. It uploads that one
  # tarball and records its file name and sha256. `npm` holds the token and
  # the `sdk-release` environment, has no checkout and installs nothing. It
  # checks the tarball it downloaded against that digest and against the tag,
  # and publishes it: a prerelease under the `next` dist-tag, a stable
  # version with no `--tag`, so npm applies `latest` itself. The environment's
  # approval is therefore asked for after the tests and checks have passed.
  # ---------------------------------------------------------------------------
  npm-build:
    name: test and build for npm
    needs: resolve
    if: needs.resolve.outputs.ecosystem == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      file: ${{ steps.record.outputs.file }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # Node 22 with the npm it bundles, as sdk-unit-tests.yml tests the SDKs.
      # Nothing here publishes, so nothing here needs a newer npm.
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install, test and build
        working-directory: sdk/${{ needs.resolve.outputs.sdk }}
        run: |
          set -euo pipefail
          npm ci
          npm test --if-present
          npm run build --if-present

      # The published manifest must install from npm. sdk/openfeature depends
      # on @controlvar/js-sdk as `file:../js` so its tests run against the
      # JS SDK in this tree; `npm pack` copies that spec into the tarball
      # unchanged and `npm publish` does not resolve it (#687). This rewrites
      # each `file:` dependency to `^<that package's version on this ref>` and
      # refuses any other non-registry spec. For an SDK with no `file:`
      # dependency it rewrites nothing and writes an empty list.
      # Standard library only, so the runner's python3 is enough.
      - name: Pin local dependencies to npm ranges
        id: pin
        env:
          SDK: ${{ needs.resolve.outputs.sdk }}
        run: |
          set -euo pipefail
          python3 scripts/pin_npm_local_deps.py "sdk/$SDK" --rewrites-file "$RUNNER_TEMP/rewrites.txt"
          printf 'rewritten=%s\n' "$(wc -l < "$RUNNER_TEMP/rewrites.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Publish order: the provider names js-sdk at the version in this tree,
      # so that version has to be on npm before the provider is published.
      # `npm view` exits 1 (E404) when it is not. Skipped when nothing was
      # rewritten; if the condition ever misreads, the empty list fails here.
      - name: Each pinned dependency is already on npm
        if: steps.pin.outputs.rewritten != '0'
        run: |
          set -euo pipefail
          if [ ! -s "$RUNNER_TEMP/rewrites.txt" ]; then
            printf '%s\n' "::error::no rewritten dependency was recorded, but this step only runs when there is one"
            exit 1
          fi
          while read -r spec; do
            if ! npm view "$spec" version; then
              printf '%s\n' "::error::$spec is not on npm yet, so this package would install without it. Publish that package first (its own sdk/<name>/v<version> tag), then re-run this release with the same tag."
              exit 1
            fi
          done < "$RUNNER_TEMP/rewrites.txt"

      # What `npm publish` will upload: this exact tarball is published by
      # the `npm` job. A package whose `files` list is missing ships its
      # sources and tests, or -- worse -- ships no `dist` at all and installs
      # as an empty module; the listing `npm pack` prints is where that shows.
      - name: Pack
        id: pack
        working-directory: sdk/${{ needs.resolve.outputs.sdk }}
        run: |
          set -euo pipefail
          dest="$RUNNER_TEMP/pack"
          mkdir -p "$dest"
          npm pack --pack-destination "$dest"
          shopt -s nullglob
          tarballs=("$dest"/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ]; then
            printf '%s\n' "::error::expected one tarball in $dest, found ${#tarballs[@]}"
            exit 1
          fi
          printf 'tgz=%s\n' "${tarballs[0]}" >> "$GITHUB_OUTPUT"

      # `npm pack --dry-run --json` lists files, not dependencies, so check the
      # package.json inside the tarball itself.
      - name: The packed package.json has registry ranges only
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/extract"
          rm -rf "$out"
          mkdir -p "$out"
          tar -xzf "$TGZ" -C "$out" package/package.json
          python3 scripts/pin_npm_local_deps.py --check-only "$out/package/package.json"

      # A consumer installs the tarball alone, so every dependency resolves
      # from npm. `npm install` and `require()` both exit 0 over a dangling
      # `file:` link; `npm ls --all` is what fails on one. No lifecycle
      # scripts run, and peers are the versions this SDK's lock was tested with.
      - name: A consumer can install the tarball
        env:
          SDK: ${{ needs.resolve.outputs.sdk }}
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          peers="$(python3 scripts/pin_npm_local_deps.py --print-peer-pins "sdk/$SDK")"
          consumer="$RUNNER_TEMP/consumer"
          rm -rf "$consumer"
          mkdir -p "$consumer"
          cd "$consumer"
          npm init -y > /dev/null
          # shellcheck disable=SC2086  # one peer pin per word
          npm install --ignore-scripts --no-audit --no-fund "$TGZ" $peers
          npm ls --all

      # The file name and the sha256 of the tarball's bytes. The publish job
      # recomputes the sha256 over what it downloaded and compares it with
      # this job's output.
      - name: Record the tarball
        id: record
        env:
          TGZ: ${{ steps.pack.outputs.tgz }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib

          tgz = pathlib.Path(os.environ["TGZ"])
          digest = hashlib.sha256(tgz.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"file={tgz.name}\ndigest={digest}\n")
          print(f"{digest}  {tgz.name}")
          PY

      - name: Upload the checked tarball
        uses: actions/upload-artifact@v7
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tgz }}
          if-no-files-found: error
          overwrite: false

  npm:
    name: publish to npm
    needs: [resolve, npm-build]
    if: needs.resolve.outputs.ecosystem == 'npm'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: sdk-release
      url: https://www.npmjs.com/package/${{ needs.resolve.outputs.name }}
    permissions:
      contents: read
      id-token: write   # trusted publishing + provenance
    steps:
      - name: Download the checked tarball
        uses: actions/download-artifact@v8
        with:
          name: npm-tarball
          path: ${{ github.workspace }}/package

      # Standard library only. Exactly one file was downloaded, it has the
      # name the build job recorded, that name is a plain `.tgz` file name,
      # and its sha256 is the one the build job recorded.
      - name: Check the tarball's name and digest
        env:
          FILE: ${{ needs.npm-build.outputs.file }}
          DIGEST: ${{ needs.npm-build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, sys

          def fail(problem):
              print(f"::error::{problem}")
              sys.exit(1)

          name = os.environ["FILE"]
          expected = os.environ["DIGEST"]
          folder = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "package"

          if not re.fullmatch(r"[A-Za-z0-9._-]+\.tgz", name):
              fail(f"the build job recorded no usable file name: {name!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", expected):
              fail(f"the build job recorded no usable digest: {expected!r}")
          found = sorted(p.name for p in folder.iterdir()) if folder.is_dir() else []
          if found != [name]:
              fail(f"expected exactly {name} in {folder}, found {found}")
          path = folder / name
          if path.is_symlink() or not path.is_file():
              fail(f"{name} is not a regular file")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != expected:
              fail(
                  f"{name} has digest {digest}; the build job recorded {expected}"
              )
          print(f"{digest}  {name}")
          PY

      # The package.json inside the tarball has the tag's name and version,
      # and sets no publish configuration: no top-level `tag` and no
      # `publishConfig`. Compared with `resolve`, never with the build job.
      - name: Check the packed package.json against the tag
        env:
          NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          FILE: ${{ needs.npm-build.outputs.file }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/published"
          rm -rf "$out"
          mkdir -p "$out"
          tar -xzf "$GITHUB_WORKSPACE/package/$FILE" -C "$out" package/package.json
          python3 - "$out/package/package.json" <<'PY'
          import json, os, sys

          with open(sys.argv[1], encoding="utf-8") as handle:
              manifest = json.load(handle)
          name = os.environ["NAME"]
          version = os.environ["VERSION"]

          problems = []
          if not isinstance(manifest, dict):
              problems.append("the packed package.json is not an object")
              manifest = {}
          if not name or not version:
              problems.append("the tag resolved no name or no version")
          if manifest.get("name") != name:
              problems.append(f"the tarball is {manifest.get('name')!r}, not {name!r}")
          if manifest.get("version") != version:
              problems.append(
                  f"the tarball is version {manifest.get('version')!r}, not {version!r}"
              )
          for key in ("tag", "publishConfig"):
              if key in manifest:
                  problems.append(f"the packed package.json sets {key!r}")

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"{name} {version}")
          PY

      # No `registry-url`: npm publishes to its default registry, and no
      # .npmrc with a token placeholder is written. Intent, read from the npm
      # and setup-node sources rather than seen on a real run: with no
      # trusted publisher configured, the publish stops at npm's
      # authentication check. No package-manager cache: there is no checkout
      # and nothing to restore.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.21.0'
          package-manager-cache: false

      # Trusted publishing needs npm 11.5.1 or later; Node 24.21.0 bundles
      # npm 11.19.0.
      - name: Node and npm are the pinned versions
        run: |
          set -euo pipefail
          node_version="$(node --version)"
          npm_version="$(npm --version)"
          printf 'node %s, npm %s\n' "$node_version" "$npm_version"
          if [ "$node_version" != "v24.21.0" ] || [ "$npm_version" != "11.19.0" ]; then
            printf '%s\n' "::error::expected node v24.21.0 with npm 11.19.0, found node $node_version with npm $npm_version"
            exit 1
          fi

      # A prerelease goes under `next`. A stable version passes no `--tag`,
      # so npm applies `latest` itself, together with its refusal to move
      # `latest` to a version lower than one already published (which npm
      # skips if it cannot read the package's published versions).
      - name: Publish
        env:
          TGZ: ${{ github.workspace }}/package/${{ needs.npm-build.outputs.file }}
          PRERELEASE: ${{ needs.resolve.outputs.prerelease }}
        run: |
          set -euo pipefail
          case "$PRERELEASE" in
            true) npm publish "$TGZ" --provenance --access public --tag next ;;
            false) npm publish "$TGZ" --provenance --access public ;;
            *)
              printf '%s\n' "::error::resolve classified the version as neither a prerelease nor stable: '$PRERELEASE'"
              exit 1
              ;;
          esac

  # ---------------------------------------------------------------------------
  # NuGet: sdk/dotnet (Controlvar.SDK)
  #
  # Two jobs, the same shape as the others. `nuget-build` runs the SDK's tests
  # on every leg, packs the one project the release publishes, checks the
  # package's contents and its README, and checks that a consumer restores it
  # from the package alone. Its permissions are `contents: read` and nothing
  # else. `nuget` holds the token and the `sdk-release` environment and has no
  # checkout. It checks the package it downloaded against that job's digest
  # and against the tag, exchanges the OIDC token for a short-lived nuget.org
  # API key, and pushes the package. There is no --skip-duplicate: a version
  # nuget.org already has fails the push.
  # ---------------------------------------------------------------------------
  nuget-build:
    name: test and build for NuGet
    needs: resolve
    if: needs.resolve.outputs.ecosystem == 'nuget'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      file: ${{ steps.record.outputs.file }}
      digest: ${{ steps.record.outputs.digest }}
    steps:
      - uses: actions/checkout@v7

      # The .NET 10 SDK builds; the tests run on the .NET 8 and .NET 10
      # runtimes, as sdk-unit-tests.yml runs them.
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # Three legs: the SDK's net8.0 build on .NET 8 and on .NET 10, and its
      # netstandard2.1 build on .NET 8. The check refuses a leg that is
      # missing, failed, ran no test or ran a different number from the others.
      - name: Run the SDK's tests
        run: |
          set -euo pipefail
          dotnet test sdk/dotnet/Controlvar.sln -c Release --nologo --logger trx --results-directory "$RUNNER_TEMP/trx"
          python3 scripts/check_dotnet_test_legs.py "$RUNNER_TEMP/trx"

      # The release packs this project and nothing else: the solution also
      # holds the tests and the examples. scripts/check_sdk_version.py reads
      # its version (NUGET_PROJECTS). One file must come out: the .nupkg, and
      # no .snupkg (the PDB is embedded in the DLL).
      - name: Pack
        id: pack
        env:
          SDK: ${{ needs.resolve.outputs.sdk }}
        run: |
          set -euo pipefail
          if [ "$SDK" != "dotnet" ]; then
            printf '%s\n' "::error::this job packs sdk/dotnet only, not sdk/$SDK"
            exit 1
          fi
          dest="$RUNNER_TEMP/nupkg"
          mkdir -p "$dest"
          dotnet pack sdk/dotnet/src/Controlvar/Controlvar.csproj -c Release --nologo -o "$dest" -p:ContinuousIntegrationBuild=true
          shopt -s nullglob
          packed=("$dest"/*)
          if [ "${#packed[@]}" -ne 1 ] || [ "${packed[0]##*.}" != "nupkg" ]; then
            printf '%s\n' "::error::expected one .nupkg in $dest, found: ${packed[*]}"
            exit 1
          fi
          printf 'nupkg=%s\n' "${packed[0]}" >> "$GITHUB_OUTPUT"

      # Standard library only. The package holds exactly what nuget.org
      # should show for this tag: its id and version, the MIT licence
      # expression, the README, the project and repository links with this
      # run's commit, and a build for each target framework in FRAMEWORKS with
      # exactly the dependencies listed there, and nothing else.
      # test_sdk_release_nuget.py holds FRAMEWORKS and the two links to
      # sdk/dotnet/src/Controlvar/Controlvar.csproj.
      - name: Check the package
        env:
          NUPKG: ${{ steps.pack.outputs.nupkg }}
          NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          FRAMEWORKS: >-
            net8.0
            netstandard2.1:System.Text.Json@8.0.6
          PROJECT_URL: https://github.com/Controlvar/controlvar/tree/main/sdk/dotnet#readme
          REPOSITORY_URL: https://github.com/Controlvar/controlvar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, re, sys, zipfile
          import xml.etree.ElementTree as ET

          def local(tag):
              return tag.rsplit("}", 1)[-1]

          def framework(name):
              # The nuspec writes netstandard2.1 as .NETStandard2.1.
              return name.lower().lstrip(".")

          path = pathlib.Path(os.environ["NUPKG"])
          name = os.environ["NAME"]
          version = os.environ["VERSION"]
          commit = os.environ["GITHUB_SHA"]
          expected_frameworks = {}
          for entry in os.environ["FRAMEWORKS"].split():
              target, _, deps = entry.partition(":")
              expected_frameworks[target] = sorted(tuple(d.split("@")) for d in deps.split(",") if d)

          problems = []
          if not name or not re.fullmatch(r"[0-9A-Za-z][0-9A-Za-z.+-]*", version):
              problems.append(f"the tag resolved no usable name or version: {name!r} {version!r}")
          if path.name != f"{name}.{version}.nupkg":
              problems.append(f"the package is {path.name}, not {name}.{version}.nupkg")
          if problems:
              for problem in problems:
                  print(f"::error::{problem}")
              sys.exit(1)

          with zipfile.ZipFile(path) as archive:
              names = archive.namelist()
              nuspec = archive.read(f"{name}.nuspec") if f"{name}.nuspec" in names else b""
          if not nuspec:
              print(f"::error::the package holds no {name}.nuspec")
              sys.exit(1)
          root = ET.fromstring(nuspec)
          metadata = next((e for e in root if local(e.tag) == "metadata"), [])
          fields = {local(e.tag): e for e in metadata}

          def text(field):
              element = fields.get(field)
              return (element.text or "").strip() if element is not None else None

          for field, want in (
              ("id", name),
              ("version", version),
              ("readme", "README.md"),
              ("projectUrl", os.environ["PROJECT_URL"]),
          ):
              if text(field) != want:
                  problems.append(f"the nuspec's {field} is {text(field)!r}, not {want!r}")
          licence = fields.get("license")
          if licence is None or licence.get("type") != "expression" or (licence.text or "").strip() != "MIT":
              problems.append("the nuspec's licence is not the expression MIT")
          repository = fields.get("repository")
          repo = dict(repository.attrib) if repository is not None else {}
          if repo.get("type") != "git" or repo.get("url") != os.environ["REPOSITORY_URL"]:
              problems.append(f"the nuspec's repository is {repo}, not git {os.environ['REPOSITORY_URL']}")
          if repo.get("commit") != commit:
              problems.append(f"the nuspec's repository commit is {repo.get('commit')!r}, not this run's {commit}")

          groups = {}
          dependencies = fields.get("dependencies")
          for group in (dependencies if dependencies is not None else []):
              target = framework(group.get("targetFramework", ""))
              if target in groups:
                  problems.append(f"the nuspec lists the dependencies of {target} twice")
              groups[target] = sorted(
                  (d.get("id"), d.get("version")) for d in group if local(d.tag) == "dependency"
              )
          if groups != expected_frameworks:
              problems.append(f"the nuspec's dependencies are {groups}, not {expected_frameworks}")

          expected = {"[Content_Types].xml", "_rels/.rels", f"{name}.nuspec", "README.md"}
          for target in expected_frameworks:
              expected |= {f"lib/{target}/Controlvar.dll", f"lib/{target}/Controlvar.xml"}
          extra = sorted(
              n for n in set(names) - expected
              # NuGet's core-properties part: `nuget.psmdcp` from the .NET 10
              # SDK, a random hex name from older ones.
              if not re.fullmatch(r"package/services/metadata/core-properties/(?:nuget|[0-9a-f]{32})\.psmdcp", n)
          )
          missing = sorted(expected - set(names))
          if len(names) != len(set(names)):
              problems.append("the package holds an entry twice")
          problems += [f"the package holds an unexpected entry: {n}" for n in extra]
          problems += [f"the package is missing {n}" for n in missing]

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"{path.name}: {name} {version}, commit {commit}")
          for entry in sorted(names):
              print(f"  {entry}")
          PY

      # The README nuget.org shows for this version, for good: no status, no
      # install command, no own version, no relative link, and an Install
      # section that links the SDK's page (DECISIONS T230).
      - name: Check the packed README
        env:
          SDK: ${{ needs.resolve.outputs.sdk }}
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: python3 scripts/check_packaged_readme.py --sdk "$SDK" "$NUPKG"

      # A consumer that has only this package: an empty directory, an empty
      # package cache, and a NuGet.Config whose source mapping takes the
      # package from the directory it was packed into and nothing else from
      # there; System.Text.Json comes from nuget.org. The consumer targets
      # both of the package's frameworks, so both builds are restored and
      # compiled against, and the package it restored must be this one, byte
      # for byte.
      - name: A consumer restores the package alone
        env:
          NUPKG: ${{ steps.pack.outputs.nupkg }}
          NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
        run: |
          set -euo pipefail
          consumer="$RUNNER_TEMP/consumer"
          export NUGET_PACKAGES="$RUNNER_TEMP/consumer-packages"
          export NUGET_HTTP_CACHE_PATH="$RUNNER_TEMP/consumer-http-cache"
          for path in "$consumer" "$NUGET_PACKAGES" "$NUGET_HTTP_CACHE_PATH"; do
            if [ -e "$path" ]; then
              printf '%s\n' "::error::$path exists; the consumer must start empty"
              exit 1
            fi
          done
          mkdir "$consumer"
          cd "$consumer"
          python3 - "$(dirname "$NUPKG")" "$NAME" <<'PY'
          import pathlib, sys
          from xml.sax.saxutils import quoteattr

          source, name = sys.argv[1:3]
          pathlib.Path("NuGet.Config").write_text("\n".join([
              '<?xml version="1.0" encoding="utf-8"?>',
              "<configuration>",
              "  <packageSources>",
              "    <clear />",
              f"    <add key=\"packed\" value={quoteattr(source)} />",
              '    <add key="nuget.org" value="https://api.nuget.org/v3/index.json" />',
              "  </packageSources>",
              "  <packageSourceMapping>",
              f"    <packageSource key=\"packed\"><package pattern={quoteattr(name)} /></packageSource>",
              '    <packageSource key="nuget.org"><package pattern="*" /></packageSource>',
              "  </packageSourceMapping>",
              "</configuration>",
              "",
          ]), encoding="utf-8")
          pathlib.Path("Consumer.csproj").write_text("\n".join([
              '<Project Sdk="Microsoft.NET.Sdk">',
              "  <PropertyGroup>",
              "    <TargetFrameworks>net8.0;netstandard2.1</TargetFrameworks>",
              "  </PropertyGroup>",
              "</Project>",
              "",
          ]), encoding="utf-8")
          pathlib.Path("Consumer.cs").write_text("\n".join([
              "public static class Consumer",
              "{",
              '    public static Controlvar.SdkConfig Config() => new Controlvar.SdkConfig("http://localhost", "key");',
              "}",
              "",
          ]), encoding="utf-8")
          PY
          dotnet add package "$NAME" --version "$VERSION"
          dotnet build -c Release --nologo
          python3 - "$NUPKG" "$NAME" "$VERSION" <<'PY'
          import hashlib, json, os, pathlib, sys

          packed, name, version = sys.argv[1:4]
          cache = pathlib.Path(os.environ["NUGET_PACKAGES"]) / name.lower() / version.lower()
          restored = cache / f"{name.lower()}.{version.lower()}.nupkg"
          problems = []
          if not restored.is_file():
              problems.append(f"the consumer restored no {restored}")
          elif hashlib.sha256(restored.read_bytes()).digest() != hashlib.sha256(pathlib.Path(packed).read_bytes()).digest():
              problems.append(f"the consumer restored a {name} {version} that is not the packed one")
          assets = json.loads(pathlib.Path("obj/project.assets.json").read_text(encoding="utf-8"))
          targets = assets.get("targets", {})
          # The .NET 10 SDK keys the targets by framework alias; older ones by
          # the framework's full name.
          for target, full, lib, needs in (
              ("net8.0", ".NETCoreApp,Version=v8.0", "lib/net8.0/Controlvar.dll", None),
              ("netstandard2.1", ".NETStandard,Version=v2.1", "lib/netstandard2.1/Controlvar.dll", "System.Text.Json"),
          ):
              libraries = targets.get(target) or targets.get(full) or {}
              compile_assets = libraries.get(f"{name}/{version}", {}).get("compile", {})
              if lib not in compile_assets:
                  problems.append(f"{target}: the consumer compiles against {sorted(compile_assets)}, not {lib}")
              if needs and not any(key.startswith(f"{needs}/") for key in libraries):
                  problems.append(f"{target}: the consumer restored no {needs}")
          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"the consumer restored {restored.name}, equal to the packed file, and built against both frameworks")
          PY

      # The file name and the sha256 of the package's bytes. The publish job
      # recomputes the sha256 over what it downloaded and compares it with
      # this job's output.
      - name: Record the package
        id: record
        env:
          NUPKG: ${{ steps.pack.outputs.nupkg }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib

          nupkg = pathlib.Path(os.environ["NUPKG"])
          digest = hashlib.sha256(nupkg.read_bytes()).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"file={nupkg.name}\ndigest={digest}\n")
          print(f"{digest}  {nupkg.name}")
          PY

      - name: Upload the checked package
        uses: actions/upload-artifact@v7
        with:
          name: nuget-package
          path: ${{ steps.pack.outputs.nupkg }}
          if-no-files-found: error
          overwrite: false

  nuget:
    name: publish to NuGet
    needs: [resolve, nuget-build]
    if: needs.resolve.outputs.ecosystem == 'nuget'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: sdk-release
      url: https://www.nuget.org/packages/${{ needs.resolve.outputs.name }}
    permissions:
      contents: read
      id-token: write   # trusted publishing: exchanged for a short-lived API key
    env:
      # The nuget.org account (its profile name, not an email) that created
      # the trusted publishing policy: a variable of the sdk-release
      # environment. Not a secret; it reaches the login step through `env`.
      NUGET_USER: ${{ vars.NUGET_USER }}
    steps:
      # Every action in this job is pinned to a commit: the job holds the
      # OIDC token, and CI never runs it, so a moved tag would first run here.
      - name: Download the checked package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: ${{ github.workspace }}/package

      # Standard library only. Exactly one file was downloaded, it has the
      # name the build job recorded, that name is a plain `.nupkg` file name,
      # and its sha256 is the one the build job recorded.
      - name: Check the package's name and digest
        env:
          FILE: ${{ needs.nuget-build.outputs.file }}
          DIGEST: ${{ needs.nuget-build.outputs.digest }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, os, pathlib, re, sys

          def fail(problem):
              print(f"::error::{problem}")
              sys.exit(1)

          name = os.environ["FILE"]
          expected = os.environ["DIGEST"]
          folder = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "package"

          if not re.fullmatch(r"[A-Za-z0-9._-]+\.nupkg", name):
              fail(f"the build job recorded no usable file name: {name!r}")
          if not re.fullmatch(r"[0-9a-f]{64}", expected):
              fail(f"the build job recorded no usable digest: {expected!r}")
          found = sorted(p.name for p in folder.iterdir()) if folder.is_dir() else []
          if found != [name]:
              fail(f"expected exactly {name} in {folder}, found {found}")
          path = folder / name
          if path.is_symlink() or not path.is_file():
              fail(f"{name} is not a regular file")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          if digest != expected:
              fail(f"{name} has digest {digest}; the build job recorded {expected}")
          print(f"{digest}  {name}")
          PY

      # The nuspec inside the package has the tag's id and version. Compared
      # with `resolve`, never with the build job.
      - name: Check the packed nuspec against the tag
        env:
          NAME: ${{ needs.resolve.outputs.name }}
          VERSION: ${{ needs.resolve.outputs.version }}
          FILE: ${{ needs.nuget-build.outputs.file }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, sys, zipfile
          import xml.etree.ElementTree as ET

          name = os.environ["NAME"]
          version = os.environ["VERSION"]
          path = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "package" / os.environ["FILE"]

          problems = []
          if not name or not version:
              problems.append("the tag resolved no name or no version")
          with zipfile.ZipFile(path) as archive:
              nuspecs = [n for n in archive.namelist() if "/" not in n and n.endswith(".nuspec")]
              if len(nuspecs) != 1:
                  problems.append(f"expected one .nuspec at the package root, found {nuspecs}")
                  fields = {}
              else:
                  fields = {
                      e.tag.rsplit("}", 1)[-1]: (e.text or "").strip()
                      for e in ET.fromstring(archive.read(nuspecs[0])).iter()
                  }
          if fields.get("id") != name:
              problems.append(f"the package is {fields.get('id')!r}, not {name!r}")
          if fields.get("version") != version:
              problems.append(f"the package is version {fields.get('version')!r}, not {version!r}")

          for problem in problems:
              print(f"::error::{problem}")
          if problems:
              sys.exit(1)
          print(f"{name} {version}")
          PY

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.403'

      # The runner image carries .NET SDKs of its own, and `dotnet` picks the
      # newest unless a global.json pins one, so the push runs in a directory
      # whose global.json pins the SDK set up above and refuses any other.
      - name: The .NET SDK is the pinned version
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/push"
          mkdir -p "$work"
          printf '%s\n' '{"sdk": {"version": "10.0.403", "rollForward": "disable"}}' > "$work/global.json"
          cd "$work"
          version="$(dotnet --version)"
          printf 'dotnet %s\n' "$version"
          if [ "$version" != "10.0.403" ]; then
            printf '%s\n' "::error::expected the .NET SDK 10.0.403, found $version"
            exit 1
          fi

      - name: The NuGet user is set
        run: |
          set -euo pipefail
          if [ -z "${NUGET_USER:-}" ]; then
            printf '%s\n' "::error::NUGET_USER is empty in the sdk-release environment (a variable that does not exist reads as empty); set it to the nuget.org profile name that created the trusted publishing policy"
            exit 1
          fi
          printf 'pushing as the nuget.org user %s\n' "$NUGET_USER"

      # The OIDC token is exchanged for an API key that lasts an hour; the
      # action masks it before it sets the output (core.setSecret, read in
      # its src/index.ts at this commit).
      - name: Exchange the OIDC token for a NuGet API key
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ env.NUGET_USER }}

      # The key reaches the script through `env:` and is masked again before
      # its first use. No --skip-duplicate: a version nuget.org already has is
      # a failure, not a green run that published nothing.
      - name: Push
        env:
          NUPKG: ${{ github.workspace }}/package/${{ needs.nuget-build.outputs.file }}
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${NUGET_API_KEY:-}" ]; then
            printf '%s\n' "::error::the login step produced no API key"
            exit 1
          fi
          printf '::add-mask::%s\n' "$NUGET_API_KEY"
          cd "$RUNNER_TEMP/push"
          dotnet nuget push "$NUPKG" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json

  # ---------------------------------------------------------------------------
  # Go: nothing to upload. `go get` resolves the tag from the repository, so
  # the tag *is* the release -- but the module has to actually build at it, and
  # a tag on a commit where it does not is a broken release nobody can yank.
  # ---------------------------------------------------------------------------
  go:
    name: verify the Go module
    needs: resolve
    if: needs.resolve.outputs.ecosystem == 'tag-only'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          # The Go SDK is stdlib-only: `git ls-files sdk/go` has go.mod and no
          # go.sum. setup-go caches by default and hashes `cache-dependency-path`
          # first, so pointing it at a file that does not exist failed this job
          # at step two on every `sdk/go/v*` tag -- a release gate that could
          # only reject. The two other setup-go blocks in this repository
          # (_platform.yml, sdk-unit-tests.yml) already say `cache: false`.
          cache: false

      - name: Build and test
        working-directory: sdk/go
        run: |
          go build ./...
          go test -race ./...

      # The invariant is that go.mod's path ends in the subdirectory the tag
      # names -- `sdk/go/vX.Y.Z` publishes the module at `sdk/go` -- because
      # that is what the go tool resolves. It is NOT that the path contains
      # `github.repository`: go.mod already declares the post-cut home
      # (Controlvar/controlvar), deliberately and permanently, while
      # this workflow still runs on the pre-cut repository. Comparing against
      # `github.repository` made every `sdk/go/v*` tag fail here -- a gate
      # that can only ever reject, which is no better than one that can only
      # ever pass.
      - name: Module path matches the tag's subdirectory
        working-directory: sdk/go
        run: |
          set -euo pipefail
          declared="$(go list -m)"
          case "$declared" in
            */sdk/go) ;;
            *)
              echo "::error::go.mod declares $declared, which does not end in /sdk/go;"
              echo "::error::an sdk/go/vX.Y.Z tag publishes the module in sdk/go and nothing else"
              exit 1
              ;;
          esac
          echo "module path $declared"

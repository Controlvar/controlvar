name: Platform

# =============================================================================
# Reusable workflow: boot the platform, run one named suite against it.
#
# Every job that needs a *running* Controlvar used to repeat the same twenty
# lines: pg + redis services, Python, bootstrap, seeds, uvicorn from the
# repository root, poll /health. This is that sequence, once. Its callers
# are pr-qa-gate.yml's sdk-live-contract and fuzz.yml's three API fuzzing
# passes; the nightly suites do NOT call it (the `integration` and `smoke`
# suites below are there for when one does).
#
#   jobs:
#     live-contract:
#       uses: ./.github/workflows/_platform.yml
#       with:
#         profile: core
#         seed: sdk-contract
#         suite: sdk-live-contract
#         sdks: python js go java
#
# `seed` uses the same vocabulary as docker-compose's SEED and
# backend/docker-entrypoint.sh: a comma list of demo, shoplab, streampulse,
# sdk-contract. `suite` picks what runs once the API answers; add a new one to
# the case statement in "Run suite" rather than re-inlining a boot sequence.
#
# Toolchains beyond Python are installed only when the suite asks for them
# (`sdks` names them), so a pytest suite does not wait for .NET.
#
# `skip: true` makes the job a no-op that still REPORTS, under its own name.
# That is the whole point: branch protection requires
# `SDK Live Contract / sdk-live-contract (core)`, and a caller skipped by a
# job-level `if:` never produces that name (#133 sat BLOCKED on it). So every
# step's condition starts with `!inputs.skip`, wrapped in `${{ }}` because a
# bare condition starting with `!` is a YAML tag, not an expression. The
# services still start; that cost is accepted. Pinned by
# backend/tests/unit/infrastructure/test_docs_only_gate.py.
# =============================================================================

on:
  workflow_call:
    inputs:
      profile:
        description: 'core | full — which profile to boot. core removes modules/ from the checkout; full installs modules/requirements.txt on top of the backend pins.'
        type: string
        default: core
      seed:
        description: 'Comma list of seeds to apply: demo, shoplab, streampulse, sdk-contract. Empty for none.'
        type: string
        default: demo
      suite:
        description: 'Named suite to run: sdk-live-contract | integration | smoke | fuzz.'
        type: string
        required: true
      sdks:
        description: 'For sdk-live-contract: space-separated SDK names to run (and the toolchains to install).'
        type: string
        default: ''
      timeout-minutes:
        description: 'Job timeout.'
        type: number
        default: 30
      skip:
        description: 'Report the check without doing the work (every step but the first is skipped). pr-qa-gate.yml sets it on a docs-only change.'
        type: boolean
        default: false
      api_env:
        description: 'Extra environment for the API process alone: one NAME=value per line, exported before uvicorn starts. Empty for none.'
        type: string
        default: ''
      fuzz_pass:
        description: 'For fuzz: superuser | viewer | sdk, the credentials and operations of the pass (scripts/fuzz_check.py).'
        type: string
        default: ''
      fuzz_seed:
        description: 'For fuzz: the Schemathesis seed, an integer. (`seed` above is the data seed; this is not.)'
        type: number
        default: 0
    outputs:
      fuzz_values:
        description: 'For fuzz: the template and values of the pass''s step summary (counts only), as JSON, for fuzz.yml''s issue; empty when the pass was not decided.'
        value: ${{ jobs.platform.outputs.fuzz_values }}

jobs:
  platform:
    name: ${{ inputs.suite }} (${{ inputs.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    outputs:
      fuzz_values: ${{ steps.suite.outputs.fuzz_values }}

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Identical to what the sdk-live-contract job in pr-qa-gate.yml set inline.
      APP_ENV: development
      ENVIRONMENT: development
      EXPERIMENTLY_PROFILE: ${{ inputs.profile }}
      # The app reads POSTGRES_SERVER for the host; POSTGRES_HOST is what the
      # seed scripts and tests read. Both are set, as before.
      POSTGRES_SERVER: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_DB: experimentation
      POSTGRES_SCHEMA: experimentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      SECRET_KEY: ci-only-platform-secret-key-0123456789abcdef0123456789
      AUTH_PROVIDER: local
      DEV_AUTH_BYPASS: 'false'
      # Both names until the SDK smokes read the new one.
      CONTROLVAR_API_URL: http://127.0.0.1:8000
      EXPERIMENTLY_API_URL: http://127.0.0.1:8000

    steps:
      - name: Skipped
        if: ${{ inputs.skip }}
        run: |
          echo "skip is set (a docs-only change): ${{ inputs.suite }} (${{ inputs.profile }}) is not needed and every step below is skipped."

      - uses: actions/checkout@v7
        if: ${{ !inputs.skip }}

      # `profile: core` has to mean a core API, not just an environment
      # variable. Nothing under backend/ reads EXPERIMENTLY_PROFILE:
      # backend/app/modules_loader.py decides on whether `import modules`
      # succeeds, so a checkout with modules/ present boots the full profile
      # whatever the input said. Removing the directory is exactly how
      # scripts/core_build.sh proves the core profile, and the assertion after
      # the boot below checks the API agrees.
      - name: Make the core profile real
        if: ${{ !inputs.skip && inputs.profile == 'core' }}
        run: rm -rf modules

      # ── toolchains ──────────────────────────────────────────────────────────
      - name: Set up Python
        if: ${{ !inputs.skip }}
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        if: ${{ !inputs.skip && (contains(inputs.sdks, 'js') || contains(inputs.sdks, 'react') || contains(inputs.sdks, 'edge') || contains(inputs.sdks, 'openfeature')) }}
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up Go
        if: ${{ !inputs.skip && contains(inputs.sdks, 'go') }}
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          # The Go SDK is stdlib-only: there is no go.sum to key a cache on.
          cache: false

      # Covers both `java` and `android` (the Android SDK's JVM variant compiles
      # the same Kotlin sources for a plain JVM — see sdk/android/jvm/pom.xml).
      # Maven itself comes from each module's ./mvnw, not from the runner.
      - name: Set up Java
        if: ${{ !inputs.skip && (contains(inputs.sdks, 'java') || contains(inputs.sdks, 'android')) }}
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Set up Ruby
        if: ${{ !inputs.skip && contains(inputs.sdks, 'ruby') }}
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'

      - name: Set up PHP
        if: ${{ !inputs.skip && contains(inputs.sdks, 'php') }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: json, curl

      - name: Set up .NET
        if: ${{ !inputs.skip && contains(inputs.sdks, 'dotnet') }}
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '6.0.x'

      # ── dependencies ────────────────────────────────────────────────────────
      - name: Install backend dependencies
        if: ${{ !inputs.skip }}
        run: pip install -r backend/requirements.txt

      # The modules import packages backend/requirements.txt deliberately does
      # not carry (python3-saml, authlib). Without this install the module code
      # loads and then refuses at the first call -- which is exactly the failure
      # this file must not hide.
      - name: Install module dependencies
        if: ${{ !inputs.skip && inputs.profile == 'full' }}
        run: pip install -r modules/requirements.txt

      - name: Install SDK dependencies
        if: ${{ !inputs.skip && inputs.suite == 'sdk-live-contract' }}
        env:
          SDKS: ${{ inputs.sdks }}
        run: |
          set -euo pipefail
          for sdk in $SDKS; do
            case "$sdk" in
              openfeature-python) pip install "openfeature-sdk>=0.9.0" ;;
              js|openfeature|edge|react)
                (cd "sdk/$sdk" && (npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund)) ;;
              react-native)
                (cd sdk/react-native && (npm ci --no-audit --no-fund 2>/dev/null || npm install --no-audit --no-fund)) ;;
              python|go|java|android|ruby|php|dotnet|ios|elixir|flutter) ;;
              *) echo "::error::unknown sdk '$sdk'"; exit 1 ;;
            esac
          done

      # Schemathesis in a venv of its own under the runner's temp directory:
      # installing it next to the backend would move packages the API under
      # test imports (tests/fuzz/requirements.txt pins it).
      # --no-deps and `pip check`: the venv holds exactly the two files' pins,
      # and a dependency neither pins fails here rather than floating. The
      # commands are scripts/check_fuzz_install.sh's, which every pull request
      # also runs (pr-qa-gate.yml, "Base Requirements Only"), so the install a
      # pull request is judged on is this one.
      - name: Install the fuzzer
        if: ${{ !inputs.skip && inputs.suite == 'fuzz' }}
        run: bash scripts/check_fuzz_install.sh "$RUNNER_TEMP/fuzz-venv"

      # ── boot ────────────────────────────────────────────────────────────────
      # Everything runs from the repository root: the code imports backend.app.*
      # and `cd backend` breaks those imports.
      - name: Create the schema
        if: ${{ !inputs.skip }}
        run: python -m backend.app.db.bootstrap

      - name: Apply seeds
        if: ${{ !inputs.skip && inputs.seed != '' }}
        env:
          SEED: ${{ inputs.seed }}
        run: |
          set -euo pipefail
          # Same names as docker-compose's SEED / backend/docker-entrypoint.sh.
          IFS=',' read -r -a seeds <<< "$SEED"
          for name in "${seeds[@]}"; do
            name="$(echo "$name" | tr -d '[:space:]')"
            [ -z "$name" ] && continue
            case "$name" in
              demo)         script=backend/scripts/seed_demo_data.py ;;
              shoplab)      script=backend/scripts/seed_shoplab.py ;;
              streampulse)  script=backend/scripts/seed_streampulse.py ;;
              sdk-contract) script=backend/scripts/seed_sdk_contract.py ;;
              *) echo "::error::unknown seed '$name'"; exit 1 ;;
            esac
            echo "::group::seed $name"
            python "$script"
            echo "::endgroup::"
          done

      # `api_env` is read through `env:` and exported line by line, never
      # written into the script, and reaches the API process alone (the seeds
      # above have run). The pid is written before the health loop, which ends
      # the step with `exit 0`; the fuzz arm reads it.
      - name: Start the API
        if: ${{ !inputs.skip }}
        env:
          API_ENV: ${{ inputs.api_env }}
        run: |
          while IFS= read -r entry; do
            [ -z "$entry" ] && continue
            if ! [[ "$entry" =~ ^[A-Z_][A-Z0-9_]*= ]]; then
              echo "::error::api_env: each line is NAME=value"
              exit 1
            fi
            export "${entry?}"
          done <<< "$API_ENV"
          nohup python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > backend.log 2>&1 &
          echo "$!" > "$RUNNER_TEMP/api.pid"
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8000/health > /dev/null && exit 0
            sleep 1
          done
          echo "backend did not become healthy"; tail -n 100 backend.log; exit 1

      # The profile the caller asked for is the profile that is running. A core
      # job that quietly booted the full API would test the wrong thing and
      # still be green -- which is what `sdk-live-contract (core)`, a required
      # check, was doing.
      #
      # `.profile` alone does not answer that question. Registering the module
      # routers and mounting them are two steps, and the second can fail on its
      # own: the process then keeps serving the core API while every module
      # route 404s. So the module list and one real module route are checked
      # too -- /api/v1/workspaces/ is mounted by the registration and exists in
      # no core build, so it is 404 there and an authentication refusal here.
      - name: Assert the running profile
        if: ${{ !inputs.skip }}
        run: |
          set -euo pipefail
          curl -sf http://127.0.0.1:8000/api/v1/modules -o modules.json
          cat modules.json
          running=$(jq -er .profile modules.json)
          if [ "$running" != "${{ inputs.profile }}" ]; then
            echo "::error::asked for the ${{ inputs.profile }} profile, the API is running $running"
            exit 1
          fi
          count=$(jq -er '.modules | length' modules.json)
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/v1/workspaces/)
          if [ "${{ inputs.profile }}" = 'full' ]; then
            if [ "$count" -eq 0 ]; then
              echo "::error::the full profile reports no installed modules"
              exit 1
            fi
            if [ "$code" = '404' ]; then
              echo "::error::/api/v1/workspaces/ answers 404: the module routers registered but never mounted"
              tail -n 100 backend.log
              exit 1
            fi
          else
            if [ "$count" -ne 0 ]; then
              echo "::error::the core profile reports $count installed modules"
              exit 1
            fi
            if [ "$code" != '404' ]; then
              echo "::error::/api/v1/workspaces/ answers $code on the core profile: a module route is mounted"
              exit 1
            fi
          fi
          echo "the API is running the $running profile ($count modules, /api/v1/workspaces/ -> $code)"

      # ── suite ───────────────────────────────────────────────────────────────
      - name: Run suite
        id: suite
        if: ${{ !inputs.skip }}
        env:
          SUITE: ${{ inputs.suite }}
          SDKS: ${{ inputs.sdks }}
          FUZZ_PASS: ${{ inputs.fuzz_pass }}
          FUZZ_SEED: ${{ inputs.fuzz_seed }}
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          case "$SUITE" in
            sdk-live-contract)
              args=""
              for sdk in $SDKS; do args="$args --sdk $sdk"; done
              # shellcheck disable=SC2086
              python tests/sdk-contract/live/run_live_contract.py --strict $args
              ;;
            integration)
              python -m pytest backend/tests/integration -p no:cov -q --tb=short
              ;;
            smoke)
              python -m pytest backend/tests/smoke -p no:cov -q --tb=short
              ;;
            fuzz)
              # API fuzzing, one pass (fuzz.yml). This job's log is public, so
              # it carries counts only: Schemathesis's output and its report
              # stay in files under $RUNNER_TEMP that nothing prints or
              # uploads, and the step summary is rendered from
              # .github/qa-templates/fuzz-green.tmpl or fuzz-red.tmpl by
              # scripts/fuzz_check.py through scripts/qa_render.py.
              case "$FUZZ_PASS" in
                superuser) email=admin@demo.com ;;
                viewer) email=viewer@demo.com ;;
                sdk) email= ;;
                *) echo "::error::fuzz_pass must be superuser, viewer or sdk"; exit 1 ;;
              esac
              # Nothing may reach AWS: the API process must carry the dead
              # endpoint fuzz.yml passes in api_env. -z reads the process's
              # NUL-separated entries as they are and -x compares whole
              # entries (`:90` does not match); reading the file directly, no
              # pipe can end early and fail a check that matched.
              pid=$(cat "$RUNNER_TEMP/api.pid")
              if ! grep -qxzF 'AWS_ENDPOINT_URL=http://127.0.0.1:9' "/proc/$pid/environ"; then
                echo "::error::the API process does not have AWS_ENDPOINT_URL=http://127.0.0.1:9; refusing to fuzz"
                exit 1
              fi
              # The runner prints the database container's log when the job
              # ends, and a PostgreSQL error quotes its statement, values
              # included. From here on nothing short of a crash is logged.
              for setting in log_min_messages log_min_error_statement; do
                docker exec "$PG_CONTAINER" psql -U postgres -qAtc "ALTER SYSTEM SET $setting = 'panic'"
              done
              docker exec "$PG_CONTAINER" psql -U postgres -qAtc "SELECT pg_reload_conf()" > /dev/null
              for setting in log_min_messages log_min_error_statement; do
                if [ "$(docker exec "$PG_CONTAINER" psql -U postgres -qAtc "SHOW $setting")" != panic ]; then
                  echo "::error::the database still logs errors ($setting); refusing to fuzz"
                  exit 1
                fi
              done
              work="$RUNNER_TEMP/fuzz"
              mkdir -p "$work/report"
              if [ "$FUZZ_PASS" = sdk ]; then
                # The seed's sdk:ruleset key: it is accepted on every SDK
                # route, and the three server-side ones take nothing less.
                key=$(cat tests/sdk-contract/live/.api_key_local)
                echo "::add-mask::$key"
                auth=(-H "X-API-Key: $key")
              else
                token=$(curl -sf -X POST http://127.0.0.1:8000/api/v1/auth/login \
                  -H 'Content-Type: application/json' \
                  -d "{\"email\": \"$email\", \"password\": \"Demo1234!\"}" | jq -er .access_token) || {
                  echo "::error::could not sign in as the $FUZZ_PASS pass's seeded user"
                  exit 1
                }
                echo "::add-mask::$token"
                auth=(-H "Authorization: Bearer $token")
              fi
              curl -sf http://127.0.0.1:8000/api/v1/openapi.json -o "$work/openapi.json"
              python scripts/fuzz_check.py args --pass "$FUZZ_PASS" --schema "$work/openapi.json" > "$work/filters.txt"
              filters=()
              while IFS= read -r arg; do filters+=("$arg"); done < "$work/filters.txt"
              # Its exit status is not the verdict (1 on any 5xx, 0 on a run
              # that reached nothing); fuzz_check.py decides below.
              set +e
              (
                cd "$work" &&
                  "$RUNNER_TEMP/fuzz-venv/bin/schemathesis" run http://127.0.0.1:8000/api/v1/openapi.json \
                    --checks not_a_server_error --phases examples,coverage,fuzzing \
                    --max-examples 5 --workers 1 --rate-limit 4/s \
                    --seed "$FUZZ_SEED" --generation-deterministic \
                    --report ndjson --report-dir "$work/report" \
                    "${filters[@]}" "${auth[@]}"
              ) > "$work/schemathesis.out" 2>&1
              set -e
              # Which route answered each 5xx, by the application's own
              # router (imported here, from the same packages as the API, with
              # the database and Redis pointed at a closed port). Their output
              # stays in files; a failure leaves no routes file, and the
              # evaluation below is then red.
              python scripts/fuzz_check.py requests --report-dir "$work/report" \
                --out "$work/requests.json" > "$work/requests.log" 2>&1 || true
              POSTGRES_PORT=1 REDIS_PORT=1 python scripts/fuzz_check.py routes --schema "$work/openapi.json" \
                --requests "$work/requests.json" --out "$work/routes.json" > "$work/routes.log" 2>&1 || true
              verdict=0
              python scripts/fuzz_check.py evaluate --pass "$FUZZ_PASS" \
                --schema "$work/openapi.json" --report-dir "$work/report" \
                --routes "$work/routes.json" \
                --seed "$FUZZ_SEED" --sha "$GITHUB_SHA" \
                --run-link "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
                --summary "$work/summary.md" --values "$work/values.json" || verdict=$?
              if [ -f "$work/summary.md" ]; then
                cat "$work/summary.md" >> "$GITHUB_STEP_SUMMARY"
              fi
              if [ -f "$work/values.json" ]; then
                printf 'fuzz_values=%s\n' "$(cat "$work/values.json")" >> "$GITHUB_OUTPUT"
              fi
              exit "$verdict"
              ;;
            *)
              echo "::error::unknown suite '$SUITE'. Known: sdk-live-contract, integration, smoke, fuzz."
              echo "Add a new suite to the case statement in .github/workflows/_platform.yml."
              exit 1
              ;;
          esac

      # Not for fuzz: the API log of a fuzz run quotes the requests and the
      # failures, and this job's log is public.
      - name: Backend log (on failure)
        if: ${{ !inputs.skip && failure() && inputs.suite != 'fuzz' }}
        run: tail -n 200 backend.log

name: Lint

# One fast job: everything that reads the tree without running it.
#   ruff check / ruff format --check   backend/ modules/ scripts/ tests/acceptance/
#                                      (replaces black + isort + flake8)
#   lint-imports                       the core/modules import boundary ([tool.importlinter]
#                                      in pyproject.toml, backend/lambda/.importlinter)
#   reuse lint                         every file carries a licence (REUSE.toml, LICENSES/)
#   check_requirements_lock.py         backend/requirements/runtime.lock matches runtime.txt,
#                                      and the requirements files share their pins
#   check_legacy_name.py               the former name only where the keep-list keeps it
#   eslint + tsc                       frontend/
#   hadolint                           the four Dockerfiles
#   actionlint                         .github/workflows
#
# Locally the same checks are `make lint`.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Keyed on the pull request NUMBER, not head_ref: two forks' `patch-1`
  # branches share a head_ref and would cancel each other's runs (#75).
  group: lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  RUFF_VERSION: '0.16.10'
  IMPORT_LINTER_VERSION: '2.15'
  REUSE_VERSION: '6.2.0'
  HADOLINT_VERSION: '2.15.1'
  ACTIONLINT_VERSION: '1.7.12'

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install ruff, import-linter, reuse
        run: pip install "ruff==${RUFF_VERSION}" "import-linter==${IMPORT_LINTER_VERSION}" "reuse==${REUSE_VERSION}"

      # Configuration lives in [tool.ruff] in pyproject.toml; the docs-journey
      # runner adds one rule of its own in tests/acceptance/docs/ruff.toml.
      - name: ruff check
        run: ruff check backend/ modules/ scripts/ tests/acceptance/ --output-format=github

      - name: ruff format --check
        run: ruff format --check backend/ modules/ scripts/ tests/acceptance/

      # The core/modules boundary, statically: backend.app / backend.lambda
      # never import modules; backend.app never imports backend.tests, sdk,
      # demo or infrastructure. Contracts in pyproject.toml ([tool.importlinter])
      # and backend/lambda/.importlinter (the Lambda functions are their own
      # roots).
      - name: lint-imports
        run: |
          lint-imports
          cd backend/lambda && lint-imports

      # REUSE 3.3: every file is covered by REUSE.toml (Apache-2.0 everywhere,
      # sdk/ MIT) and the licence texts in LICENSES/ match. The root LICENSE is
      # canonical; its copy under LICENSES/ must be byte-identical.
      - name: reuse lint
        run: |
          reuse lint
          cmp LICENSE LICENSES/Apache-2.0.txt \
            || { echo "::error::LICENSES/Apache-2.0.txt has drifted from LICENSE"; exit 1; }

      # backend/Dockerfile installs the hashed lock; a pin bumped in runtime.txt
      # without `make lock` would otherwise ship the old version.
      - name: requirements lock is current
        run: python scripts/check_requirements_lock.py

      # The project's former name, only where scripts/legacy_name_keep.toml
      # keeps it (an identifier a machine matches, or history), with each
      # entry's count pinned.
      - name: former name only where kept
        run: python scripts/check_legacy_name.py

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # `npm run lint` runs eslint over frontend/src and modules/frontend/src
      # (the modules' dashboard code, resolved through the `@modules/*`
      # alias); flat config in frontend/eslint.config.mjs.
      - name: eslint
        run: cd frontend && npm run lint

      - name: tsc --noEmit
        run: cd frontend && npx tsc --noEmit

      - name: Install hadolint
        run: |
          curl -fsSL -o /usr/local/bin/hadolint \
            "https://github.com/hadolint/hadolint/releases/download/v${HADOLINT_VERSION}/hadolint-Linux-x86_64"
          chmod +x /usr/local/bin/hadolint

      # Rule exclusions and their reasons live in .hadolint.yaml.
      - name: hadolint
        run: |
          hadolint backend/Dockerfile frontend/Dockerfile \
                   demo/shoplab/Dockerfile demo/streampulse/Dockerfile

      - name: Install actionlint
        run: |
          curl -fsSL -o /tmp/actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar -xzf /tmp/actionlint.tar.gz -C /usr/local/bin actionlint
          chmod +x /usr/local/bin/actionlint

      # actionlint's own checks (expressions, action inputs, runner labels) are
      # all on. Its embedded shellcheck runs with five codes off, because every
      # current hit is deliberate:
      #   SC2086 — unquoted "$VAR" in the AWS deploy scripts (values are ids)
      #   SC2034 — `for i in $(seq 1 60)` readiness loops ignore the counter
      #   SC2015 — `a && b || c` used as a one-line report-and-continue
      #   SC2046 — intentional word splitting of a command substitution
      #   SC2251 — `! cmd` used to invert a check inside a `run:` block
      # Syntax errors and every other shellcheck finding still fail the job.
      - name: actionlint
        env:
          SHELLCHECK_OPTS: '-e SC2086 -e SC2034 -e SC2015 -e SC2046 -e SC2251'
        run: actionlint -color

name: Dependabot lock refresh

# Dependabot can update `backend/requirements.txt` and
# `backend/requirements/runtime.txt`, but it cannot regenerate
# `backend/requirements/runtime.lock` -- that file is `uv pip compile
# --generate-hashes` output. So every bump of any package in runtime.txt
# arrives red and stays red: `scripts/check_requirements_lock.py` fails the
# `lint` job, and `test_requirements_consistency.py` fails `Unit Tests` for the
# same reason. See #185.
#
# This regenerates the lock on those branches and pushes the result.
#
# WHY NOT `pull_request`: a workflow triggered by Dependabot gets a READ-ONLY
# GITHUB_TOKEN, so it could not push. `pull_request_target` would get a write
# token, but it is the classic privilege-escalation shape -- a write token plus
# a checkout of branch content. Triggering on schedule/dispatch instead means
# the token is an ordinary write token and the workflow definition always comes
# from the default branch, which is easier to reason about.
#
# WHAT IT WILL NOT DO: run anything from the pull request's branch. `make lock`
# would execute the branch's Makefile, so the uv invocations below are spelled
# out here instead and must be kept in step with the `lock-runtime` and
# `lock-modules` targets. The uv version is READ from the Makefile rather than
# copied, because a second copy of a pinned version is the drift this
# repository keeps being bitten by.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'A single PR number. Leave empty to do every eligible open Dependabot PR.'
        required: false
        type: string
  schedule:
    # A few hours after Dependabot's own windows, so it has opened its PRs.
    - cron: '0 9 * * 1-5'

permissions:
  contents: write
  pull-requests: write
  # To approve the workflow runs this job's own push creates. A push by
  # GITHUB_TOKEN onto a Dependabot branch leaves every triggered run in
  # `action_required`, so without this the lock is fixed and the pull request
  # reports no checks at all -- strictly worse than before, since the required
  # checks then have nothing to report. Measured on run 35560607155: four pull
  # requests pushed, 31 runs left awaiting approval.
  actions: write

concurrency:
  group: dependabot-lock-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Regenerate the locks on Dependabot branches
    runs-on: ubuntu-latest
    if: github.repository_id == '1367480368'
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      # Read, not duplicated: the Makefile is the single source of the pin.
      - name: Install uv at the version the Makefile pins
        run: |
          set -euo pipefail
          UV_VERSION=$(sed -n 's/^UV_VERSION := //p' Makefile | head -1)
          if [ -z "$UV_VERSION" ]; then
            echo "::error::could not read UV_VERSION from the Makefile"
            exit 1
          fi
          echo "uv version from Makefile: $UV_VERSION"
          python -m pip install --quiet "uv==$UV_VERSION"
          uv --version

      # Keep a copy of the default branch's checker out of reach of the branch
      # checkout below. It is copied BACK OVER scripts/ after each checkout
      # rather than run from /tmp: the script resolves the repository root as
      # `Path(__file__).resolve().parents[1]`, so running it from /tmp makes it
      # look for /tmp/backend/requirements/... and report every file missing.
      # Overwriting the branch's copy gets both properties at once -- trusted
      # code, and a root that resolves -- and it is restored before anything is
      # committed.
      - name: Stash the default branch's checker
        run: |
          set -euo pipefail
          mkdir -p /tmp/trusted
          cp scripts/check_requirements_lock.py /tmp/trusted/

      - name: Find the pull requests that need it
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SINGLE: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "$SINGLE" ]; then
            echo "$SINGLE" > /tmp/prs.txt
          else
            # Open, authored by Dependabot, touching a file a lock is built from.
            gh pr list --state open --limit 100 \
              --json number,author,files \
              --jq '.[]
                    | select(.author.login == "app/dependabot")
                    | select(any(.files[].path;
                        . == "backend/requirements/runtime.txt"
                        or . == "modules/requirements.txt"))
                    | .number' > /tmp/prs.txt
          fi
          echo "candidates: $(tr '\n' ' ' < /tmp/prs.txt)"
          echo "count=$(wc -l < /tmp/prs.txt | tr -d ' ')" >> "$GITHUB_OUTPUT"

      - name: Regenerate and push
        if: steps.find.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          : > /tmp/pushed.txt
          : > /tmp/skipped.txt
          : > /tmp/unresolved.txt
          : > /tmp/failed.txt

          while read -r PR; do
            [ -z "$PR" ] && continue
            echo "::group::PR #$PR"

            # One subshell per pull request, so a branch that cannot be
            # processed does not abort the whole run.
            #
            # `|| RC=$?`, not a bare subshell followed by `RC=$?`. GitHub runs
            # `run:` with `bash -e`, and `set -uo pipefail` here does NOT turn
            # that off -- so a bare subshell that exits non-zero kills the step
            # before the classification below is ever reached. That is what
            # happened on run 35560607155: four pull requests were pushed, then
            # #119 failed to resolve and #108 and #99 were never attempted. An
            # `|| ...` list is a tested context, where errexit does not fire.
            #
            # Exit codes: 0 pushed, 3 nothing to do, 4 dependencies do not
            # resolve, anything else an unexpected failure.
            RC=0
            (
              set -euo pipefail

              # Repeated per pull request: the listing filter does not see a
              # number passed to workflow_dispatch.
              AUTHOR=$(gh pr view "$PR" --json author --jq '.author.login')
              if [ "$AUTHOR" != "app/dependabot" ]; then
                echo "::warning::#$PR is authored by $AUTHOR, not Dependabot"
                exit 3
              fi

              gh pr checkout "$PR" --force

              # A branch older than the file it is meant to update cannot be
              # processed -- backend/requirements/runtime.txt did not always
              # exist, and some of these pull requests predate it.
              if [ ! -f backend/requirements/runtime.txt ]; then
                echo "#$PR: branch has no backend/requirements/runtime.txt; it predates the file. Comment @dependabot rebase on it."
                exit 3
              fi

              # uv invoked from HERE, never `make lock`: the Makefile on this
              # branch is pull-request content. These flags must match the
              # `lock-runtime` / `lock-modules` targets on the default branch.
              # A bump whose dependencies genuinely conflict cannot be
              # locked -- #119 wants pandas 3.0.5, which needs numpy >=2.3.3
              # against this tree's numpy 1.26.4. That is a fact about the pull
              # request, not a fault here, so it exits 4 and the run still
              # reports the rest.
              if ! uv pip compile backend/requirements/runtime.txt \
                --universal --generate-hashes --python-version 3.11 \
                --custom-compile-command "make lock" \
                -o backend/requirements/runtime.lock; then
                echo "#$PR: dependencies do not resolve"
                git checkout -- .
                exit 4
              fi
              if [ -f modules/requirements.txt ]; then
                if ! uv pip compile modules/requirements.txt \
                  --universal --generate-hashes --python-version 3.11 \
                  --constraint backend/requirements.txt \
                  --custom-compile-command "make lock" \
                  -o modules/requirements.lock; then
                  echo "#$PR: modules dependencies do not resolve"
                  git checkout -- .
                  exit 4
                fi
              fi

              CHANGED=$(git diff --name-only)
              if [ -z "$CHANGED" ]; then
                echo "#$PR: locks already current, nothing to push"
                exit 3
              fi

              # A regeneration that touched anything but a lock file means one
              # of the commands above did something unintended.
              UNEXPECTED=$(echo "$CHANGED" | grep -vE '^(backend/requirements/runtime\.lock|modules/requirements\.lock)$' || true)
              if [ -n "$UNEXPECTED" ]; then
                echo "::error::#$PR: regeneration touched unexpected files:"
                echo "$UNEXPECTED"
                git checkout -- .
                exit 1
              fi

              # The default branch's checker, run from inside the tree so its
              # `Path(__file__).resolve().parents[1]` root resolves to the
              # repository. Running it from /tmp made it look for
              # /tmp/backend/requirements/... and report every file missing.
              # Restored before anything is staged.
              cp /tmp/trusted/check_requirements_lock.py scripts/check_requirements_lock.py
              python scripts/check_requirements_lock.py
              git checkout -- scripts/check_requirements_lock.py

              git add backend/requirements/runtime.lock
              if [ -f modules/requirements.lock ]; then
                git add modules/requirements.lock
              fi
              git commit \
                -m "chore(deps): regenerate the requirements locks" \
                -m "Dependabot updates requirements.txt and runtime.txt but cannot regenerate runtime.lock, which is 'uv pip compile --generate-hashes' output, so the lock check fails lint and Unit Tests until this runs. See #185."
              git push

              {
                echo "Regenerated \`backend/requirements/runtime.lock\` (and \`modules/requirements.lock\` where present) to match this bump -- \`uv pip compile --generate-hashes\` output, which Dependabot cannot produce itself. Without it \`check_requirements_lock.py\` fails the \`lint\` job and \`test_requirements_consistency.py\` fails \`Unit Tests\`. See #185."
                echo
                echo "One consequence, measured rather than assumed: Dependabot stops managing a branch once someone else pushes to it, and \`@dependabot rebase\` is then ignored -- tried on #99 and #108, neither rebased. So if this pull request falls behind \`main\`, the way back is to close it and let Dependabot open a fresh one, which it will do with the same bump."
              } > /tmp/comment.md
              gh pr comment "$PR" --body-file /tmp/comment.md

              # Approve the runs the push just created.
              #
              # POLL, do not sleep once. The first version slept 15 seconds and
              # reported "approved 0" every time -- measured on #99, the push
              # landed at 05:03:02 and the runs appeared at 05:04, about a
              # minute later. So it always looked past them, and the pull
              # request sat with no checks at all until they were approved by
              # hand. Approving nothing after the full window is not an error:
              # some pushes trigger no runs needing approval.
              #
              # Kept polling across the whole window rather than stopping at
              # the first batch, because the runs do not all appear at once.
              # That costs about 2.5 minutes per pull request, deliberately:
              # this job runs once on a weekday morning, and the alternative --
              # exiting early and leaving half the runs queued -- is the bug
              # being fixed.
              BRANCH=$(git rev-parse --abbrev-ref HEAD)
              APPROVED=0
              for _ in $(seq 1 15); do
                sleep 10
                for ID in $(gh run list --branch "$BRANCH" --limit 40 \
                              --json databaseId,conclusion \
                              --jq '.[] | select(.conclusion == "action_required") | .databaseId'); do
                  if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$ID/approve" >/dev/null 2>&1; then
                    APPROVED=$((APPROVED + 1))
                  fi
                done
              done
              echo "#$PR: approved $APPROVED queued workflow run(s)"
            ) || RC=$?

            case "$RC" in
              0) echo "$PR" >> /tmp/pushed.txt;  echo "#$PR: regenerated and pushed" ;;
              3) echo "$PR" >> /tmp/skipped.txt; echo "#$PR: skipped" ;;
              4) echo "$PR" >> /tmp/unresolved.txt
                 echo "::warning::#$PR: dependencies do not resolve; the lock cannot be generated" ;;
              *) echo "$PR" >> /tmp/failed.txt;  echo "::error::#$PR: failed (exit $RC)" ;;
            esac
            echo "::endgroup::"
          done < /tmp/prs.txt

          {
            echo "### Dependabot lock refresh"
            echo
            echo "| outcome | pull requests |"
            echo "|---|---|"
            echo "| pushed  | $(tr '\n' ' ' < /tmp/pushed.txt) |"
            echo "| skipped | $(tr '\n' ' ' < /tmp/skipped.txt) |"
            echo "| will not resolve | $(tr '\n' ' ' < /tmp/unresolved.txt) |"
            echo "| failed  | $(tr '\n' ' ' < /tmp/failed.txt) |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ -s /tmp/failed.txt ]; then
            echo "::error::failed on: $(tr '\n' ' ' < /tmp/failed.txt)"
            exit 1
          fi

      - name: Nothing to do
        if: steps.find.outputs.count == '0'
        run: echo "No open Dependabot pull request touches a file a lock is built from."

name: Deploy
run-name: Deploy ${{ inputs.version }} (${{ inputs.profile }}) to ${{ inputs.environment }}${{ inputs.override_alarms && ' -- ALARMS OVERRIDDEN' || '' }}

# One path for every environment (DECISIONS D6): staging and prod are the same
# workflow with a different `environment`. Nothing here names either one
# outside the choice list below; every AWS name is built from the input, the
# way the CDK builds it (infrastructure/cdk/stacks/names.py), or read from a
# stack output.
#
# Shape, and why:
#
#   preflight  holds NO AWS credential and no environment secret. It checks
#              what can be checked from GitHub alone -- the dispatch ref, the
#              profile acknowledgement, that `version` is a release tag on
#              main, and that the Release Gate passed on its commit -- so a
#              wrong dispatch is refused before anyone is asked to approve it.
#   deploy     is the ONE job bound to `environment:`, so there is one approval
#              per deploy (each environment-bound job asks its own), and it is
#              given before anything in AWS changes. Its refusals come first,
#              then the first mutation (the image push).
#
# Tooling -- local actions and scripts/ -- always comes from the dispatch ref,
# which must be main. The release tag is checked out into ./release/ for the
# image build ONLY: a tag cut before a script or action existed would
# otherwise run without it, or with an older copy (PE v1 C6).
#
# Operator input never reaches a shell by `${{ }}` interpolation: Actions
# substitutes the expression textually before bash parses the line, and the
# deploy job holds the environment's AWS role. Everything reaches a script
# through `env:` (PE v1 C11; backend/tests/unit/infrastructure/
# test_deploy_workflows.py checks all three workflows).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        default: staging
        options: [staging, prod]
      version:
        description: 'Release tag to deploy, e.g. v1.2.3 (branch names and commit SHAs are refused)'
        required: true
        type: string
      profile:
        # The profile a deployment gets is a decision, not a default. The image
        # used to be built `--target core` with nothing saying so, which on this
        # layout means an image with no modules/ directory at all: the modules'
        # registration never runs, `hooks.audit_signer` stays `NullAuditSigner`,
        # and every SOC 2 / ISO 27001 compliance audit event is written with
        # hmac_signature = NULL -- which `NullAuditSigner.verify()` then reports
        # as intact. Nothing else signals it (`/health/ready` is a cheerful 200
        # with `profile: core`), so the choice is made here, in the open.
        description: 'Image profile to build and deploy (full = modules included, signed compliance audit log)'
        required: true
        type: choice
        default: full
        options: [full, core]
      accept_unsigned_audit_log:
        # Required for `core` and only for `core`; see the guard in preflight.
        # A tick-box is the cheapest way to make "unsigned" impossible to reach
        # by accident while keeping it reachable on purpose (a core-licensed
        # deployment that never wanted the modules).
        description: 'core only: I accept an UNSIGNED compliance audit log (no HMAC, verify() reports unsigned rows as intact)'
        required: false
        type: boolean
        default: false
      override_alarms:
        # The break-glass for fixing forward while the API's 5xx alarm is in
        # ALARM (#148, EM condition 4): CodeDeploy stops every deployment to
        # the group while one is, including a fix. This deployment ONLY is
        # created with the alarms overridden, so NOTHING watches it: no alarm
        # rolls it back. The next deploy is watched again with no action.
        # docs/deployment/rollback-runbook.md#fix-forward-while-an-alarm-is-firing
        # is the one place that explains when to use it. The run name says
        # "ALARMS OVERRIDDEN", so the environment's reviewer sees it at the
        # approval.
        description: 'Break-glass: deploy with the API alarms OVERRIDDEN. No alarm watches or rolls back this deployment. Read the runbook section "Fix forward while an alarm is firing" first.'
        required: false
        type: boolean
        default: false
      override_alarms_reason:
        description: 'Required with the alarm override, and only with it: why this deployment may go unwatched.'
        required: false
        type: string
        default: ''

# One deploy (or manual migration) per environment at a time. Not cancelled:
# a deploy stopped halfway has migrated a database and left a CodeDeploy
# deployment behind. GitHub keeps at most ONE pending run per group, so a
# newer dispatch that queues behind a running deploy REPLACES an older one
# that was still waiting -- docs/deployment/README.md says so.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # One region (docs/self-hosting/cdk.md deploys the stacks to the same one).
  AWS_REGION: us-west-2
  ECR_BACKEND_REPO: experimentation-platform/backend
  # The dashboard's image (#69). Created by hand like the backend's
  # (deployment guide section 1.3); the CDK imports both by name.
  ECR_DASHBOARD_REPO: experimentation-platform/web
  # How long the forward deploy waits for the API to serve the new revision:
  # the replacement tasks starting, the approval, the canary's fifteen minutes
  # (900 s) and the final shift. The 1500 s left beside the canary is the
  # allowance the deadline gave before the canary grew; three staging runs
  # used 165-188 s of it. infrastructure/tests/test_codedeploy_alarms.py pins
  # deadline - canary to 1500, so the two move together. It is a bound, not
  # an estimate. When it passes, the
  # run goes red and nothing is stopped (scripts/shift_traffic.py). The
  # deployment group's own approval wait is 30 minutes, so a deadline that
  # passes before the approval leaves CodeDeploy to stop an unapproved
  # deployment, which is harmless.
  CODEDEPLOY_DEADLINE_SECONDS: '2400'
  CODEDEPLOY_POLL_SECONDS: '10'
  # How long the deployment group keeps the old task set after the shift (its
  # termination_wait_time; infrastructure/tests/test_codedeploy_alarms.py
  # checks they agree). The summary's "alarms watch the API until about ..."
  # is the shift's time plus this. Not a wait: this run has ended by then.
  BAKE_MINUTES: '60'
  # Every other wait the deploy job can sit through, named so a unit test
  # (test_dashboard_deploy_wiring.py) sums them against timeout-minutes. Each
  # is a bound, not an estimate:
  #   the snapshot waiter, cut off by `timeout` so that its bound is this
  #   value and not whatever the runner's AWS CLI polls for;
  SNAPSHOT_DEADLINE_SECONDS: '1800'
  #   the migration task (scripts/run_migration_task.sh reads it; its own
  #   default is the same);
  MIGRATION_TIMEOUT_SECONDS: '1800'
  #   the dashboard's rolling deployment (scripts/ecs_rolling_rollout.sh's
  #   --deadline and --interval);
  DASHBOARD_ROLLOUT_DEADLINE_SECONDS: '1200'
  DASHBOARD_ROLLOUT_POLL_SECONDS: '15'
  #   each smoke test, the API's and the dashboard's: attempts, the pause
  #   between two, and curl's --max-time for one.
  SMOKE_ATTEMPTS: '5'
  SMOKE_SLEEP_SECONDS: '10'
  SMOKE_MAX_TIME_SECONDS: '15'

jobs:
  preflight:
    name: Preflight (no AWS credentials)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    outputs:
      sha: ${{ steps.tag.outputs.sha }}
    steps:
      - name: Refuse a dispatch from any ref but main
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (\"Use workflow from\"); you chose ${REF_NAME}. The release to deploy is the 'version' input."
            exit 1
          fi

      # Before anything else, and before any AWS credential is issued: the
      # profile decides whether this deployment signs its compliance audit log.
      - name: Confirm the deployment profile
        env:
          PROFILE: ${{ inputs.profile }}
          ACCEPTED: ${{ inputs.accept_unsigned_audit_log }}
        run: |
          set -euo pipefail
          echo "Requested profile: ${PROFILE}"
          UNSIGNED="profile=core builds an image with no modules/, so the compliance module never registers: every SOC 2 / ISO 27001 audit event is written with hmac_signature = NULL and NullAuditSigner.verify() reports those rows as intact."
          if [ "${PROFILE}" = "core" ] && [ "${ACCEPTED}" != "true" ]; then
            echo "::error::${UNSIGNED} Re-run with accept_unsigned_audit_log=true if that is what you want, or deploy profile=full."
            exit 1
          fi
          {
            echo "### Deployment profile: \`${PROFILE}\`"
            echo ""
            if [ "${PROFILE}" = "core" ]; then
              echo "Warning: ${UNSIGNED}"
              echo ""
              echo "Acknowledged by @${GITHUB_ACTOR}."
            else
              echo "Modules included; compliance audit events are HMAC-signed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${PROFILE}" = "core" ]; then
            echo "::warning::${UNSIGNED} Acknowledged by ${GITHUB_ACTOR}."
          fi

      # Before any AWS credential too: the break-glass (#148, EM condition 4).
      # Ticked, it needs a reason; a reason without the tick-box is refused as
      # well, because it reads as if the alarms were overridden when they are
      # not. The reason reaches the shell only through `env:`.
      - name: Confirm the alarm override
        env:
          OVERRIDE_ALARMS: ${{ inputs.override_alarms }}
          OVERRIDE_REASON: ${{ inputs.override_alarms_reason }}
        run: |
          set -euo pipefail
          reason="${OVERRIDE_REASON//[$'\r\n']/ }"
          trimmed="${reason//[[:space:]]/}"
          if [ "$OVERRIDE_ALARMS" = "true" ] && [ -z "$trimmed" ]; then
            echo "::error title=No reason for the alarm override::The alarm override was ticked with no reason. A deployment with its alarms overridden is watched by nothing, so it needs one. Nothing was deployed."
            exit 1
          fi
          if [ "$OVERRIDE_ALARMS" != "true" ] && [ -n "$trimmed" ]; then
            echo "::error title=A reason with no alarm override::A reason for overriding the alarms was given, but the override was not ticked. Tick it, or clear the reason. Nothing was deployed."
            exit 1
          fi
          if [ "$OVERRIDE_ALARMS" = "true" ]; then
            echo "::warning title=ALARMS OVERRIDDEN::This deployment will be created with the API's alarms overridden: no alarm watches it or rolls it back. Reason: ${reason}"
            {
              echo "### ALARMS OVERRIDDEN"
              echo ""
              echo "This deployment is created with the API's alarms overridden, so no alarm watches it and nothing rolls it back by itself. Requested by @${GITHUB_ACTOR}. Reason: ${reason}"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      # main, with its history and every tag: the ancestry check below needs
      # both. This is also the only checkout in this job, so the gate script
      # is main's.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The version is a release tag on main
        id: tag
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Printed back only with anything outside a tag's alphabet masked:
          # the value is operator-supplied and a workflow command is a line.
          shown="${VERSION//[^0-9A-Za-z._\/-]/?}"
          not_a_tag="'${shown}' is not a tag in this repository. Deploy a release tag (git tag --list 'v*'); branch names and commit SHAs are refused."
          if ! [[ "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::${not_a_tag}"
            exit 1
          fi
          if ! SHA="$(git rev-parse -q --verify "refs/tags/${VERSION}^{commit}")"; then
            echo "::error::${not_a_tag}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$SHA" HEAD; then
            echo "::error::${VERSION} (${SHA:0:7}) is not on main. Only a release cut from main can be deployed."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "${VERSION} is ${SHA}, on main"

      - name: The Release Gate passed on that commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ steps.tag.outputs.sha }}
          VERSION: ${{ inputs.version }}
        run: bash scripts/verify_release_gate.sh "$REPO" "$SHA" "$VERSION"

  deploy:
    name: Deploy ${{ inputs.version }} to ${{ inputs.environment }}
    needs: preflight
    runs-on: ubuntu-latest
    # The named waits above add up to about 125 minutes before two cold image
    # builds; the budget test states their allowance.
    timeout-minutes: 160
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ inputs.environment }}
      VERSION: ${{ inputs.version }}
      PROFILE: ${{ inputs.profile }}
      RELEASE_SHA: ${{ needs.preflight.outputs.sha }}
      # The CDK's names (stacks/names.py, fargate_service_stack.py);
      # infrastructure/tests/test_workflow_names_exist.py checks each one
      # against a synth of that environment.
      ECS_CLUSTER: experimentation-${{ inputs.environment }}
      ECS_BACKEND_SERVICE: experimentation-backend-${{ inputs.environment }}
      ECS_BACKEND_TASK_FAMILY: experimentation-backend-${{ inputs.environment }}
      # The dashboard's rolling-update service and its task-definition family
      # (stacks/dashboard_service.py). They spell the same and are two things.
      ECS_DASHBOARD_SERVICE: experimentation-dashboard-${{ inputs.environment }}
      ECS_DASHBOARD_TASK_FAMILY: experimentation-dashboard-${{ inputs.environment }}
      MIGRATE_TASK_FAMILY: experimentation-migrate-${{ inputs.environment }}
      MIGRATE_LOG_GROUP: /ecs/experimentation-migrate-${{ inputs.environment }}
      CODEDEPLOY_APPLICATION: experimentation-platform-${{ inputs.environment }}
      CODEDEPLOY_DEPLOYMENT_GROUP: experimentation-${{ inputs.environment }}
      # The deployment group's two 5xx alarms, one per target group (#148;
      # stacks/names.py api_5xx_alarm_name). The pre-flight reads their
      # state (scripts/refuse_alarm_active.py); this workflow never changes
      # them.
      API_ALARM_BLUE: experimentation-api-5xx-blue-${{ inputs.environment }}
      API_ALARM_GREEN: experimentation-api-5xx-green-${{ inputs.environment }}
      # The deployment config the Fargate stack gives the deployment group
      # (#212, D47). Every forward deployment uses the group's own config; the
      # before-build pre-flight warns if the group's differs from this
      # (scripts/refuse_alarm_active.py --expect-config, #795).
      # infrastructure/tests/test_codedeploy_alarms.py pins it to the synth.
      CODEDEPLOY_DEPLOYMENT_CONFIG: CodeDeployDefault.ECSCanary10Percent15Minutes
      FARGATE_STACK: experimentation-fargate-${{ inputs.environment }}
      DATABASE_STACK: experimentation-database-${{ inputs.environment }}
      SECRETS_PREFIX: /${{ inputs.environment }}/experimentation
      # 'true' or 'false', never the token. A step's `if:` cannot read
      # `secrets`, so the Slack steps read this: without the secret they are
      # skipped, and the last step says so once in the run summary. A token
      # that is set but wrong still turns its step red (continue-on-error).
      SLACK_ON: ${{ secrets.SLACK_BOT_TOKEN != '' }}
    steps:
      # FIRST, and the only place the account ID is read (PE v1 C9). It is an
      # environment SECRET, never a variable: a step's log header prints its
      # evaluated `env:` before the step runs, so a variable's value would be
      # public before anything could mask it, while a secret is masked from
      # the start of the job. Environment-scoped values are not visible to a
      # job-level `if:`, so the old job-level `if:` on the account ID skipped
      # every job green for an environment configured the recommended way --
      # a deploy that did nothing and said nothing. An unconfigured
      # environment is a red run.
      - name: Refuse an environment that is not configured
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ROLE_ARN_SET: ${{ secrets.AWS_ROLE_ARN != '' }}
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error title=Not configured::secrets.AWS_ACCOUNT_ID is not set for the '${TARGET_ENV}' environment, so nothing was deployed. Set it as an environment secret under Settings → Environments → ${TARGET_ENV} → Environment secrets (gh secret set AWS_ACCOUNT_ID --env ${TARGET_ENV}); a variable of that name is not read. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Not configured::secrets.AWS_ACCOUNT_ID for the '${TARGET_ENV}' environment is not a 12-digit AWS account id, so nothing was deployed. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          if [ "$ROLE_ARN_SET" != "true" ]; then
            echo "::error title=Not configured::secrets.AWS_ROLE_ARN is not set for the '${TARGET_ENV}' environment, so nothing was deployed. Set it under Settings → Environments → ${TARGET_ENV} → Secrets. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          if [ -z "$PUBLIC_BASE_URL" ]; then
            echo "::error title=Not configured::vars.PUBLIC_BASE_URL is not set for the '${TARGET_ENV}' environment, so this deploy could not be smoke-tested; nothing was deployed. Set it to the origin the stacks were deployed with (PUBLIC_BASE_URL). See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          echo "EXPECTED_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      # The tooling: this workflow's scripts/ and .github/actions/, from main.
      - name: Check out the deploy tooling (main)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The release, for the image build only. By the commit preflight
      # resolved and gated, not by the tag name, which could have been moved
      # since.
      - name: Check out the release into ./release
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.sha }}
          path: release
          persist-credentials: false

      - name: The release checkout is the commit the gate passed
        run: |
          set -euo pipefail
          actual="$(git -C release rev-parse HEAD)"
          if [ "$actual" != "$RELEASE_SHA" ]; then
            echo "::error::./release is at $actual, but preflight gated $RELEASE_SHA for ${VERSION}. Nothing was deployed."
            exit 1
          fi

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # timeout-minutes x 60 <= this <= the role's MaxSessionDuration (10800);
          # test_aws_session_duration.py. The default, 3600, expires mid-job.
          role-duration-seconds: 9600
          # The ASSUMED account, which the wrong-account check below may find
          # is not the configured one; the configured one is a secret already.
          mask-aws-account-id: true

      # DECISIONS D7: each environment is its own account. A role ARN pasted
      # into the wrong environment would otherwise deploy staging into prod.
      # Neither account ID is printed: the log is public.
      - name: Refuse the wrong AWS account
        id: account
        run: |
          set -euo pipefail
          actual="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error title=Wrong AWS account::environment=${TARGET_ENV}: the assumed role is not in the account in this environment's AWS_ACCOUNT_ID secret. Check that its AWS_ROLE_ARN secret names a role in that account. Nothing has been built or changed."
            exit 1
          fi
          echo "the assumed role is in the account in the AWS_ACCOUNT_ID secret; region $AWS_REGION"

      - name: Refuse when the stacks are not deployed here
        run: |
          set -euo pipefail
          active="$(aws ecs describe-clusters --clusters "$ECS_CLUSTER" \
                      --query "clusters[?status=='ACTIVE'].clusterName" --output text)"
          if [ "$active" != "$ECS_CLUSTER" ]; then
            echo "::error::No ECS cluster ${ECS_CLUSTER} in ${AWS_REGION} of this environment's account. Run ENVIRONMENT=${TARGET_ENV} cdk deploy --all in this account and region first: docs/self-hosting/cdk.md"
            exit 1
          fi

      # Where the migration task runs (the API's subnets and security group,
      # the one admitted to Aurora) and which cluster to snapshot. The CDK
      # generates these; the stacks publish them.
      - name: Read the Fargate stack's outputs
        id: fargate
        uses: ./.github/actions/stack-outputs
        with:
          stack: ${{ env.FARGATE_STACK }}
          keys: TaskSubnets TaskSecurityGroup
          environment: ${{ inputs.environment }}

      - name: Read the database stack's outputs
        id: database
        uses: ./.github/actions/stack-outputs
        with:
          stack: ${{ env.DATABASE_STACK }}
          keys: ClusterIdentifier
          environment: ${{ inputs.environment }}

      # A full image under a core task definition cannot boot: the core stacks
      # inject no AUDIT_HMAC_KEY, and the modules refuse to register without
      # it -- found twenty minutes into a CodeDeploy deployment. The reverse
      # boots, but runs a stack deployed for signed audit logs without them.
      # Read-only; both families.
      - name: Refuse a profile the stacks were not deployed for
        run: |
          set -euo pipefail
          for family in "$ECS_BACKEND_TASK_FAMILY" "$MIGRATE_TASK_FAMILY"; do
            if ! secrets="$(aws ecs describe-task-definition --task-definition "$family" \
                  --query "taskDefinition.containerDefinitions[?name=='backend'].secrets[].name" \
                  --output text)"; then
              echo "::error::No task definition family ${family} in ${AWS_REGION}. Run ENVIRONMENT=${TARGET_ENV} cdk deploy --all in this account and region first: docs/self-hosting/cdk.md"
              exit 1
            fi
            if [ "$PROFILE" = "full" ] && ! grep -qw AUDIT_HMAC_KEY <<<"$secrets"; then
              echo "::error::profile=full, but task definition ${family} injects no AUDIT_HMAC_KEY: the stacks were deployed as core. Deploy profile=core, or redeploy the stacks from a full checkout."
              exit 1
            fi
            if [ "$PROFILE" = "core" ] && grep -qw AUDIT_HMAC_KEY <<<"$secrets"; then
              echo "::error::profile=core, but task definition ${family} injects AUDIT_HMAC_KEY: the stacks were deployed as full. Deploy profile=full, or redeploy the stacks from a core checkout."
              exit 1
            fi
          done
          echo "both task definition families were deployed for profile=${PROFILE}"

      # The API image builds its list of trusted proxies at start-up, and on
      # AWS the load balancer is on none of the task's own networks: only the
      # API family's FORWARDED_ALLOW_IPS (the VPC's range, set by `cdk deploy`
      # of the Fargate stack) puts it on that list. The registration below
      # copies the family's newest revision, so a stack last deployed from an
      # older checkout is refused here, read-only, before anything is built.
      # A release whose entrypoint still passes the old fixed list is not
      # checked (a notice says so). The same script reads the registered
      # revision back before the CodeDeploy deployment, below. Never in
      # rollback.yml: a rollback target from before the change needs nothing.
      - name: Refuse an API task definition family without FORWARDED_ALLOW_IPS
        run: |
          set -euo pipefail
          python3 -I -S scripts/refuse_api_revision_without_forwarded_allow_ips.py \
            --family "$ECS_BACKEND_TASK_FAMILY" \
            --release release \
            --environment "$TARGET_ENV" \
            --fargate-stack "$FARGATE_STACK"

      # The task definitions inject these (infrastructure/cdk/stacks/
      # fargate_service_stack.py, migration_task_stack.py), and the image ships
      # no .env file: they are the only way the container gets a real value for
      # a setting whose default the production settings classes REFUSE. A
      # missing one is not a degraded deployment, it is a container that exits
      # before uvicorn binds.
      #
      # Checked by the reference ECS will use, not by name (#636): each
      # family's newest revision is what register_task_definition.sh copies,
      # and its secrets[].valueFrom is what ECS hands to GetSecretValue. A
      # partial ARN (one that stops at the name) is refused before any
      # Secrets Manager call; every other reference is described by its
      # complete ARN. Only secret NAMES are printed: a reference carries the
      # account ID, and the script masks every one before printing anything.
      # The profile's secrets (jwt-secret and first-superuser-password, plus
      # audit-hmac-key on full) must be referenced by both app families. No
      # db-password: the database credentials are the secret the database
      # stack generated for Aurora (#78), checked here like any other
      # reference. No Redis secret: the API task takes REDIS_HOST/REDIS_PORT
      # from the Redis stack (#147).
      - name: Every secret the task definitions reference exists
        run: |
          set -euo pipefail
          python3 scripts/check_task_secrets.py \
            --secrets-prefix "$SECRETS_PREFIX" \
            --profile "$PROFILE" \
            --region "$AWS_REGION" \
            --app-family "$ECS_BACKEND_TASK_FAMILY" \
            --app-family "$MIGRATE_TASK_FAMILY" \
            --family "$ECS_DASHBOARD_TASK_FAMILY"

      # Nothing in the CDK creates these repositories -- the stacks import them
      # by name -- so each is created once per account by hand (deployment
      # guide, section 1.3). Named here in seconds rather than as a `docker
      # push` failure.
      - name: ECR repositories exist
        run: |
          set -euo pipefail
          for repo in "$ECR_BACKEND_REPO" "$ECR_DASHBOARD_REPO"; do
            if ! aws ecr describe-repositories \
                  --repository-names "${repo}" >/dev/null 2>&1; then
              echo "::error::the ECR repository ${repo} does not exist in ${AWS_REGION}. Nothing in the CDK creates it; create it once per account and region -- docs/deployment/deployment-guide.md section 1.3."
              exit 1
            fi
          done

      # A successful deploy's CodeDeploy deployment stays active for an hour
      # after its traffic shift, while the group keeps the old task set: that
      # hour is Rollback's window. CodeDeploy refuses a second deployment
      # meanwhile, so without this a deploy inside the hour would build,
      # snapshot and migrate, then fail at create-deployment. Refused here,
      # read-only, naming the deployment and roughly how long it has left.
      # Never stopped: stopping a shifted deployment rolls back a success
      # (PE v2 C7).
      - name: Refuse while an earlier deployment is still active
        run: python3 scripts/refuse_active_deployment.py "$CODEDEPLOY_APPLICATION" "$CODEDEPLOY_DEPLOYMENT_GROUP"

      # CodeDeploy stops every deployment to the API's group while one of its
      # 5xx alarms is in ALARM, and this workflow creates the deployment only
      # after the snapshot and the migration (#148 PR-3, #297). So it asks
      # first, read-only: the alarm names from the deployment group (what
      # CodeDeploy will poll), then their states. Refused on ALARM, naming the
      # alarm; refused whatever the break-glass says when the group watches no
      # alarm, has its alarms disabled or does not watch both of the stack's.
      # INSUFFICIENT_DATA passes. With the break-glass ticked, an alarm in
      # ALARM is a warning and the deploy goes on unwatched. Advisory: an
      # alarm that fires after this passes still stops the deployment after
      # the migration, which is why it runs again just before the snapshot.
      # This run also compares the group's deployment config with the
      # stack's and warns, never refuses, on a difference (#795). Only this
      # run passes --expect-config, so the warning shows once.
      - name: Refuse while an API alarm is firing (before the build)
        env:
          OVERRIDE_ALARMS: ${{ inputs.override_alarms }}
        run: |
          set -euo pipefail
          overridden=()
          if [ "$OVERRIDE_ALARMS" = "true" ]; then overridden=(--alarms-overridden); fi
          python3 scripts/refuse_alarm_active.py --stage before-build \
            --application "$CODEDEPLOY_APPLICATION" --group "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --environment "$TARGET_ENV" --expect "$API_ALARM_BLUE" --expect "$API_ALARM_GREEN" \
            --expect-config "$CODEDEPLOY_DEPLOYMENT_CONFIG" \
            ${overridden[@]+"${overridden[@]}"}

      # For the rollback line in the summary: the revision serving BEFORE this
      # deploy. The PRIMARY task set, not services[0].taskDefinition, which on
      # a CODE_DEPLOY service is frozen at CreateService.
      - name: Record what is serving now
        id: previous
        run: |
          set -euo pipefail
          serving="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" \
                       --query "services[0].taskSets[?status=='PRIMARY'].taskDefinition | [0]" --output text)"
          case "$serving" in None|null) serving="" ;; esac
          echo "arn=$serving" >> "$GITHUB_OUTPUT"
          shown="${serving##*/}"
          echo "serving now: ${shown:-nothing (first deploy)}"

      # The dashboard (#69), read-only, before anything changes. Refuses a
      # service that is missing (stacks before v0.4.0), not on the ECS rolling
      # controller, wanting no tasks or mid-rollout, and a family without
      # exactly one `dashboard` container. Records its PRIMARY deployment's
      # revision (the rollout's --expect-primary later) and, only when that
      # revision runs a release (a digest), the value the summary's rollback
      # line carries -- by the predicate rollback.yml accepts it by. Warns when
      # the image is neither a release nor the bootstrap placeholder.
      - name: Refuse a dashboard that cannot be rolled out, and record what it serves
        id: previous-dashboard
        run: |
          set -euo pipefail
          python3 scripts/dashboard_revision.py serving --refuse-unsteady \
            --cluster "$ECS_CLUSTER" --service "$ECS_DASHBOARD_SERVICE" \
            --family "$ECS_DASHBOARD_TASK_FAMILY" --github-output "$GITHUB_OUTPUT"

      - name: Notify deployment started
        if: env.SLACK_ON == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: '#deployments'
          slack-message: |
            *${{ inputs.environment }} deployment starting${{ inputs.override_alarms && ' -- ALARMS OVERRIDDEN, unwatched' || '' }}*
            Version: `${{ inputs.version }}`
            Profile: `${{ inputs.profile }}`${{ inputs.profile == 'core' && ' (warning: unsigned compliance audit log)' || '' }}
            Triggered by: ${{ github.actor }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      # ---- Everything above only reads. Everything below changes AWS. ----

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # The UTC date, passed to the two image builds below as OS_PACKAGES_REFRESHED:
      # a new date re-runs the Dockerfiles' OS package upgrade layer even when
      # the build cache holds an older copy of it (see backend/Dockerfile).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # One tag per release and profile, `:<tag>-<profile>`, pushed once. No
      # `:latest` and no bare `:<tag>`: both used to be pushed on every build,
      # so a staging build of the core profile moved the tag prod's next
      # scale-out would pull (#71, #138). If the tag already exists in this
      # account's repository -- a repeat deploy of the same release here --
      # its image is reused, not rebuilt. Staging and prod are meant to be
      # separate accounts (D7, "Refuse the wrong AWS account" above), each
      # with its own ECR, so prod builds the release itself from the tag: the same
      # tag, commit and profile (check_labels below refuses an image whose
      # labels name another commit or profile), not the digest staging ran.
      # Either way what the task definitions name is the DIGEST.
      - name: Build and push the image once, and resolve its digest
        id: image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          OS_PACKAGES_REFRESHED: ${{ steps.os-packages.outputs.date }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${VERSION}-${PROFILE}"
          REF="$ECR_REGISTRY/$ECR_BACKEND_REPO:$IMAGE_TAG"
          # What the log prints: the registry host names the account.
          SHOWN="$ECR_BACKEND_REPO:$IMAGE_TAG"
          # The commit actually checked out, never the dispatch ref: the image
          # labels itself with it (org.opencontainers.image.revision, #70).
          RELEASE_COMMIT="$(git -C release rev-parse HEAD)"

          check_labels() {
            local image="$1" built revision
            built="$(docker inspect --format '{{index .Config.Labels "io.experimently.profile"}}' "$image")"
            revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            if [ "$built" != "$PROFILE" ]; then
              echo "::error::requested profile '$PROFILE' but ${image#*/} is labelled '$built'"
              exit 1
            fi
            if [ "$revision" != "$RELEASE_COMMIT" ]; then
              echo "::error::${image#*/} is labelled revision '$revision', but ${VERSION} is $RELEASE_COMMIT"
              exit 1
            fi
          }

          digest=""
          if found="$(aws ecr describe-images --repository-name "$ECR_BACKEND_REPO" \
                        --image-ids imageTag="$IMAGE_TAG" \
                        --query 'imageDetails[0].imageDigest' --output text 2>&1)"; then
            digest="$found"
          else
            case "$found" in
              *ImageNotFoundException*) ;;
              *)
                found="$(sed -E 's/(^|[^0-9A-Za-z])[0-9]{12}([^0-9A-Za-z]|$)/\1<account>\2/g' <<<"$found")"
                echo "::error::could not look up $SHOWN: $found"; exit 1 ;;
            esac
          fi

          if [ -n "$digest" ]; then
            echo "$SHOWN already exists ($digest): reusing it"
            docker pull "$ECR_REGISTRY/$ECR_BACKEND_REPO@$digest"
            check_labels "$ECR_REGISTRY/$ECR_BACKEND_REPO@$digest"
            reused=true
          else
            # Build context is the release's repository root (the code imports
            # backend.app.*). VERSION is what the image labels itself with
            # (org.opencontainers.image.version).
            docker build \
              --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --build-arg GIT_COMMIT="$RELEASE_COMMIT" \
              --build-arg VERSION="${VERSION#v}" \
              --build-arg OS_PACKAGES_REFRESHED="$OS_PACKAGES_REFRESHED" \
              --target "$PROFILE" \
              -t "$REF" \
              -f release/backend/Dockerfile \
              release
            check_labels "$REF"
            docker push "$REF"
            digest="$(aws ecr describe-images --repository-name "$ECR_BACKEND_REPO" \
                        --image-ids imageTag="$IMAGE_TAG" \
                        --query 'imageDetails[0].imageDigest' --output text)"
            reused=false
          fi

          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve a digest for $SHOWN (got '$digest')"
            exit 1
          fi
          {
            echo "image=$ECR_REGISTRY/$ECR_BACKEND_REPO@$digest"
            echo "digest=$digest"
            echo "tag=$IMAGE_TAG"
            echo "reused=$reused"
          } >> "$GITHUB_OUTPUT"
          echo "image: $ECR_BACKEND_REPO@$digest (tag $IMAGE_TAG, commit $RELEASE_COMMIT)"

      # The dashboard's image, by the same rules, and also BEFORE the snapshot
      # and the migration: a frontend that does not compile leaves nothing
      # migrated. The profile is a build-arg (frontend/Dockerfile has no stage
      # named after it), and the label check refuses an image of another
      # profile or commit. The image's API base is empty (NEXT_PUBLIC_API_URL
      # is ""), so one image serves any origin (D14).
      - name: Build and push the dashboard image once, and resolve its digest
        id: web-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          OS_PACKAGES_REFRESHED: ${{ steps.os-packages.outputs.date }}
        run: |
          set -euo pipefail
          IMAGE_TAG="${VERSION}-${PROFILE}"
          REF="$ECR_REGISTRY/$ECR_DASHBOARD_REPO:$IMAGE_TAG"
          # What the log prints: the registry host names the account.
          SHOWN="$ECR_DASHBOARD_REPO:$IMAGE_TAG"
          RELEASE_COMMIT="$(git -C release rev-parse HEAD)"

          check_labels() {
            local image="$1" built revision
            built="$(docker inspect --format '{{index .Config.Labels "io.experimently.profile"}}' "$image")"
            revision="$(docker inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image")"
            if [ "$built" != "$PROFILE" ]; then
              echo "::error::requested profile '$PROFILE' but ${image#*/} is labelled '$built'"
              exit 1
            fi
            if [ "$revision" != "$RELEASE_COMMIT" ]; then
              echo "::error::${image#*/} is labelled revision '$revision', but ${VERSION} is $RELEASE_COMMIT"
              exit 1
            fi
          }

          digest=""
          if found="$(aws ecr describe-images --repository-name "$ECR_DASHBOARD_REPO" \
                        --image-ids imageTag="$IMAGE_TAG" \
                        --query 'imageDetails[0].imageDigest' --output text 2>&1)"; then
            digest="$found"
          else
            case "$found" in
              *ImageNotFoundException*) ;;
              *)
                found="$(sed -E 's/(^|[^0-9A-Za-z])[0-9]{12}([^0-9A-Za-z]|$)/\1<account>\2/g' <<<"$found")"
                echo "::error::could not look up $SHOWN: $found"; exit 1 ;;
            esac
          fi

          if [ -n "$digest" ]; then
            echo "$SHOWN already exists ($digest): reusing it"
            docker pull "$ECR_REGISTRY/$ECR_DASHBOARD_REPO@$digest"
            check_labels "$ECR_REGISTRY/$ECR_DASHBOARD_REPO@$digest"
            reused=true
          else
            # The build context is the release's repository root: the
            # Dockerfile copies frontend/ and, for full, modules/frontend/.
            docker build \
              --build-arg BUILD_DATE="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
              --build-arg GIT_COMMIT="$RELEASE_COMMIT" \
              --build-arg VERSION="${VERSION#v}" \
              --build-arg EXPERIMENTLY_PROFILE="$PROFILE" \
              --build-arg OS_PACKAGES_REFRESHED="$OS_PACKAGES_REFRESHED" \
              -t "$REF" \
              -f release/frontend/Dockerfile \
              release
            check_labels "$REF"
            docker push "$REF"
            digest="$(aws ecr describe-images --repository-name "$ECR_DASHBOARD_REPO" \
                        --image-ids imageTag="$IMAGE_TAG" \
                        --query 'imageDetails[0].imageDigest' --output text)"
            reused=false
          fi

          if ! [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::could not resolve a digest for $SHOWN (got '$digest')"
            exit 1
          fi
          {
            echo "image=$ECR_REGISTRY/$ECR_DASHBOARD_REPO@$digest"
            echo "digest=$digest"
            echo "tag=$IMAGE_TAG"
            echo "reused=$reused"
          } >> "$GITHUB_OUTPUT"
          echo "dashboard image: $ECR_DASHBOARD_REPO@$digest (tag $IMAGE_TAG, commit $RELEASE_COMMIT)"

      # The same check again, immediately before the snapshot and the
      # migration it exists to protect (PE condition 11): the build above
      # takes minutes, and an alarm can go into ALARM meanwhile.
      - name: Refuse while an API alarm is firing (before the migration)
        env:
          OVERRIDE_ALARMS: ${{ inputs.override_alarms }}
        run: |
          set -euo pipefail
          overridden=()
          if [ "$OVERRIDE_ALARMS" = "true" ]; then overridden=(--alarms-overridden); fi
          python3 scripts/refuse_alarm_active.py --stage before-migration \
            --application "$CODEDEPLOY_APPLICATION" --group "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --environment "$TARGET_ENV" --expect "$API_ALARM_BLUE" --expect "$API_ALARM_GREEN" \
            ${overridden[@]+"${overridden[@]}"}

      # Always, before the migration. The check this replaces compared the
      # CLI's `None` (its text for an empty result) with "NONE", so it never
      # took a snapshot when there was no backup (QA SILENT 5). A snapshot per
      # deploy is cheap and is what the rollback runbook restores from.
      - name: Snapshot the database before migrating
        id: snapshot
        env:
          DB_CLUSTER: ${{ fromJSON(steps.database.outputs.json).ClusterIdentifier }}
        run: |
          set -euo pipefail
          # Letters, digits and single hyphens; starts with a letter; <= 63.
          id="pre-deploy-${TARGET_ENV}-${VERSION}-$(date -u +%Y%m%d-%H%M%S)"
          id="$(tr -c 'A-Za-z0-9\n' '-' <<<"$id" | tr -s '-' | cut -c1-63)"
          id="${id%-}"
          aws rds create-db-cluster-snapshot \
            --db-cluster-identifier "$DB_CLUSTER" \
            --db-cluster-snapshot-identifier "$id" >/dev/null
          timeout "$SNAPSHOT_DEADLINE_SECONDS" \
            aws rds wait db-cluster-snapshot-available --db-cluster-snapshot-identifier "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "snapshot $id of $DB_CLUSTER is available"

      # A revision of this environment's migration family naming THIS image,
      # run by its ARN (#138, QA 1c). The CloudFormation-registered revision
      # names the CDK's `bootstrap` image and is never what runs.
      - name: Register the migration task definition with this image
        id: migrate-td
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          arn="$(bash scripts/register_task_definition.sh "$MIGRATE_TASK_FAMILY" "$IMAGE")"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      # `backend.app.db.bootstrap`, not raw `alembic upgrade heads`: the
      # historical chain cannot be replayed from an empty database, and a
      # first deploy meets exactly that. It stays an override (the family's
      # own command is the same) so a family registered by an older `cdk
      # deploy` still runs this release's command.
      - name: Run the migration
        id: migrate
        env:
          TASK_DEFINITION: ${{ steps.migrate-td.outputs.arn }}
          SUBNETS: ${{ fromJSON(steps.fargate.outputs.json).TaskSubnets }}
          SECURITY_GROUP: ${{ fromJSON(steps.fargate.outputs.json).TaskSecurityGroup }}
        run: |
          set -euo pipefail
          network="$(jq -cn --arg subnets "$SUBNETS" --arg sg "$SECURITY_GROUP" \
            '{awsvpcConfiguration: {subnets: ($subnets | split(",")), securityGroups: [$sg], assignPublicIp: "DISABLED"}}')"
          overrides='{"containerOverrides":[{"name":"backend","command":["python","-m","backend.app.db.bootstrap"]}]}'
          bash scripts/run_migration_task.sh "$ECS_CLUSTER" "$TASK_DEFINITION" "$network" "$overrides" "$MIGRATE_LOG_GROUP"

      - name: Register the API task definition with this image
        id: api-td
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          set -euo pipefail
          arn="$(bash scripts/register_task_definition.sh "$ECS_BACKEND_TASK_FAMILY" "$IMAGE")"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      # The API tasks must not run migrations on start (#298): the migration
      # above is the only schema writer, and a task that bootstraps refuses a
      # database a newer release migrated. The revision just registered was
      # copied from the family's newest one, which lacks RUN_MIGRATIONS=false
      # when the Fargate stack was last deployed from an older checkout. This
      # reads back what ECS stored for the ARN and refuses before
      # CodeDeploy is asked for anything. No `if:`: a failure here ends the
      # job before the step that creates the deployment.
      - name: Refuse an API revision that would run migrations on start
        id: api-td-check
        env:
          TASK_DEFINITION: ${{ steps.api-td.outputs.arn }}
        run: |
          set -euo pipefail
          python3 scripts/refuse_migrating_api_revision.py \
            --task-definition "$TASK_DEFINITION" \
            --environment "$TARGET_ENV" \
            --fargate-stack "$FARGATE_STACK"

      # The family check before the build, read back on what ECS stored for
      # the registered ARN: the newest revision can change between the two (a
      # `cdk deploy` meanwhile). Same rules, same release check. No `if:`: a
      # refusal ends the job before the next step creates the deployment.
      - name: Refuse an API revision without FORWARDED_ALLOW_IPS
        id: api-td-proxy-check
        env:
          TASK_DEFINITION: ${{ steps.api-td.outputs.arn }}
        run: |
          set -euo pipefail
          python3 -I -S scripts/refuse_api_revision_without_forwarded_allow_ips.py \
            --task-definition "$TASK_DEFINITION" \
            --release release \
            --environment "$TARGET_ENV" \
            --fargate-stack "$FARGATE_STACK"

      # The deployment group's 5xx alarms watch this deployment (#148), unless
      # the break-glass input is set: then, and only then, THIS deployment is
      # created with the alarms overridden. The override is on this one
      # CreateDeployment call and changes nothing about the group, so the next
      # deploy is watched again. It is the only place deploy.yml passes it.
      # The value is the same JSON as rollback.yml's, with an explicit
      # `alarms` list (#777): the shorthand `enabled=false` was measured to
      # send no `alarms` key, which CodeDeploy refused on staging.
      - name: Create the CodeDeploy deployment (blue/green)
        id: codedeploy
        env:
          TASK_DEFINITION: ${{ steps.api-td.outputs.arn }}
          OVERRIDE_ALARMS: ${{ inputs.override_alarms }}
        run: |
          set -euo pipefail
          override=()
          if [ "$OVERRIDE_ALARMS" = "true" ]; then
            override=(--override-alarm-configuration '{"enabled":false,"ignorePollAlarmFailure":false,"alarms":[]}')
            echo "::warning title=ALARMS OVERRIDDEN::deployment created with the API's alarms overridden: no alarm watches it or rolls it back"
          fi
          appspec="$(jq -cn --arg td "$TASK_DEFINITION" '{
            version: 1,
            Resources: [{
              TargetService: {
                Type: "AWS::ECS::Service",
                Properties: {
                  TaskDefinition: $td,
                  LoadBalancerInfo: { ContainerName: "backend", ContainerPort: 8000 }
                }
              }
            }]
          }')"
          id="$(aws deploy create-deployment \
            --application-name "$CODEDEPLOY_APPLICATION" \
            --deployment-group-name "$CODEDEPLOY_DEPLOYMENT_GROUP" \
            --description "deploy ${VERSION} (${PROFILE})" \
            ${override[@]+"${override[@]}"} \
            --revision "$(jq -cn --arg c "$appspec" '{revisionType: "AppSpecContent", appSpecContent: {content: $c}}')" \
            --query deploymentId --output text)"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "CodeDeploy deployment: $id"

      # Approve the shift and wait for the API to serve this revision (#143).
      # scripts/shift_traffic.py is rollback.yml's polling loop: on Ready it
      # checks every target in the replacement target group is healthy
      # (count == desired), then sends continue-deployment READY_WAIT once;
      # Failed/Stopped end it; Baking is not terminal. Success is
      # scripts/api_serving.py: the PRIMARY task set is this ARN AND
      # check_live_target_group.py confirms the /api/* rule forwards to that
      # task set's target group. It never stops a deployment.
      #
      # The deployment group's 5xx alarms (one per target group, #148) watch
      # this deployment: while either is in ALARM, CodeDeploy stops it and
      # rolls it back by itself. The script reports that as `result=alarm`
      # and never advises Rollback for it. The alarms watch target 5xx only,
      # so a release that answers wrongly with a 2xx still reaches 100%, and
      # after this step succeeds they keep watching for the hour CodeDeploy
      # keeps the old task set (BAKE_MINUTES), when this run has ended.
      #
      # `id: api-serving` is stable: later steps read its outputs, and its
      # success is what "the API is serving this run's revision" means. On
      # success it also writes `shifted_at` and `bake_end`.
      - name: Shift traffic and confirm the API serves this revision
        id: api-serving
        env:
          # The step runs for about 18 minutes; unbuffered, its progress lines
          # appear as they happen instead of all at once when it exits.
          PYTHONUNBUFFERED: '1'
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.id }}
          TASK_DEFINITION: ${{ steps.api-td.outputs.arn }}
        run: |
          set -euo pipefail
          python3 scripts/shift_traffic.py \
            --deployment-id "$DEPLOYMENT_ID" \
            --cluster "$ECS_CLUSTER" \
            --service "$ECS_BACKEND_SERVICE" \
            --task-definition "$TASK_DEFINITION" \
            --deadline-seconds "$CODEDEPLOY_DEADLINE_SECONDS" \
            --interval-seconds "$CODEDEPLOY_POLL_SECONDS" \
            --bake-minutes "$BAKE_MINUTES" \
            --alarm "$API_ALARM_BLUE" \
            --alarm "$API_ALARM_GREEN"

      # A real request, not a probe: /health answers 200 whatever the routes
      # do, and the ALB already used it to pass the tasks. Through the public
      # origin (vars.PUBLIC_BASE_URL), never the ALB's DNS name, which
      # TrustedHost rejects (D14). No package is installed on this host: it
      # holds the environment's AWS role.
      - name: Smoke test through the public URL
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.id }}
          OVERRIDE_ALARMS: ${{ inputs.override_alarms }}
        run: |
          set -euo pipefail
          if [ -z "$PUBLIC_BASE_URL" ]; then
            echo "::error title=No smoke test::vars.PUBLIC_BASE_URL is empty for the '${TARGET_ENV}' environment, so there is nothing to smoke-test."
            exit 1
          fi
          # The trailing slash: without it the API answers 307 to the slashed
          # path, which says nothing about the release.
          url="${PUBLIC_BASE_URL%/}/api/v1/experiments/"
          expected='{"detail":"Not authenticated"}'
          code="" body=""
          for attempt in $(seq 1 "$SMOKE_ATTEMPTS"); do
            code="$(curl -sS -o smoke-body.txt -w '%{http_code}' --max-time "$SMOKE_MAX_TIME_SECONDS" "$url")" || true
            body="$(cat smoke-body.txt 2>/dev/null || true)"
            if [ "$code" = "401" ] && [ "$body" = "$expected" ]; then
              echo "smoke: GET $url -> 401 $body"
              exit 0
            fi
            echo "attempt $attempt: HTTP ${code:-none}, body ${body:0:200}"
            sleep "$SMOKE_SLEEP_SECONDS"
          done
          if [ "$OVERRIDE_ALARMS" = "true" ]; then
            after="The smoke test rolls nothing back, and no alarm watches this deployment (its alarms were overridden): use the rollback line in this run's summary."
          else
            after="The smoke test rolls nothing back. The API's alarms may, while CodeDeploy deployment ${DEPLOYMENT_ID} is active: if the API is already back, read docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back; otherwise use the rollback line in this run's summary."
          fi
          echo "::error title=Smoke test failed::GET $url answered HTTP ${code:-none} with '${body:0:200}'; expected 401 $expected. The dashboard was not rolled out. ${after}"
          exit 1

      # ---- The dashboard (#69): only once the API is serving and answering. ----
      # This order leaves "new API, old dashboard" for the minutes of the
      # rollout. The other order would leave a new dashboard calling routes an
      # old API may not have.

      # The CDK owns the task definition's shape; this run owns its image. The
      # third argument is the container the dashboard's family names.
      - name: Register the dashboard task definition with this image
        id: dashboard-td
        env:
          IMAGE: ${{ steps.web-image.outputs.image }}
        run: |
          set -euo pipefail
          arn="$(bash scripts/register_task_definition.sh "$ECS_DASHBOARD_TASK_FAMILY" "$IMAGE" dashboard)"
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      # The race guard and the mutation are ONE step, so no `if:` can run one
      # without the other:
      #   (a) scripts/api_serving.py, the one "the API is serving this ARN"
      #       predicate, must still say the API is serving THIS run's
      #       revision. A Rollback run started since the smoke test would
      #       otherwise leave an old API behind a new dashboard, and green;
      #   (b) the rollout script refuses, before update-service, unless the
      #       dashboard's PRIMARY is still the revision recorded before
      #       anything changed (--expect-primary, always passed).
      # The rollout's verdict comes from the PRIMARY deployment, never from
      # `aws ecs wait services-stable`, which calls a circuit-breaker
      # rollback stable (scripts/ecs_rolling_rollout.sh).
      - name: Roll the dashboard out, if the API is still serving this revision
        id: dashboard-rollout
        env:
          API_TD_ARN: ${{ steps.api-td.outputs.arn }}
          DASHBOARD_TD: ${{ steps.dashboard-td.outputs.arn }}
          PREVIOUS_DASHBOARD_TD: ${{ steps.previous-dashboard.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.id }}
        run: |
          set -euo pipefail
          if api="$(python3 scripts/api_serving.py "$ECS_CLUSTER" "$ECS_BACKEND_SERVICE" "$API_TD_ARN" 2>&1)"; then
            echo "$api"
            echo "api_guard=0" >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo "$api"
            last="$(tail -n 1 <<<"$api")"
            {
              echo "api_guard=$code"
              echo "api_line=${last//$'\r'/ }"
            } >> "$GITHUB_OUTPUT"
            case "$code" in
              1) why="the API is not serving ${API_TD_ARN##*/}: another revision is PRIMARY, or a traffic shift is in progress (the line above says which)" ;;
              3) why="the API's route and its tasks disagree: ${API_TD_ARN##*/} is the PRIMARY task set but the /api/* rule forwards to the other group (the line above)" ;;
              *) why="could not tell whether the API is serving ${API_TD_ARN##*/}: an AWS call failed or the check crashed (exit $code; the line above)" ;;
            esac
            echo "::error title=Dashboard not rolled out::${why}. The dashboard was not changed: it is still on ${PREVIOUS_DASHBOARD_TD##*/}. If CodeDeploy stopped deployment ${DEPLOYMENT_ID} for an alarm, read docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back."
            exit 1
          fi
          if bash scripts/ecs_rolling_rollout.sh \
               --expect-primary "$PREVIOUS_DASHBOARD_TD" \
               --interval "$DASHBOARD_ROLLOUT_POLL_SECONDS" \
               --deadline "$DASHBOARD_ROLLOUT_DEADLINE_SECONDS" \
               "$ECS_CLUSTER" "$ECS_DASHBOARD_SERVICE" "$DASHBOARD_TD" >dashboard-rollout.txt; then
            cat dashboard-rollout.txt
            echo "outcome=completed" >> "$GITHUB_OUTPUT"
          else
            code=$?
            cat dashboard-rollout.txt
            verdict="$(grep -o '::error title=[^:]*::' dashboard-rollout.txt)" || verdict=""
            case "$verdict" in
              *"rolled back by ECS"*) outcome="rolled back by ECS's circuit breaker; serving ${PREVIOUS_DASHBOARD_TD##*/}" ;;
              *"changed during this run"*) outcome="changed by another run" ;;
              *"did not finish"*) outcome="did not finish in ${DASHBOARD_ROLLOUT_DEADLINE_SECONDS}s" ;;
              *"cannot update"*) outcome="not started: permission denied" ;;
              *) outcome="failed (exit $code; the step's error says why)" ;;
            esac
            echo "outcome=$outcome" >> "$GITHUB_OUTPUT"
            exit "$code"
          fi

      # ECS says the new revision is PRIMARY and complete; this says the load
      # balancer's default action reaches it, through the public origin.
      - name: Smoke test the dashboard through the public URL
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          DASHBOARD_TD: ${{ steps.dashboard-td.outputs.arn }}
        run: |
          set -euo pipefail
          url="${PUBLIC_BASE_URL%/}/"
          code="" type=""
          for attempt in $(seq 1 "$SMOKE_ATTEMPTS"); do
            if ! got="$(curl -sS -o dashboard-body.html -w '%{http_code} %{content_type}' --max-time "$SMOKE_MAX_TIME_SECONDS" "$url")"; then
              got="none"
            fi
            code="${got%% *}"
            type="${got#"$code"}"
            type="${type# }"
            if [ "$code" = "200" ] && [[ "$type" == text/html* ]]; then
              echo "dashboard smoke: GET $url -> 200 $type"
              exit 0
            fi
            echo "attempt $attempt: HTTP ${code:-none} (${type:-no content type})"
            sleep "$SMOKE_SLEEP_SECONDS"
          done
          echo "::error title=Dashboard smoke test failed::GET $url answered HTTP ${code:-none} (${type:-no content type}); expected 200 with the dashboard page. ECS reports ${DASHBOARD_TD##*/} serving, so the load balancer's default action may not reach it: check the HTTPS listener of ${FARGATE_STACK}. Nothing rolls the dashboard back by itself: the alarms watch the API only. The rollback line in this run's summary puts back the API and the dashboard; for the dashboard alone, docs/deployment/rollback-runbook.md Method 2."
          exit 1

      # The LAST assertion before the job can succeed: the API check again,
      # after the dashboard rolled and answered. A Rollback run that stopped
      # this run's CodeDeploy deployment between the check above and
      # update-service would otherwise end green, an old API behind the new
      # dashboard. Nothing may come after this step but reporting.
      - name: The API is still serving this revision
        id: api-recheck
        env:
          API_TD_ARN: ${{ steps.api-td.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.id }}
        run: |
          set -euo pipefail
          if api="$(python3 scripts/api_serving.py "$ECS_CLUSTER" "$ECS_BACKEND_SERVICE" "$API_TD_ARN" 2>&1)"; then
            echo "$api"
            echo "api=0" >> "$GITHUB_OUTPUT"
          else
            code=$?
            echo "$api"
            last="$(tail -n 1 <<<"$api")"
            {
              echo "api=$code"
              echo "api_line=${last//$'\r'/ }"
            } >> "$GITHUB_OUTPUT"
            case "$code" in
              1) why="the API is not serving ${API_TD_ARN##*/}: another revision is PRIMARY, or a traffic shift is in progress (the line above says which)" ;;
              3) why="the API's route and its tasks disagree: ${API_TD_ARN##*/} is the PRIMARY task set but the /api/* rule forwards to the other group (the line above)" ;;
              *) why="could not tell whether the API is serving ${API_TD_ARN##*/}: an AWS call failed or the check crashed (exit $code; the line above)" ;;
            esac
            echo "::error title=API changed after the dashboard rolled out::After the dashboard rolled out, ${why}. The dashboard is on this run's revision. Check both before anything else: python3 scripts/api_serving.py ${ECS_CLUSTER} ${ECS_BACKEND_SERVICE} ${API_TD_ARN##*/}. If CodeDeploy stopped deployment ${DEPLOYMENT_ID} for an alarm, read docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back."
            exit 1
          fi

      # Two cases, told apart by whether the shift was approved: "the previous
      # revision is still serving" is true only if it was not (PE B3b C3).
      - name: If the migration was applied and the shift was never approved
        if: failure() && steps.migrate.outcome == 'success' && steps.api-serving.outputs.approved != 'true' && steps.api-serving.outcome != 'success'
        env:
          PREVIOUS: ${{ steps.previous.outputs.arn }}
          PREVIOUS_DASHBOARD: ${{ steps.previous-dashboard.outputs.arn }}
        run: |
          previous="${PREVIOUS##*/}"
          previous_dashboard="${PREVIOUS_DASHBOARD##*/}"
          echo "::warning title=Migrated, not deployed::The migration was applied; the deployment then failed before any traffic shifted. The database is at ${VERSION}'s heads; ${previous:-the previous revision} is still serving, and the dashboard is unchanged (${previous_dashboard:-not read}). The API does not migrate on start: ${previous:-the previous revision} serves the migrated schema as it is, and a task of it that starts from now on (a replacement, a scale-out) starts against it only if its revision sets RUN_MIGRATIONS=false; one that does not runs migrations on start and refuses a newer schema (docs/deployment/rollback-runbook.md#the-rolled-back-api-runs-against-the-current-schema). This is safe only if the migration is backward-compatible (docs/deployment/deployment-guide.md#backward-compatible-migrations)."

      # Not when an alarm stopped the deployment (#148 PE condition 7): then
      # CodeDeploy is moving the API back by itself, and "use the rollback
      # line" would be a second rollback. The alarm step below says what
      # happened, the migration included. The warning above is kept for the
      # alarm case: an alarm before the approval leaves exactly its state.
      - name: If the migration was applied and the shift was approved
        if: failure() && steps.migrate.outcome == 'success' && steps.api-serving.outputs.approved == 'true' && steps.api-serving.outcome != 'success' && steps.api-serving.outputs.result != 'alarm'
        env:
          NEW_REVISION: ${{ steps.api-td.outputs.arn }}
        run: |
          echo "::warning title=Migrated, shift approved, run failed::The migration was applied and the traffic shift was approved, so ${NEW_REVISION##*/} may be serving some or all traffic. Check with: python3 scripts/api_serving.py ${ECS_CLUSTER} ${ECS_BACKEND_SERVICE} ${NEW_REVISION##*/} (exit 0 = serving). If this release is bad, use the rollback line in this run's summary. A rollback does not undo the migration: the previous revision then runs against this schema as it is, which is safe only if the migration is backward-compatible (docs/deployment/rollback-runbook.md#the-rolled-back-api-runs-against-the-current-schema)."

      # CodeDeploy stopped this run's deployment for an alarm (#148 UX W2).
      # Read-only: whether the revision serving before this run is serving
      # again, by the one predicate (scripts/api_serving.py), on each of its
      # exits (PE condition 6). Nothing here advises Rollback: after an alarm,
      # CodeDeploy's own rollback is doing that, and Rollback refuses while it
      # is active. Exclusive with the approved warning above (it excludes
      # `alarm`) and with step (i) (which needs the shift step to succeed).
      - name: If an alarm rolled the API back
        id: alarm
        if: failure() && steps.api-serving.outputs.result == 'alarm'
        env:
          PREVIOUS: ${{ steps.previous.outputs.arn }}
          PREVIOUS_DASHBOARD: ${{ steps.previous-dashboard.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.id }}
          ALARMS: ${{ steps.api-serving.outputs.alarms }}
          APPROVED: ${{ steps.api-serving.outputs.approved }}
          MIGRATION: ${{ steps.migrate.outcome }}
        run: |
          set -euo pipefail
          alarm="${ALARMS:-}"
          if [ -z "$alarm" ]; then
            alarm="one of the deployment group alarms (${API_ALARM_BLUE}, ${API_ALARM_GREEN})"
          fi
          migration=""
          if [ "$MIGRATION" = success ]; then
            migration=" The migration stays applied: the database is at ${VERSION}'s heads, and the API tasks do not migrate on start, so the revision serving now runs against that schema as it is. That is safe only if the migration is backward-compatible (docs/deployment/rollback-runbook.md#the-rolled-back-api-runs-against-the-current-schema)."
          fi
          previous_dashboard="${PREVIOUS_DASHBOARD##*/}"
          dashboard="The dashboard was not changed: it is on ${previous_dashboard:-the revision it was on (not read)}."
          next="Next: docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back"
          previous="${PREVIOUS##*/}"
          if [ "$APPROVED" != "true" ]; then
            echo "api_back=nothing shifted" >> "$GITHUB_OUTPUT"
            echo "::error title=Stopped by an alarm::${alarm} was in ALARM before ${VERSION}'s traffic shift, so CodeDeploy stopped deployment ${DEPLOYMENT_ID} and nothing shifted: ${previous:-the previous revision} keeps serving. ${dashboard}${migration} Every deployment to this group is stopped while an alarm is in ALARM: docs/deployment/rollback-runbook.md#fix-forward-while-an-alarm-is-firing"
            exit 0
          fi
          if [ -z "$PREVIOUS" ]; then
            echo "api_back=nothing to go back to" >> "$GITHUB_OUTPUT"
            echo "::error title=Rolled back by an alarm::${alarm} fired during the traffic shift of ${VERSION}, and CodeDeploy stopped deployment ${DEPLOYMENT_ID}. No revision was serving before this run, so there is nothing for it to go back to. ${dashboard}${migration} ${next}"
            exit 0
          fi
          serving=0
          line="$(python3 scripts/api_serving.py "$ECS_CLUSTER" "$ECS_BACKEND_SERVICE" "$PREVIOUS" 2>&1)" || serving=$?
          echo "$line"
          line="$(tail -n 1 <<<"$line")"
          case "$serving" in
            0)
              echo "api_back=confirmed" >> "$GITHUB_OUTPUT"
              echo "::error title=Rolled back by an alarm::${alarm} fired during the traffic shift of ${VERSION}. CodeDeploy put the API back: ${PREVIOUS##*/} is serving (checked just now). ${dashboard}${migration} The API is already back, so the rollback line is not needed. Do not redeploy ${VERSION}: it will meet the same alarm. ${next}"
              ;;
            1)
              echo "api_back=not confirmed yet" >> "$GITHUB_OUTPUT"
              echo "::error title=Rolled back by an alarm::${alarm} fired during the traffic shift of ${VERSION}, and CodeDeploy is putting the API back to ${PREVIOUS##*/}, which is not confirmed serving yet (${line}). ${dashboard}${migration} Watch it: aws deploy get-deployment --deployment-id ${DEPLOYMENT_ID}, then python3 scripts/api_serving.py ${ECS_CLUSTER} ${ECS_BACKEND_SERVICE} ${PREVIOUS##*/} (exit 0 = back). Do not redeploy ${VERSION}. ${next}"
              ;;
            3)
              echo "api_back=route disagrees" >> "$GITHUB_OUTPUT"
              echo "::error title=Rolled back by an alarm; the API route disagrees::${alarm} fired during the traffic shift of ${VERSION}, and CodeDeploy stopped deployment ${DEPLOYMENT_ID}. ${PREVIOUS##*/} is the PRIMARY task set again, but the /api/* rule forwards to the other target group (${line}). Read docs/deployment/deployment-guide.md#the-api-route-and-the-primary-task-set-disagree before anything else. ${dashboard}${migration}"
              ;;
            *)
              echo "api_back=could not tell" >> "$GITHUB_OUTPUT"
              echo "::error title=Rolled back by an alarm::${alarm} fired during the traffic shift of ${VERSION}, and CodeDeploy stopped deployment ${DEPLOYMENT_ID}. Whether ${PREVIOUS##*/} is serving again could not be told (exit ${serving}: ${line}). Check it: python3 scripts/api_serving.py ${ECS_CLUSTER} ${ECS_BACKEND_SERVICE} ${PREVIOUS##*/} (exit 0 = back). ${dashboard}${migration} ${next}"
              ;;
          esac

      # The API's shift succeeded and something after it failed: the API
      # smoke, the dashboard's registration, rollout or smoke, or an API check.
      # "The API is serving" is said only when the API check before the
      # rollout passed and the one after did not fail. Exclusive with the two
      # warnings above, which require the shift step to have failed.
      - name: If the API was deployed and the dashboard was not
        id: after-shift
        if: failure() && steps.api-serving.outcome == 'success'
        env:
          NEW_REVISION: ${{ steps.api-td.outputs.arn }}
          PREVIOUS: ${{ steps.previous.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.id }}
          PREVIOUS_DASHBOARD: ${{ steps.previous-dashboard.outputs.arn }}
          GUARD: ${{ steps.dashboard-rollout.outputs.api_guard }}
          GUARD_LINE: ${{ steps.dashboard-rollout.outputs.api_line }}
          RECHECK: ${{ steps.api-recheck.outputs.api }}
          RECHECK_LINE: ${{ steps.api-recheck.outputs.api_line }}
          ROLLOUT: ${{ steps.dashboard-rollout.outputs.outcome }}
        run: |
          set -euo pipefail
          code="" line=""
          if [ -n "$RECHECK" ] && [ "$RECHECK" != 0 ]; then
            code="$RECHECK" line="$RECHECK_LINE"
          elif [ -n "$GUARD" ] && [ "$GUARD" != 0 ]; then
            code="$GUARD" line="$GUARD_LINE"
          fi
          case "$code" in
            "")
              if [ "$GUARD" = 0 ]; then
                api="The API is serving ${VERSION} (${NEW_REVISION##*/})."
              else
                api="The API's traffic shift to ${NEW_REVISION##*/} completed; the run failed before it checked the API again."
              fi ;;
            1|3) api="The API is no longer serving this run's revision ${NEW_REVISION##*/}: ${line}" ;;
            *) api="Whether the API is still serving ${NEW_REVISION##*/} could not be told: ${line}" ;;
          esac
          case "$ROLLOUT" in
            "") dashboard="The dashboard was not changed: it is still on ${PREVIOUS_DASHBOARD##*/}." ;;
            completed) dashboard="The dashboard is on this run's revision." ;;
            *) dashboard="The dashboard's rollout: ${ROLLOUT}." ;;
          esac
          # When an API check failed, whether an alarm is why (#148 PE
          # condition 7): an alarm in the hour after the shift stops the
          # deployment and CodeDeploy moves the API back by itself. Then the
          # deployment is Stopped, so a re-run is not refused for the hour,
          # and the rollback line would be a second rollback: neither is said.
          # Read-only; a failed read is "not an alarm", i.e. the copy below.
          error_code=""
          if [ -n "$code" ] && [ -n "$DEPLOYMENT_ID" ]; then
            error_code="$(aws deploy get-deployment --deployment-id "$DEPLOYMENT_ID" \
                            --query 'deploymentInfo.errorInformation.code' --output text 2>/dev/null)" || error_code=""
          fi
          if [ "$error_code" = ALARM_ACTIVE ]; then
            echo "alarm=true" >> "$GITHUB_OUTPUT"
            previous="${PREVIOUS##*/}"
            echo "::error title=API rolled back by an alarm, dashboard not::CodeDeploy stopped deployment ${DEPLOYMENT_ID} for an alarm (ALARM_ACTIVE) after its traffic shift, and its auto-rollback moves the API back to ${previous:-the revision serving before this run} by itself. ${api} ${dashboard} There is nothing to roll back for the API. If the dashboard is on this run's revision, put it back to match the API with docs/deployment/rollback-runbook.md Method 2 (the dashboard block), using \"Dashboard serving before this run\" from this run's summary. Next: docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back"
            exit 0
          fi
          echo "::error title=API deployed, dashboard not confirmed::${api} ${dashboard} Deploy refuses a re-run until CodeDeploy deployment ${DEPLOYMENT_ID} is no longer active (about an hour after its traffic shift). The rollback line in this run's summary puts back the API as well as the dashboard. To put back or retry the dashboard alone inside that hour, use docs/deployment/rollback-runbook.md Method 2."

      - name: Run summary
        id: summary
        if: always()
        env:
          RELEASE_COMMIT: ${{ needs.preflight.outputs.sha }}
          IMAGE: ${{ steps.image.outputs.image }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          REUSED: ${{ steps.image.outputs.reused }}
          SNAPSHOT: ${{ steps.snapshot.outputs.id }}
          MIGRATION: ${{ steps.migrate.outcome }}
          NEW_REVISION: ${{ steps.api-td.outputs.arn }}
          DEPLOYMENT_ID: ${{ steps.codedeploy.outputs.id }}
          SHIFT_RESULT: ${{ steps.api-serving.outputs.result }}
          LIVE_GROUP: ${{ steps.api-serving.outputs.live_target_group }}
          PREVIOUS: ${{ steps.previous.outputs.arn }}
          DASHBOARD_IMAGE: ${{ steps.web-image.outputs.image }}
          DASHBOARD_TAG: ${{ steps.web-image.outputs.tag }}
          DASHBOARD_REUSED: ${{ steps.web-image.outputs.reused }}
          DASHBOARD_DIGEST: ${{ steps.web-image.outputs.digest }}
          NEW_DASHBOARD: ${{ steps.dashboard-td.outputs.arn }}
          PREVIOUS_DASHBOARD: ${{ steps.previous-dashboard.outputs.arn }}
          PREVIOUS_DASHBOARD_IMAGE: ${{ steps.previous-dashboard.outputs.image }}
          PREVIOUS_DASHBOARD_RELEASE: ${{ steps.previous-dashboard.outputs.release_arn }}
          PREVIOUS_DASHBOARD_DIGEST: ${{ steps.previous-dashboard.outputs.digest }}
          ROLLOUT: ${{ steps.dashboard-rollout.outputs.outcome }}
          GUARD: ${{ steps.dashboard-rollout.outputs.api_guard }}
          GUARD_LINE: ${{ steps.dashboard-rollout.outputs.api_line }}
          RECHECK: ${{ steps.api-recheck.outputs.api }}
          RECHECK_LINE: ${{ steps.api-recheck.outputs.api_line }}
          DASHBOARD_TD_OUTCOME: ${{ steps.dashboard-td.outcome }}
          APPROVED: ${{ steps.api-serving.outputs.approved }}
          ALARMS: ${{ steps.api-serving.outputs.alarms }}
          ALARM_BACK: ${{ steps.alarm.outputs.api_back }}
          ALARM_AFTER_SHIFT: ${{ steps.after-shift.outputs.alarm }}
          SHIFTED_AT: ${{ steps.api-serving.outputs.shifted_at }}
          BAKE_END: ${{ steps.api-serving.outputs.bake_end }}
          OVERRIDE_ALARMS: ${{ inputs.override_alarms }}
          OVERRIDE_REASON: ${{ inputs.override_alarms_reason }}
          JOB_STATUS: ${{ job.status }}
          ACCOUNT_CHECK: ${{ steps.account.outcome }}
        run: |
          # Not `$([ "$REUSED" = true ] && echo ...)`: under the runner's `bash
          # -e`, that substitution's status 1 on a fresh build ended this step
          # before it wrote a line, and failed a deploy that had succeeded.
          # Printed without the registry host (<account>.dkr.ecr...): the
          # summary is public. The account ID is never printed; the account
          # row says only whether the check against the secret passed.
          image="${IMAGE#*/}"
          image_line="${image:-not built}"
          if [ -n "$IMAGE_TAG" ]; then
            reused_note=""
            if [ "$REUSED" = true ]; then reused_note=", reused"; fi
            image_line="${image_line} (tag ${IMAGE_TAG}${reused_note})"
          fi
          dashboard_image="${DASHBOARD_IMAGE#*/}"
          dashboard_image_line="${dashboard_image:-not built}"
          if [ -n "$DASHBOARD_TAG" ]; then
            reused_note=""
            if [ "$DASHBOARD_REUSED" = true ]; then reused_note=", reused"; fi
            dashboard_image_line="${dashboard_image_line} (tag ${DASHBOARD_TAG}${reused_note})"
          fi
          # Exactly one of the W4 cells.
          if [ -n "$ROLLOUT" ]; then
            rollout_cell="$ROLLOUT"
          elif [ -n "$GUARD" ] && [ "$GUARD" != 0 ]; then
            rollout_cell="not started: the API check before it failed (exit ${GUARD})"
          elif [ "$DASHBOARD_TD_OUTCOME" = failure ]; then
            rollout_cell="not started: the dashboard task definition was not registered"
          else
            rollout_cell="not started: the run stopped before it"
          fi
          # "API changed" only for exits 1 and 3: 2 is "could not tell".
          api_changed=""
          for pair in "${GUARD}|${GUARD_LINE}" "${RECHECK}|${RECHECK_LINE}"; do
            case "${pair%%|*}" in
              1|3) api_changed="${pair#*|}" ;;
            esac
          done
          # The dashboard's rollback value: only a release (the digest predicate
          # rollback.yml accepts by, scripts/dashboard_revision.py).
          dashboard_param=""
          if [ -n "$PREVIOUS_DASHBOARD_RELEASE" ]; then
            dashboard_param=", dashboard_task_definition_arn=${PREVIOUS_DASHBOARD_RELEASE##*/}"
          fi
          # The digest the dashboard is running now, for the next cdk deploy.
          running=""
          case "$ROLLOUT" in
            completed) running="$DASHBOARD_DIGEST" ;;
            ""|"rolled back by ECS"*) running="$PREVIOUS_DASHBOARD_DIGEST" ;;
          esac
          # What watches the API now, and the rollback line (#148). Exactly one
          # case applies; each also gives Slack its API line.
          previous="${PREVIOUS##*/}"
          previous="${previous:-the revision serving before this run}"
          previous_serving="${PREVIOUS##*/}"
          new_revision="${NEW_REVISION##*/}"
          new_dashboard="${NEW_DASHBOARD##*/}"
          previous_dashboard="${PREVIOUS_DASHBOARD##*/}"
          previous_dashboard_image="${PREVIOUS_DASHBOARD_IMAGE#*/}"
          case "$ACCOUNT_CHECK" in
            success) account_cell="matches the environment's AWS_ACCOUNT_ID secret" ;;
            failure) account_cell="does NOT match the environment's AWS_ACCOUNT_ID secret" ;;
            *) account_cell="not checked" ;;
          esac
          reason="${OVERRIDE_REASON//[$'\r\n']/ }"
          alarms="${ALARMS:-}"
          if [ -z "$alarms" ]; then
            alarms="one of the API alarms (${API_ALARM_BLUE}, ${API_ALARM_GREEN})"
          fi
          watch=""
          api_slack=""
          rollback_line=""
          if [ -n "$DEPLOYMENT_ID" ] && [ "$OVERRIDE_ALARMS" = true ]; then
            # EM condition 4(e): said plainly, in place of the alarm window.
            watch="No alarm watched this deployment: it was created with the API's alarms overridden (reason: ${reason}). Nothing rolls it back by itself, in the canary or in the hour after its traffic shift. If this release misbehaves, roll back with the line below within that hour, while CodeDeploy keeps the previous task set. The next deploy is watched again. Until deployment ${DEPLOYMENT_ID} is no longer active (about an hour after its traffic shift), the next deploy to ${TARGET_ENV} is refused."
            api_slack="ALARMS OVERRIDDEN: no alarm watched this deployment, and nothing rolls it back by itself; within the hour, use the rollback line in the run summary if it misbehaves. Reason: ${reason}"
          elif [ "$SHIFT_RESULT" = alarm ] && [ "$APPROVED" = true ]; then
            watch="Rolled back by an alarm: ${alarms} fired during the traffic shift, and CodeDeploy is moving the API back to ${previous} by itself (${ALARM_BACK:-not checked}). The dashboard was not changed. Do not redeploy ${VERSION}: it will meet the same alarm. docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back"
            rollback_line="Rollback: not needed for the API. CodeDeploy moved it back to ${previous} after alarm ${alarms} (${ALARM_BACK:-not checked}). The dashboard was not changed."
            api_slack="rolled back by alarm ${alarms}; serving ${previous} (${ALARM_BACK:-not checked})"
          elif [ "$SHIFT_RESULT" = alarm ]; then
            watch="Stopped by an alarm: ${alarms} was in ALARM before the traffic shift, so nothing shifted and ${previous} keeps serving. Every deployment to this group is stopped while an alarm is in ALARM: docs/deployment/rollback-runbook.md#fix-forward-while-an-alarm-is-firing"
            rollback_line="Rollback: not needed. Nothing shifted: ${previous} is still serving, and the dashboard was not changed."
            api_slack="stopped by alarm ${alarms} before any traffic shifted; ${previous} still serving"
          elif [ "$ALARM_AFTER_SHIFT" = true ]; then
            watch="Rolled back by an alarm after the traffic shift: CodeDeploy stopped deployment ${DEPLOYMENT_ID} (ALARM_ACTIVE) and is moving the API back to ${previous} by itself. If the dashboard is on this run's revision, put it back to match with docs/deployment/rollback-runbook.md Method 2 (the dashboard block). docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back"
            rollback_line="Rollback: not needed for the API, which CodeDeploy is moving back by itself. For the dashboard alone: docs/deployment/rollback-runbook.md Method 2."
            api_slack="rolled back by an alarm after the traffic shift; moving back to ${previous}; the dashboard may be ahead of it"
          elif [ -n "$SHIFTED_AT" ]; then
            # UX W3a. Without a bake-hour notification (founder item O6), say
            # plainly that a later rollback is not announced.
            watch="Alarms watch the API until CodeDeploy deployment ${DEPLOYMENT_ID} ends, about an hour after its traffic shift (until about ${BAKE_END} UTC): ${API_ALARM_BLUE}, ${API_ALARM_GREEN}. If one goes into ALARM before then, CodeDeploy moves the API back to ${previous} by itself; the dashboard stays on this run's revision. The alarms watch the API's target 5xx only: a release that answers wrongly with a 2xx, a broken dashboard, and the load balancer's own 502 and 504 are not caught. After that hour, no alarm rolls the API back. A rollback by an alarm after this run ends is not announced in #deployments: check with aws deploy get-deployment --deployment-id ${DEPLOYMENT_ID} (Stopped with ALARM_ACTIVE means the API went back: docs/deployment/rollback-runbook.md#an-alarm-rolled-the-api-back). Until ${DEPLOYMENT_ID} is no longer active, the next deploy to ${TARGET_ENV} is refused."
            api_slack="Alarms watch the API until about ${BAKE_END} UTC. A rollback by an alarm after this run ends is not announced here: check deployment ${DEPLOYMENT_ID}."
          elif [ -n "$DEPLOYMENT_ID" ]; then
            watch="Until deployment ${DEPLOYMENT_ID} is no longer active (about an hour after its traffic shift, or when CodeDeploy stops an unapproved one), the next deploy to ${TARGET_ENV} is refused."
          fi
          if [ -z "$rollback_line" ]; then
            if [ -n "$PREVIOUS" ]; then
              rollback_line="Rollback: Actions → Rollback → environment=${TARGET_ENV}, task_definition_arn=${PREVIOUS##*/}${dashboard_param}"
            else
              rollback_line="Rollback: there was no revision serving before this run, so there is nothing to roll back to."
            fi
          fi
          shift_cell="${SHIFT_RESULT:-not reached}"
          if [ "$SHIFT_RESULT" = alarm ]; then
            shift_cell="rolled back by alarm ${alarms}"
            if [ "$APPROVED" != true ]; then
              shift_cell="stopped by alarm ${alarms} before any traffic shifted"
            fi
          fi
          if [ "$OVERRIDE_ALARMS" = true ] && [ -n "$DEPLOYMENT_ID" ]; then
            shift_cell="${shift_cell} (ALARMS OVERRIDDEN)"
          fi
          echo "api_slack=${api_slack:-see the run summary}" >> "$GITHUB_OUTPUT"
          {
            echo "## Deploy ${VERSION} to ${TARGET_ENV}: ${JOB_STATUS}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Account / region | ${account_cell} / \`${AWS_REGION}\` |"
            echo "| Release | \`${VERSION}\` at \`${RELEASE_COMMIT}\` |"
            echo "| Profile | \`${PROFILE}\` |"
            echo "| Image | \`${image_line}\` |"
            echo "| Snapshot before migrating | \`${SNAPSHOT:-none taken}\` |"
            echo "| Migration | ${MIGRATION:-not run} |"
            echo "| New API revision | \`${new_revision:-not registered}\` |"
            echo "| CodeDeploy deployment | \`${DEPLOYMENT_ID:-not created}\` |"
            echo "| API serving before this run | \`${previous_serving:-nothing (first deploy)}\` |"
            echo "| Traffic shift | ${shift_cell} |"
            echo "| Live API target group | \`${LIVE_GROUP:-not confirmed}\` |"
            echo "| Dashboard image | \`${dashboard_image_line}\` |"
            echo "| New dashboard revision | \`${new_dashboard:-not registered}\` |"
            echo "| Dashboard serving before this run | \`${previous_dashboard:-not read}\` (\`${previous_dashboard_image:-image not read}\`) |"
            echo "| Dashboard rollout | ${rollout_cell} |"
            echo ""
            if [ -n "$api_changed" ]; then
              echo "API changed: after this run's traffic shift the API check reported: ${api_changed}"
              echo ""
            fi
            if [ -n "$LIVE_GROUP" ]; then
              echo "Next \`cdk deploy\` of \`${FARGATE_STACK}\`: pass \`-c api_live_target_group=${LIVE_GROUP}\` (check it first: \`python3 scripts/check_live_target_group.py --env ${TARGET_ENV} --expect ${LIVE_GROUP}\`)."
            else
              echo "Live API target group not confirmed: run \`python3 scripts/check_live_target_group.py --env ${TARGET_ENV}\` before any \`cdk deploy\` of \`${FARGATE_STACK}\`."
            fi
            if [ -n "$running" ]; then
              echo "The dashboard is running \`${running}\`: the same \`cdk deploy\` also takes \`-c dashboard_image_tag=${running}\` (check it first: \`python3 scripts/check_dashboard_image.py --env ${TARGET_ENV} --expect ${running}\`)."
            else
              echo "Dashboard image not confirmed: run \`python3 scripts/check_dashboard_image.py --env ${TARGET_ENV}\` before any \`cdk deploy\` of \`${FARGATE_STACK}\`, and pass the \`-c dashboard_image_tag\` it prints."
            fi
            echo ""
            if [ -n "$watch" ]; then
              echo "$watch"
              echo ""
            fi
            echo "$rollback_line"
            if [ -n "$PREVIOUS" ] && [ -z "$dashboard_param" ] && [ -n "$PREVIOUS_DASHBOARD" ]; then
              echo ""
              echo "The dashboard was on ${previous_dashboard_image:-an image this run could not read} before this run, not a release: there is no released dashboard to roll back to."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Notify deployment result
        if: always() && env.SLACK_ON == 'true'
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: '#deployments'
          slack-message: |
            *${{ inputs.environment }} deployment ${{ job.status }}${{ inputs.override_alarms && ' -- ALARMS OVERRIDDEN, unwatched' || '' }}*: `${{ inputs.version }}` (${{ inputs.profile }})
            API: ${{ steps.summary.outputs.api_slack || 'see the run summary' }}
            Dashboard: ${{ steps.dashboard-rollout.outputs.outcome || 'not rolled out' }}
            Deployed by: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
        continue-on-error: true

      # One line, once per run, only when there is no token to post with: a
      # missing optional secret is a valid setup, so it is not a warning.
      - name: Say Slack was not notified
        if: always() && env.SLACK_ON != 'true'
        # A failed summary write must not turn a green job red.
        continue-on-error: true
        run: |
          printf '\n%s\n' "Slack: not notified -- SLACK_BOT_TOKEN is not set (optional; docs/deployment/README.md)." >> "$GITHUB_STEP_SUMMARY"

name: Chart (kind)

# The Helm chart installed on a real cluster: kind, behind ingress-nginx, from
# this pull request's own images, by the blocks of
# docs/self-hosting/kubernetes.md -- extracted from the page and run as a
# reader pastes them, never a copy. The phases, and what each asserts, are in
# scripts/chart_kind.sh; the `chart` workflow checks the chart without a
# cluster.
#
# Two upgrade legs follow the install:
#   N -> N'   this PR's images plus one more core revision made in the job:
#             exactly one `migrate` applies it, the old pods keep serving.
#             Runs everywhere, forks included (it needs no registry).
#   N-1 -> N  the previous release's chart and images, pulled from GHCR
#             anonymously (the packages are public), then upgraded to this
#             PR's. Runs everywhere, forks included, and is never skipped: an
#             N-1 that cannot be resolved or pulled without credentials fails
#             the job, whatever the event. Right after a release, while
#             the newest tag's images are still publishing, N-1 is the
#             release before it and the job summary says so (#519); one step
#             back and no further.
#
# Profiles: both, on every run, as parallel jobs. Measured on the first runs
# (2026-09-27): core about 4 minutes, full about 5.5, most of the difference
# the full dashboard image's build. If full grows past the budget, the plan's
# fallback is to run it nightly only.
#
# Not a required check. It has a path filter, so it does not report on a pull
# request that touches none of those paths, and a required check that never
# reports blocks the merge. Making it required is a later, human step: measure
# its runtime over five or more runs, make it always report (a `changes` job
# that skips the work, the way pr-qa-gate's docs-only gate does), then add
# `chart-kind (core)` and `chart-kind (full)` to branch protection.
#
# A red run anywhere but a pull request (a push to main, the nightly, a
# dispatch) opens an issue labelled `chart-kind-failure`, or comments on the
# open one: `failure-issue` below, a copy of Doc Examples' job of that name
# (test_chart_kind_failure_issue.py holds the two identical).

on:
  pull_request:
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'modules/**'
      - 'charts/**'
      # Literal entries, beside the glob, for the inventory: chart-kind is the
      # workflow these two pages name (tests/acceptance/docs/inventory.toml).
      - 'charts/experimently/README.md'
      - 'charts/experimently/templates/NOTES.txt'
      - 'VERSION'
      - 'docs/self-hosting/kubernetes.md'
      - 'scripts/chart_kind.sh'
      - 'scripts/guide_blocks.py'
      - '.github/workflows/chart-kind.yml'
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
    inputs:
      previous_version:
        description: 'N-1 for the upgrade leg, as X.Y.Z (default: the newest release at or below VERSION)'
        required: false
        default: ''

concurrency:
  # A pull request is keyed on its NUMBER, not head_ref: two forks' `patch-1`
  # branches share a head_ref and would cancel each other's runs (#75). A newer
  # push to the same pull request cancels the older run.
  #
  # Every other run -- a push to main, the nightly, a dispatch -- is keyed on its
  # commit and never cancelled. Keyed on the ref, each push to main cancelled the
  # one before it (8 of the last 10 main runs when this was measured), so a
  # merge that broke the install could go unseen on main.
  group: chart-kind-${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  HELM_VERSION: '3.19.0'
  # sha256 of helm-v3.19.0-linux-amd64.tar.gz (the same pin as chart.yml)
  HELM_SHA256: 'a7f81ce08007091b86d8bd696eb4d86b8d0f2e1b9f6c714be62f82f96a594496'
  KIND_VERSION: '0.30.0'
  # the v0.30.0 release's kind-linux-amd64.sha256sum
  KIND_SHA256: '517ab7fc89ddeed5fa65abf71530d90648d9638ef0c4cde22c2c11f8097b8889'
  # kind v0.30.0's default node image, as its release notes pin it
  KIND_NODE_IMAGE: 'kindest/node:v1.34.0@sha256:7416a61b42b1662ca6ca89f02028ac133a309a2a30ba309614e8ec94d976dc5a'
  KUBECTL_VERSION: '1.34.0'
  # https://dl.k8s.io/release/v1.34.0/bin/linux/amd64/kubectl.sha256
  KUBECTL_SHA256: 'cfda68cba5848bc3b6c6135ae2f20ba2c78de20059f68789c090166d6abc3e2c'
  # ingress-nginx's kind provider manifest; its images are pinned by digest inside it
  INGRESS_NGINX_MANIFEST_URL: 'https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/kind/deploy.yaml'
  INGRESS_NGINX_MANIFEST_SHA256: '2a3ae008c8786431115502644e77ab398fdebfb721a5d1195ed3089cde3299df'
  # publicBaseUrl's host; /etc/hosts points it at the kind node's port 80
  KIND_HOST: controlvar.kind.test

jobs:
  chart-kind:
    name: chart-kind (${{ matrix.profile }})
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # No packages: read. The upgrade leg pulls N-1's public images with no
    # credentials, as a pull request from a fork must.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        profile: [core, full]
    env:
      PROFILE: ${{ matrix.profile }}
      API_IMAGE: chart-kind-api:${{ matrix.profile }}
      WEB_IMAGE: chart-kind-web:${{ matrix.profile }}
    steps:
      - uses: actions/checkout@v7

      - name: Start the clock
        run: echo "BUILD_START=$(date +%s)" >> "$GITHUB_ENV"

      # N-1 for the upgrade leg, resolved before anything is built so that an
      # unresolvable one fails in seconds: the newest release at or below
      # VERSION whose images read anonymously from GHCR, or the release
      # before it while the newest one's are still publishing. The same on
      # every event, forks included: it fails rather than skips.
      - name: Resolve the previous release (N-1)
        id: previous
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: bash scripts/chart_kind.sh previous

      # The runner image ships its own helm and kubectl; the pinned ones go
      # first on PATH and are asserted.
      - name: Install helm, kind and kubectl (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/helm.tgz" \
            "https://get.helm.sh/helm-v${HELM_VERSION}-linux-amd64.tar.gz"
          echo "${HELM_SHA256}  $RUNNER_TEMP/helm.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/helm.tgz" -C "$RUNNER_TEMP" linux-amd64/helm
          install -m 0755 "$RUNNER_TEMP/linux-amd64/helm" "$bin/helm"
          curl -fsSL -o "$bin/kind" \
            "https://github.com/kubernetes-sigs/kind/releases/download/v${KIND_VERSION}/kind-linux-amd64"
          echo "${KIND_SHA256}  $bin/kind" | sha256sum -c -
          chmod 0755 "$bin/kind"
          curl -fsSL -o "$bin/kubectl" \
            "https://dl.k8s.io/release/v${KUBECTL_VERSION}/bin/linux/amd64/kubectl"
          echo "${KUBECTL_SHA256}  $bin/kubectl" | sha256sum -c -
          chmod 0755 "$bin/kubectl"
          echo "$bin" >> "$GITHUB_PATH"

      - name: Tool versions
        run: |
          set -euo pipefail
          test "$(helm version --template '{{.Version}}')" = "v${HELM_VERSION}"
          test "$(command -v helm)" = "$RUNNER_TEMP/bin/helm"
          kind version | grep -F "v${KIND_VERSION} "
          test "$(command -v kubectl)" = "$RUNNER_TEMP/bin/kubectl"
          kubectl version --client | grep -F "v${KUBECTL_VERSION}"
          jq --version
          openssl version

      - name: Point the public host at the kind node
        run: echo "127.0.0.1 ${KIND_HOST}" | sudo tee -a /etc/hosts

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # The UTC date, passed to the image builds below as OS_PACKAGES_REFRESHED:
      # a new date re-runs the Dockerfiles' OS package upgrade layer even when
      # the build cache holds an older copy of it (see backend/Dockerfile).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # Read-only use of the caches Docker Smoke writes (pr-qa-gate.yml); the
      # full dashboard image has no cache there, so it keeps its own.
      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: ${{ matrix.profile }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          # env.API_IMAGE, written out: a `with:` value read from an image-named
          # env var is refused (test_workflow_account_id_private.py).
          tags: chart-kind-api:${{ matrix.profile }}
          cache-from: |
            type=gha,scope=api
            type=gha,scope=api-full

      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPERIMENTLY_PROFILE=${{ matrix.profile }}
            VERSION=${{ steps.version.outputs.version }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          # env.WEB_IMAGE, written out (see the API image above).
          tags: chart-kind-web:${{ matrix.profile }}
          cache-from: |
            type=gha,scope=web
            type=gha,scope=web-full-kind
          cache-to: ${{ matrix.profile == 'full' && 'type=gha,scope=web-full-kind,mode=max' || '' }}

      - name: Record the tools and image build time
        run: bash scripts/chart_kind.sh time tools-and-images "$BUILD_START"

      - name: kind cluster and ingress-nginx
        run: bash scripts/chart_kind.sh cluster

      - name: Load this pull request's images
        run: bash scripts/chart_kind.sh load

      - name: Server-side dry run of the rendered chart
        run: bash scripts/chart_kind.sh dry-run

      - name: The guide's blocks (docs/self-hosting/kubernetes.md)
        run: bash scripts/chart_kind.sh guide

      - name: Fresh install with two API replicas
        run: bash scripts/chart_kind.sh replicas

      - name: Upgrade to a newer revision (N to N')
        run: bash scripts/chart_kind.sh upgrade-next

      # No `if:` and no registry login: the leg runs on every event, and its
      # pull is anonymous (scripts/chart_kind.sh pull_anonymously), so a
      # package that is no longer public fails it here, not only on forks.
      - name: Upgrade from the previous release (N-1 to N)
        env:
          PREVIOUS_VERSION: ${{ steps.previous.outputs.version }}
        run: bash scripts/chart_kind.sh upgrade-previous

      - name: Diagnostics
        if: failure()
        run: bash scripts/chart_kind.sh diagnose

      - name: Per-phase timings
        if: always()
        run: bash scripts/chart_kind.sh summary

  failure-issue:
    name: File an issue on failure
    runs-on: ubuntu-latest
    needs: [chart-kind]
    # Doc Examples' condition, unchanged: a matrix leg that reaches
    # timeout-minutes concludes `cancelled`, not `failure`, so a cancelled job
    # is red here too. `!cancelled()` still leaves out a run that was itself
    # cancelled; with the group above, a later run never cancels one off a
    # pull request, so that means a person cancelled it.
    if: ${{ github.event_name != 'pull_request' && !cancelled() && (failure() || contains(needs.*.result, 'cancelled')) }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="The Helm chart on kind is red"
          BODY="Chart (kind) failed on $(date -u '+%Y-%m-%d') (${GITHUB_EVENT_NAME}, commit ${GITHUB_SHA})."$'\n\n'"Run: ${RUN_URL}"

          # `|| true`: the label does not exist yet on the first red run.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label chart-kind-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh label create chart-kind-failure --repo "$REPO" --color B60205 \
              --description "Chart (kind) failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label chart-kind-failure --body "$BODY"
          fi

# The documentation site (MkDocs Material, mkdocs.yml).
#
# Two jobs. `build` runs on every pull request and push to main that touches the
# docs or the site configuration, with `strict: true` (in mkdocs.yml): a broken
# link or anchor fails the gate. `deploy` publishes the built site to GitHub
# Pages on a release tag (not a pre-release such as v1.2.0-rc.1), and only
# from the public repository -- Pages for a private repository needs a paid
# plan, and the monorepo is private until the cut.
name: Docs

on:
  # No `pull_request` trigger: documentation merges without a CI gate
  # (founder, 2026-09-24). The build still runs on every push to main below,
  # so a broken link or anchor surfaces within minutes of the merge rather
  # than blocking the pull request. `Docs` is not one of the 20 required
  # checks, so removing it here blocks nothing.
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml', 'scripts/docs_toolchain.sh']
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: docs build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      # Only the site toolchain, pinned to the same versions the venv carries
      # (backend/requirements.txt), not the whole backend closure. The one
      # spelling of it, shared with doc-examples.yml's render check.
      - name: Install MkDocs
        run: bash scripts/docs_toolchain.sh
      - name: Build (strict)
        run: mkdocs build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: deploy to GitHub Pages
    needs: build
    # A release tag only. A pre-release tag (v1.2.0-rc.1: anything with a `-`)
    # builds but does not deploy, so an rc rehearsal never replaces the live
    # site. github.ref is the tag for a push and for a manual run started from
    # a tag alike. Pinned by test_docs_deploy_condition.py.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') && github.repository_id == '1367480368'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

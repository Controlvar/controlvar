name: PR QA Gate

on:
  pull_request:
    branches: [main]

concurrency:
  # Keyed on the pull request NUMBER, not head_ref: two forks' `patch-1`
  # branches share a head_ref and would cancel each other's runs (#75).
  group: pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Is this change documentation only?
  #
  # The heavy jobs below take ~40 minutes and none of them can observe a change
  # to docs/. Running them on a documentation pull request buys nothing and is
  # the reason a typo fix took as long as a schema migration.
  #
  # The jobs are SKIPPED rather than not triggered: branch protection requires
  # 20 checks to report, so a workflow that simply does not run on docs/**
  # leaves every one of them missing and the pull request blocked for ever.
  #
  # A job-level `if:` is enough ONLY for a plain job, whose skipped check keeps
  # its name and is accepted. It is NOT enough for a job that protection names
  # by an expanded or called name: a skipped reusable-workflow caller reports
  # as `SDK Live Contract` and never as
  # `SDK Live Contract / sdk-live-contract (core)`, and a matrix skipped before
  # it expands reports its unexpanded name -- `core-build` and `full-build`
  # were the matrix `${{ matrix.profile }}-build` until #869. That is what left
  # #133 (docs/auth/sso.md only) BLOCKED with every check that ran green. So
  # `sdk-live-contract`, `core-build` and `full-build` always run, and every
  # one of their steps is conditioned instead: the checks report under their
  # real names, in seconds, and on a docs-only change core-build still runs
  # the tests that pin docs/ content.
  # backend/tests/unit/infrastructure/test_docs_only_gate.py pins all of it.
  #
  # The classification is scripts/classify_changes.py (docs/ except docs/api/,
  # plus mkdocs.yml; an empty list is not docs-only). `--no-renames` is
  # load-bearing: without it `git mv backend/a.py docs/a.py` lists only
  # docs/a.py and a code change is classed as documentation.
  #
  # Leak Guard and Doc Examples are separate workflows and run on every pull
  # request, docs-only included. Neither is where docs content is REQUIRED to
  # pass: Doc Examples is not a required check, and Docs has no pull_request
  # trigger at all (documentation merges without a site-build gate; founder,
  # 2026-09-24). The required home of the docs tests is core-build below.
  #
  # A classifier that fails runs EVERYTHING. A job whose `needs:` failed is
  # skipped, and protection accepts a skipped check, so the plain
  # `docs_only != 'true'` form turned a crashed classifier into a green gate
  # with nothing run. Every classified job is instead
  #   ${{ !cancelled() && (needs.changes.result != 'success' || <its lane>) }}
  # and the three jobs below that must never skip are `${{ !cancelled() }}`.
  # `!cancelled()` would also run a job after ANY of its needs failed, so
  # every one of them needs `changes` alone. The step collects the file list
  # and the verdict into variables first and writes one checked line last:
  # a failure part-way leaves `$GITHUB_OUTPUT` untouched, never a half answer.
  # backend/tests/unit/infrastructure/test_ci_classification.py pins the
  # exact `if:` and `needs:` of every job, and runs this step's script.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --no-renames --name-only "$BASE" "$HEAD")"
          lane="$(printf '%s\n' "$files" | python3 scripts/classify_changes.py)"
          case "$lane" in
            docs_only=true | docs_only=false) ;;
            *) printf '::error::the classifier printed %s, not one docs_only line\n' "$lane" >&2; exit 1 ;;
          esac
          printf '%s\n' "$lane" >> "$GITHUB_OUTPUT"

  unit-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    name: Unit Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run unit tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/unit/ backend/tests/realistic/ -p no:cov -q --tb=short -x --junitxml=unit-junit.xml

      # The workflow tests skip when the file they read is absent, so a
      # renamed workflow used to turn 19 of them into green skips (QA 4d).
      # The statistical gates (stats_validation) must all run: a skipped gate
      # looks exactly like a passing one. So must the seeded realistic
      # scenarios (backend/tests/realistic): they need no running platform,
      # and until they joined this job no workflow ran them. So must the
      # showcase tests (backend/tests/unit/showcase, #1066): they are meant to
      # need no ffmpeg, browser or aws, and one that skipped for want of
      # one of them would read as a pass. So must the docs tests
      # (backend/tests/unit/docs, #1142): the page gate and the information
      # floor are among them, and core-build's docs step checks the same
      # directory on a docs-only change. On this full checkout nothing under
      # any of the five directories skips.
      - name: No workflow, statistical-gate, realistic-scenario, showcase or docs test was skipped
        run: python3 scripts/check_junit_skips.py unit-junit.xml backend/tests/unit/infrastructure backend/tests/unit/stats_validation backend/tests/realistic backend/tests/unit/showcase backend/tests/unit/docs

      # The Lambda functions (event processor, flag evaluation) and their
      # shared package carry tests of their own (240 collected) that ran
      # nowhere in CI. Each function's tests/ dir
      # must run in its own pytest invocation (they all define `tests.conftest`).
      - name: Run Lambda tests
        run: |
          for d in backend/lambda/event_processor backend/lambda/feature_flag_evaluation backend/lambda/shared; do
            python -m pytest "$d" -p no:cov -q --tb=short || exit 1
          done

  # The modules carry 1,629 tests of their own. Until now the only thing that
  # ran them was `full-build`, a 60-minute job: a broken module test was an
  # hour of waiting away. This is the same shape as unit-tests, so it fails in
  # minutes.
  module-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    name: Module Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            modules/requirements.txt
            modules/requirements-test.txt

      # Both sets: the modules import the backend, and modules/requirements.txt
      # carries what only they import (python3-saml, authlib, sqlglot). Without
      # the second install the SSO tests would pass against a None module and
      # prove nothing. The third is test-only (duckdb, which the warehouse
      # tests run the generated SQL on); no image installs it.
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -r modules/requirements.txt
          pip install -r modules/requirements-test.txt

      - name: Run module tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest modules/backend/tests -p no:cov -q --tb=short --junitxml=module-junit.xml

      # The warehouse tests must all RUN: a skip there (a missing duckdb or
      # sqlglot turned into a skip, say) would leave the SQL semantics, the
      # identifier gate, the runner and the routes unchecked under a green job.
      - name: No warehouse test was skipped
        run: python3 scripts/check_junit_skips.py module-junit.xml modules/backend/tests/unit/warehouse modules/backend/tests/integration/warehouse

  base-requirements-only:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    # The environment nobody was testing: a FULL checkout whose interpreter has
    # ONLY backend/requirements.txt in it -- no modules/requirements.txt, no
    # extras. Every other Python job either installs both sets (module-tests)
    # or does not care whether the modules registered.
    #
    # The modules import a few packages unguarded (defusedxml in sso_service,
    # deliberately: an XXE-safe parser has no safe fallback), so moving one of
    # those out of backend/requirements.txt breaks the registration for every
    # job that installs that file alone. When that happened the symptom was
    # unreadable -- conftest's require_modules_or_absent() raised during
    # collection and pytest exited 3 having collected zero tests -- and no
    # developer could reproduce it, because their venv has every package.
    #
    # ~90 seconds: one pip install, one import, the smoke suite, and the
    # fuzzer's pins installed into a venv of their own (the last step).
    name: Base Requirements Only
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # EXACTLY this file. Adding anything here -- including
      # modules/requirements.txt -- defeats the whole job.
      - name: Install backend/requirements.txt and nothing else
        run: pip install -r backend/requirements.txt

      - name: The modules must register on this environment
        env:
          APP_ENV: test
          TESTING: 'true'
          # The import itself opens no connection, but the settings are read
          # while it happens; give them the service's values rather than
          # whatever the defaults are.
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python scripts/check_modules_register.py

      - name: Run the smoke suite
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/smoke -p no:cov -q --tb=short

      # Every pull request installs the API fuzzer's pins the way a fuzz run
      # does (the script is the one _platform.yml's fuzz arm calls) and runs
      # `pip check`, so a pin pair that cannot install together is red here and
      # not on the scheduled run after it merged (#1128). Here because
      # this job already does a bare pip install on the Python the fuzz arm
      # uses (3.11), and the fuzzer's venv is a separate one, built in a
      # temporary directory: the interpreter the steps above tested is not
      # touched. The fuzz run itself is not part of any pull request check.
      - name: The fuzzer's pins install and pass pip check
        run: bash scripts/check_fuzz_install.sh

  smoke-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    name: Smoke Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Run smoke tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/smoke/ -p no:cov -q --tb=short

  frontend-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    name: Frontend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Jest tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

      - name: Build
        run: cd frontend && npm run build

      # The core seam, exercised the way a core build resolves it:
      # `@modules/*` to the stub tree only. Without these three steps a
      # stub-shape drift -- an `@modules/x` import with no stub, a method added
      # to modules/frontend/src/rbac.ts and used from a core page -- ships
      # through a green CI, because every other step resolves `@modules/*` to
      # the real tree (modules/frontend/src) first. scripts/core_build.sh
      # repeats the build step on a tree with modules/ actually deleted (the
      # core-build job).
      - name: tsc against the core tsconfig
        run: cd frontend && npx tsc --noEmit -p tsconfig.core.json

      - name: Jest as the core profile
        run: cd frontend && EXPERIMENTLY_PROFILE=core npx jest --passWithNoTests --watchAll=false

      - name: Core build carries no module route
        run: |
          cd frontend
          rm -rf .next out
          EXPERIMENTLY_PROFILE=core npm run build
          if grep -rlE '/api/v1/workspaces|/api/v1/rbac/|/api/v1/hipaa|/api/v1/warehouse/' out/_next/static; then
            echo "::error::core bundle references module routes"; exit 1
          fi
          # The other half: without it the grep above also passes when the
          # page vanished entirely. Turbopack (the default bundler from Next
          # 16) emits flat content-hashed chunks with no `chunks/pages/`
          # directory, so the old `find ... -name 'workspaces-*.js'` matched
          # nothing in either profile; this greps for the stub page's own
          # description instead (the real module's page says "Isolated project
          # namespaces", so the string is in no full bundle).
          if ! grep -rl 'Separate teams into workspaces' out/_next/static >/dev/null; then
            echo "::error::core bundle has no workspaces stub page (its description is in no chunk)"; exit 1
          fi

  # Each SDK's OWN exported hash function against golden-vectors.json: the
  # Python SDK's source, the JS and edge packages as built, the React Native
  # source (which is what that package ships), the Go module. One step per SDK,
  # so the failing SDK is the failing step. hash_contract.py does every
  # comparison and asserts the exact number of vectors each SDK answered; its
  # --list step names every sdk/ directory this job does not run, and why.
  sdk-contracts:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    name: SDK Contract Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            sdk/js/package-lock.json
            sdk/edge/package-lock.json
            sdk/react-native/package-lock.json

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # go.mod declares go 1.21; the same toolchain as sdk-unit-tests.yml.
          go-version: '1.22.x'
          # The SDK and the harness are stdlib-only: no go.sum to key a cache on.
          cache: false

      - name: Install pytest
        run: pip install pytest

      - name: SDKs this job checks, and those it does not
        run: python tests/sdk-contract/hash_contract.py --list

      # pyproject.toml adds --cov flags; only pytest is installed here, so clear addopts.
      - name: The comparison rejects a wrong answer (hash_contract.py self-tests)
        run: python -m pytest tests/sdk-contract -v -o addopts=""

      - name: Python SDK hash (sdk/python)
        run: python tests/sdk-contract/hash_contract.py python

      - name: JS SDK hash (sdk/js, built)
        run: python tests/sdk-contract/hash_contract.py js

      - name: Edge SDK hash (sdk/edge, built)
        run: python tests/sdk-contract/hash_contract.py edge

      - name: React Native SDK hash (sdk/react-native source)
        run: python tests/sdk-contract/hash_contract.py react-native

      - name: Go SDK hash (sdk/go)
        run: python tests/sdk-contract/hash_contract.py go

  # Each profile must stand on its own. scripts/core_build.sh copies the
  # checkout and runs one sequence over the copy; `--profile core` deletes
  # modules/ and every path modules-manifest.txt still lists outside it (a
  # boundary regression fails there), `--profile full` deletes nothing.
  #
  # Both profiles run: REUSE licensing and gitleaks over the tree that profile
  # would ship, `import backend.app.main` in the right profile, bootstrap on
  # Postgres 16 into a scratch schema (exactly that profile's tables), the
  # dashboard build with the module-route grep, and the shipped-licence
  # allow-list over that profile's dependency closure.
  #
  # The pytest sessions are core-only, and deliberately: `--profile full`
  # leaves the tree exactly as the checkout is, so its unit / integration /
  # smoke / module / Lambda / golden-vector sessions would re-run, in a
  # 60-minute job, what unit-tests, integration-tests.yml, smoke-tests,
  # module-tests and sdk-contracts already ran on that same tree in minutes.
  # `--profile core` runs them because there they run against a DIFFERENT
  # tree -- one with modules/ deleted -- which nothing else exercises.
  #
  # The same sequence as `make core-build` / `make full-build`; the step that
  # failed is named in the last line of the log.
  #
  # Two jobs, `core-build` and `full-build`, each reporting under its job id
  # (the required check names). They were one `profile-build` matrix until
  # #869; the steps are what each leg ran, with the profile written out. The
  # environment and the Postgres service are the same in both and are kept
  # the same by backend/tests/unit/infrastructure/test_docs_only_gate.py.
  #
  # No classification `if:` at job level, only `!cancelled()` (see the
  # `changes` job): on a docs-only change every step below is skipped except
  # the reason and, in core-build only, the tests that pin docs/ content --
  # which is why a docs-only pull request still starts both jobs and their
  # Postgres service.
  core-build:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # For the Redis-backed integration tests (the experiment cache, the flag
      # reads after every writer), as in integration-tests.yml. Core-build
      # only: full-build runs no pytest session. With the two
      # EXPERIMENTLY_REQUIRE_* variables on the `core build` step a missing
      # Redis fails those tests instead of skipping them (#899).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      TESTING: 'true'
      POSTGRES_SERVER: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: experimentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GITLEAKS_VERSION: '8.30.1'
      # Repository tooling, same versions as the Makefile; installed here
      # rather than pinned in backend/requirements.txt, which is the product's
      # dependency list and feeds THIRD_PARTY_LICENSES.md.
      REUSE_VERSION: '6.2.0'
      PIP_LICENSES_VERSION: '5.5.5'
    steps:
      - name: Docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "docs-only change: the core profile build is not needed and every build step below is skipped."
          echo "The core leg still runs the tests that pin docs/ content."

      # The tree and Python: for the build, or on a docs-only change for the
      # docs tests, so no condition.
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The tests that read docs/ -- directly or through a path built from the
      # repository root -- and would otherwise never run on the pull request
      # that breaks them, because unit-tests and smoke-tests skip on a
      # docs-only change. Only on a docs-only change: on any other change
      # unit-tests and smoke-tests run every one of them already. Which docs
      # readers are here and why the others are not is pinned, with reasons,
      # in backend/tests/unit/infrastructure/test_docs_only_gate.py.
      - name: Install backend dependencies (docs tests)
        if: needs.changes.outputs.docs_only == 'true'
        run: pip install -r backend/requirements.txt

      - name: Docs content tests
        if: needs.changes.outputs.docs_only == 'true'
        run: >-
          python -m pytest -p no:cov -q --tb=short --junitxml=docs-content-junit.xml
          backend/tests/unit/scripts/test_doc_examples.py
          backend/tests/unit/scripts/test_guide_blocks.py
          backend/tests/unit/docs/
          backend/tests/smoke/test_openapi_snapshot.py
          backend/tests/smoke/test_version_sources.py
          backend/tests/unit/infrastructure/test_dashboard_image_docs.py
          backend/tests/unit/infrastructure/test_rollback_uses_codedeploy.py
          backend/tests/unit/infrastructure/test_deploy_docs.py
          backend/tests/unit/infrastructure/test_iam_actions.py
          backend/tests/unit/infrastructure/test_rollback_runbook_env_check.py
          backend/tests/unit/db/test_alembic_plan.py
          modules/backend/tests/unit/services/test_sso_docs_messages.py
          backend/tests/unit/showcase/test_showcase_quoted_docs.py

      # On a docs-only change this is where the docs tests run, Unit Tests
      # being skipped, so a docs test that skipped would read as a pass on
      # most of #1142's pull requests. Nothing under backend/tests/unit/docs
      # skips on this full checkout; the Unit Tests job checks the same
      # directory on every other change.
      - name: No docs content test was skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: python3 scripts/check_junit_skips.py docs-content-junit.xml backend/tests/unit/docs

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install -r backend/requirements.txt "reuse==${REUSE_VERSION}" "pip-licenses==${PIP_LICENSES_VERSION}"

      - name: Install gitleaks
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # A second Redis that requires a password, for
      # backend/tests/integration/test_redis_password_auth.py, started the
      # same way as in integration-tests.yml: a service container takes no
      # command. The password is generated per run and handed to the tests
      # through GITHUB_ENV.
      - name: Start a password-protected Redis
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name redis-auth -p 6380:6379 redis:7-alpine \
            redis-server --requirepass "${password}"
          for _ in $(seq 1 30); do
            if docker exec redis-auth redis-cli --no-auth-warning -a "${password}" ping | grep -q PONG; then
              {
                echo "REDIS_AUTH_TEST_PORT=6380"
                echo "REDIS_AUTH_TEST_PASSWORD=${password}"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs redis-auth
          exit 1

      # core_build.sh runs every pytest session in the copy with this
      # environment, so the integration session gets both variables: a Redis
      # test that skips there is a failure. No EXPERIMENTLY_REQUIRE_EDITABLE:
      # this job has no editable install, so test_the_integration_job_is_armed
      # keeps its skip here.
      - name: core build
        if: needs.changes.outputs.docs_only != 'true'
        env:
          EXPERIMENTLY_REQUIRE_REDIS: "1"
          EXPERIMENTLY_REQUIRE_REDIS_AUTH: "1"
        run: scripts/core_build.sh --profile core

  # The full profile: the same sequence minus the pytest sessions (above), and
  # no docs tests -- core-build runs those.
  full-build:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      TESTING: 'true'
      POSTGRES_SERVER: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: experimentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GITLEAKS_VERSION: '8.30.1'
      # Same versions as core-build's (see there).
      REUSE_VERSION: '6.2.0'
      PIP_LICENSES_VERSION: '5.5.5'
    steps:
      - name: Docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "docs-only change: the full profile build is not needed and every build step below is skipped."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: Set up Python
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install -r backend/requirements.txt "reuse==${REUSE_VERSION}" "pip-licenses==${PIP_LICENSES_VERSION}"

      # The modules import packages backend/requirements.txt deliberately does
      # not carry (python3-saml, authlib, and the defusedxml/requests the SSO
      # service needs); without this the licence step would report them as
      # "pinned but not installed here".
      - name: Install module dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install -r modules/requirements.txt -r modules/requirements-test.txt

      - name: Install gitleaks
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: full build
        if: needs.changes.outputs.docs_only != 'true'
        run: scripts/core_build.sh --profile full --steps copy,strip,reuse,secrets,import,bootstrap,frontend,licences

  # Live SDK contract: every SDK's contract_smoke against a real backend.
  # Proves the SDKs call endpoints the backend actually serves (the golden-vector
  # job above only covers hashing). Android runs through its JVM variant (see
  # _platform.yml); Flutter, Elixir and iOS have no toolchain on ubuntu-latest
  # and are exercised by their unit tests only.
  # Every SDK against a real API, through the shared boot in _platform.yml so
  # the sequence lives in one place (this is its only caller today).
  #
  # No classification `if:` at job level, only `!cancelled()` (see the
  # `changes` job): a skipped caller never reports
  # the required `SDK Live Contract / sdk-live-contract (core)`. On a docs-only
  # change `skip` makes every step of the called job a no-op instead.
  sdk-live-contract:
    needs: changes
    if: ${{ !cancelled() }}
    name: SDK Live Contract
    uses: ./.github/workflows/_platform.yml
    with:
      skip: ${{ needs.changes.outputs.docs_only == 'true' }}
      profile: core
      seed: sdk-contract
      suite: sdk-live-contract
      sdks: >-
        python openfeature-python js openfeature edge react react-native
        go java android ruby php dotnet

  # Seven fail-hard browser journeys (login, experiment lifecycle, feature flag,
  # RBAC, admin panel, segments, results checks) driven through the dashboard a
  # self-hoster actually gets:
  # the Next.js static export, served the way the nginx image serves it
  # (tests/e2e/static-server.mjs — same origin, /api proxied), against a real
  # API on a freshly bootstrapped and seeded database with local auth and the
  # dev bypass off. Every journey selects by data-testid and fails hard; there
  # is no "skip if the element is missing" tolerance anywhere in them.
  browser-e2e:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    name: Browser E2E
    runs-on: ubuntu-latest
    # 20 before C2b; the SSO steps add a second API, a `next dev` compile and
    # the History gate's 61-second wait.
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: development
      ENVIRONMENT: development
      # The journeys log in for real: local provider, bypass off.
      AUTH_PROVIDER: local
      DEV_AUTH_BYPASS: 'false'
      POSTGRES_SERVER: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: experimentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_SCHEMA: experimentation
      REDIS_HOST: localhost
      REDIS_PORT: '6379'
      SECRET_KEY: ci-only-browser-e2e-secret-key-0123456789abcdef0123456789
      # The background schedulers have nothing to do here; keep them out of the
      # way of the safety-check request budget the admin journey asserts on.
      SAFETY_CHECK_INTERVAL_MINUTES: '60'
      ROLLOUT_CHECK_INTERVAL_MINUTES: '60'
      BANDIT_UPDATE_INTERVAL_MINUTES: '60'
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Install dashboard dependencies
        run: cd frontend && npm ci

      # Keyed on the lockfile: a Playwright bump re-downloads, otherwise the
      # browser comes from the cache and `install` only checks the host deps.
      - name: Cache the Playwright browser
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Install chromium only
        run: cd frontend && npx playwright install --with-deps chromium

      # The historical migration chain cannot be replayed from an empty
      # database; bootstrap creates the schema from the models and stamps head.
      - name: Bootstrap the database
        run: python -m backend.app.db.bootstrap

      # admin@demo.com / dev@ / analyst@ / viewer@, all Demo1234!, plus three
      # experiments and the two feature flags the journeys assert on.
      - name: Seed the demo data
        run: python backend/scripts/seed_demo_data.py

      - name: Start the API
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 \
            --log-level warning > api.log 2>&1 &
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl -sf localhost:8000/health/ready >/dev/null && exit 0
            sleep 1
          done
          echo "the API did not become healthy"; tail -n 100 api.log; exit 1

      # Empty NEXT_PUBLIC_API_URL == same origin, exactly as frontend/Dockerfile
      # builds it: the test server proxies /api to the backend, so the browser
      # sends no cross-origin preflight (which the backend would otherwise count
      # against the 10/min limit on /api/v1/auth/login).
      - name: Build the dashboard (static export)
        env:
          NEXT_PUBLIC_API_URL: ''
          NEXT_TELEMETRY_DISABLED: '1'
        run: cd frontend && npm run build

      # Playwright starts tests/e2e/static-server.mjs itself (the export exists,
      # so the config picks the served-export mode). Chromium only.
      - name: Run the browser journeys
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: cd frontend && npx playwright test --project=journeys

      # --- Sign in with SSO from the dashboard (C2b, launch-readiness
      # stream-c/c2b/spec-v3.md §12). A second API process on :8001 with
      # ENVIRONMENT=test and APP_ENV=test, so the fake provider may be plain
      # http. What `test` changes there, against the :8000 API above: the rate
      # limiter is off; all five background schedulers are off; TestSettings
      # carries no CORS defaults, so main.py's localhost fallback applies; and
      # http provider endpoints are allowed. Same database, same SECRET_KEY.
      - name: Start the fake OIDC provider
        run: |
          python modules/backend/tests/integration/api/fake_oidc_provider.py \
            e2e-client e2e-secret e2e-user@sso-e2e.example.com > fake-oidc.log 2>&1 &
          for _ in $(seq 1 30); do
            port=$(sed -n 's/^READY \([0-9]*\)$/\1/p' fake-oidc.log)
            if [ -n "$port" ]; then
              echo "SSO_FAKE_PROVIDER_URL=http://127.0.0.1:$port" >> "$GITHUB_ENV"
              echo "fake OIDC provider: READY $port"
              exit 0
            fi
            sleep 1
          done
          echo "the fake OIDC provider did not start"; cat fake-oidc.log; exit 1

      - name: Start the SSO API (same origin, :8001)
        env:
          ENVIRONMENT: test
          APP_ENV: test
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
          # The static export is served on :3100, so that is the dashboard.
          PUBLIC_BASE_URL: http://localhost:3100
        run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8001 \
            --log-level info > sso-api.log 2>&1 &
          echo $! > sso-api.pid
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl -sf localhost:8001/health/ready >/dev/null && exit 0
            sleep 1
          done
          echo "the SSO API did not become healthy"; tail -n 100 sso-api.log; exit 1

      # After the provider, because the configuration names its address.
      - name: Create the SSO configuration for the fake provider
        run: |
          token=$(curl -sf -X POST http://localhost:8001/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@demo.com","password":"Demo1234!"}' \
            | python -c 'import json,sys; print(json.load(sys.stdin)["access_token"])')
          body=$(python -c 'import json,os; print(json.dumps({
            "org_name": "SSO E2E", "org_domain": "sso-e2e.example.com",
            "provider_type": "okta", "entity_id": "e2e-client",
            "client_secret": "e2e-secret", "sso_url": os.environ["SSO_FAKE_PROVIDER_URL"],
            "role_mapping": {}, "is_enforced": False, "is_active": True}))')
          curl -sf -X POST http://localhost:8001/api/v1/auth/sso/configs \
            -H "authorization: Bearer $token" -H 'content-type: application/json' \
            -d "$body" > /dev/null

      # The static export on :3100 again, its /api proxied to :8001: the
      # journey, two error journeys, and the History-database gate.
      - name: SSO sign-in, same origin (static export)
        env:
          PLAYWRIGHT_API_URL: http://127.0.0.1:8001
          SSO_API_LOG: ${{ github.workspace }}/sso-api.log
          SSO_EMAIL: e2e-user@sso-e2e.example.com
        run: cd frontend && npx playwright test --project=sso

      # The dashboard on another origin than the API, the api.-host shape of
      # D14: PUBLIC_BASE_URL is the API's own origin (so the IdP returns to
      # :8001 directly), and DASHBOARD_ORIGINS names the dashboard.
      - name: Restart the SSO API for a dashboard on another origin
        env:
          ENVIRONMENT: test
          APP_ENV: test
          LOG_LEVEL: INFO
          PYTHONUNBUFFERED: '1'
          PUBLIC_BASE_URL: http://localhost:8001
          DASHBOARD_ORIGINS: http://localhost:3000
        run: |
          kill "$(cat sso-api.pid)"
          for _ in $(seq 1 30); do
            curl -sf localhost:8001/health/live >/dev/null || break
            sleep 1
          done
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8001 \
            --log-level info > sso-api-cross.log 2>&1 &
          echo $! > sso-api.pid
          deadline=$((SECONDS + 90))
          while [ "$SECONDS" -lt "$deadline" ]; do
            curl -sf localhost:8001/health/ready >/dev/null && exit 0
            sleep 1
          done
          echo "the SSO API did not become healthy"; tail -n 100 sso-api-cross.log; exit 1

      # `next dev` (React StrictMode mounts twice) on :3000 against :8001:
      # the journey asserts exactly one exchange POST and prints the count.
      - name: SSO sign-in, different origin (next dev)
        env:
          PLAYWRIGHT_WEB_SERVER: dev
          PLAYWRIGHT_PORT: '3000'
          NEXT_PUBLIC_API_URL: http://localhost:8001
          NEXT_TELEMETRY_DISABLED: '1'
          SSO_API_BASE: http://localhost:8001
          SSO_API_LOG: ${{ github.workspace }}/sso-api-cross.log
          SSO_EMAIL: e2e-user@sso-e2e.example.com
        run: |
          started=$SECONDS
          cd frontend && npx playwright test --project=sso --grep @journey
          echo "different-origin SSO journey under next dev: $((SECONDS - started)) s"

      - name: Upload the Playwright report and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-e2e-report
          path: |
            frontend/playwright-report/
            frontend/playwright-results/
          retention-days: 7
          if-no-files-found: ignore

      - name: API log (on failure)
        if: failure()
        run: |
          tail -n 200 api.log
          for log in sso-api.log sso-api-cross.log fake-oidc.log; do
            if [ -f "$log" ]; then echo "== $log"; tail -n 100 "$log"; fi
          done

  # Builds both images and boots the compose stack exactly the way a
  # self-hoster does, then walks the golden path through the real containers:
  # readiness -> login -> user API key -> SDK assignment -> dashboard pages
  # (including a dynamic route served by nginx from the static export).
  docker-smoke:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.docs_only != 'true') }}
    name: Docker Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SEED: demo,sdk-contract
      AUTH_PROVIDER: local
      DEV_AUTH_BYPASS: "false"
      ENVIRONMENT: development
      SECRET_KEY: ci-only-docker-smoke-secret-key-0123456789abcdef0123456789
      DOCKER_BUILDKIT: "1"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The images are built with the version a release would pass, so the
      # label step below runs the release's own check (scripts/
      # check_image_labels.py) unchanged, rather than a weaker copy of it.
      - name: Version
        id: version
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"

      # The UTC date, passed to the image builds below as OS_PACKAGES_REFRESHED:
      # a new date re-runs the Dockerfiles' OS package upgrade layer even when
      # the build cache holds an older copy of it (see backend/Dockerfile).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: core
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-api:core
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      # The full image is what a self-hoster who runs the modules gets, and no
      # job built it: a module-only dependency missing from the image surfaced
      # as a refused SAML login in production, never as a red build. It is built in this job rather than
      # its own because the `builder` and `runtime` stages are already in this
      # job's layer cache from the core build above, so the extra work is one
      # pip install of the module closure -- a couple of minutes inside the
      # existing 25-minute budget, against ~8 for a cold job of its own.
      - name: Build API image (full profile)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: full
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-api:full
          cache-from: |
            type=gha,scope=api
            type=gha,scope=api-full
          cache-to: type=gha,scope=api-full,mode=max

      # The deny-list is DERIVED, not typed: every distribution
      # modules/requirements.lock pins that backend/requirements/runtime.lock
      # does not. Those two locks are what the two stages install, so their
      # difference is exactly "what full adds". The six hand-written names
      # this replaced had already gone stale -- `requests` and `defusedxml`
      # were in the core image with no core importer, and neither was on the
      # list -- and a derived list also covers the closure (lxml, xmlsec,
      # pyarrow, thrift, oauthlib, ...) that nobody would have typed out.
      # Distribution names, checked against importlib.metadata: no guessing
      # which import name `python3-saml` answers to.
      - name: Module dependencies are in the full image and only there
        run: |
          set -euo pipefail
          MODULE_ONLY="$(python3 scripts/module_only_packages.py --oneline)"
          echo "module-only distributions: $MODULE_ONLY"
          docker run --rm -e MODULE_ONLY="$MODULE_ONLY" --entrypoint python experimently-api:full -c '
          import importlib.util, os, re
          from importlib import metadata
          wanted = set(os.environ["MODULE_ONLY"].split())
          installed = {re.sub(r"[-_.]+", "-", d.metadata["Name"]).lower()
                       for d in metadata.distributions() if d.metadata["Name"]}
          missing = sorted(wanted - installed)
          assert not missing, "full image is missing module dependencies: %s" % missing
          assert os.environ["EXPERIMENTLY_PROFILE"] == "full", os.environ["EXPERIMENTLY_PROFILE"]
          # find_spec, not import: this asserts the package the loader looks for
          # is in the image, without running the registration chain, which needs
          # settings this container has not been given.
          assert importlib.util.find_spec("modules") is not None, "no modules package in the full image"
          print("full image: all %d module dependencies and modules/ present" % len(wanted))
          '
          # The core image must carry none of them, or 'core' means nothing.
          docker run --rm -e MODULE_ONLY="$MODULE_ONLY" --entrypoint python experimently-api:core -c '
          import importlib.util, os, re
          from importlib import metadata
          wanted = set(os.environ["MODULE_ONLY"].split())
          installed = {re.sub(r"[-_.]+", "-", d.metadata["Name"]).lower()
                       for d in metadata.distributions() if d.metadata["Name"]}
          leaked = sorted(wanted & installed)
          assert not leaked, "core image ships module-only packages: %s" % leaked
          assert importlib.util.find_spec("modules") is None, "core image ships a modules package"
          assert os.environ["EXPERIMENTLY_PROFILE"] == "core", os.environ["EXPERIMENTLY_PROFILE"]
          print("core image: none of the %d module dependencies, no modules/" % len(wanted))
          '
          # No test tree, no CDK app, no dashboard code: .dockerignore keeps the
          # first two out of the build context and the Dockerfile copies
          # modules/backend rather than modules/ whole.
          docker run --rm --entrypoint sh experimently-api:full -c '
          for unwanted in backend/tests infrastructure frontend lambda; do
            if [ -d "/app/modules/$unwanted" ]; then
              echo "the image ships modules/$unwanted"
              exit 1
            fi
          done
          echo "full image: no tests, no CDK, no dashboard code"
          '

      # The warehouse query builder re-parses every statement it generates
      # with sqlglot, behind a guarded import that refuses every query when
      # sqlglot is missing -- so a full image without it would boot and then
      # refuse every warehouse analysis, with nothing red. `import`, not
      # find_spec, and a parse, so a broken install fails too. duckdb is the
      # tests' in-process engine (modules/requirements-test.txt) and must be in
      # neither image; the core image carries no sqlglot either.
      - name: Warehouse query dependencies are exactly where they belong
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python experimently-api:full -c '
          import importlib.util
          import sqlglot
          from sqlglot import exp
          tree = sqlglot.parse_one("SELECT FORMAT(\x27%.17g\x27, 1.5) AS k", read="bigquery")
          assert isinstance(tree, exp.Select), type(tree)
          assert importlib.util.find_spec("duckdb") is None, "the full image ships duckdb"
          # The BigQuery and Snowflake connectors sign in with PyJWT at fixed
          # endpoints; no Google or Snowflake client library belongs in the image.
          import jwt
          for name in ("google.auth", "google.oauth2", "google.cloud.bigquery", "snowflake.connector"):
              try:
                  found = importlib.util.find_spec(name)
              except ModuleNotFoundError:
                  found = None
              assert found is None, "the full image ships " + name
          print("full image: sqlglot", sqlglot.__version__, "imports and parses; PyJWT", jwt.__version__, "; no duckdb, no Google or Snowflake client library")
          '
          docker run --rm --entrypoint python experimently-api:core -c '
          import importlib.util
          for name in ("sqlglot", "duckdb"):
              assert importlib.util.find_spec(name) is None, "the core image ships " + name
          print("core image: neither sqlglot nor duckdb")
          '

      # The LLM features import their provider SDKs inside functions, so an
      # image without them boots, reports healthy, and fails every LLM call at
      # request time -- which is how both images shipped with neither
      # `anthropic` nor `openai` (#196), under a unit suite that mocked them.
      # The list is DERIVED from the four files that make a real provider call
      # (scripts/llm_sdk_imports.py walks every import, function-local ones
      # included), the same list backend/tests/unit/scripts/test_llm_sdk_imports.py
      # checks in the test venv. Here it is checked in the images, which
      # install runtime.lock rather than backend/requirements.txt: a pin added
      # to one and not the other passes the unit test and fails this.
      # `import`, not find_spec, so an SDK whose own dependency is missing
      # fails too. Nothing is excluded: the Gemini provider imports no
      # google.* package (#275), so one appearing fails here.
      - name: LLM call paths import in both images
        run: |
          set -euo pipefail
          LLM_IMPORTS="$(python3 scripts/llm_sdk_imports.py --oneline)"
          echo "LLM call-path imports: $LLM_IMPORTS"
          for image in experimently-api:core experimently-api:full; do
            docker run --rm -e LLM_IMPORTS="$LLM_IMPORTS" --entrypoint python "$image" -c '
          import importlib, os
          names = os.environ["LLM_IMPORTS"].split()
          assert {"anthropic", "openai"} <= set(names), names
          failed = []
          for name in names:
              try:
                  importlib.import_module(name)
              except Exception as exc:
                  failed.append("%s: %s: %s" % (name, type(exc).__name__, exc))
          assert not failed, "missing from the image:\n  " + "\n  ".join(failed)
          print("%d LLM call-path imports load" % len(names))
          '
          done

      # Every job here runs ENVIRONMENT=development, where the hardening
      # validators are all off -- so nothing ever ran this image the way a
      # deployment does. `modules.register(hooks)` builds the modules' settings
      # as its first step, and their AUDIT_HMAC_KEY validator rejects the
      # shipped dev default in staging/production: with the secret missing the
      # registration fails, main.py's abort_if_modules_broken() refuses to
      # start, and migrations/env.py fails every alembic command with it. The
      # variables below are the ones a production task definition injects
      # (infrastructure/cdk/stacks/fargate_service_stack.py).
      #
      # That correspondence is maintained BY HAND and nothing checks it, which
      # is how this step broke once already: PUBLIC_BASE_URL was added to both
      # task definitions and not here, so the image refused to boot on a change
      # whose unit tests were green. If you add a variable the application
      # demands in production, it belongs in three places -- both CDK stacks
      # and this list.
      #
      # `--entrypoint python` bypasses backend/docker-entrypoint.sh, so the
      # start-up check (backend/app/core/preflight.py) does NOT run here, and
      # no POSTGRES_SERVER is needed: this step is about what the settings and
      # the module registration accept at import. The check itself is the next
      # step, through the real entrypoint.
      - name: Full image boots with production settings
        run: |
          set -euo pipefail
          KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          prod=(
            -e ENVIRONMENT=production
            -e SECRET_KEY="$KEY"
            -e FIRST_SUPERUSER_PASSWORD="$KEY"
            -e POSTGRES_PASSWORD=ci-only-not-a-real-password
            # What the API task sets for Redis (#147); never connected to here.
            -e REDIS_HOST=localhost
            -e REDIS_PORT=6379
            -e REDIS_SSL=true
            # A production start must know what hostname it answers on: the
            # Host header is attacker-controlled and ALLOWED_HOSTS derives from
            # this (#220). Never resolved here -- the import opens no socket.
            -e PUBLIC_BASE_URL=https://controlvar.example.com
          )
          # Importing main.py runs the registration and the abort check; it
          # opens no connection, so no database or Redis is needed here.
          docker run --rm "${prod[@]}" -e AUDIT_HMAC_KEY="$KEY" \
            --entrypoint python experimently-api:full -c '
          import backend.app.main  # noqa: F401 -- the import IS the test
          from backend.app.core import hooks
          from backend.app.modules_loader import modules_failure
          assert modules_failure() is None, modules_failure()
          signer = type(hooks.audit_signer).__name__
          assert signer != "NullAuditSigner", "full image writes UNSIGNED audit events"
          print("full image in production: modules registered, audit signer is", signer)
          '
          # ...and without that one secret it must refuse, naming it, rather
          # than serve a core profile behind a full label.
          if docker run --rm "${prod[@]}" --entrypoint python \
               experimently-api:full -c 'import backend.app.main' 2>refused.log; then
            echo "::error::the full image started with no AUDIT_HMAC_KEY"
            exit 1
          fi
          grep -q AUDIT_HMAC_KEY refused.log
          echo "full image with no AUDIT_HMAC_KEY: refused, and the message names it"
          rm -f refused.log

      # The entrypoint's start-up check (#237), through the real entrypoint:
      # every missing setting in one list, exit 78, before the database wait.
      # Each refusal is a planted defect against an otherwise good set; the
      # unit tests (backend/tests/unit/core/test_preflight.py) cover the rest.
      - name: Production start-up lists every missing setting at once
        run: |
          set -euo pipefail
          # <image> <log> [docker run args...]: must exit 78, without waiting
          # for a database. `timeout` because a check that fell through to the
          # wait would otherwise sit there for DB_WAIT_TIMEOUT.
          expect_refusal() {
            local image=$1 log=$2 status=0
            shift 2
            timeout 60 docker run --rm "$@" "$image" >"$log" 2>&1 || status=$?
            cat "$log"
            if [ "$status" != 78 ]; then
              echo "::error::expected exit 78 from the start-up check, got $status"
              exit 1
            fi
            if grep -q "waiting for PostgreSQL" "$log"; then
              echo "::error::the start-up check let the container reach the database wait"
              exit 1
            fi
          }
          # `if grep` rather than `! grep`: a negated command never trips -e.
          refuse_text() {
            if grep -qF -- "$1" "$2"; then
              echo "::error::$2 contains '$1'"
              exit 1
            fi
          }

          # Full image, ENVIRONMENT=production and nothing else: one list.
          expect_refusal experimently-api:full full.log -e ENVIRONMENT=production
          grep -qF "Controlvar cannot start: 5 settings need attention." full.log
          for s in SECRET_KEY FIRST_SUPERUSER_PASSWORD PUBLIC_BASE_URL AUDIT_HMAC_KEY POSTGRES_SERVER; do
            grep -qE "^  - $s " full.log || { echo "::error::$s is not in the list"; exit 1; }
          done
          grep -qF "https://controlvar.example.com" full.log
          refuse_text "continuing on the core profile" full.log
          refuse_text "<value>" full.log
          refuse_text "api.example.com" full.log

          # Core image: the same, without the full profile's audit key.
          expect_refusal experimently-api:core core.log -e ENVIRONMENT=production
          grep -qF "Controlvar cannot start: 4 settings need attention." core.log
          refuse_text AUDIT_HMAC_KEY core.log

          KEY=$(python3 -c 'import secrets; print(secrets.token_hex(32))')
          good=(
            -e ENVIRONMENT=production
            -e SECRET_KEY="$KEY"
            -e FIRST_SUPERUSER_PASSWORD="$KEY"
            -e PUBLIC_BASE_URL=https://controlvar.example.com
            -e AUDIT_HMAC_KEY="$KEY"
            -e POSTGRES_SERVER=db.invalid
          )
          # A connection string the image does not read.
          expect_refusal experimently-api:full url.log "${good[@]}" \
            -e DATABASE_URL=postgresql://user:pw@db.invalid/experimentation
          grep -qF "DATABASE_URL is set but this image does not connect with it" url.log
          grep -qF "cannot start: 1 setting needs attention." url.log
          refuse_text "user:pw@" url.log

          # No environment named at all: one line.
          expect_refusal experimently-api:full noenv.log
          grep -qxF "[preflight] ENVIRONMENT is not set. This image requires it: set ENVIRONMENT=production (or staging; development only for a local trial)." noenv.log

          # The test runner's environment is not one the image runs in: one line.
          expect_refusal experimently-api:full testenv.log -e ENVIRONMENT=test
          grep -qxF "[preflight] ENVIRONMENT=test is for the test runner, not this image: set ENVIRONMENT=production (or staging; development only for a local trial)." testenv.log

          # TESTING with production: refused in one line, even with every other
          # setting good (the settings would otherwise refuse it only at import,
          # after the database wait and the migrations).
          expect_refusal experimently-api:full testing.log "${good[@]}" -e TESTING=true
          grep -qxF "[preflight] TESTING is for the test runner and cannot be combined with ENVIRONMENT=production. Remove TESTING from this deployment's configuration." testing.log

          # The good set passes the check (`true` stands in for the server;
          # no database, so no wait and no bootstrap).
          docker run --rm "${good[@]}" -e WAIT_FOR_DB=false -e RUN_MIGRATIONS=false \
            experimently-api:full true
          # ...and so does APP_ENV alone, which is what the CDK task
          # definitions set instead of ENVIRONMENT.
          docker run --rm -e APP_ENV=dev -e WAIT_FOR_DB=false -e RUN_MIGRATIONS=false \
            experimently-api:core true
          rm -f full.log core.log url.log noenv.log testenv.log testing.log
          echo "start-up check: every refusal fired, and a good set starts"

      # The entrypoint's OpenSSL fallback (#1265) reaches a process started
      # later with `docker exec`, not only the entrypoint's own children. No
      # runner has the arm64 CPU that crashes, so the script runs against a
      # model of it; tests/docker/openssl_fallback.sh says what a pass means.
      - name: OpenSSL fallback reaches every Python process in the container
        run: |
          set -euo pipefail
          for image in experimently-api:core experimently-api:full; do
            bash tests/docker/openssl_fallback.sh "$image"
          done

      - name: Build dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPERIMENTLY_PROFILE=core
            VERSION=${{ steps.version.outputs.version }}
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-web:core
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

      # The dashboard's access log writes no query string (#1098), checked in
      # the image just built: the rendered nginx config, then the lines three
      # requests leave. tests/web/access_log.sh says what a pass means.
      - name: Dashboard access log leaves query strings out
        run: bash tests/web/access_log.sh experimently-web:core

      # The check release.yml runs on every published image, run here on every
      # pull request so a label regression is caught before a tag. It includes
      # the source label: the dashboard's nginx base sets
      # org.opencontainers.image.source to nginx's repository, and an image
      # that does not override it says it came from there (#239).
      - name: Images carry the labels a release asserts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          for pair in experimently-api:core=core experimently-api:full=full \
                      experimently-web:core=core; do
            image="${pair%=*}"
            profile="${pair#*=}"
            docker image inspect "$image" > image.json
            echo "== $image"
            python3 scripts/check_image_labels.py \
              --file image.json --version "$VERSION" --profile "$profile"
          done
          rm -f image.json

      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --wait --no-build postgres redis api frontend

      # The first start creates FIRST_SUPERUSER and says so (#237). The ALB
      # step below re-creates the api container on the same database, and
      # checks the other half: a later start says FIRST_SUPERUSER is ignored.
      - name: The first start announces the first administrator
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml logs --no-color api >api-first.log
          grep -qF "created the first administrator admin@demo.com (role ADMIN)" api-first.log \
            || { cat api-first.log; echo "::error::no first-administrator line"; exit 1; }

      - name: API readiness and auth gate
        run: |
          curl -sf localhost:8000/health/ready -o ready.json
          cat ready.json
          grep -q '"status":"healthy"' ready.json
          curl -sf localhost:8000/health/live >/dev/null
          # /api/v1/experiments 307-redirects to the trailing-slash route; follow it.
          code=$(curl -sL -o /dev/null -w '%{http_code}' localhost:8000/api/v1/experiments)
          test "$code" = "401" || { echo "expected 401 without credentials, got $code"; exit 1; }

      - name: Login, create an API key, assign a user (sdk_contract_ab)
        run: |
          set -euo pipefail
          TOKEN=$(curl -sf -X POST localhost:8000/api/v1/auth/login \
            -H 'content-type: application/json' \
            -d '{"email":"admin@demo.com","password":"Demo1234!"}' | jq -er .access_token)
          curl -sf localhost:8000/api/v1/auth/me -H "Authorization: Bearer $TOKEN" | jq -e '.role == "ADMIN"' >/dev/null
          KEY=$(curl -sf -X POST localhost:8000/api/v1/api-keys \
            -H "Authorization: Bearer $TOKEN" -H 'content-type: application/json' \
            -d '{"name":"docker-smoke"}' | jq -er .key)
          curl -sf -X POST localhost:8000/api/v1/tracking/assign \
            -H "X-API-Key: $KEY" -H 'content-type: application/json' \
            -d '{"experiment_key":"sdk_contract_ab","user_id":"docker-smoke-user"}' \
            | tee /dev/stderr | jq -e '.variant_id' >/dev/null

      - name: Dashboard through nginx
        run: |
          set -euo pipefail
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/login)" = "200"
          # Fetch to files: piping curl into `grep -q` makes curl exit 23
          # (SIGPIPE) once grep stops reading, which `pipefail` turns into a
          # step failure for any page larger than the pipe buffer.
          curl -s localhost:3000/results/abc -o results.html
          curl -s localhost:3000/docs -o docs.html
          # dynamic route: the results page html, not the login page / 404
          grep -q '"page":"/results/\[id\]"' results.html
          # /docs is a hub of links into the documentation (P3.4): the page is
          # served, and its links leave the dashboard's origin.
          #
          # Both URL shapes are accepted, because `docsUrl()` has two modes and
          # this must not pin one. The default is a GitHub blob URL
          # (`.../docs/getting-started/quick-start.md`); setting
          # NEXT_PUBLIC_DOCS_URL to a built MkDocs site gives the trailing-slash
          # directory form (`.../getting-started/quick-start/`). This assertion
          # used to accept only the second, which is why changing the default
          # failed here -- correctly: it is exactly the pin doing its job.
          #
          # What it does NOT prove is that the link resolves. It cannot: the
          # target repository is private and has no published docs site yet.
          # `docs-links.test.ts` covers the half that can be checked offline --
          # that every linked page exists under docs/.
          grep -q 'Controlvar Documentation' docs.html
          grep -qE 'href="https?://[^"]+/getting-started/quick-start(\.md|/)"' docs.html
          # /api and /health are proxied to the api container
          curl -sf localhost:3000/health/ready >/dev/null
          test "$(curl -sL -o /dev/null -w '%{http_code}' localhost:3000/api/v1/experiments/)" = "401"

      # The step above proves the SDKs import; this proves they WORK in the
      # image: a POST /complete per provider goes through the real SDK -- client
      # construction from ANTHROPIC_* / OPENAI_*, request, response parsing --
      # to tests/llm/stub_provider.py on the compose network, and must come
      # back 200 with the stub's text. The placeholder keys are set on the
      # re-created api container by the override file only; no job in this
      # repository sets a real LLM key, so nothing here can reach a provider.
      # The ALB step below re-creates the api again without them. smoke.sh
      # refuses to run without CI=true, which Actions sets for every step and
      # nothing in this job overrides, so a local run cannot repoint a
      # developer's stack by accident.
      - name: LLM proxy through the real SDKs (stub provider)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f tests/llm/docker-compose.llm-stub.yml \
            up -d --wait --no-build api llm-stub
          bash tests/llm/smoke.sh

      # The steps above run with the API's Host check OFF (development, no
      # PUBLIC_BASE_URL), so their 401 says nothing about the deployed shape,
      # where a Host the API does not serve is refused with 400 on every
      # non-probe path while the probes stay green. This re-creates the api and
      # frontend in the planned AWS topology (tests/alb/docker-compose.alb.yml:
      # an nginx playing the ALB, the dashboard's nginx not proxying /api, and
      # PUBLIC_BASE_URL=https://app.example.test) and checks it through that
      # ALB with the public Host (tests/alb/rehearse.sh).
      #
      # A step rather than its own job: it reuses the images and the seeded
      # database already in this job; a job of its own would have to build and
      # load both images again. Measured locally, the re-create plus every
      # check took 18 s and 29 s in two runs.
      #
      # Tamper-tested locally: PUBLIC_BASE_URL=https://api.example.test fails
      # with "expected 401 without credentials, got 400" (while /health/ready
      # is 200); /api/* routed to the dashboard fails with "got 502";
      # PUBLIC_BASE_URL empty fails the foreign-Host check with 401; the
      # dashboard proxying /api and a connect-src without 'self' fail too.
      - name: ALB topology rehearsal (Host check on)
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml -f tests/alb/docker-compose.alb.yml \
            up -d --wait --no-build postgres redis api frontend alb
          bash tests/alb/rehearse.sh
          docker compose -f docker-compose.yml -f tests/alb/docker-compose.alb.yml \
            logs --no-color api >api-second.log
          grep -qF "users exist; FIRST_SUPERUSER settings ignored" api-second.log \
            || { cat api-second.log; echo "::error::a later start did not say FIRST_SUPERUSER is ignored"; exit 1; }

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.yml -f tests/alb/docker-compose.alb.yml -f tests/llm/docker-compose.llm-stub.yml logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f tests/alb/docker-compose.alb.yml -f tests/llm/docker-compose.llm-stub.yml down -v --remove-orphans

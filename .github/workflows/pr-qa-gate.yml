name: PR QA Gate

# PLANTED, throwaway branch, plant iii; never merge.
# Only changes, core-build-shard and core-build run here, beside one
# other workflow kept as it is; every other workflow is under .tamper-workflows/
# and the build jobs put them back for the tests.

on:
  pull_request:
    branches: [main]

concurrency:
  # Keyed on the pull request NUMBER, not head_ref: two forks' `patch-1`
  # branches share a head_ref and would cancel each other's runs (#75).
  group: pr-qa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Is this change documentation only?
  #
  # The heavy jobs below take ~40 minutes and none of them can observe a change
  # to docs/. Running them on a documentation pull request buys nothing and is
  # the reason a typo fix took as long as a schema migration.
  #
  # The jobs are SKIPPED rather than not triggered: branch protection requires
  # 20 checks to report, so a workflow that simply does not run on docs/**
  # leaves every one of them missing and the pull request blocked for ever.
  #
  # A job-level `if:` is enough ONLY for a plain job, whose skipped check keeps
  # its name and is accepted. It is NOT enough for a job that protection names
  # by an expanded or called name: a skipped reusable-workflow caller reports
  # as `SDK Live Contract` and never as
  # `SDK Live Contract / sdk-live-contract (core)`, and a matrix skipped before
  # it expands reports its unexpanded name -- `core-build` and `full-build`
  # were the matrix `${{ matrix.profile }}-build` until #869. That is what left
  # #133 (docs/auth/sso.md only) BLOCKED with every check that ran green. So
  # `sdk-live-contract`, `core-build` and `full-build` always run, and every
  # one of their steps is conditioned instead: the checks report under their
  # real names, in seconds, and on a docs-only change core-build still runs
  # the tests that pin docs/ content.
  # backend/tests/unit/infrastructure/test_docs_only_gate.py pins all of it.
  #
  # The classification is scripts/classify_changes.py (docs/ except docs/api/,
  # plus mkdocs.yml; an empty list is not docs-only). `--no-renames` is
  # load-bearing: without it `git mv backend/a.py docs/a.py` lists only
  # docs/a.py and a code change is classed as documentation.
  #
  # Leak Guard and Doc Examples are separate workflows and run on every pull
  # request, docs-only included. Neither is where docs content is REQUIRED to
  # pass: Doc Examples is not a required check, and Docs has no pull_request
  # trigger at all (documentation merges without a site-build gate; founder,
  # 2026-09-24). The required home of the docs tests is core-build below.
  #
  # A classifier that fails runs EVERYTHING. A job whose `needs:` failed is
  # skipped, and protection accepts a skipped check, so the plain
  # `docs_only != 'true'` form turned a crashed classifier into a green gate
  # with nothing run. Every classified job is instead
  #   ${{ !cancelled() && (needs.changes.result != 'success' || <its lane>) }}
  # and the three jobs below that must never skip are `${{ !cancelled() }}`.
  # `!cancelled()` would also run a job after ANY of its needs failed, so
  # every one of them needs `changes` alone. The step collects the file list
  # and the verdict into variables first and writes one checked line last:
  # a failure part-way leaves `$GITHUB_OUTPUT` untouched, never a half answer.
  # backend/tests/unit/infrastructure/test_ci_classification.py pins the
  # exact `if:` and `needs:` of every job, and runs this step's script.
  changes:
    name: Detect docs-only change
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.check.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          files="$(git diff --no-renames --name-only "$BASE" "$HEAD")"
          lane="$(printf '%s\n' "$files" | python3 scripts/classify_changes.py)"
          case "$lane" in
            docs_only=true | docs_only=false) ;;
            *) printf '::error::the classifier printed %s, not one docs_only line\n' "$lane" >&2; exit 1 ;;
          esac
          printf '%s\n' "$lane" >> "$GITHUB_OUTPUT"

  # Each profile must stand on its own. scripts/core_build.sh copies the
  # checkout and runs one sequence over the copy; `--profile core` deletes
  # modules/ and every path modules-manifest.txt still lists outside it (a
  # boundary regression fails there), `--profile full` deletes nothing.
  #
  # Both profiles run: REUSE licensing and gitleaks over the tree that profile
  # would ship, `import backend.app.main` in the right profile, bootstrap on
  # Postgres 16 into a scratch schema (exactly that profile's tables), the
  # dashboard build with the module-route grep, and the shipped-licence
  # allow-list over that profile's dependency closure.
  #
  # The pytest sessions are core-only, and deliberately: `--profile full`
  # leaves the tree exactly as the checkout is, so its unit / integration /
  # smoke / module / Lambda / golden-vector sessions would re-run, in an
  # hour-long job, what unit-tests, integration-tests.yml, smoke-tests,
  # module-tests and sdk-contracts already ran on that same tree in minutes.
  # `--profile core` runs them because there they run against a DIFFERENT
  # tree -- one with modules/ deleted -- which nothing else exercises.
  #
  # The same sequence as `make core-build` / `make full-build`; the step that
  # failed is named in the last line of the log.
  #
  # The core profile runs in four jobs, `core-build (shard N)`, each
  # `scripts/core_build.sh --profile core --shard N/4`: the unit and
  # integration sessions are cut into four slices (a test is in slice N when
  # sha256(its node id) % 4 == N-1, backend/tests/shard.py), shard 1 also runs
  # every other step, and shards 2-4 run copy, strip and import before their
  # slices, so every shard checks that its tree cannot import `modules`. The
  # required check `core-build` is the summary job after them. `full-build`
  # is one job, reporting under its id. The environment and the Postgres
  # service are the same in the shards and full-build and are kept the same
  # by backend/tests/unit/infrastructure/test_docs_only_gate.py.
  #
  # No classification `if:` at job level, only `!cancelled()` (see the
  # `changes` job): on a docs-only change every step of the shards and of
  # full-build is skipped except the printed reason, and core-build runs the
  # tests that pin docs/ content -- which is why a docs-only pull request
  # still starts the shards and their services.
  #
  # Time. As one job, core-build took 97 to 146 minutes in eight passing runs
  # on 2026-11-25: of its script, the unit session 38-42%, integration
  # 54-59%, smoke 2-3%, the other ten steps under 1.2 minutes together.
  # Runners differ up to 1.6x in speed for the same commit, and the time
  # grows about 2-3 minutes a day. A shard is about a quarter of the two
  # sessions plus its setup, and shard 1 also 3-5 minutes of other steps: the
  # intent is 30-55 minutes a shard, to be replaced here by the shards'
  # measured times. The limit is 75; a shard that takes over 60 minutes means
  # a fifth shard in the matrix, not a higher limit. full-build takes a few
  # minutes and keeps 180.
  core-build-shard:
    name: core-build (shard ${{ matrix.shard }})
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      # One red shard must not cancel the others: the summary needs every
      # shard's report to say which tests failed and that the rest ran.
      fail-fast: false
      matrix:
        # The one hand-typed list. The total is `strategy.job-total`, never
        # typed: a repeated or missing number leaves a shard number with no
        # report, and the summary refuses that.
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # For the Redis-backed integration tests (the experiment cache, the flag
      # reads after every writer), as in integration-tests.yml. The core
      # shards only: full-build runs no pytest session. With the two
      # EXPERIMENTLY_REQUIRE_* variables on the `core build` step a missing
      # Redis fails those tests instead of skipping them (#899).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      APP_ENV: test
      TESTING: 'true'
      POSTGRES_SERVER: localhost
      POSTGRES_HOST: localhost
      POSTGRES_PORT: '5432'
      POSTGRES_DB: experimentation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      GITLEAKS_VERSION: '8.30.1'
      # Repository tooling, same versions as the Makefile; installed here
      # rather than pinned in backend/requirements.txt, which is the product's
      # dependency list and feeds THIRD_PARTY_LICENSES.md.
      REUSE_VERSION: '6.2.0'
      PIP_LICENSES_VERSION: '5.5.5'
    steps:
      - name: Docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "docs-only change: this shard builds nothing; core-build runs the tests that pin docs/ content."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.docs_only != 'true'

      - name: "PLANTED: restore the workflows the tests read"
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          cp .tamper-workflows/*.yml .github/workflows/
          git rm -r -q --cached .tamper-workflows
          rm -rf .tamper-workflows
          git add .github/workflows

      - name: Set up Python
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        if: needs.changes.outputs.docs_only != 'true'
        run: pip install -r backend/requirements.txt "reuse==${REUSE_VERSION}" "pip-licenses==${PIP_LICENSES_VERSION}"

      - name: Install gitleaks
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # The AWS installer beta's clean path runs the real jq in the unit session, the one
      # this image ships; the installer accepts 1.7 or later (checks.sh). This line is how
      # a later image with another jq shows in the log.
      - name: The jq these tests run with
        if: needs.changes.outputs.docs_only != 'true'
        run: jq --version

      # A second Redis that requires a password, for
      # backend/tests/integration/test_redis_password_auth.py, started the
      # same way as in integration-tests.yml: a service container takes no
      # command. The password is generated per run and handed to the tests
      # through GITHUB_ENV.
      - name: Start a password-protected Redis
        if: needs.changes.outputs.docs_only != 'true'
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name redis-auth -p 6380:6379 redis:7-alpine \
            redis-server --requirepass "${password}"
          for _ in $(seq 1 30); do
            if docker exec redis-auth redis-cli --no-auth-warning -a "${password}" ping | grep -q PONG; then
              {
                echo "REDIS_AUTH_TEST_PORT=6380"
                echo "REDIS_AUTH_TEST_PASSWORD=${password}"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs redis-auth
          exit 1

      # core_build.sh runs every pytest session in the copy with this
      # environment, so the integration session gets both variables: a Redis
      # test that skips there is a failure. No EXPERIMENTLY_REQUIRE_EDITABLE:
      # this job has no editable install, so test_the_integration_job_is_armed
      # keeps its skip here. The shard variables are not set here: the script
      # gives them to the unit and integration sessions alone, and refuses to
      # run if they are already set. The report directory is outside the
      # checkout and the copy, so a passing run's cleanup keeps it.
      - name: core build
        if: needs.changes.outputs.docs_only != 'true'
        env:
          EXPERIMENTLY_REQUIRE_REDIS: "1"
          EXPERIMENTLY_REQUIRE_REDIS_AUTH: "1"
        run: scripts/core_build.sh --profile core --shard ${{ matrix.shard }}/${{ strategy.job-total }} --shard-reports "$RUNNER_TEMP/core-build-shard-reports"

      # Even when the build failed: the summary reads every shard's two
      # reports. `overwrite`, because a re-run of one shard uploads the same
      # name again. Three days: the summary reads them minutes later, and a
      # unit shard's report was 5.6 MB (0.6 MB compressed) in a local run.
      - name: Upload the shard reports
        uses: actions/upload-artifact@v7
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        with:
          name: core-build-shard-report-${{ matrix.shard }}
          path: ${{ runner.temp }}/core-build-shard-reports/
          if-no-files-found: warn
          overwrite: true
          retention-days: 3

  # The required check, under its id (no `name:`): green only when every shard
  # succeeded and, on a code change, the shards between them ran every
  # collected unit and integration test exactly once. A classifier that
  # failed is red here too, because this job reads `changes` among its needs.
  #
  # `always()`, like integration-tests.yml's summary, so that it always
  # reports an explicit result and a failure names what failed. The cost:
  # when a newer push supersedes a pull request's run, the old run holds the
  # concurrency group until this job has started and run: about 8-15 s,
  # measured on integration-tests.yml's summary, which started 2-4 s after
  # the last cancelled shard ended and ran 6-11 s.
  #
  # On a docs-only change it runs the tests that pin docs/ content, which is
  # where those tests are required to pass (see the `changes` job).
  core-build:
    needs: [changes, core-build-shard]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Docs-only change
        if: needs.changes.outputs.docs_only == 'true'
        run: |
          echo "docs-only change: the core-build (shard N) jobs build nothing; this job runs only the tests that pin docs/ content."

      # The tree, for the shard checker or the docs tests, so no condition.
      # Python 3.11 for the docs tests only: the checker is standard library
      # only and runs on the runner's python3, as integration-tests.yml's.
      - uses: actions/checkout@v7

      - name: "PLANTED: restore the workflows the tests read"
        run: |
          cp .tamper-workflows/*.yml .github/workflows/
          git rm -r -q --cached .tamper-workflows
          rm -rf .tamper-workflows
          git add .github/workflows

      - name: Set up Python
        if: needs.changes.outputs.docs_only == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      # The tests that read docs/ -- directly or through a path built from the
      # repository root -- and would otherwise never run on the pull request
      # that breaks them, because unit-tests and smoke-tests skip on a
      # docs-only change. Only on a docs-only change: on any other change
      # unit-tests and smoke-tests run every one of them already. Which docs
      # readers are here and why the others are not is pinned, with reasons,
      # in backend/tests/unit/infrastructure/test_docs_only_gate.py.
      - name: Install backend dependencies (docs tests)
        if: needs.changes.outputs.docs_only == 'true'
        run: pip install -r backend/requirements.txt

      - name: Docs content tests
        if: needs.changes.outputs.docs_only == 'true'
        run: >-
          python -m pytest -p no:cov -q --tb=short --junitxml=docs-content-junit.xml
          backend/tests/unit/scripts/test_doc_examples.py
          backend/tests/unit/scripts/test_guide_blocks.py
          backend/tests/unit/docs/
          backend/tests/smoke/test_openapi_snapshot.py
          backend/tests/smoke/test_version_sources.py
          backend/tests/unit/infrastructure/test_dashboard_image_docs.py
          backend/tests/unit/infrastructure/test_rollback_uses_codedeploy.py
          backend/tests/unit/infrastructure/test_deploy_docs.py
          backend/tests/unit/infrastructure/test_iam_actions.py
          backend/tests/unit/infrastructure/test_rollback_runbook_env_check.py
          backend/tests/unit/db/test_alembic_plan.py
          modules/backend/tests/unit/services/test_sso_docs_messages.py
          backend/tests/unit/showcase/test_showcase_quoted_docs.py
          backend/tests/unit/ground_truth/test_contract_citations.py
          backend/tests/unit/showcase/test_site_walkthroughs.py
          backend/tests/unit/personas/

      # On a docs-only change this is where the docs tests run, Unit Tests
      # being skipped, so a docs test that skipped would read as a pass on
      # most of #1142's pull requests. Nothing under backend/tests/unit/docs
      # skips on this full checkout; the Unit Tests job checks the same
      # directory on every other change.
      - name: No docs content test was skipped
        if: needs.changes.outputs.docs_only == 'true'
        run: python3 scripts/check_junit_skips.py docs-content-junit.xml backend/tests/unit/docs

      # No report at all is the checker's to judge (it fails), so a download
      # that finds nothing must not end the job before it.
      - name: Collect the shard reports
        if: needs.changes.outputs.docs_only != 'true'
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: core-build-shard-report-*
          path: ${{ runner.temp }}/shard-reports

      - name: Every job passed
        env:
          # The whole `needs` object; a matrix job's result covers all its
          # legs. Only `success` passes: failure, cancelled (a timeout too)
          # and skipped are all red. On a docs-only change the shards run
          # only their printed reason, and succeed.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' > results.txt
          test -s results.txt || { printf '::error::needs produced no results\n'; exit 1; }
          failed=0
          while IFS='=' read -r job result; do
            printf '  %s: %s\n' "$job" "$result"
            case "$result" in
              success) ;;
              *) printf '::error::%s: %s\n' "$job" "$result"; failed=1 ;;
            esac
          done < results.txt
          if [ "$failed" -ne 0 ]; then
            printf '::error::core build failed\n'
            exit 1
          fi

      # Even after a failed shard, so the log says which tests failed and
      # whether the rest ran. `--only-suites`: a report of any other suite
      # here is red, not left alone. Skips are not judged, as before the split
      # (the single job allowed every skip; the two Redis variables already
      # turn a Redis skip into a failure): a test in no shard, in two, or not
      # run is still red. The sessions run with `-p no:cov`, the one plugin
      # allowed off. Not piped: `--github-annotations` prints each problem as
      # an annotation, and the checker's exit status is the step's.
      - name: Every test ran in exactly one shard
        if: ${{ always() && needs.changes.outputs.docs_only != 'true' }}
        run: |
          python3 scripts/check_test_shards.py \
            --suite backend/tests/unit \
            --suite backend/tests/integration \
            --only-suites \
            --github-annotations \
            --any-skip backend/tests/unit \
            --any-skip backend/tests/integration \
            --allow-disabled-plugin backend/tests/unit=cov \
            --allow-disabled-plugin backend/tests/integration=cov \
            "$RUNNER_TEMP/shard-reports"


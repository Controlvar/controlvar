name: Database Migration
run-name: Database migration (${{ inputs.direction }} ${{ inputs.target }}) on ${{ inputs.environment }}

# The MANUAL, targeted path: `alembic current`, then one `upgrade <target>` or
# `downgrade <target>`, on a database that already exists. A deploy runs its
# own migration (deploy.yml); this is for the cases a deploy does not cover,
# chiefly undoing one (docs/deployment/rollback-runbook.md).
#
# It runs with the image that is SERVING -- the API's PRIMARY task set -- so
# the migration scripts it can see are the ones the running code was built
# with. It used to run the `experimentation-migrate` family by name, which
# resolved to whatever any environment had registered last (#138).

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment whose database to migrate'
        required: true
        type: choice
        default: staging
        options: [staging, prod]
      direction:
        description: 'Migration direction'
        required: true
        type: choice
        default: upgrade
        options: [upgrade, downgrade]
      target:
        description: 'Alembic target. upgrade: heads. downgrade: the revision id to end at, e.g. 4c2c09a2b3e8 (the down_revision of the migration you are undoing; that example undoes 607c51a59bf5, which drops each flag''s value type and values and refuses while any flag is a string, number or json flag; one further, 37dcb2969766, also undoes 4c2c09a2b3e8, whose downgrade changes no table; modules_0001_rbac exists only in a full-profile image). Relative steps (-1, modules@-1), head and base are refused: a full image has two heads. A core id at or below a7b8c9d0e1f2 also unapplies the modules branch.'
        required: true
        type: string
        default: 'heads'

# Shares the deploy's group: a manual migration and a deploy's migration must
# never run against one database at once.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  AWS_REGION: us-west-2

jobs:
  migrate:
    name: Migrate ${{ inputs.environment }} (${{ inputs.direction }} ${{ inputs.target }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: ${{ inputs.environment }}
    permissions:
      id-token: write
      contents: read
    env:
      TARGET_ENV: ${{ inputs.environment }}
      DIRECTION: ${{ inputs.direction }}
      TARGET: ${{ inputs.target }}
      # The CDK's names; infrastructure/tests/test_workflow_names_exist.py
      # checks each against a synth of that environment.
      ECS_CLUSTER: experimentation-${{ inputs.environment }}
      ECS_BACKEND_SERVICE: experimentation-backend-${{ inputs.environment }}
      MIGRATE_TASK_FAMILY: experimentation-migrate-${{ inputs.environment }}
      MIGRATE_LOG_GROUP: /ecs/experimentation-migrate-${{ inputs.environment }}
      FARGATE_STACK: experimentation-fargate-${{ inputs.environment }}
      DATABASE_STACK: experimentation-database-${{ inputs.environment }}
    steps:
      # FIRST, and the only place the account ID is read (PE v1 C9). It is an
      # environment SECRET, never a variable: a step's log header prints its
      # evaluated `env:` before the step runs, so a variable's value would be
      # public before anything could mask it; a secret is masked from the
      # start of the job.
      - name: Refuse an environment that is not configured
        env:
          ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          ROLE_ARN_SET: ${{ secrets.AWS_ROLE_ARN != '' }}
        run: |
          set -euo pipefail
          if [ -z "$ACCOUNT_ID" ]; then
            echo "::error title=Not configured::secrets.AWS_ACCOUNT_ID is not set for the '${TARGET_ENV}' environment, so nothing was migrated. Set it as an environment secret under Settings → Environments → ${TARGET_ENV} → Environment secrets (gh secret set AWS_ACCOUNT_ID --env ${TARGET_ENV}); a variable of that name is not read. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          if ! [[ "$ACCOUNT_ID" =~ ^[0-9]{12}$ ]]; then
            echo "::error title=Not configured::secrets.AWS_ACCOUNT_ID for the '${TARGET_ENV}' environment is not a 12-digit AWS account id, so nothing was migrated. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          if [ "$ROLE_ARN_SET" != "true" ]; then
            echo "::error title=Not configured::secrets.AWS_ROLE_ARN is not set for the '${TARGET_ENV}' environment, so nothing was migrated. Set it under Settings → Environments → ${TARGET_ENV} → Secrets. See docs/deployment/README.md#before-the-first-deploy"
            exit 1
          fi
          echo "EXPECTED_ACCOUNT_ID=$ACCOUNT_ID" >> "$GITHUB_ENV"

      - name: Refuse a dispatch from any ref but main
        env:
          REF: ${{ github.ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (\"Use workflow from\"); you chose ${REF_NAME}."
            exit 1
          fi

      - name: Refuse a target alembic cannot take
        run: |
          set -euo pipefail
          # An allowlist: `heads` to upgrade, otherwise one revision id. A full
          # image has two heads (the core chain and the modules branch), so a
          # relative step (-1, +2), a branch-qualified one (modules@-1,
          # modules@base), `head` and `base` either fail or leave alembic to
          # pick a branch: `downgrade -1` exits 0 with only a warning, and was
          # measured stepping the modules branch back (#726). Nothing here
          # needs AWS, so a refusal costs no snapshot.
          RUNBOOK="docs/deployment/rollback-runbook.md#step-2-run-migration-downgrade-via-github-actions"
          NAME_THE_ID="Name the revision id to end at, e.g. 4c2c09a2b3e8 (which undoes 607c51a59bf5 and drops feature_flags.value_type, on_value and off_value, refusing while any flag is a string, number or json flag; 37dcb2969766 also undoes 4c2c09a2b3e8, which changes no table): to undo a release's migration, that is the down_revision line of the migration file it added (modules_0001_rbac exists only in a full-profile image). See ${RUNBOOK}"
          if ! [[ "$TARGET" =~ ^[A-Za-z0-9_@+~^-]{1,64}$ ]]; then
            # Not printed: it may hold anything, a newline included.
            echo "::error title=Target refused::target must be heads or a revision id; this one has other characters in it, so nothing was migrated. ${NAME_THE_ID}"
            exit 1
          fi
          if ! [[ "$TARGET" =~ ^[A-Za-z0-9_]{1,64}$ ]]; then
            echo "::error title=Relative target refused::target=${TARGET} is refused, so nothing was migrated. A full install has two heads (the core chain and the modules branch), and a relative or branch-qualified step leaves alembic to pick what it unapplies: downgrade -1 has been measured stepping the modules branch back, which drops the warehouse analysis tables. ${NAME_THE_ID}"
            exit 1
          fi
          if [ "$TARGET" = "head" ]; then
            echo "::error title=Target refused::target=head is refused, so nothing was migrated: a full-profile image has two heads (the core chain and the modules branch) and alembic rejects the singular. To upgrade, use heads. ${NAME_THE_ID}"
            exit 1
          fi
          if [ "$TARGET" = "base" ]; then
            echo "::error title=Target refused::target=base is refused, so nothing was migrated: it unapplies every revision and drops every table. To go back further than one migration can, the emergency route is a point-in-time restore to a new cluster, with the Engineering Lead (docs/deployment/rollback-runbook.md#step-3-emergency-point-in-time-restore-to-a-new-cluster). ${NAME_THE_ID}"
            exit 1
          fi
          if [ "$DIRECTION" = "downgrade" ] && [ "$TARGET" = "heads" ]; then
            echo "::error title=Target refused::a downgrade to heads is refused, so nothing was migrated: it changes nothing and would still take a snapshot. ${NAME_THE_ID}"
            exit 1
          fi
          if [ "$DIRECTION" = "downgrade" ]; then
            echo "::warning::DOWNGRADE of ${TARGET_ENV} to ${TARGET} requested by ${GITHUB_ACTOR}. A snapshot is taken first."
          fi

      - name: Check out the tooling (main)
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          # timeout-minutes x 60 <= this <= the role's MaxSessionDuration (10800);
          # test_aws_session_duration.py. The default, 3600, expires mid-job.
          role-duration-seconds: 5400
          # The ASSUMED account, which the wrong-account check below may find
          # is not the configured one; the configured one is a secret already.
          mask-aws-account-id: true

      # Neither account ID is printed: the log is public.
      - name: Refuse the wrong AWS account
        id: account
        run: |
          set -euo pipefail
          actual="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual" != "$EXPECTED_ACCOUNT_ID" ]; then
            echo "::error title=Wrong AWS account::environment=${TARGET_ENV}: the assumed role is not in the account in this environment's AWS_ACCOUNT_ID secret. Check that its AWS_ROLE_ARN secret names a role in that account. Nothing has been changed."
            exit 1
          fi

      - name: Read the Fargate stack's outputs
        id: fargate
        uses: ./.github/actions/stack-outputs
        with:
          stack: ${{ env.FARGATE_STACK }}
          keys: TaskSubnets TaskSecurityGroup
          environment: ${{ inputs.environment }}

      - name: Read the database stack's outputs
        id: database
        uses: ./.github/actions/stack-outputs
        with:
          stack: ${{ env.DATABASE_STACK }}
          keys: ClusterIdentifier
          environment: ${{ inputs.environment }}

      # The PRIMARY task set is what serves traffic on a CODE_DEPLOY service;
      # services[0].taskDefinition is frozen at CreateService.
      - name: Find the image that is serving
        id: serving
        run: |
          set -euo pipefail
          td="$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_BACKEND_SERVICE" \
                  --query "services[0].taskSets[?status=='PRIMARY'].taskDefinition | [0]" --output text)"
          case "$td" in
            ""|None|null)
              echo "::error::No release is serving in ${ECS_BACKEND_SERVICE} (it has no PRIMARY task set), so there is no image to migrate with. Deploy a release first: Actions → Deploy."
              exit 1
              ;;
          esac
          image="$(aws ecs describe-task-definition --task-definition "$td" \
                     --query "taskDefinition.containerDefinitions[?name=='backend'].image | [0]" --output text)"
          if [ -z "$image" ] || [ "$image" = "None" ]; then
            echo "::error::${td##*/}, which is serving, has no container named 'backend'."
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
          # family:revision and the image without its registry host: the
          # log is public, and both full forms name the account.
          echo "serving: ${td##*/} (${image#*/})"

      - name: Take a snapshot first
        id: snapshot
        env:
          DB_CLUSTER: ${{ fromJSON(steps.database.outputs.json).ClusterIdentifier }}
        run: |
          set -euo pipefail
          id="pre-migration-${TARGET_ENV}-$(date -u +%Y%m%d-%H%M%S)"
          aws rds create-db-cluster-snapshot \
            --db-cluster-identifier "$DB_CLUSTER" \
            --db-cluster-snapshot-identifier "$id" >/dev/null
          aws rds wait db-cluster-snapshot-available --db-cluster-snapshot-identifier "$id"
          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "snapshot $id of $DB_CLUSTER is available"

      # A revision of this environment's migration family naming the serving
      # image, run by its ARN (QA 1c).
      - name: Register the migration task definition with the serving image
        id: migrate-td
        env:
          IMAGE: ${{ steps.serving.outputs.image }}
        run: |
          set -euo pipefail
          # A deploy registers digests; a revision still on the CDK's bootstrap
          # tag is migrated with that tag's image, as the service runs it.
          case "$IMAGE" in
            *@sha256:*) arn="$(bash scripts/register_task_definition.sh "$MIGRATE_TASK_FAMILY" "$IMAGE")" ;;
            *)
              echo "::error::The serving image ${IMAGE#*/} is not pinned by digest, so which bytes it names can change under this migration. Deploy a release first: Actions → Deploy."
              exit 1
              ;;
          esac
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

      - name: Show the current revision
        env:
          TASK_DEFINITION: ${{ steps.migrate-td.outputs.arn }}
          SUBNETS: ${{ fromJSON(steps.fargate.outputs.json).TaskSubnets }}
          SECURITY_GROUP: ${{ fromJSON(steps.fargate.outputs.json).TaskSecurityGroup }}
        run: |
          set -euo pipefail
          network="$(jq -cn --arg subnets "$SUBNETS" --arg sg "$SECURITY_GROUP" \
            '{awsvpcConfiguration: {subnets: ($subnets | split(",")), securityGroups: [$sg], assignPublicIp: "DISABLED"}}')"
          overrides='{"containerOverrides":[{"name":"backend","command":["python","-m","alembic","-c","backend/app/db/alembic.ini","current"]}]}'
          bash scripts/run_migration_task.sh "$ECS_CLUSTER" "$TASK_DEFINITION" "$network" "$overrides" "$MIGRATE_LOG_GROUP"

      - name: Run the migration
        id: migrate
        env:
          TASK_DEFINITION: ${{ steps.migrate-td.outputs.arn }}
          SUBNETS: ${{ fromJSON(steps.fargate.outputs.json).TaskSubnets }}
          SECURITY_GROUP: ${{ fromJSON(steps.fargate.outputs.json).TaskSecurityGroup }}
        run: |
          set -euo pipefail
          network="$(jq -cn --arg subnets "$SUBNETS" --arg sg "$SECURITY_GROUP" \
            '{awsvpcConfiguration: {subnets: ($subnets | split(",")), securityGroups: [$sg], assignPublicIp: "DISABLED"}}')"
          # The operator's values become JSON strings through jq --arg, never
          # by splicing them into a JSON literal.
          overrides="$(jq -cn --arg direction "$DIRECTION" --arg target "$TARGET" \
            '{containerOverrides: [{name: "backend", command: ["python", "-m", "alembic", "-c", "backend/app/db/alembic.ini", $direction, $target]}]}')"
          bash scripts/run_migration_task.sh "$ECS_CLUSTER" "$TASK_DEFINITION" "$network" "$overrides" "$MIGRATE_LOG_GROUP"

      - name: Run summary
        if: always()
        env:
          IMAGE: ${{ steps.serving.outputs.image }}
          SNAPSHOT: ${{ steps.snapshot.outputs.id }}
          TASK_DEFINITION: ${{ steps.migrate-td.outputs.arn }}
          MIGRATION: ${{ steps.migrate.outcome }}
          JOB_STATUS: ${{ job.status }}
          ACCOUNT_CHECK: ${{ steps.account.outcome }}
        run: |
          # No account ID, no registry host, no full ARN: the summary is public.
          image="${IMAGE#*/}"
          task_definition="${TASK_DEFINITION##*/}"
          case "$ACCOUNT_CHECK" in
            success) account_cell="matches the environment's AWS_ACCOUNT_ID secret" ;;
            failure) account_cell="does NOT match the environment's AWS_ACCOUNT_ID secret" ;;
            *) account_cell="not checked" ;;
          esac
          {
            echo "## Database migration on ${TARGET_ENV}: ${JOB_STATUS}"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| Environment | \`${TARGET_ENV}\` |"
            echo "| Account / region | ${account_cell} / \`${AWS_REGION}\` |"
            echo "| Command | \`alembic ${DIRECTION} ${TARGET}\` |"
            echo "| Image (serving) | \`${image:-not found}\` |"
            echo "| Task definition | \`${task_definition:-not registered}\` |"
            echo "| Snapshot first | \`${SNAPSHOT:-none taken}\` |"
            echo "| Result | ${MIGRATION:-not run} |"
          } >> "$GITHUB_STEP_SUMMARY"

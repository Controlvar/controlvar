name: Release Gate

on:
  pull_request:
    branches: [main]
  # Every commit on main gets a Release Gate Summary, so the commit a
  # release tag points at carries one and the deploy's gate can pass (#137).
  # A tag trigger would not do it: release-please's tags are pushed with
  # GITHUB_TOKEN, which starts no workflows.
  push:
    branches: [main]
  workflow_dispatch:

# Pull requests share a group per branch and cancel superseded runs. A push to
# main is keyed by its commit and never cancelled: a pending run is replaced
# by a newer one in the same group, which on main would drop the gate of the
# commit a release is cut from.
concurrency:
  group: release-gate-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-gate:
    name: Backend Gate (Unit + Smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start deterministic backend test dependencies
        run: docker compose -f docker-compose.test.yml up -d postgres-test redis-test

      - name: Run backend release checks
        env:
          EP_TEST_PROFILE: compose
        run: ./scripts/run-backend-tests.sh release

      - name: Stop test dependencies
        if: always()
        run: docker compose -f docker-compose.test.yml down --remove-orphans

  frontend-gate:
    name: Frontend Gate (Test + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

      - name: Build frontend
        run: cd frontend && npm run build

  security-gate:
    name: Security Gate (Bandit + Gitleaks)
    runs-on: ubuntu-latest
    # gitleaks-action lists the PR's commits via the API on pull_request
    # events; the default token has no pull-requests scope, so grant it.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Bandit
        run: pip install bandit

      # Both trees: 58 files moved under modules/backend/app in the physical
      # move (SAML parsing, PHI encryption, the inbound webhooks) and
      # `-r backend/app` scanned none of them. modules/ is absent in a core
      # checkout, so it is passed only when it is there.
      - name: Run Bandit high severity checks
        run: |
          targets=backend/app
          if [ -d modules/backend/app ]; then targets="$targets modules/backend/app"; fi
          echo "bandit -r $targets -ll"
          # shellcheck disable=SC2086
          bandit -r $targets -ll

      # The binary, not gitleaks-action: the Action is licensed for an
      # organisation and this repository is now under one, so it fails every
      # run with "[getexperimently] is an organization. License key is
      # required." The scanner is open source; only the wrapper charges.
      # security-scan.yml and pr-qa-gate.yml both install the release binary
      # this way.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      # --redact: a finding must name the file and the rule without reprinting
      # the secret into a public log.
      - name: Run gitleaks secret scan
        run: gitleaks detect --source . --log-opts="--all" --redact --verbose

  gate-summary:
    name: Release Gate Summary
    runs-on: ubuntu-latest
    needs: [backend-gate, frontend-gate, security-gate]
    if: always()
    steps:
      - name: Fail if any gate failed
        env:
          # The whole `needs` object, {"job": {"result": ..., "outputs": ...}},
          # as the scan workflow's summary job reads it. A job added to `needs`
          # is checked without anyone also adding it to a list here. With the
          # typed list this replaced, a new failing gate in `needs` was not
          # read and this summary stayed green.
          # backend/tests/unit/infrastructure/test_ci_aggregators.py pins it.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' > results.txt
          test -s results.txt || { printf '::error::needs produced no results\n'; exit 1; }
          failed=0
          while IFS='=' read -r job result; do
            printf '  %s: %s\n' "$job" "$result"
            case "$result" in
              success) ;;
              *) printf '::error::%s: %s\n' "$job" "$result"; failed=1 ;;
            esac
          done < results.txt
          if [ "$failed" -ne 0 ]; then
            echo "::error::Release gate failed"
            exit 1
          fi
          echo "Release gate passed"

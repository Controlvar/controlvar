name: Security Scan

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 8 * * 1'  # Weekly Monday 8am UTC


# Supersede an in-flight run of the same pull request; a batch of Dependabot
# rebases with no group here turned into roughly 2000 jobs and exhausted the
# Actions spending limit.
#
# `github.ref` rather than `github.head_ref`: for a pull request `github.ref`
# is the unique `refs/pull/<n>/merge`, while `head_ref` is the bare branch
# name with no fork owner, so two contributors pushing a branch both named
# `patch-1` -- GitHub's default for a web-UI edit -- would cancel each other's
# required checks. `github.event_name` keeps the triggers in separate groups, so a
# merge cannot cancel the weekly scheduled scan -- the one run whose whole
# purpose is to catch advisories published against pins that never changed.
#
# Only pull requests are cancelled. A push to main runs to completion: cancel
# it and the commit that is actually on main carries a cancelled status, and a
# failure it introduced is attributed to whichever merge landed next.
concurrency:
  group: security-scan-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# The trivy release the container scan job installs: the same two values as
# release.yml's, which a test holds equal. No apt repository, no action: what
# runs is the tarball with this sha256.
env:
  TRIVY_VERSION: '0.74.0'
  TRIVY_SHA256: '2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a'

jobs:
  python-security:
    name: Python Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit pip-audit

      # Both trees: the modules (SAML parsing, PHI encryption, the inbound
      # webhooks) moved to modules/backend/app and `-r backend/app` no longer
      # reaches them. modules/ is absent in a
      # core checkout, so it is passed only when it is there.
      - name: Run Bandit
        run: |
          targets=backend/app
          if [ -d modules/backend/app ]; then targets="$targets modules/backend/app"; fi
          echo "bandit -r $targets"
          # shellcheck disable=SC2086
          bandit -r $targets -f json -o bandit-report.json || true
          # shellcheck disable=SC2086
          bandit -r $targets -ll  # Only show medium+ severity, fail on high
        continue-on-error: false

      # Blocking, in two tiers. What the images install
      # (backend/requirements/runtime.lock, modules/requirements.lock) may
      # carry no advisory at all; the development closure
      # (backend/requirements.txt) may carry one only with an entry in
      # security/dependency-audit.toml giving a reason and a review date -- and
      # the script refuses an entry whose package turns out to ship, or one
      # that no longer matches any advisory.
      #
      # This was `pip-audit ... ; continue-on-error: true`, which is the same
      # as not running it.
      - name: Audit the dependency closures
        run: python scripts/audit_dependencies.py

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

  frontend-security:
    name: Frontend Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: cd frontend && npm ci

      # Every closure the licence gate covers, because it now refuses a
      # directory with no node_modules rather than reporting the root package
      # alone and passing. The first version of the widened gate ran against
      # five uninstalled SDKs and checked nothing in CI.
      - name: Install the published SDK closures
        run: |
          set -euo pipefail
          for dir in sdk/js sdk/react sdk/react-native sdk/openfeature sdk/edge; do
            echo "::group::npm ci $dir"
            (cd "$dir" && npm ci)
            echo "::endgroup::"
          done

      # Blocking. The dashboard image serves this closure's build output, so a
      # HIGH advisory here ships. It was `continue-on-error: true`, and the
      # job's result was not even read by security-summary -- neutered twice.
      #
      # The demo apps ARE audited now. They were excluded because they carried
      # a critical Next advisory needing a semver-major bump (#168), and gating
      # them then would have meant turning continue-on-error back on -- the
      # thing that change existed to remove. #168 is fixed, both are on Next
      # 16 / React 19 and audit clean, so the exclusion has no reason left and
      # this is what stops them drifting back. The launch plan puts them on a
      # public VM, so they are internet-facing.
      #
      # sdk/react-native is still NOT audited: its 12 high advisories are all
      # reachable only through react-native 0.73 itself, which is a
      # devDependency and a peerDependency -- consumers bring their own. That
      # is react-native 0.73 -> 0.87, its own change.
      - name: Run npm audit
        # --omit=dev, to match the sentence above it. Without it this audits
        # the whole lockfile, so a HIGH advisory in jest, eslint or ts-jest --
        # none of which reach the image -- would block every merge. That is
        # precisely the pressure that puts `continue-on-error: true` back, and
        # a blocking gate whose scope is wider than its justification does not
        # survive contact with a busy week.
        run: |
          set -euo pipefail
          for dir in frontend demo/shoplab demo/streampulse; do
            echo "::group::npm audit $dir"
            (cd "$dir" && npm audit --omit=dev --audit-level=high)
            echo "::endgroup::"
          done

      # Node had no licence gate at all: license-checker was used only to
      # generate THIRD_PARTY_LICENSES.md, so a dependency arriving under GPL or
      # SSPL would have been reported and merged. The Python equivalent is
      # scripts/core_build.sh's `licences` step.
      # No argument: the script defaults to every closure that is published or
      # shipped -- the dashboard and the five npm SDKs. Passing `frontend`
      # alone, which is what this did, left the packages that are actually
      # redistributed to users ungated.
      - name: Check production licences
        run: python3 scripts/check_node_licences.py

  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7

      # Both trees, for the reason Bandit takes both: the SAML XML parser, the
      # PHI encryption and the platform's only anonymous write path all live
      # under modules/backend/app
      # now, and `backend/app/` reaches none of them. modules/ is absent in a
      # core checkout, so it is passed only when it is there.
      - name: Run Semgrep
        run: |
          targets=backend/app/
          if [ -d modules/backend/app ]; then targets="$targets modules/backend/app/"; fi
          echo "semgrep scan ... $targets"
          # shellcheck disable=SC2086
          semgrep scan \
            --config "p/python" \
            --config "p/security-audit" \
            --config "p/secrets" \
            --config "p/owasp-top-ten" \
            --error \
            --json \
            --output semgrep-report.json \
            $targets

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: semgrep-report
          path: semgrep-report.json

  secret-detection:
    name: Secret Detection
    runs-on: ubuntu-latest
    # Reading the checkout is all the binary needs -- the pull-requests scope
    # here existed only for gitleaks-action's commit-listing API calls.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Full history for git-secrets

      # The gitleaks BINARY, not gitleaks-action.
      #
      # gitleaks-action is free for a personal account and licensed for an
      # organisation, and this repository moved from `amarkanday` to the
      # `getexperimently` org. It now fails every run, on main as well as on
      # pull requests, with:
      #
      #   [getexperimently] is an organization. License key is required.
      #   error: missing gitleaks license.
      #
      # The scanner itself is still open source; only the Action wrapper
      # charges. So install the release binary and run it, which is what
      # pr-qa-gate.yml in this repository already did -- this job and
      # release-gate.yml were the two that had not been converted.
      #
      # --redact so a finding names the file and rule without reprinting the
      # secret into a public log, which would publish the thing being detected.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: '8.30.1'
        run: |
          curl -fsSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version

      - name: Detect secrets with gitleaks
        run: gitleaks detect --source . --log-opts="--all" --redact --verbose

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest
    # Measured on #370 with warm caches: 4m31s for the whole job (the
    # dashboard full build, from a cold `web-full` scope, took 76 s). A cold
    # API cache costs about 8 minutes per image (see below), so the cold job is
    # roughly 20 minutes; 30 leaves headroom and still ends a hang long before
    # GitHub's 6-hour default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # release.yml's install step, copied verbatim (a test holds the two
      # equal): the tarball named by TRIVY_VERSION, checked against
      # TRIVY_SHA256 before it is unpacked. Every call below runs "$TRIVY".
      - name: Install trivy (pinned, checksum-verified)
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/bin"
          mkdir -p "$bin"
          curl -fsSL -o "$RUNNER_TEMP/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          printf '%s  %s\n' "$TRIVY_SHA256" "$RUNNER_TEMP/trivy.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tgz" -C "$RUNNER_TEMP" trivy
          install -m 0755 "$RUNNER_TEMP/trivy" "$bin/trivy"
          "$bin/trivy" --version > "$RUNNER_TEMP/trivy-version.txt"
          grep -Fx "Version: ${TRIVY_VERSION}" "$RUNNER_TEMP/trivy-version.txt"
          printf 'TRIVY=%s\n' "$bin/trivy" >> "$GITHUB_ENV"

      # Two scans, because `trivy fs` runs two scanners and only one of them
      # had a problem. `--scanners` defaults to `vuln,secret`, and the
      # measurement that motivated this split looked only at the
      # vulnerability column:
      #
      #     Report Summary
      #     | Target           | Type | Vulnerabilities | Secrets |
      #     | requirements.txt | pip  |        0        |    -    |
      #
      # One row, so "this gate scans one file" -- which is true of the pip
      # analyser and false of the scan. The secret scanner reads every file in
      # the tree. Planting a GitHub PAT in `backend/app/` and running the
      # original command exits 1 on `CRITICAL: GitHub (github-pat)`.
      #
      # So: secrets over `backend/`, always. Vulnerabilities over `backend/`,
      # never -- trivy's pip analyser there sees only
      # `backend/requirements.txt` (the other three requirements.txt files
      # under `backend/` are comment-only), and that is the development tier,
      # the one closure with a reviewed exception list in
      # `security/dependency-audit.toml` which trivy cannot honour. The moment
      # an accepted advisory is rated HIGH by trivy's database the step fails
      # and nothing can unblock it -- the pressure to re-add
      # `continue-on-error` that #169 exists to remove. A shared ignore file
      # is not the way out either: probed with a planted offender, trivy
      # reports CVE ids where pip-audit reports PYSEC, so a `.trivyignore`
      # built from that TOML would match nothing and silently accept nothing.
      #
      # `backend/requirements.txt` keeps its vulnerability coverage through
      # `scripts/audit_dependencies.py` + pip-audit, which is the gate that
      # can express "accepted, test-only, review by <date>".
      #
      # Every credential scan below writes trivy's JSON report to a file under
      # $RUNNER_TEMP and prints only path, rule, severity and line
      # (scripts/render_secret_findings.py, `--stage ci`), the way release.yml
      # does. The report is never printed, converted or uploaded. trivy's own
      # exit status wins over the renderer's, and a missing report fails.
      # backend/tests/unit/infrastructure/test_security_scan_output.py runs
      # these scripts against a fake trivy.
      - name: Scan the backend tree for credentials
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/secrets-backend.json"
          rm -f "$report"
          status=0
          "$TRIVY" fs --skip-version-check --scanners secret --severity HIGH,CRITICAL --exit-code 1 --format json --output "$report" backend/ || status=$?
          render=0
          python3 "$GITHUB_WORKSPACE/scripts/render_secret_findings.py" "$report" --stage ci --label "backend/ (source tree)" || render=$?
          if [ "$status" -ne 0 ]; then exit "$status"; fi
          exit "$render"
        continue-on-error: false

      # `modules/requirements.txt` is a shipped closure's input and the
      # shipped tier has no exceptions by design, so there is no mechanism to
      # conflict with -- both scanners run here, one step each. Absent in a
      # core checkout, which is why the backend scan above is unconditional: a
      # gate that can scan nothing at all is the vacuous gate this comment set
      # out to avoid.
      - name: Scan the module tree for credentials
        run: |
          set -euo pipefail
          if [ -d modules ]; then
            report="$RUNNER_TEMP/secrets-modules.json"
            rm -f "$report"
            status=0
            "$TRIVY" fs --skip-version-check --scanners secret --severity HIGH,CRITICAL --exit-code 1 --format json --output "$report" modules/ || status=$?
            render=0
            python3 "$GITHUB_WORKSPACE/scripts/render_secret_findings.py" "$report" --stage ci --label "modules/ (source tree)" || render=$?
            if [ "$status" -ne 0 ]; then exit "$status"; fi
            exit "$render"
          else
            printf 'core checkout: no modules/ to scan\n'
          fi
        continue-on-error: false

      # The advisory table names package names, versions and paths only
      # (measured with trivy 0.74.0), so it stays in the log, where the
      # advisory id is what a contributor needs to fix the dependency.
      - name: Scan the module requirements for known advisories
        run: |
          set -euo pipefail
          if [ -d modules ]; then
            "$TRIVY" fs --skip-version-check --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table modules/
          else
            printf 'core checkout: no modules/ to scan\n'
          fi
        continue-on-error: false

      # The filesystem scan above reads requirements files; this reads what is
      # actually installed in the image -- the Debian base, the resolved Python
      # closure, both profiles. They are different questions, and only this one
      # is about the artefact that ships.
      #
      # --ignore-unfixed is the policy, not a loophole: the core image carries
      # 55 HIGH/CRITICAL Debian CVEs with no upstream patch (measured), and a
      # gate that can only be satisfied by a fix that does not exist is a gate
      # that gets disabled. Everything with a fix available fails the build. As
      # of this change both profiles report zero, after backend/Dockerfile
      # stopped shipping pip/setuptools/wheel -- which accounted for every one
      # of the six fixable findings.
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # build-push-action with the SAME gha cache scopes pr-qa-gate.yml's
      # docker-smoke uses (`api`, `api-full`), and `load: true` so the image
      # lands in the local daemon for trivy. The first version ran a bare
      # `docker build` with no cache at all, which rebuilt both closures cold
      # on every pull request -- two `pip install --require-hashes` runs, about
      # the "~8 minutes for a cold job" pr-qa-gate's own comment cites, on a PR
      # path budgeted at ~13 minutes. It also set up buildx and then did not
      # use it.
      # The UTC date, passed to the image builds below as OS_PACKAGES_REFRESHED:
      # a new date re-runs the Dockerfiles' OS package upgrade layer even when
      # the build cache holds an older copy of it (see backend/Dockerfile).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build the API image (core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: core
          build-args: |
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-api:scan-core
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max

      - name: Build the API image (full)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: full
          build-args: |
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-api:scan-full
          # BOTH scopes, as pr-qa-gate.yml does: `builder` and `runtime` are
          # already cached under `api` from the core build above, and with only
          # `api-full` a cold or evicted scope re-runs apt and the whole hashed
          # `pip install` from scratch -- the ~8-minute cold build this step
          # exists to avoid. The comment above said it used the same scopes as
          # docker-smoke; it did not.
          cache-from: |
            type=gha,scope=api-full
            type=gha,scope=api
          cache-to: type=gha,scope=api-full,mode=max

      # The two dashboard images release.yml publishes (`web-images`): the same
      # frontend/Dockerfile, with the profile as a build-arg rather than a
      # stage. They were never scanned (#77), so half the published images had
      # no container-vulnerability gate. The core build reads pr-qa-gate.yml's
      # `web` cache and does not write it, because this build passes different
      # build-args; the full build has a scope of its own.
      # backend/tests/unit/infrastructure/test_security_scan_scope.py derives
      # the set of images to build here from release.yml, so a third
      # published image fails that test until it is scanned.
      - name: Build the dashboard image (core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPERIMENTLY_PROFILE=core
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-web:scan-core
          cache-from: type=gha,scope=web

      - name: Build the dashboard image (full)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPERIMENTLY_PROFILE=full
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-web:scan-full
          cache-from: |
            type=gha,scope=web-full
            type=gha,scope=web
          cache-to: type=gha,scope=web-full,mode=max

      # Two steps over the same four images, one per scanner. `--image-src
      # docker` reads the tag from the local daemon only: a tag the builds
      # above did not produce fails deterministically, with no network
      # dependency, instead of being looked up in a registry.
      #
      # The loop is a plain `for`, not a pipe into `while read`: a pipe runs
      # the loop in a subshell and `failed=1` would be lost with it. Each
      # image gets its own report, removed first, so a scan that writes none
      # fails in the renderer rather than reading the previous image's.
      - name: Scan the built images for credentials
        run: |
          set -euo pipefail
          failed=0
          n=0
          for image in experimently-api:scan-core experimently-api:scan-full \
                       experimently-web:scan-core experimently-web:scan-full; do
            n=$((n + 1))
            report="$RUNNER_TEMP/secrets-image-$n.json"
            rm -f "$report"
            status=0
            "$TRIVY" image --skip-version-check --image-src docker --scanners secret --severity HIGH,CRITICAL --exit-code 1 \
              --format json --output "$report" "$image" || status=$?
            render=0
            python3 "$GITHUB_WORKSPACE/scripts/render_secret_findings.py" "$report" --stage ci --label "$image (image)" || render=$?
            if [ "$status" -ne 0 ] || [ "$render" -ne 0 ]; then failed=1; fi
          done
          exit "$failed"

      # One policy for all four images, the API's: HIGH/CRITICAL with a fix
      # available fails the job. The table names package names, versions and
      # paths only (measured with trivy 0.74.0).
      - name: Scan the built images for known advisories
        run: |
          set -euo pipefail
          failed=0
          for image in experimently-api:scan-core experimently-api:scan-full \
                       experimently-web:scan-core experimently-web:scan-full; do
            printf '::group::%s (advisories)\n' "$image"
            "$TRIVY" image --skip-version-check --image-src docker --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 \
              --format table "$image" || failed=1
            printf '::endgroup::\n'
          done
          exit "$failed"

      - name: Generate SBOM
        run: |
          "$TRIVY" fs --skip-version-check --format cyclonedx --output sbom.json backend/
          if [ -d modules ]; then
            "$TRIVY" fs --skip-version-check --format cyclonedx --output sbom-modules.json modules/
          fi

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom-report
          path: |
            sbom.json
            sbom-modules.json
          # `modules/` is absent in a core checkout, so one of the two may not
          # exist; the SBOM upload must not fail the scan over that.
          if-no-files-found: warn
          retention-days: 90

  # A pull request that ADDS a vulnerable or badly-licensed dependency is
  # rejected on the diff, before it is merged and becomes everyone's problem.
  # PR-only by definition -- it compares the base and head closures.
  #
  # PUBLIC REPOSITORY ONLY, and not by choice: `dependency-review-action`
  # answers "Dependency review is not supported on this repository. Please
  # ensure that Dependency graph is enabled along with GitHub Advanced
  # Security" and exits 1 on a private repository -- GHAS is a paid add-on
  # there, and the API the action calls simply is not served. Verified on this
  # repository, which is why this guard exists rather than a
  # `continue-on-error` (the thing this whole change removes).
  #
  # The condition is the repository id (which a rename or a transfer keeps,
  # unlike the name), matching docs.yml's Pages deploy; pinned by
  # test_repository_guards.py. On a fork the job is skipped.
  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request' && github.repository_id == '1367480368'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write   # post the summary comment
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          # The same families scripts/core_build.sh and
          # scripts/check_node_licences.py refuse, spelled the way this action
          # wants them. LGPL is absent from the deny list on purpose: weak
          # copyleft, linked and not modified, which is why psycopg2-binary and
          # sharp-libvips are allowed by the other two gates.
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, SSPL-1.0
          comment-summary-in-pr: on-failure

  security-summary:
    name: Security Scan Summary
    runs-on: ubuntu-latest
    # dependency-review is deliberately NOT here. It only runs on pull requests
    # (it compares two closures), so on a push it is skipped -- and a skipped
    # job skips its dependents, or, with `if: always()` as below, arrives as
    # the result `skipped`, which this summary now treats as a failure. It
    # stands on its own as a check instead. Adding it to branch protection is
    # a repository setting, noted in the pull request rather than assumed.
    needs: [python-security, frontend-security, semgrep, secret-detection, container-security]
    if: always()
    steps:
      - name: Check security scan results
        env:
          # One entry per job in `needs` above, produced by the expression
          # rather than typed: `toJSON(needs)` is the whole object, so a job
          # added to `needs` appears here without anyone remembering to add it.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          # Every job in `needs`, read from the object rather than from a
          # hand-typed list. `frontend-security` was missing from that list, so
          # its result was ignored entirely -- even before its one real step
          # also carried continue-on-error. A list of names beside a `needs:`
          # that grows is exactly the defect class this repository keeps
          # finding, so there is no list: `toJSON(needs)` is
          # {"job": {"result": ..., "outputs": ...}} and every key is checked.
          set -euo pipefail
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' > results.txt
          test -s results.txt || { echo "::error::needs produced no results"; exit 1; }
          failed=0
          while IFS='=' read -r job result; do
            echo "  $job: $result"
            case "$result" in
              success) ;;
              *) echo "::error::$job: $result"; failed=1 ;;
            esac
          done < results.txt
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more security scans failed"
            exit 1
          fi
          echo "All security scans passed"

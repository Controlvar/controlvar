# Dependabot cannot regenerate THIRD_PARTY_LICENSES.md, so every bump that
# moves the dependency closure arrives red and stays red -- the same shape as
# the requirements locks in #185, and the third instance of it. `lint` and
# `Unit Tests` were the first two; `THIRD_PARTY_LICENSES.md matches the
# dependencies` is this one. See #85.
#
# Observed rather than theorised: #58 (boto3 1.43.98 -> 1.43.99) had its locks
# regenerated by dependabot-lock.yml, went green everywhere else, and sat with
# auto-merge armed and unable to complete. The manual remedy -- download the
# artifact third-party-licenses.yml uploads, commit it -- was then applied by
# hand and silently failed to push, so `main` merged the bump without the
# regenerated document and described a closure it did not install.
#
# WHY THIS IS NOT A STEP IN dependabot-lock.yml, which is the obvious place:
# that workflow never EXECUTES pull-request content. `uv pip compile` resolves
# a lock without running any package's code, which is what lets it hold a write
# token safely. The licence generator cannot work that way -- it reads the
# machine, so the closure has to be installed, and `npm ci` runs lifecycle
# scripts by design. Putting that in a job with `contents: write` is the
# privilege-escalation shape dependabot-lock.yml's own header refuses.
#
# So the work is SPLIT, and that split is the whole point of this file:
#
#   generate  installs and runs the closure, holds `contents: read`, and
#             produces a text file as an artifact.
#   publish   takes that text file, commits and pushes it, and installs
#             nothing and executes nothing from the branch.
#
# A malicious lockfile therefore runs only under a read-only token, and the
# write token only ever handles a Markdown document.
#
# WHY schedule/dispatch AND NOT pull_request: a workflow triggered by
# Dependabot gets a read-only GITHUB_TOKEN and could not push;
# `pull_request_target` would get a write token together with a checkout of
# branch content, which is the same escalation again. Triggering this way also
# means the workflow definition always comes from the default branch.
name: Dependabot licence refresh

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'A single PR number. Leave empty to do every eligible open Dependabot PR.'
        required: false
        type: string
  schedule:
    # After dependabot-lock.yml's 09:00 window: the document is generated from
    # the regenerated LOCK, so running first would record the closure the bump
    # replaced.
    - cron: '30 10 * * 1-5'

permissions:
  contents: read

concurrency:
  group: dependabot-licence-refresh
  cancel-in-progress: false

jobs:
  find:
    name: Find the pull requests that need it
    runs-on: ubuntu-latest
    if: github.repository_id == '1367480368'
    outputs:
      prs: ${{ steps.find.outputs.prs }}
      count: ${{ steps.find.outputs.count }}
    steps:
      - uses: actions/checkout@v7

      - name: List them
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SINGLE: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          if [ -n "$SINGLE" ]; then
            printf '%s\n' "$SINGLE" > /tmp/prs.txt
          else
            # Open, authored by Dependabot, and touching a file the document is
            # built from. The locks are the Python side; a package-lock.json is
            # the Node side. A bump that touches neither cannot change the
            # document, and processing it would cost six npm installs to
            # produce no diff.
            gh pr list --state open --limit 100 \
              --json number,author,files \
              --jq '.[]
                    | select(.author.login == "app/dependabot")
                    | select(any(.files[].path;
                        . == "backend/requirements/runtime.lock"
                        or . == "modules/requirements.lock"
                        or endswith("package-lock.json")))
                    | .number' > /tmp/prs.txt
          fi
          COUNT=$(grep -c . /tmp/prs.txt || true)
          echo "candidates: $(tr '\n' ' ' < /tmp/prs.txt)"
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          # A matrix needs JSON, and an EMPTY matrix is an error rather than a
          # no-op -- hence the `count` guard on the job below.
          jq -R -s -c 'split("\n") | map(select(length > 0))' < /tmp/prs.txt \
            | sed 's/^/prs=/' >> "$GITHUB_OUTPUT"

  generate:
    name: Regenerate on #${{ matrix.pr }}
    needs: find
    if: needs.find.outputs.count != '0'
    runs-on: ubuntu-latest
    # READ ONLY, and load-bearing: everything below installs and executes the
    # pull request's dependency closure.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        pr: ${{ fromJson(needs.find.outputs.prs) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The DEFAULT branch's generator, kept out of reach of the branch
      # checkout below and copied back over `scripts/` afterwards. Copied back
      # rather than run from /tmp because the script resolves the repository
      # root as `Path(__file__).resolve().parents[1]`; from /tmp it would look
      # for /tmp/backend/... and report every file missing. The same reasoning,
      # and the same remedy, as dependabot-lock.yml's stashed checker.
      - name: Stash the default branch's generator
        run: |
          set -euo pipefail
          mkdir -p /tmp/trusted
          cp scripts/generate_third_party_licenses.py /tmp/trusted/

      - name: Check out the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          AUTHOR=$(gh pr view "${{ matrix.pr }}" --json author --jq '.author.login')
          if [ "$AUTHOR" != "app/dependabot" ]; then
            echo "::error::#${{ matrix.pr }} is authored by $AUTHOR, not Dependabot"
            exit 1
          fi
          gh pr checkout "${{ matrix.pr }}" --force

      - uses: ./.github/actions/licence-environment

      - name: Regenerate the document
        id: regen
        run: |
          set -euo pipefail
          cp /tmp/trusted/generate_third_party_licenses.py \
             scripts/generate_third_party_licenses.py
          python scripts/generate_third_party_licenses.py
          git checkout -- scripts/generate_third_party_licenses.py

          # Nothing else may have moved. The generator writes one file; if this
          # sees more, something ran that should not have.
          CHANGED=$(git diff --name-only)
          UNEXPECTED=$(echo "$CHANGED" | grep -vE '^(THIRD_PARTY_LICENSES\.md)?$' || true)
          if [ -n "$UNEXPECTED" ]; then
            echo "::error::regeneration touched unexpected files:"
            echo "$UNEXPECTED"
            exit 1
          fi
          if [ -z "$CHANGED" ]; then
            echo "#${{ matrix.pr }}: already current, nothing to publish"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Hand the document to the publish job
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: licences-${{ matrix.pr }}
          path: THIRD_PARTY_LICENSES.md
          if-no-files-found: error

  publish:
    name: Publish to #${{ matrix.pr }}
    needs: [find, generate]
    if: needs.find.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # To approve the runs this job's own push creates. A push by
      # GITHUB_TOKEN onto a Dependabot branch leaves every triggered run in
      # `action_required`; without this the document is fixed and the pull
      # request reports no checks at all, which is strictly worse than before.
      # dependabot-lock.yml measured this on run 35560607155: four pushes, 31
      # runs left awaiting approval.
      actions: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        pr: ${{ fromJson(needs.find.outputs.prs) }}
    steps:
      # NOTHING in this job installs or executes anything from the branch. It
      # checks the branch out as data, copies one Markdown file in, and pushes.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # `continue-on-error`, because "no artifact" is the ORDINARY outcome:
      # the generate job uploads nothing when the document was already current,
      # which is most bumps. A missing artifact must be a skip, not a failure.
      - name: Take the document, if there is one
        id: take
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: licences-${{ matrix.pr }}
          path: /tmp/licences

      - name: Commit and push
        if: steps.take.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # Asserted rather than assumed. A download-artifact that reports
          # success while leaving the directory empty would otherwise reach the
          # `cp` below and fail there, blaming the wrong thing.
          if [ ! -f /tmp/licences/THIRD_PARTY_LICENSES.md ]; then
            echo "::error::the artifact for #${{ matrix.pr }} downloaded but holds no document"
            exit 1
          fi

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          gh pr checkout "${{ matrix.pr }}" --force
          cp /tmp/licences/THIRD_PARTY_LICENSES.md THIRD_PARTY_LICENSES.md

          if git diff --quiet -- THIRD_PARTY_LICENSES.md; then
            echo "#${{ matrix.pr }}: the branch already has this document"
            exit 0
          fi

          git add THIRD_PARTY_LICENSES.md
          git commit \
            -m "chore(deps): regenerate THIRD_PARTY_LICENSES.md" \
            -m "Generated from this branch's closure. Dependabot cannot produce this file -- the generator reads the installed machine, not the lock files -- so the licence check fails until this lands. See #85."
          git push

          BRANCH=$(git rev-parse --abbrev-ref HEAD)
          APPROVED=0
          # POLL, do not sleep once. dependabot-lock.yml measured the runs
          # appearing about a minute after the push, so a single short sleep
          # always looked past them and reported "approved 0".
          for _ in $(seq 1 15); do
            sleep 10
            for ID in $(gh run list --branch "$BRANCH" --limit 40 \
                          --json databaseId,conclusion \
                          --jq '.[] | select(.conclusion == "action_required") | .databaseId'); do
              if gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/$ID/approve" >/dev/null 2>&1; then
                APPROVED=$((APPROVED + 1))
              fi
            done
          done
          echo "#${{ matrix.pr }}: approved $APPROVED queued workflow run(s)"

name: Compose Production

# Two jobs on deploy/compose/compose.yml, the file a self-hoster downloads.
#
# compose-production boots it the way they do: published image names, a
# generated .env, ENVIRONMENT=production, no build. Then it checks it through
# the dashboard's published port with the Host check on (tests/alb/rehearse.sh,
# TOPOLOGY=compose). Its images are THIS change's core builds, retagged to the
# published names the compose file resolves to. That proves the file's shape
# and the images' behaviour under it, not the published bytes: this job pulls
# neither app image (`--pull never`), by design, since the published images
# are the previous release's and this job tests this change's.
#
# compose-upgrade (#1807) runs the README's own blocks, extracted from the
# page (scripts/compose_upgrade.sh): it installs the previous release from a
# clone at its tag, which pulls that release's published images from GHCR
# anonymously (no registry login, as a fork's run must), then upgrades to this
# change's builds, rolls back in place and restores the backup. Not on a push:
# on the release commit, compose.yml names images release.yml has not
# published yet. The phases, and what each asserts, are in the script.
#
# Not a required check (yet): it is path-filtered, and a required check that
# does not report blocks a pull request for ever. A red run anywhere but a pull
# request (a push to main, the nightly, a dispatch) opens an issue labelled
# `compose-production-failure`, or comments on the open one: `failure-issue`
# below, a copy of Doc Examples' job of that name
# (test_compose_failure_issue.py holds the two identical).

on:
  pull_request:
    branches: [main]
    paths:
      - deploy/compose/**
      # A literal entry, beside the glob, for the inventory: the README names
      # this workflow (tests/acceptance/docs/inventory.toml).
      - deploy/compose/README.md
      - backend/**
      - frontend/**
      - tests/alb/rehearse.sh
      - tests/web/access_log.sh
      - scripts/check_compose_config.py
      # What runs the README's blocks (compose-upgrade), and what extracts them.
      - scripts/compose_upgrade.sh
      - scripts/guide_blocks.py
      - VERSION
      - .github/workflows/compose-production.yml
  push:
    branches: [main]
    paths:
      - deploy/compose/**
      # A literal entry, beside the glob, for the inventory: the README names
      # this workflow (tests/acceptance/docs/inventory.toml).
      - deploy/compose/README.md
      - backend/**
      - frontend/**
      - tests/alb/rehearse.sh
      - tests/web/access_log.sh
      - scripts/check_compose_config.py
      - VERSION
      - .github/workflows/compose-production.yml
  # 04:30 UTC: after chart-kind (03:30) and CodeQL (04:00), before the fuzz
  # run (05:23).
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      previous_version:
        description: 'N-1 for compose-upgrade, as X.Y.Z (default: the newest release at or below VERSION)'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  # Keyed on the pull request NUMBER, not head_ref: two forks' `patch-1`
  # branches share a head_ref and would cancel each other's runs (#75).
  group: compose-production-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

env:
  # Not COMPOSE_FILE: set in the environment, compose reads .env from the
  # working directory instead of the compose file's own, and misses it.
  PROD_COMPOSE: deploy/compose/compose.yml
  DOCKER_BUILDKIT: "1"

jobs:
  compose-production:
    name: Compose Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # UX C11: the generator writes .env once and refuses a second time,
      # leaving the file byte-for-byte as it was. A rerun that rotated the
      # secrets would lock the administrator out of an existing install.
      - name: Generate .env, twice
        run: |
          set -euo pipefail
          ./deploy/compose/generate-env.sh
          before=$(sha256sum deploy/compose/.env)
          if ./deploy/compose/generate-env.sh 2>second.err; then
            echo "::error::generate-env.sh overwrote an existing .env"
            exit 1
          fi
          grep -q "not overwriting" second.err
          test "$(sha256sum deploy/compose/.env)" = "$before"
          test "$(stat -c %a deploy/compose/.env)" = "600"
          echo "second run refused; .env unchanged and private"

      # Real interpolation: no build key, only the published names at VERSION
      # plus the pinned postgres/redis, only `web` publishes a port, and each
      # required setting unset or empty is refused BY NAME.
      - name: docker compose config
        run: python3 scripts/check_compose_config.py --env-file deploy/compose/.env

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The same builds as Docker Smoke (pr-qa-gate.yml), reading its cache.
      # No cache-to: Docker Smoke owns those scopes.
      # The UTC date, passed to the image builds below as OS_PACKAGES_REFRESHED:
      # a new date re-runs the Dockerfiles' OS package upgrade layer even when
      # the build cache holds an older copy of it (see backend/Dockerfile).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Build API image (core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: core
          build-args: |
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-api:core
          cache-from: type=gha,scope=api

      - name: Build dashboard image (core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPERIMENTLY_PROFILE=core
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: experimently-web:core
          cache-from: type=gha,scope=web

      # The dashboard's access log writes no query string (#1098), checked in
      # the image just built: the rendered nginx config, then the lines three
      # requests leave. tests/web/access_log.sh says what a pass means.
      - name: Dashboard access log leaves query strings out
        run: bash tests/web/access_log.sh experimently-web:core

      # Tag the builds with whatever names the compose file resolves to, so the
      # stack below can only start if the file names what was built -- and the
      # config check above has already pinned those names to the published ones.
      - name: Retag to the published names
        run: |
          set -euo pipefail
          docker compose -f "$PROD_COMPOSE" config --format json > resolved.json
          api_image=$(jq -er .services.api.image resolved.json)
          web_image=$(jq -er .services.web.image resolved.json)
          docker tag experimently-api:core "$api_image"
          docker tag experimently-web:core "$web_image"
          echo "api: $api_image"
          echo "web: $web_image"

      - name: Pull postgres and redis
        run: docker compose -f "$PROD_COMPOSE" pull postgres redis

      - name: Start the stack (no build, no pull)
        run: docker compose -f "$PROD_COMPOSE" up -d --wait --no-build --pull never

      # The API believes X-Forwarded-For from the network its container is
      # attached to (backend/app/core/proxy_trust.py reads it from /proc), and
      # nothing else by default. Its start line must name exactly the subnet
      # Docker gave the project's network. Reads the log; sends no request.
      - name: The API believes the project network
        run: |
          set -euo pipefail
          docker inspect "$(docker compose -f "$PROD_COMPOSE" ps -q api)" > api-container.json
          network=$(jq -er '.[0].NetworkSettings.Networks | keys | if length == 1 then .[0] else error("not one network") end' api-container.json)
          echo "NETWORK=${network}" >> "$GITHUB_ENV"
          docker network inspect "$network" > network.json
          subnet=$(jq -er '[.[0].IPAM.Config[].Subnet | select(contains(":") | not)] | if length == 1 then .[0] else error("not one IPv4 subnet") end' network.json)
          docker compose -f "$PROD_COMPOSE" logs --no-color --no-log-prefix api > api-start.log
          expected="[entrypoint] trusted proxies: 127.0.0.1 ::1; this container's networks: ${subnet}; FORWARDED_ALLOW_IPS: (none)"
          if ! grep -qxF -- "$expected" api-start.log; then
            grep -F 'trusted proxies' api-start.log || true
            echo "::error::the API does not trust its own network ${subnet}: expected the line '${expected}'"
            exit 1
          fi
          echo "ok  the API believes ${subnet}, the project network, and nothing else by default"

      - name: Rehearse through the dashboard port
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . deploy/compose/.env
          set +a
          host=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname)' "$PUBLIC_BASE_URL")
          TOPOLOGY=compose \
          ALB_URL="http://127.0.0.1:${HTTP_PORT:-8080}" \
          PUBLIC_HOST="$host" \
          ADMIN_EMAIL="$FIRST_SUPERUSER" \
          ADMIN_PASSWORD="$FIRST_SUPERUSER_PASSWORD" \
            bash tests/alb/rehearse.sh

      # A TLS proxy on this host connects to the published loopback port, as
      # rehearse.sh's curl did just now (it sends no X-Forwarded-For), and the
      # dashboard sees it arrive from the project network's gateway -- the
      # address the API must believe for such a proxy. Reads the dashboard's
      # access log; sends no request.
      - name: A same-host client reaches the dashboard as the network's gateway
        run: |
          set -euo pipefail
          gateway=$(jq -er '[.[0].IPAM.Config[].Gateway | select(. != null and (contains(":") | not))] | if length == 1 then .[0] else error("not one IPv4 gateway") end' network.json)
          docker compose -f "$PROD_COMPOSE" logs --no-color --no-log-prefix web > web-access.log
          if ! grep -F '"curl/' web-access.log > curl-lines.txt; then
            echo "::error::the dashboard's access log has no request from rehearse.sh's curl"
            exit 1
          fi
          cut -d' ' -f1 curl-lines.txt | sort -u > curl-peers.txt
          if [ "$(cat curl-peers.txt)" != "$gateway" ]; then
            echo "curl's requests reached the dashboard from: $(tr '\n' ' ' < curl-peers.txt)"
            echo "::error::a same-host client did not arrive as the gateway ${gateway} of ${NETWORK}"
            exit 1
          fi
          echo "ok  a same-host client arrives at the dashboard as ${gateway}, the network's gateway"

      - name: Production facts
        run: |
          set -euo pipefail
          set -a
          # shellcheck disable=SC1091
          . deploy/compose/.env
          set +a
          host=$(python3 -c 'import sys, urllib.parse; print(urllib.parse.urlparse(sys.argv[1]).hostname)' "$PUBLIC_BASE_URL")
          base="http://127.0.0.1:${HTTP_PORT:-8080}"
          # No demo seed ran: the published demo login does not exist.
          code=$(curl -s -o demo.json -w '%{http_code}' -H "Host: $host" \
            -H 'content-type: application/json' \
            -d '{"email":"admin@demo.com","password":"Demo1234!"}' \
            "$base/api/v1/auth/login")
          test "$code" = "401" || { echo "::error::the demo login answered $code, expected 401"; exit 1; }
          echo "ok  demo login refused: 401"
          # The running API reports the profile and the version the file names.
          curl -sf -H "Host: $host" "$base/api/v1/modules" -o modules.json
          jq -e --arg v "$(cat VERSION)" '.profile == "core" and .version == $v' modules.json
          echo "ok  /api/v1/modules: core $(cat VERSION)"
          # Postgres and Redis publish nothing on the host. `docker compose port`
          # prints an unpublished port as ":0" (as this check was first written)
          # or "invalid IP:0" (the ubuntu-26.04 runner, Docker 29.4.2: run
          # 40787685453); a real binding is never port 0. So a port is
          # published when any line of the answer does not end in ":0".
          for svc in postgres:5432 redis:6379 api:8000; do
            if docker compose -f "$PROD_COMPOSE" port "${svc%%:*}" "${svc##*:}" >port.out 2>&1 && grep -q -v ':0$' port.out; then
              echo "::error::${svc%%:*} publishes $(cat port.out)"
              exit 1
            fi
          done
          echo "ok  postgres, redis and api publish no host port"

      - name: Container logs (on failure)
        if: failure()
        run: docker compose -f "$PROD_COMPOSE" logs --no-color --tail=200

      - name: Tear down
        if: always()
        run: docker compose -f "$PROD_COMPOSE" down -v --remove-orphans

  compose-upgrade:
    name: Compose Upgrade
    # Not on a push: on the release commit, compose.yml names core-N before
    # release.yml has published it, so the page's pull would fail.
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      # Full history: N-1 is a tag, and the self-hoster's clone is made from
      # this checkout.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Resolved before anything is built, so that an N-1 that cannot be
      # resolved fails in seconds: the newest release at or below VERSION
      # whose images read anonymously, or the release before it while the
      # newest one's are still publishing. A dispatch may name it, with no
      # fallback.
      - name: Resolve the previous release (N-1)
        env:
          PREVIOUS_VERSION: ${{ inputs.previous_version }}
        run: bash scripts/compose_upgrade.sh previous

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # The UTC date, passed to the image builds below as OS_PACKAGES_REFRESHED
      # (see the compose-production job).
      - name: OS package refresh date
        id: os-packages
        run: printf 'date=%s\n' "$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      # The compose-production job's builds, under local names only: the
      # install must pull N-1's images, so nothing carries a published name
      # until the retag step below.
      - name: Build API image (core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: core
          build-args: |
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: compose-upgrade-api:core
          cache-from: type=gha,scope=api

      - name: Build dashboard image (core)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Dockerfile
          build-args: |
            EXPERIMENTLY_PROFILE=core
            OS_PACKAGES_REFRESHED=${{ steps.os-packages.outputs.date }}
          load: true
          tags: compose-upgrade-web:core
          cache-from: type=gha,scope=web

      - name: Record this change's image IDs
        run: bash scripts/compose_upgrade.sh images

      - name: The README's blocks (deploy/compose/README.md)
        run: bash scripts/compose_upgrade.sh blocks

      - name: Install the previous release as the README does
        run: bash scripts/compose_upgrade.sh install

      - name: Back up, get this change's files, check the settings, pull
        run: bash scripts/compose_upgrade.sh prepare

      # The one step that is not a README block: this change's builds, by ID,
      # under the names the new compose.yml resolves.
      - name: Retag this change's builds to the published names
        run: bash scripts/compose_upgrade.sh retag

      - name: Upgrade, verify, check the migrations
        run: bash scripts/compose_upgrade.sh upgrade

      - name: Restart the API
        run: bash scripts/compose_upgrade.sh restart

      - name: Roll back in place, then restore the backup
        run: bash scripts/compose_upgrade.sh rollback

      - name: Container logs (on failure)
        if: failure()
        run: bash scripts/compose_upgrade.sh diagnose

      - name: Tear down
        if: always()
        run: bash scripts/compose_upgrade.sh teardown

  failure-issue:
    name: File an issue on failure
    runs-on: ubuntu-latest
    needs: [compose-production, compose-upgrade]
    # Doc Examples' condition, unchanged: a job that reaches timeout-minutes
    # concludes `cancelled`, not `failure`, so a cancelled job is red here
    # too. compose-upgrade is skipped on a push, which neither condition
    # counts. `!cancelled()` still leaves out a run that was itself
    # cancelled; off a pull request the group above is the run's own id, so
    # that means a person cancelled it.
    if: ${{ github.event_name != 'pull_request' && !cancelled() && (failure() || contains(needs.*.result, 'cancelled')) }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Compose Production is red"
          BODY="Compose Production failed on $(date -u '+%Y-%m-%d') (${GITHUB_EVENT_NAME}, commit ${GITHUB_SHA})."$'\n\n'"Run: ${RUN_URL}"

          # `|| true`: the label does not exist yet on the first red run.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label compose-production-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            gh label create compose-production-failure --repo "$REPO" --color B60205 \
              --description "Compose Production failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label compose-production-failure --body "$BODY"
          fi

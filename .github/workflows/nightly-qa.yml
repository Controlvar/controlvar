name: Nightly QA Suite

# Runs the suites that are too slow for the PR gate, against a real stack.
#
# Fixed on 2026-09-11 (P1): the Python jobs install the repo (`pip install -e .`)
# on top of the pinned requirements so `backend.app.*` imports the same way it
# does in production; the browser job builds the static export and lets
# playwright.config.ts serve it, instead of the stale PLAYWRIGHT_SKIP_SERVER
# flag plus a hand-started `next dev`; and a failing night files an issue.

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-qa
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # The unit suite in four pieces, each a full job with its own Postgres, the
  # way the integration shards below are run: a test belongs to piece `i` when
  # sha256(its node id) % 4 == i-1 (backend/tests/shard.py). One session took
  # 36 to 49 minutes a job from 2026-11-20 to 2026-11-23, was cancelled twice
  # at the old 60 minute limit on 2026-11-23, and took 59 against a limit of
  # 90 on 2026-11-24 (run 45386960286). rc-evidence.yml's four unit shards
  # (this tree less its chart tests, plus backend/tests/realistic and
  # installer_sweeps, and the performance tests in shard 1) took 16.7 to 33.2
  # minutes a job over its last five runs; 60 is 1.8 times the slowest. The
  # job named `Unit Tests` is the summary below, not these.
  unit-shard:
    name: Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One red shard must not cancel the others: the summary needs every
      # shard's report to say which tests failed and that the rest ran.
      fail-fast: false
      matrix:
        # The total is `strategy.job-total`, never typed: a repeated or
        # missing number leaves a shard number with no report, and the
        # summary refuses that.
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Everything runs from the repository root: the package is imported as
      # `backend.app.*`, and `pip install -e .` makes that true for any cwd.
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      - name: Run unit tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # This shard's slice of the suite, and where it records what it
          # collected, selected and ran (outside the checkout, under a name
          # unique to the shard and to this suite).
          EXPERIMENTLY_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          EXPERIMENTLY_TEST_SHARD_REPORT: ${{ runner.temp }}/shard-unit-${{ matrix.shard }}.json
        run: python -m pytest backend/tests/unit/ -p no:cov -q --tb=short

      # Even when the suite failed: the summary reads every shard's report.
      # `overwrite`, because a re-run of one shard uploads the same name again.
      - name: Upload the shard report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-report-unit-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-unit-${{ matrix.shard }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # The job the nightly's readers know as `Unit Tests` (id `unit-tests`: the
  # jobs below need it, and the failure issue's `needs:` names it): green only
  # when every shard succeeded and the shards between them ran every collected
  # unit test exactly once. `always()`, so it reports an explicit result, and
  # a failure names what failed.
  unit-tests:
    name: Unit Tests
    needs: unit-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No report at all is the checker's to judge (it fails), so a download
      # that finds nothing must not end the job before it.
      - name: Collect the shard reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: shard-report-unit-*
          path: ${{ runner.temp }}/shard-reports

      - name: Every shard passed
        env:
          # The whole `needs` object; a matrix job's result covers all its
          # legs. Only `success` passes: failure, cancelled (a timeout too)
          # and skipped are all red.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' > results.txt
          test -s results.txt || { printf '::error::needs produced no results\n'; exit 1; }
          failed=0
          while IFS='=' read -r job result; do
            printf '  %s: %s\n' "$job" "$result"
            case "$result" in
              success) ;;
              *) printf '::error::%s: %s\n' "$job" "$result"; failed=1 ;;
            esac
          done < results.txt
          if [ "$failed" -ne 0 ]; then
            printf '::error::unit tests failed\n'
            exit 1
          fi

      # Even after a failed shard, so the log says which tests failed and
      # whether the rest ran. `--only-suites`: a report of any other suite
      # here is red, not left alone. Skips are not judged, as before the split
      # (the single session passed with them, and rc_evidence.py's unit shards
      # allow any): a test in no shard, in two, or not run is still red. The
      # suite runs with `-p no:cov`, the one plugin allowed off. Not piped:
      # `--github-annotations` prints each problem as an annotation, and the
      # checker's exit status is the step's.
      - name: Every test ran in exactly one shard
        if: always()
        run: |
          python3 scripts/check_test_shards.py \
            --suite backend/tests/unit \
            --only-suites \
            --github-annotations \
            --any-skip backend/tests/unit \
            --allow-disabled-plugin backend/tests/unit=cov \
            "$RUNNER_TEMP/shard-reports"

  # The integration suite in four pieces, each a full job with its own
  # services, as integration-tests.yml runs it: a test belongs to piece `i`
  # when sha256(its node id) % 4 == i-1 (backend/tests/shard.py). One session
  # took 57.5, 63.6, 78.3 and 79.8 minutes in its last four green runs against
  # a 100 minute limit; a quarter of it is about 15-20 minutes plus the setup,
  # so 45 leaves more than double. The job named `Integration Tests` is the
  # summary below, not these.
  integration-shard:
    name: Integration Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45
    strategy:
      # One red shard must not cancel the others: the summary needs every
      # shard's report to say which tests failed and that the rest ran.
      fail-fast: false
      matrix:
        # The one hand-typed list. The total is `strategy.job-total`, never
        # typed: a repeated or missing number leaves a shard number with no
        # report, and the summary refuses that.
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # For the Redis-backed integration tests (the experiment cache, the flag
      # reads after every writer), as in integration-tests.yml (#902).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # A second Redis that requires a password, for
      # backend/tests/integration/test_redis_password_auth.py, started the
      # same way as in integration-tests.yml: a service container takes no
      # command. The password is generated per run and handed to the tests
      # through GITHUB_ENV.
      - name: Start a password-protected Redis
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name redis-auth -p 6380:6379 redis:7-alpine \
            redis-server --requirepass "${password}"
          for _ in $(seq 1 30); do
            if docker exec redis-auth redis-cli --no-auth-warning -a "${password}" ping | grep -q PONG; then
              {
                echo "REDIS_AUTH_TEST_PORT=6380"
                echo "REDIS_AUTH_TEST_PASSWORD=${password}"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs redis-auth
          exit 1

      - name: Run integration tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Both Redis servers must be there: without these a missing one
          # makes its tests skip green, with them it fails the job.
          EXPERIMENTLY_REQUIRE_REDIS: "1"
          EXPERIMENTLY_REQUIRE_REDIS_AUTH: "1"
          # The editable install above is what test_the_integration_job_is_armed
          # (test_core_tree_isolation.py) checks; without this it skips, and the
          # shard checker refuses a skip nothing allows, as integration-tests.yml.
          EXPERIMENTLY_REQUIRE_EDITABLE: "1"
          # This shard's slice of the suite, and where it records what it
          # collected, selected and ran (outside the checkout, under a name
          # unique to the shard).
          EXPERIMENTLY_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
          EXPERIMENTLY_TEST_SHARD_REPORT: ${{ runner.temp }}/shard-integration-${{ matrix.shard }}.json
        run: python -m pytest backend/tests/integration/ -p no:cov -q --tb=short

      # Even when the suite failed: the summary reads every shard's report.
      # `overwrite`, because a re-run of one shard uploads the same name again.
      - name: Upload the shard report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shard-report-integration-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard-integration-${{ matrix.shard }}.json
          if-no-files-found: warn
          overwrite: true
          retention-days: 30

  # The job the nightly's readers know as `Integration Tests` (id
  # `integration-tests`, in the failure issue's `needs:`): green only when every
  # shard succeeded and the shards between them ran every collected
  # integration test exactly once. `always()`, so it reports an explicit
  # result, and a failure names what failed.
  integration-tests:
    name: Integration Tests
    needs: integration-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # No report at all is the checker's to judge (it fails), so a download
      # that finds nothing must not end the job before it.
      - name: Collect the shard reports
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: shard-report-integration-*
          path: ${{ runner.temp }}/shard-reports

      - name: Every shard passed
        env:
          # The whole `needs` object; a matrix job's result covers all its
          # legs. Only `success` passes: failure, cancelled (a timeout too)
          # and skipped are all red.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          printf '%s\n' "$RESULTS" | jq -r 'to_entries[] | "\(.key)=\(.value.result)"' > results.txt
          test -s results.txt || { printf '::error::needs produced no results\n'; exit 1; }
          failed=0
          while IFS='=' read -r job result; do
            printf '  %s: %s\n' "$job" "$result"
            case "$result" in
              success) ;;
              *) printf '::error::%s: %s\n' "$job" "$result"; failed=1 ;;
            esac
          done < results.txt
          if [ "$failed" -ne 0 ]; then
            printf '::error::integration tests failed\n'
            exit 1
          fi

      # Even after a failed shard, so the log says which tests failed and
      # whether the rest ran. The one skip allowed is the benchmark, which
      # runs only with RUN_BENCHMARKS=1 (backend/tests/benchmark_gate.py); the
      # suite runs with `-p no:cov`, which is the one plugin allowed off.
      - name: Every test ran in exactly one shard
        if: always()
        run: |
          python3 scripts/check_test_shards.py \
            --suite backend/tests/integration \
            --allow-skip 'backend/tests/integration=absolute-timing benchmark; set RUN_BENCHMARKS=1 to run it' \
            --allow-disabled-plugin backend/tests/integration=cov \
            "$RUNNER_TEMP/shard-reports"

  # Absolute wall-clock targets ("P99 under 40 ms", "over 1000 evaluations a
  # second"). They measure the runner as much as the code, so no pull-request
  # job runs them: every test carrying them is marked `benchmark` and skipped
  # unless RUN_BENCHMARKS=1 (backend/tests/benchmark_gate.py, #409). Here they
  # run, nothing waits on them, and a red night files the usual issue.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # Each Lambda function's tests/ runs in its own session (they all
      # define `tests.conftest`), as in the pull-request gate.
      - name: Run benchmarks
        env:
          APP_ENV: test
          TESTING: 'true'
          RUN_BENCHMARKS: '1'
        run: |
          python -m pytest -m benchmark -p no:cov -q --tb=short \
            backend/tests/unit backend/tests/integration/test_rules_engine_integration.py
          for d in backend/lambda/event_processor backend/lambda/feature_flag_evaluation; do
            python -m pytest -m benchmark "$d" -p no:cov -q --tb=short || exit 1
          done

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # `test_production.py` talks to a deployed environment; without
      # SMOKE_TEST_API_URL it is skipped rather than failed.
      - name: Run smoke tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -m pytest backend/tests/smoke/ -p no:cov -q --tb=short \
            --ignore=backend/tests/smoke/test_production.py

  sdk-contract-tests:
    name: SDK Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false

      - name: Install pytest
        run: pip install pytest

      # The same checks as the PR gate's SDK Contract Tests job: each SDK's own
      # hash function against golden-vectors.json (see hash_contract.py).
      - name: SDKs this job checks, and those it does not
        run: python tests/sdk-contract/hash_contract.py --list

      - name: The comparison rejects a wrong answer; the published evaluators accept the ruleset
        run: python -m pytest tests/sdk-contract -v -o addopts=""

      - name: SDK hashes (python, js, edge, react-native, go)
        run: python tests/sdk-contract/hash_contract.py python js edge react-native go

      # The pytest step above fed every release pinned in published-sdks.json
      # the server's ruleset; this fails when npm or PyPI holds a release with
      # a local evaluator that is not pinned (#1497). Not on pull requests: a
      # publish would turn every open one red until the pin lands.
      - name: Every published local evaluator is in the gate
        run: python tests/sdk-contract/published_versions_check.py

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` requires package-lock.json to match package.json exactly; it is
      # the step that catches a lockfile someone forgot to commit.
      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Jest tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # Schema first (the migration chain cannot be replayed from an empty
      # database), then the demo users the auth fixture logs in as.
      - name: Bootstrap and seed the database
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -m backend.app.db.bootstrap
          python backend/scripts/seed_demo_data.py

      - name: Start backend
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          nohup python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 \
            > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready"; tail -n 100 backend.log; exit 1

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # playwright.config.ts serves frontend/out with tests/e2e/static-server.mjs
      # when the export exists — the same files nginx serves in the image.
      - name: Build the dashboard (static export)
        env:
          # Same origin: the static server proxies /api, so the journeys do
          # not spend a CORS preflight per login against the 10/min limit.
          NEXT_PUBLIC_API_URL: ''
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run journeys (fail hard)
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: cd frontend && npx playwright test --project=journeys

      # The extended project is the accessibility audit (axe, WCAG 2 AA) and any
      # other spec that is not a journey. A failing test here fails the night
      # and the failure issue below reports it; this step used to carry
      # `continue-on-error`, which kept the night green while tests failed.
      # visual-regression.spec.ts has its own `visual` project and is not run
      # until its baseline images are committed (#943).
      - name: Run extended suite (accessibility and other non-journey specs)
        id: extended
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: cd frontend && npx playwright test --project=extended

      - name: Extended suite result
        if: always()
        run: |
          echo "extended suite: ${{ steps.extended.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artefacts
          path: |
            frontend/playwright-results/
            backend.log
          retention-days: 14

  # The persona days (#1950): each role's ordinary day in the dashboard, every
  # writing step decided by reading the API back (frontend/tests/e2e/personas,
  # the cards in tests/personas). Its own runner, with e2e-tests' boot copied
  # (not shared, so neither job changes the other). Nothing a test prints
  # reaches this log or an artefact: Playwright's output, its JSON report and
  # the oracle log stay in files on the runner, and tests/personas/check_run.py
  # prints one line of counts, here and in the run summary. e2e-tests' steps
  # up to its first Playwright run took 3.4 minutes on 2026-11-25 (run
  # 45651635175) and the developer's day about 10 seconds off the runner;
  # 30 minutes is meant to leave room for the other days.
  persona-days:
    name: Persona days
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLAYWRIGHT_API_URL: http://localhost:8000
      PLAYWRIGHT_PORT: '3100'
      # For the SDK app's day: the port its page is to be served on, by
      # tests/e2e/static-server.mjs (--dir) with its /api proxy, so the page
      # and the API share an origin and need no CORS entry.
      PERSONAS_SDK_PORT: '3400'
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            frontend/package-lock.json
            sdk/js/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      - name: Bootstrap and seed the database
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -m backend.app.db.bootstrap
          python backend/scripts/seed_demo_data.py

      - name: Start backend
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          nohup python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 \
            > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready"; tail -n 100 backend.log; exit 1

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Build the dashboard (static export)
        env:
          NEXT_PUBLIC_API_URL: ''
        run: cd frontend && npm run build

      # The SDK app's day loads this checkout's JavaScript SDK, as the
      # flags-over-time suite does (_platform.yml, usecases-flags).
      - name: Build the JavaScript SDK
        run: cd sdk/js && npm ci --ignore-scripts --no-audit --no-fund && npm run build --silent

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      # Both Playwright commands write to files only, and their exit statuses
      # go to the checker, which decides the step: a failing test prints its
      # title and its step's, so its output must not reach this log. The
      # checker also counts the sign-ins backend.log shows the API answered.
      - name: Run the persona days
        env:
          PERSONAS: '1'
        run: |
          set +e
          out="$RUNNER_TEMP/personas"
          mkdir -p "$out"
          cd frontend || exit 1
          npx playwright test --list --project=personas --reporter=json > "$out/list.json" 2> "$out/list.log"
          list_exit=$?
          PERSONAS_REPORT="$out/report.json" PERSONAS_ORACLE_LOG="$out/oracle-log.jsonl" \
            npx playwright test --project=personas > "$out/playwright.log" 2>&1
          run_exit=$?
          cd .. || exit 1
          python tests/personas/check_run.py --list "$out/list.json" --list-exit "$list_exit" \
            --report "$out/report.json" --run-exit "$run_exit" \
            --oracle-log "$out/oracle-log.jsonl" --details "$out/details.txt" \
            --backend-log backend.log

  # The synthetic check's dead-man switch (synthetic.yml): the largest gap
  # between its scheduled runs that passed all eight steps, over the last 48 h,
  # against max_gap_minutes in scripts/synthetic_freshness.toml. Until that
  # file exists (it is committed after 48 h of measured gaps) the job prints
  # the measured cadence, says "threshold not yet set" and passes; while
  # SYNTH_ENABLED is not `true` it says "disabled" and passes. Reads run
  # history only (this repository is public; contents: read is enough).
  synthetic-freshness:
    name: Synthetic check freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/qa-templates

      - name: Largest gap between green synthetic runs
        env:
          GH_TOKEN: ${{ github.token }}
          SYNTH_ENABLED: ${{ vars.SYNTH_ENABLED }}
        run: python3 scripts/synthetic_report.py freshness

  # The ground-truth replay (#1544) at nightly scale: the pull request's
  # scenarios with four times the users (tests/ground_truth/test_replay.py,
  # GROUND_TRUTH_SCALE=nightly), against the core profile with no seed data.
  # Not release evidence: rc_evidence.py does not read this workflow.
  ground-truth:
    name: Ground-truth replay
    uses: ./.github/workflows/_platform.yml
    with:
      profile: core
      seed: ''
      suite: ground-truth-nightly
      timeout-minutes: 45

  # FX (#1544 part D3): one scenario with every fault of the ground-truth
  # replay combined, at the nightly scale (tests/ground_truth/nightly_fx.py),
  # against the core profile with no seed data. A job of its own beside the
  # clean replay's (its own runner, database and rate limiter). 45 minutes
  # until its first scheduled run is measured; then twice that run, at most 45.
  ground-truth-faults:
    name: Ground-truth faults combined
    uses: ./.github/workflows/_platform.yml
    with:
      profile: core
      seed: ''
      suite: ground-truth-faults-nightly
      timeout-minutes: 45

  # The over-the-wire flag use cases (D210 use cases #1 and #2): this
  # checkout's Python and JS SDKs follow a percentage ramp user by user, and
  # turn a flag off within their cache and refresh bounds
  # (tests/usecases/test_flags_over_time.py), against the core profile with no
  # seed data. `sdks: python js` sets up Node; the suite builds sdk/js. The
  # suite ends itself after 15 minutes, inside this limit, so a hung night
  # still fails and files the issue below.
  flags-over-time:
    name: Flags over time
    uses: ./.github/workflows/_platform.yml
    with:
      profile: core
      seed: ''
      suite: usecases-flags
      sdks: 'python js'
      timeout-minutes: 20

  # A red night has to leave something behind that a human sees in the morning.
  nightly-failure-issue:
    name: File an issue on failure
    runs-on: ubuntu-latest
    needs: [unit-shard, unit-tests, integration-shard, integration-tests, benchmarks, smoke-tests, sdk-contract-tests, frontend-tests, e2e-tests, persona-days, synthetic-freshness, ground-truth, ground-truth-faults, flags-over-time]
    # A job that hits its timeout-minutes ends `cancelled`, not `failure`, so
    # failure() alone stayed false on 2026-11-02 and 2026-11-03 and no issue was
    # filed. A person cancelling the run files one too; that fails closed.
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly QA is red"
          BODY="Nightly QA failed on $(date -u '+%Y-%m-%d') (commit ${GITHUB_SHA})."$'\n\n'"Run: ${RUN_URL}"$'\n\n'"Jobs: see the run summary for which suite failed."

          # `|| true`: the label does not exist yet on the first red night.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label nightly-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #${EXISTING}"
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            echo "Opening a new issue"
            gh label create nightly-failure --repo "$REPO" --color B60205 \
              --description "Nightly QA suite failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label nightly-failure --body "$BODY"
          fi

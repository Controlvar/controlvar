name: Nightly QA Suite

# Runs the suites that are too slow for the PR gate, against a real stack.
#
# Fixed on 2026-09-11 (P1): the Python jobs install the repo (`pip install -e .`)
# on top of the pinned requirements so `backend.app.*` imports the same way it
# does in production; the browser job builds the static export and lets
# playwright.config.ts serve it, instead of the stale PLAYWRIGHT_SKIP_SERVER
# flag plus a hand-started `next dev`; and a failing night files an issue.

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-qa
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  # The over-the-wire flag use cases (D210 use cases #1 and #2): this
  # checkout's Python and JS SDKs follow a percentage ramp user by user, and
  # turn a flag off within their cache and refresh bounds
  # (tests/usecases/test_flags_over_time.py), against the core profile with no
  # seed data. `sdks: python js` sets up Node; the suite builds sdk/js. The
  # suite ends itself after 15 minutes, inside this limit, so a hung night
  # still fails and files the issue below.
  flags-over-time:
    name: Flags over time
    uses: ./.github/workflows/_platform.yml
    with:
      profile: core
      seed: ''
      suite: usecases-flags
      sdks: 'python js'
      timeout-minutes: 20

name: Nightly QA Suite

# Runs the suites that are too slow for the PR gate, against a real stack.
#
# Fixed on 2026-09-11 (P1): the Python jobs install the repo (`pip install -e .`)
# on top of the pinned requirements so `backend.app.*` imports the same way it
# does in production; the browser job builds the static export and lets
# playwright.config.ts serve it, instead of the stale PLAYWRIGHT_SKIP_SERVER
# flag plus a hand-started `next dev`; and a failing night files an issue.

on:
  schedule:
    - cron: '0 2 * * *'  # 02:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-qa
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.11'
  NODE_VERSION: '22'

jobs:
  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      # Everything runs from the repository root: the package is imported as
      # `backend.app.*`, and `pip install -e .` makes that true for any cwd.
      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      - name: Run unit tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: python -m pytest backend/tests/unit/ -p no:cov -q --tb=short

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # For the Redis-backed integration tests (the experiment cache, the flag
      # reads after every writer), as in integration-tests.yml (#902).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # A second Redis that requires a password, for
      # backend/tests/integration/test_redis_password_auth.py, started the
      # same way as in integration-tests.yml: a service container takes no
      # command. The password is generated per run and handed to the tests
      # through GITHUB_ENV.
      - name: Start a password-protected Redis
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::${password}"
          docker run -d --name redis-auth -p 6380:6379 redis:7-alpine \
            redis-server --requirepass "${password}"
          for _ in $(seq 1 30); do
            if docker exec redis-auth redis-cli --no-auth-warning -a "${password}" ping | grep -q PONG; then
              {
                echo "REDIS_AUTH_TEST_PORT=6380"
                echo "REDIS_AUTH_TEST_PASSWORD=${password}"
              } >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 1
          done
          docker logs redis-auth
          exit 1

      - name: Run integration tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          # Both Redis servers must be there: without these a missing one
          # makes its tests skip green, with them it fails the job.
          EXPERIMENTLY_REQUIRE_REDIS: "1"
          EXPERIMENTLY_REQUIRE_REDIS_AUTH: "1"
        run: python -m pytest backend/tests/integration/ -p no:cov -q --tb=short

  # Absolute wall-clock targets ("P99 under 40 ms", "over 1000 evaluations a
  # second"). They measure the runner as much as the code, so no pull-request
  # job runs them: every test carrying them is marked `benchmark` and skipped
  # unless RUN_BENCHMARKS=1 (backend/tests/benchmark_gate.py, #409). Here they
  # run, nothing waits on them, and a red night files the usual issue.
  benchmarks:
    name: Benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # Each Lambda function's tests/ runs in its own session (they all
      # define `tests.conftest`), as in the pull-request gate.
      - name: Run benchmarks
        env:
          APP_ENV: test
          TESTING: 'true'
          RUN_BENCHMARKS: '1'
        run: |
          python -m pytest -m benchmark -p no:cov -q --tb=short \
            backend/tests/unit backend/tests/integration/test_rules_engine_integration.py
          for d in backend/lambda/event_processor backend/lambda/feature_flag_evaluation; do
            python -m pytest -m benchmark "$d" -p no:cov -q --tb=short || exit 1
          done

  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: unit-tests
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # `test_production.py` talks to a deployed environment; without
      # SMOKE_TEST_API_URL it is skipped rather than failed.
      - name: Run smoke tests
        env:
          APP_ENV: test
          TESTING: 'true'
          POSTGRES_SERVER: localhost
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -m pytest backend/tests/smoke/ -p no:cov -q --tb=short \
            --ignore=backend/tests/smoke/test_production.py

  sdk-contract-tests:
    name: SDK Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22.x'
          cache: false

      - name: Install pytest
        run: pip install pytest

      # The same checks as the PR gate's SDK Contract Tests job: each SDK's own
      # hash function against golden-vectors.json (see hash_contract.py).
      - name: SDKs this job checks, and those it does not
        run: python tests/sdk-contract/hash_contract.py --list

      - name: The comparison rejects a wrong answer (hash_contract.py self-tests)
        run: python -m pytest tests/sdk-contract -v -o addopts=""

      - name: SDK hashes (python, js, edge, react-native, go)
        run: python tests/sdk-contract/hash_contract.py python js edge react-native go

  frontend-tests:
    name: Frontend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` requires package-lock.json to match package.json exactly; it is
      # the step that catches a lockfile someone forgot to commit.
      - name: Install dependencies
        run: cd frontend && npm ci

      - name: Run Jest tests
        run: cd frontend && npm test -- --passWithNoTests --watchAll=false

  e2e-tests:
    name: E2E Browser Tests
    runs-on: ubuntu-latest
    needs: [unit-tests, frontend-tests]
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install -e . --no-deps

      # Schema first (the migration chain cannot be replayed from an empty
      # database), then the demo users the auth fixture logs in as.
      - name: Bootstrap and seed the database
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          python -m backend.app.db.bootstrap
          python backend/scripts/seed_demo_data.py

      - name: Start backend
        env:
          ENVIRONMENT: development
          AUTH_PROVIDER: local
          SECRET_KEY: ci-only-nightly-e2e-secret-key-0123456789abcdef0123456789
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: experimentation
          POSTGRES_SCHEMA: experimentation
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        run: |
          nohup python -m uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 \
            > backend.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sf http://localhost:8000/health/ready >/dev/null; then
              echo "backend ready"
              exit 0
            fi
            sleep 1
          done
          echo "backend did not become ready"; tail -n 100 backend.log; exit 1

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      # playwright.config.ts serves frontend/out with tests/e2e/static-server.mjs
      # when the export exists — the same files nginx serves in the image.
      - name: Build the dashboard (static export)
        env:
          # Same origin: the static server proxies /api, so the journeys do
          # not spend a CORS preflight per login against the 10/min limit.
          NEXT_PUBLIC_API_URL: ''
        run: cd frontend && npm run build

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run journeys (fail hard)
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: cd frontend && npx playwright test --project=journeys

      # The extended project is the accessibility audit (axe, WCAG 2 AA) and any
      # other spec that is not a journey. A failing test here fails the night
      # and the failure issue below reports it; this step used to carry
      # `continue-on-error`, which kept the night green while tests failed.
      # visual-regression.spec.ts has its own `visual` project and is not run
      # until its baseline images are committed (#943).
      - name: Run extended suite (accessibility and other non-journey specs)
        id: extended
        env:
          PLAYWRIGHT_API_URL: http://localhost:8000
        run: cd frontend && npx playwright test --project=extended

      - name: Extended suite result
        if: always()
        run: |
          echo "extended suite: ${{ steps.extended.outcome }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload failure artefacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-failure-artefacts
          path: |
            frontend/playwright-results/
            backend.log
          retention-days: 14

  # The synthetic check's dead-man switch (synthetic.yml): the largest gap
  # between its scheduled runs that passed all eight steps, over the last 48 h,
  # against max_gap_minutes in scripts/synthetic_freshness.toml. Until that
  # file exists (it is committed after 48 h of measured gaps) the job prints
  # the measured cadence, says "threshold not yet set" and passes; while
  # SYNTH_ENABLED is not `true` it says "disabled" and passes. Reads run
  # history only (this repository is public; contents: read is enough).
  synthetic-freshness:
    name: Synthetic check freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts
            .github/qa-templates

      - name: Largest gap between green synthetic runs
        env:
          GH_TOKEN: ${{ github.token }}
          SYNTH_ENABLED: ${{ vars.SYNTH_ENABLED }}
        run: python3 scripts/synthetic_report.py freshness

  # A red night has to leave something behind that a human sees in the morning.
  nightly-failure-issue:
    name: File an issue on failure
    runs-on: ubuntu-latest
    needs: [unit-tests, integration-tests, benchmarks, smoke-tests, sdk-contract-tests, frontend-tests, e2e-tests, synthetic-freshness]
    if: failure()
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open or update the nightly failure issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE="Nightly QA is red"
          BODY="Nightly QA failed on $(date -u '+%Y-%m-%d') (commit ${GITHUB_SHA})."$'\n\n'"Run: ${RUN_URL}"$'\n\n'"Jobs: see the run summary for which suite failed."

          # `|| true`: the label does not exist yet on the first red night.
          EXISTING=$(gh issue list --repo "$REPO" --state open --label nightly-failure \
            --json number --jq '.[0].number // empty' 2>/dev/null || true)

          if [ -n "$EXISTING" ]; then
            echo "Commenting on existing issue #${EXISTING}"
            gh issue comment "$EXISTING" --repo "$REPO" --body "$BODY"
          else
            echo "Opening a new issue"
            gh label create nightly-failure --repo "$REPO" --color B60205 \
              --description "Nightly QA suite failed" 2>/dev/null || true
            gh issue create --repo "$REPO" --title "$TITLE" \
              --label nightly-failure --body "$BODY"
          fi

name: Infrastructure Tests

on:
  push:
    branches: [main]
    paths:
      - 'infrastructure/**'
      - 'modules/infrastructure/**'
      - '.github/workflows/infrastructure-tests.yml'
  # NO path filter on pull_request, deliberately. These tests now include a
  # real `cdk synth` for both profiles, and the defect that motivated it --
  # a stack dependency cycle that made `cdk synth` and `cdk deploy` impossible
  # for six months -- was introduced by a change under infrastructure/ but
  # could equally have come from modules/, a requirements bump, or a Python
  # version change. A path-filtered job also cannot be a required check: it
  # never reports on the pull requests it skips, so the branch protection
  # entry would sit pending for ever.
  #
  # The cost is ~2 minutes, nearly all of it `pip install`, against a gate
  # that would have caught a six-month outage of the entire deploy path.
  pull_request:
    branches: [main]
  workflow_dispatch:


# Supersede an in-flight run of the same pull request; a batch of Dependabot
# rebases with no group here turned into roughly 2000 jobs and exhausted the
# Actions spending limit.
#
# `github.ref` rather than `github.head_ref`: for a pull request `github.ref`
# is the unique `refs/pull/<n>/merge`, while `head_ref` is the bare branch
# name with no fork owner, so two contributors pushing a branch both named
# `patch-1` -- GitHub's default for a web-UI edit -- would cancel each other's
# required checks. `github.event_name` keeps the triggers in separate groups.
#
# Only pull requests are cancelled. A push to main runs to completion: cancel
# it and the commit that is actually on main carries a cancelled status, and a
# failure it introduced is attributed to whichever merge landed next.
concurrency:
  group: infrastructure-tests-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cdk-python-tests:
    name: CDK Stack Tests (Python)
    runs-on: ubuntu-latest
    # No id-token: nothing in this job can assume an AWS role. The CLI check
    # below depends on that.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js (required by the CDK jsii runtime)
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: pip install -r backend/requirements.txt

      # The runner's own AWS CLI, with no credential of any kind: rollback.yml's
      # and deploy.yml's exact create-deployment flags, with the alarm override
      # carrying each workflow's own single-quoted JSON value (#777), must
      # validate with --generate-cli-skeleton (no service call), and the same
      # value with `"enabled":"nope"` must be refused with 252 in the same run
      # (#148 EM condition 13). The skeleton accepts a value CodeDeploy refuses
      # (measured: `enabled=false` exits 0), so the value's rules are pinned by
      # the fake aws in the unit tests, not here. The script refuses to start
      # if a key is set.
      - name: The runner's AWS CLI accepts the create-deployment flags
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          aws --version
          python3 scripts/check_create_deployment_cli.py

      # --import-mode=importlib keeps the local `infrastructure/constructs`
      # directory from shadowing the `constructs` package that aws-cdk-lib needs.
      - name: Run CDK stack tests
        run: |
          python -m pytest infrastructure/tests -v --tb=short \
            -o addopts="" --import-mode=importlib --junitxml=cdk-junit.xml

      # A skipped CDK test is a renamed file its constant still names (QA 4d):
      # the suite used to exit 0 with two of them skipped.
      - name: No CDK test was skipped
        run: python3 scripts/check_junit_skips.py cdk-junit.xml infrastructure/tests

      # The AWS installer beta's tests run against a fake aws
      # (backend/tests/installer_sweeps/harness). Here the runner's own CLI,
      # with no credential of any kind, is pointed at a stub on 127.0.0.1 that
      # serves the fake's own response for every call the beta makes, and must
      # print what the fake prints (gate H6). It runs outside pytest, because
      # every pytest session blocks the real CLI (backend/tests/no_real_aws.py),
      # and after the CDK tests whatever their result, so a failure in one does
      # not hide the other. The script refuses to start if a key is set.
      - name: The fake aws answers as the runner's AWS CLI does
        if: ${{ !cancelled() }}
        env:
          AWS_CONFIG_FILE: /dev/null
          AWS_SHARED_CREDENTIALS_FILE: /dev/null
          AWS_EC2_METADATA_DISABLED: 'true'
        run: |
          aws --version
          python3 scripts/check_installer_cli.py

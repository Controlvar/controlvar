name: RC log read diagnostic (TEMPORARY)

# TEMPORARY, remove before merge (with scripts/diag_rc_log_read.py and
# backend/tests/unit/scripts/test_diag_rc_log_read.py).
#
# T174: in rc-evidence.yml the verify job's reads of the sdk-release.yml build
# logs (gh api .../actions/jobs/<id>/logs) failed every time, while a user token
# reads the same logs. rc-evidence.yml runs only at a vX.Y.Z tag, so this runs
# the verifier's own read on the pull request, with the token the verify job
# holds (contents: read, actions: read), against a build job whose log a user
# token still reads: 117518217494, "test and build for npm" of run 39074309425
# (sdk/js/v0.1.1). It prints what the token got and always exits 0: its log is
# the result. It never prints the token, the log or a URL (only a Location's
# host: its query is a signature).

on:
  pull_request:
    paths:
      - '.github/workflows/diag-rc-log-read.yml'
      - 'scripts/rc_evidence.py'
      - 'scripts/diag_rc_log_read.py'

permissions:
  contents: read
  actions: read

jobs:
  diag:
    name: RC log read diagnostic
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Read a build job's log as the RC verifier does
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_ID: '117518217494'
        run: python3 scripts/diag_rc_log_read.py "$JOB_ID"

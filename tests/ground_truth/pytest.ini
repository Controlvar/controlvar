# The ground-truth replay (#1544) is its own pytest root, like the docs-journey
# runner's (tests/acceptance/docs/pytest.ini): the repository's root
# conftest.py and pyproject.toml settings do not apply here. `.` puts the
# library (ground_truth/) on the path and `../..` the repository root, for the
# one plugin taken from it: backend/tests/no_real_aws.py, so nothing run from
# here can reach an AWS account. The library's own unit gates run in the
# backend's unit job (backend/tests/unit/ground_truth).
[pytest]
pythonpath = . ../..
python_files = test_*.py
testpaths = .
addopts = -p no:cacheprovider --strict-markers --strict-config -p backend.tests.no_real_aws
xfail_strict = true
empty_parameter_set_mark = fail_at_collect

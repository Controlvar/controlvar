# The over-the-wire use cases (D210 v3, use cases #1 and #2: percentage rollouts
# and the kill switch) are their own pytest root, like the ground-truth replay
# (tests/ground_truth/pytest.ini): the repository's root conftest.py and
# pyproject.toml settings do not apply here. `.` puts the harness (usecases/)
# on the path, `../ground_truth` the ground-truth library and its driver, and
# `../..` the repository root, for the one plugin taken from it:
# backend/tests/no_real_aws.py, so nothing run from here can reach an AWS
# account. The harness's own unit gates run in the backend's unit job
# (backend/tests/unit/usecases).
[pytest]
pythonpath = . ../ground_truth ../..
python_files = test_*.py
testpaths = .
addopts = -p no:cacheprovider --strict-markers --strict-config -p backend.tests.no_real_aws
xfail_strict = true
empty_parameter_set_mark = fail_at_collect

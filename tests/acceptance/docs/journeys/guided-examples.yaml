  - id: stop-simulator
    doc: ab-stop-the-simulator
    do:
      run:
        command: |
          pid="$(cat demo/.pids/shoplab-simulator.pid)"
          if ps -o args= -p "$pid" | grep -qF demo/shoplab/simulator/traffic.py; then kill "$pid"; fi
          while ps -o args= -p "$pid" | grep -qF demo/shoplab/simulator/traffic.py; do sleep 1; done
          printf 'ShopLab simulator stopped\n'
        up_to_seconds: 60
    expect:
      exit: 0
      output:
        - ShopLab simulator stopped
    fail: demo/setup-local.sh left no ShopLab simulator pid file, or the simulator is still running after the page's block, so its visitors would move the counts below

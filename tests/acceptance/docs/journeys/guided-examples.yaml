# Guided examples (docs/guides/guided-examples.md), as its reader follows it
# (#1368): every numbered step of the page, in the page's order, on the stack
# demo/setup-local.sh starts (demo-local). Each step's `doc` is the explicit
# anchor of one numbered step of the page, and
# backend/tests/unit/docs/test_docs_journey_guided_examples.py holds the two in
# step: the page's numbered steps and this file's `doc` values are the same
# list in the same order, each step's "You will see" is checked here by an
# ARIA, JSON or output expectation, and the page's last section, "What these
# examples do not cover", has no steps. registry.EVERY_STEP_RUN names this
# journey, so no step may be waived or handed to Doc Examples: its verdict is
# PASS or FAIL, never PARTIAL.
#
# It runs last in the demo job (file order: demo-guide, demo-shoplab,
# demo-streampulse-simulator, demo-streampulse, guided-examples), after
# demo-shoplab has stopped the ShopLab simulator and completed the checkout
# flow. So it counts on the hero banner, an experiment no other journey
# pauses, and it stops the ShopLab simulator again with a block that does
# nothing when the simulator has already gone (the same command-line check
# as teardown-local.sh: a pid whose process is not the simulator is left
# alone), then waits until that pid is no longer the simulator. The ShopLab
# simulator is the only one that writes to ShopLab's experiments: the
# StreamPulse simulator sends its own app's five experiments and flags, and
# simulate_live_events.py the core seed's two, and the StreamPulse steps
# below count nothing, so those two keep running.
#
# The visitor is chosen offline (values.choose_visitor with the name
# "docs-guided-examples"): a UUIDv4 outside the demo's global holdout, in the
# hero banner's video_hero arm, the buy button's control (whose words are
# "Add to cart") and the checkout flow's standard arm (the 3-step form, the
# form a completed checkout flow shows too). It is not demo-shoplab's
# visitor, which has already bought in the hero banner.
#
# 1. The A/B test: the visitor's press of the hero's button counts once, in
#    video_hero, read before and after through results with use_cache=false
#    (the before read is after the home page assigned the visitor), and the
#    results page shows the API's users per arm.
# 2. Paused (in the dashboard, before the visit), the storefront shows the
#    control with the reason `paused`, and an order counts in no arm of the
#    hero banner. That the order reached the API is read from the buy-button
#    test, which is running and counts it (+1 in the visitor's arm): the same
#    request carries both, so a hero read after it is not early. Started
#    again, a second order counts once, in video_hero (the paused one did not
#    make the visitor a buyer). Then the free-shipping flag off and on.
# 3. StreamPulse's AI search rule, by preset and at its OS-version boundary.
#
# Expectations written on 2026-10-28 from the page, demo-shoplab.yaml's order
# steps (the same storefront and form), the seeds and the apps' source,
# before the first run.
guide: guides/guided-examples.md

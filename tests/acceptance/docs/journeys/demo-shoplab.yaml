# ShopLab (demo/shoplab/README.md), as its reader runs it (#1142): the README
# says demo/setup-local.sh does everything "Running it" lists, so the journey
# runs on the stack that script starts (demo-local, docs_runner/stacks.py) and
# walks the storefront, the dashboard it points at, and the kill switch.
#
# The storefront calls the public API with its own key (the seed writes it to
# demo/shoplab/.env.local), so the Controlvar panel showing the hero test's
# variant, which the home page assigned, is the key and the seed working. The
# panel assigns nothing itself (2026-10-27): on the home page the other three
# experiments read "not assigned yet" until the page that uses each opens.
# What the seed made is read through the API: the four experiments, each the
# kind the README's table says, and the two flags with the search flag's
# 10% -> 50% -> 100% schedule. The kill switch is turned off in the dashboard
# and back on, and an API key made for the run evaluates the flag in between,
# as the storefront does; the key never reaches the browser, so the journey is
# not recorded.
#
# Expectations written on 2026-10-11 from the README, the seed
# (backend/scripts/seed_shoplab.py) and the storefront's source, before the
# first run. products-direct (#1172) was added on 2026-10-14: it opens /products
# as the first page of a load, as an address typed or a reload does, and expects
# the list's heading and its twelve items. That load closes the panel, so the
# arm and its sort label are checked by the products step alone (below).
#
# The products sort (shoplab_plp_sort) is a bandit, and the tracking API routes
# a new visitor by the bandit's current weights, so the journey's fresh visitor
# lands in any arm (#1375). The products step therefore checks the pair: the
# arm the panel shows the API gave this visitor, and the sort label for that
# arm (demo/shoplab/src/lib/sorting.ts). The panel is still open there, because
# the header's link does not reload the page. The stack also has a 2% global
# holdout (the StreamPulse seed makes it, and it covers every experiment), and
# a visitor in it is enrolled in no arm: the API answers the control, so the
# list is sorted by the control's label and the panel says the visitor is in
# the holdout (demo/shoplab/src/lib/labels.ts). That is the step's fourth
# snapshot. The panel step's hero row already allows for that visitor; its
# other three rows read "not assigned yet" whoever the visitor is.
#
# The visitor is chosen (2026-10-28), not random: `visitor` is
# values.choose_visitor()'s answer, a UUIDv4 outside the demo's global holdout,
# put in the storefront's localStorage before the first page, and the panel
# step expects the panel to show it. By the documented assignment hash it is
# in shoplab_checkout_flow's `standard` arm (and green_add of the buy button,
# whose words stay "Add to cart"). The bandit still routes it by its weights,
# so the products step keeps a template per arm; its held-out template is
# never used by this visitor and is kept for a run without one.
#
# The last steps check that an order placed in the storefront lands in the
# visitor's arm and nowhere else, exactly, as the README's event vocabulary
# says: a purchase with no key goes to every experiment the page assigned.
# 1. The simulator demo/setup-local.sh started is stopped as the README says,
#    and gone, so nothing else moves the counts; it is not restarted, and
#    every step after it belongs to this check.
# 2. The visitor opens a product, adds it to the cart and opens checkout,
#    which assigns the checkout flow. The panel shows the arm, and the arm
#    the API holds for the visitor is asked again (/tracking/assign answers an
#    assigned visitor with their stored arm): `standard`. Every count below
#    is read for that arm and the other, by name, so an arm in another order
#    fails rather than passing for the wrong one.
# 3. The experiment is paused, then the counts are read (results with
#    use_cache=false: the cache keeps results for up to five minutes), after
#    the visitor's assignment, so the assignment is in the "before" numbers.
# 4. The visitor, still on the checkout page that was assigned while the
#    experiment ran, places an order. It reaches the API tagged with the
#    experiment, which stores it in no arm while paused: one more event for
#    the experiment, and +0 users and +0 conversions in each arm. The panel
#    then says the experiment is paused, not an error.
# 5. Resumed, the panel shows the visitor's arm again, and a second order
#    counts once, in that arm: +1 conversion there, +0 in the other, +0 users
#    in each. The results page shows the API's numbers for both arms.
# 6. Completing the experiment comes last; the panel then says so.

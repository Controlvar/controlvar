# Every page in the docs navigation, and how it is verified end to end (#939).
#
# Each page that the `nav` of mkdocs.yml lists is one key under [pages]: the path
# exactly as the nav writes it, relative to docs/; a page the nav lists twice is
# one key. backend/tests/unit/docs/test_docs_inventory.py fails on a nav page
# with no entry here, an entry the nav does not list, a duplicate key, an
# unknown class, a field not listed below, and on each rule under "Classes".
# It runs in the unit job, in Doc Examples, and in core-build's docs tests on a
# pull request that changes only documentation. So a page added to the nav
# needs an entry here in the same pull request.
#
# Classes (exactly one per page):
#
#   journey             walked in a browser against a stack, by the journey
#                       runner in tests/acceptance/docs/, with expectations
#                       written before the run in journeys/<journey>.yaml.
#                       `journey` names that file. `pending = true` declares a
#                       journey whose file is not written yet; it is refused
#                       once the file exists. The runner is to refuse a pending
#                       journey at run time, so pending is never a pass.
#   exec                its shell examples run in Doc Examples
#                       (scripts/doc_examples.toml enrols it with at least one
#                       exec block); no browser step is walked.
#   workflow            its steps are run by the workflow that `workflow` names
#                       (.github/workflows/<workflow>.yml), whose
#                       `on.<event>.paths` lists the page, `docs/<page>`, as a
#                       literal entry: a glob such as `docs/**`, or a mention
#                       in a comment or a step, does not count.
#   reference           nothing is walked: it has no steps to follow, or the
#                       reason says why its steps are not walked. The docs-site
#                       journey checks that it answers on the published site
#                       with its source heading, like every nav page.
#   aws                 needs an AWS account; to be reported NOT RUN.
#                       `exercised_by` names the steps that exercise the page,
#                       each one of: a step of #295 (the first deploy to a real
#                       staging account, and a rollback rehearsal) word for
#                       word, without its closing punctuation; `605` (#605,
#                       which backs up two DynamoDB tables and removes them);
#                       `production-deploy` (the first deploy to production).
#                       Or `["none"]` when no step does. A page maps to a step
#                       when the step does what the page tells a reader to do,
#                       or creates what it describes. It says which step
#                       exercises the page, never whether that step has run.
#   external:<service>  needs a third-party account or service, named by the
#                       slug after the colon; to be reported NOT RUN.
#   device              needs a mobile toolchain and a simulator or device; to
#                       be reported NOT RUN.
#
# Fields: `class` and a one-line `reason` on every page; `journey` (a slug) and,
# until its file exists, `pending = true` on a journey, with `planned` naming
# the pull request of the QA plan (#897, #939) that writes it: "D2", "D3a",
# "D3b", or "unassigned"; `workflow` on a workflow; `exercised_by` on an aws
# page.
#
# [[flow]] maps each flow in the "Flows, at least" list of #939 to journeys, to
# pages (whose class and reason are above) or to every page of a class. The test
# holds that list itself, so a flow cannot drop out of the mapping.
#
# The journeys' run summary (docs_runner/report.py) prints the #939 mapping, and
# every nav page that is not a journey that ran with its class and reason, so
# what is not walked is listed, never silent. A pending journey is shown as
# planned in the pull request `planned` names, never as passed.

[pages."README.md"]
class = "journey"
journey = "docs-site"
reason = "the landing page: the docs-site journey starts here, then checks every nav page's heading and every link to the site on the published site, and that search finds four pages"


# ---------------------------------------------------------------------------
# The "Flows, at least" list of #939, each mapped to what verifies it.
# ---------------------------------------------------------------------------

[[flow]]
text = "the docs site: every page in the nav reachable, links resolve, search works, the power analysis and sample size pages render and calculate"
journeys = ["docs-site", "power-calculator"]
note = "the published site answers for every nav page with its source heading and search finds it; in-site links are mkdocs strict's; the calculator meets a scipy oracle"

[[flow]]
text = "Quick Start, end to end"
journeys = ["quick-start"]
note = "its shell steps run in Doc Examples; the journey walks the dashboard half"

[[flow]]
text = "the Docker Compose guide: start the stack as written, open the dashboard, sign in"
journeys = ["docker-guide"]
note = "the stack started with the guide's own command, then the dashboard's sign-in"

[[flow]]
text = "feature flags: create, targeting, gradual rollout, safety monitoring"
journeys = ["feature-flag-create", "feature-flag-rollout", "feature-flag-safety"]
pages = ["Enhanced_Rules_Engine_Reference.md", "guides/segments.md"]
note = "targeting is a step of the create journey; rollout and safety monitoring are journeys of their own"

[[flow]]
text = "experiments: the guided builder, assign, track, results (including the statistics the guide promises)"
journeys = ["experiment-wizard", "experiment-results"]
pages = ["api/sequential-testing.md", "api/bayesian.md", "api/cuped.md", "statistics/fdr-correction.md"]
note = "seeded assignments and conversions feed the results journey; the statistics pages' API examples run in Doc Examples"

[[flow]]
text = "the dashboard-and-API guide and the API examples (the `{.bash exec}` blocks that `doc-examples.yml` already runs)"
pages = ["guides/dashboard-and-api.md"]
classes = ["exec"]
note = "the table is held to the dashboard's source by a unit test; every exec page's examples run in Doc Examples"

[[flow]]
text = "the SDK quick starts"
journeys = ["sdk-javascript", "sdk-python", "sdk-go"]
pages = [
    "sdk/java.md",
    "sdk/react.md",
    "sdk/ios.md",
    "sdk/android.md",
    "sdk/flutter.md",

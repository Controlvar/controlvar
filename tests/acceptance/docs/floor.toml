# The information floor (#1142): every route and setting an in-scope document
# names. backend/tests/unit/docs/test_docs_floor.py holds it:
#
# * each entry under `routes` and `settings` is named by at least one in-scope
#   document (tests/acceptance/docs/inventory.toml says which documents are in
#   scope). A change that cuts the last mention is refused, unless it moves the
#   entry to [retired] with a reason;
# * the lists are exact: a route or setting that a document names for the
#   first time is added in the same change, and an entry that the OpenAPI
#   snapshot (docs/api/openapi-v1.full.json) or backend/app/core/config.py no
#   longer has comes off;
# * [retired] maps a route or setting that no in-scope document names any more
#   to the reason, one line of 1-200 characters. A retired entry that a
#   document names again moves back to its list.
#
# A route is its path exactly as the snapshot writes it; a document names it
# when it writes the whole path, from /api/v1/, with anything standing for each
# {parameter}. A setting is its name, written as a whole word. The test's
# docstring has the details.
#
# Measured when the floor was set: 144 of the stable snapshot's 158 paths, 181
# of the full snapshot's 214, and 65 of config.py's 78 settings.


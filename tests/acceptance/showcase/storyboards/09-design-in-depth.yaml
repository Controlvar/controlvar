# Video 9, Design an experiment in depth: past the basics of guided setup (video
# 2) into the options the dashboard offers when an experiment is designed: a
# second metric, a third version and its traffic split, who can join (a
# targeting rule), the confidence level and the multiple-comparison correction,
# the Bayesian view, the Review step and the saved draft. Then what guided
# setup does not offer, set on that draft through the API on camera (an
# exclusion group, a global holdout, a start date and sequential testing),
# each request and the API's own answer drawn by the tool, and two reads of
# what was saved. On the `demo` seed; the experiment is created and left a
# draft, so no traffic is sent.
#
# * The departures from a new user's path, each stated on screen where it
#   happens: the sign-in, done off camera (the first caption); the API calls,
#   made as the admin signed in off camera (the console's label, and the API
#   card's note); and the exclusion group "Checkout tests", made off camera
#   before the first scene with the seeded Checkout Button Color in it
#   (`setup`), so that adding this draft to it shows a group of two (beat B's
#   caption and note). Nothing else is set up, simulated, skipped or masked.
# * The API scene (`console`) shows six calls, in this order: the group add,
#   the holdout, the schedule, sequential testing, then the experiment and the
#   holdout read back. The group add comes before the two experiment PUTs: it
#   does not refresh the API's cached copy of the experiment, and they do, so
#   the read-back shows the group. Each id is made by the run and named
#   here only by a placeholder. The holdout is global: it keeps new users out
#   of every experiment, this one included, and is never said to belong to
#   this experiment.
# * The share boxes are changed by selecting the number and typing over it
#   (`select: true`), the way a person commonly replaces a value. Emptying a
#   share box and then typing draws a leading zero ("034") while 34 is saved;
#   that behaviour is reported as a product issue and is not filmed here. The
#   typed-as-shown check (gate 12) refuses any `type` step whose field does not
#   read exactly what was typed, so a "034" can never be filmed unseen.
# * Gate 10 ("design") reads the experiment back through the API: one draft
#   with this name and key, the variants and metrics keyed by name, the
#   targeting rule as the builder sent it (its ids aside), the analysis
#   settings, and nothing guided setup cannot set. The Review rows and the
#   page's analysis rows recorded below must say, in the product's own words,
#   what was saved.
# * What each narrated claim rests on:
#   - "Everyone else gets the control, and isn't enrolled": an ineligible user
#     gets the control with `assigned: false` and no assignment
#     (test_tracking_api.py::test_dashboard_shaped_targeting_rules_gate_new_users);
#     the rule admits exactly US and CA visitors
#     (test_showcase_design_in_depth.py, with the server's own eligibility check).
#   - "which lock once it starts": the confidence level and the correction are
#     refused after draft (the experiments API's update path). The Bayesian
#     view is not claimed to lock.
#   - "keeps false winners to about 5% of all winners": the correction's own
#     help text, drawn while it is said ("about 5% (at 95% confidence)").
#   - "each version's chance of being best": the Bayesian panel's "Chance to be
#     best" for every variant.
#   - Each sentence of the API card and the API scene: its row of CLAIMS in
#     test_showcase_quoted_docs.py, with what is drawn while it is said and
#     the pages of the docs that state it. The API words (holdout, exclusion,
#     sequential, schedule, CUPED) are said only in those two scenes.
# * Length cuts, in order, if the voiced length runs over 143 s. Each drops or
#   moves whole sentences, so none needs a new clip: (1) drop "That includes
#   this one."; (2) drop "Check results whenever you like, and stop once the
#   evidence is strong."; (3) drop "Until then, it stays a draft."; (4) drop
#   the beat "Also in this answer" and its sentence; (5) drop the API card and
#   say its sentence second at the saved draft's beat, its note then drawn by
#   the console's label.
# * `say` is the narration, in the other videos' voice; every number it says
#   is drawn while it is said (G2): "100%" in "Currently 100%", "5%" in the
#   correction's help text, and "5%" in the holdout beat's note. No sentence
#   says a date or a clock time: the start date is drawn, never said.
slug: 09-design-in-depth
title: "Design an experiment in depth"
seed: demo
seed_counts: {experiments: 3, feature_flags: 2, users: 4}
never_show:
  - Assign a user from your app
  - guardrail
end_state:
  signed_in_as: admin@demo.com
  design:
    name: Delivery promise
    key: delivery_promise
    status: draft
    type: a_b
    variants:
      - {name: Control, allocation: 34, control: true}
      - {name: Treatment, allocation: 33}
      - {name: Variant 2, allocation: 33}
    metrics:
      - {name: Purchase, event: purchase, type: conversion, primary: true}
      - {name: Add to cart, event: add_to_cart, type: conversion}
    targeting:
      logical_operator: AND
      groups:
        - logical_operator: AND
          conditions:
            - {attribute: user.country, operator: in, value: "US, CA"}
    analysis: {confidence: 0.95, correction: benjamini_hochberg, bayesian: true}
    shown:
      review_variants: review-variants
      review_metrics: review-metrics
      review_targeting: review-targeting
      review_analysis: review-analysis
      detail_analysis: analysis
      detail_bayesian: bayesian
    api: [exclusion_group, holdout, scheduled_start, sequential]
setup:
  exclusion_groups:
    - name: Checkout tests
      traffic_allocation: 1.0
      experiments: [Checkout Button Color]
scenes:
  - id: design
    open: /experiments
    signed_in: true
    departures:
      - kind: off-camera setup
        says: Signed in off camera
    beats:
      - cue: Signed in off camera. Past the basics of guided setup.
        focus: {testid: new-experiment-btn}
        say:
          - Choose New Experiment.
        steps:
          - move: {testid: new-experiment-btn}
        exit:
          - click: {testid: new-experiment-btn}
          - wait_for: {testid: wizard-step-heading}
          - click: {testid: wizard-next}

      - before:
          - wait_for: {role: heading, name: Name it and choose what to measure}
        cue: Name it, and the key fills itself in.
        focus: {testid: experiment-name}
        say:
          - Name it, and the key your code uses fills itself in.
        steps:
          - type: {testid: experiment-name}
            text: Delivery promise
          - look: {testid: experiment-key}
            ms: 1000

      - before:
          - scroll_to: {testid: metric-row-0}
        cue: "The primary metric: the one you decide on."
        focus: {testid: metric-row-0}
        say:
          - "Make purchases the primary metric: the one you decide on."
        steps:
          - type: {testid: metric-name-0}
            text: Purchase
            clear: true
          - type: {testid: metric-event-0}
            text: purchase
            clear: true

      - cue: Add a metric to track alongside it.
        focus: {testid: metrics-section}
        say:
          - "Add a second metric to track alongside it: add to cart."
        steps:
          - click: {testid: add-metric}
          - type: {testid: metric-name-1}
            text: Add to cart
          - type: {testid: metric-event-1}
            text: add_to_cart
        exit:
          - click: {testid: wizard-next}

      - before:
          - wait_for: {role: heading, name: Set up the versions users will see}
        cue: Add a third version, and split the traffic.
        focus: {css: "div.space-y-3:has([data-testid=variant-row-0])"}
        say:
          - Add a third version, and split the traffic so it reaches 100%.
        steps:
          - click: {testid: add-variant}
          - type: {testid: variant-allocation-0}
            text: "34"
            select: true
          - type: {testid: variant-allocation-1}
            text: "33"
            select: true
          - type: {testid: variant-allocation-2}
            text: "33"
            select: true

      - before:
          - scroll_to: {testid: add-group}
        cue: Choose who can join, from what your app sends.
        focus: {css: "div.space-y-4:has(> div > h3)"}
        say:
          - "Choose who can join from what your app sends: US or Canada."
          - Everyone else gets the control, and isn't enrolled.
        steps:
          - click: {testid: add-group}
          - type: {testid: condition-attribute}
            text: user.country
          - choose: {testid: condition-operator}
            option: is one of
          - type: {testid: condition-value}
            text: US, CA
        exit:
          - click: {testid: wizard-next}

      - before:
          - wait_for: {testid: analysis-settings}
        cue: Confidence and correction lock once it starts.
        focus: {css: "fieldset[data-testid=analysis-settings] > div.grid"}
        say:
          - Next, a confidence level and a correction, which lock once it starts.
        steps:
          - look: {css: "div:has(> #analysis-confidence)"}
            ms: 1500

      - cue: Several versions? Correct for lucky winners.
        focus: {css: "div:has(> #analysis-correction)"}
        say:
          - With several versions, one can look like a winner by luck.
          - Benjamini-Hochberg, the default, keeps false winners to about 5% of all winners.
        steps:
          - look: {css: "div:has(> #analysis-correction)"}
            ms: 2000

      - cue: "Optional: a Bayesian view of the primary metric."
        focus: {css: "div:has(> #analysis-bayesian)"}
        say:
          - Turn on Bayesian to also see each version's chance of being best.
        steps:
          - click: {testid: analysis-bayesian}
          - look: {css: "div:has(> #analysis-bayesian)"}
            ms: 1000
        exit:
          - click: {testid: wizard-next}

      - before:
          - wait_for: {testid: wizard-review}
        cue: Review your choices, then create it.
        focus: {css: "div.py-3:has([data-testid=review-variants])"}
        say:
          - Review your choices, then create it.
        record:
          review-variants: {testid: review-variants}
          review-metrics: {testid: review-metrics}
          review-targeting: {testid: review-targeting}
          review-analysis: {testid: review-analysis}
        steps:
          - look: {testid: review-variants}
            ms: 1000
          - look: {testid: review-analysis}
            ms: 1000
        exit:
          - click: {testid: wizard-create}

      - before:
          - wait_for: {testid: experiment-analysis}
        cue: Saved as a draft, with its versions, metrics and analysis.
        focus: {css: "div.bg-white:has([data-testid=experiment-analysis])"}
        say:
          - It's saved as a draft, with its versions, metrics and analysis.
        record:
          analysis: {testid: experiment-analysis}
          bayesian: {testid: experiment-bayesian}
        payoff: true
        steps:
          - look: {testid: experiment-analysis}
            ms: 1000
          - look: {testid: experiment-bayesian}
            ms: 800
          - look: {testid: variants-table}
            ms: 1200
          - look: {testid: metrics-list}
            ms: 1000

  - id: api-intro
    card:
      label: The rest of the setup
      headline: Through the API
      note: >-
        Requests to this same stack, as the admin signed in off camera; the token
        is not shown. Each response is the API's own, cut to the lines that matter.
    beats:
      - cue: "Past guided setup: the rest goes through the API."
        focus: {css: "#headline"}
        say:
          - "Guided setup ends here: you do the rest through the API."

  - id: api
    console:
      label: Signed in to the API off camera
    departures:
      - kind: off-camera setup
        says: Signed in to the API off camera
      - kind: off-camera setup
        says: made off camera
    beats:
      - cue: Join a group made off camera, with Checkout Button Color.
        focus: {css: "#console"}
        note: >-
          Checkout tests and its member Checkout Button Color were made off camera.
          Experiments in the same group never share a user.
        say:
          - Experiments in the same exclusion group never share a user.
          - Add this draft to the group with Checkout Button Color.
        call:
          method: POST
          path: /api/v1/mutual-exclusion-groups/{group}/experiments
          body: {experiment_id: "{experiment}"}
          show: [status, experiment_id, group_id]
          answer:
            status: 200
            fields: {status: ok, experiment_id: "{experiment}", group_id: "{group}"}
        steps:
          - send: true
          - look: {css: '#response > div[data-key="group_id"]'}
            ms: 2000

      - cue: "Global holdout: 5% of new users kept out of every experiment."
        focus: {css: "#console"}
        note: >-
          5% of new users are kept out of every experiment, this one included. One
          holdout is active at a time.
        say:
          - A global holdout keeps 5% of new users out of every experiment.
          - That includes this one.
        call:
          method: POST
          path: /api/v1/holdout
          body: {name: Q4 holdout, holdout_percentage: 5, is_active: true}
          show: [name, holdout_percentage, is_active]
          answer:
            status: 201
            fields: {name: Q4 holdout, holdout_percentage: 5, is_active: true}
          keep: {holdout: id}
        steps:
          - send: true
          - look: {css: '#response > div[data-key="holdout_percentage"]'}
            ms: 2000

      - cue: Schedule its start; it starts on its own.
        focus: {css: "#console"}
        say:
          - Give it a start date, and it starts on its own.
          - Until then, it stays a draft.
        call:
          method: PUT
          path: /api/v1/experiments/{experiment}/schedule
          body: {start_date: "{start}"}
          show: [status, start_date]
          answer:
            status: 200
            fields: {status: draft, start_date: "{start}"}
        steps:
          - send: true
          - look: {css: '#response > div[data-key="start_date"]'}
            ms: 2000

      - cue: "Sequential testing (beta): check often, stop early."
        focus: {css: "#console"}
        note: >-
          Beta. Check whenever you like; it compares the control with the first
          treatment, on the primary metric.
        say:
          - Turn on sequential testing, in beta.
          - Check results whenever you like, and stop once the evidence is strong.
        call:
          method: PUT
          path: /api/v1/experiments/{experiment}
          body: {sequential_testing_enabled: true}
          show: [status, start_date, sequential_testing_enabled, mutual_exclusion_group_id]
          answer:
            status: 200
            fields:
              status: draft
              start_date: "{start}"
              sequential_testing_enabled: true
              mutual_exclusion_group_id: "{group}"
        steps:
          - send: true
          - look: {css: '#response > div[data-key="sequential_testing_enabled"]'}
            ms: 2000

      - cue: "Also in this answer: the group and the start date."
        focus: {css: "#console"}
        say:
          - The answer also carries the group's id and the start date.
        steps:
          - look: {css: '#response > div[data-key="mutual_exclusion_group_id"]'}
            ms: 1500
          - look: {css: '#response > div[data-key="start_date"]'}
            ms: 1500

      - cue: "Read back: a draft, in its group, scheduled, sequential on."
        focus: {css: "#console"}
        say:
          - "Read it back: it's still a draft, in its group."
          - It has its start date, and sequential testing is on.
        call:
          method: GET
          path: /api/v1/experiments/{experiment}
          show: [status, start_date, sequential_testing_enabled, mutual_exclusion_group_id]
          answer:
            status: 200
            fields:
              status: draft
              start_date: "{start}"
              sequential_testing_enabled: true
              mutual_exclusion_group_id: "{group}"
        steps:
          - send: true
          - look: {css: '#response > div[data-key="status"]'}
            ms: 1200
          - look: {css: '#response > div[data-key="mutual_exclusion_group_id"]'}
            ms: 1200
          - look: {css: '#response > div[data-key="start_date"]'}
            ms: 1200
          - look: {css: '#response > div[data-key="sequential_testing_enabled"]'}
            ms: 1200

      - cue: "The global holdout: active."
        focus: {css: "#console"}
        say:
          - And the holdout is active.
        call:
          method: GET
          path: /api/v1/holdout
          show: [id, name, holdout_percentage, is_active]
          answer:
            status: 200
            fields: {id: "{holdout}", name: Q4 holdout, holdout_percentage: 5, is_active: true}
        steps:
          - send: true
          - look: {css: '#response > div[data-key="is_active"]'}
            ms: 2000

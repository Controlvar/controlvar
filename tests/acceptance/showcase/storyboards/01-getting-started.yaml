# Video 1, Getting started: the Quick Start's stack, signing in, the seeded
# experiments and a result, and a flag rolling out. The `demo` seed only, which
# is what the Quick Start gives. The UX draft's V1 storyboard (#1066), with the
# stack shown as a labelled card of the documented command rather than a
# recording (plan ruling R5).
#
# A beat's click that leaves the page is in its `exit`, so the caption stays up
# while the next page opens: the capture directory allows at most a second
# without one.
#
# `say` is the narration (#1066 voiceover): the UX draft's spoken script, with
# every number in digits as the page prints it, and every number on the page
# while it is said (the card's note says "3 experiments, 2 flags" to match).
# `python -m showcase.voice` (make showcase-voice) makes its clips, and the
# capture holds each beat for them (showcase.capture.voiced).
#
# D84: the card says what the Quick Start's command starts, and how this
# recording differs, on screen: the same stack, started off camera from the
# release's compose file in its own compose project on other ports (D84(a);
# showcase.capture.compose), results computed before they are opened, and the
# waits for a page cut.
slug: 01-getting-started
title: Get started
seed: demo
seed_counts: {experiments: 3, feature_flags: 2, users: 4}
end_state:
  signed_in_as: admin@demo.com
  experiments_listed: 3

scenes:
  - id: stack-card
    card:
      label: "The Quick Start's command: shown here, not run"
      command: "docker compose up -d --wait"
      note: >-
        It starts Postgres 16, Redis 7, the API and the dashboard, with the demo
        seed: 3 experiments, 2 flags. This recording starts the same stack off
        camera, in its own compose project on other ports; results are computed
        before they are opened, and waits for a page are cut.
    beats:
      - cue: One command starts the whole stack on your machine.
        focus: {css: "#command"}
        say:
          - "One command starts the whole stack on your machine: docker compose up."
      - cue: Postgres, Redis, the API and the dashboard, with demo data.
        focus: {css: "#card"}
        say:
          - Postgres, Redis, the API and the dashboard all come up.
          - "With demo data: 3 experiments and 2 flags."

  - id: dashboard
    # D84: the results are asked for off camera before the scene (so no
    # skeleton is filmed); the results beat's headline says so.
    departures:
      - kind: off-camera setup
        says: computed off camera first
    open: /
    warm_results: [Homepage Hero Copy Test]
    beats:
      - cue: Open the dashboard in your browser.
        focus: {role: link, name: Sign in, exact: true}
        say:
          - Open the dashboard in your browser, and choose Sign in.
        steps:
          - move: {role: link, name: Sign in, exact: true}
        exit:
          - click: {role: link, name: Sign in, exact: true}

      - before:
          - url: "**/login"
          - wait_for: {role: button, name: Sign in, exact: true}
        cue: Sign in with the demo admin account from the Quick Start.
        focus: {css: form}
        say:
          - Sign in as the demo admin.
          - The email and password are in the Quick Start.
        steps:
          - type: {label: Email}
            text: admin@demo.com
          - type: {role: textbox, name: Password}
            text: "Demo1234!"
            secret: true
          - move: {role: button, name: Sign in, exact: true}
        exit:
          - click: {role: button, name: Sign in, exact: true}

      - before:
          - url: "**/experiments"
          - wait_for: {role: link, name: Homepage Hero Copy Test}
        cue: Your experiments, each with its status at a glance.
        focus: {css: table}
        say:
          - Here are your experiments, each with its status at a glance.
          - Open the completed one.
        steps:
          - look: {role: columnheader, name: Status}
            ms: 2000
          - move: {role: link, name: Homepage Hero Copy Test}
        exit:
          - click: {role: link, name: Homepage Hero Copy Test}

      - before:
          - wait_for: {role: link, name: View results}
        cue: Each one has its variants, its metric and a hypothesis.
        focus: {role: heading, name: Homepage Hero Copy Test}
        say:
          - It shows the variants, the metric it's judged on, and the hypothesis.
        steps:
          - look: {text: Variants, exact: true}
            ms: 1500
          - look: {text: Hypothesis, exact: true}
            ms: 1500
          - move: {role: link, name: View results}
        exit:
          - click: {role: link, name: View results}

      - before:
          - wait_for: {text: Winner, exact: true}
        cue: "Its results, computed off camera first: lift, p-value, winner."
        focus: {text: Winner, exact: true}
        payoff: true
        say:
          - Its results show the lift, the p-value, and a recommended winner.
          - "Here, the new copy wins: a 15% lift in sign-ups."
        steps:
          - look: {text: "improvement on Signup Conversion"}
            ms: 2000
          - look: {text: Winner, exact: true}
            ms: 1500
        exit:
          - click: {testid: nav-feature-flags}

      - before:
          - wait_for: {role: link, name: New Dashboard UI}
        cue: Feature flags turn a feature on for some users, or all.
        focus: {role: link, name: New Dashboard UI}
        say:
          - Feature flags turn a feature on for some users, or for everyone.
        steps:
          - move: {role: link, name: New Dashboard UI}
        exit:
          - click: {role: link, name: New Dashboard UI}

      - before:
          - wait_for: {text: Rollout schedule, exact: true}
        cue: Flags roll out in stages, with a safety check alongside.
        focus: {text: Rollout schedule, exact: true}
        say:
          - This flag rolls out in stages, with a safety check alongside.
        steps:
          - look: {text: Rollout schedule, exact: true}
            ms: 1800
          - look: {text: Safety check, exact: true}
            ms: 1800

      - cue: Each stage raises the share of users who get the flag.
        focus: {text: Expand to 50%, exact: true}
        say:
          - "Each stage raises the share of users: 10%, then 25%, now 50%."
        steps:
          - look: {text: Expand to 50%, exact: true}
            ms: 2500

      - cue: The safety check watches the error rate as it rolls out.
        focus: {text: Error rate, exact: true}
        say:
          - And the safety check watches the error rate as it rolls out.
          - Right now, it's healthy.
        steps:
          - look: {text: Error rate, exact: true}
            ms: 2000

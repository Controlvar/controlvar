# The showcase tool's checks that need a real browser (#1066) are their own
# pytest root, like the docs-journey runner's: the repository's root
# conftest.py and pyproject.toml settings do not apply here. See conftest.py.
[pytest]
pythonpath = ..
python_files = test_*.py
testpaths = .
addopts = -p no:cacheprovider --strict-markers --strict-config
markers =
    regression: a bug fix's test, which fails on the code before the fix
xfail_strict = true
empty_parameter_set_mark = fail_at_collect

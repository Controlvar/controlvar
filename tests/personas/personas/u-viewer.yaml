# U-VIEWER: viewer@demo.com, the viewer's normal day. The viewer follows what
# is live without being able to change it: every change is tried where the
# dashboard would offer it, and decided by asking the API with a valid body,
# then reading the thing back unchanged. The browser itself sends no change
# outside its read-only allow-list all day.
#
# The day reads an experiment and a flag the superuser made just before it
# (frontend/tests/e2e/personas/stamped.ts). Its password step changes the
# password of a viewer account the superuser made for the day, never the
# seeded one's.
id: U-VIEWER
role: VIEWER
account: viewer@demo.com
goals:
  - Follow a running experiment and a feature flag.
  - Export the results.
  - Be unable to change anything but one's own password.
day:
  - n: 1
    intent: browse a running experiment and find no change offered
    layer: A
    writes: true
    security: true
    oracles:
      - id: u-viewer.1.experiment-still-active
        kind: api_refused
        expect: >-
          the list offers no new experiment and the page no lifecycle action;
          POST /api/v1/experiments/{id}/pause as the viewer answers 403 and
          the experiment reads back active
        source:
          path: docs/rbac/README.md
          anchor: "**Viewer**: Can view experiments and every feature flag, and change neither"
      - id: u-viewer.1.reason-stated
        kind: text_exact
        expect: >-
          the experiment page says which permission the lifecycle actions need
          and that the viewer is a VIEWER
  - n: 2
    intent: browse a feature flag and find no change offered
    layer: A
    writes: true
    security: true
    oracles:
      - id: u-viewer.2.flag-unchanged
        kind: api_refused
        expect: >-
          the list offers no new flag and the flag page no switch, no editable
          rollout and no Save; PUT /api/v1/feature-flags/{id} as the viewer
          answers 403 and the flag reads back unchanged
        source:
          path: docs/rbac/README.md
          anchor: "owning a flag does not let an Analyst or Viewer change it"
      - id: u-viewer.2.reason-stated
        kind: text_exact
        expect: the flag page says which roles change feature flags
        source:
          path: frontend/src/utils/experimentPermissions.ts
          anchor: "Feature flags are created and changed with the feature flag permissions"
  - n: 3
    intent: download the results as CSV
    layer: A
    numeric: true
    oracles:
      - id: u-viewer.3.csv-equals-ledger
        kind: count_delta
        expect: >-
          the file has one row per variant, its assignments and conversions
          equal the ledger, and the treatment's p-value equals the results
          API's
        source:
          path: docs/guides/user-guide.md
          anchor: "**Download CSV** saves its variant rows as a CSV file"
  - n: 4
    intent: change a viewer account's own password at /account/password
    layer: A
    writes: true
    security: true
    oracles:
      - id: u-viewer.4.only-the-new-password-signs-in
        kind: api_state
        expect: >-
          after the change, signing in through the API answers 401 to the
          password it replaced and 200 to the new one
        source:
          path: docs/auth/auth-user-guide.md
          anchor: "asks for your current password and the new one twice"
  - n: 5
    intent: read the audit log and see only one's own entries
    layer: covered
    covered_by: frontend/tests/e2e/admin-panel.journey.spec.ts
  - n: 6
    intent: spend the day without sending a change outside the read-only allow-list
    layer: A
    oracles:
      - id: u-viewer.6.read-only-network
        kind: network_allowlist
        expect: >-
          every request other than GET is on its browser's allow-list: the
          viewer's own browser only signs in; the browser of the account made
          for the day signs in once and changes its own password once

# API fuzzing: the 5xx answers that are known, each with the public issue that
# tracks it or its cause.
#
# A 5xx counts against the route that ANSWERED the request, not the operation
# Schemathesis generated it for: scripts/fuzz_check.py resolves each one with
# the application's own router. A coverage-phase probe that sends DELETE to the
# path of GET /api/v1/users/me is answered by DELETE /api/v1/users/{user_id},
# and is listed under that.
#
# A pass is red when a route answers 5xx with a status not listed here for the
# pass, and when an entry listed for the pass answered no 5xx in the run (the
# bug was fixed: remove the entry). Each entry names its pass (superuser,
# viewer, sdk), the answering operation exactly as the served API document
# does ("METHOD /path"), the status, and either `issue` (the public issue that
# tracks it) or `cause`:
#
#   aws     the route calls AWS, and the fuzz stack points every AWS call at a
#           closed local port (fuzz.yml's api_env), so it answers 500 there;
#   config  the route needs a setting the fuzz stack deliberately leaves
#           unset, and answers 503 saying so.
#
# and a one-line reason. Entries are kept per pass and in the order of the
# document's paths.
#
# An entry covers every cause of its status on its route: a second bug there
# that answers the same status is not reported. When one route and status
# carry two issues, the entry cites the second in its reason (as POST
# /api/v1/holdout cited a duplicate name, #1019, beside #957 until #1019 was
# fixed). A pull request that fixes a cited issue
# removes its entries, unless the reason names another open issue for the
# same key; the stale refusal then says when the last one is fixed.
#
# The list holds for the seed it was built from, 20261006, which the nightly
# run always uses (fuzz.yml). It was built from the workflow's own stack: a
# local reproduction of _platform.yml's fuzz arm at that seed, then confirmed
# by a dispatched run with no 5xx unlisted and no entry stale.
#
# Then #1514 gave the flag request schemas value_type, on_value and off_value,
# which changed the requests the seed sends. The superuser pass no longer
# sends the requests that answered 500 on GET /api/v1/rollout-schedules/
# (#1001) and POST /api/v1/metrics/aggregate (#956), so their superuser
# entries were removed because the run stopped sending those requests, not
# because the bugs were fixed: both answered 500 to the requests sent
# before. POST /api/v1/metrics/aggregate's is now fixed by #956 (below).
#
# The superuser entry of POST /api/v1/rbac/users/{user_id}/grant (#1002) was
# removed by #891: the grant validation refuses the seed's bodies with 422
# before the insert, so the run stopped sending a request that answered 500.
# The 500 that remained, for a valid resource and a user id with no account,
# is fixed too: the user is looked up before the insert, and such a grant
# answers 404 "User not found".
# GET /api/v1/metrics/errors (#956) is fixed, as GET /api/v1/metrics/summary
# was (#1572): a start_date or end_date with a UTC offset of 16 hours or more
# answers 422, so both its entries (superuser and viewer) were removed. The
# other routes that took such a date as a query parameter are fixed the same
# way: GET /api/v1/audit-logs/export, GET /api/v1/compliance/export and GET
# /api/v1/hipaa/report answer 422, and their entries were removed. A date in
# a request body is fixed too (#1826): an API key's expires_at and a rollout
# schedule's start_date and end_date answer 422 for an offset of 16 hours or
# more. No entry cited it, so none was removed; the POST /api/v1/api-keys
# entries below are #957 (a field of the wrong type), a different cause.
# #958 and #959 are fixed, so their entries were removed from both passes:
# the two sample-size routes answer 422 for the inputs they cannot calculate
# with, and GET, PUT and DELETE /api/v1/users/{user_id} and
# POST /api/v1/llm-experiments/{experiment_id}/evaluate answer 400 for an id
# that is not a UUID.
# #1001 is fixed: every skip and offset accepts at most 2**63 - 1 and every
# page at most 2**63, and a page whose (page - 1) * size is past 2**63 - 1
# answers 422, so the entries of GET /api/v1/users/ (superuser) and
# GET /api/v1/audit-logs/ (viewer) were removed.

# --- superuser: the seeded demo administrator's bearer token ----------------

[[known]]
pass = "superuser"
operation = "POST /api/v1/api-keys"
status = 500
issue = 957
reason = "A field of the wrong type reaches the handler before validation."


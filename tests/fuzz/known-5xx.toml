# API fuzzing: the 5xx answers that are known, each with the public issue that
# tracks it or its cause.
#
# A 5xx counts against the route that ANSWERED the request, not the operation
# Schemathesis generated it for: scripts/fuzz_check.py resolves each one with
# the application's own router. A coverage-phase probe that sends DELETE to the
# path of GET /api/v1/users/me is answered by DELETE /api/v1/users/{user_id},
# and is listed under that.
#
# A pass is red when a route answers 5xx with a status not listed here for the
# pass, and when an entry listed for the pass answered no 5xx in the run (the
# bug was fixed: remove the entry). Each entry names its pass (superuser,
# viewer, sdk), the answering operation exactly as the served API document
# does ("METHOD /path"), the status, and either `issue` (the public issue that
# tracks it) or `cause`:
#
#   aws     the route calls AWS, and the fuzz stack points every AWS call at a
#           closed local port (fuzz.yml's api_env), so it answers 500 there;
#   config  the route needs a setting the fuzz stack deliberately leaves
#           unset, and answers 503 saying so.
#
# and a one-line reason. Entries are kept per pass and in the order of the
# document's paths.
#
# An entry covers every cause of its status on its route: a second bug there
# that answers the same status is not reported. When one route and status
# carry two issues, the entry cites the second in its reason (as POST
# /api/v1/holdout cited a duplicate name, #1019, beside #957 until #1019 was
# fixed). A pull request that fixes a cited issue
# removes its entries, unless the reason names another open issue for the
# same key; the stale refusal then says when the last one is fixed.
#
# The list holds for the seed it was built from, 20261006, which the nightly
# run always uses (fuzz.yml). It was built from the workflow's own stack: a
# local reproduction of _platform.yml's fuzz arm at that seed, then confirmed
# by a dispatched run with no 5xx unlisted and no entry stale.


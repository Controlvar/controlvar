# API fuzzing: the operations a pass selects but does not reach, each with its
# reason.
#
# A pass reaches an operation when one request with the operation's own method
# answers anything but 400, 401, 403, 404, 405, 422 or 429 (scripts/
# fuzz_check.py). An operation the pass does not reach fails the run unless it
# is listed here for that pass; an operation listed here that the run did reach
# fails it too, so the list cannot go stale. Each entry names its pass
# (superuser, viewer, sdk), the operation exactly as the served API document
# does ("METHOD /path"), and why. Entries are kept per pass and in the order
# of the document's paths.
#
# The first lists come from the run on the pull request that added this file
# (seed 20261006): 98 for superuser, 169 for viewer, 8 for sdk. The next pull
# request gave the stack an AWS region and one attempt per AWS call, and the
# sdk pass the sdk-contract seed's sdk:ruleset key; at the same seed that made
# them 100, 172 and 6. Most are requests that name no stored row (404), fail
# validation (422), or that the pass's role or credential may not make (401,
# 403).
#
# Then #1081 bounded a rollout stage's stage_order at 1000. That changed the
# requests the seed generates for PUT /api/v1/rollout-schedules/{schedule_id},
# and one of them is now a valid update of a seeded schedule (200), so the
# superuser pass reaches it and its list is 99.
#
# Then #1514 gave the flag request schemas value_type, on_value and off_value.
# That changed the requests the seed generates, and with them the ids
# Schemathesis reuses from earlier answers: the superuser pass no longer sends
# the PUT /api/v1/rollout-schedules/{schedule_id} that answered 200 or the
# DELETE /api/v1/rollout-schedules/{schedule_id} that answered 204, so it
# reaches neither, and its list is 101.
#
# Then #1461 refused an empty `metrics` list and a repeated metric name on
# the experiment requests (minItems on the update). That changed the requests
# the seed generates, and with them the ids Schemathesis reuses: the superuser
# pass now sends a GET /api/v1/results/{experiment_id}/sequential that names a
# stored experiment (200), so it reaches it, and its list is 100.


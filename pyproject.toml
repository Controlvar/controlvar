[tool.ruff]
# Ruff replaces black (format), isort (import order) and flake8 (lint).
# `make lint` and the `lint` CI job run exactly what is configured here.
line-length = 88
target-version = "py311"
extend-exclude = [
    "venv",
    ".venv",
    "node_modules",
    "backend/app/db/migrations",         # generated by alembic; never hand-formatted
    "modules/backend/app/db/migrations", # the modules' alembic branch, likewise
    "modules/infrastructure",            # CDK stacks; infrastructure/ is not in the gate either
]

[tool.ruff.lint]
# Chosen to match the tree as it stands: every rule below is either already
# satisfied or was brought to zero in the format-once commit. Adding a family
# here is cheap; each one also has to stay green, so keep it honest.
select = [
    "F",      # pyflakes — real errors (undefined names, unused imports/vars)
    "E4",     # import placement/shadowing
    "E7",     # statement-level errors (comparisons, ambiguous names)
    "E9",     # syntax / IO errors
    "W",      # trailing whitespace, missing newline at EOF
    "I",      # import sorting (replaces isort)
    "C4",     # flake8-comprehensions
    "PIE",    # misc lints (duplicate class fields, unnecessary placeholders)
    "RET501", # `return None` when None is the only return
    "RUF010", # f-string conversions: use !r / !s instead of repr()/str()
    "RUF022", # __all__ kept sorted
    "RUF100", # noqa comments that no longer suppress anything
    "T20",    # no print()/pprint() in shipped code (scripts are exempt below)
    "EXE",    # shebang present iff the file is executable
    "LOG",    # logging misuse
    "PLE",    # pylint errors
    "UP032",  # str.format() that should be an f-string
]
# Deliberately NOT selected (each would be a rewrite, not a lint fix):
#   UP006/UP007/UP035/UP045 — ~2,000 `typing.List`/`Optional[X]` annotations;
#     a typing modernisation is its own commit, not a gate.
#   B008 — 676 hits, all `Depends(...)`/`Query(...)` FastAPI defaults.
#   DTZ   — 200+ naive `datetime.utcnow()` calls; correctness work, tracked
#     separately, and it would have to change behaviour to satisfy.
#   ANN/D — no annotation or docstring coverage gate; mypy owns typing.
ignore = [
    # `== None` / `== True` build SQL expressions in SQLAlchemy; ruff's
    # suggestion (`is None` / `is True`) evaluates in Python and produces
    # `WHERE false`, silently returning no rows.
    "E711",
    "E712",  # `== True` is how SQLAlchemy builds a boolean filter expression
    "E741",  # `l`/`I` appear in statistical code where they match the formula
    "F403",  # star imports in a handful of aggregating modules
]

[tool.ruff.lint.per-file-ignores]
# Package __init__ files re-export on purpose; backend/app/models/__init__.py in
# particular imports every model module so standalone scripts can configure the
# SQLAlchemy mappers (see CONTRIBUTING.md).
"__init__.py" = ["F401"]
# Tests import fixtures for pytest to collect, assign unused bindings while
# arranging, and print diagnostics.
"backend/tests/**" = ["F401", "F811", "F841", "T20", "E402"]
# The modules' tests (modules/backend/tests) follow the same conventions.
"modules/backend/tests/**" = ["F401", "F811", "F841", "T20", "E402"]
# Operational scripts are CLIs: printing is their output, and they set
# os.environ / sys.path before importing the app (hence E402).
"backend/scripts/**" = ["T20", "E402"]
# Repository-root scripts are CLIs too, and `make lint` now covers them.
"scripts/**" = ["T20", "E402"]
"backend/app/db/bootstrap.py" = ["T20"]  # also a CLI (`python -m ...bootstrap`)
"demo/**" = ["T20"]
# Lambda packages insert ../shared on sys.path before importing from it, and
# their vendored tests follow the same conventions as backend/tests.
"backend/lambda/**" = ["E402"]
"backend/lambda/**/tests/**" = ["E402", "F401", "F811", "F841", "T20"]
"modules/lambda/**" = ["E402"]
# conftest and a few entry points import after sys.path / env setup.
"conftest.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["backend", "modules"]

[tool.importlinter]
# The core/modules import boundary, enforced statically (`lint-imports`, run by
# `make lint` and the `lint` CI job).  Complements the AST scan in
# backend/tests/smoke/test_core_boundary.py, which knows the manifest; these
# contracts know only the package names and therefore also hold for modules
# nobody has listed yet.
#
# grimp does not descend into a directory that has no __init__.py, so a
# package that is still an implicit namespace package is INVISIBLE to every
# contract below.  backend.app.core (the whole seam: hooks and the module
# registry), backend.app.schemas and backend.app.db are therefore named as
# sources explicitly: import-linter refuses to run when a named source module
# is not in the graph ("Module 'x' does not exist"), which turns a silently
# unchecked package into a loud failure instead.  Keep them listed even once
# the __init__.py files exist.
#
# backend/lambda is not importable as `backend.lambda` (`lambda` is a keyword
# and the directory has no __init__.py), so the Lambda functions have their own
# contract file, backend/lambda/.importlinter, run from that directory.
root_packages = ["backend"]
include_external_packages = true

# The core profile must build, boot and pass its tests with modules/ deleted
# (`make core-build`, the `core-build` CI job), so nothing in backend/ may
# import the `modules` package: the dependency arrow points from modules/ into
# backend/ (through the registration hooks in backend/app/core/), never back.
[[tool.importlinter.contracts]]
name = "backend never imports the modules package"
type = "forbidden"
source_modules = [
    "backend.app",
    "backend.app.core",
    "backend.app.schemas",
    "backend.app.db",
    "backend.scripts",
]
forbidden_modules = ["modules"]

[[tool.importlinter.contracts]]
name = "backend.app never imports tests, SDKs, demos or infrastructure"
type = "forbidden"
source_modules = [
    "backend.app",
    "backend.app.core",
    "backend.app.schemas",
    "backend.app.db",
]
forbidden_modules = [
    "sdk",
    "demo",
    "infrastructure",
]

# backend.tests is not an external package, and grimp records an import of a
# module it cannot find (backend/tests has no __init__.py) as an import of the
# nearest ancestor it does know -- `backend` -- so listing it as a forbidden
# module above would never fire.  As a LAYER it is checked for real, and its
# absence from the graph is an error rather than a silent pass: this contract
# needs backend/tests/__init__.py to exist.  Tests may import the app; the app
# may not import the tests, directly or through any chain.
[[tool.importlinter.contracts]]
name = "backend.app never imports backend.tests"
type = "layers"
layers = [
    "backend.tests",
    "backend.app",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
strict_optional = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[tool.pytest.ini_options]
# The single pytest configuration for the repository. Run pytest from the
# repository root; the backend package is imported as ``backend.app.*``.
# modules/backend/tests is the modules' suite; it uses the core fixtures
# through its own conftest and is absent from a core build.
testpaths = ["backend/tests", "modules/backend/tests"]
python_files = "test_*.py"
python_functions = "test_*"
python_classes = "Test*"
asyncio_mode = "auto"
# Coverage is NOT in addopts: it slows every run and silently produces no
# report under some plugin combinations. Ask for it explicitly:
#   pytest --cov=backend.app --cov-report=term
addopts = ""
markers = [
    "unit: unit tests (fast, no external dependencies)",
    "integration: integration tests (require the database)",
    "e2e: end-to-end tests (require the full stack)",
    "regression: guards a specific past bug",
    "modules: needs the modules package; skipped in a core build",
    "smoke: wiring checks that must hold for any build of this tree",
    "slow: slow running tests",
    "benchmark: absolute wall-clock check; skipped unless RUN_BENCHMARKS=1 (backend/tests/benchmark_gate.py)",
    "api: API tests",
    "contract: API contract tests",
    "cors: CORS tests",
    "security: security header tests",
    "dependency: dependency-injection tests",
    "validation: validation tests",
    "realistic: backend/tests/realistic scenario tests; offline (no running platform), run by the PR QA Gate's Unit Tests job (selected by directory, not by this marker)",
    "requires_db: tests requiring a database connection",
    "requires_aws: tests requiring AWS services (LocalStack)",
    "cognito_integration: Cognito authentication tests (require moto)",
    "warehouse_live: founder-run check against a real BigQuery or Snowflake account; modules/backend/tests/live_warehouse is not collected without -m warehouse_live",
]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"

[tool.coverage.run]
source = ["backend/app"]
omit = [
    "backend/app/db/migrations/*",
    "backend/app/*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "raise ImportError",
    "except ImportError:",
]

[tool.coverage.html]
directory = "coverage_html_report"

[build-system]
# Without this table a PEP 517 frontend falls back to the legacy setuptools
# path, which ignores [project] entirely -- so `pip install .` produced a
# distribution with no name, no version and no licence metadata.
#
# 77 is the floor because `license = "<SPDX>"` and `license-files` below are
# PEP 639 fields, which setuptools accepts from 77.0.0 (its NEWS: #4833,
# #4837, #4840); a build resolved to anything older rejects the metadata.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
# NOT `experimently`: that name belongs to the Python SDK
# (`sdk/python/pyproject.toml`), which the launch publishes to PyPI. Both
# tables carried it until P3.5, so `pip install -e . && pip install -e
# sdk/python` in one environment produced two distributions with one name --
# the second silently replacing the first's metadata -- and
# `importlib.metadata.version("experimently")` could not say which tree it was
# answering for. The platform is the bigger thing but the smaller audience:
# the SDK is what people install.
name = "experimently-platform"
# From the repository-root VERSION file, which release-please maintains: one
# source for the API's `settings.VERSION`, the image labels and this wheel.
# `version` is absent on purpose -- a literal here would be a second source,
# and PEP 621 forbids declaring both.
dynamic = ["version"]
description = "Controlvar — experimentation platform for A/B testing and feature flags"
requires-python = ">=3.11"
# Everything in the distribution is Apache-2.0: the core under backend/ and the
# optional modules under modules/ ship in one wheel under one licence. `sdk/`
# is MIT (sdk/LICENSE) and is not part of this distribution -- each SDK is its
# own package with its own release pipeline.
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]

[tool.setuptools.dynamic]
# setuptools reads the file, stripped -- the same bytes
# backend/app/core/version.py reads at runtime and the release workflow passes
# to the image label, so a wheel cannot disagree with the server it came from.
# A build that cannot find the file does not fail: it warns and emits version
# 0.0.0. That silent path is what scripts/check_version_sources.py catches, and
# naming the file here is also what makes setuptools ship it in the sdist (see
# MANIFEST.in, which says the same thing explicitly).
version = { file = "VERSION" }

[tool.setuptools]
# Setuptools turns this on by default for a pyproject-configured project, and
# with it on the wheel is built from the *sdist manifest* as well as from the
# package list below: files the manifest lists under a package directory are
# copied in as package data. Excluding backend/lambda and modules/lambda from
# discovery alone was therefore a no-op -- byte for byte the same 388-file
# wheel -- because they came straight back as data. The wheel ships no data
# files at all today (every entry in it is a .py), so turning this off changes
# nothing except making `packages.find` below the single answer to "what is in
# the wheel". A file the wheel genuinely needs goes in
# [tool.setuptools.package-data], by name.
include-package-data = false

[tool.setuptools.packages.find]
# One wheel, all Apache-2.0: the core (backend*) and the optional modules
# (modules*). A deployment that wants the core profile deletes modules/ from
# its tree (scripts/core_build.sh proves that works); the wheel carries both.
#
# The exclusions are the SAME contract as .dockerignore's: what the API image
# refuses to copy is what the wheel refuses to package. Discovery defaults to
# `namespaces = true` (PEP 420), so an `include` of "modules*" returns every
# *directory* under modules/ -- not just the importable Python ones. Left to
# itself it swept in
#
#   modules.frontend.*  16 directories of the dashboard's TSX, one of them
#                       `modules/frontend/src/pages/workspaces/[id]` -- not a
#                       legal Python identifier. They hold no .py, so no .tsx
#                       ever reached the wheel; what they did reach is the
#                       package list in the metadata and the NAMESPACES map of
#                       an editable install, where `[id]` sits as a package
#                       name nothing can ever import;
#   modules.lambda.*    and backend.lambda.*, the Lambda handlers -- 49 .py
#                       files that DID ship, their tests included. CDK deploys
#                       those from the source tree with their own
#                       requirements.txt each, and `lambda` is a reserved word,
#                       so `import backend.lambda` is a SyntaxError: nothing
#                       could have imported them from the wheel anyway;
#   backend.venv*       a stray local virtualenv ("venv*" only matches the one
#                       at the top level);
#   backend.requirements*  a directory of .txt pins, which holds no Python at
#                       all and has no business being a package;
#   backend.migrations* a tracked SYMLINK to backend/app/db/migrations, so the
#                       alembic chain was packaged twice, once under each name;
#
# Tests and the CDK stacks (infrastructure/ and modules/infrastructure) are not
# application code and stay out for the same reason.
include = ["backend*", "modules*"]
exclude = [
    "backend.tests*",
    "backend.lambda*",
    "backend.migrations*",
    "backend.requirements*",
    "backend.venv*",
    "modules.backend.tests*",
    "modules.frontend*",
    "modules.infrastructure*",
    "modules.lambda*",
    "venv*",
    "node_modules*",
]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv"]
skips = ["B101", "B104"]  # Example skips, adjust as needed

[[unit]]
text = "Experiment assignment and feature-flag evaluation are decided by the server by default (sticky per user + experiment); the SDK caches the answers per user + key."
by = [
    "test:sdk/python/tests/test_client.py::TestGetAssignment::test_sticky_cache_hit_makes_one_request",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssign::test_assigns_user_to_a_variant_and_is_sticky",
]

[[unit]]
text = "Server-side code can opt in to local evaluation (evaluation=\"local\", beta): flags are answered in-process from the server's ruleset, with the server's answers, and anything that cannot be answered exactly goes to the server."
by = [
    "test:sdk/python/tests/test_evaluator.py::test_no_local_answer_differs_from_the_server",
    "test:sdk/python/tests/test_local.py::test_an_unknown_key_and_a_remote_flag_go_to_the_server",
]


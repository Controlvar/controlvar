[[unit]]
text = "Feature flags, A/B experiment assignment and event tracking for React Native apps: a context provider, three hooks and a plain client, with an in-memory cache and an AsyncStorage-backed offline fallback."
by = [
    "test:sdk/react-native/__tests__/hooks.test.tsx::renders children",
    "test:sdk/react-native/__tests__/hooks.test.tsx::useFlag issues GET /api/v1/feature-flags/evaluate/{key}?user_id= and reflects the response",
    "test:sdk/react-native/__tests__/hooks.test.tsx::useExperiment POSTs /api/v1/tracking/assign with the provider attributes as context",
    "test:sdk/react-native/__tests__/client.test.ts::sends exactly one POST /api/v1/tracking/track with the contract body",
    "test:sdk/react-native/__tests__/client.test.ts::uses the in-memory cache on the second call",
    "test:sdk/react-native/__tests__/client.test.ts::on API failure returns the last-known evaluation even if it has expired",
]

[[unit]]
text = "Flags and assignments are decided by the server (sticky per user + experiment); the SDK caches the answers per user + key and never buckets locally."
by = [
    "test:sdk/react-native/__tests__/client.test.ts::GETs /api/v1/feature-flags/evaluate/{key}?user_id= with the contract headers and no body",
    "test:sdk/react-native/__tests__/client.test.ts::POSTs to /api/v1/tracking/assign with the contract headers and body",
    "test:sdk/react-native/__tests__/client.test.ts::sticky: a second call for the same user + experiment is served from cache (one fetch)",
    "test:sdk/react-native/__tests__/client.test.ts::cache is keyed on (userId, flagKey)",
]

[[unit]]
text = "Full documentation: the React Native SDK page."
by = ["exempt:navigation"]

[[unit]]
text = "The user's attributes are sent as context on flag evaluation and on experiment assignment, so targeting rules match as in the JavaScript SDK."
by = [
    "test:sdk/react-native/__tests__/hooks.test.tsx::regression #1520: useFlag puts the attributes on the wire",
    "test:sdk/react-native/__tests__/client.test.ts::isFeatureEnabled passes the attributes on",
    "test:sdk/react-native/__tests__/client.test.ts::sends the user attributes as `context`",
    "test:sdk/react-native/__tests__/hooks.test.tsx::useExperiment POSTs /api/v1/tracking/assign with the provider attributes as context",
]


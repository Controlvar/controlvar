# What verifies each unit of sdk/mcp/README.md (#1607).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "sdk/mcp/README.md"

[[unit]]
text = "@controlvar/mcp-server"
by = ["exempt:label"]

[[unit]]
text = "The Controlvar MCP server: a read-only Model Context Protocol server for one Controlvar instance."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::the six tools and their annotations, whatever tools.json says",
    "test:sdk/mcp/__tests__/surface.test.ts::initialize at %s",
]

[[unit]]
text = "An AI assistant such as Claude Code, Claude Desktop or Cursor starts it on your computer and talks to it over stdio."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::initialize at %s",
    "test:sdk/mcp/__tests__/packed.test.ts::shrinkwrap, strip, pack, install through a registry, and answer initialize",
]

[[unit]]
text = "It calls your instance's API with your own API key, so it sees what your role can see."
by = [
    "test:sdk/mcp/__tests__/tools.test.ts::list_feature_flags: the query, the projection, and only the configured key",
    "test:sdk/mcp/__tests__/tools.test.ts::a role refused (403)",
]

[[unit]]
text = "It offers six tools:"
by = ["test:sdk/mcp/__tests__/surface.test.ts::the six tools and their annotations, whatever tools.json says"]

[[unit]]
text = "Tool | What it answers | API route"
by = ["exempt:label"]

[[unit]]
text = "list_feature_flags | The feature flags, a page at a time | GET /api/v1/feature-flags/"
by = ["test:sdk/mcp/__tests__/tools.test.ts::list_feature_flags: the query, the projection, and only the configured key"]

[[unit]]
text = "get_feature_flag | One feature flag, by its key | GET /api/v1/feature-flags/"
by = ["test:sdk/mcp/__tests__/tools.test.ts::decoys before the target do not answer"]

[[unit]]
text = "evaluate_feature_flag | What a flag serves one user | POST /api/v1/feature-flags/evaluate/{flag_key}"
by = ["test:sdk/mcp/__tests__/tools.test.ts::evaluate_feature_flag: a POST with the user and context in the body, config dropped"]

[[unit]]
text = "list_experiments | The experiments, a page at a time | GET /api/v1/experiments/"
by = ["test:sdk/mcp/__tests__/tools.test.ts::list_experiments: the status goes as status_filter, exactly"]

[[unit]]
text = "get_experiment | One experiment, by its id | GET /api/v1/experiments/{experiment_id}"
by = ["test:sdk/mcp/__tests__/tools.test.ts::get_experiment and get_experiment_results: the answer as served, on the checked routes"]

[[unit]]
text = "get_experiment_results | An experiment's statistical results | GET /api/v1/experiments/{experiment_id}/results"
by = ["test:sdk/mcp/__tests__/tools.test.ts::get_experiment and get_experiment_results: the answer as served, on the checked routes"]

[[unit]]
text = "It changes no flag, experiment or setting."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::the six tools and their annotations, whatever tools.json says",
    "test:sdk/mcp/__tests__/surface.test.ts::%s is unknown and sends nothing",
]

[[unit]]
text = "Each evaluate_feature_flag call is recorded as one evaluation of the flag, as an SDK's is."
by = [
    "test:sdk/mcp/__tests__/tools.test.ts::evaluate_feature_flag: a POST with the user and context in the body, config dropped",
    "test:backend/tests/integration/services/test_feature_flag_targeting_rules.py::TestNativeRulesAndReasons::test_evaluation_records_matched_rule_id",
]

[[unit]]
text = "Install"
by = ["exempt:label"]

[[unit]]
text = "To install it and add it to your MCP client, follow the MCP server page."
by = ["exempt:navigation"]

[[unit]]
text = "It needs Node.js 22 or later, and a Controlvar instance whose read operations accept an API key that carries the mcp:read scope."
by = [
    "test:backend/tests/smoke/test_sdk_mcp_package.py::test_the_declared_node_floor_is_the_node_ci_runs",
    "test:sdk/mcp/__tests__/tools.test.ts::a key without the scope (403)",
]

[[unit]]
text = "Configuration"
by = ["exempt:label"]

[[unit]]
text = "The server reads three environment variables, which your MCP client sets for it."
by = ["test:sdk/mcp/__tests__/surface.test.ts::the environment variables are the ones the server reads"]

[[unit]]
text = "It takes no command-line arguments, and refuses any."
by = ["test:sdk/mcp/__tests__/config.test.ts::the argument %s is refused and not echoed"]

[[unit]]
text = "Variable | Required | Value"
by = ["exempt:label"]

[[unit]]
text = "CONTROLVAR_API_URL | yes | Your instance's address, with no path: for example https://controlvar.example.com"
by = [
    "test:sdk/mcp/__tests__/config.test.ts::a path is refused: %s",
    "test:sdk/mcp/__tests__/config.test.ts::an origin is accepted: %s",
]

[[unit]]
text = "CONTROLVAR_API_KEY | yes | An API key that carries the mcp:read scope (creating an API key)"
by = [
    "test:sdk/mcp/__tests__/tools.test.ts::a key without the scope (403)",
    "test:sdk/mcp/__tests__/tools.test.ts::list_feature_flags: the query, the projection, and only the configured key",
]

[[unit]]
text = "CONTROLVAR_ALLOW_INSECURE_HTTP | no | 1 to allow a plain http:// address on another computer"
by = [
    "test:sdk/mcp/__tests__/config.test.ts::http://10.0.0.5:8000 answers initialize, with exactly one W1 line at every start",
    "test:sdk/mcp/__tests__/config.test.ts::%j is refused with E2e, for an https:// address too",
]

[[unit]]
text = "A plain http:// address is accepted only for localhost, 127.0.0.1 or [::1], because the API key would otherwise cross the network unencrypted."
by = [
    "test:sdk/mcp/__tests__/config.test.ts::accepted with no warning: %s",
    "test:sdk/mcp/__tests__/config.test.ts::refused with E2d: %s",
]

[[unit]]
text = "If your instance runs on a private network you trust and has no HTTPS, set CONTROLVAR_ALLOW_INSECURE_HTTP=1; the server then prints a warning each time it starts."
by = ["test:sdk/mcp/__tests__/config.test.ts::http://10.0.0.5:8000 answers initialize, with exactly one W1 line at every start"]

[[unit]]
text = "A setting that can never work stops the server at start-up, with exit code 2 and one line on stderr."
by = [
    "test:sdk/mcp/__tests__/config.test.ts::refused with E2d: %s",
    "test:sdk/mcp/__tests__/config.test.ts::a path is refused: %s",
]

[[unit]]
text = "The key is never printed."
by = ["test:sdk/mcp/__tests__/tools.test.ts::every tool, success and failure, leaves no part of the key anywhere"]

[[unit]]
text = "Each request is logged to stderr as one line: the tool, the method, the path, the status, the time it took and its request id."
by = [
    "test:sdk/mcp/__tests__/tools.test.ts::a search canary against a 500 is named nowhere; the path is",
    "test:sdk/mcp/__tests__/tools.test.ts::every tool, success and failure, leaves no part of the key anywhere",
]

[[unit]]
text = "Development"
by = ["exempt:label"]

[[unit]]
text = "In a clone of this repository, in sdk/mcp/, run npm ci and then npm test."
by = ["exempt:instruction"]

[[unit]]
text = "The tests build dist/ and run the built server as a child process against a stub API on 127.0.0.1; one of them packs the package and installs it into an empty directory, so it needs the npm registry."
by = [
    "test:sdk/mcp/__tests__/tools.test.ts::list_feature_flags: the query, the projection, and only the configured key",
    "test:sdk/mcp/__tests__/packed.test.ts::shrinkwrap, strip, pack, install through a registry, and answer initialize",
]

[[unit]]
text = "tools.json is what the server answers to tools/list, with its instructions and the environment variables it reads."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::tools/list",
    "test:sdk/mcp/__tests__/surface.test.ts::instructions and the server's name",
    "test:sdk/mcp/__tests__/surface.test.ts::the environment variables are the ones the server reads",
]

[[unit]]
text = "The tests compare the two exactly; after changing a tool, run npm run tools-json and commit the result."
by = ["test:sdk/mcp/__tests__/surface.test.ts::tools/list"]


[[unit]]
text = "With ExperimentKey and/or FeatureFlagKey set, Track sends one POST /api/v1/tracking/track."
by = [
    "test:sdk/go/client_test.go::TestClient_Track_WithExperimentKey",
    "test:sdk/go/client_test.go::TestClient_Track_WithoutKey_FansOutToCachedEntries",
    "test:sdk/go/client_test.go::TestClient_Track_WithoutKey_NothingCached_SendsNothing",
]

[[unit]]
text = "Without a key it sends one POST /api/v1/tracking/batch containing one entry per experiment the user was assigned to through this client (experiment_key) plus one per flag evaluated for the user (feature_flag_key), taken from the cache."
by = ["test:sdk/go/client_test.go::TestClient_Track_WithoutKey_FansOutToCachedEntries"]

[[unit]]
text = "Nothing cached → nothing is sent."
by = ["test:sdk/go/client_test.go::TestClient_Track_WithoutKey_NothingCached_SendsNothing"]

[[unit]]
text = "This is what makes a single Track(\"purchase\") count as a conversion for every experiment the user is in."
by = [
    "test:sdk/go/client_test.go::TestClient_Track_WithoutKey_FansOutToCachedEntries",
    "test:backend/tests/integration/api/test_tracking_api.py::TestBatch::test_reports_success_and_failure_per_event",
    "test:backend/tests/integration/services/test_conversion_event_matching.py::TestConversionEventFilter::test_matches_both_producer_shapes_and_excludes_exposures",
]


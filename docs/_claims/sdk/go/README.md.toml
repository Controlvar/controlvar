[[unit]]
text = "Caching and failure behaviour"
by = ["exempt:label"]

[[unit]]
text = "Successful evaluations and assignments are cached per user + key for CacheTTL (default 5 min, LRU-bounded by CacheSize)."
by = [
    "test:sdk/go/client_test.go::TestClient_GetAssignment_Sticky_CacheHit",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_CacheHit",
    "test:sdk/go/client_test.go::TestCache_LRUEviction",
]

[[unit]]
text = "A cache hit makes no request; the second GetAssignment for the same user + experiment is served locally."
by = [
    "test:sdk/go/client_test.go::TestClient_GetAssignment_Sticky_CacheHit",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_CacheHit",
]

[[unit]]
text = "Failures are never cached, so the next call retries."
by = ["test:sdk/go/client_test.go::TestClient_EvaluateFlag_FailureNotCached"]

[[unit]]
text = "Network error, timeout, 401 (bad key), 404 (an experiment unknown or not ACTIVE, or an unknown flag key), 429 (rate limited, APIError.RetryAfter): EvaluateFlag returns a disabled result plus the error; GetAssignment returns nil plus the error."
by = [
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_NotFound",
    "test:sdk/go/client_test.go::TestClient_GetAssignment_NotFound",
    "test:sdk/go/client_test.go::TestHTTPClient_Get_ServerError",
    "test:backend/tests/integration/api/test_api_keys_api.py::TestKeyAuthenticatesSdkTraffic::test_tracking_assign_rejects_unknown_key",

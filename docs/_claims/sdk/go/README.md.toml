document = "sdk/go/README.md"

[[unit]]
text = "Experimently Go SDK"
by = ["exempt:label"]

[[unit]]
text = "Go client for the Experimently A/B testing and feature flag platform."
by = [
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_RequestAndMapping",
    "test:sdk/go/client_test.go::TestClient_GetAssignment_RequestAndMapping",
]

[[unit]]
text = "Zero dependencies outside the standard library, safe for concurrent use."
by = [
    "test:sdk/go/module_test.go::TestModule_StandardLibraryOnly",
    "test:sdk/go/client_test.go::TestClient_Concurrent",
    "test:sdk/go/client_test.go::TestCache_Concurrent",
]

[[unit]]
text = "Flag evaluation and experiment assignment are decided by the server: every call goes to the public API with your X-API-Key, the server buckets the user (sticky per user + experiment), and the SDK caches the answer per user + key for a TTL."
by = [
    "test:sdk/go/client_test.go::TestClient_GetAssignment_Sticky_CacheHit",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_CacheHit",
]

[[unit]]
text = "Nothing is bucketed locally."
by = [
    "test:sdk/go/module_test.go::TestConsistentHash_NotCalledByTheClient",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_RequestAndMapping",
    "test:sdk/go/client_test.go::TestClient_GetAssignment_RequestAndMapping",
]

[[unit]]
text = "Full reference: docs/sdk/go.md."

    "test:sdk/go/context_test.go::TestEvaluateFlag_UnencodableAttributes_SendAndCacheNothing",
    "test:sdk/go/context_test.go::TestEvaluateFlag_ContextTheServerRefuses_IsAnErrorAndNotCached",
]

[[unit]]
text = "EvaluateFlag sends User.Attributes as context, as GetAssignment does, so a flag's targeting rules on attributes now match from Go."
by = [
    "test:sdk/go/context_test.go::TestEvaluateFlag_SendsAttributesAsCompactJSONContext",
    "test:sdk/go/client_test.go::TestClient_GetAssignment_RequestAndMapping",
    "test:sdk/go/context_test.go::TestEvaluateFlag_WithContext_ServerWithoutFlagValuesIsDecoded",
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_matching_context_enables_flag_with_reason",
]

[[unit]]
text = "Answers for a flag with such rules change: a user a rule matches gets the rule's answer, where before the flag's rollout answered."
by = [
    "test:sdk/go/context_test.go::TestEvaluateFlag_WithContext_ServerWithoutFlagValuesIsDecoded",
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_matching_context_enables_flag_with_reason",
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_no_context_keeps_existing_behaviour",
]

[[unit]]
text = "Attributes that cannot be encoded as JSON (a NaN or infinite number, a channel, a func) now make EvaluateFlag return the disabled result and an error, and send nothing, as GetAssignment does with them."
by = [
    "test:sdk/go/context_test.go::TestEvaluateFlag_UnencodableAttributes_SendAndCacheNothing",
    "test:sdk/go/context_test.go::TestClient_GetAssignment_UnencodableAttributes_SendAndCacheNothing",
]

[[unit]]
text = "Before, EvaluateFlag did not send attributes at all, so they caused no error."
by = ["test:sdk/go/context_test.go::TestEvaluateFlag_UnencodableAttributes_SendAndCacheNothing"]

[[unit]]
text = "Attributes over the server's targeting context limits (8,192 bytes, 10 levels), or a URL too long for a server or proxy, now make EvaluateFlag return the disabled result and an APIError (422, or the 400, 414 or 431 of a server or proxy that refuses the URL), for any flag."
by = [
    "test:sdk/go/context_test.go::TestEvaluateFlag_ContextTheServerRefuses_IsAnErrorAndNotCached",
    "test:backend/tests/integration/api/test_targeting_context_limits.py::test_a_real_server_answers_the_clean_422",
]

[[unit]]
text = "Before, they were not sent, and the flag answered without them."
by = [

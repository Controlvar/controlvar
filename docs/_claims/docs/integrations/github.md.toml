text = "400 Bad Request"
by = ["exempt:baseline"]

[[unit]]
text = "Symptom: GitHub's delivery log shows status 400 with the body {\"detail\": \"Invalid JSON payload\"}."
by = ["docex:docs/integrations/salesforce.md#{\"detail\":\"Webhook authentication failed\"}"]

[[unit]]
text = "The signature was accepted, but the body is not a JSON object."

[[unit]]
text = "Response: 200 OK"
by = ["exempt:baseline"]

[[unit]]
text = "A delivery from an authenticated sender is answered 200 even when the platform could not process the event: the failure is logged, so the provider does not retry something it cannot fix."
by = ["test:modules/backend/tests/unit/api/test_integrations_api.py::TestWebhookEndpoints::test_jira_webhook_service_failure_is_still_200"]

[[unit]]
text = "A body that is not a JSON object is 400 Bad Request, and that is checked only after the sender is authenticated."
by = [
    "test:modules/backend/tests/unit/api/test_integrations_api.py::TestWebhookEndpoints::test_jira_webhook_authenticated_but_malformed_body_is_400",
    "test:modules/backend/tests/unit/api/test_integrations_api.py::TestWebhookEndpoints::test_jira_webhook_unauthenticated_malformed_body_is_401_not_400",
]

[[unit]]
text = "An answered delivery changes nothing in the platform yet: a pull request is not linked to an experiment, whatever its body says."
by = ["test:modules/backend/tests/unit/services/test_integration_wiring.py::test_a_webhook_delivery_writes_no_row"]

[[unit]]
text = "Troubleshooting"
by = ["exempt:baseline"]

[[unit]]
text = "401 Unauthorized"
by = ["exempt:baseline"]

[[unit]]
text = "Symptom: GitHub's delivery log shows status 401 and the body {\"detail\": \"Webhook authentication failed\"}."
by = ["exempt:baseline"]

[[unit]]
text = "Every refused delivery is answered the same way, so the status does not say which of these it is:"
by = ["exempt:baseline"]

[[unit]]
text = "Secret mismatch: The webhook_secret in the platform does not match the secret in GitHub's webhook settings."
by = ["exempt:baseline"]

[[unit]]
text = "Set it again with the recipe in Rotating the Webhook Secret and use the same value in GitHub."
by = ["exempt:baseline"]

[[unit]]
text = "As a last resort you can DELETE /api/v1/integrations/github and create the integration again, but that removes the stored token and repository settings too, so you send them again."
by = [
    "docex:docs/api/integrations.md#204",
    "docex:docs/api/integrations.md#{\"integration_type\":\"jira\",\"is_active\":true,\"stored_secrets\":[\"webhook_secret\"]}",
]

[[unit]]
text = "No secret in GitHub: a delivery without an X-Hub-Signature-256 header is refused."
by = ["test:modules/backend/tests/integration/api/test_integrations_api.py::TestGitHubWebhook::test_github_webhook_no_signature_is_401"]

[[unit]]
text = "Open the webhook's settings in GitHub and check its Secret field."
by = ["exempt:third-party"]

[[unit]]
text = "Not active, or no webhook_secret stored: GET /api/v1/integrations/github must show \"is_active\": true and list webhook_secret in stored_secrets."
by = ["exempt:baseline"]

[[unit]]
text = "The platform log also names an active integration that has no secret, once per process."
by = [
    "test:modules/backend/tests/unit/api/test_integrations_api.py::TestTheUpgradePathIsAnnounced::test_a_config_with_no_secret_is_named_in_the_log",
    "test:modules/backend/tests/unit/api/test_integrations_api.py::TestTheUpgradePathIsAnnounced::test_the_warning_is_said_once_not_once_per_delivery",
]

[[unit]]
text = "Encoding issue: Ensure the secret does not contain leading or trailing whitespace."
by = ["exempt:baseline"]

[[unit]]
text = "Copy-paste carefully."
by = ["exempt:baseline"]


[[unit]]
text = "Check the platform's application logs for any processing errors"
by = ["exempt:baseline"]

[[unit]]
text = "Rotating the Webhook Secret"
by = ["exempt:baseline"]

[[unit]]
text = "If you need to rotate the webhook secret:"
by = ["exempt:baseline"]

[[unit]]
text = "Step 1: Set a new secret in the platform."
by = ["docex:docs/api/integrations.md#New webhook_secret for jira:"]

[[unit]]
text = "Use the recipe in Upgrading an integration created before webhook authentication with TYPE=github and an ADMIN token."
by = ["exempt:baseline"]

[[unit]]
text = "It sends one PUT /api/v1/integrations/github that carries only the new webhook_secret; the stored token and repository settings are kept, and it prints the new secret."
by = [
    "docex:docs/api/integrations.md#New webhook_secret for jira:",
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestStoredSecretsAreNotReturned::test_put_merges_key_by_key_and_null_removes",

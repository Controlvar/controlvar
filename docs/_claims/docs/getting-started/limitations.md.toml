[[unit]]
text = "Experiments and results"
by = ["exempt:label"]

[[unit]]
text = "Every event value counted in a revenue, duration or custom metric | A value that is not a number, is infinite, or is larger than 10^12 in size, in the unit it was sent in, adds nothing to its user's total; the event still counts its user in conversions. A count metric counts events and does not read their value."
by = [
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_values_that_are_not_finite_or_too_large_add_nothing",
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_duration_and_custom_add_up_each_users_values",
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_a_count_does_not_read_the_value",
]

[[unit]]
text = "An event sent twice counted once | Only an event with an event_id is recognised when it is sent again. Without one it is stored and counted twice: a count metric counts it again, and a revenue, duration or custom metric adds its value again. A request that timed out may have been stored, so sending it again without an event_id can double it. A conversion rate counts each user once and is not affected. See How events count."
by = [
    "test:backend/tests/integration/api/test_tracking_duplicate_events.py::test_r1_a_purchase_sent_again_with_its_event_id_is_stored_and_counted_once",
    "test:backend/tests/integration/api/test_tracking_duplicate_events.py::test_r8_without_an_event_id_two_identical_purchases_are_both_stored",
    "test:backend/tests/integration/api/test_how_events_count.py::test_an_event_sent_again_is_stored_and_counted_again",
    "test:sdk/python/tests/test_client.py::TestTrackNeverRaises::test_a_timeout_returns_false_although_the_event_was_sent",
]

[[unit]]
text = "A revenue, count, duration or custom metric's sequential analysis, Bayesian analysis, sample-size plan, daily series and Live tab by its values | Each is of the share of users who sent the metric's event, as for a conversion. CUPED does not analyse these metrics."
by = ["test:backend/tests/integration/api/test_revenue_per_user_results.py::test_the_other_analyses_of_a_revenue_metric_stay_on_the_share_of_buyers"]

[[unit]]
text = "A breakdown by segment of a revenue, count, duration or custom metric by its values | The Breakdowns view of such a metric shows, in its column headed Mean, the share of users who sent the metric's event in each segment. The metric's headline row is its mean per user."
by = ["test:backend/tests/integration/api/test_revenue_breakdown_share_of_buyers.py::test_a_revenue_metric_breakdown_is_the_share_of_buyers"]

[[unit]]
text = "The average time one event takes, such as page load time | A duration metric is each user's total of its events' values, 0 for a user with none, averaged over every assigned user: a variant whose users send the event less often reads as less time. No metric averages over events rather than users."
by = [
    "test:backend/tests/unit/services/test_value_metrics_per_user.py::test_a_duration_is_time_per_assigned_user_not_per_event",
    "test:backend/tests/unit/services/test_revenue_per_user_routing.py::test_the_results_analyse_every_type_but_conversion_as_a_mean",
]

[[unit]]
text = "Outlier control on a revenue, duration or custom metric (winsorization, trimming) | None is applied. A revenue, duration or custom metric is each user's total, averaged; one very large user moves the mean and widens the interval. variance_reduction_config.method = winsorization is stored and clips nothing. Only a value that is not a number or exceeds 10^12 in size is dropped, as the first row of this section says."
by = [
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_values_that_are_not_finite_or_too_large_add_nothing",
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_winsorization_in_the_stored_config_changes_no_number",
]

[[unit]]
text = "A ratio metric (revenue per order, clicks per session) | There is no ratio metric type. Metric types are conversion, revenue, count, duration and custom, each averaged over assigned users: see the row on the average time one event takes. Revenue per order can only be computed outside the platform."
by = [
    "test:backend/tests/unit/services/test_value_metrics_per_user.py::test_every_metric_type_is_classified",
    "test:backend/tests/unit/services/test_value_metrics_per_user.py::test_the_mean_types_are_every_type_but_conversion",
]

[[unit]]
text = "A sample-ratio mismatch that stops the experiment or removes its winner | Under a mismatch, recommendation is INCONCLUSIVE in GET /api/v1/results/{experiment_id}, in the data export and in the report. winner_variant, has_winner, the Bayesian decision and the sequential panel are unchanged."
by = [
    "test:backend/tests/integration/api/test_export_api.py::TestExportEqualsResults::test_failed_sample_ratio_check_is_inconclusive_in_results_and_export",
    "test:backend/tests/unit/services/test_srm.py::TestRecommendationUnderSrm::test_failed_check_is_inconclusive_whatever_the_engine_said",
]

[[unit]]
text = "A variant that is no better recommended to ship no more often than α says, whatever the split | On zero-inflated, right-skewed revenue (most users spend nothing, a few spend a lot), a lopsided split recommended shipping a variant that was no better more often than α says. Measured in 2,000 A/A experiments (both variants the same) at each split, at α = 0.05, with 5% of users buying, order values lognormal and repeat purchases: with 600 users in the control and 5,400 in the treatment, the treatment was recommended to ship in 150 (7.5%), where about 50 (2.5%) are expected in that direction, and there the larger variant was the one wrongly named; with 3,000 users in each, in 46, within the expected rate. These are the sizes measured; no size is known at which a lopsided split meets α."
by = [
    "test:backend/tests/unit/stats_validation/test_false_winner_unequal_split.py::test_an_uneven_split_recommends_a_false_winner_above_the_band",
    "test:backend/tests/unit/stats_validation/test_false_winner_unequal_split.py::test_an_equal_split_recommends_a_false_winner_within_the_band",
    "test:backend/tests/unit/stats_validation/test_false_winner_unequal_split.py::test_the_band_is_the_central_99_9_percent_of_one_direction",
]

[[unit]]
text = "Intervals on a treatment's difference adjusted for the experiment's correction | The intervals on a treatment's difference from the control, on its relative change and on its impact are not adjusted for comparing several treatments with the control, while is_significant is (Benjamini-Hochberg by default). With two or more treatments an interval can exclude 0 on a treatment that is not significant. For a metric analysed as a share of users, the interval and Fisher's exact test can also disagree near the threshold, either way."
by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_b5_an_adjusted_treatment_is_not_significant_although_its_interval_excludes_0",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_mean_interval_against_significance",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_proportion_interval_against_significance",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_named_boundary_tables",
]

[[unit]]
text = "An interval on the relative change for every treatment | For a proportion, relative_improvement_pct_ci is null only when an arm has no users or the control has no conversions; at low counts it is wide: a treatment with 6 converting users out of 200 against a control with 2 out of 200 gives -34.2% to +1,206.3% at the 0.95 level. For a mean it is null when the control's mean plus or minus its margin reaches 0, where Fieller's set of ratios is unbounded. The interval on the difference is still reported."
by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_a_treatment_with_no_users_has_no_intervals",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_every_none_on_the_architects_grid_is_counted",

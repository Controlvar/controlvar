# What verifies each unit of docs/getting-started/limitations.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/getting-started/limitations.md"

[[unit]]
text = "Limitations"
by = ["exempt:label"]

[[unit]]
text = "What Controlvar does not do, and what happens instead."
by = ["exempt:navigation"]

[[unit]]
text = "Where a public issue tracks a change, the row links it."
by = ["exempt:navigation"]

[[unit]]
text = "Feature flags"
by = ["exempt:label"]

[[unit]]
text = "What you might expect | What happens instead"
by = ["exempt:label"]
count = 7

[[unit]]
text = "A flag that serves one of several values | A flag is on or off for each user. Evaluation answers \"config\": null for every flag, a request that sends a flag a variants field is refused with 422, and default_value accepts only false. To serve one of several experiences, run a multivariate experiment: each variant carries a configuration, which POST /api/v1/tracking/assign returns."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_a_flag_request_with_variants_is_refused",
    "test:backend/tests/unit/api/test_documented_limits.py::test_a_flag_serves_false_when_off_and_nothing_else",
    "test:backend/tests/integration/api/test_front_door_behaviour.py::test_every_flag_evaluates_with_a_null_config",
]

[[unit]]
text = "Experiments and results"
by = ["exempt:label"]

[[unit]]
text = "Every event value counted in a revenue, duration or custom metric | A value that is not a number, is infinite, or is larger than 10^12 in size, in the unit it was sent in, adds nothing to its user's total; the event still counts its user in conversions. A count metric counts events and does not read their value."
by = [
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_values_that_are_not_finite_or_too_large_add_nothing",
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_duration_and_custom_add_up_each_users_values",
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_a_count_does_not_read_the_value",
]

[[unit]]
text = "A revenue, count, duration or custom metric's sequential analysis, Bayesian analysis, sample-size plan, daily series and Live tab by its values | Each is of the share of users who sent the metric's event, as for a conversion. CUPED does not analyse these metrics."
by = ["test:backend/tests/integration/api/test_revenue_per_user_results.py::test_the_other_analyses_of_a_revenue_metric_stay_on_the_share_of_buyers"]

[[unit]]
text = "A breakdown by segment of a revenue, count, duration or custom metric by its values | The Breakdowns view of such a metric shows, in its column headed Mean, the share of users who sent the metric's event in each segment. The metric's headline row is its mean per user."
by = ["test:backend/tests/integration/api/test_revenue_breakdown_share_of_buyers.py::test_a_revenue_metric_breakdown_is_the_share_of_buyers"]

[[unit]]
text = "The average time one event takes, such as page load time | A duration metric is each user's total of its events' values, 0 for a user with none, averaged over every assigned user: a variant whose users send the event less often reads as less time. No metric averages over events rather than users."
by = [
    "test:backend/tests/unit/services/test_value_metrics_per_user.py::test_a_duration_is_time_per_assigned_user_not_per_event",
    "test:backend/tests/unit/services/test_revenue_per_user_routing.py::test_the_results_analyse_every_type_but_conversion_as_a_mean",
]

[[unit]]
text = "Intervals on a treatment's difference adjusted for the experiment's correction | The intervals on a treatment's difference from the control, on its relative change and on its impact are not adjusted for comparing several treatments with the control, while is_significant is (Benjamini-Hochberg by default). With two or more treatments an interval can exclude 0 on a treatment that is not significant. For a metric analysed as a share of users, the interval and Fisher's exact test can also disagree near the threshold, either way."
by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_b5_an_adjusted_treatment_is_not_significant_although_its_interval_excludes_0",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_mean_interval_against_significance",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_proportion_interval_against_significance",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_named_boundary_tables",
]

[[unit]]
text = "An interval on the relative change for every treatment | relative_improvement_pct_ci is null when the control's own limits reach 0 or twice its mean, where the relative change has no finite bound: a control with 2 conversions of 200 users has none at the 0.95 level. The interval on the difference is still reported."
by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_an_unbounded_control_has_no_relative_interval",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_a_mean_control_whose_interval_reaches_0_has_no_relative_interval",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_every_none_on_the_architects_grid_is_counted",
]

[[unit]]
text = "The impact projected to all traffic, to a later period, or in a currency | incremental_impact is the difference from the control times the treatment's own assigned users so far, as a plain number: nothing projects it further, and no currency or unit is read or added."
by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_proportion_impact_is_the_difference_times_the_treatments_users",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_mean_impact_is_the_difference_times_the_treatments_users",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_impact_is_a_plain_number",
]

[[unit]]
text = "The intervals and the impact in the data export | The export has no interval or impact column; GET /api/v1/results/{experiment_id} reports them."
by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_the_export_has_no_interval_or_impact_column",
    "test:backend/tests/integration/api/test_results_difference_intervals.py::test_a_proportion_with_a_control_at_0_has_a_difference_and_no_relative_change",
]

[[unit]]
text = "An interval on the difference, or an impact, in a warehouse analysis of a mean | A warehouse analysis gives a proportion metric's treatments their difference from the control with its interval, the relative change's interval and the impact, as /results does. A mean metric's treatments get none of them; their p-value and relative change are reported as before."
by = [
    "test:modules/backend/tests/unit/warehouse/test_estimator_fields_parity.py::test_a_proportion_run_carries_the_difference_fields",
    "test:modules/backend/tests/unit/warehouse/test_estimator_fields_parity.py::test_a_mean_run_carries_none_of_the_difference_fields",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_a_warehouse_mean_result_carries_none_of_the_new_fields",
]

[[unit]]
text = "A traffic allocation for the experiment as a whole | There is none. Variant weights must add up to exactly 100%, or the request is refused with 422. Users are left out only by targeting rules, a mutual exclusion group or the global holdout."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_the_experiment_has_no_traffic_allocation_of_its_own",
    "test:backend/tests/unit/api/test_documented_limits.py::test_variant_weights_under_100_are_refused_with_the_documented_message",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_native_targeting_rules_gate_new_users",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_mutual_exclusion_assigns_each_user_to_exactly_one_experiment",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_holdout_users_get_control_and_are_not_recorded",
]

[[unit]]
text = "One user known by two ids, such as a visitor who signs in | No identify or alias call: a user who signs in under a new id mid-funnel gets a second assignment. Assign with the id you will track purchases with."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_no_call_says_that_two_user_ids_are_one_user",
    "test:backend/tests/unit/api/test_documented_limits.py::test_assignment_hashes_the_experiment_key_and_the_user",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssign::test_assigns_user_to_a_variant_and_is_sticky",
]

[[unit]]
text = "An LLM experiment that picks the variant with the lowest value | An LLM experiment's winner is the variant with the highest mean of the metric it is compared on: the business metric when every variant has one, otherwise the judge score. There is no lower-is-better setting for it."
by = [
    "test:backend/tests/unit/services/test_llm_analytics.py::TestGetExperimentResults::test_winner_is_variant_with_higher_business_metric",
    "test:backend/tests/unit/services/test_llm_analytics.py::TestGetExperimentResults::test_winner_based_on_auto_eval_when_no_business_metric",
]

[[unit]]
text = "A warehouse analysis of a metric where lower is better | A warehouse analysis treats every metric as higher is better: a warehouse metric source has no lower-is-better setting, so its results report lower_is_better: false and name a winner only for a significant increase (#1386)."
by = [
    "test:modules/backend/tests/unit/test_warehouse_lower_is_better.py::test_a_warehouse_result_names_a_winner_only_for_a_significant_increase",
    "test:modules/backend/tests/unit/test_warehouse_lower_is_better.py::test_a_warehouse_metric_source_has_no_lower_is_better_setting",
]

[[unit]]
text = "Deployments"
by = ["exempt:label"]

[[unit]]
text = "Staging and production inside one deployment | One deployment is one environment: flags, experiments and API keys carry no environment field. Run staging and production as separate deployments, each with its own API keys."
by = ["test:backend/tests/unit/api/test_documented_limits.py::test_flags_experiments_and_keys_carry_no_environment"]

[[unit]]
text = "Events streamed to Kinesis, OpenSearch or DynamoDB | The API stores events in PostgreSQL and computes results from there. The full-profile CDK creates a Kinesis stream and an OpenSearch domain, and the API writes to neither."
by = [
    "test:backend/tests/integration/services/test_conversion_event_matching.py::TestResultsEngineCountsSdkEvents::test_get_experiment_results_uses_event_name",
    "test:backend/tests/unit/api/test_documented_limits.py::test_the_api_writes_no_kinesis_stream_firehose_or_opensearch_domain",
    "test:infrastructure/tests/test_app_profiles.py::TestProfileSelection::test_a_full_checkout_builds_the_module_stacks",
]

[[unit]]
text = "Sign-in and access"
by = ["exempt:label"]

[[unit]]
text = "Multi-factor sign-in | Not available: a local account signs in with its email and password alone."
by = ["test:backend/tests/unit/api/test_documented_limits.py::test_a_local_sign_in_takes_an_email_and_a_password_alone"]

[[unit]]
text = "SAML sign-in | Not available. OIDC sign-in is, with the sso module (full profile)."
by = [
    "test:modules/backend/tests/integration/api/test_sso_provisioning_scope.py::test_a_saml_acs_token_is_still_not_a_session",

[[unit]]
text = "Core Concepts"
by = ["exempt:label"]

[[unit]]
text = "This guide explains the fundamental concepts you need to understand before working with the platform."
by = ["exempt:navigation"]

[[unit]]
text = "Whether you are a product manager designing experiments, an engineer integrating feature flags, or an analyst reading results, this reference will clarify what each term means and how the pieces fit together."
by = ["exempt:navigation"]

[[unit]]
text = "Feature Flags"
by = ["exempt:label"]

[[unit]]
text = "A feature flag (also called a feature toggle or feature switch) is a configuration key that controls whether a piece of functionality is visible or active for a given user."
by = ["exempt:theory"]

[[unit]]
text = "Instead of deploying code to enable or disable a feature, you change a flag value at runtime — no deployment required."
by = [
    "test:backend/tests/smoke/test_no_flag_cache.py::test_no_source_names_a_flag_cache_key",
    "docex:docs/getting-started/quick-start.md#\"enabled\": true",
]

[[unit]]
text = "On/Off Flags"
by = ["exempt:label"]

[[unit]]
text = "The simplest type."
by = [
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_no_context_keeps_existing_behaviour",
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_matching_context_enables_flag_with_reason",
]

[[unit]]
text = "A boolean value controls whether the feature is shown at all."
by = [
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_no_context_keeps_existing_behaviour",
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_matching_context_enables_flag_with_reason",
]

[[unit]]
text = "Common uses: gradual rollouts, kill switches, beta programs, maintenance mode."
by = ["exempt:advice"]

[[unit]]
text = "Several Experiences"
by = ["exempt:label"]

[[unit]]
text = "A flag serves two values: on or off, or a string, a number or a JSON value with an off value."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_a_flag_request_with_variants_is_refused",

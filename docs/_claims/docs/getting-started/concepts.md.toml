[[unit]]
text = "Glossary"
by = ["exempt:label"]

[[unit]]
text = "Term | Definition"
by = ["exempt:label"]

[[unit]]
text = "A/B test | Experiment comparing two variants (control and treatment)"
by = ["exempt:theory"]

[[unit]]
text = "A/B/n test | Experiment comparing more than two variants"
by = ["exempt:theory"]

[[unit]]
text = "Alpha (α) | The significance threshold; probability of a false positive you are willing to accept (typically 0.05)"
by = ["exempt:theory"]

[[unit]]
text = "Bucketing | The process of assigning users to variants"
by = ["exempt:theory"]

[[unit]]
text = "Confidence interval | Range of values within which the true effect size likely falls"
by = ["exempt:theory"]

[[unit]]
text = "Control | The baseline variant; typically the existing experience"
by = ["exempt:theory"]

[[unit]]
text = "Conversion rate | Fraction of users who completed a defined action"
by = ["exempt:theory"]

[[unit]]
text = "Covariate | In CUPED, the pre-experiment data used to adjust a result: here, whether the user sent the metric's event before being assigned"
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_cuped_recovers_the_seeded_history"]

[[unit]]
text = "CUPED | Controlled-experiment Using Pre-Experiment Data; a variance reduction technique"
by = ["exempt:theory"]

[[unit]]
text = "Effect size | The magnitude of the difference between variants"
by = ["exempt:theory"]

[[unit]]
text = "Experiment | A controlled test that assigns users to variants and measures outcomes"
by = ["exempt:theory"]

[[unit]]
text = "Feature flag | A runtime configuration key that controls feature visibility"
by = ["exempt:theory"]

[[unit]]
text = "Guardrail metric | A secondary metric that must not degrade beyond a threshold"
by = ["exempt:theory"]

[[unit]]

    "test:backend/tests/integration/services/test_feature_flag_targeting_rules.py::TestNativeRulesAndReasons::test_inactive_reason",
]

[[unit]]
text = "Enable features for internal testers before public launch"
by = ["exempt:advice"]

[[unit]]

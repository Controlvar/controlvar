[[unit]]
text = "Experiments / A/B Tests"
by = ["exempt:label"]

[[unit]]
text = "An experiment (also called an A/B test or controlled experiment) is the process of splitting users into groups, exposing each group to a different version of a feature, and measuring which version performs better on a defined metric."
by = ["exempt:theory"]

[[unit]]
text = "Hypothesis"
by = ["exempt:label"]

[[unit]]
text = "Every experiment starts with a hypothesis: a precise, falsifiable statement of what you expect to happen and why."
by = ["exempt:theory"]

[[unit]]
text = "Good hypothesis: \"Changing the checkout CTA button from blue to green will increase checkout completion rate by 5% because green creates stronger visual contrast against the white background.\""
by = ["exempt:example"]

[[unit]]
text = "A good hypothesis specifies the change, the expected direction, the magnitude, and the reason."
by = ["exempt:theory"]

[[unit]]
text = "Control vs Treatment"
by = ["exempt:label"]

[[unit]]
text = "Control: the existing experience, unchanged."
by = ["exempt:theory"]

[[unit]]
text = "Serves as the baseline."
by = ["exempt:theory"]

[[unit]]
text = "Treatment (or Variant): the new experience you are testing."
by = ["exempt:theory"]

[[unit]]
text = "An experiment can have one control and one or more treatments."
by = ["test:backend/tests/unit/api/test_documented_limits.py::test_an_experiment_may_have_one_control_and_several_treatments"]

[[unit]]
text = "With two variants (control + one treatment) it is called an A/B test."
by = ["exempt:theory"]

[[unit]]
text = "With more than two variants it is called an A/B/n test or multivariate test."
by = ["exempt:theory"]

[[unit]]
text = "Statistical Significance"
by = ["exempt:label"]

[[unit]]
text = "Statistical significance tells you whether a difference between control and treatment is larger than random noise would usually produce."
by = ["exempt:theory"]

[[unit]]
text = "It is expressed as a p-value: the probability of seeing results as extreme as these if there were no true effect."
by = ["exempt:theory"]

[[unit]]
text = "p-value < 0.05: a difference this large would appear less than 5% of the time if there were no true effect."
by = ["exempt:theory"]

[[unit]]
text = "Standard threshold for most experiments."
by = ["exempt:theory"]

[[unit]]
text = "p-value < 0.01: a difference this large would appear less than 1% of the time if there were no true effect."
by = ["exempt:theory"]

[[unit]]
text = "Use for high-stakes decisions."
by = ["exempt:theory"]

[[unit]]
text = "A result is statistically significant when p < your chosen alpha threshold (usually 0.05)."
by = ["exempt:theory"]

[[unit]]
text = "Important: statistical significance does not tell you the effect is large or meaningful."
by = ["exempt:theory"]

[[unit]]
text = "Always check effect size alongside p-value."
by = ["exempt:theory"]

[[unit]]
text = "Variants"
by = ["exempt:label"]

[[unit]]
text = "A variant is one of the possible experiences in an experiment."
by = ["exempt:theory"]

[[unit]]
text = "A running experiment has at least two variants:"
by = ["test:backend/tests/integration/api/test_front_door_behaviour.py::test_an_experiment_with_one_variant_cannot_start"]

[[unit]]
text = "Control variant: the baseline experience (usually what users see today)"
by = ["exempt:theory"]

[[unit]]
text = "Treatment variant(s): the new experience(s) you are testing"
by = ["exempt:theory"]

[[unit]]
text = "Each variant is assigned a traffic weight — the fraction of eligible users who will be shown that variant."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_the_weights_divide_the_100_buckets_between_the_variants_in_order",
    "test:backend/tests/integration/services/test_assignment_service_coverage.py::TestHashUserToVariant::test_distribution_roughly_matches_traffic_allocation",
]

[[unit]]
text = "The weights must add up to exactly 100%; anything else is refused with 422 (\"Traffic allocations must sum to 100% (currently 90%)\")."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_variant_weights_under_100_are_refused_with_the_documented_message",
    "test:backend/tests/unit/api/test_request_validation.py::TestExperimentValidation::test_variant_traffic_allocation_sum",
]

[[unit]]
text = "To keep users out of an experiment, use targeting rules or the global holdout."
by = ["exempt:advice"]

[[unit]]
text = "Variants vs Feature Flags"
by = ["exempt:label"]

[[unit]]
text = "A feature flag controls access to a feature for a user."
by = ["exempt:theory"]

[[unit]]
text = "A variant controls which version of a feature a user sees within an experiment."
by = ["exempt:theory"]

[[unit]]
text = "Experiments are temporary; feature flags are often permanent configuration."
by = ["exempt:advice"]

[[unit]]
text = "Metrics"
by = ["exempt:label"]

[[unit]]
text = "A metric is the measurable outcome you use to evaluate whether a variant is better or worse than the control."
by = ["exempt:theory"]

[[unit]]
text = "Metric Types"
by = ["exempt:label"]

[[unit]]
text = "Type | Description | Example"
by = ["exempt:label"]

[[unit]]
text = "Conversion | Binary: did the event happen or not? | Clicked button, completed checkout, signed up"
by = ["test:backend/tests/unit/services/test_binomial_metric_result_characterisation.py::test_binomial_metric_result_characterisation"]

[[unit]]
text = "Revenue | The amount on each user's events, as revenue per user | Order total sent as the value of purchase"
by = [
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_a_revenue_metric_is_analysed_per_assigned_user",
    "test:frontend/src/tests/components/MetricComparisonTable.revenue.test.tsx::shows each variant as a plain amount labelled \"revenue per user\", with no \"%\" or \"$\"",
]

[[unit]]
text = "Count | How many times each user sends the event, as events per user | Articles read: one article_read event each"
by = [
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_a_count_metric_counts_events_sent_with_no_value",
    "test:frontend/src/tests/components/MetricComparisonTable.valueMetrics.test.tsx::labels its value by what it is per user, with the difference per user",
]

[[unit]]
text = "Duration | Time each user spends, added up, as duration per user | Seconds watched sent as the value of watch_session"
by = [
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_duration_and_custom_add_up_each_users_values",
    "test:frontend/src/tests/components/MetricComparisonTable.valueMetrics.test.tsx::labels its value by what it is per user, with the difference per user",
]

[[unit]]
text = "Custom | A number each user's events add up to, as value per user | Points sent as the value of points_earned"
by = [
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_duration_and_custom_add_up_each_users_values",
    "test:frontend/src/tests/components/MetricComparisonTable.valueMetrics.test.tsx::labels its value by what it is per user, with the difference per user",
]

[[unit]]
text = "A conversion metric is analysed as the share of assigned users who sent its event."
by = [
    "test:backend/tests/unit/services/test_revenue_per_user_routing.py::test_the_results_analyse_every_type_but_conversion_as_a_mean",
    "test:backend/tests/unit/services/test_binomial_metric_result_characterisation.py::test_binomial_metric_result_characterisation",
]

[[unit]]
text = "A revenue, count, duration or custom metric is analysed as its mean per assigned user, compared with Welch's t-test: for a count metric each user's value is the number of the metric's events they sent, whatever their value; for a revenue, duration or custom metric it is the total of those events' value; a user with none counts as 0."
by = [
    "test:backend/tests/unit/services/test_revenue_per_user_routing.py::test_the_results_analyse_every_type_but_conversion_as_a_mean",
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_a_count_metric_counts_events_sent_with_no_value",
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_a_count_does_not_read_the_value",
    "test:backend/tests/integration/api/test_value_metrics_results.py::test_duration_and_custom_add_up_each_users_values",
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_a_revenue_metric_is_analysed_per_assigned_user",
]

[[unit]]
text = "So a duration metric is time spent per assigned user, not the time one event takes."
by = ["test:backend/tests/unit/services/test_value_metrics_per_user.py::test_duration_and_custom_match_scipy_on_the_per_user_values"]

[[unit]]
text = "See Limitations."
by = ["exempt:navigation"]

[[unit]]
text = "Primary vs Secondary Metrics"
by = ["exempt:label"]

[[unit]]
text = "Each experiment should have exactly one primary metric — the north star for your ship/no-ship decision."
by = ["exempt:advice"]

[[unit]]
text = "All other metrics are secondary and used to check for unexpected side effects."
by = ["exempt:advice"]

[[unit]]
text = "Example: primary = checkout completion rate; secondary = cart abandonment rate, revenue per user, customer support contacts."
by = ["exempt:example"]

[[unit]]
text = "Guardrail Metrics"
by = ["exempt:label"]

[[unit]]
text = "Guardrail metrics are secondary metrics with a minimum acceptable threshold."
by = ["exempt:theory"]

[[unit]]
text = "If a treatment improves your primary metric but degrades a guardrail metric beyond its threshold, the experiment should not ship."
by = ["exempt:advice"]

[[unit]]
text = "Example guardrail: \"Support ticket rate must not increase by more than 5%.\""
by = ["exempt:example"]

[[unit]]
text = "User Bucketing"
by = ["exempt:label"]

[[unit]]
text = "User bucketing is the process of assigning each user to a variant."
by = ["exempt:theory"]

[[unit]]
text = "The platform uses consistent hash-based bucketing."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_assignment_hashes_the_experiment_key_and_the_user",
    "test:tests/sdk-contract/test_hash_contract.py::test_correct_answers_pass_and_report_the_counts",
]

[[unit]]
text = "Consistent Hash Assignment"
by = ["exempt:label"]

[[unit]]
text = "The assignment is computed as a deterministic hash of experiment_key + user_id."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_assignment_hashes_the_experiment_key_and_the_user",
    "test:backend/tests/unit/core/test_consistent_hash.py::test_every_golden_vector_matches",
]

[[unit]]
text = "This means:"
by = ["exempt:theory"]

[[unit]]
text = "The same user always gets the same variant for a given experiment (sticky assignment)"
by = ["test:backend/tests/integration/api/test_tracking_api.py::TestAssign::test_assigns_user_to_a_variant_and_is_sticky"]

[[unit]]
text = "The API stores each assignment, and a user who already has one gets it back unchanged, even if the weights have changed since"
by = ["test:backend/tests/integration/api/test_tracking_api.py::TestBanditAssignment::test_existing_assignment_is_sticky_when_weights_change"]

[[unit]]
text = "Sticky assignment survives server restarts, cache clears, and SDK reinitializations"
by = ["test:backend/tests/integration/api/test_tracking_api.py::TestBanditAssignment::test_existing_assignment_is_sticky_when_weights_change"]

[[unit]]
text = "The hash puts each user in one of 100 buckets, numbered 0 to 99, and the traffic weights divide the buckets between the variants in order: with 50% control and 50% treatment, buckets 0–49 get control and buckets 50–99 get treatment."
by = [
    "test:backend/tests/unit/core/test_consistent_hash.py::test_bucket_is_derived_from_the_same_float",
    "test:backend/tests/unit/api/test_documented_limits.py::test_the_weights_divide_the_100_buckets_between_the_variants_in_order",
]

[[unit]]
text = "A multi-armed bandit experiment places new users by the bandit's current weights instead."
by = ["test:backend/tests/integration/api/test_tracking_api.py::TestBanditAssignment::test_new_users_follow_bandit_weights"]

[[unit]]
text = "Why Consistent Bucketing Matters"
by = ["exempt:label"]

[[unit]]
text = "Without consistent bucketing, a user could see the control variant on Monday and the treatment variant on Wednesday."
by = ["exempt:theory"]

[[unit]]
text = "This would contaminate your results and create a confusing user experience."
by = ["exempt:theory"]

[[unit]]
text = "Variant Weights vs Rollout Percentage"
by = ["exempt:label"]

[[unit]]
text = "These two concepts are related but distinct:"
by = ["exempt:theory"]

[[unit]]
text = "Variant Weights (Experiments)"
by = ["exempt:label"]

[[unit]]
text = "An experiment has no separate traffic allocation: every eligible user is assigned, and the variant weights decide how users are split."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_the_experiment_has_no_traffic_allocation_of_its_own",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssign::test_assigns_user_to_a_variant_and_is_sticky",
]

[[unit]]
text = "Users are left out of an experiment only by its targeting rules, a mutual exclusion group or the global holdout."
by = [
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_native_targeting_rules_gate_new_users",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_mutual_exclusion_assigns_each_user_to_exactly_one_experiment",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_holdout_users_get_control_and_are_not_recorded",
]

[[unit]]
text = "Rollout Percentage (Feature Flags)"
by = ["exempt:label"]

[[unit]]
text = "Rollout percentage is the fraction of users for whom a feature flag evaluates to true (enabled)."
by = ["test:backend/tests/unit/api/test_documented_limits.py::test_a_rollout_percentage_is_the_share_of_users_turned_on"]

[[unit]]
text = "A feature flag at 10% rollout means 10% of users see the feature and 90% do not."
by = ["exempt:example"]

[[unit]]
text = "Unlike variant weights, a rollout percentage is usually increased over time as confidence grows."
by = ["exempt:advice"]

[[unit]]
text = "Targeting Rules"
by = ["exempt:label"]

[[unit]]
text = "Targeting rules define which users are eligible for an experiment, and which users a feature flag's rules turn on."
by = [
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_native_targeting_rules_gate_new_users",
    "test:backend/tests/integration/services/test_feature_flag_targeting_rules.py::TestDashboardRules::test_matched_rule_uses_rule_percentage_unmatched_uses_global",
]

[[unit]]
text = "In an experiment, a new user who does not match the rules is not assigned: the API answers with the control variant and \"assigned\": false, records no assignment, and the user does not count in the results."
by = ["test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_native_targeting_rules_gate_new_users"]

[[unit]]
text = "For a feature flag, a user no rule matches gets the flag's rollout percentage."
by = ["test:backend/tests/integration/services/test_feature_flag_targeting_rules.py::TestDashboardRules::test_matched_rule_uses_rule_percentage_unmatched_uses_global"]

[[unit]]
text = "Attribute-Based Rules"
by = ["exempt:label"]

[[unit]]
text = "Rules are evaluated against user attributes that your application passes to the platform at evaluation time."
by = [
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_no_context_keeps_existing_behaviour",
    "test:backend/tests/integration/api/test_feature_flag_evaluate_context.py::TestGetEvaluateWithContext::test_matching_context_enables_flag_with_reason",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_native_targeting_rules_gate_new_users",
]

[[unit]]
text = "Combining Rules"
by = ["exempt:label"]

[[unit]]
text = "Rules can be combined using AND (all must match), OR (at least one must match), and NOT (inverts the result)."
by = [
    "test:backend/tests/unit/core/test_rules_engine.py::TestRuleGroupEvaluation::test_and_operator",

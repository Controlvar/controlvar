    "test:backend/tests/integration/api/test_flag_values_api.py::test_evaluation_serves_on_exactly_when_enabled_and_off_otherwise",
]

[[unit]]
text = "To split users among three or more experiences, or to measure which one does better, run a multivariate experiment instead."
by = ["exempt:advice"]

[[unit]]
text = "Each of its variants carries a configuration, which POST /api/v1/tracking/assign returns."
by = [
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot",
    "docex:docs/getting-started/quick-start.md#\"assigned\": true",

[[unit]]
text = "Controlvar is a self-hosted experimentation platform for running A/B tests, feature flags, and controlled rollouts."
by = [
    "docex:docs/getting-started/quick-start.md#\"assigned\": true",
    "docex:docs/getting-started/quick-start.md#\"reason\": \"rollout\"",
    "journey:feature-flag-rollout#at-ten",
]

[[unit]]
text = "It provides a complete solution for data-driven product development: design experiments, assign users to variants, track conversion events, run statistical analysis, and make shipping decisions — all in one platform."
by = [
    "docex:docs/getting-started/quick-start.md#\"assigned\": true",
    "docex:docs/getting-started/quick-start.md#\"cta_click\"",

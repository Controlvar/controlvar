[[unit]]
text = "The platform provides audit-trail controls that customers use as evidence in their own SOC 2 or ISO/IEC 27001 programs; the compliance module adds tamper-evident signing and report packs."
by = [
    "test:backend/tests/integration/api/test_audit_route_events.py::test_flag_create",
    "test:modules/backend/tests/unit/api/test_compliance_signing.py::TestAuditEventSignature::test_audit_event_has_hmac_signature",

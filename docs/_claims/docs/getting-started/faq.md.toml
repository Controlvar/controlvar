    "test:backend/tests/unit/services/test_binomial_metric_result_characterisation.py::test_binomial_metric_result_characterisation",
    "test:backend/tests/integration/api/test_front_door_behaviour.py::test_a_revenue_metric_is_analysed_as_a_conversion",
    "test:modules/backend/tests/integration/warehouse/test_runs_api.py::test_mean_run_end_to_end",
]

[[unit]]

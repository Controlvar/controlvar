[[unit]]
text = "How does CUPED variance reduction work?"
by = ["exempt:label"]

[[unit]]
text = "CUPED (Controlled-experiment Using Pre-Experiment Data) reduces result noise by adjusting each conversion rate for whether users sent the metric's event in the days before they were assigned."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_cuped_recovers_the_seeded_history"]

[[unit]]
text = "The adjustment uses a regression slope (theta) pooled within the experiment's arms."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_cuped_recovers_the_seeded_history"]

[[unit]]
text = "When that history predicts the outcome, lower variance means you reach statistical significance with fewer users, or detect smaller effects with the same sample size."
by = ["exempt:theory"]

[[unit]]
text = "History counts only if the server received it before the user was assigned, so send it before you start the experiment."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_cuped_recovers_the_seeded_history"]

[[unit]]
text = "GET /api/v1/results/{experiment_id}/cuped reports it; see CUPED documentation."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "What is Bayesian experimentation vs frequentist?"
by = ["exempt:label"]

[[unit]]
text = "Frequentist testing (the default) computes a p-value: the probability of seeing results as extreme as these if there were no true effect."
by = ["test:backend/tests/unit/services/test_binomial_metric_result_characterisation.py::test_binomial_metric_result_characterisation"]

[[unit]]
text = "You make a binary decision: reject the null hypothesis (p < 0.05) or fail to reject it."
by = ["exempt:theory"]

[[unit]]
text = "Bayesian testing maintains a probability distribution over the possible true values of the metric."
by = ["exempt:theory"]

[[unit]]
text = "It gives you:"
by = ["exempt:theory"]

[[unit]]
text = "A credible interval: the range where the true effect likely falls, with a specified probability"
by = ["test:backend/tests/integration/api/test_bayesian_results_api.py::TestBayesianResultsEnabled::test_bayesian_variant_results_structure"]

[[unit]]
text = "Probability of superiority: P(treatment > control), a natural way to communicate results"
by = ["test:backend/tests/integration/api/test_bayesian_results_api.py::TestBayesianResultsEnabled::test_bayesian_variant_results_structure"]

[[unit]]
text = "A Bayes factor: how much more likely the data is under the alternative hypothesis than the null"
by = ["test:backend/tests/integration/api/test_bayesian_results_api.py::TestBayesianResultsEnabled::test_bayesian_variant_results_structure"]

[[unit]]
text = "Bayesian methods are more flexible for continuous monitoring and provide richer output than a binary p-value."
by = ["exempt:theory"]

[[unit]]

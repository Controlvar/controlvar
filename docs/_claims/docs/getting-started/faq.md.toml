[[unit]]
text = "How is user assignment consistent across requests?"
by = ["exempt:label"]

[[unit]]
text = "User-to-variant assignment uses a deterministic consistent hash of experiment_key + user_id."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_assignment_hashes_the_experiment_key_and_the_user",
    "test:backend/tests/unit/core/test_consistent_hash.py::test_every_golden_vector_matches",
]

[[unit]]
text = "Because the hash is deterministic, the same user always receives the same variant for a given experiment — regardless of which server processes the request, whether the cache is warm, or whether the SDK has been restarted."
by = [
    "test:backend/tests/unit/core/test_consistent_hash.py::test_every_golden_vector_matches",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssign::test_assigns_user_to_a_variant_and_is_sticky",
]

[[unit]]
text = "The hash decides a new user's variant from the experiment's traffic weights."
by = ["test:backend/tests/unit/api/test_documented_limits.py::test_the_weights_divide_the_100_buckets_between_the_variants_in_order"]

[[unit]]
text = "The API then stores the assignment, and a user who already has one gets it back unchanged, even if the weights have changed since."
by = ["test:backend/tests/integration/api/test_tracking_api.py::TestBanditAssignment::test_existing_assignment_is_sticky_when_weights_change"]


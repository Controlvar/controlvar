[[unit]]
text = "What is the difference between a feature flag and an experiment?"
by = ["exempt:label"]

[[unit]]
text = "Feature flags control whether a feature is visible to a user."
by = ["exempt:theory"]

[[unit]]
text = "They are primarily operational tools — used for gradual rollouts, kill switches, and beta programs."
by = ["exempt:theory"]

[[unit]]
text = "A flag has no statistical analysis attached to it."
by = ["test:backend/tests/unit/api/test_documented_limits.py::test_a_flag_has_no_results_route"]

[[unit]]
text = "Experiments are scientific tools for causal measurement."
by = ["exempt:theory"]

[[unit]]
text = "They split users into variants, track defined metrics, and apply statistical tests to determine whether a variant is better than the control."
by = ["exempt:theory"]

[[unit]]
text = "Experiments have a defined start and end date and produce a ship/no-ship recommendation."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "You can combine both: run a feature behind a flag during an experiment, then graduate the flag to 100% after the experiment concludes."
by = ["exempt:advice"]


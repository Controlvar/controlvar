]

[[unit]]
text = "Creating, changing and deleting experiments and feature flags (and, in the full profile, warehouse connections, sources and analysis runs) is recorded in the compliance audit trail."
by = [
    "test:backend/tests/integration/api/test_compliance_api.py::TestListAuditEvents::test_admin_can_list_audit_events",
    "test:backend/tests/unit/services/test_audit_log_service.py::TestAuditLogServiceLog::test_log_event_signs_event_with_hmac",
]

[[unit]]
text = "With the compliance module each event is signed with HMAC-SHA256 under the AUDIT_HMAC_KEY setting; without it events are recorded unsigned."
by = ["test:backend/tests/unit/services/test_audit_log_service.py::TestAuditLogServiceLog::test_log_event_signs_event_with_hmac"]

[[unit]]
text = "Logins, role changes and exports are not recorded in this trail; logins and role changes are recorded in the other audit log, GET /api/v1/audit-logs."
by = ["test:backend/tests/smoke/test_audit_inventory.py::test_the_inventory_is_exact"]

[[unit]]
text = "Pre-built compliance reports are available at:"

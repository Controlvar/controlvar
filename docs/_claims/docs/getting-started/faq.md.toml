by = ["exempt:label"]

[[unit]]
text = "What roles and permissions are available?"
by = ["exempt:label"]

[[unit]]
text = "The platform uses a layered role-based access control system with four built-in roles:"
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_there_are_four_built_in_roles",
    "test:backend/tests/unit/core/test_permissions.py::TestHasPermission::test_viewer_permissions",
]

[[unit]]
text = "Role | What They Can Do"
by = ["exempt:label"]

[[unit]]
text = "VIEWER | Reads every experiment, flag and result and changes none; can create an API key, which writes tracking data"
by = [
    "test:backend/tests/unit/core/test_permissions.py::TestHasPermission::test_viewer_permissions",
    "test:backend/tests/integration/api/test_api_keys_api.py::TestRulesetScopeNeedsFlagChangeRole::test_keys_without_the_scope_are_unchanged",
    "test:backend/tests/integration/api/test_front_door_behaviour.py::test_a_viewers_own_key_assigns_users_and_tracks_events",
]

[[unit]]
text = "ANALYST | View all experiments, results, audit logs, and reports"
by = ["test:backend/tests/unit/core/test_permissions.py::TestHasPermission::test_analyst_permissions"]

[[unit]]
text = "DEVELOPER | Create and manage experiments and feature flags; read integration settings, but not change them"
by = [
    "test:backend/tests/unit/core/test_permissions.py::TestHasPermission::test_developer_permissions",
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestListIntegrations::test_developer_can_list_integrations",
]

[[unit]]
text = "ADMIN | Full access: user management, compliance exports, global settings, integrations"
by = [
    "test:backend/tests/unit/core/test_permissions.py::TestHasPermission::test_admin_has_permission",
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestCreateIntegration::test_admin_can_create_jira_integration",
]

[[unit]]
text = "Beyond the four base roles, admins can create custom roles with specific per-resource and per-action permissions."
by = ["test:modules/backend/tests/unit/services/test_rbac_service.py::TestGetEffectivePermissions::test_expired_direct_grant_not_included"]

[[unit]]
text = "They can also grant direct permission to a user for a specific resource, with an optional expiry timestamp for temporary access."
by = ["test:modules/backend/tests/unit/services/test_rbac_service.py::TestGetEffectivePermissions::test_expired_direct_grant_not_included"]

[[unit]]
text = "Both are stored and shown by GET /api/v1/rbac/users/{user_id}/permissions, but no permission check reads them yet: what a user can do is decided by their base role (#891)."
by = [
    "test:modules/backend/tests/unit/services/test_rbac_service.py::TestCreateCustomRole::test_creates_role_with_name",
    "test:backend/tests/unit/api/test_documented_limits.py::test_the_permission_check_reads_only_the_built_in_role",
]


[[unit]]
text = "Unlike JWT tokens, which sign a user in, API keys do not expire unless they are created with an expiry (expires_at)."
by = [
    "test:backend/tests/unit/api/test_documented_limits.py::test_an_api_key_expires_only_when_given_an_expiry",

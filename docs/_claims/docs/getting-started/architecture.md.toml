[[unit]]
text = "Background Schedulers"
by = ["exempt:label"]

[[unit]]
text = "Several background tasks run on a configurable cycle alongside the API process:"
by = ["test:backend/tests/unit/core/test_experiment_scheduler_interval.py::test_lifespan_passes_the_setting_to_the_experiment_scheduler"]

[[unit]]
text = "Scheduler | Default Cycle | Responsibility"
by = ["exempt:label"]

[[unit]]
text = "Experiment scheduler | 15 minutes (EXPERIMENT_SCHEDULER_INTERVAL_MINUTES) | Auto-starts draft experiments at start_date, resumes a paused experiment only at a resume_at scheduled after the pause, auto-stops at end_date"
by = [
    "test:backend/tests/unit/core/test_experiment_scheduler_interval.py::test_the_default_is_15_minutes",
    "test:backend/tests/integration/services/test_scheduler_pause_semantics.py::test_p6_due_draft_activates",
    "test:backend/tests/integration/services/test_scheduler_pause_semantics.py::test_p2_scheduled_resume_is_recorded_and_fires",
]

[[unit]]
text = "Rollout scheduler | 15 minutes | Advances rollout schedule stages based on time-based triggers"
by = ["test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_settings_have_scheduler_interval_defaults"]

[[unit]]
text = "Safety monitor | 5 minutes | Checks error rate and latency thresholds; triggers auto-rollback if breached"
by = [
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_settings_have_scheduler_interval_defaults",
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_rollback_uses_config_rollback_percentage",
]

[[unit]]
text = "Bandit scheduler | 5 minutes (BANDIT_UPDATE_INTERVAL_MINUTES) | Recomputes variant weights for active multi-armed bandit experiments from DynamoDB counters when every variant has at least PostgreSQL's pulls and successes there, otherwise from PostgreSQL assignments + converting users (counted as /results counts them); /tracking/assign routes new users by these weights"
by = [
    "test:backend/tests/unit/services/test_bandit_scheduler.py::TestDynamoDBCompleteness::test_partial_dynamodb_count_loses_to_larger_postgres_count",
    "test:backend/tests/unit/services/test_bandit_scheduler.py::TestDynamoDBCompleteness::test_complete_pulls_but_partial_dynamodb_successes_uses_postgres",
    "test:backend/tests/integration/api/test_tracking_api.py::TestBanditAssignment::test_new_users_follow_bandit_weights",
]


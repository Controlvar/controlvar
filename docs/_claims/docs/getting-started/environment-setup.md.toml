[[unit]]
text = "The most important environment variables to configure:"
by = ["exempt:instruction"]

[[unit]]
text = "Database Connection"
by = ["exempt:label"]

[[unit]]
text = "Choose your own POSTGRES_PASSWORD for anything but a local database."
by = ["exempt:advice"]

[[unit]]
text = "Redis Connection"
by = ["exempt:label"]

[[unit]]
text = "Set REDIS_PASSWORD as well if your Redis requires one; the local stack's does not."

[[unit]]
text = "Application Settings"
by = ["exempt:label"]

[[unit]]
text = "These are development values."
by = ["exempt:example"]

[[unit]]
text = "In production, set LOG_LEVEL to INFO, WARNING or ERROR."
by = ["exempt:advice"]

[[unit]]
text = "Security Settings"
by = ["exempt:label"]

[[unit]]
text = "SECRET_KEY signs login tokens."
by = ["test:backend/tests/unit/api/test_local_auth.py::TestLocalTokens::test_wrong_secret_rejected"]

[[unit]]
text = "It must be a random string of at least 32 characters, and staging and production refuse a shorter one or one of the placeholders in this repository."
by = [
    "test:backend/tests/unit/core/test_config_environment.py::TestHardenedSecrets::test_committed_placeholders_are_refused",
    "test:backend/tests/unit/core/test_config_environment.py::TestModuleImportSelection::test_weak_secret_key_in_production_refuses_to_boot",
]

[[unit]]
text = "Generate one:"
by = ["exempt:instruction"]

[[unit]]
text = "It prints 64, the key's length."
by = ["docex:docs/getting-started/environment-setup.md#64"]

[[unit]]
text = "Put SECRET_KEY= followed by the key (echo \"$SECRET_KEY\" shows it) in your environment file, next to these:"
by = ["exempt:instruction"]

[[unit]]
text = "CORS_ORIGINS lists the browser origins, other than the API's own, that may call the API: a comma-separated list or a JSON array, such as CORS_ORIGINS=https://shop.example.com,https://www.example.com."
by = [
    "test:backend/tests/unit/core/test_config_cors.py::TestCorsOriginsSettings::test_comma_separated_env_value_is_split",
    "test:backend/tests/unit/core/test_config_cors.py::TestCorsOriginsSettings::test_json_list_is_still_accepted",
]

[[unit]]
text = "BACKEND_CORS_ORIGINS is also accepted, in either form, and wins when both are set."
by = [
    "test:backend/tests/unit/core/test_cors_origin_normalisation.py::test_backend_cors_origins_takes_the_comma_form_too",
    "test:backend/tests/unit/core/test_environment_settings_classes.py::test_backend_cors_origins_wins_when_both_are_set",
]

[[unit]]
text = "Every origin in DASHBOARD_ORIGINS is added as well."
by = ["test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_dashboard_origins_are_added_after_cors_origins_once_each"]

[[unit]]
text = "When neither is set, development and test allow the local apps: http://localhost ports 3100, 3000, 3001, 3200 and 3300 (development's own default adds port 8000)."
by = [
    "test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_the_localhost_defaults_are_the_five_local_apps",
    "test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_development_keeps_its_own_defaults",
]

[[unit]]
text = "Staging and production allow no other origin: the dashboard is served from the API's own origin and needs none."
by = ["test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_a_staging_or_production_api_allows_no_origin_it_was_not_given"]

[[unit]]
text = "To call a staging or production API from a browser on another origin -- a site running the browser SDK, a demo app, or a local dashboard -- add that origin to CORS_ORIGINS."
by = ["exempt:instruction"]

[[unit]]
text = "Credentials (cookies) are never allowed on a cross-origin request."
by = ["test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_credentials_are_never_allowed_cross_origin"]

[[unit]]
text = "CORS_ORIGINS= in staging or production is accepted, allows every origin without credentials, and is reported with a WARNING at start-up; every staging or production start-up logs the effective list in one INFO line."
by = [
    "test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_a_wildcard_however_spelled_is_kept",
    "test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_start_up_warns_about_a_wildcard",
    "test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_start_up_names_the_effective_list",
    "test:backend/tests/unit/core/test_cors_allow_list_by_environment.py::test_start_up_names_an_empty_list",
]

[[unit]]
text = "SDK_RATE_LIMIT_PER_MINUTE is the per-IP ceiling for SDK traffic (/api/v1/tracking/ and flag evaluation)."
by = [
    "test:backend/tests/unit/middleware/test_rate_limiter.py::TestRateLimitConfig::test_sdk_limit_is_configurable",
    "test:backend/tests/unit/middleware/test_rate_limiter.py::TestRateLimitConfig::test_tracking_endpoints_have_higher_limits",
]

[[unit]]
text = "The default is 6000 a minute."
by = ["test:backend/tests/unit/core/test_environment_settings_classes.py::test_the_sdk_rate_limit_is_6000_a_minute_by_default"]

[[unit]]
text = "Background Jobs"
by = ["exempt:label"]

[[unit]]
text = "BANDIT_UPDATE_INTERVAL_MINUTES is how often multi-armed bandit weights are refreshed."
by = ["test:backend/tests/unit/services/test_bandit_scheduler.py::TestBanditSchedulerRunner::test_interval_defaults_from_settings"]

[[unit]]
text = "EXPERIMENT_SCHEDULER_INTERVAL_MINUTES is how often the experiment scheduler starts and completes experiments whose scheduled start_date or end_date has passed."
by = ["test:backend/tests/unit/core/test_experiment_scheduler_interval.py::test_lifespan_passes_the_setting_to_the_experiment_scheduler"]

[[unit]]
text = "The default is 15; a value below 1 is refused when the settings load, so the API does not start."
by = [
    "test:backend/tests/unit/core/test_experiment_scheduler_interval.py::test_the_default_is_15_minutes",
    "test:backend/tests/unit/core/test_experiment_scheduler_interval.py::test_a_value_below_one_is_refused",
]


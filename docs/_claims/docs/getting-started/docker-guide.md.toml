[[unit]]
text = "Docker Local Development"
by = ["exempt:label"]

[[unit]]
text = "This guide runs the local development stack, for your own machine."
by = ["test:backend/tests/unit/infrastructure/test_dev_stack_loopback.py::test_every_published_port_is_bound_to_loopback"]

[[unit]]
text = "It is not for a server."
by = [
    "test:backend/tests/unit/infrastructure/test_dev_stack_loopback.py::test_every_published_port_is_bound_to_loopback",
    "test:backend/tests/unit/core/test_config_environment.py::TestHardenedSecrets::test_placeholders_are_fine_outside_hardened_environments",
]

[[unit]]
text = "The stack publishes its ports on 127.0.0.1 only, ENVIRONMENT=development accepts a short SECRET_KEY, and the first start creates the demo administrator admin@demo.com with the demo password shown in this guide."
by = [
    "test:backend/tests/unit/infrastructure/test_dev_stack_loopback.py::test_every_published_port_is_bound_to_loopback",
    "test:backend/tests/unit/core/test_config_environment.py::TestHardenedSecrets::test_placeholders_are_fine_outside_hardened_environments",
    "docex:docs/getting-started/docker-guide.md#admin@demo.com",
]

[[unit]]
text = "To run Controlvar on a server, use the published images in deploy/compose/compose.yml: the README beside it says how to run it and lists its settings, and Releases, images and verification covers the versions and how to verify the images."
by = ["test:backend/tests/unit/infrastructure/test_production_compose.py::TestShape::test_the_images_are_the_published_ones_at_this_version"]


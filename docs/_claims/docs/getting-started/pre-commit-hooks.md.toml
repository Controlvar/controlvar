by = ["exempt:label"]

[[unit]]
text = "ruff --fix and ruff-format, both scoped to ^(backend|modules|scripts|tests/acceptance)/ — the same four trees as make lint and the lint CI job."
by = [
    "test:backend/tests/unit/infrastructure/test_front_door_facts.py::test_the_ruff_hooks_cover_the_four_trees_at_the_pinned_version",
    "test:backend/tests/unit/infrastructure/test_front_door_facts.py::test_make_lint_and_the_lint_job_run_the_same_checks",
]

[[unit]]
text = "Keep the versions in step."
by = ["exempt:advice"]

[[unit]]
text = "The hook's rev: and the ruff== pin in backend/requirements.txt must match, or a commit that passes locally fails in CI on a formatting difference:"
by = ["test:backend/tests/unit/infrastructure/test_front_door_facts.py::test_the_ruff_hooks_cover_the_four_trees_at_the_pinned_version"]

[[unit]]
text = "grep -A1 ruff-pre-commit .pre-commit-config.yaml | grep rev: the hook"
by = ["exempt:instruction"]

[[unit]]
text = "grep '^ruff==' backend/requirements.txt: CI and the venv"
by = ["exempt:instruction"]

[[unit]]
text = "ruff --version: what you have"
by = ["exempt:instruction"]

[[unit]]
text = "The publication check (repo: local)"
by = ["exempt:label"]

[[unit]]
text = "Two hooks run the repository's publication check: on the staged files at each commit, and on the whole tree and the outgoing commit messages at each push."
by = ["test:backend/tests/unit/infrastructure/test_front_door_facts.py::test_two_local_hooks_run_the_publication_check"]

[[unit]]
text = "This is a subset of the gate, not the gate"
by = ["exempt:label"]

[[unit]]
text = "Pre-commit runs no frontend checks — no eslint, no tsc."
by = ["test:backend/tests/unit/infrastructure/test_front_door_facts.py::test_pre_commit_runs_no_frontend_check"]

[[unit]]
text = "Those live in make lint and in CI."
by = ["test:backend/tests/unit/infrastructure/test_front_door_facts.py::test_make_lint_and_the_lint_job_run_the_same_checks"]

[[unit]]
text = "So a clean git commit is not a green pull request."
by = ["exempt:advice"]

[[unit]]
text = "Before pushing:"
by = ["exempt:instruction"]

[[unit]]
text = "make lint: ruff, import-linter, reuse, the lock checks, eslint, tsc, hadolint, actionlint — exactly what the lint job runs"
by = ["test:backend/tests/unit/infrastructure/test_front_door_facts.py::test_make_lint_and_the_lint_job_run_the_same_checks"]

[[unit]]
text = "Tips"
by = ["exempt:label"]

[[unit]]
text = "Bypassing the hooks is git commit --no-verify."
by = ["exempt:third-party"]

[[unit]]
text = "It only defers the failure to CI, where it costs a round trip instead of a second."
by = ["exempt:advice"]

[[unit]]
text = "pre-commit autoupdate bumps every rev:."
by = ["exempt:third-party"]

[[unit]]
text = "Run make lint afterwards and update the matching pin in backend/requirements.txt in the same commit — an autoupdate that moves ruff on its own is precisely the version skew described above."
by = ["exempt:advice"]

by = ["exempt:navigation"]

[[unit]]
text = "Each line is an address and the number of API requests from it."
by = ["exempt:instruction"]

[[unit]]
text = "Your users' addresses mean it works."
by = ["exempt:advice"]

[[unit]]
text = "If every request comes from one address that is a proxy's, the setting does not cover that proxy, or the proxy in front of it sends no X-Forwarded-For."
by = ["exempt:advice"]


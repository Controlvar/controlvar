document = "docs/self-hosting/monitoring.md"

[[unit]]
text = "Monitoring and Observability"
by = ["exempt:label"]

[[unit]]
text = "The API exposes Prometheus metrics at /metrics, writes structured logs, and answers health probes."
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_exposition_content_type",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestLiveness::test_live_is_200_and_does_not_touch_dependencies",
]

[[unit]]
text = "On AWS, the CDK's monitoring stack adds the CloudWatch dashboards, the alarms and the SNS topic that emails them: see What Gets Deployed."
by = ["test:infrastructure/tests/test_standing_alarms.py::test_every_standing_alarm_emails_the_topic_but_the_per_colour_two"]

[[unit]]
text = "Prometheus Metrics"
by = ["exempt:label"]

[[unit]]
text = "The API exposes a Prometheus-compatible metrics endpoint:"
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_exposition_content_type",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_open_in_development_without_token",
]

[[unit]]
text = "With METRICS_TOKEN set, a scrape sends it as Authorization: Bearer <token> or as ?token=<token>."
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_token_required_when_configured",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsTokenComparison::test_the_right_token_still_passes",
]

[[unit]]
text = "Without it, or with another value, the answer is 401."
by = ["test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_token_required_when_configured"]

[[unit]]
text = "With no METRICS_TOKEN, the endpoint answers in development and test, and answers 403 in every other environment."
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_open_in_development_without_token",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_forbidden_outside_development_without_token",
]

[[unit]]
text = "METRICS_ENABLED=false turns the endpoint off: it answers 404."
by = ["test:backend/tests/unit/core/test_health_endpoints.py::TestMetricsEndpoint::test_disabled_returns_404"]


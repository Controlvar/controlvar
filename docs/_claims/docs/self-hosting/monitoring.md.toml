[[unit]]
text = "Health Check"
by = ["exempt:label"]

[[unit]]
text = "The API answers GET /health without authentication, for load balancers and monitoring."
by = ["test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_health_alias_matches_ready"]

[[unit]]
text = "It is the readiness probe, the same as GET /health/ready:"
by = ["test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_health_alias_matches_ready"]

[[unit]]
text = "Outside production it reports each check with its detail:"
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_ready_when_database_up",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_ready_reports_the_profile",
]

[[unit]]
text = "With ENVIRONMENT=production it leaves out version, environment and every detail except each check's status:"
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_production_hides_details",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_production_reports_the_profile_but_not_the_cause",
]

[[unit]]
text = "It answers 503 Service Unavailable with \"status\": \"unhealthy\" when PostgreSQL does not answer, when Redis does not answer and REDIS_REQUIRED=true, or when the disk check fails."
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_not_ready_when_database_down",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_redis_down_fails_readiness_when_required",
]

[[unit]]
text = "A failed check names the error's type outside production:"
by = [
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_a_failed_check_reports_the_type_not_the_text",
    "test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_the_database_check_reports_only_the_type",
]

[[unit]]
text = "Without REDIS_REQUIRED=true, a Redis that does not answer is reported as unhealthy under checks while the response stays 200 and \"healthy\"."
by = ["test:backend/tests/unit/core/test_health_endpoints.py::TestReadiness::test_redis_down_does_not_fail_readiness_by_default"]

[[unit]]
text = "Free disk space of 1 GB or less is reported as \"low\" and does not fail the probe."
by = ["test:backend/tests/unit/core/test_readiness_at_its_defaults.py::test_free_disk_of_1_gb_or_less_is_low_and_does_not_fail_the_probe"]

[[unit]]
text = "GET /health/live is the liveness probe: it answers 200 whenever the process is up and checks neither PostgreSQL nor Redis."
by = ["test:backend/tests/unit/core/test_health_endpoints.py::TestLiveness::test_live_is_200_and_does_not_touch_dependencies"]

[[unit]]
text = "The ALB health check targets GET /health with a 5-second timeout and a 2/3 healthy/unhealthy threshold."
by = ["test:infrastructure/tests/test_stack_graph.py::test_the_api_target_groups_check_health_on_slash_health"]

[[unit]]
text = "Tasks that fail health checks are automatically replaced by ECS."
by = ["exempt:third-party"]

[[unit]]
text = "If uninstall stops at the network"
by = ["exempt:label"]

[[unit]]
text = "If the installer finds a stack in DELETE_FAILED, it stops, names the stack and says what to do."
by = ["untested:T"]

[[unit]]
text = "The network can fail to delete when GuardDuty, with runtime monitoring for Fargate turned on in your account, has put its own interface endpoint and a managed group, whose name starts with GuardDutyManaged, in the network."
by = ["exempt:third-party"]

[[unit]]
text = "The installer did not make them, so it does not delete them."
by = ["untested:T"]

[[unit]]
text = "The message names the endpoint and the group by ID and prints the commands that list and delete them."
by = ["untested:T"]

[[unit]]
text = "Check that they are the only two things it names, delete those two yourself, and run uninstall again."
by = ["exempt:instruction"]

[[unit]]
text = "It continues with the network."
by = ["untested:T"]

[[unit]]
text = "Anything else in the list is not GuardDuty's: do not delete it, and look at what it is first."
by = ["exempt:advice"]

[[unit]]
text = "If something goes wrong"
by = ["exempt:label"]

[[unit]]
text = "The installer's exit code tells you whether anything was made:"
by = ["untested:T"]

[[unit]]
text = "Code | Means | What to do"
by = ["exempt:label"]

[[unit]]
text = "0 | Done. After uninstall, the account holds only what AWS keeps | Nothing"
by = ["untested:T"]

[[unit]]
text = "1 | Failed after something was made. The message lists what exists and what it bills | Run uninstall, then install again. If uninstall fails, its message ends \"run uninstall again; it continues\""
by = ["untested:T"]

[[unit]]
text = "2 | Refused, and nothing was changed. A declined confirmation is 2 as well | Read the message, fix the cause and run the command again. It is safe to repeat"
by = ["untested:T"]

[[unit]]
text = "130 | You pressed Ctrl-C, or the installer was stopped. AWS carries on with the stacks it started | Run uninstall"
by = ["untested:T"]

[[unit]]
text = "The installer uses no other exit code."
by = ["untested:T"]

[[unit]]
text = "Every message has three parts: what happened, what exists in your account and what it bills, and the next step."
by = ["untested:T"]

[[unit]]
text = "The first word names the code: REFUSED for 2, FAILED for 1 and STOPPED for 130."
by = ["untested:T"]

[[unit]]
text = "Install never continues."
by = ["untested:T"]

[[unit]]
text = "If an install stops after it made something, it does not pick up where it stopped."
by = ["untested:T"]

[[unit]]
text = "Run uninstall, then install again."
by = ["exempt:instruction"]

[[unit]]
text = "An install on a computer that holds the record of a started install refuses with exit code 2, reads your account and changes nothing, until you have run uninstall."
by = ["untested:T"]

[[unit]]
text = "Uninstall continues."
by = ["untested:T"]

[[unit]]
text = "Uninstall can be run again from any half-built state."
by = ["untested:T"]

[[unit]]
text = "It deletes what is left of the install and nothing else."
by = ["untested:T"]

[[unit]]
text = "A sign-in that stops working."
by = ["exempt:label"]

[[unit]]
text = "The installer checks your sign-in again before it creates the nine stacks and before it deletes them."
by = ["untested:T"]

[[unit]]
text = "If it has stopped working, the installer stops with exit code 1 and says so."
by = ["untested:T"]

[[unit]]
text = "Sign in again, then run uninstall after an install, or run uninstall again after an uninstall."
by = ["exempt:instruction"]

[[unit]]
text = "A lost record."
by = ["exempt:label"]

[[unit]]
text = "Uninstall needs the record folder."
by = ["untested:T"]

[[unit]]
text = "On a computer without it, uninstall refuses and deletes nothing, and points you at the computer that made the install or at Destroying an environment to remove the stacks by hand."
by = ["untested:T"]

[[unit]]
text = "Removing what is left covers the rest."
by = ["exempt:navigation"]

[[unit]]
text = "What the beta does not do"
by = ["exempt:label"]

[[unit]]
text = "It installs in us-west-2 only, and only the core profile."
by = ["untested:T"]

[[unit]]
text = "It needs a public Route 53 zone in the same account."
by = ["untested:T"]

[[unit]]
text = "It does not handle a zone in another account, other DNS providers, or the top of a zone."
by = ["untested:T"]

[[unit]]
text = "It does not continue an install that failed, and it does not upgrade one."
by = ["untested:T"]

[[unit]]
text = "Use the Quick Start for those."
by = ["exempt:navigation"]

[[unit]]
text = "It does not estimate the cost before you start, beyond the figures in the plan, and it sets no budget alert."
by = ["untested:T"]

[[unit]]
text = "What has been tested"
by = ["exempt:label"]

[[unit]]
text = "CI runs every step and every refusal of the installer against a fake AWS CLI, on Linux and on macOS."
by = ["untested:T"]

[[unit]]
text = "The same CI run checks that the fake prints what the real AWS CLI prints."
by = ["test:backend/tests/unit/infrastructure/test_installer_cli_check.py::test_the_check_runs_in_the_cdk_job_with_no_credential"]

[[unit]]
text = "The one real run:"
by = ["exempt:label"]

[[unit]]
text = "As of v0.37.0, the installer has run end to end once: on <RUN: date>, on a new AWS account in us-west-2, from a Mac, with release v0.36.2 and the installer from commit <RUN: run head>."
by = ["exempt:intent"]

[[unit]]
text = "As of v0.37.0, install took <RUN: install minutes> minutes in that run, and the first administrator signed in with the password it printed."
by = ["exempt:intent"]

[[unit]]
text = "As of v0.37.0, uninstall took <RUN: uninstall minutes> minutes in that run, and a comparison of the account with its state before the install found only what AWS keeps."
by = ["exempt:intent"]

[[unit]]
text = "As of v0.37.0, that run also stopped an install with Ctrl-C while the images were copied, ran uninstall, and <RUN: part-way result>."
by = ["exempt:intent"]

[[unit]]
text = "As of v0.37.0, the files under deploy/aws-installer/ are the ones that ran."
by = ["exempt:intent"]

[[unit]]
text = "As of v0.37.0, the installer has not been run on AWS in another region, with a zone in another account, through an uninstall that stops at the network, through a sign-in that ends in the middle of a run, or on a computer running Linux."
by = ["exempt:intent"]

text = "Route 53 refuses to delete a zone that still holds records other than its own NS and SOA records."
by = ["exempt:third-party"]

[[unit]]
text = "First, in the account you installed into, read the zone's four name servers:"
by = ["exempt:instruction"]

[[unit]]
text = "If the domain you own is in a Route 53 hosted zone, sign in to the account that holds it, and set AWS_PROFILE to a profile for that account."
by = ["exempt:instruction"]


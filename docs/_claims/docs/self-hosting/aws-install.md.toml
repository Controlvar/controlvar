[[unit]]
text = "Open Admin > Users > Invite User, and choose the role Admin (superuser)."
by = ["exempt:instruction"]

[[unit]]
text = "Confirm the alarm email, below."
by = ["exempt:navigation"]

[[unit]]
text = "If the address does not open at once, wait up to 15 minutes."
by = ["exempt:advice"]

[[unit]]
text = "Your computer may hold an earlier answer that the name does not exist."
by = ["exempt:third-party"]

[[unit]]
text = "Confirm the alarm email"
by = ["exempt:label"]

[[unit]]
text = "The alarms do nothing until you confirm the subscription."
by = ["exempt:third-party"]

[[unit]]
text = "SNS emails a confirmation link to your alarm address."
by = ["exempt:third-party"]

[[unit]]
text = "Until it is confirmed, the alarms fire and nobody is told, and the link does not last for ever, so confirm it the same day."
by = ["exempt:advice"]

[[unit]]
text = "The installer says this in its summary too."
by = ["untested:T"]

[[unit]]
text = "Do not just click the link: a subscription confirmed that way can be cancelled by the unsubscribe link in any alarm email, by anyone the email reaches."
by = ["exempt:third-party"]

[[unit]]
text = "Instead, copy the Token= value out of the link and confirm it with --authenticate-on-unsubscribe true, after which unsubscribing takes an authenticated AWS call:"
by = ["exempt:instruction"]

[[unit]]
text = "The last command must show the email subscription with a real ARN, not PendingConfirmation."
by = ["exempt:instruction"]

[[unit]]
text = "Uninstall"
by = ["exempt:label"]

[[unit]]
text = "Uninstall deletes the install and everything in it, its data included."
by = ["untested:T"]

[[unit]]
text = "It keeps no backup."
by = ["untested:T"]

[[unit]]
text = "It deletes only what install made: your zone, its other records and everything else in the account are left alone."
by = ["untested:T"]

[[unit]]
text = "Sign in again, then run it from the computer that ran install, in the clone you installed from:"
by = ["exempt:instruction"]

[[unit]]
text = "--plan-only works here too: it makes the checks, prints the plan and deletes nothing."
by = ["untested:T"]

[[unit]]
text = "The plan says \"Deletes the install in account 123456789012, us-west-2, at https://app.example.com\", then lists what it deletes, with its data and with no backup kept."
by = ["untested:T"]

[[unit]]
text = "It lists what it keeps, such as the zone and, when it was there before the install, the CDK's setup stack."
by = ["untested:T"]

[[unit]]
text = "It says how long the deletion takes, and asks you to type the account ID."
by = ["untested:T"]

[[unit]]
text = "Uninstall then runs six steps:"
by = ["untested:T"]

[[unit]]
text = "It deletes the record that points your name at the load balancer."
by = ["untested:T"]

[[unit]]
text = "It deletes the nine stacks."
by = ["untested:T"]

[[unit]]
text = "Billing falls to zero as the stacks go."
by = ["untested:T"]

[[unit]]
text = "It deletes the certificate and its validation record."
by = ["untested:T"]

[[unit]]
text = "It deletes the secrets, the image repositories, the log groups and the task definitions that the install made."
by = ["untested:T"]

[[unit]]
text = "It deletes the CDK's setup stack and its bucket, when the install made them."
by = ["untested:T"]

[[unit]]
text = "It compares your account with the record made before the install."
by = ["untested:T"]

[[unit]]
text = "At the end it prints what the account holds now that it did not hold before."
by = ["untested:T"]

[[unit]]
text = "These are the things AWS keeps, and nothing else, when the report says Not explained: none; the counts and dates here are examples:"
by = ["untested:T"]

[[unit]]
text = "What cdk destroy leaves behind and bills says what each of these is."
by = ["exempt:navigation"]

[[unit]]
text = "If the report names anything under Not explained, the installer has left it alone, because someone else may have made it."
by = ["untested:T"]

[[unit]]
text = "Look at it before you delete it."
by = ["exempt:advice"]

[[unit]]
text = "Remove the zone"
by = ["exempt:label"]

[[unit]]
text = "The installer never deletes your zone."
by = ["untested:T"]

[[unit]]
text = "If you made a zone only for this install, delete it after uninstall: first the delegation record in the domain you own, then the zone."

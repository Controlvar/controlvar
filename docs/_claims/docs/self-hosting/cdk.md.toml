[[unit]]
text = "Run the first Deploy soon after the first cdk deploy."
by = ["exempt:baseline"]

[[unit]]
text = "Requests that reach the API in between, from scanners as much as from people, can put one of the API's 5xx alarms into ALARM, and Deploy refuses to start while one is."
by = ["untested:T"]

[[unit]]
text = "The way through is Deploy's existing break-glass (rollback runbook, \"Fix forward while an alarm is firing\"); whether to use it is decided by a person at that moment."
by = ["untested:T"]

[[unit]]
text = "Rolling the API back runs the older release against the newer schema, which works only for backward-compatible migrations; for one that is not, undo the migration while the release that contains it is still serving, before rolling the API back (rollback runbook, Database Rollback Procedure)."
by = ["untested:T"]

[[unit]]
text = "After the API has been rolled back, the emergency route is a point-in-time restore with scripts/restore_repoint.sh (Disaster Recovery, Scenario 4)."

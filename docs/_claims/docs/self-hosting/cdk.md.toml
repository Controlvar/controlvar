by = ["exempt:baseline"]

[[unit]]
text = "The buckets outside prod are emptied before they are deleted: auto_delete_objects=True adds a custom resource backed by a CDK-provided Lambda (Custom::S3AutoDeleteObjectsCustomResourceProvider, with its own IAM role) that, when the stack is deleted, denies new writes to the bucket and deletes every object version and delete marker."
by = ["untested:T"]

[[unit]]
text = "It acts only on a bucket carrying the aws-cdk:auto-delete-objects tag, which is to say a bucket deployed with this version or later."
by = ["exempt:baseline"]


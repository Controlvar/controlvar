by = ["untested:T"]

[[unit]]
text = "KMS key (the alias is deleted) | RETAIN; the final snapshot is encrypted with it | prod | per key per month | aws kms schedule-key-deletion -- only after the snapshot is gone"
by = ["untested:T"]

[[unit]]
text = "Cognito user pool experimentation-platform-users-prod | RETAIN | prod | per monthly active user | aws cognito-idp delete-user-pool"
by = ["untested:T"]

[[unit]]
text = "DynamoDB tables experimentation-{events,feature-flags,overrides}-prod, experiment-counters-prod | RETAIN | prod | capacity (the core tables are provisioned in prod) and storage | aws dynamodb delete-table"
by = ["untested:T"]

[[unit]]
text = "DynamoDB tables experimentation-{assignments,experiments}-prod, from a production deployment made before the stack stopped creating them (#605). Nothing reads them. They are not left by cdk destroy but by the first cdk deploy of experimentation-dynamodb-prod after the upgrade, which removes them from the stack (and their auto-scaling) and keeps the tables | RETAIN | prod | provisioned capacity and storage | aws dynamodb create-backup if you want a copy, then aws dynamodb delete-table"
by = ["untested:T"]

[[unit]]
text = "Log groups /ecs/experimentation-{backend,dashboard,migrate}-prod | RETAIN | prod | log storage | aws logs delete-log-group"
by = ["untested:T"]

[[unit]]
text = "Data-lake, Athena-results and Glue-scripts buckets | RETAIN | prod (full) | storage, every object version | empty (all versions), then aws s3 rb"
by = ["untested:T"]

[[unit]]
text = "Kinesis stream and OpenSearch domain | RETAIN | prod (full) | per shard-hour; per instance-hour | aws kinesis delete-stream; aws opensearch delete-domain"
by = ["untested:T"]

[[unit]]
text = "pre-migration- and pre-deploy- Aurora cluster snapshots | taken by the deploy and migrate workflows, not by CloudFormation | every environment they ran against | snapshot storage | aws rds delete-db-cluster-snapshot. Outside prod the KMS key they are encrypted with is deleted with the stack, so they cannot be restored afterwards"
by = ["untested:T"]

[[unit]]
text = "The alias A records for app.<domain> (and api.<domain>) | created by hand after the first deploy (Point the hostname at the load balancer) | every environment | nothing for the records; the hosted zone is billed per month | the same change-resource-record-sets with \"Action\": \"DELETE\", or delete the hosted zone"
by = ["untested:T"]

[[unit]]
text = "The secrets under /<env>/experimentation/ | created by hand before the first deploy (Secrets Management) | every environment | per secret per month | aws secretsmanager delete-secret"
by = ["untested:T"]

[[unit]]
text = "ECR repositories experimentation-platform/backend and experimentation-platform/web, and their images | created by hand once per account (Deployment Guide) | shared by all environments | image storage | aws ecr delete-repository --force, once no environment needs them"
by = ["exempt:instruction"]

[[unit]]
text = "The CDK bootstrap stack CDKToolkit: its cdk--assets-<account>-<region> bucket and cdk--container-assets- repository | cdk bootstrap, once per account and region | shared by all environments | storage | aws cloudformation delete-stack --stack-name CDKToolkit, after emptying the bucket"
by = ["exempt:third-party"]

[[unit]]

[[unit]]
text = "AWS CDK Deployment"
by = ["exempt:label"]

[[unit]]
text = "To have a script run this page's steps for you, see Install on AWS with one command (beta)."
by = ["exempt:navigation"]

[[unit]]
text = "The platform's AWS infrastructure is defined as code using AWS CDK v2, in Python: the app is infrastructure/cdk/app.py, and infrastructure/cdk/cdk.json runs it with python3 app.py."
by = ["test:infrastructure/tests/test_synth_inputs.py::test_the_cdk_app_is_python_run_by_python3_app_py_on_cdk_v2"]

[[unit]]
text = "cdk deploy --all provisions the API, the dashboard and the data stores they need in your AWS account."
by = ["test:infrastructure/tests/test_app_profiles.py::TestTheAppActuallySynthesises::test_synth_completes"]

[[unit]]
text = "The Fargate stack runs two services behind one Application Load Balancer: the API, and the dashboard as its own ECS service (experimentation-dashboard-<env>)."
by = ["test:infrastructure/tests/test_dashboard_service.py::test_the_app_has_exactly_two_ecs_services"]

[[unit]]
text = "The HTTPS listener sends /api/, /health, /health/ and /metrics to the API and everything else to the dashboard."
by = [
    "test:infrastructure/tests/test_dashboard_service.py::test_the_api_paths_go_to_the_live_target_group_exactly",
    "test:infrastructure/tests/test_dashboard_service.py::test_the_https_default_action_is_the_dashboard",
]

[[unit]]
text = "cdk deploy starts the dashboard on the experimentation-platform/web:bootstrap image, which you push before the first deploy (deployment guide §1.3)."
by = ["test:infrastructure/tests/test_dashboard_service.py::test_the_dashboard_container_never_proxies_the_api"]

[[unit]]
text = "After that, the Deploy workflow rolls each release onto the dashboard: it registers a dashboard task definition with the release's image, rolls the dashboard service once the API is serving the same release, and smoke-tests it through the public URL."
by = [
    "test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_r1_through_the_step_the_dashboard_rolls_out_when_the_api_is_serving",
    "test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_a_whole_successful_tail_is_green_and_says_so",
]


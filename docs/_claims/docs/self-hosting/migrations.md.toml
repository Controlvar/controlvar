[[unit]]
text = "Database Migrations"
by = ["exempt:baseline"]

[[unit]]
text = "The platform uses Alembic for PostgreSQL schema management."
by = [
    "test:backend/tests/unit/db/test_alembic_commands.py::test_alembic_manages_the_postgresql_schema",
    "test:backend/tests/unit/db/test_alembic_commands.py::test_alembic_and_the_bootstrap_connect_with_the_postgres_settings",
]

[[unit]]
text = "Each migration is a versioned script, with an upgrade() and a downgrade() function."
by = [
    "test:backend/tests/unit/db/test_alembic_commands.py::test_every_migration_has_an_upgrade_and_a_downgrade",
    "test:backend/tests/unit/db/test_alembic_commands.py::test_migration_files_live_in_the_core_versions_directory_one_revision_each",
]

[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "Two branches, two heads."
by = ["test:backend/tests/integration/database/test_profile_migrations.py::test_fresh_full_bootstrap_records_every_head"]

[[unit]]
text = "A full-profile checkout also has modules/backend/app/db/migrations/versions/, a separate branch labelled modules for the schema the optional modules own."
by = ["test:backend/tests/integration/database/test_profile_migrations.py::test_fresh_full_bootstrap_records_every_head"]

[[unit]]
text = "A core checkout has no modules/ directory and therefore one head; a full checkout has two, and alembic_version holds one row per head."
by = ["exempt:baseline"]

[[unit]]
text = "That is why every command below says heads (plural) and never head: alembic refuses the singular when more than one head exists."
by = ["exempt:baseline"]

[[unit]]
text = "Where the commands run."
by = ["test:backend/tests/unit/infrastructure/test_migration_task_command.py::test_migration_command_config_exists_in_the_image_layout"]

[[unit]]
text = "Every alembic and bootstrap command on this page runs inside the API container, with the image's own alembic and the container's POSTGRES_ settings: docker compose exec api ..., from the directory of your compose file (the repository root for the Quick Start stack, deploy/compose/ for the production compose file)."
by = [
    "mechanism:migration-page-alembic-in-the-api",
    "test:backend/tests/unit/infrastructure/test_migration_task_command.py::test_migration_command_config_exists_in_the_image_layout",
]

[[unit]]
text = "The image keeps the repository's layout under its working directory /app, so -c backend/app/db/alembic.ini is the same path there as in a checkout."
by = ["exempt:baseline"]

[[unit]]
text = "Under Helm, run the same command in an API pod with kubectl exec."
by = ["test:backend/tests/unit/infrastructure/test_upgrade_on_start.py::test_an_api_pod_runs_the_commands_the_compose_api_container_runs"]

[[unit]]
text = "On AWS, see Running Migrations in Production."
by = ["exempt:baseline"]

[[unit]]
text = "Running alembic from a checkout instead is a contributor's task: Database Migrations with Alembic."
by = ["exempt:baseline"]

[[unit]]
text = "Running All Migrations"
by = ["exempt:baseline"]

[[unit]]
text = "The API container runs the bootstrap (below) every time it starts, so a stack that is up is already at its heads."
by = [
    "test:backend/tests/unit/scripts/test_entrypoint_seed_force_and_workers.py::test_by_default_the_bootstrap_runs_on_every_start_before_the_api_serves",
    "test:backend/tests/unit/infrastructure/test_compose_database_settings.py::test_compose_runs_one_api_container_and_keeps_run_migrations_true",
]

[[unit]]
text = "To apply all pending migrations by hand:"
by = ["exempt:baseline"]

[[unit]]
text = "heads refers to the latest migration of every branch."
by = ["mechanism:alembic-plan-full"]

[[unit]]
text = "This command applies all unapplied migrations in order."
by = [
    "mechanism:alembic-plan-full",
    "mechanism:alembic-plan-core",
]

[[unit]]
text = "Alembic logs what it applies (to stderr); on a database already at its heads it applies nothing."
by = ["exempt:baseline"]

[[unit]]
text = "On a database with no tables at all, run the bootstrap instead — the historical migration chain cannot be replayed from zero, so a fresh schema is created from the models and stamped."
by = [
    "test:backend/tests/integration/database/test_profile_transitions.py::test_a_fresh_full_bootstrap",
    "test:backend/tests/unit/infrastructure/test_migration_task_command.py::test_the_migration_task_bootstraps_rather_than_replaying_the_chain",
]

[[unit]]
text = "On a database that has tables it runs upgrade heads:"
by = ["exempt:baseline"]

[[unit]]
text = "It ends with Database bootstrap complete (created) on a new database and Database bootstrap complete (upgraded) on one that had tables."
by = ["docex:docs/self-hosting/migrations.md#Database bootstrap complete"]

[[unit]]
text = "The bootstrap reads ENVIRONMENT from the container, which compose sets (development unless ENVIRONMENT was set when the stack was started); for another value, pass it to that one command: docker compose exec -e ENVIRONMENT=production api python -m backend.app.db.bootstrap."
by = [
    "test:backend/tests/unit/infrastructure/test_compose_database_settings.py::test_compose_sets_environment_to_development_unless_it_was_set",
    "test:backend/tests/unit/core/test_environment_explicit.py::test_a_weak_first_superuser_password_is_refused_when_the_environment_defaulted",
    "test:backend/tests/unit/core/test_environment_explicit.py::test_a_weak_password_is_accepted_when_development_or_test_was_chosen",
]

[[unit]]
text = "ENVIRONMENT is the environment the database belongs to (production, staging, or development for a local trial)."
by = ["exempt:baseline"]

[[unit]]
text = "On a database with no users the bootstrap creates the first administrator from FIRST_SUPERUSER and FIRST_SUPERUSER_PASSWORD, and it refuses a password that is empty, shorter than 8 characters or a well-known default unless ENVIRONMENT is development or test."
by = [
    "test:backend/tests/unit/core/test_environment_explicit.py::test_a_weak_first_superuser_password_is_refused_when_the_environment_defaulted",
    "test:backend/tests/unit/core/test_environment_explicit.py::test_a_weak_password_is_accepted_when_development_or_test_was_chosen",
]

[[unit]]
text = "In every environment it also refuses a password longer than 72 bytes when encoded as UTF-8 (a character outside ASCII takes two to four bytes)."
by = ["test:backend/tests/unit/db/test_first_superuser_password_length.py::test_the_bootstrap_refuses_a_long_password_in_every_environment"]

[[unit]]
text = "Once the database has users the setting is not read."
by = ["test:backend/tests/integration/database/test_bootstrap_concurrency.py::test_a_long_password_setting_does_not_stop_a_database_that_has_users"]

[[unit]]
text = "The bootstrap is also what the API container runs on start-up when RUN_MIGRATIONS=true, the image's default, and it is what makes a profile switch work; see \"Switching profile\" below."
by = [
    "test:backend/tests/unit/scripts/test_entrypoint_seed_force_and_workers.py::test_by_default_the_bootstrap_runs_on_every_start_before_the_api_serves",
    "test:backend/tests/integration/database/test_profile_transitions.py::test_a_core_database_switched_to_full_by_the_documented_command",
]

[[unit]]
text = "The AWS (CDK) deployment sets RUN_MIGRATIONS=false on its API tasks: there, the Deploy workflow's migration task is the only thing that runs the bootstrap (see On AWS, the API does not migrate)."
by = [
    "test:infrastructure/tests/test_api_task_does_not_migrate.py::test_the_api_task_does_not_run_migrations",
    "test:backend/tests/unit/infrastructure/test_migration_task_command.py::test_the_deploy_bootstraps_too",
]


by = ["docex:docs/self-hosting/releases.md#\"version\": \""]

[[unit]]
text = "A running deployment reports the same two things, which is the quickest check that it is running what you think:"
by = ["docex:docs/self-hosting/releases.md#\"profile\":\"core\""]

[[unit]]
text = "It prints {\"profile\":\"core\",\"modules\":[],\"version\":…} on the core profile; the full profile lists its modules."

[[unit]]
text = "1. Before the first deploy"
by = ["exempt:label"]

[[unit]]
text = "Do these in this order, once per environment."
by = ["exempt:instruction"]

[[unit]]
text = "Each step says who does it, how to check it read-only, and where to stop."
by = ["exempt:instruction"]

[[unit]]
text = "Several are irreversible or billable, and each of those needs a person to say yes at the moment it happens."
by = ["exempt:advice"]

[[unit]]
text = "1.0 Decisions (founder)"
by = ["exempt:label"]

[[unit]]
text = "Which AWS account (one per environment), which region (one: us-west-2 unless you change all three workflows), which profile (full or core), the domain (app.<domain>), a budget alarm and who owns the bill, and when a staging environment is torn down."
by = ["exempt:instruction"]

[[unit]]
text = "Nothing below should start without them."
by = ["exempt:instruction"]

[[unit]]
text = "1.1 IAM (account administrator)"
by = ["exempt:label"]

[[unit]]
text = "Three identities, described with their exact permissions in IAM Permissions: the bootstrap identity (once), the cdk deploy identity, and one workflow role per environment."
by = ["exempt:navigation"]

[[unit]]
text = "The workflow role's trust policy pins the OIDC subject exactly."
by = ["test:backend/tests/unit/infrastructure/test_deploy_inputs_and_images.py::test_the_workflow_roles_trust_policy_pins_the_oidc_subject_exactly"]

[[unit]]
text = "Decode a real token's sub first (a throwaway job bound to the staging environment printing only the payload's sub), and write the trust policy from what it printed, not from memory."
by = ["test:backend/tests/unit/infrastructure/test_oidc_sub_probe.py::test_the_probe_prints_exactly_sub_aud_and_environment"]

[[unit]]
text = "Check: aws iam simulate-principal-policy for each identity (the IAM page gives the command)."
by = ["exempt:instruction"]

[[unit]]
text = "Stop here if any action is denied."
by = ["exempt:instruction"]

[[unit]]
text = "1.2 Certificate and domain"
by = ["exempt:label"]

[[unit]]
text = "An ACM certificate in the region the stacks deploy to (us-west-2), covering app.<domain>, with status ISSUED, before any cdk deploy."
by = ["exempt:instruction"]

[[unit]]
text = "PUBLIC_BASE_URL=https://app.<domain>."
by = ["exempt:example"]

[[unit]]
text = "It must print \"ISSUED\"."
by = ["exempt:instruction"]

[[unit]]
text = "If it prints anything else, stop here."
by = ["exempt:instruction"]


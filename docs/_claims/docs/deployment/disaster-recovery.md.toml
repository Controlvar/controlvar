[[unit]]
text = "Disaster Recovery Plan — Controlvar"
by = ["exempt:label"]

[[unit]]
text = "This page describes what the AWS CDK app in infrastructure/cdk actually creates, and how to recover each part of it."
by = ["exempt:label"]

[[unit]]
text = "Where the CDK does not create something a recovery would need (a second region, replicated secrets), the page says so."
by = ["exempt:label"]

[[unit]]
text = "The commands use ENV for the environment (prod, staging, dev)."
by = ["exempt:instruction"]

[[unit]]
text = "Most names follow from it: the ECS cluster is experimentation-$ENV, the API service is experimentation-backend-$ENV, the dashboard service is experimentation-dashboard-$ENV, and the Redis replication group is experimentation-redis-$ENV-redis."
by = ["test:infrastructure/tests/test_operator_facing_stacks.py::test_each_name_an_operator_types_is_one_resource_of_its_type"]

[[unit]]
text = "The Aurora cluster's identifier is generated by CloudFormation, so read it from the database stack:"
by = ["test:infrastructure/tests/test_operator_facing_stacks.py::test_the_aurora_cluster_identifier_is_generated_and_published"]

[[unit]]
text = "Recovery Objectives"
by = ["exempt:label"]

[[unit]]
text = "Objective | Target | Mechanism"
by = ["exempt:label"]

[[unit]]
text = "RPO (Recovery Point Objective) | 5 minutes | Aurora point-in-time recovery (PITR), within the backup retention period"
by = ["exempt:third-party"]

[[unit]]
text = "Aurora backs up continuously."
by = ["exempt:third-party"]

[[unit]]
text = "You can restore to any second between the start of the backup retention period and the cluster's LatestRestorableTime, which AWS documents as typically within 5 minutes of the present."
by = ["exempt:third-party"]

[[unit]]
text = "The retention period is the limit: see the table below."
by = ["exempt:navigation"]

[[unit]]
text = "If Redis fails, no data is lost: it holds only cache and rate-limit state."
by = [
    "test:backend/tests/unit/core/test_operator_facing_runtime.py::test_only_cache_rate_limit_and_health_code_talks_to_redis",

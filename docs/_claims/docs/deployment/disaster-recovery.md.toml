[[unit]]
text = "Backup Strategy"
by = ["exempt:label"]

[[unit]]
text = "Data | What protects it | Retention | How it is recovered"
by = ["exempt:label"]

[[unit]]
text = "PostgreSQL (Aurora) | Continuous backup (PITR) and a daily automated snapshot. The CDK sets a backup retention of 35 days in prod and staging, and 1 day in every other environment. deploy.yml also takes a manual cluster snapshot before every deploy's migration (pre-deploy-<env>-<tag>-<time>), and deleting the prod stack leaves a final snapshot. | prod and staging 35 days, others 1 (automated); manual snapshots until you delete them | PITR or snapshot restore to a new cluster (Scenario 4)"
by = [
    "test:infrastructure/tests/test_operator_facing_stacks.py::test_aurora_keeps_35_days_in_prod_and_staging_and_1_elsewhere",
    "test:backend/tests/unit/infrastructure/test_deploy_alarm_gate_contract.py::test_the_pre_deploy_snapshot_is_named_for_the_environment_the_tag_and_the_time",
    "test:backend/tests/unit/infrastructure/test_deploy_alarm_gate_contract.py::test_the_snapshot_and_the_migration_come_before_the_deployment_and_nothing_undoes_them",
]

[[unit]]
text = "Redis (ElastiCache) | A daily snapshot, 02:00–03:00 UTC. There is no append-only file. In prod, three nodes with automatic failover; in staging and dev, one node. | prod 7 days, staging 3, dev 1 | Automatic failover (prod), or let it refill: it is a cache"
by = ["test:infrastructure/tests/test_operator_facing_stacks.py::test_redis_snapshots_daily_at_two_utc_and_runs_these_nodes"]

[[unit]]
text = "Dashboard | Holds no data. It is the frontend/Dockerfile image, run as the ECS service experimentation-dashboard-$ENV behind the API's load balancer. The CDK creates no S3 bucket or CloudFront distribution for it. | Images in ECR (experimentation-platform/web) and, for releases, GHCR | Redeploy the image (Rollback Runbook, \"The dashboard is the opposite case\")"
by = [
    "test:backend/tests/unit/infrastructure/test_deploy_profile.py::TestTheProfileIsAnExplicitInput::test_the_workflow_builds_exactly_the_two_images_the_cdk_imports",
    "test:infrastructure/tests/test_dashboard_service.py::test_the_https_default_action_is_the_dashboard",
    "test:infrastructure/tests/test_api_task_and_data_resources.py::test_no_cloudfront_distribution_and_no_bucket_for_the_dashboard",
    "test:infrastructure/tests/test_operator_facing_stacks.py::test_each_name_an_operator_types_is_one_resource_of_its_type",
    "test:backend/tests/unit/infrastructure/test_deploy_inputs_and_images.py::test_the_release_pushes_the_api_and_dashboard_images_to_ghcr",
]

[[unit]]
text = "API | Holds no data. Its image is in ECR (experimentation-platform/backend) and, for releases, GHCR. | As above | Redeploy through CodeDeploy (Rollback Runbook)"
by = [
    "test:backend/tests/unit/infrastructure/test_deploy_profile.py::TestTheProfileIsAnExplicitInput::test_the_workflow_builds_exactly_the_two_images_the_cdk_imports",
    "test:infrastructure/tests/test_pipeline_owns_the_image.py::test_the_api_runs_from_experimentation_platform_backend_which_no_stack_creates",
    "test:backend/tests/unit/infrastructure/test_deploy_inputs_and_images.py::test_the_release_pushes_the_api_and_dashboard_images_to_ghcr",
]

[[unit]]
text = "ECS task definitions | Registered revisions, one per deployment | Until deregistered | Name the revision in a CodeDeploy deployment"
by = ["test:backend/tests/unit/infrastructure/test_deploy_workflows.py::test_every_task_definition_registered_names_the_digest"]

[[unit]]
text = "Secrets Manager | The database credentials secret (experimentation-database-$ENV-aurora-credentials), in the stack's region only. The CDK configures no replica regions. | Until deleted | Within its recovery window after deletion, aws secretsmanager restore-secret. There is no copy in another region"
by = ["test:infrastructure/tests/test_operator_facing_stacks.py::test_the_database_login_is_one_generated_secret_in_this_region_only"]

[[unit]]
text = "Application logs | CloudWatch Logs only, with no export to S3. /ecs/experimentation-backend-$ENV and /ecs/experimentation-dashboard-$ENV are kept 90 days, and /ecs/experimentation-migrate-$ENV 30 days. | As listed | Not recoverable after expiry"
by = ["test:infrastructure/tests/test_operator_facing_stacks.py::test_the_ecs_logs_are_kept_90_and_30_days_and_nowhere_else"]

[[unit]]
text = "S3 (full profile only) | The analytics data lake bucket (versioned), and the Glue ETL stack's Athena results bucket (objects expire after 30 days) and Glue scripts bucket. None has cross-region replication. The core profile creates no bucket. | Kept when the prod stack is deleted; deleted with it elsewhere | Versioning restores an overwritten or deleted object in the data lake; nothing else"
by = ["test:infrastructure/tests/test_operator_facing_stacks.py::test_the_full_profiles_three_buckets"]


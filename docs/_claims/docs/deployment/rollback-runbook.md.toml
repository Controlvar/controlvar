text = "Method 2: AWS CLI Direct Rollback (Emergency)"
by = ["exempt:label"]

[[unit]]
text = "Use this method when GitHub Actions is unavailable or you need to act faster than the workflow allows."
by = ["exempt:baseline"]

[[unit]]
text = "This method is faster but does not automatically run smoke tests — you must run them manually after."
by = ["exempt:baseline"]

[[unit]]
text = "Step 1."
by = ["exempt:baseline"]
count = 2

[[unit]]
text = "Set the target task definition ARN (the last known-good revision):"
by = ["exempt:baseline"]

[[unit]]
text = "Step 2."
by = ["exempt:baseline"]
count = 2

[[unit]]
text = "Get the running task definition, if you need it."
by = ["exempt:baseline"]

[[unit]]
text = "Use the PRIMARY task set, not services[0].taskDefinition -- see the note in Method 1 Step 1: on a CodeDeploy-controlled service that field never moves off the revision CloudFormation created."
by = ["exempt:baseline"]

[[unit]]
text = "Do NOT decrement the revision number to find the target."
by = ["exempt:baseline"]


# `python scripts/doc_claims.py check`.
document = "docs/deployment/rollback-runbook.md"

[[unit]]
text = "Rollback Runbook — Experimently"
by = ["exempt:baseline"]

[[unit]]
text = "Audience: On-call Engineers Measured: on 2026-10-11 (UTC), on a staging account, the Rollback job took 5 min 56 s once approved: the API was verified on the previous revision after 3 min 27 s, and the dashboard 2 min 27 s later (run)."
by = ["evidence:https://github.com/getexperimently/experimently/actions/runs/38098724258"]

[[unit]]
text = "Every command below is written for either environment."
by = ["exempt:baseline"]

[[unit]]
text = "Set this first, in the shell you will paste into."
by = ["exempt:baseline"]

[[unit]]
text = "The line names prod; to rehearse, or to roll back staging, change it to export ENV=staging:"
by = ["exempt:baseline"]

[[unit]]
text = "Rehearse it."
by = ["exempt:baseline"]

[[unit]]
text = "Before prod is ever relied on, do it in staging: two gated deploys of two tags, then roll back to the first (deployment guide, section 2)."
by = ["exempt:baseline"]

[[unit]]
text = "Decision Tree: When to Rollback"
by = ["exempt:baseline"]

[[unit]]
text = "Use this tree to decide your response within the first 2 minutes of an issue."
by = ["exempt:baseline"]

[[unit]]
text = "When in doubt, roll back."
by = ["exempt:baseline"]

[[unit]]
text = "Rollback triggers — no deliberation required:"
by = ["exempt:baseline"]

[[unit]]
text = "While a deploy's CodeDeploy deployment is active (its canary, and the hour after its traffic shift), the deployment group's two 5xx alarms act on the 5xx row by themselves: at least 5 target 5xx and at least 5% of a target group's requests in a minute, for 2 minutes of 3, and CodeDeploy rolls the API back."
by = [
    "test:infrastructure/tests/test_codedeploy_alarms.py::test_each_alarm_is_exactly_the_specified_one",
    "test:infrastructure/tests/test_codedeploy_alarms.py::test_the_group_stops_and_rolls_back_on_an_alarm",
]

[[unit]]
text = "The rest of the table, and everything after that hour, is yours."
by = ["exempt:baseline"]

[[unit]]
text = "Condition | Threshold | Action"
by = ["exempt:baseline"]

[[unit]]
text = "Health check failure | /health returning non-200 | Immediate rollback"
by = ["exempt:baseline"]

[[unit]]
text = "5xx error rate spike | > 5% of requests over 2 min | Immediate rollback (during a deployment, the alarms do it first)"
by = ["exempt:baseline"]

[[unit]]
text = "p99 API latency | > 5000ms sustained for 2 min | Immediate rollback"
by = ["exempt:baseline"]

[[unit]]
text = "Data corruption | Any confirmed case | Immediate rollback + escalate"
by = ["exempt:baseline"]

[[unit]]
text = "ECS tasks crash-looping | Tasks not stabilizing after 5 min | Immediate rollback"
by = ["exempt:baseline"]

[[unit]]
text = "Method 1: GitHub Actions Manual Rollback (Preferred)"
by = ["exempt:label"]

[[unit]]
text = "This is the preferred method."
by = ["exempt:baseline"]

[[unit]]
text = "It is audited and sends Slack notifications when SLACK_BOT_TOKEN is set."
by = ["test:backend/tests/unit/infrastructure/test_slack_optional.py::test_each_slack_step_is_gated_and_the_result_keeps_always"]

[[unit]]
text = "It does not run smoke tests; Step 5 of Method 2 and the post-rollback checklist are by hand."
by = ["untested:T"]

[[unit]]
text = "The deploy that went wrong printed the target for you: its run summary ends with Rollback: Actions → Rollback → environment=<env>, task_definition_arn=experimentation-backend-<env>:<n>, dashboard_task_definition_arn=experimentation-dashboard-<env>:<m>."
by = ["test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_the_summary_prints_exactly_the_values_rollback_accepts"]

[[unit]]
text = "Use that, and skip Step 1."
by = ["exempt:baseline"]

[[unit]]
text = "It carries both revisions, the API's and the dashboard's, so both go back."
by = ["exempt:baseline"]

[[unit]]
text = "The dashboard part is left out when the dashboard was not on a release before that deploy (the bootstrap image, or a tag a cdk deploy registered): there is then no released dashboard to go back to, and the summary says so."
by = ["test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_a_serving_image_that_is_not_a_release_is_recorded_without_a_rollback_value"]

[[unit]]
text = "The workflow always rolls the API back."
by = ["test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_rollback_validates_both_before_it_stops_anything_and_stops_unconditionally"]

[[unit]]
text = "It has no dashboard-only mode: it first stops any CodeDeploy deployment in flight with auto-rollback, which reverts an API that shifted within the last hour."
by = ["test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_rollback_validates_both_before_it_stops_anything_and_stops_unconditionally"]

[[unit]]
text = "To put back the dashboard alone, use Method 2's dashboard block."
by = ["exempt:baseline"]

[[unit]]
text = "It refuses the API half, fails, and says why, in two cases:"
by = ["exempt:baseline"]

[[unit]]
text = "The API is already on the target and no deployment is in flight: the target is the PRIMARY task set and the /api/ rule forwards to it."
by = ["untested:T"]

[[unit]]
text = "There is nothing to roll back, so it creates no deployment and stops nothing."
by = ["exempt:baseline"]

[[unit]]
text = "If you gave a dashboard revision, the dashboard half still runs, and the run says what it did."
by = ["exempt:baseline"]

[[unit]]
text = "CodeDeploy is already rolling back: an in-flight deployment was created by CodeDeploy itself (creator is codeDeployRollback)."
by = ["untested:T"]

[[unit]]
text = "Stopping it would put back the release it is rolling away from, so the run stops nothing and rolls nothing back, not even the dashboard."
by = ["exempt:baseline"]

[[unit]]
text = "Rollback refuses for as long as that deployment is active, which can be up to an hour."
by = ["exempt:baseline"]

[[unit]]
text = "For the dashboard alone, use Method 2's dashboard block."
by = ["exempt:baseline"]

[[unit]]
text = "The run also stops nothing when it cannot read an in-flight deployment's creator."
by = ["exempt:baseline"]

[[unit]]
text = "It creates its CodeDeploy deployment with the deployment group's alarms overridden (--override-alarm-configuration), always: the release being rolled back is usually what holds a 5xx alarm in ALARM, and CodeDeploy stops every deployment to the group while one is."
by = ["untested:T"]

[[unit]]
text = "The override is for that one deployment; the alarms watch the next deploy as before."
by = ["exempt:third-party"]

[[unit]]
text = "It needs codedeploy:UpdateDeploymentGroup on the workflow role (IAM permissions); a role without it fails the rollback with AccessDenied."
by = ["exempt:baseline"]

[[unit]]
text = "A rollback is reported done only once the run's own deployment has been approved and the target is the PRIMARY task set."
by = ["untested:T"]

[[unit]]
text = "The run approves it itself; an approval from the console also counts, as long as the run saw the deployment waiting for approval first."
by = ["exempt:baseline"]

[[unit]]
text = "A deployment the run never saw waiting for approval is not counted, and the run then fails and says so."
by = ["exempt:baseline"]

[[unit]]
text = "If the API went back and the dashboard did not, the run says so (its verdict is API BACK, DASHBOARD NOT), and the system is in the newer-dashboard, older-API state."
by = ["untested:T"]

[[unit]]
text = "Put the dashboard back with Method 2's dashboard block."
by = ["exempt:baseline"]

[[unit]]
text = "Do not dispatch Rollback again while the rollback's own CodeDeploy deployment is active (about an hour after its shift): its stop step would stop that deployment with auto-rollback and put the API back on the release you rolled back from."
by = ["exempt:baseline"]

[[unit]]
text = "Reading the result"
by = ["exempt:baseline"]

[[unit]]
text = "The run ends with one verdict."
by = ["exempt:baseline"]

[[unit]]
text = "It starts the run's headline, which is also the first line of its Slack message: <environment>: <VERDICT>: <what happened>."
by = ["exempt:baseline"]

[[unit]]
text = "scripts/rollback_verdict.py chooses it from a fixed order of rules, the first that matches winning, and the run succeeds only when the verdict is ROLLED BACK."
by = ["untested:T"]

[[unit]]
text = "When the run's own steps did not finish (its verify step did not succeed), the summary first reads what the API is serving at the end of the run, with scripts/api_serving.py (read-only, the same check the stop step uses), and lists the deployment group's active deployments once; the headline quotes what the read said."
by = ["untested:T"]

[[unit]]
text = "The summary's table also says what the stop step stopped and how its wait ended."
by = ["exempt:baseline"]

[[unit]]
text = "A headline that names a deployment that may still be active ends with \"Do not dispatch Rollback again while deployment <id> is active\": a new Rollback stops any deployment that is not CodeDeploy's own rollback, with auto-rollback, which reverts what it shifted, and it refuses while CodeDeploy's own rollback is active."
by = ["untested:T"]

[[unit]]
text = "Check one with aws deploy get-deployment --deployment-id <id> --query deploymentInfo.status."
by = ["exempt:baseline"]

[[unit]]
text = "Verdict | What it means | What to do"
by = ["exempt:baseline"]

[[unit]]
text = "ROLLED BACK | This run's deployment was approved and verified, and the dashboard was rolled back or not asked for. | Nothing more. The deployment the headline names stays active for about an hour while CodeDeploy keeps the replaced task set."
by = ["untested:T"]

[[unit]]
text = "API BACK, DASHBOARD NOT | The API is on the target (verified, or read at the end of the run), and the dashboard was asked for and was not rolled back, so the API and dashboard are on different releases. | Put the dashboard back with Method 2's dashboard block. Fix what the failed step names before the next deploy or rollback."
by = ["untested:T"]

[[unit]]
text = "API BACK, RUN FAILED | The API is on the target, read at the end of the run, most often because stopping the bad deployment with auto-rollback put it back, and a later step then failed (the step's error says which). | Nothing more for the API. Fix what the failed step names before the next deploy or rollback."
by = ["untested:T"]

[[unit]]
text = "NOT FINISHED | This run stopped a deployment, and its wait for the deployment group to have no active deployment timed out (about 5 minutes) or could not read the group, so it created no rollback deployment. The headline quotes what the API was serving at the end. | Wait until the deployments it names have finished, then read what is serving: python3 scripts/api_serving.py experimentation-$ENV experimentation-backend-$ENV <target> (exit 0 means on the target)."
by = ["untested:T"]

[[unit]]
text = "STILL MOVING | The API is not yet on the target, and a deployment is active or the /api/ rule still splits traffic between blue and green. | Wait, then read it again with the command above. If the rule still splits traffic and no deployment is active, the listener is stuck and needs a person: call the next person in the table at the end of this page, and do not dispatch anything until they have looked."
by = ["untested:T"]

[[unit]]
text = "NOT ROLLED BACK | The API is not on the target, and no deployment is active. The quoted read says why: NOT YET (another revision is PRIMARY) or WRONG (the target is PRIMARY but the /api/ rule forwards elsewhere). | Act on the quoted read. Nothing is active, so a new Rollback is not stopping anything in flight."
by = ["untested:T"]

[[unit]]
text = "OUTCOME UNKNOWN | This run could not tell: the read failed (UNKNOWN, exit 2), the active deployments could not be listed, the summary got a value it does not recognise, or the verdict script did not run. | Before acting, read what is serving with the command above, and list the deployment group's active deployments: aws deploy list-deployments --application-name experimentation-platform-$ENV --deployment-group-name experimentation-$ENV --include-only-statuses Created Queued InProgress Baking Ready --query deployments --output text."
by = ["untested:T"]

[[unit]]
text = "REFUSED | The run refused, and says why: the API was already on the target, CodeDeploy's own rollback is active, or an in-flight deployment could not be classified. | Follow the reason in the line."
by = ["untested:T"]

[[unit]]
text = "NOTHING CHANGED | The run stopped nothing and created no deployment: the target revision was not resolved, or a step failed before anything changed. The API is as it was. | Fix what the failed step names."
by = ["untested:T"]

[[unit]]
text = "The rolled-back API runs against the current schema"
by = ["exempt:baseline"]

[[unit]]
text = "Rolling back puts back an older API; it does not put back the database."
by = ["test:infrastructure/tests/test_api_task_does_not_migrate.py"]

[[unit]]
text = "The API tasks do not run migrations when they start (RUN_MIGRATIONS=false in their task definition), so the older release starts against the schema the newer one migrated and serves it."
by = ["untested:S"]

[[unit]]
text = "That is correct only when every migration since the target release is backward-compatible, which is the rule migrations here follow (Deployment Guide)."
by = ["exempt:baseline"]

[[unit]]
text = "When one is not -- it dropped or renamed something the target release reads -- rolling the API back is not enough, and the order matters: undo the migration while the release that ran it is still serving, then roll the API back (Database Rollback Procedure)."
by = ["exempt:baseline"]

[[unit]]
text = "Check the target's environment before you roll back to it:"
by = ["exempt:baseline"]

[[unit]]
text = "It prints false for a revision that does not migrate on start."
by = ["untested:T"]

[[unit]]
text = "A revision registered before the Fargate stack carried the setting prints None (the variable is absent, and --output text prints a missing value as None); one that prints true sets it explicitly."
by = ["exempt:baseline"]

[[unit]]
text = "Either way, that revision runs the older release's migrations on start, and against a newer schema it refuses to start."
by = ["test:backend/tests/integration/database/test_newer_database_rollback.py"]

[[unit]]
text = "Register a copy of it with RUN_MIGRATIONS=false added to the backend container's environment, and roll back to the copy."
by = ["exempt:baseline"]

[[unit]]
text = "Revisions the Deploy workflow registers after the Fargate stack has been deployed from a current checkout carry the setting already, and Deploy refuses to create a deployment for one that does not (Deploy refused an API revision that would run migrations on start)."
by = ["untested:T"]

[[unit]]
text = "Rollback does not check its target: that is this command."
by = ["untested:T"]

[[unit]]
text = "Rolling back past segment targeting"
by = ["exempt:baseline"]

[[unit]]
text = "Segment targeting (in_segment and not_in_segment) arrived in v0.22.0."
by = ["untested:T"]

[[unit]]
text = "Before rolling the API back past that release, remove segment conditions from flags and experiments, or disable the flags that use them, and pause the experiments that use them."
by = ["exempt:baseline"]

[[unit]]
text = "After an automatic rollback past it (an alarm in the canary, when the old and the new release serve side by side, or after the traffic shift), disable segment-targeted flags and pause segment-targeted experiments at once."
by = ["exempt:baseline"]

[[unit]]
text = "Turn them back on when the API is again on a release with segment targeting and the SDKs have refreshed their rulesets (every 30 seconds by default)."
by = ["test:sdk/python/tests/test_local.py"]

[[unit]]
text = "GET /api/v1/segments/{segment_id}/experiments lists the flags and experiments whose rules mention a segment."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "Step 1: Find the Previous Task Definition ARN"
by = ["exempt:baseline"]

[[unit]]
text = "Two producers write to this family, and only one of them is runnable."
by = ["exempt:baseline"]

[[unit]]
text = "cdk deploy registers revisions too, and those carry the CDK's bootstrap image tag rather than a released build (#82)."
by = ["untested:T"]

[[unit]]
text = "Rolling onto one starts tasks that cannot pull an image."
by = ["exempt:baseline"]

[[unit]]
text = "Never pick a revision by subtracting 1 — read the image off a candidate before you deploy it."
by = ["exempt:baseline"]

[[unit]]
text = "Option A: List recent task definitions for the family (newest first) WITH the image each one carries, so a CloudFormation-registered revision is visible rather than a number in a list:"
by = ["exempt:baseline"]

[[unit]]
text = "It prints one line per revision, newest first, for example:"
by = ["exempt:baseline"]

[[unit]]
text = "Option B: Ask which revision is actually serving traffic."
by = ["exempt:baseline"]

[[unit]]
text = "NOT services[0].taskDefinition: on a service with a CodeDeploy deployment controller that field is \"specified when the service is created with CreateService, and it can be modified with UpdateService\" -- and UpdateService is the one call ECS refuses on such a service."
by = ["exempt:third-party"]

[[unit]]
text = "So it names the revision CloudFormation created when the stack was first deployed, for the life of the service, and is never the running one."
by = ["exempt:baseline"]

[[unit]]
text = "The PRIMARY task set is:"
by = ["exempt:baseline"]

[[unit]]
text = "It returns an ARN such as arn:...:task-definition/experimentation-backend-$ENV:44."
by = ["exempt:baseline"]

[[unit]]
text = "Then use Option A to choose the released revision below it."
by = ["exempt:baseline"]

[[unit]]
text = "Option C: Review service events to identify what was running before this deployment:"
by = ["exempt:baseline"]

[[unit]]
text = "The dashboard has the same listing for its own family and container."
by = ["exempt:baseline"]

[[unit]]
text = "Only a revision whose image is a digest (web@sha256:...) is a release: a deploy registered it."
by = ["test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_the_release_predicate"]

[[unit]]
text = "A :bootstrap or version-tag image is a revision CloudFormation registered, and Rollback refuses it."
by = ["exempt:baseline"]

[[unit]]
text = "The second command shows what the dashboard is serving: its PRIMARY deployment (it has no task sets)."
by = ["exempt:baseline"]

[[unit]]
text = "Step 2: Trigger the Rollback Workflow"
by = ["exempt:baseline"]

[[unit]]
text = "Navigate to GitHub → Actions → \"Rollback\" (file: rollback.yml)"
by = ["exempt:instruction"]

[[unit]]
text = "Click Run workflow, from main (any other ref is refused)"
by = ["test:backend/tests/unit/infrastructure/test_deploy_workflows.py::test_a_dispatch_from_any_ref_but_main_is_refused"]

[[unit]]
text = "Fill in the required inputs:"
by = ["exempt:baseline"]
count = 2

[[unit]]
text = "Environment: $ENV (staging or prod)."
by = ["exempt:baseline"]

[[unit]]
text = "A revision of the other environment's family is refused with \"Re-run with environment=…\""
by = ["test:backend/tests/unit/infrastructure/test_deploy_workflows.py::test_rollback_refuses_the_other_environments_revision"]

[[unit]]
text = "Reason for rollback: Brief description, e.g., \"Error rate 8% after v1.2.3 deploy, p99 latency 5200ms\""
by = ["exempt:baseline"]

[[unit]]
text = "Previous task definition ARN: The ARN from Step 1 (the last known-good revision)"
by = ["exempt:baseline"]

[[unit]]
text = "dashboard_task_definition_arn (optional): the dashboard revision from Step 1, experimentation-dashboard-$ENV:<n>."
by = ["exempt:baseline"]

[[unit]]
text = "Leave it empty to leave the dashboard as it is; the run summary then says what the dashboard is serving."
by = ["exempt:baseline"]

[[unit]]
text = "A dashboard revision in the API field, or an API revision in the dashboard field, is refused by name (\"… is a dashboard revision; it goes in dashboard_task_definition_arn, not task_definition_arn\", and the reverse)"
by = ["test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_a_dashboard_revision_in_the_api_field_is_refused_by_name"]

[[unit]]
text = "Click Run workflow"
by = ["exempt:baseline"]
count = 2

[[unit]]
text = "The workflow will:"
by = ["exempt:baseline"]

[[unit]]
text = "Check the target revision is ACTIVE, in the right family, has a container named backend, and is not a CloudFormation-registered :bootstrap revision"
by = ["untested:T"]

[[unit]]
text = "Refuse, creating nothing, if the API is already on that revision with no deployment in flight (the dashboard half, if given, still runs)"
by = ["exempt:baseline"]

[[unit]]
text = "Stop any CodeDeploy deployment still in flight (during an incident the bad deploy usually is, and CodeDeploy refuses a second one), after reading who created each one; if any is CodeDeploy's own rollback, or its creator cannot be read, it stops nothing and fails"
by = ["untested:T"]

[[unit]]
text = "After stopping one, wait up to about 5 minutes until the deployment group has no active deployment."
by = ["untested:T"]

[[unit]]
text = "Stopping with auto-rollback makes CodeDeploy create its own revert of what was stopped, which usually finishes in a few seconds."
by = ["exempt:baseline"]

[[unit]]
text = "If one is still active when the wait ends, the run creates nothing and fails with Deployment group still busy, naming it"
by = ["exempt:baseline"]

[[unit]]
text = "Create a CodeDeploy deployment naming that revision, all-at-once rather than the canary the forward path uses"
by = ["untested:T"]

[[unit]]
text = "Approve the traffic shift (aws deploy continue-deployment) — without this the deployment parks for 30 minutes and is then stopped, which auto-rollback turns back into the revision you were rolling away from"
by = ["untested:T"]

[[unit]]
text = "Wait until the target revision is the PRIMARY task set and every desired task is running"
by = ["untested:T"]

[[unit]]
text = "If a dashboard revision was given (it was checked before anything changed: ACTIVE, in the dashboard family of this environment, one dashboard container, a digest image): roll the dashboard's service onto it, and refuse, without changing it, if the dashboard's PRIMARY deployment is no longer the revision the check saw (another Deploy, Rollback or cdk deploy changed it)"
by = ["test:backend/tests/unit/infrastructure/test_dashboard_deploy_wiring.py::test_rollback_does_not_touch_a_dashboard_that_changed_since_it_was_validated"]

[[unit]]
text = "Notify #deployments with the result, success or failure"
by = ["untested:T"]

[[unit]]
text = "It does not run smoke tests; /health is Step 5 below, by hand."
by = ["exempt:baseline"]

[[unit]]
text = "Step 3: Monitor Progress"
by = ["exempt:baseline"]

[[unit]]
text = "Watch the GitHub Actions run."
by = ["exempt:baseline"]

[[unit]]
text = "Simultaneously run:"
by = ["exempt:baseline"]

[[unit]]
text = "Watch the PRIMARY task set, which is what actually moves."
by = ["exempt:baseline"]

[[unit]]
text = "NOT services[0].taskDefinition: on a CODE_DEPLOY service that field is set by CreateService and changed only by UpdateService -- the call ECS refuses here -- so it names the revision CloudFormation created and never changes."
by = ["exempt:baseline"]

[[unit]]
text = "Watching it during a rollback shows nothing happening and reads as a failure:"
by = ["exempt:baseline"]

[[unit]]
text = "Running, Desired and Pending are the PRIMARY task set's own counts: Desired is its computedDesiredCount."
by = ["untested:T"]

[[unit]]
text = "Do not read the service's runningCount instead: for the hour after a shift the replaced task set keeps running beside the new one, so the service counts both (staging showed 4 running of 2 desired after a rollback that had worked)."
by = ["exempt:baseline"]

[[unit]]
text = "This is a blue/green deployment, not a rolling update: a second (green) task set is provisioned alongside the current one and traffic moves to it in one shift, so Serving changes from the old revision to the new one at once rather than tasks being replaced one at a time."
by = ["exempt:third-party"]

[[unit]]
text = "The dashboard is the opposite case"
by = ["exempt:baseline"]

[[unit]]
text = "The dashboard's service (experimentation-dashboard-$ENV) uses the ECS rolling deployment controller, not CodeDeploy."
by = ["untested:T"]

[[unit]]
text = "Everything said above about the API is reversed for it:"
by = ["exempt:baseline"]

[[unit]]
text = "aws ecs update-service --task-definition is the right call; there is no CodeDeploy deployment and no traffic shift to approve."
by = ["exempt:baseline"]

[[unit]]
text = "What it is serving is its PRIMARY deployment, deployments[?status=='PRIMARY'], not taskSets (it has none)."
by = ["exempt:baseline"]

[[unit]]
text = "services[0].taskDefinition does move for it."
by = ["exempt:baseline"]

[[unit]]
text = "aws ecs wait services-stable reports success after the deployment circuit breaker has rolled a failed revision back: one deployment, every task running, just not the revision you asked for."
by = ["exempt:third-party"]

[[unit]]
text = "Wait on the PRIMARY deployment's taskDefinition and rolloutState instead, as Method 2's dashboard block does."
by = ["exempt:baseline"]


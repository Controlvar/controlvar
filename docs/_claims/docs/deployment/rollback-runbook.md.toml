[[unit]]
text = "The decided way to point the application at it is scripts/restore_repoint.sh: it renames the restored cluster onto the stack's identifier and the original out of it, so the endpoint the tasks carry reaches the restored database with nothing redeployed, and it checks the password and the endpoint before the API starts."
by = ["test:backend/tests/unit/infrastructure/test_restore_repoint.py::test_staging_forward_back_and_keep"]

[[unit]]
text = "It was rehearsed on a staging account on 2026-10-11 (UTC): a restore, a cutover, and a cutover undone (#295)."
by = ["evidence:https://github.com/getexperimently/experimently/issues/295#issuecomment-6157399822"]

[[unit]]
text = "Restore from PITR in the Disaster Recovery Plan gives it step by step, with what it cannot do."
by = ["exempt:baseline"]

[[unit]]
text = "The cluster's identifier is generated by CloudFormation; the stack publishes it:"
by = ["untested:T"]

[[unit]]
text = "Find when the most recent pre-deployment snapshot was taken; the restore time must be before the migration."
by = ["exempt:baseline"]

[[unit]]
text = "A deploy takes a snapshot before migrating, named pre-deploy-<env>-<tag>-<time>; a manual migration's is named pre-migration-...:"
by = ["test:backend/tests/unit/infrastructure/test_deploy_workflows.py::test_the_snapshot_is_taken_before_the_migration_from_the_stack_output"]

[[unit]]
text = "Aurora restores to any second within the cluster's backup retention period, up to its LatestRestorableTime (usually within 5 minutes of the present)."
by = ["exempt:third-party"]

[[unit]]
text = "The stack sets 35 days in prod and staging and 1 day elsewhere."
by = ["untested:T"]

[[unit]]
text = "A cluster deployed from an earlier version of the CDK app keeps its old value (1 day) until its database stack is redeployed, so check what it actually keeps:"
by = ["exempt:third-party"]

[[unit]]
text = "Restore to a new cluster at a time before the migration, and point the application at it, with Steps 1 to 4 of Restore from PITR, restoring to the time you found above."
by = ["exempt:baseline"]

[[unit]]
text = "The cutover there starts the API again on the revision it already serves, with the task count and scaling it had."
by = ["test:backend/tests/unit/infrastructure/test_restore_repoint.py::test_staging_forward_back_and_keep"]

[[unit]]
text = "Before the next deploy, change the release: a deploy of the release that contains the migration runs it again."
by = ["exempt:baseline"]

[[unit]]
text = "RTO: on 2026-10-11 (UTC), on a staging database holding little data, the restore took 11 min 41 s and the cutover took the API down for 12 min 45 s (#295); a larger database restores more slowly."
by = ["evidence:https://github.com/getexperimently/experimently/issues/295#issuecomment-6157399822"]

[[unit]]
text = "The recovery point is the time you restore to."
by = ["exempt:third-party"]

[[unit]]
text = "Restart the API on the revision it is serving"
by = ["exempt:baseline"]

[[unit]]
text = "Use this when the API's tasks have to start again on the release they already run: after a secret they read at start has changed (Secrets Management), or after a restore, once the tasks would come back pointing at the right database."
by = ["exempt:baseline"]

[[unit]]
text = "ECS reads each secret into a task when the task starts, so only new tasks see a new value."
by = ["exempt:third-party"]

[[unit]]
text = "The preferred way is the Deploy workflow, run with the tag already serving; Secrets Management says what it does and what it asks for."
by = ["untested:S"]

[[unit]]
text = "The commands below are for when the workflow is not available."
by = ["exempt:baseline"]

[[unit]]
text = "They need an AWS role allowed to read the service and the task definitions, register a task definition, and create and continue a CodeDeploy deployment, and, for the last step, a checkout of this repository."
by = ["exempt:baseline"]

[[unit]]
text = "NOT aws ecs update-service --force-new-deployment, the usual way to restart an ECS service."
by = ["untested:T"]

[[unit]]
text = "This service has a CodeDeploy deployment controller, and on such a service UpdateService changes only the desired count, the deployment configuration, the health check grace period, task placement and tag settings: new tasks come from a CodeDeploy deployment."
by = ["exempt:baseline"]

[[unit]]
text = "Is a deployment still active?"
by = ["exempt:baseline"]

[[unit]]
text = "CodeDeploy accepts one deployment per deployment group at a time."
by = ["exempt:baseline"]

[[unit]]
text = "A deploy's deployment stays active for about an hour after its traffic shift, while the group keeps the old task set, so a restart inside that hour is refused."
by = ["test:backend/tests/unit/infrastructure/test_forward_deploy_completes.py"]

[[unit]]
text = "Nothing printed means you can go on:"
by = ["exempt:baseline"]

[[unit]]
text = "If a deployment is listed, wait for it to end (aws deploy get-deployment --deployment-id <id> shows its status), then start again here."
by = ["exempt:baseline"]

[[unit]]
text = "Do not stop it by hand to make room: stopping it with auto-rollback moves traffic back to the task set kept from before that deploy, whose tasks started before the change and still hold the old value."
by = ["exempt:baseline"]

[[unit]]
text = "If the restart cannot wait, the one faster way to start new tasks is Method 1 to the previous revision: it stops that deployment and creates its own, whose new tasks read the current values."
by = ["untested:T"]

[[unit]]
text = "That runs the previous release (read The rolled-back API runs against the current schema first), and its own deployment is then active for its hour in turn."
by = ["exempt:baseline"]

[[unit]]
text = "Read the revision serving, from the PRIMARY task set (not services[0].taskDefinition, which on this service never moves)."
by = ["exempt:baseline"]

[[unit]]
text = "It must print exactly one ARN; two, or none, means a deployment is in progress: go back to Step 1."
by = ["exempt:baseline"]

[[unit]]
text = "Register a copy of it as a new revision."
by = ["exempt:baseline"]

[[unit]]
text = "Same image, same settings, a new ARN, so the check in Step 6 cannot pass before the new tasks are serving:"
by = ["exempt:baseline"]

[[unit]]
text = "Create the deployment, all at once."
by = ["exempt:baseline"]

[[unit]]
text = "--deployment-config-name overrides the group's CANARY_10_PERCENT_15_MINUTES: the revision is the one already serving, and the canary would keep 90% of traffic on the old tasks for another fifteen minutes."
by = ["exempt:baseline"]

[[unit]]
text = "The deployment group waits up to 30 minutes for the approval once the new task set is up (status Ready), then stops the deployment, and auto-rollback discards the new tasks: a restart that is never approved never happens."
by = ["exempt:baseline"]

[[unit]]
text = "If the loop prints Failed or Stopped, stop here; the old tasks are still serving, and aws deploy get-deployment --deployment-id \"$DEPLOYMENT_ID\" says why."
by = ["exempt:baseline"]

[[unit]]
text = "Then, only if it printed Ready:"
by = ["exempt:baseline"]

[[unit]]
text = "Step 6."
by = ["exempt:baseline"]

[[unit]]
text = "Confirm the new revision is serving, from the repository root."
by = ["exempt:baseline"]

[[unit]]
text = "scripts/api_serving.py exits 0 when the new revision is the PRIMARY task set and the HTTPS listener's /api/ rule forwards to that task set's target group, and 1 while the shift is still under way."
by = ["exempt:baseline"]

[[unit]]
text = "The loop ends on any other answer, or when the deployment fails or is stopped:"
by = ["exempt:baseline"]

[[unit]]
text = "Exit 0 means the restart is done: every request now reaches the new tasks."
by = ["test:backend/tests/unit/infrastructure/test_api_serving_explain.py"]

[[unit]]
text = "Exit 3 means the new tasks are PRIMARY but the /api/ rule forwards elsewhere: read The API route and the PRIMARY task set disagree."
by = ["test:backend/tests/unit/infrastructure/test_api_serving_explain.py"]

[[unit]]
text = "Exit 2 means the script could not tell; it prints why."
by = ["exempt:baseline"]

[[unit]]
text = "The deployment itself reads Succeeded only after the group terminates the old task set, about an hour after the shift; until then an alarm, or a stop with auto-rollback, can still move traffic back to the old tasks."
by = ["exempt:baseline"]


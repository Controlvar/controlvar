by = ["exempt:baseline"]

[[unit]]
text = "Step 3."
by = ["exempt:baseline"]
count = 2

[[unit]]
text = "Deploy the previous task definition through CodeDeploy."
by = ["exempt:baseline"]

[[unit]]
text = "NOT aws ecs update-service --task-definition."
by = ["exempt:baseline"]

[[unit]]
text = "This service has a CodeDeploy deployment controller, and ECS refuses a task-definition change through UpdateService on one: \"Unable to update task definition on services with a CODE_DEPLOY deployment controller\"."
by = ["exempt:third-party"]

[[unit]]
text = "Going back is the same call as going forward, with an older revision."

by = ["test:backend/tests/integration/api/test_websocket_results.py::TestWebSocketRefresh::test_refresh_receives_new_snapshot"]

[[unit]]
text = "Any unknown action | Ignored (no crash)"
by = [
    "test:backend/tests/integration/api/test_websocket_results.py::TestWebSocketUnknownActions::test_unknown_action_does_not_crash",
    "test:backend/tests/integration/api/test_websocket_results.py::TestWebSocketUnknownActions::test_malformed_json_does_not_crash",
]

[[unit]]
text = "Snapshot Schema"
by = ["exempt:baseline"]

[[unit]]
text = "p_value is an unadjusted, two-sided pooled two-proportion z-test of the variant against the control, computed from each arm's own participants and conversions (the arms need not be the same size)."
by = ["test:backend/tests/unit/services/test_results_streaming_service.py::test_live_p_value_pools_each_arms_own_counts"]

[[unit]]
text = "It is null for the control, and for a variant whose test is undefined (a control with no participants, fewer than 5 variant participants, or a pooled rate of 0 or 1: no conversions in the two arms together, or every participant converted)."
by = [
    "test:backend/tests/unit/services/test_results_streaming_service.py::test_live_p_value_is_none_where_there_is_nothing_to_test",
    "test:backend/tests/unit/services/test_results_streaming_service.py::test_live_p_value_is_none_when_the_control_has_no_participants",
]


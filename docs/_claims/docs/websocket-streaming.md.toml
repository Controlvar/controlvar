[[unit]]
text = "Live Results over WebSocket"
by = ["exempt:label"]

[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "EP-058 adds a WebSocket endpoint that streams experiment result snapshots to connected clients."
by = ["docex:docs/websocket-streaming.md#\"event\": \"results_update\""]

[[unit]]
text = "Backend"
by = ["exempt:baseline"]

[[unit]]
text = "WebSocket Endpoint"
by = ["exempt:baseline"]

[[unit]]
text = "On connect the server sends an initial snapshot."
by = ["docex:docs/websocket-streaming.md#\"event\": \"results_update\""]

[[unit]]
text = "After 30 seconds with no message from the client it sends a fresh one (RESULTS_STREAM_INTERVAL_SECONDS, read when the API starts); a ping or a refresh starts that wait again."
by = [
    "test:backend/tests/unit/api/test_results_stream_interval.py::test_the_interval_is_30_seconds_unless_set_when_the_api_starts",
    "test:backend/tests/unit/api/test_results_stream_interval.py::test_every_wait_is_the_full_interval_and_a_message_starts_it_again",
]

[[unit]]
text = "The socket needs an access token; see Authentication below for the three ways to send it."
by = ["test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_missing_token_closes_4401"]

[[unit]]
text = "Run the commands on this page in one terminal, in order, against the stack from the Quick Start."
by = ["exempt:baseline"]

[[unit]]
text = "Each uses the shell variables set by the ones before it."
by = ["exempt:baseline"]

[[unit]]
text = "Log in first:"
by = ["exempt:baseline"]

[[unit]]
text = "It prints \"ADMIN\"."
by = ["exempt:baseline"]

[[unit]]
text = "This saves the id of the demo data's checkout_button_color experiment in $EXP_ID:"
by = ["docex:docs/websocket-streaming.md#37"]

[[unit]]
text = "It prints 37, the length of an id and its newline."
by = ["exempt:baseline"]

[[unit]]
text = "curl alone can show the first snapshot: it sends the upgrade request with the token as the subprotocol, then prints what arrives until --max-time stops it three seconds later."
by = ["docex:docs/websocket-streaming.md#\"event\": \"results_update\""]

[[unit]]
text = "That stop is exit code 28, which the block accepts."
by = ["exempt:baseline"]

[[unit]]
text = "The frame header that curl prints with the snapshot is binary, so grep reads the output as bytes (LC_ALL=C grep -a) and picks out the event, status and variant keys:"
by = ["docex:docs/websocket-streaming.md#\"event\": \"results_update\""]

[[unit]]
text = "It prints \"event\": \"results_update\", the experiment's \"status\": \"active\", and its two variants, blue_button and green_button."
by = ["docex:docs/websocket-streaming.md#\"event\": \"results_update\""]

[[unit]]
text = "The whole snapshot has the shape below."
by = ["exempt:baseline"]


[[unit]]
text = "Authentication"
by = ["exempt:baseline"]

[[unit]]
text = "The stream requires the same credentials as the HTTP API."
by = [
    "test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_missing_token_closes_4401",
    "test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_invalid_token_closes_4401",
    "test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_inactive_user_closes_4401",
]

[[unit]]
text = "The token is validated before the socket is registered; a missing or invalid token is answered with an accepted-then-closed socket, close code 4401, so browser clients can tell \"unauthorized\" from a network failure and must not reconnect with the same token."
by = [
    "test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_missing_token_closes_4401",
    "test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_invalid_token_closes_4401",
    "test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_inactive_user_closes_4401",
    "test:frontend/src/tests/hooks/useExperimentStream.test.ts",
]

[[unit]]
text = "Ways to present the token, in order of preference:"
by = ["exempt:baseline"]

[[unit]]
text = "Subprotocol (what the dashboard uses): new WebSocket(url, ['experimently.bearer', token])."
by = [
    "test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_subprotocol_token_accepted_and_echoed",
    "test:frontend/src/tests/hooks/useExperimentStream.test.ts",
]

[[unit]]
text = "The server echoes experimently.bearer as the accepted subprotocol."
by = ["exempt:baseline"]

[[unit]]
text = "This keeps the token out of URLs and therefore out of access logs."
by = ["test:frontend/src/tests/hooks/useExperimentStream.test.ts"]

[[unit]]
text = "Authorization: Bearer <token> header for non-browser clients."
by = ["test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_bearer_header_accepted"]

[[unit]]
text = "?token=<token> query parameter, supported for compatibility only."
by = ["test:backend/tests/integration/api/test_local_auth_path.py::TestWebSocketAuth::test_query_token_accepted"]

[[unit]]
text = "URLs are written to proxy access logs, so prefer 1 or 2."
by = ["exempt:baseline"]

[[unit]]
text = "frontend/src/hooks/useExperimentStream.ts stops reconnecting and reports status: 'unauthorized' on close code 4401."
by = ["test:frontend/src/tests/hooks/useExperimentStream.test.ts"]

[[unit]]
text = "The HTTP companion endpoints (subscriber counts, active experiments) are read-only and informational."
by = ["docex:docs/websocket-streaming.md#0"]

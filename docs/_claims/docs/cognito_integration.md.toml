[[unit]]
text = "AWS Cognito Integration"
by = ["exempt:label"]

[[unit]]
text = "This document explains how Controlvar integrates with AWS Cognito for authentication and role-based access control."
by = ["exempt:navigation"]

[[unit]]
text = "Overview"
by = ["exempt:label"]

[[unit]]
text = "The platform uses AWS Cognito for user authentication and leverages Cognito groups to automatically assign user roles within the application."
by = [
    "test:backend/tests/integration/api/test_users_me_role.py::test_users_me_role_is_the_group_mapped_role_under_cognito",
    "test:backend/tests/integration/api/test_cognito_sign_in_linking.py",
]

[[unit]]
text = "This integration provides the following features:"
by = ["exempt:label"]

[[unit]]
text = "The first time a Cognito user signs in, the platform creates their account and records their Cognito user ID (sub) on it."
by = [
    "test:backend/tests/integration/api/test_cognito_sign_in_linking.py::test_a_new_cognito_identity_gets_an_account_linked_to_its_sub",
    "test:backend/tests/integration/api/test_cognito_onboarding_users_me.py::test_the_documented_onboarding_creates_the_account",
]

[[unit]]
text = "Later sign-ins find the account by that ID (see How a sign-in finds its account)"
by = [
    "test:backend/tests/integration/api/test_cognito_sign_in_linking.py::test_a_second_sign_in_with_the_same_sub_reaches_the_same_account_after_a_rename",
    "test:backend/tests/integration/api/test_cognito_sign_in_linking.py::test_two_first_sign_ins_of_one_identity_reach_the_same_account",
]

[[unit]]
text = "User roles are set from the Cognito groups in the user's access token"
by = [
    "test:backend/tests/integration/api/test_users_me_role.py::test_users_me_role_is_the_group_mapped_role_under_cognito",
    "test:backend/tests/unit/services/test_auth_service.py::test_get_user_with_groups",
]

[[unit]]
text = "A change of Cognito groups is reflected in the user's role at their next access token (see When a role change takes effect)"
by = ["test:backend/tests/integration/api/test_cognito_sign_in_linking.py::test_leaving_the_admin_group_changes_the_role_at_the_next_token"]

[[unit]]

[[unit]]
text = "Why it matters"
by = ["exempt:baseline"]

[[unit]]
text = "Unbounded string fields can be exploited to:"
by = ["exempt:baseline"]

[[unit]]
text = "Cause excessively large database rows / index entries."
by = ["exempt:baseline"]

[[unit]]
text = "Trigger O(n) processing in downstream logic (e.g., logging, serialisation)."
by = ["exempt:baseline"]

[[unit]]
text = "In the absence of a WAF, provide a vector for simple denial-of-service via large payloads."
by = ["exempt:baseline"]

[[unit]]
text = "Pydantic validates these limits before any database interaction occurs."
by = ["test:backend/tests/unit/middleware/test_hardening_in_place.py::test_a_value_over_its_limit_is_refused_before_the_database_is_used"]


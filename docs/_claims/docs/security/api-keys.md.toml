[[unit]]
text = "API Key Management"
by = ["exempt:baseline"]

[[unit]]
text = "API keys give programs access to the platform: SDK clients, server-side applications and scripts."
by = ["exempt:baseline"]

[[unit]]
text = "Unlike a user's login token, which expires (after 12 hours by default), an API key lasts until you delete it or it reaches its own expires_at."

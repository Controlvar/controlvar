[[unit]]
text = "Security Best Practices"
by = ["exempt:baseline"]

[[unit]]
text = "Never commit keys to source control"
by = ["exempt:baseline"]

[[unit]]
text = "API keys in source code can be exposed in logs, error messages or git history."
by = ["exempt:baseline"]

[[unit]]
text = "Load keys from environment variables or a secrets manager:"
by = ["exempt:baseline"]

[[unit]]
text = "and never write the key itself into the code."
by = ["exempt:baseline"]

[[unit]]
text = "Use a secrets manager"
by = ["exempt:baseline"]

[[unit]]
text = "Store production API keys in a dedicated secrets manager:"
by = ["exempt:baseline"]

[[unit]]
text = "AWS Secrets Manager: integrates with ECS task definitions and Lambda environment variables"
by = ["exempt:baseline"]

[[unit]]
text = "HashiCorp Vault: for multi-cloud or on-premise setups"
by = ["exempt:baseline"]

[[unit]]
text = "Kubernetes Secrets: for Kubernetes-based deployments"
by = ["exempt:baseline"]

[[unit]]
text = "Separate keys per service"
by = ["exempt:baseline"]

[[unit]]
text = "Use one API key per service or application, and name it after the service."
by = ["exempt:baseline"]

[[unit]]
text = "That limits the blast radius of a leaked key: you can delete that service's key without affecting the others."
by = ["exempt:baseline"]

[[unit]]
text = "Grant sdk:ruleset only where it is needed"
by = ["exempt:baseline"]

[[unit]]
text = "Give the sdk:ruleset scope only to a server that will evaluate flags locally or assign lists of users."
by = ["exempt:baseline"]

[[unit]]
text = "Every other key, including any key used in a browser or a mobile app, should be created without it."
by = ["exempt:baseline"]

[[unit]]
text = "Because no other scope limits a key, a separate key per service is what lets you revoke one integration without touching the others."
by = ["test:backend/tests/smoke/test_sdk_scoped_routes.py::test_the_scoped_routes_are_exactly_these"]

[[unit]]
text = "Remember that a key acts as its owner"

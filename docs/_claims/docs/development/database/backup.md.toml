# What verifies each unit of docs/development/database/backup.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/development/database/backup.md"

[[unit]]
text = "Database Backup Schedules and Retention Policies"
by = ["exempt:label"]

[[unit]]
text = "This page lists the backups the CDK stacks configure for each data store."
by = ["exempt:label"]

[[unit]]
text = "The recovery procedures are in the Disaster Recovery Plan."
by = ["exempt:navigation"]

[[unit]]
text = "Aurora PostgreSQL"
by = ["exempt:label"]

[[unit]]
text = "Backup Mechanism"
by = ["exempt:label"]
count = 2

[[unit]]
text = "Aurora PostgreSQL protects the cluster with:"
by = ["exempt:label"]

[[unit]]
text = "Automated backups: a daily snapshot and continuous backup of the transaction log, which together allow point-in-time recovery to any moment within the retention period"
by = ["exempt:third-party"]

[[unit]]
text = "Manual snapshots: deploy.yml takes one before every deploy's migration (pre-deploy-<env>-<tag>-<time>); they are kept until you delete them"
by = ["test:backend/tests/unit/infrastructure/test_deploy_workflows.py::test_the_snapshot_is_taken_before_the_migration_from_the_stack_output"]

[[unit]]
text = "A final snapshot when the prod database stack is deleted"
by = ["untested:T"]

[[unit]]
text = "Backup and Maintenance Windows"
by = ["exempt:label"]

[[unit]]
text = "The stack sets no preferred backup window and no preferred maintenance window, so Aurora chooses both for the cluster's region."
by = ["untested:T"]

[[unit]]
text = "Retention Policy"
by = ["exempt:label"]
count = 2

[[unit]]
text = "Environment | Automated Backup Retention | Point-in-Time Recovery | Manual Snapshot Retention"
by = ["exempt:label"]

[[unit]]
text = "Production | 35 days | Up to 35 days | Until manually deleted"
by = ["test:infrastructure/tests/test_database_wiring.py::test_backups_and_instances_per_environment"]

[[unit]]
text = "Staging | 35 days | Up to 35 days | Until manually deleted"
by = ["test:infrastructure/tests/test_database_wiring.py::test_backups_and_instances_per_environment"]

[[unit]]
text = "Any other | 1 day | Up to 1 day | Until manually deleted"
by = ["test:infrastructure/tests/test_database_wiring.py::test_dev_keeps_one_day_of_backups"]

[[unit]]
text = "Implementation"
by = ["exempt:label"]

[[unit]]
text = "The retention is what the stack sets: aurora_backup_retention_days() in infrastructure/cdk/stacks/environments.py returns it per environment, and infrastructure/cdk/stacks/enhanced_database_stack.py passes it to the cluster as backup=rds.BackupProps(retention=Duration.days(...))."
by = ["untested:T"]

[[unit]]
text = "35 days is the most Aurora allows."
by = ["exempt:third-party"]

[[unit]]
text = "DynamoDB Tables"
by = ["exempt:label"]

[[unit]]
text = "Every DynamoDB table the stacks create has point-in-time recovery on."
by = ["untested:T"]

[[unit]]
text = "No stack schedules an on-demand backup."
by = ["untested:T"]

[[unit]]
text = "ElastiCache Redis"
by = ["exempt:label"]

[[unit]]
text = "ElastiCache Redis uses snapshot-based backups:"
by = ["exempt:label"]

[[unit]]
text = "Automatic Snapshots: Taken daily during the configured backup window"
by = ["untested:T"]

[[unit]]
text = "Backup Windows"
by = ["exempt:label"]

[[unit]]
text = "Environment | Backup Window (UTC) | Maintenance Window (UTC)"
by = ["exempt:label"]

[[unit]]
text = "Development | 02:00-03:00 | Sun 04:00-05:00"
by = ["untested:T"]

[[unit]]
text = "Staging | 02:00-03:00 | Sun 04:00-05:00"
by = ["untested:T"]

[[unit]]
text = "Production | 02:00-03:00 | Sun 04:00-05:00"
by = ["untested:T"]

[[unit]]
text = "Environment | Snapshot Retention"
by = ["exempt:label"]

[[unit]]
text = "Development | 1 day"
by = ["untested:T"]

[[unit]]
text = "Staging | 3 days"
by = ["untested:T"]

[[unit]]
text = "Production | 7 days"
by = ["untested:T"]

[[unit]]
text = "Failover"
by = ["exempt:label"]

[[unit]]
text = "In prod the replication group has three nodes and fails over automatically; staging runs one node, with no failover."
by = ["test:infrastructure/tests/test_redis_sizing.py::test_replication_group_sizing"]

[[unit]]
text = "Since Redis is primarily used for caching, some data loss may be acceptable as the data can be rebuilt from primary sources."
by = ["untested:T"]

[[unit]]
text = "Encryption"
by = ["exempt:label"]

[[unit]]
text = "Aurora PostgreSQL: Backups are encrypted using the same KMS key as the database"
by = ["untested:T"]

[[unit]]
text = "ElastiCache Redis: Snapshots are encrypted if the cluster has encryption at rest enabled"
by = ["test:infrastructure/tests/test_redis_sizing.py::test_encryption_is_unchanged"]

by = ["exempt:baseline"]

[[unit]]
text = "Show current version (one row per head):"
by = ["exempt:baseline"]

[[unit]]
text = "Show migration history, newest first, down to the first revision (<base> -> ...):"
by = ["exempt:baseline"]

[[unit]]
text = "The modules branch has two revisions, modules_0001_rbac and then modules_0002_warehouse_analysis: downgrade modules@-1 unapplies modules_0002_warehouse_analysis only, and downgrade modules@-2 the whole branch."
by = ["exempt:baseline"]


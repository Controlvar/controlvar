# What verifies each unit of docs/development/guidelines.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/development/guidelines.md"

[[unit]]
text = "Development Guidelines"
by = ["exempt:label"]

[[unit]]
text = "The rules a change to this repository follows."
by = ["exempt:navigation"]

[[unit]]
text = "How to set up, run and test the stack is in CONTRIBUTING.md, and the conventions, with the reasons for them, are in CLAUDE.md."
by = ["exempt:navigation"]

[[unit]]
text = "Python"
by = ["exempt:label"]

[[unit]]
text = "Write for Python 3.11, with type annotations."
by = ["exempt:instruction"]

[[unit]]
text = "Use Pydantic v2: field_validator, model_validator, ConfigDict, and BaseSettings from pydantic_settings."
by = ["exempt:instruction"]

[[unit]]
text = "Import application code by its full path, rooted at backend.app: from backend.app.models.metrics.metric import RawMetric."
by = ["exempt:instruction"]

[[unit]]
text = "Never root an import at app: Python loads app.models.metrics.metric as a different module from backend.app.models.metrics.metric, with different classes."
by = ["exempt:third-party"]

[[unit]]
text = "This search finds such an import, and prints nothing when there is none:"
by = ["exempt:instruction"]

[[unit]]
text = "A new core model's module goes in CORE_MODEL_MODULES in backend/app/models/__init__.py, which register_core_models() imports."
by = ["test:backend/tests/smoke/test_core_model_registry.py::TestCoreModelRegistry::test_every_core_model_module_is_in_core_model_modules_and_registered"]

[[unit]]
text = "Lint and format"
by = ["exempt:label"]

[[unit]]
text = "Ruff formats and lints the Python and sorts its imports; its configuration is [tool.ruff] in pyproject.toml."
by = ["test:backend/tests/unit/infrastructure/test_contributor_rules.py::test_ruff_formats_lints_and_sorts_imports_from_the_pyproject_configuration"]

[[unit]]
text = "Do not add black, isort or flake8 back."
by = ["exempt:instruction"]

[[unit]]
text = "make format formats and fixes the Python in place."
by = ["test:backend/tests/unit/infrastructure/test_contributor_rules.py::test_make_format_formats_and_fixes_the_python_in_place"]

[[unit]]
text = "make lint runs what the lint check runs."
by = ["test:backend/tests/unit/infrastructure/test_contributor_rules.py::test_make_lint_runs_every_command_the_lint_job_runs"]

[[unit]]
text = "CI, the pre-commit hook and the virtual environment install the same ruff version."
by = ["test:backend/tests/unit/infrastructure/test_ruff_version_agrees.py::test_all_three_declaration_sites_name_one_version"]

[[unit]]
text = "Dialogs"
by = ["exempt:label"]

[[unit]]
text = "A modal dialog in the dashboard is Dialog, from frontend/src/components/ui/Dialog.tsx."
by = ["exempt:instruction"]

[[unit]]
text = "Do not build an overlay by hand: frontend/src/tests/a11y/dialog-sweep.test.ts refuses aria-modal, a <dialog> element, and fixed with inset-0 in one class string anywhere else."
by = [
    "test:frontend/src/tests/a11y/dialog-sweep.test.ts::builds no overlay by hand outside Dialog.tsx and RAW_DIALOGS, and every count matches",
    "test:frontend/src/tests/a11y/dialog-sweep.test.ts::refuses %s",
    "test:frontend/src/tests/a11y/dialog-sweep.test.ts::refuses fixed and inset-0 in one class string: %s",
]

[[unit]]
text = "While a Dialog is open, Tab and Shift+Tab stay inside it, the page behind it is inert, and the page does not scroll."
by = [
    "test:frontend/src/tests/components/Dialog.test.tsx::Tab and Shift+Tab wrap among the controls and never reach the page behind",
    "test:frontend/src/tests/components/Dialog.test.tsx::#__next carries the inert attribute while open and none after close",
    "test:frontend/src/tests/components/Dialog.test.tsx::sets overflow hidden on body while open, and restores what was there on close",
]

[[unit]]
text = "Escape calls onClose, unless dismissible={false} or busy is set."
by = [
    "test:frontend/src/tests/components/Dialog.test.tsx::calls onClose exactly once, from document and from inside the dialog",
    "test:frontend/src/tests/components/Dialog.test.tsx::is ignored while busy and works again once busy clears",
    "test:frontend/src/tests/components/Dialog.test.tsx::is ignored when dismissible={false}",
]

[[unit]]
text = "Focus opens on initialFocusRef, else on the first element marked data-autofocus, else on the first control."
by = [
    "test:frontend/src/tests/components/Dialog.test.tsx::initialFocusRef wins over the first control: a destructive confirm opens on Cancel",
    "test:frontend/src/tests/components/Dialog.test.tsx::then the first [data-autofocus] element",
    "test:frontend/src/tests/components/Dialog.test.tsx::goes to the first control by default",
]

[[unit]]
text = "Give a confirmation that deletes something its Cancel button as initialFocusRef."
by = ["exempt:instruction"]

[[unit]]
text = "On close, focus goes to returnFocus if you pass one, else back to the element that opened the dialog."
by = [
    "test:frontend/src/tests/components/Dialog.test.tsx::an explicit returnFocus ref wins over the opener",
    "test:frontend/src/tests/components/Dialog.test.tsx::to the opener after Escape, and after the dialog’s own close control",
]

[[unit]]
text = "Set a live region's text as the dialog closes with the third value of useDeferredAnnouncement: it writes the text after the page behind the dialog is no longer inert."
by = ["test:frontend/src/tests/components/Dialog.test.tsx::useDeferredAnnouncement writes the live region after #__next is no longer inert"]

[[unit]]
text = "In a Jest test, render with renderInAppRoot from frontend/src/tests/helpers/renderInAppRoot.tsx."
by = ["exempt:instruction"]

[[unit]]
text = "Under Jest, a Dialog rendered without it throws."
by = ["test:frontend/src/tests/components/Dialog.test.tsx::throws under Jest, naming the helper, and leaves nothing behind"]

[[unit]]
text = "Pull requests"
by = ["exempt:label"]

[[unit]]
text = "Write the title as a conventional commit, type(optional scope): description, with type one of feat fix perf deps docs build ci refactor test chore revert style."
by = ["exempt:instruction"]

[[unit]]
text = "The conventional-title check refuses any other title."
by = [
    "test:backend/tests/unit/infrastructure/test_contributor_rules.py::test_the_conventional_title_check_refuses_any_other_title",
    "test:backend/tests/unit/infrastructure/test_contributor_rules.py::test_the_conventional_title_check_accepts_each_type",
]

[[unit]]
text = "Sign off every commit and add a regression test to every bug fix: CONTRIBUTING.md and the Testing Guide say how."
by = ["exempt:instruction"]

[[unit]]
text = "MATCH_REGEX (match_regex)"
by = ["exempt:baseline"]

[[unit]]
text = "Tests if the value contains a match for the pattern (a search, not an anchored match: use ^ and $ to anchor)."
by = ["test:backend/tests/unit/core/test_pattern_match.py::test_semantics"]

[[unit]]
text = "Patterns use RE2 syntax, which differs from Python's re:"
by = ["exempt:baseline"]

[[unit]]
text = "\\w, \\d, \\s and \\b are ASCII-only; use \\p{L}, \\p{N} or [[:alpha:]] for other scripts."
by = ["test:backend/tests/unit/core/test_pattern_match.py::test_semantics"]

[[unit]]
text = "$ matches only at the very end of the value, not before a final newline."
by = ["test:backend/tests/unit/core/test_pattern_match.py::test_semantics"]

[[unit]]
text = "Lookahead, lookbehind, backreferences, \\Z, (?x), (?u), (?a), \\N{...}, a counted repetition over 1000, and very large Unicode repetitions such as [\\p{L}\\p{N}]{1,300} are refused."
by = [
    "test:backend/tests/unit/core/test_pattern_match.py::test_refused_constructs",
    "test:backend/tests/unit/core/test_pattern_match.py::test_the_refusal_is_re2s_own_text",
]

[[unit]]
text = "Values longer than 256 characters are not evaluated."

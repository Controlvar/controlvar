[[unit]]
text = "You will see ShopLab simulator stopped, printed once the simulator has gone, or at once if it had already stopped."
by = ["journey:guided-examples#stop-simulator"]

[[unit]]
text = "2. Open the storefront"
by = ["exempt:label"]

[[unit]]
text = "Open http://localhost:3200."
by = ["exempt:instruction"]

[[unit]]
text = "You will see the hero the home page assigned you: \"Gear up for the season\" with the button Shop the collection, or \"See it in motion\" with the button Watch & shop."

    "journey:guided-examples#storefront",
    "journey:guided-examples#paused-storefront",
]

[[unit]]
text = "3. Open the panel"
by = ["exempt:label"]

[[unit]]
text = "Press Powered by Controlvar, at the bottom right of the page."

[[unit]]
text = "Before you start"
by = ["exempt:label"]

[[unit]]
text = "Run ./demo/setup-local.sh from the repository root, as the demo guide on GitHub describes."
by = ["exempt:instruction"]

[[unit]]
text = "It starts the API on http://localhost:8000, the dashboard on http://localhost:3100, the ShopLab storefront on http://localhost:3200 and StreamPulse on http://localhost:3300, with their seeded experiments and flags and their traffic simulators."

[[unit]]
text = "Log in first:"
by = ["exempt:baseline"]

[[unit]]
text = "It prints \"ADMIN\"."
by = ["exempt:baseline"]

[[unit]]
text = "Sample Size Guidance"
by = ["exempt:baseline"]

[[unit]]
text = "The experiments API computes a sample size, and the dashboard's guided setup calls it on its Estimate step."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx::makes exactly the calls it needs: one estimate, one create, nothing else"]

[[unit]]
text = "Then ask for a sample size:"
by = ["docex:docs/guides/experiment-wizard.md#\"samples_per_variant\": 47036"]

[[unit]]
text = "For a 12% baseline and a 5% relative change it needs 47036 users per variant, 94072 in all, at 80% power and 5% significance (two-sided)."
by = ["docex:docs/guides/experiment-wizard.md#\"samples_per_variant\": 47036"]

[[unit]]
text = "It also takes statistical_power, significance_level, is_one_sided, variant_count (2 to 100), correction_method, and daily_traffic (at most 1,000,000,000,000) with traffic_allocation for a duration estimate."
by = [
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_more_than_100_variants_is_refused",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_more_than_10_to_the_12_daily_users_is_refused",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_the_largest_counts_are_still_planned",
]

[[unit]]
text = "With three or more variants, send the experiment's correction as correction_method: none (the default), bonferroni or benjamini_hochberg, the values an experiment's correction_method takes."
by = [
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_the_estimate_plans_each_comparison_at_the_corrected_level",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_without_correction_method_the_estimate_is_uncorrected",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_an_unknown_correction_is_refused",
]

[[unit]]
text = "With either correction, each of the variant_count − 1 comparisons with the control is planned at significance_level ÷ (variant_count − 1), as the results page's Sample Size tab does; Benjamini-Hochberg is planned at the same level as Bonferroni."
by = [
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_the_estimate_plans_each_comparison_at_the_corrected_level",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_bonferroni_and_benjamini_hochberg_give_the_same_estimate",
    "test:backend/tests/integration/api/test_results_sample_size_api.py::test_the_tab_and_the_guided_setup_agree",
]

[[unit]]
text = "Three variants at 5%:"
by = ["exempt:example"]

[[unit]]
text = "That is 56961 users per variant, where no correction needs 47036."
by = [
    "docex:docs/guides/experiment-wizard.md#\"samples_per_variant\": 56961",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_the_estimate_plans_each_comparison_at_the_corrected_level",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_without_correction_method_the_estimate_is_uncorrected",
]

[[unit]]
text = "The answer also carries correction_method, comparisons and alpha, the significance each comparison is planned at; significance_level is still the 0.05 you sent."
by = [
    "docex:docs/guides/experiment-wizard.md#\"comparisons\": 2",
    "docex:docs/guides/experiment-wizard.md#\"alpha\": 0.025",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_the_estimate_plans_each_comparison_at_the_corrected_level",
]

[[unit]]
text = "The calculation is the standard one for two proportions (Fleiss), the same one the results page's Sample Size tab uses: the variance is pooled under the null hypothesis and unpooled under the alternative."
by = [
    "test:backend/tests/unit/api/test_sample_size_one_formula.py::test_both_routes_agree_with_the_service",
    "test:backend/tests/integration/api/test_results_sample_size_api.py::test_the_tab_and_the_guided_setup_agree",
]

[[unit]]
text = "Where p₁ = baseline rate, p₂ = baseline rate × (1 + MDE), p̄ = (p₁ + p₂) / 2, z_α/2 = 1.96 (two-tailed, α=0.05; a one-sided test uses z_α = 1.645), z_β = 0.842 (80% power), and n is rounded up."
by = ["exempt:baseline"]

[[unit]]
text = "It is per variant: with a correction, α is significance_level ÷ (variant_count − 1)."
by = [
    "test:backend/tests/unit/api/test_sample_size_critical_values.py::test_sample_size_matches_exact_critical_values",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_the_estimate_plans_each_comparison_at_the_corrected_level",
]

[[unit]]
text = "The total is n times the number of variants."
by = [
    "test:backend/tests/unit/api/test_sample_size_one_formula.py::test_both_routes_agree_with_the_service",
    "test:backend/tests/unit/api/test_sample_size_one_formula.py::test_documented_case_on_both_routes",
]

[[unit]]
text = "A baseline that the effect would raise to 100% or more is refused with a 422."
by = ["test:backend/tests/unit/api/test_sample_size_one_formula.py::test_a_treatment_rate_of_100_percent_or_more_is_refused"]

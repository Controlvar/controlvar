    "test:backend/tests/integration/api/test_sequential_results_routes.py::test_once_running_nobody_changes_the_sequential_settings",
    "test:backend/tests/integration/api/test_experiment_analysis_settings_fixed.py::test_a_superuser_cannot_change_an_analysis_setting_once_out_of_draft",

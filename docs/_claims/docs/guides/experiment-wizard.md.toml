[[unit]]
text = "An effect below 0.1%, or of 100% or more, cannot be saved: Next says so and stays on the step."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx::an effect %s refuses Next with the step error, and is never dropped silently"]

[[unit]]
text = "Nothing else in the estimate is saved: the results page plans from the control variant's own conversion rate, at 80% power."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::keeps the estimate across Back and Next, and puts only its effect in the create request",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::says on the Estimate step what is saved and what is not",
]

[[unit]]
text = "The Review step's Sample size row says what is saved, and the single-page form shows a saved effect read-only under the metrics."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::typed without an estimate: saved on the primary metric only, and Review says so",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::an estimate made for other inputs is not shown on Review; the effect still is",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::carries over to the single-page form, read-only, follows the primary metric, and comes back",
    "journey:experiment-wizard#estimate-next",
]

[[unit]]
text = "The estimate calls the sample-size endpoint shown below at a significance of 1 − the confidence level and with the correction chosen above, treats the minimum detectable effect as a relative change (5% of a 12% baseline is 12.6%, not 17%), and assumes users are split evenly between the variants."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::asks the sample-size endpoint only when the button is pressed, in fractions, without a login redirect",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::sends each power option, and 1 minus each confidence level as the significance",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::sends the correction chosen above: %s",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::sends the number of variants on the Variants step",
    "test:backend/tests/unit/api/test_sample_size_pinned_answer.py::test_twelve_percent_baseline_five_percent_relative_mde",
]

[[unit]]
text = "With three or more variants and Bonferroni or Benjamini-Hochberg, each comparison with the control is planned at that significance ÷ (variants − 1), as the results page's Sample Size tab plans it, and the estimate says so under its number."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::with Benjamini-Hochberg applied, says each comparison is planned at the corrected level, and no Power Calculator sentence",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::with Bonferroni applied at 4 variants, says so in one sentence",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_the_estimate_plans_each_comparison_at_the_corrected_level",
    "test:backend/tests/integration/api/test_results_sample_size_api.py::test_the_tab_and_the_guided_setup_agree",
]

[[unit]]
text = "With None it makes no correction, the same as the results, and the Power Calculator, which applies a Bonferroni correction, gives a higher number."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::with None chosen and applied, says no correction is made, as the results will not make one",
    "test:backend/tests/unit/api/test_sample_size_correction.py::test_without_correction_method_the_estimate_is_uncorrected",

[[unit]]
text = "Its minimum detectable effect is saved with the experiment, as the primary metric's expected_effect (10% is saved as 0.1), and the results page's Planned sample plans the sample for it; leave it blank and the results page plans for 5%."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::typed without an estimate: saved on the primary metric only, and Review says so",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::left blank: nothing is saved, and Review says the results page plans for 5%",

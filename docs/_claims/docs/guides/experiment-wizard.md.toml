document = "docs/guides/experiment-wizard.md"

[[unit]]
text = "Guided experiment builder"
by = ["exempt:baseline"]

[[unit]]
text = "There are two guided ways to create an experiment, and they are unrelated: the dashboard's guided setup, and the wizard API described in the rest of this page."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "In the dashboard: guided setup"
by = ["exempt:baseline"]

[[unit]]
text = "Experiments → + New Experiment opens guided setup, which asks for a new experiment in five steps:"
by = [
    "journey:experiment-wizard#sign-in-page",
    "journey:experiment-wizard#new-experiment",
]

[[unit]]
text = "Step | What you set"
by = ["exempt:baseline"]

[[unit]]
text = "1. Type | A/B Test or Multivariate"
by = ["journey:experiment-wizard#new-experiment"]

[[unit]]
text = "2. Details | Name, key, description, hypothesis, and the metrics (each with its own name), one of them primary"
by = [
    "journey:experiment-wizard#type-next",
    "journey:experiment-wizard#name",
    "journey:experiment-wizard#metric-event",
]

[[unit]]
text = "3. Variants | The variants, their traffic split (it must add up to exactly 100%), which one is the control, and optional targeting rules"
by = [
    "journey:experiment-wizard#details-next",
    "journey:experiment-wizard#split-90",
    "journey:experiment-wizard#split-refused",
]

[[unit]]
text = "4. Estimate | How results will be judged (the confidence level and the correction, saved with the experiment), then, optionally, how many users each variant needs and roughly how many days that takes"
by = [
    "journey:experiment-wizard#variants-next",
    "journey:experiment-wizard#calculate",
]

[[unit]]
text = "5. Review | Everything as it will be sent; Create Experiment creates it as a draft"
by = [
    "journey:experiment-wizard#estimate-next",
    "journey:experiment-wizard#create",
]

[[unit]]
text = "Next checks only the step you are on; Back never checks anything."
by = [
    "journey:experiment-wizard#details-refused",
    "journey:experiment-wizard#split-refused",
    "journey:experiment-wizard#back",
]

[[unit]]
text = "The step is in the address (?step=details), so the browser's Back and Forward move between steps."
by = ["journey:experiment-wizard#type-next"]

[[unit]]
text = "Your answers are kept only in this browser tab."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "Nothing is saved until you create the experiment: reloading the page or opening a link to a later step starts over at step 1, and the browser asks before you reload or close a tab with answers in it."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "Use the single-page form (advanced) switches to every field on one page (/experiments/new?advanced); your answers carry over in both directions."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "The Estimate step starts with How results will be judged: the confidence level (90%, 95% or 99%; default 95%) and the correction for several variants (Benjamini-Hochberg by default, Bonferroni or None)."
by = ["journey:experiment-wizard#variants-next"]

[[unit]]
text = "Those two are saved with the experiment as confidence_level and correction_method, and cannot be changed once it leaves draft."
by = [
    "journey:experiment-wizard#create",
    "test:backend/tests/integration/api/test_experiment_correction_settings_api.py::test_a_superuser_cannot_change_the_settings_once_out_of_draft",
    "test:backend/tests/integration/api/test_experiment_correction_settings_api.py::test_a_developer_cannot_change_them_on_an_active_experiment_either",
]

[[unit]]
text = "The single-page form has them in a collapsed Analysis settings section."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "The Review step shows them in its Analysis row."
by = ["journey:experiment-wizard#estimate-next"]

[[unit]]
text = "The rest of the step, the estimate, is advisory and is not saved."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "It calls the sample-size endpoint shown below at a significance of 1 − the confidence level, treats the minimum detectable effect as a relative change (5% of a 12% baseline is 12.6%, not 17%), and assumes users are split evenly between the variants."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::asks the sample-size endpoint only when the button is pressed, in fractions, without a login redirect",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::sends each power option, and 1 minus each confidence level as the significance",
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::sends the number of variants on the Variants step",
    "test:backend/tests/unit/api/test_sample_size_pinned_answer.py::test_twelve_percent_baseline_five_percent_relative_mde",
]

[[unit]]
text = "It makes no correction for comparing several variants with the control, even when one is chosen above, so with three or more variants the experiment needs more users than it says; the Power Calculator applies a Bonferroni correction, so its number is higher."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx",
    "journey:power-calculator#three-variants",
    "journey:power-calculator#api-three-variants",
]

[[unit]]
text = "Only ADMIN and DEVELOPER users (and superusers) can create experiments; anyone else sees a note saying so instead of the form."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "If Create Experiment fails, you stay where you are with every answer kept, in either view."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx",
    "test:frontend/src/tests/pages/experiment-new-create-errors.test.tsx",
]

[[unit]]
text = "A key another experiment already has is named, with Edit details to change it."
by = ["test:frontend/src/tests/pages/experiment-new-create-errors.test.tsx"]

[[unit]]
text = "If your session has ended, sign in again in another tab, then press Create Experiment again."
by = ["test:frontend/src/tests/pages/experiment-new-create-errors.test.tsx"]

[[unit]]
text = "Guided setup offers only A/B Test and Multivariate."
by = [
    "test:frontend/src/tests/pages/experiment-new-guided.test.tsx::offers exactly the types the single-page form offers",
    "journey:experiment-wizard#new-experiment",
]

[[unit]]
text = "Create a split URL or bandit experiment through the API (POST /api/v1/experiments/)."
by = ["exempt:instruction"]

[[unit]]
text = "Guided setup sends the same POST /api/v1/experiments request as the single-page form."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "It does not use the wizard API below and creates no draft."
by = ["exempt:baseline"]

[[unit]]
text = "The wizard API"
by = ["exempt:baseline"]

[[unit]]
text = "The wizard API is a 5-step flow for designing an experiment from your own tooling: it keeps a draft while you answer one question at a time, validates each step, and creates the experiment when you submit."
by = [
    "test:backend/tests/unit/api/test_experiment_wizard_endpoints.py::TestSubmitDraft::test_submit_complete_draft_creates_a_real_experiment",
    "test:backend/tests/unit/api/test_experiment_wizard_endpoints.py::TestSubmitDraft::test_submitted_draft_is_discarded",
]

[[unit]]
text = "Submitting writes a real experiment in DRAFT status, owned by the caller, and discards the draft."
by = ["exempt:baseline"]

[[unit]]
text = "The dashboard does not use it."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "Drafts are held in the API process's memory, so they do not survive a restart and are not shared between replicas."
by = ["test:backend/tests/unit/services/test_wizard_drafts_live_in_one_process.py::test_a_draft_is_not_seen_by_another_process"]

[[unit]]
text = "The wizard endpoints are deprecated and may be removed in a later release."
by = ["test:backend/tests/unit/api/test_wizard_drafts_per_user.py::test_every_wizard_operation_is_deprecated"]

[[unit]]
text = "Drafts are per user: a draft that belongs to another user is answered exactly as one that does not exist (404)."
by = [
    "test:backend/tests/unit/api/test_wizard_drafts_per_user.py::test_get_another_users_draft_is_404",
    "test:backend/tests/unit/api/test_wizard_drafts_per_user.py::test_put_step_on_another_users_draft_is_404_and_changes_nothing",
]


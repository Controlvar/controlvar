[[unit]]
text = "Sample Size Guidance"
by = ["exempt:baseline"]

[[unit]]
text = "The draft stores baseline_rate and mde, but the wizard doesn't compute a sample size from them."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "The experiments API does, and the dashboard's guided setup calls it on its Estimate step:"
by = ["exempt:baseline"]

[[unit]]
text = "For a 12% baseline and a 5% relative change it needs 47036 users per variant, 94072 in all, at 80% power and 5% significance (two-sided)."
by = ["docex:docs/guides/experiment-wizard.md#\"samples_per_variant\": 47036"]

[[unit]]
text = "It also takes statistical_power, significance_level, is_one_sided, variant_count, and daily_traffic with traffic_allocation for a duration estimate."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "The calculation is the standard one for two proportions (Fleiss), the same one the results page's Sample Size tab uses: the variance is pooled under the null hypothesis and unpooled under the alternative."
by = [
    "test:backend/tests/unit/api/test_sample_size_one_formula.py::test_both_routes_agree_with_the_service",
    "test:backend/tests/integration/api/test_results_sample_size_api.py::test_the_tab_and_the_guided_setup_agree",
]

[[unit]]
text = "Where p₁ = baseline rate, p₂ = baseline rate × (1 + MDE), p̄ = (p₁ + p₂) / 2, z_α/2 = 1.96 (two-tailed, α=0.05; a one-sided test uses z_α = 1.645), z_β = 0.842 (80% power), and n is rounded up."
by = ["exempt:baseline"]

[[unit]]
text = "It is per variant, with no correction for comparing more than two variants; the total is n times the number of variants."
by = [
    "test:backend/tests/unit/api/test_sample_size_critical_values.py::test_sample_size_matches_exact_critical_values",
    "test:backend/tests/unit/api/test_sample_size_one_formula.py::test_documented_case_on_both_routes",
]


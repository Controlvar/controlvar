[[unit]]
text = "If the server cannot decide membership when the flag is evaluated (the flag was unarchived after its segment was archived, say), the flag answers {\"enabled\": false, \"reason\": \"error\"} and the experiment does not enrol the user, for in_segment and not_in_segment alike."
by = ["test:backend/tests/integration/api/test_segment_targeting_api.py::test_unavailable_segment_fails_closed"]

[[unit]]

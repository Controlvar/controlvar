# What verifies each unit of docs/guides/segments.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/guides/segments.md"

[[unit]]
text = "Segments"
by = ["exempt:baseline"]

[[unit]]
text = "A segment is a named group of users."
by = ["test:backend/tests/integration/api/test_segment_members_api.py::test_kind_cannot_be_changed"]

[[unit]]
text = "It is one of two kinds, chosen when you create it and never changed:"
by = ["test:backend/tests/integration/api/test_segment_members_api.py::test_kind_cannot_be_changed"]

[[unit]]
text = "Rules (kind: rules, the default): the users whose attributes match conditions you set, such as plan is enterprise."
by = ["test:backend/tests/integration/api/test_segment_members_api.py::test_kind_defaults_to_rules"]

[[unit]]
text = "The rule format and its limits are in the API reference."
by = ["exempt:baseline"]

[[unit]]
text = "ID list (kind: id_list): the users whose user_id you upload, for example a customer export."
by = [
    "docex:docs/guides/segments.md#{\"kind\":\"id_list\",\"rules\":null,\"member_count\":0}",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_kind_an_id_list_is_created_without_rules",
]

[[unit]]
text = "This page is about these."
by = ["exempt:baseline"]

[[unit]]
text = "The member routes are beta (x-stability: beta): their shape may still change."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "The full contract and every refusal are in the API reference."
by = ["exempt:baseline"]

[[unit]]
text = "The examples run against the Quick Start stack and its demo data."
by = ["docex:docs/guides/segments.md#\"ADMIN\""]

[[unit]]
text = "Sign in"
by = ["exempt:baseline"]

[[unit]]
text = "Changing a segment takes the ADMIN or DEVELOPER role."
by = [
    "test:backend/tests/integration/api/test_segment_members_api.py::test_roles_analyst_cannot_change_members",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_roles_viewer_cannot_change_members",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_roles_developer_changes_members",
    "test:backend/tests/smoke/test_segment_change_routes_guarded.py",
]


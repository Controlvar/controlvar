[[unit]]
text = "Add IDs"
by = ["exempt:baseline"]

[[unit]]
text = "Send up to 10,000 IDs per request."
by = [
    "test:backend/tests/integration/api/test_segment_members_api.py::test_request_limits",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_ids_are_matched_exactly",
]

[[unit]]
text = "Each is 1 to 255 characters and is matched exactly: not trimmed, not case-folded."
by = [
    "test:backend/tests/integration/api/test_segment_members_api.py::test_request_limits",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_ids_are_matched_exactly",
]

[[unit]]
text = "It prints {\"added\":3,\"already_members\":0,\"member_count\":3}."
by = ["docex:docs/guides/segments.md#{\"added\":3,\"already_members\":0,\"member_count\":3}"]

[[unit]]
text = "Sending the same IDs again is safe."
by = [
    "docex:docs/guides/segments.md#{\"added\":1,\"already_members\":1,\"member_count\":4}",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_add_and_remove_are_idempotent",
]

[[unit]]
text = "An ID already in the segment is counted in already_members and left alone, so after a failure you can send the whole chunk again:"
by = [
    "docex:docs/guides/segments.md#{\"added\":1,\"already_members\":1,\"member_count\":4}",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_add_and_remove_are_idempotent",
]

[[unit]]
text = "It prints {\"added\":1,\"already_members\":1,\"member_count\":4}."
by = ["exempt:baseline"]

[[unit]]
text = "Add IDs from a file"
by = ["exempt:baseline"]

[[unit]]
text = "A segment holds at most 1,000,000 IDs."
by = ["untested:T"]

[[unit]]
text = "Send a longer file in chunks of 10,000, one request at a time, and stop at the first error."
by = ["exempt:baseline"]

[[unit]]
text = "This writes 25,000 IDs, one per line, to a file in a scratch directory, sends them in three chunks and prints each answer."
by = ["exempt:baseline"]

[[unit]]
text = "Each body is piped to curl (--data-binary @-): 10,000 IDs are too long for one command-line argument on Linux."
by = ["exempt:baseline"]

[[unit]]
text = "It prints one line per chunk."
by = ["docex:docs/guides/segments.md#\"member_count\":25004"]

[[unit]]
text = "The last is {\"added\":5000,\"already_members\":0,\"member_count\":25004}."
by = ["docex:docs/guides/segments.md#\"member_count\":25004"]

[[unit]]
text = "The file's IDs are written cust-000001 to cust-025000, so none of them was in the segment before (cust-001 is a different ID)."
by = ["exempt:baseline"]

[[unit]]
text = "A request over a limit answers 422 and adds nothing."
by = [
    "test:backend/tests/integration/api/test_segment_members_api.py::test_request_limits",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_request_limits_on_remove",
]

[[unit]]
text = "The message names the field and the position, never an ID: add: at most 10,000 IDs per request, add[17]: an ID is 1 to 255 characters, or, past the cap, this segment would have 1,000,250 members; a segment holds at most 1,000,000."
by = [
    "test:backend/tests/integration/api/test_segment_members_api.py::test_request_limits",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_request_limits_on_remove",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_the_segment_cap_writes_nothing",
]

[[unit]]

[[unit]]
text = "Target a flag or an experiment at a segment"
by = ["exempt:baseline"]

[[unit]]
text = "A targeting condition names the segment by id: {\"attribute\": \"segment\", \"operator\": \"in_segment\", \"value\": \"<segment id>\"}, or not_in_segment for everyone else."
by = [
    "docex:docs/guides/segments.md#active",
    "test:backend/tests/integration/api/test_segment_targeting_api.py::test_rules_naming_an_active_segment_are_accepted",
]

[[unit]]
text = "This creates a flag that is on only for the segment's members (its rollout outside the segment is 0%):"
by = ["exempt:baseline"]

[[unit]]
text = "It prints active."
by = [
    "docex:docs/guides/segments.md#active",
    "docex:docs/guides/segments.md#cust-001 {\"enabled\":true,\"reason\":\"targeting_rule\"}",
]

[[unit]]
text = "Evaluating it takes an API key."
by = [
    "docex:docs/guides/segments.md#active",
    "docex:docs/guides/segments.md#cust-001 {\"enabled\":true,\"reason\":\"targeting_rule\"}",
]

[[unit]]
text = "cust-001 is in the list and cust-999 is not:"
by = ["exempt:baseline"]

[[unit]]
text = "It prints one line per user: cust-001 gets {\"enabled\":true,\"reason\":\"targeting_rule\"}, and cust-999 falls through to the 0% rollout, {\"enabled\":false,\"reason\":\"rollout\"}."
by = ["docex:docs/guides/segments.md#cust-001 {\"enabled\":true,\"reason\":\"targeting_rule\"}"]

[[unit]]
text = "An experiment takes the same condition in its targeting_rules; a user who is not a member gets the control variant with assigned: false and reason: \"targeting\"."
by = ["test:backend/tests/integration/api/test_segment_targeting_api.py::test_flags_and_experiments_agree"]

[[unit]]
text = "The server decides membership."
by = [
    "test:backend/tests/integration/api/test_segment_targeting_api.py::test_a_caller_cannot_supply_membership",
    "test:backend/tests/integration/api/test_segment_targeting_api.py::test_context_user_id_does_not_decide_membership",
]

[[unit]]
text = "For an ID list, the user is the user_id the flag or the assignment is evaluated for; a user_id (or anything else) in the context you send does not make a user a member."
by = [
    "test:backend/tests/integration/api/test_segment_targeting_api.py::test_a_caller_cannot_supply_membership",
    "test:backend/tests/integration/api/test_segment_targeting_api.py::test_context_user_id_does_not_decide_membership",
]

[[unit]]
text = "At most 10 segments per ruleset, one per condition; put several conditions in an OR group to match any of them."
by = ["test:backend/tests/unit/core/test_segment_targeting_validation.py::test_ten_segments_accepted_eleven_refused"]

[[unit]]
text = "Saving rules that name a segment that is unknown, inactive or archived answers 422."
by = [
    "test:backend/tests/integration/api/test_segment_targeting_api.py::test_reference_refused_on_flag_create",
    "test:backend/tests/integration/api/test_segment_targeting_api.py::test_reference_refused_on_experiment_create",

[[unit]]
text = "Create an ID-list segment"
by = ["exempt:baseline"]

[[unit]]
text = "An ID-list segment has no rules."
by = ["docex:docs/guides/segments.md#{\"kind\":\"id_list\",\"rules\":null,\"member_count\":0}"]

[[unit]]
text = "This creates one and saves its id in $SEGMENT:"

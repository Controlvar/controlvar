# What verifies each unit of docs/guides/balance-within-groups.md (#448).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/guides/balance-within-groups.md"

[[unit]]
text = "Balance the split within groups (beta)"
by = ["exempt:label"]

[[unit]]
text = "An experiment that balances its split within groups gives each group of users the same split as the whole experiment, as they are assigned."
by = [
    "test:backend/tests/integration/services/test_balance_across_processes.py::test_four_processes_keep_every_group_balanced",
    "test:backend/tests/unit/services/test_balanced_allocation.py::test_the_bound_holds_for_every_split_in_steps_of_5",
]

[[unit]]
text = "With a 50/50 split balanced within tier, the users of each tier are split 50/50 among themselves, so a lucky mix of tiers cannot tip the result."
by = ["test:backend/tests/integration/services/test_balance_across_processes.py::test_four_processes_keep_every_group_balanced"]

[[unit]]
text = "You set balance_within on the experiment, and send the attribute in each assign request's context."
by = [
    "test:backend/tests/integration/api/test_balance_within_api.py::test_create_stores_and_echoes_the_setting",
    "test:backend/tests/integration/api/test_balance_within_api.py::test_a_clone_balances_within_the_same_groups_and_starts_fresh",
]

[[unit]]
text = "How it works"
by = ["exempt:label"]

[[unit]]
text = "Within each group, each new user takes the next place in a shuffled list of the experiment's split."
by = [
    "test:backend/tests/integration/services/test_balance_across_processes.py::test_four_processes_keep_every_group_balanced",
    "test:backend/tests/unit/services/test_balanced_allocation.py::test_the_order_depends_on_the_key_and_the_group",
]

[[unit]]
text = "Every user's chance of each variant is still its share."
by = ["test:backend/tests/unit/services/test_balanced_allocation.py::test_each_users_chance_is_their_share"]

[[unit]]
text = "A variant's count in a group stays within a few users of its share at every moment, and is exactly its share each time the group completes a list: at 50/50, the two variants of a group never differ by more than one user."
by = [
    "test:backend/tests/unit/services/test_balanced_allocation.py::test_the_bound_holds_for_every_split_in_steps_of_5",
    "test:backend/tests/integration/services/test_balance_across_processes.py::test_four_processes_keep_every_group_balanced",
]

[[unit]]
text = "The global holdout, the exclusion group and the targeting rules come first: only users who take part are balanced."
by = ["test:backend/tests/integration/api/test_balanced_assignment.py::test_ineligible_users_take_no_place"]

[[unit]]
text = "A user keeps their variant and their group if their attribute changes later."
by = ["test:backend/tests/integration/api/test_balanced_assignment.py::test_a_sticky_user_keeps_their_variant_and_group"]

[[unit]]
text = "An experiment that does not set balance_within assigns its users exactly as before."
by = [
    "test:backend/tests/integration/api/test_balanced_assignment.py::test_an_unbalanced_experiment_is_assigned_by_the_hash_alone",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignStatementCounts::test_statement_counts_with_no_active_holdout",
]

[[unit]]
text = "Turn it on"
by = ["exempt:label"]

[[unit]]
text = "Send balance_within when you create the experiment, or with PUT /api/v1/experiments/{id} while it is a draft:"
by = [
    "test:backend/tests/integration/api/test_balance_within_api.py::test_create_stores_and_echoes_the_setting",
    "test:backend/tests/integration/api/test_balance_within_api.py::test_put_on_a_draft_sets_echoes_and_clears_it",
]

[[unit]]
text = "The response echoes balance_within."
by = [
    "test:backend/tests/integration/api/test_balance_within_api.py::test_create_stores_and_echoes_the_setting",
    "test:backend/tests/integration/api/test_balance_within_api.py::test_put_on_a_draft_sets_echoes_and_clears_it",
]

[[unit]]
text = "Check that it does: a server version without this feature ignores the field and still answers 200."
by = ["exempt:advice"]

[[unit]]
text = "attribute is a top-level key of the assign context, such as tier or country."
by = ["test:backend/tests/unit/services/test_balanced_allocation.py::test_the_label_table"]

[[unit]]
text = "values lists the values to keep apart, 1 to 20 of them, each matched exactly: Gold and gold are different values."
by = [
    "test:backend/tests/unit/services/test_balanced_allocation.py::test_the_label_table",
    "test:backend/tests/integration/api/test_balance_within_api.py::test_the_setting_is_refused_verbatim",
]

[[unit]]
text = "A user whose value is not listed is balanced with the others in other, and a user without the key in unknown."
by = ["test:backend/tests/unit/services/test_balanced_allocation.py::test_the_label_table"]

[[unit]]
text = "null turns balancing off on a draft."
by = ["test:backend/tests/integration/api/test_balance_within_api.py::test_put_on_a_draft_sets_echoes_and_clears_it"]

[[unit]]
text = "Once the experiment has started, balance_within cannot be changed."
by = ["test:backend/tests/integration/api/test_balance_within_api.py::test_the_setting_is_locked_after_draft_for_every_role"]

[[unit]]
text = "A clone balances within the same groups, and its groups start from their first place."
by = ["test:backend/tests/integration/api/test_balance_within_api.py::test_a_clone_balances_within_the_same_groups_and_starts_fresh"]

[[unit]]
text = "Assign users"
by = ["exempt:label"]

[[unit]]
text = "Put the attribute at the top level of context in every assign request:"
by = ["exempt:instruction"]

[[unit]]
text = "A nested key ({\"user\": {\"tier\": \"high_value\"}}) or a dotted one (user.tier) is not read, so that user is balanced in unknown."
by = ["test:backend/tests/unit/services/test_balanced_allocation.py::test_the_label_table"]

[[unit]]
text = "POST /api/v1/tracking/assign and POST /api/v1/tracking/assign/batch take their places from the same groups, so users assigned one at a time and users of an uploaded list are balanced together (see Assign a customer list)."
by = ["test:backend/tests/integration/api/test_balanced_assignment.py::test_a_list_and_single_assigns_share_each_groups_places"]

[[unit]]
text = "The same list sent in another order can split differently; each user keeps the variant they got."
by = [
    "test:backend/tests/integration/api/test_balanced_assignment.py::test_a_list_and_single_assigns_share_each_groups_places",
    "test:backend/tests/integration/api/test_balanced_assignment.py::test_a_sticky_user_keeps_their_variant_and_group",
]

[[unit]]
text = "What is refused"
by = ["exempt:label"]

[[unit]]
text = "The request answers 422 with the reason when:"
by = ["test:backend/tests/integration/api/test_balance_within_api.py::test_the_setting_is_refused_verbatim"]

[[unit]]
text = "the attribute has a dot, has a character other than letters, digits, _ and -, or is user_id or segment;"
by = ["test:backend/tests/integration/api/test_balance_within_api.py::test_the_setting_is_refused_verbatim"]

[[unit]]
text = "values is missing (web_device, web_visitor and web_browser need none: their values are a fixed set), has more than 20 values, lists other or unknown, or lists a value twice;"
by = [
    "test:backend/tests/integration/api/test_balance_within_api.py::test_the_setting_is_refused_verbatim",
    "test:backend/tests/integration/api/test_balance_within_api.py::test_a_closed_key_needs_no_list_and_is_stored_without_one",
]

[[unit]]
text = "a share of the split is not a multiple of 5, such as 34/33/33 (50/50, 20/80, 35/35/30 and 40/30/30 are allowed);"
by = [
    "test:backend/tests/integration/api/test_balance_within_api.py::test_a_split_not_in_steps_of_5_is_refused",
    "test:backend/tests/integration/api/test_balance_within_api.py::test_a_split_in_steps_of_5_is_accepted",
    "test:backend/tests/unit/services/test_balanced_allocation.py::test_a_split_in_steps_of_5_is_accepted",
]

[[unit]]
text = "the experiment is a bandit or a split URL experiment;"
by = [
    "test:backend/tests/integration/api/test_balance_within_api.py::test_a_bandit_cannot_balance",
    "test:backend/tests/integration/api/test_balance_within_api.py::test_a_split_url_experiment_cannot_balance_on_create",
]

[[unit]]
text = "segments is sent: balancing within saved segments is not available yet."
by = ["test:backend/tests/integration/api/test_balance_within_api.py::test_the_setting_is_refused_verbatim"]

[[unit]]
text = "Changing balance_within after the experiment has started answers 400."
by = ["test:backend/tests/integration/api/test_balance_within_api.py::test_the_setting_is_locked_after_draft_for_every_role"]

[[unit]]
text = "Users assigned without balancing"
by = ["exempt:label"]

[[unit]]
text = "When the server is busy balancing other users at that moment, a new user is assigned by the experiment's ordinary hash instead."
by = [
    "test:backend/tests/integration/api/test_balanced_assignment.py::test_a_held_counter_row_is_answered_by_hash",
    "test:backend/tests/integration/api/test_balanced_assignment.py::test_a_held_counter_row_holds_up_nothing_else",
]

[[unit]]
text = "They keep their group, their chance of each variant is still its share, and they are counted in the experiment_balance_fallback_total metric by reason (timeout or busy)."
by = [
    "test:backend/tests/integration/api/test_balanced_assignment.py::test_a_held_counter_row_is_answered_by_hash",
    "test:backend/tests/integration/api/test_balanced_assignment.py::test_a_held_counter_row_holds_up_nothing_else",
]

[[unit]]
text = "An older server version, during a rolling deploy or a rollback, assigns every new user by the hash and stores no group."
by = ["test:backend/tests/integration/database/test_balance_within_migration.py::test_the_previous_releases_statements_run_on_this_schema"]

[[unit]]
text = "Limitations lists what balancing does not do."
by = ["exempt:navigation"]

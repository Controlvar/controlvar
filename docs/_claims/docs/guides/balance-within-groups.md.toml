[[unit]]
text = "The overall estimate is the stratified difference in conversion rates (Cochran, Sampling Techniques, chapter 5): the sum over the groups of each group's share of the users times its treatment rate minus its control rate, with the variance summed the same way from each group's two rates and the group's share squared."
by = [
    "test:backend/tests/unit/services/test_balanced_groups_estimate.py::test_the_hand_worked_example_gives_its_constants",
    "test:backend/tests/unit/stats_validation/test_balanced_groups_estimate_rates.py",
]

[[unit]]
text = "It equals the treatment's coefficient, and its HC2 standard error, in one regression over every variant with the group indicators centred and interacted with each treatment."
by = [
    "test:backend/tests/unit/services/test_balanced_groups_estimate.py::test_two_variants_equal_the_regression",
    "test:backend/tests/unit/services/test_balanced_groups_estimate.py::test_three_variants_equal_one_regression_over_all_of_them",
]

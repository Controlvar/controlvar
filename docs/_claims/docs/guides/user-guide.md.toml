[[unit]]
text = "First, How results will be judged."
by = ["exempt:baseline"]

[[unit]]
text = "These two settings are saved with the experiment and cannot be changed after it starts:"
by = ["test:backend/tests/integration/api/test_experiment_correction_settings_api.py::test_a_superuser_cannot_change_the_settings_once_out_of_draft"]

[[unit]]
text = "Confidence level: 90%, 95% (recommended) or 99%."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "At 95%, a variant is significant when its p-value is below 0.05."
by = ["test:frontend/src/tests/pages/experiment-new-guided.test.tsx"]

[[unit]]
text = "Correction for several variants: Benjamini-Hochberg (recommended), Bonferroni (stricter) or None."
by = ["journey:experiment-results#variants-next"]

[[unit]]
text = "It only matters with three or more variants: each extra variant is another chance for one to look like a winner by luck."
by = ["journey:experiment-results#results-page"]

[[unit]]
text = "Benjamini-Hochberg keeps the share of false winners among the variants called significant at about 5% (at 95% confidence); Bonferroni keeps the chance of even one false winner at 5% and needs more users."
by = ["test:backend/tests/unit/stats_validation/test_multiple_comparison_reference.py::test_adjusted_p_values_match_statsmodels"]

[[unit]]
text = "The correction applies to the variants of each metric, not across metrics."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_c2_the_stored_correction_applies_across_three_treatments"]

[[unit]]
text = "Below them, Also analyse the primary metric with Bayesian statistics is off by default."
by = ["test:frontend/src/tests/pages/experiment-new-configuration.test.tsx"]

[[unit]]
text = "Turned on, the results also carry a Bayesian analysis of the primary metric (the probability that each variant is the best) with default priors; the frequentist results and the recommendation do not change."
by = [
    "test:backend/tests/integration/api/test_bayesian_route_claims.py::test_turning_it_on_changes_neither_the_frequentist_results_nor_the_recommendation",

# What verifies each unit of docs/guides/assign-customer-list.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/guides/assign-customer-list.md"

[[unit]]
text = "Assign a customer list to an experiment"
by = ["exempt:baseline"]

[[unit]]
text = "Use this when you know who will see an experiment before they arrive (an email campaign, a CRM export, a list from your warehouse) and need each person's variant now."
by = ["exempt:baseline"]

[[unit]]
text = "POST /api/v1/tracking/assign/batch (beta) assigns up to 1,000 users in one request."
by = [
    "docex:docs/guides/assign-customer-list.md#2500",
    "test:backend/tests/integration/api/test_tracking_assign_batch.py::TestRefusals::test_1000_users_are_accepted",
    "test:backend/tests/integration/api/test_tracking_assign_batch.py::TestRefusals::test_a_422_assigns_nobody_and_repeats_no_id",
]

[[unit]]
text = "Each user gets what POST /api/v1/tracking/assign would give them, with the bandit weights read at the start of the request: the global holdout, the experiment's mutual exclusion group and its targeting rules apply to each new user, and a user who is already assigned keeps their variant."
by = [
    "test:backend/tests/integration/api/test_tracking_assign_batch.py::TestParity::test_each_user_gets_what_a_single_call_gives",
    "test:backend/tests/integration/api/test_tracking_assign_batch.py::TestDatabaseWork::test_the_bandit_weights_are_read_once_per_request",
]


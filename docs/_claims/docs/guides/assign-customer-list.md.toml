[[unit]]
text = "When they arrive"
by = ["exempt:baseline"]

[[unit]]
text = "When a customer reaches your site or app, call POST /api/v1/tracking/assign (an SDK's get_assignment / getAssignment) as usual."
by = ["test:backend/tests/integration/api/test_tracking_assign_batch.py::TestResend::test_a_later_single_call_returns_the_same_variant_and_records_the_view"]

[[unit]]
text = "The user gets the same variant, and that call records that they saw the experiment; the batch route records only the assignment:"
by = ["test:backend/tests/integration/api/test_tracking_assign_batch.py::TestResend::test_a_later_single_call_returns_the_same_variant_and_records_the_view"]

[[unit]]
text = "It prints true."
by = ["exempt:baseline"]

[[unit]]
text = "More than 1,000 users"
by = ["exempt:baseline"]

[[unit]]
text = "Send the list in chunks of 1,000, one request at a time."
by = ["exempt:baseline"]

[[unit]]
text = "The route allows 60 requests a minute from one address; over that it answers 429 with a Retry-After header, in seconds, and the loop below waits that long and sends the same chunk again."
by = [
    "test:backend/tests/unit/api/test_assign_batch_contract.py::test_the_limit_is_sixty_a_minute",
    "test:backend/tests/unit/api/test_assign_batch_contract.py::test_the_61st_request_in_a_minute_is_429",
]

[[unit]]
text = "It stops at any other error; run it again from the start, which is safe because assignments are sticky."
by = ["exempt:baseline"]

[[unit]]
text = "This writes 2,500 customer ids to a file in a scratch directory, sends them in three chunks, and appends each answer to assignments.csv:"
by = ["exempt:baseline"]

[[unit]]
text = "It prints 2500, one line per customer."
by = ["docex:docs/guides/assign-customer-list.md#2500"]

[[unit]]
text = "One chunk at a time."
by = ["test:backend/tests/unit/api/test_assign_batch_contract.py::test_the_61st_request_in_a_minute_is_429"]

[[unit]]
text = "Chunks sent in parallel share the 60-a-minute limit and the API's database connections with every other request."
by = ["test:backend/tests/unit/api/test_assign_batch_contract.py::test_the_61st_request_in_a_minute_is_429"]

[[unit]]
text = "What counts in results"
by = ["exempt:baseline"]

[[unit]]
text = "Every enrolled user counts in the experiment's results from the moment they are assigned, whether or not they open the email."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_s6_sizes_and_conversions_are_the_results_routes"]

[[unit]]
text = "If only some of them will ever see the experience, analyse it as an intent-to-treat experiment, or assign only the users you will contact."
by = ["exempt:baseline"]

[[unit]]
text = "For a bandit experiment, each enrolled user also counts as a pull of their variant."

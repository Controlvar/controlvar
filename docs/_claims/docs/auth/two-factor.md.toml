document = "docs/auth/two-factor.md"

[[unit]]
text = "Two-step sign-in"
by = ["exempt:label"]

[[unit]]
text = "With local sign-in (AUTH_PROVIDER=local), each account can turn on two-step sign-in (2FA, using TOTP codes) for itself."
by = [
    "test:frontend/src/tests/components/AppShell.test.tsx::offers it to a local sign-in user, opening /account/two-factor",
    "test:backend/tests/integration/api/test_two_factor_sign_in_api.py::test_every_role_manages_its_own_and_only_a_superuser_resets_others",
]

[[unit]]
text = "Signing in then asks for the password and then for the 6-digit code an authenticator app on your phone shows, or for one of your recovery codes."
by = [
    "test:backend/tests/integration/api/test_two_factor_sign_in_api.py::test_sign_in_asks_for_a_code_and_a_code_is_used_once",
    "test:backend/tests/integration/api/test_two_factor_sign_in_api.py::test_a_recovery_code_signs_in_once",
    "test:frontend/src/tests/auth/two-step-sign-in.test.tsx::sends the mfa_token and the code as typed, then stores the token and goes on",
]

[[unit]]
text = "Under Cognito, the dashboard does not offer it: Cognito's own sign-in applies."
by = [
    "test:frontend/src/tests/components/AppShell.test.tsx::hides it from a user who does not sign in locally: the routes answer 404 there",
    "test:frontend/src/tests/pages/account-two-factor.test.tsx::under another provider, says where it is set up and asks the API nothing",
    "test:backend/tests/unit/api/test_two_factor_routes.py::test_under_cognito_every_route_answers_the_local_only_404",
]

[[unit]]
text = "The API side, with every route and answer, is in Two-step sign-in."
by = ["exempt:navigation"]

[[unit]]
text = "Turn it on"
by = ["exempt:label"]

[[unit]]
text = "In the dashboard, open More → Two-step sign-in and choose Set up two-step sign-in."
by = [
    "test:frontend/src/tests/components/AppShell.test.tsx::offers it to a local sign-in user, opening /account/two-factor",
    "test:frontend/src/tests/pages/account-two-factor.test.tsx::says it is off and offers to set it up",
]

[[unit]]
text = "Scan the QR code with your authenticator app, or type the key shown under it into the app."
by = ["test:frontend/src/tests/pages/account-two-factor.test.tsx::U3: shows the key as text in groups of four, the QR with its alt, and the otpauth link"]

[[unit]]
text = "On the phone itself, Open in an authenticator app on this device adds it."
by = ["test:frontend/src/tests/pages/account-two-factor.test.tsx::U3: shows the key as text in groups of four, the QR with its alt, and the otpauth link"]

[[unit]]
text = "Enter the code the app shows and choose Turn on two-step sign-in."
by = ["test:frontend/src/tests/pages/account-two-factor.test.tsx::U4: the code field is text with the one-time-code hints, and keeps the zeros of 005924"]

[[unit]]
text = "Nothing changes at sign-in until a code is accepted."
by = [
    "test:backend/tests/integration/services/test_two_factor_service.py::test_a_waiting_secret_changes_nothing_at_sign_in",
    "test:backend/tests/integration/api/test_two_factor_sign_in_api.py::test_a_waiting_secret_changes_nothing_and_a_new_one_replaces_it",
]

[[unit]]
text = "Save the 10 recovery codes: Download as a text file or Copy codes, tick I have saved these codes, then choose Done."
by = [
    "test:frontend/src/tests/pages/account-two-factor.test.tsx::U3: Done waits for \"I have saved these codes\", then the page says it is on",
    "test:frontend/src/tests/pages/account-two-factor.test.tsx::offers the codes as a file, each grouped, never the secret",
]

[[unit]]
text = "They are shown this once."
by = [
    "test:frontend/src/tests/pages/account-two-factor.test.tsx::U3: Done waits for \"I have saved these codes\", then the page says it is on",
    "test:backend/tests/integration/services/test_two_factor_service.py::test_confirm_gives_ten_recovery_codes_and_stores_only_their_hashes",
]

[[unit]]
text = "A code is accepted in its own 30 seconds and in the 30 seconds either side."
by = ["test:backend/tests/unit/core/test_totp.py::test_the_window_is_one_step_either_side"]

[[unit]]
text = "If the first code is refused, check that your phone sets its clock automatically."
by = ["test:frontend/src/tests/pages/account-two-factor.test.tsx::a wrong first code shows the phone's clock hint and keeps the secret waiting"]

[[unit]]
text = "When your role requires it"
by = ["exempt:label"]

[[unit]]
text = "An operator can require two-step sign-in for chosen roles (LOCAL_AUTH_2FA_REQUIRED_ROLES, in Requiring it for a role)."
by = [
    "test:backend/tests/unit/core/test_two_factor_required_roles.py::test_exactly_the_listed_roles_are_required",
    "test:backend/tests/integration/api/test_two_factor_required_roles_api.py::test_a_required_role_sets_it_up_at_its_first_sign_in",
]

[[unit]]
text = "If your role is one of them and you have not set it up, signing in asks you to set it up after your password, with the same steps as above, before you are signed in: scan the QR code or type the key, enter the code the app shows and choose Turn on two-step sign-in, then save the recovery codes and choose Done."
by = [
    "test:frontend/src/tests/auth/two-step-enrol-sign-in.test.tsx::asks the API for a secret with the enrol token and no bearer, and shows it three ways",
    "test:frontend/src/tests/auth/two-step-enrol-sign-in.test.tsx::U3: Done waits for \"I have saved these codes\", then stores the access token and goes on",
]

[[unit]]
text = "If the set-up takes more than 10 minutes, sign-in starts again at the password."
by = [
    "test:backend/tests/unit/core/test_mfa_token.py::test_the_enrol_purpose_lasts_ten_minutes_and_is_only_its_own",
    "test:frontend/src/tests/auth/two-step-enrol-sign-in.test.tsx::U3: %s at the first code starts sign-in again",
]

[[unit]]
text = "While your role requires it, More → Two-step sign-in does not offer to turn it off."
by = ["test:frontend/src/tests/pages/account-two-factor.test.tsx::on: Turn off is not offered, and the page says why"]

[[unit]]
text = "Sign in with a code"
by = ["exempt:label"]

[[unit]]
text = "After your email and password, enter the code your app shows and choose Verify."
by = ["test:frontend/src/tests/auth/two-step-sign-in.test.tsx::sends the mfa_token and the code as typed, then stores the token and goes on"]

[[unit]]
text = "Spaces and hyphens in a code are ignored, and each code works once."
by = [
    "test:backend/tests/integration/services/test_two_factor_service.py::test_the_next_step_is_accepted_and_typed_spaces_are_ignored",
    "test:backend/tests/integration/services/test_two_factor_service.py::test_the_same_code_twice_is_refused",
    "test:backend/tests/integration/api/test_two_factor_sign_in_api.py::test_sign_in_asks_for_a_code_and_a_code_is_used_once",
]

[[unit]]
text = "Without your phone, choose Use a recovery code instead and enter one of your saved codes."
by = ["test:frontend/src/tests/auth/two-step-sign-in.test.tsx::a recovery code: the same field relabelled, sent as recovery_code, its own wrong-code sentence"]

[[unit]]
text = "Each recovery code works once; More → Two-step sign-in says how many are left."
by = [
    "test:backend/tests/integration/api/test_two_factor_sign_in_api.py::test_a_recovery_code_signs_in_once",
    "test:frontend/src/tests/pages/account-two-factor.test.tsx::says how many recovery codes are left",
]

[[unit]]
text = "The code step lasts 5 minutes."
by = ["docex:docs/api/auth.md#\"expires_in\": 300"]

[[unit]]
text = "After that, sign-in starts again at the password."
by = ["test:frontend/src/tests/auth/two-step-sign-in.test.tsx::an expired step goes back to the password with its own sentence, and drops the token"]

[[unit]]
text = "Lost your phone and your recovery codes"
by = ["exempt:label"]

[[unit]]
text = "Ask an administrator to reset your two-step sign-in."
by = ["test:frontend/src/tests/auth/two-step-sign-in.test.tsx::shows the lost-device path, and Back to sign-in drops the token and returns focus to the email"]

[[unit]]
text = "A superuser opens Admin → Users, edits your account and chooses Reset two-step sign-in."
by = [
    "test:frontend/src/tests/admin/EditUserModal.test.tsx::asks first, saying the session stays, then resets and says so; closing reloads the list",

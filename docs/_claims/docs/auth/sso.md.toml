[[unit]]
text = "State Tokens and CSRF Protection"
by = ["exempt:baseline"]

[[unit]]
text = "Starting an OIDC sign-in sets a signed, HttpOnly, SameSite=Lax cookie, __Host-experimently_oidc, in the browser that started it, and sends the provider a random state and a PKCE S256 challenge."
by = [
    "test:modules/backend/tests/integration/api/test_sso_api.py::TestOIDCCallbackStateIsMandatory::test_the_login_sets_a_host_prefixed_lax_cookie",
    "test:modules/backend/tests/integration/api/test_sso_api.py::TestOIDCCallbackStateIsMandatory::test_the_login_sends_a_pkce_challenge",
]

[[unit]]
text = "The callback is accepted only with that cookie and the state inside it, so a callback link made in another browser -- an attacker's own login -- is refused before its code is exchanged."
by = [
    "test:modules/backend/tests/integration/api/test_sso_api.py::TestOIDCCallbackStateIsMandatory::test_a_state_without_its_browsers_cookie_is_refused",
    "test:modules/backend/tests/integration/api/test_sso_api.py::TestOIDCCallbackStateIsMandatory::test_a_callback_with_a_forged_state_is_refused",
]

[[unit]]
text = "The cookie also carries the PKCE verifier, so an intercepted code cannot be redeemed without it."
by = ["test:modules/backend/tests/integration/api/test_sso_oidc_flow.py::test_the_callback_needs_the_cookie_that_carries_the_verifier"]

[[unit]]
text = "The sign-in expires after 10 minutes."
by = [
    "test:modules/backend/tests/integration/api/test_sso_dashboard_sign_in.py::test_an_expired_sign_in_is_sso_expired",
    "test:modules/backend/tests/integration/api/test_sso_dashboard_sign_in.py::test_a_dashboard_login_sets_the_cookie_for_ttl_plus_five_minutes",
]

[[unit]]
text = "The cookie is kept 5 minutes longer, so a callback that arrives late still carries it and is reported as expired (sso_expired) rather than as a sign-in from another browser."
by = [
    "test:modules/backend/tests/integration/api/test_sso_dashboard_sign_in.py::test_an_expired_sign_in_is_sso_expired",
    "test:modules/backend/tests/integration/api/test_sso_dashboard_sign_in.py::test_a_dashboard_login_sets_the_cookie_for_ttl_plus_five_minutes",
]

[[unit]]

]

[[unit]]
text = "See Modules and profiles for what each profile includes and how to run the full one."
by = ["exempt:baseline"]

[[unit]]
text = "The sso module adds Single Sign-On (SSO) through OpenID Connect (OIDC) and OAuth 2 providers; it is part of the full profile and, like every module, Apache-2.0."
by = ["untested:T"]

[[unit]]
text = "An administrator creates one SSO configuration per email domain; users of that domain then sign in through the identity provider (IdP) instead of with a password."
by = ["test:modules/backend/tests/integration/api/test_sso_api.py::TestCreateSSOConfig::test_duplicate_domain_returns_409"]

[[unit]]
text = "SSO sign-in needs AUTH_PROVIDER=local."
by = ["untested:A"]

[[unit]]
text = "When AUTH_PROVIDER is cognito, an SSO sign-in does not sign the user in (#707)."
by = ["untested:A"]

[[unit]]
text = "SAML 2.0 sign-in is not available yet; use OIDC"
by = ["exempt:baseline"]


[[unit]]
text = "PUBLIC_BASE_URL is the origin users reach the service at, for example https://app.example.com."
by = ["exempt:baseline"]

[[unit]]
text = "The URLs below are built from it, and an IdP compares them exactly, so set it before registering them."
by = ["test:modules/backend/tests/unit/api/test_sso_redirect_uri.py::test_public_base_url_wins_over_the_request"]

[[unit]]
text = "Provider | Register | Value"
by = ["exempt:baseline"]

[[unit]]
text = "okta, google, github | the redirect URI (Okta: Sign-in redirect URI; Google: Authorized redirect URI; GitHub: Authorization callback URL) | {PUBLIC_BASE_URL}/api/v1/auth/sso/oidc/{provider_type}/callback, e.g. https://app.example.com/api/v1/auth/sso/oidc/google/callback"
by = [
    "test:modules/backend/tests/unit/api/test_sso_redirect_uri.py::test_public_base_url_wins_over_the_request",
    "journey:sso-sign-in#signed-in",
]

[[unit]]
text = "saml | the ACS URL (Assertion Consumer Service; Single sign-on URL in Okta, Reply URL in Azure) | {PUBLIC_BASE_URL}/api/v1/auth/sso/saml/{config_id}/acs, where config_id is the id the configuration was created with"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "saml | the SP entity ID (Audience URI in Okta, Identifier in Azure) | the value of SAML_SP_ENTITY_ID"
by = ["test:modules/backend/tests/unit/services/test_sso_service.py::TestGenerateSAMLMetadata::test_contains_sp_entity_id"]

[[unit]]
text = "When PUBLIC_BASE_URL is not set, the OIDC redirect URI is built from the request's own scheme and Host instead, which behind a proxy is usually not the URL the IdP has registered."
by = ["test:modules/backend/tests/unit/api/test_sso_redirect_uri.py::test_without_the_setting_it_still_falls_back_to_the_request"]

[[unit]]
text = "The SP metadata document, GET /api/v1/auth/sso/saml/{config_id}/metadata, advertises SAML_SP_ENTITY_ID and SAML_SP_ACS_URL."
by = [
    "test:modules/backend/tests/unit/services/test_sso_service.py::TestGenerateSAMLMetadata::test_contains_sp_entity_id",
    "test:modules/backend/tests/unit/services/test_sso_service.py::TestGenerateSAMLMetadata::test_contains_acs_url_or_sp_info",
]

[[unit]]
text = "SAML_SP_ACS_URL is one value for the whole deployment, not one per configuration, and incoming assertions are checked against it: set it to the ACS URL above."
by = ["untested:T"]


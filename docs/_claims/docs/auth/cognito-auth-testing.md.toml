# What verifies each unit of docs/auth/cognito-auth-testing.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/auth/cognito-auth-testing.md"

[[unit]]
text = "Testing the Cognito Sign-in Flows"
by = ["exempt:label"]

[[unit]]
text = "How to exercise the API's Cognito endpoints against your own user pool, and what each one answers."
by = ["exempt:navigation"]

[[unit]]
text = "Cognito only"
by = ["exempt:label"]

[[unit]]
text = "The password-reset and token-refresh endpoints (POST /api/v1/auth/forgot-password, /reset-password and /refresh) are available only when AUTH_PROVIDER=cognito."
by = [
    "test:backend/tests/unit/api/test_cognito_only_routes.py::test_local_provider_answers_fixed_404",
    "test:backend/tests/unit/api/test_cognito_only_routes.py::test_any_other_provider_answers_fixed_404",
    "test:backend/tests/unit/api/test_cognito_only_routes.py::test_exactly_the_five_routes_carry_the_gate",
]

[[unit]]
text = "The sign-up and confirmation endpoints (POST /api/v1/auth/signup and /confirm) also need COGNITO_SELF_SIGNUP_ENABLED=true; without it they answer 404 and an administrator creates users (Adding a user)."
by = [
    "test:backend/tests/unit/api/test_cognito_only_routes.py::test_cognito_provider_with_self_signup_off_answers_404",
    "test:backend/tests/integration/auth/test_self_signup_gate.py::test_signup_refused_by_default_makes_no_cognito_call",
    "test:backend/tests/integration/auth/test_self_signup_gate.py::test_confirm_refused_by_default_makes_no_cognito_call",
]

[[unit]]
text = "With any other provider, including the default local, all five answer 404."
by = [
    "test:backend/tests/unit/api/test_cognito_only_routes.py::test_local_provider_answers_fixed_404",
    "test:backend/tests/unit/api/test_cognito_only_routes.py::test_any_other_provider_answers_fixed_404",
]

[[unit]]
text = "With local, sign in with POST /api/v1/auth/login; an administrator creates accounts and resets passwords."
by = [
    "test:backend/tests/integration/api/test_local_auth_path.py::TestLoginFlow::test_full_flow",
    "test:backend/tests/integration/api/test_own_password_change.py::test_superuser_resets_another_account",
]

[[unit]]
text = "The dashboard does not yet sign in with Cognito."
by = ["test:backend/tests/unit/api/test_local_auth.py::TestLoginEndpoint::test_login_404_under_cognito_provider"]

[[unit]]
text = "Sign in through the API with POST /api/v1/auth/token."
by = ["test:backend/tests/integration/auth/test_token.py::TestTokenSuccess::test_login_returns_access_token"]

[[unit]]
text = "SSO sign-in needs AUTH_PROVIDER=local."
by = ["test:backend/tests/unit/api/test_local_auth.py::TestGetCurrentUserLocal::test_cognito_provider_still_uses_cognito"]

[[unit]]
text = "Before you start"
by = ["exempt:label"]

[[unit]]
text = "Start the API with AUTH_PROVIDER=cognito, and with COGNITO_USER_POOL_ID, COGNITO_CLIENT_ID and AWS_REGION set to your user pool's."
by = ["exempt:instruction"]

[[unit]]
text = "The endpoints"
by = ["exempt:label"]

[[unit]]
text = "Each is a POST under /api/v1/auth/, and none needs a token."
by = [
    "test:backend/tests/integration/auth/test_signup.py::TestSignupSuccess::test_signup_no_auth_required",
    "test:backend/tests/integration/auth/test_confirm.py::TestConfirmSuccess::test_confirm_no_auth_required",
    "test:backend/tests/integration/auth/test_token.py::TestTokenSuccess::test_login_no_auth_required",
    "test:backend/tests/integration/auth/test_password_reset.py::TestForgotPassword::test_forgot_password_no_auth_required",
    "test:backend/tests/integration/auth/test_password_reset.py::TestConfirmForgotPassword::test_no_auth_required",
    "test:backend/tests/integration/auth/test_refresh.py::TestRefreshSuccess::test_refresh_no_auth_required",
]

[[unit]]
text = "/token takes a form (application/x-www-form-urlencoded); the others take JSON."
by = [
    "test:backend/tests/integration/auth/test_token.py::TestTokenSuccess::test_login_accepts_form_data",
    "test:backend/tests/integration/auth/test_signup.py::TestSignupSuccess::test_signup_returns_201",
]


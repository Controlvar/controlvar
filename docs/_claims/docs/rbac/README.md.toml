# What verifies each unit of docs/rbac/README.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/rbac/README.md"

[[unit]]
text = "Role-Based Access Control (RBAC) System"
by = ["exempt:baseline"]

[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "Every deployment, core or full profile, decides what a signed-in user may do from four roles and a separate superuser flag."
by = [
    "test:backend/tests/unit/core/test_permissions.py",
    "test:backend/tests/smoke/test_core_boundary.py::test_register_core_routers_mounts_no_module_route",
]

[[unit]]
text = "This page explains them."
by = ["exempt:navigation"]

[[unit]]
text = "Custom roles, the rbac module's (full profile only), are on the RBAC API page."
by = ["exempt:navigation"]

[[unit]]
text = "User Roles"
by = ["exempt:baseline"]

[[unit]]
text = "Users in the system can have one of the following roles:"
by = ["exempt:baseline"]

[[unit]]
text = "Admin: Can create and manage experiments, and create and manage any feature flag"
by = ["test:modules/backend/tests/unit/api/test_rbac_integration.py::TestRBACIntegration::test_admin_role_has_all_permissions"]

[[unit]]
text = "Developer: Can create and manage experiments, and create and manage any feature flag"
by = [
    "test:modules/backend/tests/unit/api/test_rbac_integration.py::TestRBACIntegration::test_developer_role_permissions",
    "test:backend/tests/integration/api/test_flag_change_routes_access.py",
]

[[unit]]
text = "Analyst: Can view experiments and feature flags, and create analytics reports"
by = ["test:modules/backend/tests/unit/api/test_rbac_integration.py::TestRBACIntegration::test_analyst_role_permissions"]

[[unit]]
text = "Viewer: Can view experiments and every feature flag, and change neither"
by = ["test:backend/tests/unit/core/test_permissions.py"]

[[unit]]
text = "Every role, Viewer included, can create an API key for itself, and an API key writes tracking data: assignments and events."
by = [
    "test:backend/tests/integration/api/test_api_keys_api.py::TestRulesetScopeNeedsFlagChangeRole::test_keys_without_the_scope_are_unchanged",
    "test:backend/tests/integration/api/test_api_keys_api.py::TestKeyAuthenticatesSdkTraffic::test_tracking_assign_with_created_key",
    "journey:api-key-first-assignment#track",
]

[[unit]]
text = "See API Key Management."
by = ["exempt:navigation"]

[[unit]]
text = "Feature flags are governed by role, not by who created them: an owner is recorded on each flag and shown, but owning a flag does not let an Analyst or Viewer change it."
by = [
    "test:backend/tests/integration/api/test_flag_change_routes_access.py",
    "test:backend/tests/smoke/test_flag_change_routes_guarded.py",
]

[[unit]]
text = "Each role has a specific set of permissions that determine what actions they can perform on various resources."
by = ["test:backend/tests/unit/api/test_sign_in_and_account_rules.py::test_the_role_decides_which_operations_are_available"]

[[unit]]
text = "The Admin role is not a superuser."
by = [
    "test:backend/tests/unit/api/test_sign_in_and_account_rules.py::test_the_admin_role_is_not_a_superuser",
    "test:frontend/src/tests/admin/withAdminGuard.test.tsx::refuses a non-superuser by default, whatever their role",
]

[[unit]]
text = "Managing user accounts (/api/v1/admin/users), global safety settings, and a flag's per-flag safety config (error-rate and latency thresholds, rollback percentage) and its rollback are gated on the separate is_superuser account flag, not on a role: an Admin without it is refused these the same as any other role."
by = [
    "test:backend/tests/integration/api/test_admin_users_api.py::TestPatchRefusals::test_a_non_superuser_is_refused_and_nothing_changes",
    "test:backend/tests/integration/api/test_safety_api.py::TestSafetySettings::test_non_superuser_cannot_update_settings",
    "test:backend/tests/integration/api/test_safety_api.py::TestFeatureFlagSafetyConfig::test_non_superuser_cannot_set_config",
]

[[unit]]
text = "The dashboard's Users, API Keys, Safety settings and Roles pages also require a superuser."
by = [
    "test:backend/tests/unit/api/test_route_surface_rules.py::test_the_users_api_keys_and_safety_pages_need_a_superuser",
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_the_roles_page_needs_a_superuser",
    "test:frontend/src/tests/admin/withAdminGuard.test.tsx::refuses a non-superuser by default, whatever their role",
]

[[unit]]
text = "Through the API, the Admin role alone may list and delete other users' API keys (GET /api/v1/api-keys?all=true, DELETE /api/v1/api-keys/{id}) and manage custom Roles; only the dashboard pages for those need the superuser flag."
by = [
    "test:backend/tests/unit/core/test_permissions.py::TestCheckPermission::test_only_admin_may_act_on_other_users_api_keys",
    "test:backend/tests/integration/api/test_api_keys_api.py::TestList::test_admin_all_sees_everyone",
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestCreateRole::test_admin_can_create_role",
]


[[unit]]
text = "Permission Matrix"
by = ["exempt:baseline"]

[[unit]]
text = "The following table shows which roles can perform which actions on which resources:"
by = ["exempt:baseline"]

[[unit]]
text = "Role | Experiment | Feature Flag | User | Report"
by = ["exempt:baseline"]

[[unit]]
text = "Admin | Create, Read, Update, Delete | Create, Read, Update, Delete | Create, Read, Update, Delete | Create, Read, Update, Delete"
by = ["test:modules/backend/tests/unit/api/test_rbac_integration.py::TestRBACIntegration::test_admin_role_has_all_permissions"]

[[unit]]
text = "Developer | Create, Read, Update, Delete | Create, Read, Update, Delete | Read | Read"
by = [
    "test:modules/backend/tests/unit/api/test_rbac_integration.py::TestRBACIntegration::test_developer_role_permissions",
    "test:backend/tests/unit/core/test_permissions.py::TestHasPermission::test_developer_permissions",
]

[[unit]]
text = "Analyst | Read | Read | Read | Create, Read, Update, Delete"
by = [
    "test:modules/backend/tests/unit/api/test_rbac_integration.py::TestRBACIntegration::test_analyst_role_permissions",
    "test:backend/tests/unit/core/test_permissions.py::TestHasPermission::test_analyst_permissions",
]

[[unit]]
text = "Viewer | Read | Read | Read | Read"
by = ["test:modules/backend/tests/unit/api/test_rbac_integration.py::TestRBACIntegration::test_viewer_role_permissions"]

[[unit]]
text = "The User column is ROLE_PERMISSIONS' entry for the User resource (backend/app/core/permissions.py); it is not what the dashboard or the /api/v1/admin/ routes enforce."
by = ["test:backend/tests/unit/api/test_sign_in_and_account_rules.py::test_the_admin_role_is_not_a_superuser"]

[[unit]]
text = "Those routes -- list, read, update, delete and deactivate a user, and the dashboard's Users page -- depend on deps.get_current_superuser directly and ignore this table entirely: an Admin without is_superuser gets a 403 from every one of them, the same as every other role."
by = [
    "test:backend/tests/integration/api/test_admin_users_api.py::TestPatchRefusals::test_a_non_superuser_is_refused_and_nothing_changes",
    "test:backend/tests/integration/api/test_admin_users_api.py::TestPatchRefusals::test_exactly_four_non_superuser_roles_are_checked",
]

[[unit]]
text = "Ownership-Based Access"
by = ["exempt:baseline"]

[[unit]]
text = "A user who creates a resource is recorded as its owner."
by = ["test:backend/tests/integration/api/test_feature_flag_ownership.py::TestCreatePersistsOwner::test_creator_is_recorded_as_owner_and_manages_the_flag"]

[[unit]]
text = "What that record decides depends on the resource."
by = ["exempt:baseline"]

[[unit]]
text = "Feature flags."
by = ["test:backend/tests/integration/api/test_flag_change_routes_access.py"]

[[unit]]
text = "A flag's owner is recorded and shown, but access to flags is decided by role alone: ADMIN and DEVELOPER may change any flag, and ANALYST and VIEWER may change none, including one they own."
by = ["test:backend/tests/integration/api/test_flag_change_routes_access.py"]

[[unit]]
text = "Experiments."
by = ["exempt:baseline"]

[[unit]]
text = "Under /api/v1/experiments/{experiment_id}:"
by = ["exempt:baseline"]

[[unit]]
text = "Reading an experiment (GET /{experiment_id}) and its results (/results, /daily-results, /segmented-results/{segment_by}) needs the role's READ on experiments."
by = ["test:backend/tests/unit/api/v1/endpoints/test_experiment_permissions.py::test_experiment_endpoint_permissions"]

[[unit]]
text = "Who owns the experiment is not considered."
by = ["test:backend/tests/integration/api/test_experiment_access_by_role.py::test_status_by_route_and_caller"]

[[unit]]
text = "Changing one -- PUT /{experiment_id}, schedule, start, pause, complete, archive and metadata -- needs the role's READ and UPDATE on experiments."
by = [
    "test:backend/tests/unit/api/v1/endpoints/test_experiment_permissions.py::test_experiment_endpoint_permissions",
    "test:backend/tests/unit/api/v1/endpoints/test_experiment_permissions.py::test_experiment_state_permissions",
]

[[unit]]
text = "Who owns the experiment is not considered, so ANALYST and VIEWER change no experiment, including one they own."
by = ["test:backend/tests/integration/api/test_experiment_access_by_role.py::test_status_by_route_and_caller"]

[[unit]]
text = "Deleting one (DELETE /{experiment_id}) needs the role's READ and DELETE on experiments, and the experiment must be in DRAFT."
by = ["test:backend/tests/unit/api/v1/endpoints/test_experiment_permissions.py::test_experiment_endpoint_permissions"]

[[unit]]
text = "Who owns the experiment is not considered: ADMIN and DEVELOPER may delete any DRAFT experiment."
by = ["test:backend/tests/integration/api/test_experiment_access_by_role.py::test_status_by_route_and_caller"]

[[unit]]
text = "A clone (POST /{experiment_id}/clone) needs READ on the source and the role's CREATE on experiments."
by = [
    "test:backend/tests/integration/api/test_experiments_lifecycle_api.py::TestCloneExperiment::test_admin_can_clone_experiment",
    "test:backend/tests/integration/api/test_experiments_lifecycle_api.py::TestCloneExperiment::test_analyst_cannot_clone_other_users_experiment",
]

[[unit]]
text = "A superuser passes every one of these checks."
by = ["test:backend/tests/unit/core/test_permissions.py::TestCheckPermission::test_superuser_permission"]

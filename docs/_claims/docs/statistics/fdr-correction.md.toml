# `python scripts/doc_claims.py check`.
document = "docs/statistics/fdr-correction.md"

[[unit]]
text = "Benjamini-Hochberg FDR Correction"
by = ["exempt:baseline"]

[[unit]]
text = "The Benjamini-Hochberg (BH) procedure controls the False Discovery Rate (FDR) — the expected proportion of false positives among all rejected hypotheses — when testing multiple metrics simultaneously."
by = [
    "test:backend/tests/unit/services/test_fdr_correction.py::TestBHVsBonferroni::test_bh_finds_more_discoveries_than_bonferroni_on_classic_example",
    "test:backend/tests/unit/services/test_fdr_correction.py::TestBHVsBonferroni::test_bh_with_many_tests_still_controls_fdr",
]

[[unit]]
text = "The BH Procedure"
by = ["exempt:baseline"]

[[unit]]
text = "Given $m$ raw p-values $p_1, p_2, \\ldots, p_m$ and a desired FDR threshold $\\alpha$:"
by = ["exempt:baseline"]

[[unit]]
text = "Sort p-values ascending: $p_{(1)} \\leq p_{(2)} \\leq \\cdots \\leq p_{(m)}$."
by = ["test:backend/tests/unit/services/test_fdr_correction.py::TestBHThresholdSensitivity::test_known_result_6_significant_at_fdr_10"]

[[unit]]
text = "Compute the BH threshold for rank $k$: $T_k = \\frac{k}{m} \\times \\alpha$."
by = ["exempt:baseline"]

[[unit]]
text = "Find the largest rank $k^$ such that $p_{(k^)} \\leq T_{k^}$."
by = ["exempt:baseline"]

[[unit]]
text = "Reject all hypotheses with rank $\\leq k^$ (declare significant)."
by = ["exempt:baseline"]

[[unit]]
text = "Example"
by = ["exempt:baseline"]

[[unit]]
text = "10 p-values with $\\alpha = 0.10$:"
by = ["exempt:baseline"]

[[unit]]
text = "Rank | p-value | BH threshold $k/10 \\times 0.10$ | Reject?"
by = ["exempt:baseline"]

[[unit]]
text = "1 | 0.001 | 0.010 | Yes"
by = ["exempt:baseline"]

[[unit]]
text = "2 | 0.008 | 0.020 | Yes"
by = ["exempt:baseline"]

[[unit]]
text = "3 | 0.039 | 0.030 | No"
by = ["exempt:baseline"]

[[unit]]
text = "4 | 0.041 | 0.040 | No"
by = ["exempt:baseline"]

[[unit]]
text = "5 | 0.042 | 0.050 | Yes"
by = ["exempt:baseline"]

[[unit]]
text = "6 | 0.060 | 0.060 | Yes ← largest k"
by = ["exempt:baseline"]

[[unit]]
text = "7 | 0.074 | 0.070 | No"
by = ["exempt:baseline"]

[[unit]]
text = "8 | 0.205 | 0.080 | No"
by = ["exempt:baseline"]

[[unit]]
text = "9 | 0.212 | 0.090 | No"
by = ["exempt:baseline"]

[[unit]]
text = "10 | 0.391 | 0.100 | No"
by = ["exempt:baseline"]

[[unit]]
text = "Result: Reject 6 hypotheses (all with rank $\\leq 6$), even though ranks 3–5 individually don't satisfy their per-rank threshold — the step-up property means we look for the largest k, so ranks 1, 2, 5, 6 passing brings along ranks 3 and 4."
by = ["test:backend/tests/unit/services/test_fdr_correction.py::TestBHThresholdSensitivity::test_known_result_6_significant_at_fdr_10"]

[[unit]]
text = "At $\\alpha = 0.05$ with the same p-values, only 2 are significant (k=1: 0.001≤0.005 ✓, k=2: 0.008≤0.010 ✓, k=3: 0.039>0.015 ✗)."
by = ["test:backend/tests/unit/services/test_fdr_correction.py::TestBHProcedureBasic::test_known_result_2_significant_from_10"]

[[unit]]
text = "Adjusted P-values"
by = ["exempt:label"]

[[unit]]
text = "The BH-adjusted p-value for rank $k$ is:"
by = ["exempt:baseline"]

[[unit]]
text = "$$p_{\\text{adj}}(k) = \\min\\left(\\frac{p_{(k)} \\cdot m}{k},\\ 1.0\\right)$$"
by = [
    "test:backend/tests/unit/services/test_fdr_correction.py::TestBHMonotonicity::test_adjusted_p_values_non_decreasing",
    "test:backend/tests/unit/services/test_fdr_correction.py::TestBHMonotonicity::test_adjusted_p_values_bounded_by_1",
]

[[unit]]
text = "with monotonicity enforced from right to left: $$p_{\\text{adj,mono}}(k) = \\min\\left(p_{\\text{adj}}(k),\\ p_{\\text{adj,mono}}(k+1)\\right)$$"
by = ["exempt:baseline"]

[[unit]]
text = "A metric is significant when its rank is at most $k^$, that is, when its adjusted p-value is at most $\\alpha$."
by = ["test:backend/tests/unit/services/test_fdr_correction.py::TestBHThresholdSensitivity::test_known_result_6_significant_at_fdr_10"]

[[unit]]
text = "REST API Reference"
by = ["exempt:baseline"]

[[unit]]
text = "POST /api/v1/results/{experiment_id}/fdr-correction"
by = ["exempt:baseline"]

[[unit]]
text = "Apply Benjamini-Hochberg FDR correction to per-metric p-values."
by = ["docex:docs/statistics/fdr-correction.md#1 revenue true"]

[[unit]]
text = "The p-values are the ones you send: the experiment in the path must exist, but its own data isn't read."
by = ["test:backend/tests/integration/api/test_post_strat_api.py::TestFDRCorrectionEndpoint::test_fdr_correction_nonexistent_experiment_returns_404"]

[[unit]]
text = "Any logged-in user can call it."
by = [
    "test:backend/tests/integration/api/test_experiment_errors_fixed_message.py",
    "test:backend/tests/integration/api/test_post_strat_api.py::TestPostStratAuthRequired::test_fdr_correction_requires_auth",
]

[[unit]]
text = "Request body:"
by = ["exempt:baseline"]

[[unit]]
text = "Field | Type | Required | Default | Description"
by = ["exempt:baseline"]

[[unit]]
text = "p_values | dict[str, float] | Yes | — | Metric name → raw p-value. All values in [0,1]. Non-empty."
by = [
    "test:backend/tests/integration/api/test_post_strat_api.py::TestFDRCorrectionEndpoint::test_fdr_correction_pvalue_above_1_returns_422",
    "test:backend/tests/integration/api/test_post_strat_api.py::TestFDRCorrectionEndpoint::test_fdr_correction_pvalue_below_0_returns_422",
    "test:backend/tests/integration/api/test_post_strat_api.py::TestFDRCorrectionEndpoint::test_fdr_correction_empty_pvalues_returns_422",
]

[[unit]]
text = "fdr_threshold | float | No | 0.05 | FDR control level α in [0,1]."
by = [
    "test:backend/tests/integration/api/test_post_strat_api.py::TestFDRCorrectionEndpoint::test_fdr_correction_invalid_threshold_returns_422",
    "test:backend/tests/integration/api/test_post_strat_api.py::TestFDRCorrectionEndpoint::test_fdr_correction_custom_threshold",
]

[[unit]]
text = "Response (200):"
by = ["exempt:baseline"]

[[unit]]
text = "The response is sorted by rank ascending (smallest raw p-value first)."
by = [
    "test:backend/tests/unit/services/test_fdr_correction.py::TestBHMonotonicity::test_raw_p_values_sorted_ascending_by_rank",
    "test:backend/tests/unit/services/test_fdr_correction.py::TestBHProcedureBasic::test_rank_1_is_smallest_p_value",
]


[[unit]]
text = "Integration with the Existing Results API"
by = ["exempt:baseline"]

[[unit]]
text = "Each experiment stores a correction_method (none, bonferroni or benjamini_hochberg), Benjamini-Hochberg unless it was created with another, and GET /api/v1/results/{experiment_id} applies it across the treatments of each metric: each treatment then carries an adjusted_p_value, and is_significant is decided on it."
by = [
    "test:backend/tests/integration/api/test_experiment_correction_settings_api.py::test_a_new_experiment_stores_benjamini_hochberg_at_095",
    "test:backend/tests/integration/api/test_experiment_correction_settings_api.py::test_create_refuses_a_value_outside_the_contract",
    "test:backend/tests/unit/services/test_results_correction_pins.py",
]

[[unit]]
text = "With one treatment the adjusted p-value equals the p-value and no decision changes."
by = [
    "test:backend/tests/unit/services/test_results_correction_pins.py::test_with_one_valid_treatment_a_correction_reports_the_p_value",
    "test:backend/tests/unit/services/test_results_correction_pins.py::test_with_one_valid_treatment_every_method_gives_the_same_output",
]

[[unit]]
text = "The stored method can be changed only while the experiment is a draft."
by = ["test:backend/tests/integration/api/test_experiment_correction_settings_api.py::test_a_superuser_cannot_change_the_settings_once_out_of_draft"]

[[unit]]
text = "A request can name another method for itself with the correction_method query parameter; none shows the uncorrected numbers."
by = ["docex:docs/statistics/fdr-correction.md#\"correction_method\": \"benjamini_hochberg\""]

[[unit]]
text = "The response's correction_method says which one was applied:"
by = ["exempt:baseline"]

[[unit]]
text = "It prints the correction applied and the experiment's metric, Checkout Completion."
by = ["docex:docs/statistics/fdr-correction.md#\"correction_method\": \"benjamini_hochberg\""]

[[unit]]
text = "The POST /api/v1/results/{experiment_id}/fdr-correction endpoint provides finer control: you supply any set of p-values (from post-stratification, CUPED, or raw analysis) and receive BH-corrected results immediately."
by = ["docex:docs/statistics/fdr-correction.md#1 revenue true"]

by = ["exempt:label"]

[[unit]]
text = "Send the returned token to Alice."
by = ["exempt:instruction"]

[[unit]]
text = "Alice can accept the invite once she is logged into the platform with alice@example.com (in any case); any other account gets 403 with code invite_email_mismatch:"

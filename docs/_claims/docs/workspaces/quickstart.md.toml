[[unit]]
text = "Team Workspaces — Quickstart"
by = ["exempt:label"]

[[unit]]
text = "Part of the workspaces module"
by = [
    "test:modules/backend/tests/smoke/test_workspace_routes_contract.py::test_the_positive_control_is_present",
    "test:backend/tests/smoke/test_core_boundary.py::test_register_core_routers_mounts_no_module_route",
]

[[unit]]
text = "Team workspaces is one of the optional modules -- present in the full profile, absent from the core one."
by = [
    "test:modules/backend/tests/smoke/test_workspace_routes_contract.py::test_the_positive_control_is_present",
    "test:backend/tests/smoke/test_core_boundary.py::test_register_core_routers_mounts_no_module_route",
]

[[unit]]
text = "A core deployment does not serve these routes."
by = ["test:backend/tests/smoke/test_core_boundary.py::test_register_core_routers_mounts_no_module_route"]

[[unit]]
text = "See Modules and profiles for what each profile includes and how to run the full one."
by = ["exempt:navigation"]

[[unit]]
text = "This guide shows you how to create a workspace, add your team to it, and connect an SDK."
by = ["exempt:navigation"]

[[unit]]
text = "A workspace groups members and their workspace roles."
by = ["journey:workspaces-quickstart#add-member", "journey:workspaces-quickstart#members"]

[[unit]]
text = "It does not limit which experiments, feature flags or API keys anyone can see or change: that is decided by each user's platform role across the whole installation."
by = ["untested:T"]

[[unit]]
text = "See the Workspace Overview."
by = ["exempt:navigation"]

[[unit]]
text = "1. Create a Workspace"
by = ["exempt:label"]

[[unit]]
text = "Any authenticated platform user can create a workspace."
by = [
    "journey:workspaces-quickstart#create",
    "test:modules/backend/tests/integration/api/test_workspaces_api.py::TestCreateWorkspace::test_create_workspace_developer_can_create",
]

[[unit]]
text = "Response (201 Created):"
by = ["journey:workspaces-quickstart#create"]

[[unit]]
text = "The user who creates the workspace is automatically assigned the OWNER role."
by = ["journey:workspaces-quickstart#owner"]

[[unit]]
text = "The dashboard's Workspaces page (/workspaces) then lists the workspace, with its name, slug and description."
by = ["journey:workspaces-quickstart#workspaces-page"]


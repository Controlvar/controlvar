[[unit]]
text = "3. Connect an SDK with a Platform API Key"
by = ["exempt:label"]

[[unit]]
text = "Workspaces do not issue API keys."
by = [
    "test:modules/backend/tests/integration/api/test_workspaces_api.py::TestWorkspaceAPIKeyRoutesAreGone::test_every_key_operation_is_404",
    "test:modules/backend/tests/smoke/test_workspace_routes_contract.py::test_no_workspace_api_key_route",
]

[[unit]]
text = "A superuser can create a platform key in the dashboard under Admin → API Keys, and a key acts as the user who created it."
by = ["untested:T"]

[[unit]]
text = "The SDKs authenticate with a platform API key, created with POST /api/v1/api-keys -- not with a workspace key."
by = ["journey:workspaces-quickstart#api-key", "journey:workspaces-quickstart#sdk-call"]

[[unit]]
text = "See API Key Management for how to create one, and the SDK guide for how to pass it to each SDK."

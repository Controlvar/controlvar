[[unit]]
text = "Unchanged means no setting of the flag changed: an edit, including a rename, or a status change, a rollout step or a safety rollback restarts the count."
by = [
    "test:backend/tests/unit/services/test_stale_flags.py::test_v7_an_edit_restarts_the_count",
    "test:backend/tests/integration/api/test_stale_flags_api.py::test_v7_a_rename_through_the_api_restarts_the_count",
    "test:backend/tests/integration/api/test_stale_flags_api.py::test_v7_every_other_change_restarts_the_count",
]

[[unit]]
text = "The count starts from the flag's updated_at."
by = [
    "test:backend/tests/unit/services/test_stale_flags.py::test_v1_a_flag_unchanged_for_exactly_n_days_is_unchanged",
    "test:backend/tests/unit/services/test_stale_flags.py::test_v7_an_edit_restarts_the_count",
]

[[unit]]
text = "The request for this feature (#1808) noted that updated_at is not the time the flag's answer last changed, and the platform does not record that time."
by = ["exempt:theory"]

[[unit]]
text = "It is used anyway: every change to a flag sets it, so a flag marked unchanged has not changed at all in N days."
by = [
    "test:backend/tests/integration/api/test_stale_flags_api.py::test_v7_a_rename_through_the_api_restarts_the_count",
    "test:backend/tests/integration/api/test_stale_flags_api.py::test_v7_every_other_change_restarts_the_count",
]

[[unit]]
text = "The cost is that a change that leaves the answer as it was, a rename for example, also restarts the count."
by = ["test:backend/tests/integration/api/test_stale_flags_api.py::test_v7_a_rename_through_the_api_restarts_the_count"]


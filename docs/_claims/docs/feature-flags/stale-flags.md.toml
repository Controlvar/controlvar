# What verifies each unit of docs/feature-flags/stale-flags.md (#1808).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`. The definition is held by the pure
# tests in backend/tests/unit/services/test_stale_flags.py; what the database
# decides (what counts as an evaluation, the guard, the filter) by
# backend/tests/integration/api/test_stale_flags_api.py.
document = "docs/feature-flags/stale-flags.md"

[[unit]]
text = "Stale Flags"
by = ["exempt:label"]

[[unit]]
text = "A flag that has served everyone the same answer for weeks, or that nothing has asked about, is usually ready to come out of your code."
by = ["exempt:advice"]

[[unit]]
text = "The flag list marks such a flag as stale and says why."
by = [
    "test:backend/tests/integration/api/test_stale_flags_api.py::test_v14_stale_true_false_and_omitted_are_exact_sets",
]

[[unit]]
text = "It is a suggestion: listing changes no flag, and nothing is archived or turned off for you."
by = [
    "test:backend/tests/integration/api/test_stale_flags_api.py::test_v19_listing_changes_no_flag_and_records_nothing",
]

[[unit]]
text = "The definition is beta: its conditions and threshold may change; the fields will not."
by = [
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot",
]

[[unit]]
text = "The examples run against the Quick Start stack, in one terminal, in order: later steps use the $TOKEN, $KEY and $FLAG_ID an earlier one sets."

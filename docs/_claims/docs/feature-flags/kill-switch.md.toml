# What verifies each unit of docs/feature-flags/kill-switch.md (#1519).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`. Every number on the page is held by
# backend/tests/unit/sdk/test_kill_switch_numbers.py, which reads it from the
# SDK's own source.
document = "docs/feature-flags/kill-switch.md"

[[unit]]
text = "Turning a Flag Off"
by = ["exempt:label"]

[[unit]]
text = "Turning a flag off is the kill switch: the switch on the flag's page, \"is_active\": false (or POST …/deactivate), or a safety rollback to 0%."
by = [
    "journey:feature-flag-create#turn-off",
    "test:backend/tests/integration/api/test_feature_flags_api.py::TestFeatureFlagsActivateDeactivate::test_deactivate_active_flag",
    "test:backend/tests/integration/api/test_rollback_to_zero_off.py::test_p8_p9_the_monitor_turns_the_flag_off_once",
]

[[unit]]
text = "The server's answer changes at once: from the next evaluation it answers enabled: false with reason: \"inactive\", and it keeps no cache of flags."
by = [
    "test:backend/tests/integration/api/test_feature_flag_kill_switch.py::TestKillSwitch::test_disabled_flag_evaluates_off_for_sdk_clients",
    "test:backend/tests/integration/api/test_flag_reads_after_writers.py::test_the_detail_and_list_show_the_writers_change",
]

[[unit]]
text = "Each client, though, keeps serving an answer it already has until that answer expires."
by = [
    "test:sdk/js/__tests__/client.test.ts::caches a success for 300000 ms by default",
    "test:sdk/python/tests/test_client.py::TestGetFeatureFlag::test_cache_expires_after_ttl",
    "test:sdk/react-native/__tests__/client.test.ts::re-fetches after the TTL expires",
]

[[unit]]
text = "The same goes for any change to a flag: its rollout percentage, its rules, a rollback to a lower percentage."
by = [
    "test:sdk/js/__tests__/client.test.ts::caches a success for 300000 ms by default",
    "test:sdk/python/tests/test_client.py::TestGetFeatureFlag::test_cache_expires_after_ttl",
]

[[unit]]
text = "How long each client takes"
by = ["exempt:label"]

[[unit]]
text = "With the defaults, every client below serves the change within 5 minutes, the next time your code asks it for the flag, except the edge SDK: 1 minute, or about 2 with a KV store, plus the store's own propagation time (an instance can copy a KV entry up to 60 seconds old into its memory for another 60)."
by = [
    "test:backend/tests/unit/sdk/test_kill_switch_numbers.py::test_every_sdk_but_the_edge_sdk_keeps_an_answer_five_minutes_and_the_edge_sdk_one",
    "test:backend/tests/unit/sdk/test_kill_switch_numbers.py::test_the_edge_figure_with_a_kv_store_is_its_two_lifetimes_about_two_minutes",
    "test:backend/tests/unit/sdk/test_kill_switch_numbers.py::test_each_client_takes_the_pinned_constant_as_its_default",
    "test:sdk/edge/__tests__/client.test.ts::writes successful results to the store with the cache TTL, keyed per user + key",
]


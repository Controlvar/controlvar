[[unit]]
text = "Client | What it serves"
by = ["exempt:label"]

[[unit]]
text = "React Native, iOS | The last answer it stored for that user and flag, with no time limit, also after the app restarts (offlineFallback / enableOfflineFallback, on by default). A flag turned off while a device is offline stays on there until the device reaches the API once. Turn the fallback off if serving off is safer than serving a stale on."
by = [
    "test:sdk/react-native/__tests__/client.test.ts::on API failure returns the last-known evaluation however long ago it expired",
    "test:sdk/react-native/__tests__/client.test.ts::offlineFallback defaults to true",
    "test:sdk/react-native/__tests__/client.test.ts::offlineFallback=false never touches AsyncStorage",
    "test:sdk/ios/Tests/ControlvarTests/ExperimentationClientTests.swift::testEvaluateFlag_networkErrorFallsBackToOfflineStore",
    "test:backend/tests/unit/sdk/test_kill_switch_numbers.py::test_the_mobile_sdks_serve_their_stored_answer_offline_by_default",
]

[[unit]]
text = "Android, Flutter | The same, from the offline store: in memory by default, so until the app's process ends; across restarts with a persistent store (a SharedPreferences adapter on Android, SharedPreferencesOfflineStore on Flutter)."
by = [
    "test:sdk/android/sdk/src/test/kotlin/ExperimentationClientTest.kt::evaluateFlag falls back to offline store on server error",
    "test:sdk/flutter/test/client_test.dart::stores the evaluation and serves it when the network fails",
    "test:sdk/flutter/test/shared_preferences_offline_store_test.dart::works end-to-end with the client on network failure",
    "test:backend/tests/unit/sdk/test_kill_switch_numbers.py::test_the_mobile_sdks_serve_their_stored_answer_offline_by_default",
]

[[unit]]
text = "Every other SDK | The cached answer until its lifetime ends; then the call fails, and the SDK answers as for any failure (see its page)."
by = [
    "test:sdk/python/tests/test_client.py::TestGetFeatureFlag::test_cache_expires_after_ttl",

[[unit]]
text = "Local evaluation | The last ruleset it loaded, with no time limit unless you set maxStaleMs / max_stale_seconds. A failed refresh is tried again later each time, up to 5 minutes apart, so once the API answers again a change can take up to 5 minutes more. A 401, 403 or 404 drops the ruleset at once: every flag then goes to the server, and the ruleset is asked for again every 10 minutes."
by = [
    "test:sdk/js/__tests__/local.test.ts::without maxStaleMs, a ruleset whose refreshes have failed for a day is still used",
    "test:sdk/python/tests/test_local.py::test_without_max_stale_seconds_a_ruleset_whose_refreshes_failed_for_a_day_is_still_used",
    "test:sdk/js/__tests__/local.test.ts::backs off exponentially to 5 minutes",

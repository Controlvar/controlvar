    "test:backend/tests/integration/services/test_safety_service_coverage.py::TestCheckFeatureFlagSafety::test_error_rate_metric_breaches_critical_threshold",
    "test:backend/tests/integration/services/test_safety_service_coverage.py::TestCheckFeatureFlagSafety::test_warning_only_breach_is_reported_but_still_healthy",

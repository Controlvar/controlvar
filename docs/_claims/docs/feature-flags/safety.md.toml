[[unit]]
text = "Safety Monitoring"
by = ["exempt:label"]

[[unit]]
text = "Safety monitoring checks each active feature flag's error rate and latency against thresholds you set."
by = [
    "test:backend/tests/integration/api/test_safety_defaults_and_manual_rollback.py::test_a_flag_with_its_own_configuration_is_checked_against_its_own_thresholds_only",
    "test:backend/tests/integration/api/test_rollback_to_zero_off.py::test_p8_p9_the_monitor_turns_the_flag_off_once",
]

[[unit]]
text = "When a flag breaches one and automatic rollbacks are turned on, it rolls the flag back."
by = [
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_rollback_uses_config_rollback_percentage",
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_no_rollback_when_automatic_rollbacks_disabled",
]

[[unit]]
text = "Its endpoints are under /api/v1/safety."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "What Safety Monitoring Does"
by = ["exempt:label"]

[[unit]]
text = "The safety monitor runs every 5 minutes by default (SAFETY_CHECK_INTERVAL_MINUTES)."
by = [
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_settings_have_scheduler_interval_defaults",
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_interval_defaults_come_from_settings",
]

[[unit]]
text = "For every ACTIVE flag, whatever its rollout_percentage (a flag at 0% still serves the users its targeting rules match), it:"
by = [
    "test:backend/tests/integration/api/test_rollback_to_zero_off.py::test_p3_a_rule_only_flag_can_be_rolled_back",
    "test:backend/tests/integration/api/test_rollback_to_zero_off.py::test_p8_p9_the_monitor_turns_the_flag_off_once",
]

[[unit]]
text = "Loads the flag's safety configuration (or the platform default when the flag has none) and skips the flag if monitoring is not enabled."
by = [
    "test:backend/tests/integration/services/test_safety_service_coverage.py::TestAsyncFeatureFlagSafetyConfig::test_get_missing_config_returns_defaults_from_settings",
    "test:backend/tests/integration/services/test_safety_service_coverage.py::TestCheckFeatureFlagSafety::test_disabled_config_is_healthy_with_no_metrics",
]

[[unit]]
text = "Reads the current value of each configured metric over the last 15 minutes: error metrics come from error_logs (relative to the flag's evaluations in raw_metrics), latency metrics from raw_metrics."
by = [
    "test:backend/tests/integration/api/test_safety_defaults_and_manual_rollback.py::test_the_check_reads_the_last_15_minutes_of_errors_and_latency",
    "test:backend/tests/integration/services/test_safety_service_coverage.py::TestGetErrorMetrics::test_computes_rate_and_error_type_breakdown",
    "test:backend/tests/integration/services/test_safety_service_coverage.py::TestGetLatencyMetrics::test_computes_real_latency_statistics",
]

[[unit]]
text = "Compares each value with the metric's critical_threshold using its comparison_type."
by = [

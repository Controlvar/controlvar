[[unit]]
text = "Which errors count"
by = ["exempt:label"]

[[unit]]
text = "A flag's error metrics, and so automatic rollback, count two kinds of error: flag evaluations that fail on the server, and error reports sent to POST /api/v1/tracking/errors or /errors/batch with a server-side key, an API key with the sdk:ruleset scope whose owner can change feature flags (ADMIN, DEVELOPER or a superuser)."
by = [
    "test:backend/tests/integration/api/test_error_report_source.py::test_a_report_sent_with_a_server_side_key_rolls_back",
    "test:backend/tests/integration/api/test_error_report_source.py::test_an_evaluation_that_fails_on_the_server_still_rolls_back",
    "test:backend/tests/integration/api/test_error_report_source.py::test_rows_of_every_stored_shape_are_counted_as_documented",
]

[[unit]]
text = "Error reports sent with any other key, such as the key in a browser or mobile app, are stored and counted separately in the check (details.uncounted_error_count), but do not count toward the error rate or a rollback."
by = [
    "test:backend/tests/integration/api/test_error_report_source.py::test_a_report_sent_with_a_key_without_the_scope_does_not_roll_back",
    "test:backend/tests/integration/api/test_error_report_source.py::test_the_check_endpoint_shows_the_reports_it_does_not_count",
]

[[unit]]
text = "The same goes for an sdk:ruleset key whose owner has since lost the role."
by = ["test:backend/tests/integration/api/test_error_report_source.py::test_a_scoped_key_whose_owner_can_no_longer_change_flags_does_not_count"]

[[unit]]
text = "To have app errors count, send them to your server and forward them from there with a server-side key; see Reporting client-side errors."
by = ["exempt:advice"]


[[unit]]
text = "Best Practices"
by = ["exempt:label"]

[[unit]]
text = "Set thresholds relative to baseline"
by = ["exempt:advice"]

[[unit]]
text = "Measure your baseline error rate and latency before enabling safety monitoring."
by = ["exempt:advice"]

[[unit]]
text = "If your API normally returns 2% errors, a 1% threshold causes false positives."
by = ["exempt:advice"]

[[unit]]
text = "A reasonable critical threshold is 2× your baseline: baseline error rate 2% → critical_threshold: 0.04; baseline p95 latency 200 ms → critical_threshold: 400."
by = ["exempt:advice"]

[[unit]]
text = "Use a warning threshold as an early signal"
by = ["exempt:advice"]

[[unit]]
text = "Pair a lower warning_threshold with the critical one; warnings show up in the check details and in the dashboard without touching traffic."
by = ["test:backend/tests/integration/services/test_safety_service_coverage.py::TestCheckFeatureFlagSafety::test_warning_only_breach_is_reported_but_still_healthy"]

[[unit]]
text = "Use tight thresholds for critical paths"
by = ["exempt:advice"]

[[unit]]
text = "For features that touch payments, authentication or core user flows: error_rate critical 0.02, p95_latency critical 300."
by = ["exempt:advice"]

[[unit]]
text = "Combine with gradual rollouts"
by = ["exempt:advice"]

[[unit]]
text = "Safety monitoring is most effective with gradual rollouts."
by = ["exempt:advice"]

[[unit]]
text = "A problem affecting 5% of users is much easier to contain than one affecting 100%."
by = ["exempt:advice"]

[[unit]]
text = "See Rollout Schedules."
by = ["exempt:navigation"]

[[unit]]
text = "Flags with large targeting rules"
by = ["exempt:advice"]

[[unit]]
text = "For a flag with large targeting rules, either set no threshold on latency, avg_latency, p95_latency or max_latency, or leave automatic rollback off."
by = ["exempt:advice"]

[[unit]]
text = "A flag without a safety configuration of its own uses the global default thresholds, so to take a latency threshold off one flag, give that flag its own configuration without one."
by = ["test:backend/tests/integration/api/test_safety_defaults_and_manual_rollback.py::test_a_flag_with_its_own_configuration_is_checked_against_its_own_thresholds_only"]

[[unit]]
text = "Test the rollback path"
by = ["exempt:advice"]

[[unit]]
text = "Before a major launch, trigger a manual rollback in staging to confirm that the flag turns off as expected."
by = ["exempt:advice"]

[[unit]]
text = "A manual rollback sends no Slack alert or webhook event; only an automatic rollback does."
by = [
    "test:backend/tests/integration/api/test_safety_defaults_and_manual_rollback.py::test_a_manual_rollback_sends_no_alert_and_no_webhook_event",

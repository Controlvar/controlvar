[[unit]]
text = "Gradual Rollouts"
by = ["exempt:baseline"]

[[unit]]
text = "A gradual rollout raises a feature flag's rollout percentage over time, in controlled stages."
by = ["exempt:baseline"]

[[unit]]
text = "Instead of flipping a flag from 0% to 100% in one step, you roll out to 10%, watch for problems, expand to 50%, confirm everything is healthy, then go to 100%."
by = ["exempt:baseline"]

[[unit]]
text = "What a Rollout Schedule Is"
by = ["exempt:baseline"]

[[unit]]
text = "A rollout schedule is a plan attached to a feature flag."
by = ["exempt:baseline"]

[[unit]]
text = "It defines:"
by = ["exempt:baseline"]

[[unit]]
text = "a sequence of stages, each with a target rollout percentage;"
by = ["exempt:baseline"]

[[unit]]
text = "a trigger type for each stage: time-based (the scheduler starts it at its start_date, once the stages before it are complete) or manual (it starts only when you advance it);"
by = [
    "test:backend/tests/unit/core/test_rollout_scheduler.py::TestRolloutScheduler::test_is_stage_eligible_for_activation",
    "test:backend/tests/unit/core/test_rollout_stage_order.py::test_a_time_based_stage_starts_once_the_stage_before_it_is_complete",
    "test:backend/tests/unit/core/test_rollout_stage_order.py::test_a_time_based_stage_after_a_pending_manual_stage_never_starts",
    "test:backend/tests/integration/api/test_rollout_schedules_api.py::TestRolloutStages::test_advance_manual_stage_on_active_schedule",
]

[[unit]]
text = "optional start and end dates for the whole schedule."
by = ["test:backend/tests/integration/api/test_rollout_schedules_api.py::TestCreateScheduleValidation::test_create_schedule_end_before_start_returns_422"]

[[unit]]
text = "The platform's background scheduler processes active schedules every 15 minutes (ROLLOUT_CHECK_INTERVAL_MINUTES) and starts a time-based stage once its start_date has passed and every stage before it is complete."
by = [
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_settings_have_scheduler_interval_defaults",
    "test:backend/tests/unit/schedulers/test_safety_scheduler_rollback.py::test_interval_defaults_come_from_settings",
    "test:backend/tests/unit/core/test_rollout_stage_order.py::test_a_time_based_stage_starts_once_the_stage_before_it_is_complete",
    "test:backend/tests/unit/core/test_rollout_stage_order.py::test_a_time_based_stage_with_a_future_start_date_waits_after_the_one_before",
    "test:backend/tests/unit/core/test_rollout_stage_order.py::test_a_time_based_stage_after_a_manual_stage_in_progress_never_starts",
]

[[unit]]
text = "Once the schedule's end_date has passed, the scheduler passes the schedule over: no stage starts or completes by itself, and the schedule stays active."
by = [
    "test:backend/tests/integration/services/test_rollout_end_date.py::test_a_schedule_past_its_end_date_is_passed_over",
    "test:backend/tests/integration/services/test_rollout_end_date.py::test_a_schedule_before_its_end_date_advances",
]


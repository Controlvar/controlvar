[[unit]]
text = "The server offers six tools:"
by = ["test:sdk/mcp/__tests__/surface.test.ts::the six tools and their annotations, whatever tools.json says"]

[[unit]]
text = "Tool | What it answers | API route"
by = ["exempt:label"]

[[unit]]
text = "list_feature_flags | The feature flags, a page at a time | GET /api/v1/feature-flags/"
by = ["mechanism:mcp-page-tools"]

[[unit]]
text = "get_feature_flag | One feature flag, by its key | GET /api/v1/feature-flags/"
by = ["mechanism:mcp-page-tools"]

[[unit]]
text = "evaluate_feature_flag | What a flag serves one user | POST /api/v1/feature-flags/evaluate/{flag_key}"
by = ["mechanism:mcp-page-tools"]

[[unit]]
text = "list_experiments | The experiments, a page at a time | GET /api/v1/experiments/"
by = ["mechanism:mcp-page-tools"]

[[unit]]
text = "get_experiment | One experiment, by its id | GET /api/v1/experiments/{experiment_id}"
by = ["mechanism:mcp-page-tools"]

[[unit]]
text = "get_experiment_results | An experiment's statistical results | GET /api/v1/experiments/{experiment_id}/results"
by = ["mechanism:mcp-page-tools"]

[[unit]]
text = "None of them changes a flag, an experiment or a setting."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::the six tools and their annotations, whatever tools.json says",
    "test:sdk/mcp/__tests__/surface.test.ts::%s is unknown and sends nothing",
]

[[unit]]
text = "A list tool returns at most 100 items and the total, and the assistant asks for the next page with skip."
by = [
    "test:sdk/mcp/__tests__/tools.test.ts::list_feature_flags: the defaults are limit 50 and skip 0",

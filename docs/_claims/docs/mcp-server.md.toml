]

[[unit]]
text = "list_feature_flags also takes stale: true lists only the flags that look ready to remove and false the others, and each flag carries stale and stale_reasons; see Stale Flags."
by = [
    "test:sdk/mcp/__tests__/tools.test.ts::list_feature_flags: stale is sent as true or false, exactly, and only when given",

[[unit]]
text = "The MCP Server and the AI Endpoints"
by = ["exempt:label"]

[[unit]]
text = "The Controlvar MCP server lets an AI assistant such as Claude Code, Claude Desktop or Cursor read your instance: list and read feature flags, evaluate a flag for a user, list experiments and read their results."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::the six tools and their annotations, whatever tools.json says",
    "test:sdk/mcp/__tests__/tools.test.ts::get_experiment and get_experiment_results: the answer as served, on the checked routes",
]

[[unit]]
text = "It runs on your computer, started by the assistant, and calls your instance's API with your own API key, so it sees what your role can see."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::initialize at %s",
    "test:sdk/mcp/__tests__/tools.test.ts::list_feature_flags: the query, the projection, and only the configured key",
    "test:sdk/mcp/__tests__/tools.test.ts::a role refused (403)",
]

[[unit]]
text = "It changes no flag or experiment; evaluating a flag is recorded as one evaluation, as an SDK's is."
by = [
    "test:sdk/mcp/__tests__/surface.test.ts::the six tools and their annotations, whatever tools.json says",
    "test:sdk/mcp/__tests__/surface.test.ts::%s is unknown and sends nothing",
    "test:sdk/mcp/__tests__/tools.test.ts::evaluate_feature_flag: a POST with the user and context in the body, config dropped",
    "test:backend/tests/integration/services/test_feature_flag_targeting_rules.py::TestNativeRulesAndReasons::test_evaluation_records_matched_rule_id",
]

[[unit]]
text = "Nothing on your instance answers an MCP client; add the server by command, not by URL."
by = ["test:backend/tests/unit/api/test_ai_design_endpoints.py::TestMCPManifestEndpoint::test_nothing_answers_an_mcp_client"]

[[unit]]
text = "The platform also serves REST endpoints under /api/v1/ai/ that suggest an experiment design, interpret a result, estimate a sample size and list experiment templates."
by = [
    "docex:docs/mcp-server.md#\"primary_metric\": \"activation_rate\"",

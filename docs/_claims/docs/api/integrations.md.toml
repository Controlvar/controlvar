[[unit]]
text = "What a delivery does"
by = ["exempt:baseline"]

[[unit]]
text = "An authenticated delivery is acknowledged, and nothing in the platform changes because of it yet: no experiment, flag or other record is created or updated from a Jira, Salesforce or GitHub event."

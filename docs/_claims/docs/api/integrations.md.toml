by = ["docex:docs/api/integrations.md#New webhook_secret for jira:"]

[[unit]]
text = "The response body is discarded (-o /dev/null) and only its status code is kept, so that line is the only thing the recipe writes to standard output."
by = ["exempt:baseline"]

[[unit]]
text = "An error status prints nothing to standard output, shows curl's one-line error on standard error and exits non-zero: 404 for a type with no configuration (create it first), 403 for a token that is not an ADMIN's, 401 for a token that is missing, invalid or expired, 422 for a TYPE that is not jira, salesforce or github, and curl's own error when the API cannot be reached."
by = [
    "test:modules/backend/tests/unit/api/test_integrations_api.py::TestUpdateIntegration::test_update_nonexistent_returns_404",

]

[[unit]]
text = "The legacy SHA-1 X-Hub-Signature GitHub also sends is ignored."
by = [
    "test:modules/backend/tests/unit/api/test_integrations_api.py::TestWebhookEndpoints::test_github_webhook_rejects_the_shared_secret_header",

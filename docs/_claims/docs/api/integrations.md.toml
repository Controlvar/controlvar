[[unit]]
text = "Third-Party Integrations API"
by = ["exempt:baseline"]

[[unit]]
text = "Part of the integrations module"
by = ["exempt:baseline"]

[[unit]]
text = "Third-party integrations is one of the optional modules -- present in the full profile, absent from the core one."
by = ["exempt:baseline"]

[[unit]]
text = "A core deployment does not serve these routes."
by = ["test:backend/tests/smoke/test_core_boundary.py::test_register_core_routers_mounts_no_module_route"]

[[unit]]
text = "See Modules and profiles for what each profile includes and how to run the full one."
by = ["exempt:baseline"]

[[unit]]
text = "This document describes the third-party integrations endpoints: one stored configuration each for Jira, Salesforce and GitHub, and a webhook endpoint for each that authenticates what the service sends."
by = ["docex:docs/api/integrations.md#\"integration_type\": \"jira\""]

[[unit]]
text = "Nothing in the platform calls Jira, Salesforce or GitHub yet, and an authenticated delivery is acknowledged without changing anything in the platform (see What a delivery does)."
by = [
    "test:modules/backend/tests/unit/services/test_integration_wiring.py::test_nothing_calls_jira_salesforce_or_github",
    "test:modules/backend/tests/unit/services/test_integration_wiring.py::test_a_webhook_delivery_writes_no_row",
]

[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "Each integration is represented as a persisted configuration record containing the service type, credentials, and connection metadata."
by = ["docex:docs/api/integrations.md#\"integration_type\": \"jira\""]

[[unit]]
text = "Incoming events from external services are handled via per-integration webhook endpoints."
by = ["exempt:baseline"]

[[unit]]
text = "Base path: /api/v1/integrations (an optional module — a core deployment does not serve these routes)"
by = ["docex:docs/api/integrations.md#jira"]

[[unit]]
text = "One configuration per service."
by = ["exempt:baseline"]

[[unit]]
text = "An integration is identified by its type, not by an id: there is a unique constraint on integration_type, so the platform holds at most one Jira, one Salesforce and one GitHub configuration."
by = ["test:modules/backend/tests/integration/api/test_integrations_api.py::TestCreateIntegration::test_duplicate_type_returns_409"]


[[unit]]
text = "If your sender cannot sign the body, have it send the shared-secret header instead; a Salesforce Flow HTTP Callout can set one."
by = ["exempt:third-party"]

[[unit]]
text = "The body must be a JSON object: a SOAP/XML body is refused with 400 even with the right secret."
by = [
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestJiraWebhook::test_jira_webhook_invalid_json_returns_400_once_authenticated",

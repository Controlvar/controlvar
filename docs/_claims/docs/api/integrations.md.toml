[[unit]]
text = "A sender presents the secret one of two ways:"
by = ["exempt:baseline"]

[[unit]]
text = "Method | Header | Value"
by = ["exempt:baseline"]

[[unit]]
text = "Signature (preferred) | X-Hub-Signature-256, or X-Hub-Signature (Jira and Salesforce only) | sha256= + HMAC-SHA256 of the raw request body, hex"
by = [
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestJiraWebhook::test_jira_webhook_with_a_valid_signature_returns_200",
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestGitHubWebhook::test_github_webhook_valid_signature_returns_200",
]

[[unit]]
text = "Shared secret | X-Experimently-Webhook-Secret | The webhook_secret itself"
by = [
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestJiraWebhook::test_jira_webhook_with_the_shared_secret_returns_200",
    "test:modules/backend/tests/integration/api/test_integrations_api.py::TestSalesforceWebhook::test_salesforce_webhook_with_the_shared_secret_returns_200",
]


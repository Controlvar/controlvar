]

[[unit]]
text = "The shared secret is replayable and puts the secret on the wire, so use it only over TLS, and prefer the signature where the sender can produce one."
by = ["test:modules/backend/tests/unit/api/test_integration_config_rules.py::test_a_shared_secret_delivery_is_accepted_again_when_replayed"]

[[unit]]

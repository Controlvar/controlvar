document = "docs/api/api-docs-guide.md"

[[unit]]
text = "Controlvar API Documentation Guide"
by = ["exempt:baseline"]

[[unit]]
text = "This guide explains how to access and use the API documentation for the experimentation platform."
by = ["exempt:baseline"]

[[unit]]
text = "Accessing the Documentation"
by = ["exempt:baseline"]

[[unit]]
text = "The API documentation is available in two formats:"
by = ["exempt:baseline"]

[[unit]]
text = "Swagger UI: Interactive documentation where you can try out API endpoints"
by = ["exempt:baseline"]

[[unit]]
text = "URL: /api/v1/docs"
by = ["test:backend/tests/unit/models/test_fast_api_setup.py::test_api_docs_available"]

[[unit]]
text = "ReDoc: Clean, responsive documentation with better navigation"
by = ["exempt:baseline"]

[[unit]]
text = "URL: /api/v1/redoc"
by = ["test:backend/tests/unit/api/test_route_surface_rules.py::test_redoc_is_served_at_api_v1_redoc"]

[[unit]]
text = "Understanding the API Structure"
by = ["exempt:baseline"]

[[unit]]
text = "The API is organized into the following sections:"
by = ["exempt:baseline"]

[[unit]]
text = "Authentication (/api/v1/auth): Endpoints for user authentication"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "Experiments (/api/v1/experiments): Manage experiments and variants"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "Tracking (/api/v1/tracking): Track user assignments and events"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "Feature Flags (/api/v1/feature-flags): Manage feature flags"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "Administration (/api/v1/admin): Admin-only operations"
by = [
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot",
    "test:backend/tests/integration/api/test_admin_users_api.py",
]

[[unit]]
text = "Health (/health): System health check"
by = [
    "test:backend/tests/unit/models/test_fast_api_setup.py",
    "test:backend/tests/smoke/test_wiring.py",
]

[[unit]]
text = "The /api/v1/events and /api/v1/assignments routers only expose an informational GET /; use the /api/v1/tracking/ endpoints above."
by = ["test:backend/tests/integration/api/test_assignments_api.py::TestAssignmentsEndpoint::test_assignments_endpoint_returns_200"]

[[unit]]
text = "Authentication"
by = ["exempt:baseline"]

[[unit]]
text = "The API uses two authentication methods:"
by = ["exempt:baseline"]

[[unit]]
text = "OAuth2 Bearer Token: For authenticated user endpoints"
by = [
    "test:backend/tests/unit/api/test_local_auth.py::TestTokenFormEndpoint::test_form_login_returns_same_shape",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot",
    "docex:docs/api/auth.md#\"token_type\": \"bearer\"",
    "docex:docs/api/auth.md#\"email\": \"admin@demo.com\"",
]

[[unit]]
text = "Obtain a token via /api/v1/auth/token endpoint"
by = ["exempt:baseline"]

[[unit]]
text = "Include the token in the Authorization: Bearer <token> header"
by = ["exempt:baseline"]

[[unit]]
text = "API Key: For tracking endpoints called from client applications"
by = [
    "test:backend/tests/integration/api/test_api_keys_api.py::TestKeyAuthenticatesSdkTraffic::test_tracking_assign_with_created_key",
    "docex:docs/api/auth.md#\"purchase_completed\"",
]

[[unit]]
text = "Include the API key in the X-API-Key: <api-key> header"
by = ["exempt:baseline"]

[[unit]]
text = "API Versioning"
by = ["exempt:baseline"]

[[unit]]
text = "Current version: v1 (accessed via /api/v1/...)"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "See API stability for what may change within v1."
by = ["exempt:navigation"]

[[unit]]
text = "Error Responses"
by = ["exempt:label"]

[[unit]]
text = "An error answers with a detail field: a message such as {\"detail\": \"Not Found\"}, or, when a request does not validate (422), a list of the problems, each with its type, loc and msg:"
by = ["test:backend/tests/unit/core/test_validation_errors.py::test_input_is_dropped_and_the_rest_kept"]

[[unit]]
text = "Pagination"
by = ["exempt:baseline"]

[[unit]]
text = "List endpoints page in different ways: most take skip and limit, some take page with limit or page_size, and a few take no paging parameter."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "The route's entry in the API documentation names its parameters."
by = ["exempt:navigation"]

[[unit]]
text = "limit: Maximum number of records to return (default: 100; the largest value allowed differs by route, and some lists have none: the route's OpenAPI entry gives it)"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "Filtering and Sorting"
by = ["exempt:baseline"]

[[unit]]
text = "Some list endpoints support filtering, and one supports sorting:"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "Filtering: Use query parameters (e.g., status_filter=active)"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "Sorting: GET /api/v1/experiments/ takes sort_by and sort_order (e.g., sort_by=created_at&sort_order=desc)"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]

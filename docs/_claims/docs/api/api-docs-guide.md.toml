by = ["exempt:baseline"]

[[unit]]
text = "Rate Limiting"
by = ["exempt:baseline"]

[[unit]]
text = "The API implements rate limiting to ensure fair usage and system stability:"
by = ["exempt:baseline"]

[[unit]]
text = "Limits are per IP, resolved in backend/app/middleware/rate_limiter.py: an exact path match wins, then the export and AI interpretation prefixes, then the SDK prefixes, then the default."
by = [
    "test:backend/tests/unit/middleware/test_rate_limiter.py::TestRateLimitConfig::test_exact_config_wins_over_prefix_and_default",
    "test:backend/tests/unit/middleware/test_rate_limiter.py::TestExportRateLimit",
]

[[unit]]
text = "paths | limit"
by = ["exempt:baseline"]

[[unit]]
text = "/api/v1/auth/token, /auth/login | 10 / min"
by = [
    "test:backend/tests/unit/api/test_local_auth.py::TestLoginEndpoint::test_login_is_rate_limited",
    "test:backend/tests/unit/security/test_owasp_compliance.py",
]

[[unit]]
text = "/api/v1/auth/signup, /auth/forgot-password, /auth/reset-password | 5 / min"
by = ["test:backend/tests/unit/middleware/test_route_rate_limits.py::test_sign_up_and_the_password_reset_routes_take_five_a_minute"]

[[unit]]
text = "/api/v1/users/me/password | 5 / min"
by = ["test:backend/tests/unit/middleware/test_own_password_rate_limit.py::test_the_sixth_attempt_in_a_minute_is_429"]

[[unit]]
text = "/api/v1/auth/sso/exchange (full image) | 10 / min"
by = ["test:backend/tests/unit/middleware/test_route_rate_limits.py::test_the_sso_routes_take_ten_and_thirty_a_minute"]

[[unit]]
text = "/api/v1/auth/sso/login (full image) | 30 / min"
by = ["test:backend/tests/unit/middleware/test_route_rate_limits.py::test_the_sso_routes_take_ten_and_thirty_a_minute"]

[[unit]]
text = "/api/v1/export/ (all export endpoints share one count) | 10 / min"
by = ["test:backend/tests/unit/middleware/test_rate_limiter.py::TestExportRateLimit"]

[[unit]]
text = "/api/v1/audit-logs/export (its own count) | 10 / min"

document = "docs/api/cuped.md"

[[unit]]
text = "CUPED Variance Reduction"
by = ["exempt:baseline"]

[[unit]]
text = "CUPED (Controlled-experiment Using Pre-Experiment Data) narrows the interval around a treatment effect by adjusting for what each user did before the experiment."
by = ["test:backend/tests/unit/services/test_cuped_metric_result.py::test_s1_planted_correlation_removes_60_to_68_percent"]

[[unit]]
text = "How much it narrows depends on how well that history predicts the outcome."
by = ["exempt:baseline"]

[[unit]]
text = "The endpoint is GET /api/v1/results/{experiment_id}/cuped; the dashboard and GET /results/{id} show the unadjusted numbers."
by = [
    "docex:docs/api/cuped.md#\"analysis_status\": \"ga\"",
    "test:backend/tests/integration/api/test_cuped_results_api.py::test_s6_sizes_and_conversions_are_the_results_routes",
]

[[unit]]
text = "Reference: Deng, Xu, Kohavi & Walker — Improving the sensitivity of online controlled experiments by utilizing pre-experiment data (WSDM 2013)."
by = ["exempt:baseline"]

[[unit]]
text = "How It Works"
by = ["exempt:baseline"]

[[unit]]
text = "For each conversion metric, the outcome Y of a user is 1 if they converted after assignment (counted exactly as GET /results/{id} counts them) and 0 otherwise."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_s6_sizes_and_conversions_are_the_results_routes"]

[[unit]]
text = "The covariate X is 1 if the same user sent the metric's event in the covariate_lookback_days before their assignment, and 0 if they did not."
by = [
    "test:backend/tests/integration/services/test_cuped_covariate_window.py::test_w1_boundary_table",
    "test:backend/tests/integration/api/test_cuped_results_api.py::test_n1_users_with_no_history_stay_in_with_x_zero",
]

[[unit]]
text = "A user with no history stays in the analysis with X = 0."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_n1_users_with_no_history_stay_in_with_x_zero"]

[[unit]]
text = "Each arm's adjusted conversion rate is:"
by = ["exempt:baseline"]

[[unit]]
text = "Where:"
by = ["exempt:baseline"]

[[unit]]
text = "θ is the slope of Y on X, pooled within arms over every arm of the experiment: the x coefficient of the regression Y ~ arm + X"
by = [
    "test:backend/tests/unit/services/test_cuped_metric_result.py::test_s2_theta_equals_the_ols_coefficient_with_unequal_arms",
    "test:backend/tests/unit/services/test_cuped_metric_result.py::test_s2_theta_pools_every_arm_with_different_slopes",
]

[[unit]]
text = "overall mean(X) is the share of all assigned users with history, so the adjusted rates stay on the conversion-rate scale"
by = ["test:backend/tests/unit/services/test_cuped_metric_result.py::test_s3_effect_equals_ols_and_se_matches_hc2"]

[[unit]]
text = "The adjusted effect is the treatment's adjusted rate minus the control's."
by = ["test:backend/tests/unit/services/test_cuped_metric_result.py::test_s3_effect_equals_ols_and_se_matches_hc2"]

[[unit]]
text = "Its variance is each arm's residual variance over its size, so the more of the outcome the history explains, the narrower the interval."
by = ["test:backend/tests/unit/services/test_cuped_metric_result.py::test_s3_effect_equals_ols_and_se_matches_hc2"]

[[unit]]
text = "Each residual variance is a sample variance, divided by the arm's users minus 1."
by = [
    "journey:experiment-results#cuped-returning-users",
    "journey:experiment-results#cuped-new-users",
]

[[unit]]
text = "What counts as history, per user:"
by = ["exempt:baseline"]

[[unit]]
text = "the event is the metric's own event_name (or that of covariate_metric_id, below), matched the way results match conversions: an experiment-view row never counts;"
by = [
    "test:backend/tests/integration/services/test_cuped_covariate_window.py::test_only_conversion_events_of_the_name_count",
    "test:backend/tests/integration/api/test_cuped_results_api.py::test_x3_a_covariate_metric_of_the_experiment_is_read",
]

[[unit]]
text = "it happened in [assigned_at − covariate_lookback_days, assigned_at): an event at the moment of assignment is not history;"
by = ["test:backend/tests/integration/services/test_cuped_covariate_window.py::test_w1_boundary_table"]

[[unit]]
text = "it can carry any experiment key, any flag key, or none."
by = ["test:backend/tests/integration/services/test_cuped_covariate_window.py::test_w5_a_fanned_out_copy_counts_once"]

[[unit]]
text = "One event is enough; a user with three copies of the same purchase still has X = 1;"
by = ["test:backend/tests/integration/services/test_cuped_covariate_window.py::test_w5_a_fanned_out_copy_counts_once"]

[[unit]]
text = "History counts only if the server received it before the user was assigned."
by = ["test:backend/tests/integration/services/test_cuped_covariate_window.py::test_receive_guard_stored_after_assignment_is_not_history"]

[[unit]]
text = "Send history before you start the experiment."
by = ["test:backend/tests/integration/services/test_cuped_covariate_window.py::test_receive_guard_stored_after_assignment_is_not_history"]

[[unit]]
text = "History the server receives after a user was assigned is ignored for that user."
by = ["test:backend/tests/integration/services/test_cuped_covariate_window.py::test_receive_guard_stored_after_assignment_is_not_history"]

[[unit]]
text = "Sending pre-experiment history"
by = ["exempt:baseline"]

[[unit]]
text = "Send each user's past events to POST /api/v1/tracking/track, or 100 at a time to POST /api/v1/tracking/batch, without an experiment_key or a feature_flag_key."
by = ["docex:docs/api/cuped.md#\"experiment_id\": null"]

[[unit]]
text = "Such an event is stored as history: it counts in no experiment's results, only as CUPED history."
by = ["test:backend/tests/integration/api/test_tracking_untagged_events.py::test_untagged_events_change_no_results_path"]

[[unit]]
text = "For each event:"
by = ["exempt:baseline"]

[[unit]]
text = "user_id is exactly the id the user will be assigned with (it is case-sensitive);"
by = ["test:backend/tests/integration/api/test_cuped_history_sent_by_tracking.py::test_history_is_matched_by_exact_id_and_dated_in_utc"]

[[unit]]
text = "event_type is the metric's event_name, for example checkout_completed;"
by = ["exempt:baseline"]

[[unit]]
text = "timestamp is when the event happened, in ISO 8601 (no offset means UTC)."
by = ["test:backend/tests/integration/api/test_cuped_history_sent_by_tracking.py::test_history_is_matched_by_exact_id_and_dated_in_utc"]

[[unit]]
text = "Without it the event is dated when it is received."
by = ["test:backend/tests/integration/api/test_cuped_history_sent_by_tracking.py::test_history_is_matched_by_exact_id_and_dated_in_utc"]

[[unit]]
text = "Send events from at least covariate_lookback_days before the planned start; anything older is never read."
by = ["test:backend/tests/integration/api/test_cuped_results_api.py::test_x4_the_lookback_setting_is_read"]

[[unit]]
text = "Events during the experiment still need the experiment's key, as they always have: an event without one counts in no experiment's results."
by = ["test:backend/tests/integration/api/test_tracking_untagged_events.py::test_an_untagged_event_after_assignment_counts_nowhere"]

[[unit]]
text = "The SDKs' track() without a key sends one event for each experiment and flag that SDK answered for the user (in the last 24 hours for the JavaScript, Python and React SDKs, while the answer is cached for the others), and those tagged events count as history for a later experiment."
by = [
    "test:sdk/js/__tests__/client.test.ts::sends an untagged purchase made 301 s after the assignment to the experiment",
    "test:sdk/js/__tests__/client.test.ts::does not send to a key answered more than 24 hours ago: the event goes once with no key",
    "test:sdk/python/tests/test_client.py::TestTrackFanOut::test_fans_out_to_cached_assignment_and_flag",
    "test:sdk/python/tests/test_client.py::TestLateConversions::test_a_purchase_301_seconds_after_the_assignment_reaches_the_experiment",
    "test:sdk/react/src/__tests__/ExperimentationClient.test.ts::sends an untagged purchase made 301 s after the assignment to the experiment",
    "test:sdk/go/client_test.go::TestClient_Track_WithoutKey_FansOutToCachedEntries",
    "test:backend/tests/integration/services/test_cuped_covariate_window.py::test_w5_a_fanned_out_copy_counts_once",
]

[[unit]]
text = "With nothing to attribute it to, the JavaScript, Python and React SDKs send the event once with no key, which stores it as history; the other SDKs send nothing then, which is usual before a user's first assignment."
by = [
    "test:sdk/js/__tests__/client.test.ts::sends the event once to /api/v1/tracking/track with no key when nothing is attributed to the user",
    "test:sdk/python/tests/test_client.py::TestTrackFanOut::test_nothing_attributed_sends_the_event_once_to_track_with_no_key",
    "test:sdk/react/src/__tests__/ExperimentationClient.test.ts::sends the event once to /api/v1/tracking/track with no key and resolves when nothing is attributed to the user",
    "test:backend/tests/integration/api/test_cuped_history_sent_by_tracking.py::test_history_is_matched_by_exact_id_and_dated_in_utc",
    "test:sdk/go/client_test.go::TestClient_Track_WithoutKey_NothingCached_SendsNothing",
]


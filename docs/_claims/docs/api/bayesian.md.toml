[[unit]]
text = "bayesian_config Object"
by = ["exempt:baseline"]

[[unit]]
text = "Field | Type | Default | Description"
by = ["exempt:baseline"]

[[unit]]
text = "prior_family | string | beta | Stored only: beta, normal or gamma are accepted, and every config is analysed as Beta-Binomial"
by = [
    "test:backend/tests/integration/api/test_bayesian_route_claims.py::test_every_prior_family_is_stored_and_analysed_as_beta_binomial",
    "test:backend/tests/integration/api/test_bayesian_route_claims.py::test_any_other_prior_family_is_refused",
]

[[unit]]
text = "alpha | float | 1.0 | Prior alpha (> 0)"
by = [
    "test:backend/tests/unit/schemas/test_bayesian_schemas.py::test_bayesian_config_default_values",
    "test:backend/tests/unit/schemas/test_bayesian_schemas.py::test_bayesian_config_alpha_must_be_positive",
]

[[unit]]
text = "beta | float | 1.0 | Prior beta (> 0)"
by = [
    "test:backend/tests/unit/schemas/test_bayesian_schemas.py::test_bayesian_config_default_values",
    "test:backend/tests/unit/schemas/test_bayesian_schemas.py::test_bayesian_config_beta_must_be_positive",
]

[[unit]]
text = "loss_threshold | float | 0.001 | Expected loss the leading variant must be below to be declared the winner (> 0); it also needs a probability to be best of at least 0.975 (see the decision values)"
by = [
    "test:backend/tests/unit/schemas/test_bayesian_schemas.py::test_bayesian_config_loss_threshold_must_be_positive",
    "test:backend/tests/unit/services/test_bayesian_service.py::test_stop_winner_needs_probability_and_loss",
]

[[unit]]
text = "rope | [float, float] | null | Region of Practical Equivalence, [lower, upper] with lower < upper, on the difference in conversion rate"
by = [
    "test:backend/tests/unit/schemas/test_bayesian_schemas.py::test_bayesian_config_rope_invalid_order_raises",
    "test:backend/tests/unit/services/test_bayesian_service.py::test_should_stop_returns_stop_equivalent_with_rope",
]

[[unit]]
text = "credible_level | float | 0.95 | Credible interval level, between 0 and 1"
by = [
    "test:backend/tests/unit/schemas/test_bayesian_schemas.py::test_bayesian_config_default_values",
    "test:backend/tests/integration/api/test_experiment_bayesian_config_api.py::TestMalformedConfig",
]

[[unit]]
text = "A config that fails these checks is refused with 422, and the error's loc names the field, for example [\"body\", \"bayesian_config\", \"alpha\"]."
by = [
    "test:backend/tests/integration/api/test_experiment_bayesian_config_api.py::TestMalformedConfig::test_create_refuses_malformed_config",
    "test:backend/tests/integration/api/test_experiment_bayesian_config_api.py::TestMalformedConfig::test_update_refuses_malformed_config",
]

[[unit]]

# What verifies each unit of docs/api/bayesian.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/api/bayesian.md"

[[unit]]
text = "Bayesian Experimentation API"
by = ["exempt:baseline"]

[[unit]]
text = "When an experiment has Bayesian analysis turned on, its results carry a Bayesian block beside the frequentist statistics: a posterior for each variant, the probability that each is best, the expected loss of choosing it, and a stopping recommendation."
by = ["test:backend/tests/unit/api/test_bayesian_results_api.py::TestBayesianResultsField::test_bayesian_results_present_when_bayesian_enabled"]

[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "The platform fits a Beta-Binomial model to each variant's conversions on the experiment's primary metric."
by = [
    "test:backend/tests/unit/services/test_bayesian_service.py::test_posterior_exact_conjugate_update",
    "test:backend/tests/unit/services/test_bayesian_api_integration.py::TestAnalysisServiceBayesianIntegration::test_compute_bayesian_results_calls_analyze_with_observations",
]

[[unit]]
text = "A conversion is a user: the users assigned to the variant with at least one conversion event, so a user who purchases three times counts once, as in GET /results/{id}."
by = ["test:backend/tests/integration/api/test_converting_users_consistency.py::test_counts_agree_across_endpoints"]

[[unit]]
text = "Posterior parameters (alpha, beta), updated from the prior with the observed conversions and non-conversions, and the posterior mean."
by = ["test:backend/tests/unit/services/test_bayesian_service.py::test_posterior_exact_conjugate_update"]

[[unit]]
text = "Credible interval (equal-tailed: at 95%, the 2.5th and 97.5th percentiles of the posterior) at the configured level, 95% by default."
by = [
    "test:backend/tests/unit/services/test_bayesian_service.py::test_credible_interval_95_default",
    "test:backend/tests/unit/services/test_bayesian_service.py::test_credible_interval_custom_level_80",
]

[[unit]]
text = "Probability to be best: the share of Monte Carlo draws in which this variant has the highest rate."
by = [
    "test:backend/tests/unit/services/test_bayesian_service.py::test_ptbb_two_variants_sum_to_one",
    "test:backend/tests/unit/services/test_bayesian_service.py::test_ptbb_clearly_better_variant_above_95pct",
]

[[unit]]
text = "Expected loss: how much conversion rate you would give up, on average, by choosing this variant if it is not the best."
by = [
    "test:backend/tests/unit/services/test_bayesian_service.py::test_expected_loss_zero_when_variant_dominates",
    "test:backend/tests/unit/services/test_bayesian_service.py::test_expected_loss_units_in_same_scale_as_metric",
]

[[unit]]
text = "A decision from the stopping rules below."
by = ["exempt:baseline"]

[[unit]]
text = "The Monte Carlo seed is derived from the experiment id, the UTC day and the number of samples, and echoed in the response as seed, so two requests on the same day return the same numbers."
by = [
    "test:backend/tests/unit/services/test_stats_determinism.py::TestAnalysisServiceSeed::test_compute_bayesian_results_uses_experiment_day_seed",
    "test:backend/tests/integration/api/test_analysis_snapshots_api.py::TestBayesianRouteDeterminism::test_two_calls_are_byte_identical_with_same_seed",
]

[[unit]]
text = "Reading the Bayesian results"
by = ["exempt:baseline"]

[[unit]]
text = "GET /api/v1/results/{experiment_id}/bayesian"
by = ["docex:docs/api/bayesian.md#\"is_enabled\": false"]

[[unit]]
text = "Returns the Bayesian block on its own, always freshly computed."
by = ["test:backend/tests/integration/api/test_bayesian_route_claims.py::test_the_bayesian_route_is_computed_on_every_request"]

[[unit]]
text = "Any logged-in user can read it."
by = [
    "test:backend/tests/smoke/test_experiment_routes_classified.py",
    "test:backend/tests/integration/api/test_experiment_errors_fixed_message.py",
]

[[unit]]
text = "An experiment that hasn't turned Bayesian analysis on answers 200 with \"is_enabled\": false; an experiment that doesn't exist answers 404."
by = [
    "docex:docs/api/bayesian.md#\"is_enabled\": false",
    "test:backend/tests/integration/api/test_analysis_snapshots_api.py::TestBayesianRouteDeterminism::test_bayesian_route_404_for_unknown",
]

[[unit]]
text = "Run the commands on this page in one terminal, in order, against the stack from the Quick Start."
by = ["exempt:baseline"]

[[unit]]

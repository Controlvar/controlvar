by = ["exempt:baseline"]

[[unit]]
text = "Value | When"
by = ["exempt:baseline"]

[[unit]]
text = "STOP_WINNER | The variant most likely to be best has a probability to be best of at least 0.975, and its expected loss is below loss_threshold."
by = [
    "test:backend/tests/unit/services/test_bayesian_service.py::test_stop_winner_needs_probability_and_loss",
    "test:backend/tests/unit/stats_validation/test_bayesian_stop_winner.py::test_the_bounds_are_the_binomial_quantiles",
]

[[unit]]
text = "STOP_EQUIVALENT | rope is set, and for every other variant the probability that its difference from the best lies inside the ROPE is above 0.95."
by = ["test:backend/tests/unit/services/test_bayesian_service.py::test_should_stop_returns_stop_equivalent_with_rope"]

[[unit]]
text = "CONTINUE | Neither of the above. Keep collecting data."
by = ["test:backend/tests/unit/services/test_bayesian_service.py::test_stop_winner_needs_probability_and_loss"]

[[unit]]
text = "The decision is a recommendation: nothing stops the experiment or changes its status."

]

[[unit]]
text = "For a proportion, near the threshold, the interval and Fisher's exact test can disagree either way: 128 of 1,000 against 100 of 1,000 is not significant (p 0.057) while its interval runs from +0.0001 to +0.056, and 3 of 50 against 18 of 100 is significant (p 0.049) while its interval reaches +0.00003."
by = ["test:backend/tests/unit/services/test_difference_intervals.py::test_named_boundary_tables"]

[[unit]]

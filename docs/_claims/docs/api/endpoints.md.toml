]

[[unit]]
text = "The ratio is taken over values of 0 and above, so the lower end is never below -100%, and at low counts the interval is wide: a treatment with 6 converting users out of 200 against a control with 2 out of 200 gives -34.2% to +1,206.3% at 0.95."
by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_a_low_count_control_has_a_bounded_relative_interval",

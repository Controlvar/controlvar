by = [
    "test:backend/tests/unit/services/test_difference_intervals.py::test_every_none_on_the_grids_is_counted",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_an_arm_with_no_users_has_no_difference",
    "test:backend/tests/unit/services/test_difference_intervals.py::test_a_mean_with_no_variation_has_an_impact_but_no_interval",
]

[[unit]]

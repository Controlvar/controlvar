[[unit]]
text = "Warehouse analysis (beta)"
by = ["exempt:baseline"]

[[unit]]
text = "Beta: Snowflake and BigQuery are available"
by = ["exempt:baseline"]

[[unit]]
text = "Warehouse analysis runs an experiment's analysis on tables in your own data warehouse instead of on events sent to Controlvar."
by = [
    "test:modules/backend/tests/integration/warehouse/test_runs_api.py",
    "test:modules/backend/tests/integration/warehouse/test_bigquery_run.py",
]

[[unit]]
text = "The API below is part of the full profile and every route is x-stability: beta: its shape may still change."
by = [
    "test:backend/tests/smoke/test_core_boundary.py::test_register_core_routers_mounts_no_module_route",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot",
]

[[unit]]
text = "Snowflake is available (see Setting up Snowflake)."
by = ["mechanism:warehouse-availability"]

[[unit]]
text = "BigQuery is available (see Setting up BigQuery)."
by = ["mechanism:warehouse-availability"]

[[unit]]
text = "Amazon Athena isn't available yet."
by = [
    "test:modules/backend/tests/unit/warehouse/test_connectors.py::test_disabled_connector_refused_with_422",
    "test:modules/backend/tests/unit/warehouse/test_connectors.py::test_enabled_connectors_exact",
]

[[unit]]
text = "GET /api/v1/warehouse/analysis/connectors says which are available on your deployment; creating a connection of any other type answers 422 connector_disabled."
by = [
    "test:modules/backend/tests/unit/warehouse/test_connectors.py",
    "test:modules/backend/tests/integration/warehouse/test_connections_api.py",
]

[[unit]]
text = "What it does"
by = ["exempt:baseline"]

[[unit]]
text = "You point Controlvar at two of your own tables or views:"
by = ["exempt:baseline"]

[[unit]]
text = "an assignment source: one row per exposure, with the unit id, the experiment key, the variant label and the time of the exposure;"
by = [
    "test:modules/backend/tests/unit/warehouse/test_golden_sql.py",
    "test:modules/backend/tests/integration/warehouse/test_sources_api.py",
]

[[unit]]
text = "a metric source per metric: one row per event, with the unit id and the time of the event, and for a mean metric the event's value."
by = [
    "test:modules/backend/tests/unit/warehouse/test_golden_sql.py",
    "test:modules/backend/tests/integration/warehouse/test_sources_api.py",
]

[[unit]]
text = "Controlvar writes the SQL itself (there is no field that takes SQL), runs it as the identity you created for it, and computes the results from what comes back."
by = [
    "test:modules/backend/tests/unit/warehouse/test_request_schemas.py::test_every_request_model_forbids_unknown_fields",
    "test:modules/backend/tests/unit/warehouse/test_request_schemas.py::test_every_string_field_is_allowlisted_exactly",
    "test:modules/backend/tests/unit/warehouse/test_reparse_defence.py::test_generated_sql_is_one_select_over_exactly_the_rendered_tables",
]

[[unit]]
text = "A metric is one of two types:"
by = ["exempt:baseline"]

[[unit]]
text = "a proportion: the share of exposed units that had at least one event in the conversion window, compared with Fisher's exact test, the statistics /results uses;"
by = ["test:modules/backend/tests/unit/warehouse/test_runner_units.py::test_the_default_estimator_is_the_one_results_uses"]

[[unit]]
text = "a mean: the average per exposed unit of the sum of its event values in the conversion window (0 for a unit with no event; a NULL value is ignored and counted), optionally capped per unit with cap_value, and compared with Welch's t-test."
by = [
    "test:modules/backend/tests/unit/warehouse/test_mean_runs.py",
    "test:modules/backend/tests/unit/warehouse/test_mean_sums_duckdb.py",
    "test:modules/backend/tests/unit/warehouse/test_mean_parity_duckdb.py",
]

[[unit]]
text = "Each variant reports its mean and a confidence interval."
by = ["test:modules/backend/tests/unit/warehouse/test_mean_runs.py"]

[[unit]]
text = "Every run reports its sample-ratio check against the variants' traffic allocation (skipped for multi-armed bandit experiments, whose split moves on purpose)."
by = ["test:modules/backend/tests/integration/warehouse/test_runs_api.py"]

[[unit]]
text = "What leaves your warehouse"
by = ["exempt:baseline"]

[[unit]]
text = "No row of your data."
by = [
    "test:modules/backend/tests/unit/warehouse/test_golden_sql.py",
    "test:modules/backend/tests/unit/warehouse/test_result_parsing.py",
]

[[unit]]
text = "A run returns only aggregates:"
by = [
    "test:modules/backend/tests/unit/warehouse/test_golden_sql.py",
    "test:modules/backend/tests/unit/warehouse/test_result_parsing.py",
]

[[unit]]
text = "per variant label: the label (cut to 64 characters; at most 51 labels), the number of units, the number of converting units, and two sums;"
by = [
    "test:modules/backend/tests/unit/warehouse/test_result_parsing.py",
    "test:modules/backend/tests/integration/warehouse/test_runs_api.py",
]

[[unit]]
text = "per statement: the grand mean and diagnostic counts (units seen in more than one variant, rows with no unit or variant, metric rows in the window and how many matched an exposed unit);"
by = [
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_diagnostics_statement_reads_back",
    "test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_real_diagnostics_results_are_read_and_parsed",
]

[[unit]]
text = "the query's job id, bytes billed or elapsed time."
by = ["test:modules/backend/tests/unit/warehouse/test_run_out.py"]

[[unit]]
text = "A preview returns counts, the number of units per variant label, and the earliest and latest time in the window."
by = ["test:modules/backend/tests/integration/warehouse/test_sources_api.py"]

[[unit]]
text = "Validation reads column names and types from the warehouse's metadata; it queries no data."
by = [
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_table_columns_from_show_columns",
    "test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_table_columns_from_tables_get",
]

[[unit]]
text = "The connection's role decides what can be read."
by = ["exempt:baseline"]

[[unit]]
text = "Anyone who can author a source can compute aggregates, and read short text such as variant labels, over anything the connection's role can read."
by = ["test:modules/backend/tests/unit/warehouse/test_limits_roles_and_counting.py::test_a_source_author_reads_any_table_the_connection_role_can"]

[[unit]]
text = "Grant that role only the tables and views analysis needs, and read-only access to them."
by = ["exempt:baseline"]

[[unit]]
text = "How it counts, and how that differs from /results"
by = ["exempt:baseline"]

[[unit]]
text = "A unit's exposure is its first exposure in the analysis window."
by = [
    "test:modules/backend/tests/unit/warehouse/test_grain_duckdb.py",
    "test:modules/backend/tests/unit/warehouse/test_golden_sql.py",
]

[[unit]]
text = "A unit converts when it has an event at or after that exposure and within the metric's conversion window (and before the end of the analysis window)."
by = ["test:modules/backend/tests/unit/warehouse/test_grain_duckdb.py"]

[[unit]]
text = "Units seen in more than one variant are left out and counted in the diagnostics."
by = ["test:modules/backend/tests/unit/warehouse/test_grain_duckdb.py"]

[[unit]]
text = "/results counts converting users with no bound on the exposure time and no conversion window."
by = ["test:modules/backend/tests/unit/warehouse/test_limits_roles_and_counting.py::test_results_counts_a_conversion_whatever_its_time"]

[[unit]]
text = "So the two agree only on data with no event before a unit's exposure, no unit in two variants and no event outside the window; otherwise the warehouse numbers are the stricter ones."
by = ["exempt:baseline"]

[[unit]]
text = "Setting up Snowflake"
by = ["exempt:baseline"]

[[unit]]
text = "Controlvar signs in to Snowflake's SQL API as a user in your account, with a key pair it generates."
by = [
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_each_request_carries_the_key_pair_jwt",
    "test:modules/backend/tests/unit/warehouse/test_request_schemas.py",
]

[[unit]]
text = "There is no password field."
by = ["exempt:baseline"]

[[unit]]
text = "In Snowflake, give Controlvar a user and a role of its own."
by = ["exempt:third-party"]

[[unit]]
text = "Grant the role USAGE on the warehouse, the database and the schema, and SELECT on each table or view analysis reads, and nothing else."
by = ["exempt:third-party"]

[[unit]]
text = "A connection whose role is ACCOUNTADMIN or another of Snowflake's built-in administrative roles is refused."
by = ["test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_administrative_roles_refused_whatever_their_case"]

[[unit]]
text = "Create the connection in Warehouse › Connections (ADMIN)."
by = ["exempt:baseline"]

[[unit]]
text = "The account is the organisation-account identifier, for example MYORG-MYACCOUNT (Snowsight › Admin › Accounts), not a locator or a URL."
by = ["test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_account_must_be_the_organisation_account_identifier"]

[[unit]]
text = "Saving generates the key pair and shows the statement that registers its public key, for example ALTER USER CONTROLVAR SET RSA_PUBLIC_KEY='…';."
by = ["test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_only_the_public_key_and_statement_are_shown"]

[[unit]]
text = "Run it as an administrator."
by = ["exempt:baseline"]

[[unit]]
text = "The private key never leaves Controlvar."
by = [
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_only_the_public_key_and_statement_are_shown",
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_repr_never_shows_the_key",
]

[[unit]]
text = "Test the connection."
by = ["exempt:baseline"]

[[unit]]
text = "The test signs in and runs one statement that reads no table."
by = ["test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_connection_test_runs_no_table_query_and_checks_utc"]

[[unit]]
text = "Name tables in full in a source: DATABASE.SCHEMA.TABLE, each part as Snowflake stores it (upper case unless it was created quoted)."
by = ["test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_object_names_fully_match"]

[[unit]]
text = "Every statement runs with the session time zone set to UTC and is stopped by Snowflake at the connection's query_timeout_seconds."
by = [
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_snowflake_request_sets_timezone_utc",
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_the_server_side_limit_never_exceeds_the_time_left_and_is_never_zero",
]

[[unit]]
text = "A resource monitor on the Snowflake warehouse is a good second limit."
by = ["exempt:advice"]

[[unit]]
text = "To replace the key, choose Generate a new key."
by = ["test:modules/frontend/src/tests/warehouse/connection-detail.test.tsx::generates a pending key and shows its statement; a passing test switches to it"]

[[unit]]
text = "It shows the statement that registers the new public key as RSA_PUBLIC_KEY_2; the old key keeps working until a test with the new one passes."
by = [
    "test:modules/backend/tests/unit/warehouse/test_snowflake.py::test_a_replacement_key_goes_in_the_second_slot",
    "test:modules/frontend/src/tests/warehouse/connection-detail.test.tsx::generates a pending key and shows its statement; a passing test switches to it",
]

[[unit]]
text = "Setting up BigQuery"
by = ["exempt:baseline"]

[[unit]]
text = "Controlvar signs in to BigQuery with a service-account key you create for it, and runs every query as a job in a project you choose."

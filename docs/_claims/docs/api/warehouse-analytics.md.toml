[[unit]]
text = "A superuser counts as ADMIN."
by = ["test:modules/backend/tests/integration/warehouse/test_roles.py::test_a_superuser_counts_as_admin"]

[[unit]]
text = "A preview is stored as a run, so reading an analysis or a preview by its id (GET /runs/{run_id}) and listing an experiment's analyses both need ADMIN, DEVELOPER or ANALYST; a VIEWER gets 403 role_required from both (D50)."

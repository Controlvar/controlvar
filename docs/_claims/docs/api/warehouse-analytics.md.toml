]

[[unit]]
text = "A key whose token_uri is not Google's own token endpoint is refused."
by = ["test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_token_uri_other_than_google_refused"]

[[unit]]
text = "Set the location to where your datasets are: US, EU, or a region such as europe-west2."
by = ["test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_connection_locations_accepted"]

[[unit]]
text = "Set the bytes cap (\"Most data a query may read\")."
by = ["exempt:baseline"]

[[unit]]
text = "Before each query Controlvar runs a dry run: anything that is not a single SELECT, or that would read more than the cap, is refused before it runs."
by = [
    "test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_dry_run_uses_jobs_insert_and_requires_select",
    "test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_bytes_over_cap_refused_before_run",
]

[[unit]]
text = "The real query is also sent with the cap as its billing limit, so BigQuery stops it rather than bill more."
by = ["test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_run_query_sends_the_limits_and_returns_the_rows"]

[[unit]]
text = "Test the connection, then name tables in full in a source: project.dataset.table."
by = ["test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_table_reference_checked_before_anything_is_sent"]

[[unit]]
text = "Every job carries the label experimently: analysis, so you can find its cost in your billing."
by = ["test:modules/backend/tests/unit/warehouse/test_bigquery.py"]


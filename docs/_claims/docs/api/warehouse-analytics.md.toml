    "test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_connection_fields_fully_match",
    "test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_run_query_sends_the_limits_and_returns_the_rows",
]

[[unit]]
text = "In Google Cloud, create a service account for Controlvar with these two roles only:"
by = ["exempt:third-party"]

[[unit]]
text = "BigQuery Job User on the project that runs and pays for the queries (the connection's billing project);"
by = ["exempt:baseline"]

[[unit]]
text = "BigQuery Data Viewer on each dataset analysis reads, granted on each dataset rather than on the project."
by = ["exempt:third-party"]

[[unit]]
text = "Create a JSON key for the service account and paste it into the connection form in Warehouse › Connections (ADMIN)."
by = ["exempt:baseline"]

[[unit]]
text = "It is sent only in the request body and stored encrypted, and it is never shown again."
by = [
    "test:modules/backend/tests/unit/warehouse/test_bigquery.py::test_the_stored_credential_holds_exactly_the_four_fields",

[[unit]]
text = "Two checked-in OpenAPI documents pin it, and a smoke test fails the build when a route that is part of the contract changes shape."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "File | What it is | Generated by"

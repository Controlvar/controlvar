[[unit]]
text = "A path/method in the snapshot that is stable must still exist, and its operation object — parameters, request body, responses, and every component schema those reference, transitively — must be identical."
by = [
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_compare_flags_changes_to_stable_operations_as_errors",

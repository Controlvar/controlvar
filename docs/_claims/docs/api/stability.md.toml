text = "POST /api/v1/ai/design, POST /api/v1/ai/interpret/{experiment_id} | #1043 | Each operation allows 10 requests a minute per client address, where it had the default of 300, and above that answers 429 Too Many Requests with Retry-After: 60; every experiment id draws on the interpretation's one count. With ANTHROPIC_API_KEY set, each call to Claude gives up when Claude has not answered in 30 seconds, and is tried at most twice (it used to give up only after 600 seconds and be tried three times); when it fails, the operation answers with its template-based suggestion or interpretation, as it already did when Claude was unavailable. Without the key only the limit is new. The request and response are the same, and so is the OpenAPI document. See The MCP Server and the AI Endpoints."

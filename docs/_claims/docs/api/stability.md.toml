text = "GET/POST /api/v1/feature-flags/evaluate/{flag_key}, GET /api/v1/feature-flags/user/{user_id}, POST /api/v1/tracking/assign, POST /api/v1/tracking/assign/batch | #1178 | A targeting context nested more than 10 levels deep or larger than 8,192 bytes answers 422, where it used to be accepted. Every JSON object and array is a level, the context itself the first, and the size is the context as compact JSON in UTF-8. Depth is checked first; the detail is Targeting context nested more than 10 levels deep or Targeting context larger than 8192 bytes, and nothing is evaluated, assigned or recorded for the request. On the two GET routes the context parameter is held to 8,192 bytes as sent, before it is parsed, and a parameter nested too deeply to parse answers the same 422. The batch checks every user's context before it assigns the first user: one over a limit refuses the whole request, its detail prefixed with the user's position (users[3]: ), and nobody is assigned. A POST body nested too deeply to parse still answers 400. Every other request answers as before; the contexts the SDKs send are a few hundred bytes. The OpenAPI document does not change. See Targeting Context Limits."

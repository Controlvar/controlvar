its start_date, makes only the first two of these checks and leaves a draft that fails them as a draft. The preview of a stored configuration that breaks the rules on names and URLs answers 409 with the detail split_url_config is not valid; update it with PUT /api/v1/experiments/{id}, where it answered 200. Every other request answers as before, and stored configurations are not changed. The OpenAPI document changes only in descriptions: of SplitUrlConfig, of its fields and SplitUrlVariant's, and of the update and start operations. See Validation Rules."

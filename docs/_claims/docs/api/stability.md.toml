text = "POST /api/v1/segments/{segment_id}/evaluate, POST /api/v1/segments/bulk-evaluate | #1183 | A user_context nested more than 10 levels deep or larger than 8,192 bytes answers 422, where it used to be accepted. The limits and the detail are the flag evaluation routes': every JSON object and array is a level, the context itself the first, the size is the context as compact JSON in UTF-8, depth is checked first, and the detail is Targeting context nested more than 10 levels deep or Targeting context larger than 8192 bytes. No segment is read or evaluated for the request. Bulk-evaluate checks its one user_context once, whatever the number of segments. A body nested too deeply to parse still answers 400. Every other request answers as before, an id list's user_context.user_id included. The OpenAPI document does not change. See Targeting Context Limits."

[[unit]]
text = "--profile core hides the modules package from the import system before the application is imported, so the core document can be produced from a full checkout; it is byte-identical to the document a tree with modules/ deleted produces (scripts/core_build.sh checks that tree the long way round)."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]

# What verifies each unit of docs/api/stability.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/api/stability.md"

[[unit]]
text = "API stability and the OpenAPI snapshots"
by = ["exempt:baseline"]

[[unit]]
text = "The v1 API is a contract."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "Two checked-in OpenAPI documents pin it, and a smoke test fails the build when a route that is part of the contract changes shape."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "File | What it is | Generated by"
by = ["exempt:baseline"]

[[unit]]
text = "docs/api/openapi-v1.stable.json | The core API: every route a build with modules/ deleted serves, with components. | python -m backend.scripts.dump_openapi --profile core --full …"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot"]

[[unit]]
text = "docs/api/openapi-v1.full.json | The full API: the core routes plus the ones the modules registration mounts. | python -m backend.scripts.dump_openapi --profile full --full …"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]


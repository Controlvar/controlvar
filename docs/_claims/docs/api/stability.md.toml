text = "POST /api/v1/llm-experiments/{experiment_id}/judge, GET /api/v1/llm-experiments/{experiment_id}/results | #1192 | A judge call that fails, or a reply without a JSON score from 0 to 1, stores no score: the evaluation's auto_eval_score becomes null, replacing any earlier score, and its entry in the judge's response has \"score\": null and error \"call_failed\" or \"no_score\". It used to store 0.5 for a failed call or a missing score, and otherwise a number taken from the reply's text or clamped into 0 to 1. The results leave unscored evaluations out of the auto-eval statistics and count them in each variant's n_auto_eval_unscored and the experiment's total_auto_eval_unscored, evaluations never judged included. p_value and effect_size are null when neither variant's values vary; they used to be 1.0 and 0.0. Scores stored before the upgrade are unchanged; run the judge again to re-score them. The OpenAPI document changes only in VariantStats and LLMExperimentResults, which add the two required counts, and in the judge operation's description. See LLM-as-Judge Scoring."

[[unit]]
text = "The rule"
by = ["exempt:baseline"]

[[unit]]
text = "backend/tests/smoke/test_openapi_snapshot.py regenerates the live documents in a fresh interpreter and compares them with the snapshots:"
by = [
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot",

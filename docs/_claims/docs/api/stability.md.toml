[[unit]]
text = "Promoting a route is deleting the line and regenerating the snapshots."
by = ["exempt:baseline"]

[[unit]]
text = "Use beta for a route whose request or response is still being shaped by real use — a new analysis endpoint, a first cut of a bulk operation — and take it off once a released SDK or the dashboard depends on it."
by = ["exempt:baseline"]


[[unit]]
text = "POST /api/v1/experiments/, PUT /api/v1/experiments/{experiment_id}, GET /api/v1/experiments/{experiment_id}/split-url/preview | #1194 | A split URL variant's traffic_allocation must be from 0 to 100, where only the sum was checked: -50 and 150 were accepted because they add up to 100. A value outside the range answers 422 at [\"body\", \"split_url_config\", \"variants\", <i>, \"traffic_allocation\"] on a create or an update, and nothing is written. A PUT that does not send split_url_config is unaffected and leaves a stored one as it was, but one that sends back a stored configuration with an allocation outside the range answers 422 until it is corrected. The preview of such a stored configuration answers 409 with the detail split_url_config is not valid; update it with PUT /api/v1/experiments/{id}, where it answered 200 with the stored allocations, as they were. Every other request answers as before. The OpenAPI document changes only in SplitUrlVariant, which gains minimum 0 and maximum 100 on traffic_allocation, and in the descriptions of SplitUrlConfig and VarianceReductionConfig: covariate_metric_id is described as optional, as it is, because without it each metric's own event before the user's assignment is the history. See Server-Side Split URL Testing API."

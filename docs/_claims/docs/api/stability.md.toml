[[unit]]
text = "POST /api/v1/feature-flags/, GET /api/v1/feature-flags/, GET/PUT /api/v1/feature-flags/{flag_id}, POST /api/v1/feature-flags/{flag_id}/activate, POST /api/v1/feature-flags/{flag_id}/deactivate | #94 | The request schemas refuse unknown fields and explicit nulls, a new flag is off unless is_active: true is sent, and default_value accepts only false. Every one of these operations answers with one documented flag schema, FeatureFlagRead, which names targeting targeting_rules and no longer carries rules, variants, metrics or last_evaluated. See Creating Feature Flags."
by = [
    "test:backend/tests/unit/schemas/test_feature_flag_schemas.py",
    "test:backend/tests/integration/api/test_flag_contract.py",
    "test:backend/tests/integration/api/test_flag_key_conflict.py",
]

[[unit]]
text = "POST /api/v1/safety/feature-flags/{feature_flag_id}/config, POST /api/v1/safety/feature-flags/{feature_flag_id}/rollback | #629 | The config request's rollback_percentage and the rollback's percentage query parameter accept 0–100; any other value answers 422. A value stored before the change still reads back unchanged, and the safety monitor clamps it to 0–100 when it rolls the flag back. See Safety Monitoring."
by = ["test:backend/tests/integration/api/test_safety_rollback_bounds.py"]

[[unit]]
text = "POST /api/v1/segments, PUT /api/v1/segments/{segment_id}, POST /api/v1/segments/{segment_id}/preview, POST /api/v1/segments/{segment_id}/evaluate, GET/DELETE /api/v1/segments/{segment_id}, GET /api/v1/segments/{segment_id}/experiments, POST /api/v1/segments/bulk-evaluate | #440 | Segment rules must be in the targeting rule format that flags and experiments use ({\"logical_operator\", \"groups\": [{\"conditions\": [...]}]}, operators such as equals), with at least one group and at most 20 groups, 50 conditions, 10 regex conditions and 1,000 list values; the old {\"operator\", \"conditions\"} format and anything else answer 422 on create, update and preview. Evaluate answers 409 for a segment stored in the old format, and bulk-evaluate answers false for it; stored segments are left as they are. {segment_id} is a UUID, and other text answers 422. See Upgrading: segment rules."
by = ["test:backend/tests/unit/core/test_segment_targeting_validation.py"]

[[unit]]
text = "POST /api/v1/segments, GET /api/v1/segments, GET/PUT /api/v1/segments/{segment_id}, POST /api/v1/segments/{segment_id}/evaluate, POST /api/v1/segments/bulk-evaluate, POST /api/v1/segments/{segment_id}/preview | #440 (id lists) | A segment has a kind, rules (the default) or id_list, set on create and never changed. rules is optional on create: required for a rules segment and refused for an id list (422), so a create that leaves kind out still needs rules as before. Every segment in a response carries kind; an id list's rules is null, and GET /api/v1/segments/{segment_id} fills member_count for it. A PUT that sends kind, or rules for an id list, answers 422. Evaluate and bulk-evaluate answer an id list on user_context.user_id. Preview takes the same body and answers 422 when it has no rules. Segments stored before the upgrade are rules segments. The member routes POST /api/v1/segments/{segment_id}/members and /members/remove are new and beta. See Segments made from a list of user IDs."
by = [
    "test:backend/tests/integration/api/test_segment_members_api.py::test_kind_an_id_list_is_created_without_rules",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_kind_defaults_to_rules",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_kind_cannot_be_changed",
    "test:backend/tests/integration/api/test_segment_members_api.py::test_evaluate_an_id_list",
]

[[unit]]
text = "DELETE /api/v1/segments/{segment_id}, PUT /api/v1/segments/{segment_id}, POST /api/v1/feature-flags/, PUT /api/v1/feature-flags/{flag_id}, POST /api/v1/experiments/, PUT /api/v1/experiments/{experiment_id}, POST /api/v1/experiments/{experiment_id}/clone | #440 (segment targeting) | Targeting rules accept in_segment and not_in_segment (attribute segment, the value a segment id), at most 10 segments per ruleset. Flag and experiment create and update answer 422 at [\"body\", \"targeting_rules\"] for a segment that is unknown, inactive or archived, or whose rules are not valid, and for a segment condition in a native default_rule; clone answers 409 when the rules it would copy name such a segment. Archiving a segment, or a PUT that sets its status to inactive or archived, answers 409 with {\"detail\": {\"code\": \"segment_in_use\", \"message\", \"feature_flags\", \"experiments\"}} while a flag that is not archived or a draft, active or paused experiment uses it. See Targeting Rules."
by = [
    "test:backend/tests/unit/core/test_segment_targeting_validation.py::test_ten_segments_accepted_eleven_refused",
    "test:backend/tests/integration/api/test_segment_in_use.py",
]

[[unit]]
text = "POST /api/v1/tracking/track, POST /api/v1/tracking/batch | #217 | experiment_key and feature_flag_key are both optional. An event with neither (missing, null or \"\") is stored with experiment_id, feature_flag_id and variant_id null, where it used to answer 422 (and one such entry failed a whole batch with 422). Such an event is history and counts in no experiment's results; tag outcome events. A key that is given and not found still answers 404, or is reported in the batch's errors; the detail names only the keys that were sent. The OpenAPI document does not change. See Track Event."
by = [
    "test:backend/tests/integration/api/test_tracking_untagged_events.py",
    "test:backend/tests/integration/api/test_tracking_api.py::TestTrack::test_missing_keys_store_the_event_as_history",
]

[[unit]]
text = "GET /api/v1/interactions/scan | #853 | When reading the active experiments or their assignments fails, the scan answers 500 with a fixed message and the request ID. It used to answer 200 as if nothing were running: total_active_experiments: 0, or the pairs whose assignments could not be read left out. A scan whose reads succeed answers as before. The OpenAPI document does not change."
by = ["test:backend/tests/unit/api/test_interaction_scan_failures.py"]

[[unit]]
text = "GET /api/v1/results/{experiment_id}, GET /api/v1/experiments/{experiment_id}/results, GET /api/v1/export/experiments, GET /api/v1/export/reports/experiments/{experiment_id} | #880 | When the sample-ratio check fails (srm is present and srm.warning is true), summary.recommendation is INCONCLUSIVE, whatever it would otherwise be, CONTINUE_TESTING included, and recommendation_reason names the mismatch and its p-value; the export's recommendation column says the same. has_winner, winning_variant_id, the Bayesian decision and the sequential results are unchanged. When srm is null (a bandit, fewer than two variants, no assignments, or a check that could not run) the recommendation is unchanged. The OpenAPI document does not change."
by = [
    "test:backend/tests/unit/services/test_srm.py",
    "test:backend/tests/integration/api/test_export_api.py",
]

[[unit]]
text = "DELETE /api/v1/feature-flags/{flag_id} | #855 | Deleting a flag keeps the events tagged with it: they stay, with feature_flag_id null and every other field unchanged, an experiment tag included. They used to be deleted with the flag. Everything else the delete removes is unchanged, and the response is still 204. The OpenAPI document changes only in the operation's description."
by = ["test:backend/tests/integration/api/test_flag_delete_keeps_events.py"]

[[unit]]
text = "GET /api/v1/holdout/all, POST /api/v1/holdout, PUT /api/v1/holdout/{holdout_id}, DELETE /api/v1/mutual-exclusion-groups/{group_id}, PUT /api/v1/mutual-exclusion-groups/{group_id} | #904 | These operations accept the roles their documentation states. Listing, creating and updating holdouts and archiving a group with DELETE need ADMIN or a superuser; a DEVELOPER now answers 403 on them. Changing a group's status with PUT (archiving or unarchiving) needs ADMIN too, as archiving does; a DEVELOPER may still change a group's name, description and traffic allocation, and may send its current status back. ADMIN and superusers are unchanged. The OpenAPI document changes only in the description of PUT /api/v1/mutual-exclusion-groups/{group_id}. See Mutual Exclusion Groups & Global Holdout."
by = [
    "test:backend/tests/integration/api/test_holdout_admin_roles.py",
    "test:backend/tests/unit/api/test_global_holdout_endpoints.py",
    "test:backend/tests/unit/api/test_mutual_exclusion_group_endpoints.py",
]

[[unit]]
text = "GET /api/v1/results/{experiment_id}/sequential | #854 | The confidence sequence and can_stop use the Agresti-Caffo variance of the difference in rates instead of the plug-in one, so the interval keeps its coverage when the arms are split unequally. Some experiments that showed can_stop: true and recommended_action: \"stop_for_effect\" (mostly with one small, low-rate arm) now show false and \"continue\", a few at equal splits stop slightly later, and a very few, mostly with rates near 50%, stop slightly earlier; an arm in which every user has the same outcome now gets a finite interval instead of [-1, 1]. lambda_ratio is capped at the largest finite double (about 1.8e308), so an overwhelming difference reports a finite number and can stop. The response's fields are unchanged and analysis_status stays beta. The engine version becomes 1.4.0; the OpenAPI document changes only in the engine_version default of the responses that carry it (bandit, Bayesian, variance reduction). See Sequential Testing."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_unequal_arms.py",
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py",
    "test:backend/tests/unit/services/test_engine_fingerprint.py",
]

[[unit]]
text = "POST /api/v1/tracking/assign, POST /api/v1/tracking/assign/batch | #822 | Experiment targeting treats a missing attribute as flags do. A new user whose context lacks an attribute is no longer refused outright (assigned: false, reason: \"targeting\"): they fail only the conditions on that attribute, and is_null on it passes. So a user who matches one OR branch is enrolled even when they lack an attribute used only in another branch, and a user without an attribute now matches a NOT group on it (a user with no country matches NOT (country equals US), but still not country not_equals US). AND still needs every condition to hold. Users already assigned keep their assignment. The OpenAPI document does not change. See Targeting Rules."
by = [
    "test:backend/tests/unit/services/test_experiment_targeting_missing_attribute.py",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssignEligibility::test_or_targeting_enrols_a_user_lacking_the_other_branch_attribute",
]

[[unit]]
text = "GET /api/v1/results/{experiment_id}, GET /api/v1/experiments/{experiment_id}/results | #922 | When the experiment has sequential testing on, sequential_testing carries the analysis GET /api/v1/results/{experiment_id}/sequential serves at the experiment's stored alpha (the primary metric, the control against the first treatment); it used to be null always. It stays null when sequential testing is off, and is null when the analysis could not be computed (the API logs a warning); the rest of the response is unaffected. It is cached with the results, so an answer cached before the upgrade keeps null until it expires (5 minutes for a running experiment, 24 hours otherwise) or POST /api/v1/results/{experiment_id}/invalidate-cache clears it. For the same reason a change to sequential_testing_enabled or sequential_testing_config, which is accepted on a running experiment, shows on these routes when the cached answer expires or is cleared, not immediately. The OpenAPI document does not change. See Sequential Testing."
by = ["test:backend/tests/integration/api/test_results_embeds_sequential.py"]

[[unit]]
text = "GET /api/v1/results/{experiment_id}/sequential, GET /api/v1/results/{experiment_id}, GET /api/v1/experiments/{experiment_id}/results | #929 | The sequential analysis compares the control against the treatment created first (created_at, then id), on every call. It used to take the treatment the database returned first, which on an experiment with three or more variants could change between two calls with no change to the data, so the analysis could switch arms. Two-variant experiments are unchanged, and so are the numbers for a given pair of arms. The results routes' cache is not keyed on the arm, so an answer cached before the upgrade is served until it expires (5 minutes for a running experiment, 24 hours otherwise) or POST /api/v1/results/{experiment_id}/invalidate-cache clears it. The OpenAPI document does not change. See Sequential Testing."
by = ["test:backend/tests/integration/api/test_sequential_treatment_arm.py"]

[[unit]]
text = "GET /api/v1/experiments/, POST /api/v1/experiments/, GET/PUT /api/v1/experiments/{experiment_id}, POST /api/v1/experiments/{experiment_id}/start, POST /api/v1/experiments/{experiment_id}/pause, PUT /api/v1/experiments/{experiment_id}/schedule, POST /api/v1/experiments/{experiment_id}/complete, POST /api/v1/experiments/{experiment_id}/archive, POST /api/v1/experiments/{experiment_id}/clone | #935 | An experiment whose creator's account was removed still reads and lists, with owner_id: null; every one of these operations answers with the same ExperimentResponse, whose owner_id is now nullable and no longer required. An experiment whose creator still exists answers as before, with the creator's id. The dashboard shows such an experiment's owner as \"No owner\". The OpenAPI document changes only in ExperimentResponse: owner_id becomes nullable and leaves the schema's required list."
by = [
    "test:backend/tests/integration/api/test_experiment_reads_after_owner_removed.py",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot",
]

[[unit]]
text = "GET /api/v1/experiments/{experiment_id} | #921 | The response carries owner_name, the name of the user who created the experiment: their full name, else their username when it contains no @, else null. It is never their email, and it is null for an experiment with no owner (owner_id: null). It is looked up on every read and is not cached, so a change of name shows on the next read. Every other field is unchanged, and the list and the other experiment routes do not carry it. The dashboard shows it as the owner of an experiment someone else created. The OpenAPI document changes only in this operation's response schema, which becomes ExperimentDetailResponse (ExperimentResponse plus owner_name)."
by = ["test:backend/tests/integration/api/test_experiment_owner_name.py"]

[[unit]]
text = "DELETE /api/v1/users/{user_id}, DELETE /api/v1/admin/users/{user_id} | #946 | Removing a user's account keeps the segments and rollout schedules it created, with no owner: the segments are still listed and read, and each rollout schedule still reads with all of its stages and owner_id: null. Its API keys are still removed with it, and the response is still 204. The OpenAPI document does not change."
by = ["test:backend/tests/integration/api/test_account_removal_keeps_segments_and_schedules.py"]

[[unit]]
text = "GET /api/v1/integrations, POST /api/v1/integrations, GET/PUT /api/v1/integrations/{integration_type} | #968 | These operations no longer return the values of stored secrets: encrypted_config carries only base_url, email, project_key, instance_url, client_id, repo_owner and repo_name, and every other stored key is named in the new stored_secrets list. PUT merges encrypted_config key by key: a key sent with a value replaces it, a key sent as null removes it, and a key not sent is kept (it used to replace the whole object). The OpenAPI document changes in IntegrationConfigResponse (adds stored_secrets) and in the PUT description. See What a response shows."
by = [
    "test:modules/backend/tests/integration/api/test_integrations_api.py",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot",
]

[[unit]]
text = "POST/GET /api/v1/safety/feature-flags/{feature_flag_id}/config, GET /api/v1/safety/feature-flags/{feature_flag_id}/check | #954 | The config request refuses null for enabled, metrics and rollback_percentage with 422 (\"type\": \"null_not_allowed\" at [\"body\", <field>]) and writes nothing. A null used to answer 500, and a null metrics was stored first; the exception was a create that also sent metrics, where a null enabled or rollback_percentage was taken as its default and answered 200, and that create now answers 422 as well. A field left out still keeps its stored value, and on create takes its default: a create that left metrics out used to store a null and answer 500, and now stores {}. A configuration stored with a null metrics reads back with metrics: {}, and the check and the safety monitor treat it as no thresholds; the reads used to answer 500 and the monitor skipped the flag. The OpenAPI document changes only in FeatureFlagSafetyConfigUpdate: its three fields are no longer nullable, and its description. See Safety Monitoring."
by = ["test:backend/tests/integration/api/test_safety_config_nulls.py"]

[[unit]]
text = "POST /api/v1/experiments/{experiment_id}/start, POST /api/v1/experiments/{experiment_id}/complete | #974 | Starting a draft before its scheduled start_date sets its start_date to now; it used to keep the scheduled date, still ahead, and completing the experiment then answered 500. A scheduled end_date is kept, and a draft whose scheduled start has passed, a resume from paused and an experiment the scheduler starts keep their start_date as before. Completing an experiment whose start_date is still after now (one an earlier version started early) answers 200 and sets that start_date to one microsecond before the new end_date; it used to answer 500. The OpenAPI document changes only in the two operations' descriptions."
by = ["test:backend/tests/integration/api/test_complete_after_early_start.py"]

[[unit]]
text = "POST /api/v1/power/sample-size, POST /api/v1/power/mde, POST /api/v1/power/runtime | #1003 | n_variants accepts at most 100, and sample_size_per_variant, required_sample_size and daily_traffic at most 1,000,000,000,000 (10^12); a larger value answers 422 at [\"body\", <field>] with \"type\": \"less_than_equal\". Before, most of these fields answered 500 for a value too large to convert to a float (above about 1.8e308) and 200 for smaller ones; sample_size_per_variant on /mde answered 200 at any size, and a very large n_variants on /sample-size could answer a 422 about the effect size. Any of these values above the new bound now answers 422 at the field. A sample size whose calculation still leaves floating-point range (a mean or ratio metric with a very large or infinite baseline_std, or a baseline so small that the squared difference underflows) answers 422 with a fixed message; it used to answer 500. Every other request answers as before. The OpenAPI document changes only in the maximum of those seven request fields. See Statistical Power Analysis."
by = [
    "test:backend/tests/integration/api/test_power_calculator_api.py",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot",
]

[[unit]]
text = "POST /api/v1/power/plan | #1011 | The advice is always the built-in planning advice and generated_by is always \"template\", whatever the API's environment; it no longer calls Claude when ANTHROPIC_API_KEY is set. The request and response are unchanged. The OpenAPI document changes only in the operation's summary and description, in the descriptions of PlanRequest, PlanResponse and its generated_by field, and in the description of the Power Calculator tag. See Statistical Power Analysis."
by = ["test:backend/tests/unit/api/test_power_plan_builtin_advice.py"]

[[unit]]
text = "POST /api/v1/tracking/events | #400 | An experiment_id, feature_flag_id or variant_id that is a UUID naming no stored experiment, feature flag or variant answers 404, and nothing is stored; it used to answer 500 with \"Could not store the event\". The detail names each such field, never the id that was sent: {\"detail\": \"No experiment has that experiment_id.\"}, with one sentence per field when more than one names nothing. Only existence is checked, as the database did: an event whose ids all name stored rows is stored and answered as before, whoever owns them. An id that is not a UUID still answers 422, before any lookup. The OpenAPI document changes only in this operation's description and its new 404 response. See Track Event by Ids."
by = ["test:backend/tests/integration/api/test_tracking_events_unknown_ids.py"]

[[unit]]
text = "POST /api/v1/ai/design, POST /api/v1/ai/interpret/{experiment_id} | #1043 | Each operation allows 10 requests a minute per client address, where it had the default of 300, and above that answers 429 Too Many Requests with Retry-After: 60; every experiment id draws on the interpretation's one count. With ANTHROPIC_API_KEY set, each call to Claude gives up when Claude has not answered in 30 seconds, and is tried at most twice (it used to give up only after 600 seconds and be tried three times); when it fails, the operation answers with its template-based suggestion or interpretation, as it already did when Claude was unavailable. Without the key only the limit is new. The request and response are the same, and so is the OpenAPI document. See AI Endpoints and the MCP Manifest."
by = [
    "test:backend/tests/unit/middleware/test_ai_rate_limits.py",

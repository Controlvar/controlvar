    "test:backend/tests/smoke/test_openapi_snapshot.py::test_core_api_matches_stable_snapshot",
]

[[unit]]
text = "Any difference fails the smoke suite."
by = ["exempt:baseline"]

[[unit]]
text = "A path/method marked beta may change or disappear: the test warns instead."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_compare_flags_changes_to_beta_operations_as_warnings_only"]

[[unit]]
text = "A path/method that exists but is not in the snapshot yet is a warning too: run make openapi, commit the result, and decide whether it is beta."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_compare_reports_unsnapshotted_operations_as_warnings"]

[[unit]]
text = "openapi-v1.full.json must be a superset of openapi-v1.stable.json, and the module-only paths must be exactly the list in frontend/src/tests/fixtures/openapi.module-paths.json, so the three fixtures cannot drift apart."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_stable_snapshot_is_a_subset_of_the_full_snapshot"]

[[unit]]
text = "That fixture is maintained by hand."
by = ["exempt:baseline"]

[[unit]]
text = "Every route is stable by default."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_compare_flags_changes_to_stable_operations_as_errors"]

[[unit]]
text = "Stability is a promise about the shape of the route — its URL, parameters, request and response schemas — not about its behaviour."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_compare_flags_changes_to_stable_operations_as_errors"]

[[unit]]
text = "Marking a route beta"
by = ["exempt:baseline"]

[[unit]]
text = "Stability is declared on the route, in the OpenAPI document itself, with the x-stability extension, so the snapshot carries it and the test can read it without a side table:"
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_snapshots_are_well_formed"]

[[unit]]
text = "openapi_extra is merged into the operation object by FastAPI, so the snapshot shows \"x-stability\": \"beta\" on that method."
by = ["test:backend/tests/unit/core/test_analysis_status.py::test_demoted_routes_are_beta_in_the_openapi_document"]

[[unit]]
text = "Only the value beta means anything; leave the key off a stable route."

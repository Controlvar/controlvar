]

[[unit]]
text = "A role or grant can hold only the eleven permissions below, and none gives administration: managing users, custom roles and grants, other users' API keys, holdouts and exclusion-group status, and safety settings depends on the built-in role or the superuser flag, never on a custom role or grant."

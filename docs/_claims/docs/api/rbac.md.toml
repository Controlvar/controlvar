]

[[unit]]
text = "No permission check uses this set (see the note above):"
by = ["test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_no_permission_check_reads_custom_roles_or_direct_grants"]

[[unit]]
text = "Superusers (is_superuser=True) pass every permission check and have full access to every resource and action."
by = [
    "test:backend/tests/unit/core/test_permissions.py::TestCheckPermission::test_superuser_permission",
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestEffectivePermissions::test_superuser_has_all_permissions",
]

[[unit]]
text = "Permission Resolution Precedence"
by = ["exempt:baseline"]

[[unit]]
text = "These rules describe the set the endpoint shows:"
by = ["exempt:baseline"]

[[unit]]
text = "Permissions are additive — a permission granted by any layer is granted overall."
by = ["test:modules/backend/tests/unit/services/test_rbac_service.py::TestGetEffectivePermissions::test_custom_role_permissions_merged"]

[[unit]]
text = "There is no deny mechanism; a higher layer cannot revoke a permission given by a lower layer."

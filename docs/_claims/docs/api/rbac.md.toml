[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "The RBAC (Role-Based Access Control) module stores three layers of permissions for a user:"
by = [
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_no_permission_check_reads_custom_roles_or_direct_grants",
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_a_custom_role_or_grant_is_shown_and_changes_nothing_the_user_can_do",
]

[[unit]]
text = "Base Role — One of four built-in system roles assigned to every user (admin, developer, analyst, viewer)."
by = [
    "test:backend/tests/unit/core/test_permissions.py",
    "test:modules/backend/tests/unit/api/test_rbac_integration.py",
]

[[unit]]
text = "Defined as the static ROLE_PERMISSIONS dict in backend/app/core/permissions.py."
by = [
    "test:backend/tests/unit/core/test_permissions.py",
    "test:modules/backend/tests/unit/api/test_rbac_integration.py",
]

[[unit]]
text = "Custom Roles — DB-backed roles with configurable per-resource/action permission sets."
by = [
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestCreateRole::test_admin_can_create_role",
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestAssignRevokeRole::test_admin_can_assign_role_to_user",
]

[[unit]]
text = "An admin can create any number of custom roles and assign them to users."
by = [
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestCreateRole::test_admin_can_create_role",
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestAssignRevokeRole::test_admin_can_assign_role_to_user",
]

[[unit]]
text = "Direct Permission Grants — Per-user, per-resource grants made without assigning a role."
by = [
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestDirectPermissionGrants::test_admin_can_grant_direct_permission",
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestDirectPermissionGrants::test_grant_with_expiry_date_accepted",
]

[[unit]]
text = "Supports optional expiry timestamps for temporary grants."
by = [
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestDirectPermissionGrants::test_admin_can_grant_direct_permission",
    "test:modules/backend/tests/integration/api/test_rbac_api.py::TestDirectPermissionGrants::test_grant_with_expiry_date_accepted",
]

[[unit]]
text = "Only the base role decides what a user can do"
by = [
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_no_permission_check_reads_custom_roles_or_direct_grants",
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_a_custom_role_or_grant_is_shown_and_changes_nothing_the_user_can_do",
]

[[unit]]
text = "Routes check the base role (through check_permission() in backend/app/core/permissions.py) or the superuser flag; none reads custom roles or direct grants."
by = [
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_no_permission_check_reads_custom_roles_or_direct_grants",
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_a_custom_role_or_grant_is_shown_and_changes_nothing_the_user_can_do",
]

[[unit]]
text = "Custom roles and direct grants are stored, and shown by GET /api/v1/rbac/users/{user_id}/permissions, but no permission check reads them: assigning a custom role or granting a permission changes nothing a user can do."
by = [
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_no_permission_check_reads_custom_roles_or_direct_grants",
    "test:modules/backend/tests/unit/services/test_rbac_layers_are_display_only.py::test_a_custom_role_or_grant_is_shown_and_changes_nothing_the_user_can_do",
]

[[unit]]
text = "Whether to make them take effect or remove them is tracked in #891."
by = ["exempt:baseline"]

[[unit]]
text = "Effective Permissions Resolution"
by = ["exempt:baseline"]

[[unit]]
text = "GET /api/v1/rbac/users/{user_id}/permissions merges all three layers to build the set it shows."
by = [
    "test:modules/backend/tests/unit/services/test_rbac_service.py::TestGetEffectivePermissions::test_custom_role_permissions_merged",

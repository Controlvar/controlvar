]

[[unit]]
text = "Users are assigned to at most one experiment within the group."
by = ["test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestGroupRules::test_m9_with_both_live_from_the_start_each_user_is_in_exactly_one"]

[[unit]]
text = "A user who is not eligible is still answered by POST /api/v1/tracking/assign, with status 200, the control variant, \"assigned\": false and \"reason\": \"mutual_exclusion\"."
by = ["test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestPublicAssignRoute::test_m4_tracking_assign_refuses_with_no_row_and_no_event"]

[[unit]]
text = "Nothing is recorded for them."
by = ["exempt:baseline"]

[[unit]]
text = "Enrolment is sticky across the group."
by = ["test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestActivatingASibling::test_m1_users_of_a_are_not_enrolled_in_b_after_b_is_activated"]

[[unit]]
text = "A user enrolled in one experiment of a group is never enrolled in another experiment of that group, even as experiments are activated, paused or resumed."
by = ["test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestActivatingASibling::test_m1_users_of_a_are_not_enrolled_in_b_after_b_is_activated"]

[[unit]]
text = "The hash divides new users among the experiments that are active at the time of the request; a user who already has an assignment in another experiment of the group that is active, paused or still a draft is answered as not eligible, with the same \"reason\": \"mutual_exclusion\"."
by = [
    "test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestSiblingStatus::test_m3_paused_or_draft_sibling_holds_its_users",
    "test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestActivatingASibling::test_m1b_everyone_lands_in_a_while_b_is_draft",
]

[[unit]]
text = "So an experiment activated later in a group fills more slowly than one that started with it: only users not yet enrolled elsewhere in the group can join it."
by = ["test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestActivatingASibling::test_m2_new_users_still_reach_b"]

[[unit]]
text = "Completing an experiment, or removing it from the group, releases its users, and they can then be enrolled in another experiment of the group."
by = [
    "test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestSiblingStatus::test_m3b_completed_or_archived_sibling_releases_its_users",
    "test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestGroupRules::test_m9_removing_a_from_the_group_releases_its_users",
]

[[unit]]
text = "Assignments that already exist are always kept, so a user who was enrolled in two experiments of a group before this rule applied stays in both."
by = ["test:backend/tests/integration/services/test_mutual_exclusion_sticky.py::TestWhatIsNotAnEnrolment::test_m7_existing_double_enrolment_is_kept"]

[[unit]]
text = "The check is made per request."
by = ["untested:T"]

[[unit]]
text = "If the group's set of active experiments changes while two requests for the same new user are in flight, both can succeed."
by = ["untested:T"]


[[unit]]
text = "Each event carries the actor's id, the resource id, and a snapshot of a few fields in old_value and new_value: for a flag update, its key, name, status and rollout percentage; for an experiment update, its name, status and targeting rules; a create records the new key and name (a flag) or name (an experiment), and a delete the old key, name and status (a flag) or name, status and owner (an experiment)."
by = ["test:backend/tests/unit/services/test_compliance_trail_writers.py::test_each_event_carries_a_snapshot_of_a_few_fields"]

[[unit]]
text = "Field names containing password, token, api_key or secret are replaced with [REDACTED]."
by = [
    "test:backend/tests/unit/services/test_audit_log_service.py::TestRedactSensitive",
    "test:backend/tests/unit/services/test_audit_log_service.py::TestAuditLogServiceLog::test_log_event_redacts_sensitive_fields_in_old_value",
]

[[unit]]
text = "Not recorded here: sign-ins, role changes, API key changes, flag status changes and experiment start, pause and completion, which go to the audit log; sign-outs and failed sign-ins, which neither records; and reading, reporting on or exporting this trail."
by = [
    "test:backend/tests/unit/services/test_compliance_trail_writers.py::test_flag_status_changes_and_experiment_lifecycle_write_no_event",
    "test:backend/tests/unit/services/test_compliance_trail_writers.py::test_only_these_actions_write_an_event",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_failed_sign_in_writes_nothing",
]

[[unit]]
text = "AuditAction defines READ, LOGIN, LOGOUT, LOGIN_FAILED, ROLE_GRANT, ROLE_REVOKE, KEY_REVOKE, EXPORT and REPORT_GENERATED, and you can filter on them, but nothing in this release writes them."
by = ["test:backend/tests/unit/services/test_compliance_trail_writers.py::test_only_these_actions_write_an_event"]

[[unit]]
text = "For flags, experiments and warehouse analysis runs, a failure to write the event does not fail the request that made the change: the change is kept and the failure is logged as a warning."
by = ["test:backend/tests/integration/api/test_change_audit_saved.py::test_failed_audit_write_keeps_the_answer_and_the_change"]


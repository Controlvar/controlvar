[[unit]]
text = "Compliance Audit Trail API"
by = ["exempt:baseline"]

[[unit]]
text = "Partly in the compliance module"
by = ["exempt:baseline"]

[[unit]]
text = "The event listing, GET /api/v1/compliance/audit-events, is core and answers in every profile."
by = ["test:backend/tests/unit/core/test_optional_modules.py::TestComplianceRoutesRefusedWithoutTheModule::test_audit_event_listing_stays_core"]

[[unit]]
text = "The SOC 2 / ISO 27001 reports and the export are the compliance module's: a core deployment still declares those two routes but answers them 501, after the role check."
by = ["test:backend/tests/unit/services/test_compliance_trail_writers.py::test_core_answers_the_report_and_export_501_after_the_role_check"]

[[unit]]
text = "HMAC signing of new events is also the module's; in a core deployment events are recorded unsigned."
by = ["test:backend/tests/unit/services/test_compliance_trail_writers.py::test_core_records_events_unsigned"]

[[unit]]
text = "See Modules and profiles for what each profile includes and how to run the full one."
by = ["exempt:baseline"]

[[unit]]
text = "The compliance audit trail is an append-only table of changes to experiments, feature flags and (in the full profile) warehouse connections, sources and analysis runs."
by = [
    "test:backend/tests/unit/services/test_compliance_trail_writers.py::test_only_these_actions_write_an_event",
    "test:backend/tests/unit/services/test_compliance_trail_writers.py::test_nothing_changes_or_deletes_an_event_once_written",
]

[[unit]]
text = "It is a separate record from the audit log at /api/v1/audit-logs, which records feature-flag status changes (toggle, enable, disable, bulk toggle)."
by = [
    "test:backend/tests/smoke/test_audit_inventory.py",
    "test:backend/tests/integration/api/test_audit_route_events.py",
]

[[unit]]
text = "A flag toggled on or off is written there, not here."
by = ["test:backend/tests/unit/services/test_compliance_trail_writers.py::test_flag_status_changes_and_experiment_lifecycle_write_no_event"]

[[unit]]
text = "What is recorded"
by = ["exempt:baseline"]


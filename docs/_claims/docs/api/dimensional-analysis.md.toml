document = "docs/api/dimensional-analysis.md"

[[unit]]
text = "Dimensional Analysis & Segment Breakdown (Issue #28)"
by = ["exempt:baseline"]

[[unit]]
text = "Dimensional analysis breaks experiment results down by user segments (e.g., by device, country, plan tier, browser) to reveal heterogeneous treatment effects (HTE) — cases where the treatment works differently for different groups."
by = [
    "test:backend/tests/unit/api/test_dimensional_analysis_api.py::TestBreakdownQueryParam::test_breakdown_response_contains_segments",
    "test:backend/tests/unit/api/test_dimensional_analysis_api.py::TestBreakdownQueryParam::test_hte_detected_sets_flag_and_warning",
]

[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "When you run an experiment, the top-level result shows the average effect across all users."
by = ["exempt:baseline"]

[[unit]]
text = "Dimensional analysis answers: \"Did the effect differ by segment?\""
by = ["exempt:baseline"]

[[unit]]
text = "This is useful for:"
by = ["exempt:baseline"]

[[unit]]
text = "Discovering that a feature performs well for mobile users but poorly for desktop"
by = ["exempt:baseline"]

[[unit]]
text = "Identifying segments where the treatment has a negative effect (safety check)"
by = ["exempt:baseline"]

[[unit]]
text = "Informing rollout decisions (e.g., roll out to the winning segment first)"
by = ["exempt:baseline"]

[[unit]]
text = "Statistical Approach"
by = ["exempt:baseline"]

[[unit]]
text = "Bonferroni Correction"
by = ["exempt:baseline"]

[[unit]]
text = "When testing multiple segments simultaneously, running standard p-value tests at α = 0.05 per segment inflates the overall false positive rate."
by = ["exempt:baseline"]

[[unit]]
text = "The service applies Bonferroni correction:"
by = ["test:backend/tests/unit/services/test_dimensional_analysis_service.py::TestGetAdjustedAlpha::test_bonferroni_divides_alpha_by_num_segments"]

[[unit]]
text = "For example, testing 10 segments at α = 0.05 gives an adjusted threshold of α = 0.005 per segment."
by = ["test:backend/tests/unit/services/test_dimensional_analysis_service.py::TestGetAdjustedAlpha::test_bonferroni_divides_alpha_by_num_segments"]

[[unit]]
text = "All segment results are marked is_exploratory: true — they should be treated as hypothesis-generating, not confirmatory."
by = ["docex:docs/api/dimensional-analysis.md#\"dimension\": \"device\""]

[[unit]]
text = "A significant segment finding should be validated with a dedicated follow-up experiment."
by = ["exempt:baseline"]

[[unit]]
text = "HTE Detection"
by = ["exempt:baseline"]

[[unit]]
text = "Heterogeneous treatment effect detection compares the first treatment with the control."
by = ["test:backend/tests/unit/services/test_dimensional_analysis_service.py::TestDetectHTE::test_hte_detected_when_effects_differ_strongly"]

[[unit]]
text = "It flags the experiment when a chi-squared test on their conversion counts across the segments gives p < 0.05, when the lift varies widely between segments, or when the lift is positive in one segment and negative in another."
by = [
    "test:backend/tests/unit/services/test_dimensional_analysis_service.py::TestDetectHTE::test_hte_detected_when_effects_differ_strongly",
    "test:backend/tests/unit/services/test_dimensional_analysis_service.py::TestDetectHTE::test_no_hte_when_effects_are_homogeneous",
    "test:backend/tests/unit/services/test_dimensional_analysis_service.py::TestDetectHTE::test_single_segment_never_has_hte",
]

[[unit]]
text = "Where the segments come from"
by = ["exempt:baseline"]

[[unit]]
text = "Each user is counted once, in the segment of the value the user was first assigned with, or else the first value tracked for them, so for every variant the segments add up to the experiment's users and converting users."
by = [
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_user_with_events_in_two_segments_is_in_one",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_users_without_a_value_are_counted_under_unknown",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_the_sdk_path_puts_each_converter_in_its_assignment_context_segment",
]

[[unit]]
text = "The value is a top-level key of the context sent with POST /api/v1/tracking/assign, which is stored with the user's assignment event, or of an event's metadata."
by = [
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_the_sdk_path_puts_each_converter_in_its_assignment_context_segment",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_values_are_the_exact_text_of_a_top_level_key",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_user_value_is_the_first_received_keyed_event_order",
]

[[unit]]
text = "Assignment events come first, then the user's other events in the order the server received them; an event's own timestamp does not move a user."
by = [
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_user_value_is_the_first_received_keyed_event_order",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_an_exposure_value_wins_over_an_earlier_keyed_event_order",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_user_value_on_equal_keys_is_the_smaller_event_id_tie",
]

[[unit]]
text = "So a user assigned with {\"device\": \"mobile\"} who checks out on desktop is counted once, under mobile, with that checkout."
by = ["test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_user_with_events_in_two_segments_is_in_one"]

[[unit]]
text = "A user's conversions count in their segment whether or not the conversion events carry the key."
by = [
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_conversion_without_the_key_counts_in_the_users_segment",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_the_sdk_path_puts_each_converter_in_its_assignment_context_segment",
]

[[unit]]
text = "Users with no value are counted under unknown: users whose events never carry the key, or carry it as null or \"\", and users with no events at all."
by = [
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_users_without_a_value_are_counted_under_unknown",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_user_whose_only_value_is_empty_is_counted_under_unknown",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_values_are_the_exact_text_of_a_top_level_key",
]

[[unit]]
text = "A value is compared as exact text, with no trimming or change of case: iOS and ios are two segments, true is the text true, and an object is its JSON text."
by = ["test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_values_are_the_exact_text_of_a_top_level_key"]

[[unit]]
text = "A value unknown is counted under unknown."
by = ["test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_literal_other_and_unknown_take_no_listed_slot_cap"]

[[unit]]
text = "POST /api/v1/tracking/assign/batch records no assignment event, so its context sets no segment; send the key on an event."
by = ["test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_batch_assigned_user_is_placed_by_a_tracked_event_batch"]

[[unit]]
text = "A breakdown lists the 20 values with the most users and counts the rest under other."
by = [
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_values_beyond_the_listed_ones_fold_into_other_cap",
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_the_listed_values_are_those_with_the_most_users_cap",
]

[[unit]]
text = "A value longer than 255 characters is counted under other."
by = ["test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_a_value_longer_than_255_characters_is_counted_under_other_long_values"]

[[unit]]
text = "To break results down by an attribute, send it in the user's attributes when you assign them: context on the API, user_attributes in the Python SDK and attributes in the JavaScript and React SDKs."
by = [
    "test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_the_sdk_path_puts_each_converter_in_its_assignment_context_segment",
    "test:sdk/python/tests/test_client.py::TestGetAssignment::test_sends_post_with_context",
    "test:sdk/js/__tests__/client.test.ts::sends {experiment_key, user_id, context: attributes} as the JSON body",
    "test:sdk/react/src/__tests__/useExperiment.test.tsx::POSTs {experiment_key, user_id, context} to /api/v1/tracking/assign",
]

[[unit]]
text = "The events you track then need no properties."
by = ["test:backend/tests/integration/api/test_breakdown_one_segment_per_user.py::test_the_sdk_path_puts_each_converter_in_its_assignment_context_segment"]

[[unit]]
text = "The dashboard's Breakdowns tab offers platform, country and user_tier; any other key works through the API."
by = [
    "test:frontend/src/tests/components/ResultsDashboard.test.tsx::fetches breakdown and renders SegmentComparisonTable when a dimension is selected",

by = ["test:backend/tests/unit/api/test_sequential_results_api.py::TestSequentialTestingInResults::test_a_failed_sequential_analysis_is_null_and_logged"]

[[unit]]
text = "It is cached with the rest of the results: for up to 5 minutes for a running experiment and 24 hours otherwise."
by = [
    "test:backend/tests/integration/api/test_sequential_results_routes.py::test_a_settings_change_reaches_the_cached_results_only_once_cleared",

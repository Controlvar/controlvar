by = ["exempt:baseline"]

[[unit]]
text = "GET /api/v1/results/{experiment_id}/sequential"
by = ["exempt:baseline"]

[[unit]]
text = "Returns the full sequential analysis for an experiment, on its primary metric: the control against the treatment created first, so an experiment with three or more variants compares only that one, and the same one on every call."
by = ["test:backend/tests/integration/api/test_sequential_treatment_arm.py::test_sequential_analysis_compares_the_control_against_the_treatment_created_first"]

[[unit]]
text = "It takes one optional query parameter, alpha: the significance level for this request, above 0 and at most 0.2, which overrides the stored sequential_testing_config.alpha (default 0.05); a value outside the range answers 422."
by = ["docex:docs/api/sequential-testing.md#\"method\": \"msprt\""]

[[unit]]
text = "Any logged-in user can read it."
by = ["test:backend/tests/integration/api/test_sequential_results_routes.py::test_any_signed_in_user_reads_the_sequential_analysis"]

[[unit]]
text = "It answers 404 with \"Sequential testing is not enabled for this experiment\" when it is off, and \"Experiment not found\" when there is no such experiment."
by = ["test:backend/tests/unit/api/test_sequential_results_api.py::TestGetSequentialResults::test_sequential_endpoint_returns_404_for_missing_experiment"]

[[unit]]
text = "It prints \"method\": \"msprt\", the boundary 20.0 (that is 1/α at the default α of 0.05), the strength of the evidence so far, the recommended action, the advisory at_risk, an empty alpha_spending and \"analysis_status\": \"beta\"."
by = ["docex:docs/api/sequential-testing.md#\"method\": \"msprt\""]

[[unit]]

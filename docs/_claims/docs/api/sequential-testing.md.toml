# What verifies each unit of docs/api/sequential-testing.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/api/sequential-testing.md"

[[unit]]
text = "Sequential Testing & Early Stopping"
by = ["exempt:baseline"]

[[unit]]
text = "Sequential testing lets you continuously monitor experiment results and stop as soon as you have enough evidence — without inflating your false positive rate."
by = ["test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_aa_false_rejections_under_peeking"]

[[unit]]
text = "Methods"
by = ["exempt:baseline"]

[[unit]]
text = "mSPRT (mixture Sequential Probability Ratio Test)"
by = ["exempt:baseline"]

[[unit]]
text = "The method the analysis uses."
by = ["docex:docs/api/sequential-testing.md#\"method\": \"msprt\""]

[[unit]]
text = "Computes a likelihood ratio (lambda_ratio) that accumulates evidence for an effect:"
by = ["docex:docs/api/sequential-testing.md#\"method\": \"msprt\""]

[[unit]]
text = "lambda_ratio >= 1/alpha → strong evidence for an effect, in either direction (stop_for_effect); the direction decides whether to ship (see Reading a stop decision)"
by = [
    "test:backend/tests/unit/api/test_sequential_decisions.py::test_a_worse_treatment_stops_for_effect_as_a_better_one_does",
    "test:backend/tests/unit/api/test_sequential_decisions.py::test_the_boundary_is_one_over_alpha_in_either_direction",
]

[[unit]]
text = "Otherwise → continue collecting data (continue)"
by = ["test:backend/tests/unit/services/test_sequential_testing_service.py::TestIntegration::test_full_analysis_continue"]

[[unit]]
text = "The mSPRT has no futility boundary, so the analysis never tells you to stop for futility."
by = [
    "test:backend/tests/unit/api/test_sequential_contract.py::test_long_running_inconclusive_is_at_risk_and_continue",
    "test:backend/tests/unit/api/test_sequential_contract.py::test_recommended_action_set_is_the_dashboard_type",
]

[[unit]]
text = "An experiment that is running well past its expected duration is flagged with the advisory at_risk, which is not evidence that there is no effect."
by = [
    "test:backend/tests/unit/api/test_sequential_contract.py::test_long_running_inconclusive_is_at_risk_and_continue",
    "test:backend/tests/unit/api/test_sequential_contract.py::test_long_running_with_a_clear_effect_still_stops_for_effect",
]

[[unit]]
text = "The always_valid_p_value can be interpreted like a standard p-value at any point without inflating Type I error."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_aa_false_rejections_under_peeking",
    "test:backend/tests/unit/stats_validation/test_sequential_p_value.py::test_the_always_valid_p_value_is_one_over_the_mixture_ratio",
    "test:backend/tests/unit/stats_validation/test_sequential_p_value.py::test_the_p_value_is_below_alpha_exactly_when_the_analysis_can_stop",
    "test:backend/tests/unit/stats_validation/test_sequential_p_value.py::test_aa_paths_read_through_the_p_value_reject_at_most_alpha",
]

[[unit]]
text = "lambda_ratio is computed in log space and capped at the largest finite double (about 1.8 × 10³⁰⁸), so an overwhelming difference, such as 10% against 11% with ten million users per arm, still reports a finite number and can stop."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_overwhelming_difference_stays_finite_and_stops",
    "test:backend/tests/unit/api/test_sequential_contract.py::test_overwhelming_difference_answers_a_finite_lambda",
]

[[unit]]
text = "Always-Valid Confidence Intervals (Confidence Sequences)"
by = ["exempt:baseline"]

[[unit]]
text = "A confidence sequence is a confidence interval that is valid at every sample size simultaneously."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_anytime_coverage",
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_narrows_below_a_tenth_of_a_point_at_ten_million",
]

[[unit]]
text = "The interval shrinks as more data is collected."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_anytime_coverage",
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_narrows_below_a_tenth_of_a_point_at_ten_million",
]

[[unit]]
text = "It is the same mSPRT turned into an interval (the normal-mixture confidence sequence of Johari et al."
by = ["test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_half_width_closed_form"]

[[unit]]
text = "2017 and Howard et al."
by = ["exempt:baseline"]

[[unit]]
text = "2021), on the difference in conversion rates (treatment minus control), with the same alpha and tau_squared:"
by = ["exempt:baseline"]

[[unit]]
text = "where the estimate is the observed difference in rates and V is the Agresti-Caffo variance of that difference: one conversion and one non-conversion are added to each arm, p̃ = (conversions + 1) / (users + 2), and V = p̃_c (1 − p̃_c) / (n_c + 2) + p̃_t (1 − p̃_t) / (n_t + 2)."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_half_width_closed_form",
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_all_or_nothing_arms_get_a_finite_interval",
]

[[unit]]
text = "The mSPRT uses the same V."
by = ["exempt:baseline"]

[[unit]]
text = "Because the interval and the stop decision share V, τ² and α, they cannot disagree: 0 is outside the interval exactly when can_stop is true."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_matches_can_stop",
    "test:backend/tests/unit/stats_validation/test_sequential_unequal_arms.py::test_can_stop_is_zero_outside_the_interval_on_every_look",
]

[[unit]]
text = "At a 10% conversion rate, α = 0.05 and the default τ² = 0.001, the half-width is about 0.041 at 1,000 users per arm, 0.0136 at 10,000 and 0.00055 at 10 million."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_half_width_closed_form",
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_half_width_closed_form_across_sizes",
]

[[unit]]
text = "A difference in rates cannot leave [-1, 1], so the interval is clipped to that range: with 10 users per arm at a 50% rate the formula gives about ±3.27, and the response reports [-1, 1]."
by = ["test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_small_sample_interval_is_clipped_to_the_proportion_range"]

[[unit]]
text = "Clipping changes neither the stop decision nor coverage, because 0 and the true difference always lie inside [-1, 1]."
by = [
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_clip_is_one_sided_when_only_one_end_leaves_the_range",
    "test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_cs_matches_can_stop",
]

[[unit]]
text = "While an arm has no users, nothing bounds the effect: the interval is [-1, 1], the whole range of a difference in rates, and can_stop is false."
by = ["test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_no_finite_interval_without_data"]

[[unit]]
text = "An arm in which every user has the same outcome (nobody converts, or everybody does) still gets a finite interval: 0 of 500 against 0 of 500 gives about ±0.0093 around 0 and cannot stop, while 0 of 500 against 500 of 500 can."
by = ["test:backend/tests/unit/stats_validation/test_sequential_confidence_sequence.py::test_all_or_nothing_arms_get_a_finite_interval"]


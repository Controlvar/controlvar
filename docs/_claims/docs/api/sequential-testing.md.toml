by = ["exempt:baseline"]

[[unit]]
text = "Changing an experiment's sequential testing settings is a change to the experiment, decided by role and by the experiment's state, not by who created it."
by = ["exempt:baseline"]

[[unit]]
text = "ANALYST and VIEWER cannot change any experiment: the PUT above answers 403 with \"You don't have permission to update experiments\"."
by = ["test:backend/tests/integration/api/test_experiment_access_by_role.py"]

[[unit]]
text = "ADMIN and DEVELOPER may change experiments, but only a superuser may change one that is no longer a draft, and the demo experiment is running: for a DEVELOPER (or an ADMIN who is not a superuser) the PUT above answers 400 with \"Cannot update experiments in active status\"."
by = ["test:backend/tests/integration/api/test_experiment_access_by_role.py"]

[[unit]]
text = "The demo's admin@demo.com is a superuser, which is why it gets 200."

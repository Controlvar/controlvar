# `python scripts/doc_claims.py check`.
document = "docs/api/split-url.md"

[[unit]]
text = "Server-Side Split URL Testing API"
by = ["exempt:baseline"]

[[unit]]
text = "Part of the split_url module"
by = ["exempt:baseline"]

[[unit]]
text = "Split URL testing is one of the optional modules -- present in the full profile, absent from the core one."
by = [
    "test:backend/tests/unit/core/test_optional_modules.py::TestSplitUrlRefusedWithoutRouting::test_create_split_url_experiment_returns_501",
    "test:backend/tests/unit/core/test_optional_modules.py::TestCapabilityLookup::test_split_url_preview_handler_none_when_absent",
]

[[unit]]
text = "A core deployment does not serve these routes."
by = [
    "test:backend/tests/unit/core/test_optional_modules.py::TestSplitUrlRefusedWithoutRouting::test_create_split_url_experiment_returns_501",
    "test:backend/tests/unit/core/test_optional_modules.py::TestCapabilityLookup::test_split_url_preview_handler_none_when_absent",
]

[[unit]]
text = "See Modules and profiles for what each profile includes and how to run the full one."
by = ["exempt:baseline"]

[[unit]]
text = "The edge router does not split traffic in this release"
by = ["exempt:baseline"]

[[unit]]
text = "The Lambda@Edge router reads its configuration only from an X-Split-URL-Config request header, and nothing sets that header: no stack creates the CloudFront distribution or adds the header, and the platform does not send an experiment's split_url_config to the edge."
by = ["untested:T"]

[[unit]]
text = "Without it the router passes every request through unchanged, so deploying the construct does not split traffic."
by = ["test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerPassThrough::test_no_config_header_passes_through"]

[[unit]]
text = "What works today is storing a split URL experiment and its configuration, and the preview endpoint."
by = [
    "test:modules/backend/tests/integration/api/test_split_url_api.py::TestCreateSplitUrlExperiment",
    "test:modules/backend/tests/integration/api/test_split_url_api.py::TestGetSplitUrlExperiment",
    "test:modules/backend/tests/integration/api/test_split_url_api.py::TestSplitUrlPreview",
]

[[unit]]
text = "The preview does not predict the router either: it hashes the user_id you pass with the experiment's id, while the router hashes the viewer's IP address and User-Agent with the experiment_key in its configuration (#393)."
by = [
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_the_fingerprint_is_ip_and_user_agent_not_a_user_id",
    "test:modules/backend/tests/integration/api/test_split_url_api.py::TestSplitUrlPreview::test_preview_assignment_is_deterministic",
]

[[unit]]
text = "This document describes the server-side split URL testing feature."
by = ["exempt:baseline"]

[[unit]]
text = "Split URL experiments are meant to redirect different users to distinct URLs (e.g., /checkout vs /checkout-v2) at the CloudFront layer, with a Lambda@Edge router and a cookie that keeps each viewer on one variant."
by = ["exempt:baseline"]

[[unit]]
text = "Overview"
by = ["exempt:baseline"]

[[unit]]
text = "Split URL testing differs from classic A/B tests in that the entire page or URL path varies between variants rather than a component within a single page."
by = ["exempt:baseline"]

[[unit]]
text = "Given a configuration, the router (modules/lambda/split_url_router/handler.py):"
by = ["exempt:baseline"]

[[unit]]
text = "Reads the viewer's assignment cookie (split_url_{experiment_key} unless the configuration names another)."
by = [
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_set_cookie_contains_cookie_name",
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_custom_cookie_name_in_config",
]

[[unit]]
text = "If the cookie holds one of the variant URLs, passes the request through."
by = ["test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerExistingCookie::test_existing_valid_cookie_passes_through"]

[[unit]]
text = "Otherwise hashes the viewer's IP address and User-Agent to pick a variant."
by = [
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_the_fingerprint_is_ip_and_user_agent_not_a_user_id",
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_assignment_is_consistent_for_same_fingerprint",
]

[[unit]]
text = "Answers 302 to that variant's URL, with a cookie that lasts 30 days unless the configuration sets cookie_ttl_days."
by = [
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_returns_302_redirect",
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_cookie_ttl_defaults_to_30_days",
    "test:modules/backend/tests/unit/lambda/test_split_url_handler.py::TestHandlerNewAssignment::test_cookie_ttl_from_config",
]


document = "docs/api/data-export.md"

[[unit]]
text = "Data Export & Reporting API (EP-020)"
by = ["exempt:baseline"]

[[unit]]
text = "This document describes the data export and reporting endpoints available under /api/v1/export/."
by = ["test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot"]

[[unit]]
text = "Authentication"
by = ["exempt:baseline"]

[[unit]]
text = "Every export endpoint takes a user's access token, from POST /api/v1/auth/login, in the Authorization: Bearer header."
by = ["docex:docs/api/data-export.md#\"ADMIN\""]

[[unit]]
text = "Every role (ADMIN, DEVELOPER, ANALYST, VIEWER) may use them."
by = ["test:backend/tests/unit/services/test_export_columns_and_rules.py::test_every_role_may_use_the_exports"]

[[unit]]
text = "Without a token they answer 401 Unauthorized."
by = [
    "test:backend/tests/unit/api/test_export_endpoints.py::TestExportExperimentsEndpoint::test_export_requires_authentication",
    "test:backend/tests/unit/api/test_export_endpoints.py::TestPlatformOverviewEndpoint::test_overview_report_requires_authentication",
]

[[unit]]
text = "The result columns (each variant's assignments, conversions, rate, p-value and significance, and each experiment's winner and recommendation) are the numbers GET /api/v1/results/{experiment_id} reports for the experiment's primary metric with no options: the experiment's stored correction_method and confidence_level (Benjamini-Hochberg at 0.95 unless it was created with others; see How results are judged)."
by = [
    "test:backend/tests/unit/services/test_export_columns_and_rules.py::test_the_variant_columns_are_the_results_numbers_with_the_stored_settings",
    "test:backend/tests/integration/api/test_export_api.py::TestExportEqualsResults::test_variant_rows_equal_results",
    "test:backend/tests/integration/api/test_export_api.py::TestExportEqualsResults::test_experiment_row_winner_and_recommendation_equal_results",
]

[[unit]]
text = "The export takes no such parameters."
by = ["exempt:baseline"]

[[unit]]
text = "Asked with another correction_method or confidence_level, /results can report a different is_significant, winner and recommendation than the export; the counts, rates and unadjusted p-values are the same."
by = [
    "test:backend/tests/unit/services/test_export_columns_and_rules.py::test_p_value_is_unadjusted_and_significance_is_decided_on_the_corrected_one",
    "test:backend/tests/unit/services/test_export_columns_and_rules.py::test_the_variant_columns_are_the_results_numbers_with_the_stored_settings",
]

[[unit]]
text = "When the primary metric is a revenue metric, conversion_rate is empty: /results reports that metric's mean as a value per assigned user, not a rate."
by = [
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_the_export_leaves_the_rate_empty_for_a_revenue_primary",
    "test:backend/tests/integration/api/test_revenue_per_user_results.py::test_a_revenue_metric_is_analysed_per_assigned_user",
]

[[unit]]
text = "conversions is still the number of users who sent the metric's event, and p_value is the p-value of Welch's t-test that /results reports."
by = ["test:backend/tests/integration/api/test_revenue_per_user_results.py::test_the_export_leaves_the_rate_empty_for_a_revenue_primary"]

[[unit]]
text = "p_value is the unadjusted p-value, while is_significant is decided on the corrected one."
by = ["test:backend/tests/unit/services/test_export_columns_and_rules.py::test_p_value_is_unadjusted_and_significance_is_decided_on_the_corrected_one"]

[[unit]]
text = "With two or more treatments a row can therefore show p_value 0.035 and is_significant false: under Benjamini-Hochberg that treatment's adjusted p-value can be 0.071."
by = ["exempt:baseline"]

[[unit]]
text = "The export has no adjusted p-value column; /results reports it as adjusted_p_value."
by = ["exempt:baseline"]

[[unit]]
text = "Empty in this release: experiments_with_winners in the overview is 0 (#244)."
by = ["test:backend/tests/unit/services/test_export_columns_and_rules.py::test_the_overview_fields"]


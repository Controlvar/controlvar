[[unit]]
text = "Audit Logging & Bulk Toggle"
by = ["exempt:baseline"]

[[unit]]
text = "The audit log is a record of who changed what."
by = ["exempt:baseline"]

[[unit]]
text = "No API edits or deletes an entry."
by = ["test:backend/tests/smoke/test_audit_inventory.py::test_the_inventory_is_exact"]

[[unit]]
text = "It records the changes people make through the API: creating, changing and deleting feature flags and experiments, turning flags on and off, starting, pausing and completing experiments, rollout schedule changes, API keys, holdouts, mutual exclusion groups, segments, creating and deleting users, changes to a user's role, superuser flag or active status, signing in with a password or through Cognito (POST /auth/token; a sign-in through the Cognito Hosted UI does not pass through the API and is not recorded), and safety rollbacks."
by = [
    "test:backend/tests/integration/api/test_audit_route_events.py::test_flag_create",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_flag_update_records_only_what_changed",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_flag_delete",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_flag_status_verbs",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_experiment_create_update_delete",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_experiment_lifecycle",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_rollout_schedule_routes_record_on_the_flag",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_api_key_create_and_revoke_hold_no_part_of_the_key",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_holdout_create_update_and_activation",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_exclusion_group_routes",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_segment_create_update_archive",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_user_create",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_user_delete",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_patch_role_and_active",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_superuser_flag_through_put_is_recorded",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_local_sign_in",
    "test:backend/tests/integration/api/test_audit_route_events.py::test_cognito_sign_in_with_an_account_is_recorded",

]

[[unit]]
text = "In the full profile it also records custom roles assigned and revoked, a workspace member's role changes, and single sign-on (SSO) sign-ins."
by = ["test:modules/backend/tests/integration/api/test_audit_module_events.py"]

[[unit]]
text = "Action Types lists every action and when it is written."
by = ["exempt:baseline"]

[[unit]]
text = "It also records the changes the platform makes on its own: scheduled experiment starts and ends, rollout stages the rollout scheduler starts, rollbacks the safety monitor makes, a user's first Cognito or SSO sign-in, and role changes Cognito group sync and SSO sign-in make."
by = [
    "test:backend/tests/integration/services/test_audit_service_sites.py",
    "test:backend/tests/smoke/test_audit_non_route_inventory.py::test_the_sites_are_exact",
]

[[unit]]
text = "Those role changes are written by a system actor."
by = ["exempt:baseline"]

[[unit]]
text = "The Quick Start's demo data includes a history written by the seed script, in the form the platform writes it."
by = ["test:backend/tests/integration/services/test_seed_audit_entries.py"]


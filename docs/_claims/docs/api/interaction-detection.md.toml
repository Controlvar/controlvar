[[unit]]
text = "When an interaction is found"
by = ["exempt:baseline"]

[[unit]]
text = "Read the lift in each of B's variants in arms, and consider deciding B first: A's result is still a valid average over B's current split, but it may change once B ships one variant."
by = ["exempt:baseline"]

[[unit]]
text = "The test can also flag an interaction that is not there when one experiment changes who enters the other, for example when B's treatment sends more visitors to A's page."
by = ["test:backend/tests/unit/services/test_interaction_page_claims.py::test_a_change_in_who_enters_a_can_read_as_an_interaction"]

[[unit]]
text = "Check it by comparing, for each of B's variants, the share of its users who are also in A."
by = ["exempt:baseline"]

[[unit]]
text = "In A's row, add n_control and n_treatment of that variant's entry in arms (for an A with more than one treatment, add each row's n_treatment and the control once), and divide by that variant's sample_size in GET /api/v1/results/{exp_b_id}: the primary metric's entry in metrics, under variants."
by = ["docex:docs/api/interaction-detection.md#{\"control\":1,\"checklist\":1}"]

[[unit]]
text = "Shares that differ between B's variants mean B changed who entered A."
by = ["exempt:baseline"]

[[unit]]
text = "A ramp-up or a bandit changes those shares by design."
by = ["exempt:baseline"]


# What verifies each unit of docs/api/interaction-detection.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "docs/api/interaction-detection.md"

[[unit]]
text = "Experiment Interaction Detection"
by = ["exempt:baseline"]

[[unit]]
text = "Two experiments that run at the same time usually share users."
by = ["exempt:baseline"]

[[unit]]
text = "That is normal and harmless unless they interact: one experiment's effect is different depending on which variant of the other a user sees."
by = ["exempt:baseline"]

[[unit]]
text = "This page shows how to measure the overlap and how to test for an interaction."
by = ["exempt:baseline"]

[[unit]]
text = "GET /api/v1/interactions/scan (stable) lists the pairs of active experiments that share many users."
by = ["docex:docs/api/interaction-detection.md#\"total_active_experiments\": 4"]

[[unit]]
text = "GET /api/v1/interactions/{exp_a_id}/{exp_b_id} (beta) reports the overlap of any two experiments and, for each treatment of each one, tests whether its lift on the experiment's primary conversion metric differs across the other experiment's variants, among the users in both."
by = [
    "docex:docs/api/interaction-detection.md#\"shared_users\":40",
    "docex:docs/api/interaction-detection.md#[\"pricing-page\",\"annual_first\",true]",
]

[[unit]]
text = "The pair route is beta (#219): its responses carry \"analysis_status\": \"beta\" and an analysis_notice, and the route is marked x-stability: beta in the OpenAPI document."
by = [
    "test:backend/tests/integration/api/test_analysis_beta_labels.py",
    "test:backend/tests/smoke/test_openapi_snapshot.py::test_full_api_matches_full_snapshot",
]

[[unit]]
text = "Only each experiment's primary metric is tested, and only a conversion metric; pairs are tested one at a time, with no correction across pairs."
by = [
    "test:backend/tests/unit/services/test_interaction_page_claims.py::test_only_the_primary_metric_is_tested",
    "test:backend/tests/unit/services/test_interaction_page_claims.py::test_a_pair_is_corrected_only_across_the_experiments_own_treatments",
    "test:backend/tests/unit/services/test_interaction_pair_analysis.py::test_experiment_level_reasons_give_one_row_and_spare_the_other",
]


[[unit]]
text = "What the test measures"
by = ["exempt:baseline"]

[[unit]]
text = "For one treatment of experiment A, take the users who are in both experiments, and split them by A's control or treatment and by B's variant."
by = ["exempt:baseline"]

[[unit]]
text = "In each of B's variants the treatment's lift is its conversion rate minus the control's, in percentage points (effect in each entry of arms; 0.05 is 5 percentage points)."
by = ["test:backend/tests/unit/services/test_interaction_golden.py::test_the_constant_relative_lift_table_is_frozen"]

[[unit]]
text = "The test asks whether that lift is the same in every variant of B."
by = ["exempt:baseline"]

[[unit]]
text = "It fits the model in which it is (one baseline rate per variant of B plus one common lift) by maximum likelihood, and compares the counts with that model: statistic is Pearson's X² and degrees_of_freedom is the number of B's variants minus one."
by = ["exempt:baseline"]

[[unit]]
text = "Because the lift is measured in percentage points, a constant relative lift is an interaction."
by = [
    "test:backend/tests/unit/services/test_interaction_golden.py::test_the_constant_relative_lift_table_is_frozen",
    "test:backend/tests/unit/services/test_interaction_golden.py::test_s7_a_constant_relative_lift_is_an_interaction",
]

[[unit]]
text = "A treatment that lifts conversion by 50% everywhere, 10% → 15% in one variant of B and 20% → 30% in the other, is +5 points in one and +10 in the other."
by = [
    "test:backend/tests/unit/services/test_interaction_golden.py::test_s7_a_constant_relative_lift_is_an_interaction",
    "test:backend/tests/unit/services/test_interaction_golden.py::test_the_constant_relative_lift_table_is_frozen",
]

[[unit]]
text = "With 2,000 users in each of the four groups that gives X² = 8.46 and p = 0.0036: an interaction."
by = ["test:backend/tests/unit/services/test_interaction_golden.py::test_the_constant_relative_lift_table_is_frozen"]


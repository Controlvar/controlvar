document = "docs/api/multi-armed-bandit.md"

[[unit]]
text = "Multi-Armed Bandit"
by = ["exempt:baseline"]

[[unit]]
text = "Multi-armed bandit (MAB) experiments dynamically reallocate traffic toward better-performing variants as data accumulates, rather than maintaining fixed allocations throughout the experiment."
by = [
    "test:backend/tests/unit/services/test_bandit_scheduler.py::TestBanditSchedulerIntegration::test_thompson_weights_shift_toward_better_variant",
    "test:backend/tests/integration/api/test_tracking_api.py::TestBanditAssignment::test_new_users_follow_bandit_weights",
]

[[unit]]
text = "Algorithms"
by = ["exempt:baseline"]

[[unit]]
text = "Each algorithm turns every variant's pulls and successes into a weight; the weights add up to 1 and decide where new users go (see How the weights affect traffic)."
by = [
    "test:backend/tests/unit/services/test_bandit_service.py::TestBanditService::test_weights_sum_to_approximately_one",
    "test:backend/tests/unit/services/test_bandit_routing.py::TestSelectBanditVariant::test_distribution_roughly_matches_weights",
]

[[unit]]
text = "An experiment is a bandit only when it names one of the three; optimization_type defaults to fixed."
by = [
    "test:backend/tests/unit/services/test_experiment_response_dict.py::test_an_unset_type_reads_as_fixed",
    "test:backend/tests/unit/services/test_bandit_routing.py::TestSelectBanditVariant::test_fixed_experiment_returns_none",
]

[[unit]]
text = "Thompson Sampling"
by = ["exempt:label"]

[[unit]]
text = "Each variant has a Beta posterior, Beta(1 + successes, 1 + failures)."
by = ["test:backend/tests/integration/api/test_bandit_weights_routes.py::test_thompson_weights_are_the_beta_1_plus_successes_posteriors"]

[[unit]]
text = "A weight update draws 10,000 samples from every posterior, and each variant's weight is the share of draws in which it is highest."
by = [
    "docex:docs/api/multi-armed-bandit.md#\"n_samples\": 10000",
    "test:backend/tests/unit/services/test_bandit_service.py::TestThompsonSampling::test_dominant_arm_wins_nearly_always",
]

[[unit]]
text = "UCB1 (Upper Confidence Bound)"
by = ["exempt:baseline"]

[[unit]]
text = "Each variant's score is mean + sqrt(2 ln(total_pulls) / variant_pulls), and its weight is its score divided by the sum of the scores, so every variant keeps some traffic."
by = ["test:backend/tests/integration/api/test_bandit_weights_routes.py::test_ucb1_weights_are_the_normalised_scores"]

[[unit]]
text = "While any variant has no pulls, the variants with none share all the weight equally."
by = ["test:backend/tests/integration/api/test_bandit_weights_routes.py::test_ucb1_variants_with_no_pulls_share_all_the_weight"]

[[unit]]
text = "Epsilon-Greedy"
by = ["exempt:baseline"]

[[unit]]
text = "The variant with the highest conversion rate gets the weight 0.9 + 0.1 / n, and each of the other variants 0.1 / n, for n variants: epsilon is 0.1, and it is not a setting."
by = [
    "test:backend/tests/unit/services/test_bandit_service.py::TestEpsilonGreedy::test_best_variant_gets_largest_weight",
    "test:backend/tests/unit/services/test_bandit_service.py::TestEpsilonGreedy::test_non_best_variants_get_epsilon_over_n",
    "test:backend/tests/integration/api/test_bandit_weights_routes.py::test_epsilon_is_point_one_and_not_a_setting",
]


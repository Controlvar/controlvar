[[unit]]
text = "Local evaluation (server-side SDKs, beta)"
by = ["exempt:label"]

[[unit]]
text = "By default every flag evaluation is a request to the API."
by = [
    "test:sdk/js/__tests__/local.test.ts::server mode is unchanged: no ruleset request, no source field",
    "test:sdk/python/tests/test_local.py::test_server_mode_is_unchanged",
]

[[unit]]
text = "Local evaluation lets a server-side process download the flag ruleset once, refresh it in the background, and answer flags in-process with no request per evaluation."
by = [
    "test:sdk/js/__tests__/local.test.ts::after ready, evaluations make no request and follow the attributes passed",

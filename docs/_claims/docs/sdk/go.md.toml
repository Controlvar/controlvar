document = "docs/sdk/go.md"

[[unit]]
text = "Go SDK"
by = ["exempt:label"]

[[unit]]
text = "github.com/controlvar/controlvar/sdk/go (package experimentation) provides feature flag evaluation, experiment assignment and event tracking for Go services."
by = [
    "test:sdk/go/module_test.go::TestModule_StandardLibraryOnly",
    "journey:sdk-go#quick-start-user-on",
    "journey:sdk-go#quick-start-user-off",
]

[[unit]]
text = "Standard library only, goroutine-safe, context-aware."
by = [
    "test:sdk/go/module_test.go::TestModule_StandardLibraryOnly",
    "test:sdk/go/client_test.go::TestClient_Concurrent",
    "test:sdk/go/client_test.go::TestCache_Concurrent",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_ContextCancelled",
    "test:sdk/go/client_test.go::TestHTTPClient_ContextCancellation",
]

[[unit]]
text = "Flag evaluation and experiment assignment are decided by the server: every call goes to the public API with your X-API-Key, the server buckets the user (sticky per user + experiment), and the SDK caches the answer per user + key for a TTL."
by = [
    "test:sdk/go/client_test.go::TestClient_GetAssignment_Sticky_CacheHit",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_CacheHit",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssign::test_assigns_user_to_a_variant_and_is_sticky",
]

[[unit]]
text = "Nothing is bucketed locally."
by = [
    "test:sdk/go/module_test.go::TestConsistentHash_NotCalledByTheClient",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_RequestAndMapping",
    "test:sdk/go/client_test.go::TestClient_GetAssignment_RequestAndMapping",
]

[[unit]]
text = "Source: sdk/go."
by = ["test:sdk/go/module_test.go::TestModule_StandardLibraryOnly"]

[[unit]]
text = "Requires Go 1.21+."
by = [
    "test:sdk/go/module_test.go::TestModule_RequiresGo121",
    "journey:sdk-go#quick-start-user-on",
]

[[unit]]
text = "On macOS, use Go 1.23 or later: a program built with Go 1.21 or 1.22 may not start there (dyld: missing LC_UUID load command)."
by = ["exempt:third-party"]

[[unit]]
text = "On Linux, Go 1.21 works: every night CI runs this page's Installation and Quick Start with go1.21 against a running stack."
by = [
    "journey:sdk-go#quick-start-user-on",
    "journey:sdk-go#quick-start-user-off",
]

[[unit]]
text = "Only the Quick Start's quoted address and keys change: the stack's API address, the keys of an experiment and a flag the run creates, and a user ID of its own take their place, and CONTROLVAR_API_KEY holds a key the run creates."
by = [
    "journey:sdk-go#quick-start-user-on",
    "journey:sdk-go#quick-start-user-off",
]

[[unit]]
text = "Installation"
by = ["exempt:label"]

[[unit]]
text = "In a new directory, make a module for your program and add the SDK to it:"
by = ["exempt:instruction"]

[[unit]]
text = "Adding the SDK to a program that already has a go.mod?"
by = ["exempt:instruction"]

[[unit]]
text = "Run only the go get."
by = ["exempt:instruction"]

[[unit]]
text = "The module has no tagged release yet, so go get resolves the head of the main branch and records it in your go.mod as a pseudo-version (v0.0.0-<date>-<commit>)."
by = [
    "journey:sdk-go#quick-start-user-on",
    "journey:sdk-go#quick-start-user-off",
]

[[unit]]
text = "Your builds stay on that version until you run go get again."
by = ["exempt:third-party"]

[[unit]]
text = "To pin a particular commit, name it: go get github.com/controlvar/controlvar/sdk/go@<commit>, where <commit> is a commit hash from this repository."
by = ["exempt:third-party"]

[[unit]]
text = "Quick Start"
by = ["exempt:label"]

[[unit]]
text = "Save this as main.go next to the go.mod, set CONTROLVAR_API_KEY to an API key, and run it with go run .."

[[unit]]
text = "Caching and failure behaviour"
by = ["exempt:label"]

[[unit]]
text = "Successful results are cached per user + key (namespaced by kind, so a flag and an experiment with the same key never collide) for CacheTTL."
by = [
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_CacheHit",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_CacheIsPerUserAndKey",
]

[[unit]]
text = "A cache hit makes no request."
by = [
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_CacheHit",
    "test:sdk/go/client_test.go::TestClient_GetAssignment_Sticky_CacheHit",
]

[[unit]]
text = "Failures are never cached — the next call retries."
by = ["test:sdk/go/client_test.go::TestClient_EvaluateFlag_FailureNotCached"]

[[unit]]
text = "Network/timeout, 401, 404, 422, 429, 5xx: EvaluateFlag degrades to a disabled result with the error attached; GetAssignment returns nil and the error."
by = [
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_NotFound",
    "test:sdk/go/client_test.go::TestWithTimeout",
    "test:sdk/go/client_test.go::TestHTTPClient_Get_ServerError",
]

[[unit]]
text = "Non-2xx responses are APIError (RetryAfter set on 429); transport errors wrap the net/http error."
by = [
    "test:sdk/go/client_test.go::TestHTTPClient_Get_ServerError",
    "test:sdk/go/client_test.go::TestClient_EvaluateFlag_NotFound",
    "test:sdk/go/client_test.go::TestHTTPClient_ContextCancellation",
]


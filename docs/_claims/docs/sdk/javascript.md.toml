[[unit]]
text = "JavaScript SDK"
by = ["exempt:label"]

[[unit]]
text = "@controlvar/js-sdk (v0.3.0) is the JavaScript/TypeScript client for the Controlvar public API: experiment assignment, feature flag evaluation and event tracking for Node >= 18 and browsers."
by = [
    "mechanism:sdk-doc-versions",
    "test:sdk/js/__tests__/package.test.ts::runs on Node 18 or later and in browsers: no source imports a module",
    "test:sdk/js/__tests__/client.test.ts::POSTs /api/v1/tracking/assign with the contract headers",
    "test:sdk/js/__tests__/client.test.ts::GETs /api/v1/feature-flags/evaluate/{key}?user_id=… with the contract headers and no body",
    "test:sdk/js/__tests__/client.test.ts::POSTs one event to /api/v1/tracking/track with the exact body",
]

[[unit]]
text = "Zero runtime dependencies — it uses the global fetch."
by = [
    "test:sdk/js/__tests__/package.test.ts::has no runtime dependencies",
    "test:sdk/js/__tests__/client.test.ts::uses the global fetch when config.fetch is not given",
]

[[unit]]
text = "By default, flag evaluation and experiment assignment are decided by the server: every call goes to the public API with your X-API-Key, the server buckets the user (sticky per user + experiment), and the SDK caches the answer per user + key."
by = [
    "test:sdk/js/__tests__/client.test.ts::is sticky: the second call is served from the cache without a request",
    "test:sdk/js/__tests__/client.test.ts::GETs /api/v1/feature-flags/evaluate/{key}?user_id=… with the contract headers and no body",
    "test:backend/tests/integration/api/test_tracking_api.py::TestAssign::test_assigns_user_to_a_variant_and_is_sticky",
]

[[unit]]
text = "In server-side code you can opt in to local evaluation (evaluation: 'local'): flags are then answered in-process from the server's ruleset, with the server's answers, and experiments stay on the server."
by = [
    "test:sdk/js/__tests__/evaluator.test.ts::no local answer differs from the server",
    "test:sdk/js/__tests__/local.test.ts::local answers equal the server, and only non-must_local cases reach it",
    "test:sdk/js/__tests__/local.test.ts::experiments are assigned by the server in local mode",
]


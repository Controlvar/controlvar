document = "docs/sdk/visual.md"

[[unit]]
text = "Visual experiments: the browser script"
by = ["exempt:label"]

[[unit]]
text = "Not yet available"
by = ["mechanism:visual-not-yet-available"]

[[unit]]
text = "The visual editor is not yet available in Controlvar, and nothing in Controlvar offers this script yet."
by = ["mechanism:visual-not-yet-available"]

[[unit]]
text = "This page describes what the script does on your pages, so that it can be reviewed before it is offered."
by = ["exempt:navigation"]

[[unit]]
text = "The tag"
by = ["exempt:label"]

[[unit]]
text = "Put the tag first in the <head> of each page an experiment may change:"
by = ["exempt:instruction"]

[[unit]]
text = "Placed anywhere else (in <body>, with defer or async, or added by a tag manager), the script may not hide the page, so visitors can see the original page before its changes."
by = ["test:sdk/visual/__tests__/runtime.test.ts::a script that starts once the page has a <body> never hides it, and still applies the changes"]

[[unit]]
text = "Attribute | What it does"
by = ["exempt:label"]

[[unit]]
text = "data-api-url | Your Controlvar API's address. Without it, or without the key, the script logs one error and does nothing."
by = [
    "test:sdk/visual/__tests__/package.test.ts::a tag without data-api-url or data-api-key gets one console error and sends nothing",
    "test:sdk/visual/__tests__/requests.test.ts::sends nothing at all without the API URL or key, the editor link included",
]

[[unit]]
text = "data-api-key | An API key with no scopes, made for your website. A key with any scope is refused, because anyone who opens the page can read it, and so is a staging or development key, because experiments run in production only."
by = [
    "test:backend/tests/integration/api/test_key_environment_routes.py::test_a_production_only_route_refuses_another_key_and_writes_nothing",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_a_key_with_any_scope_is_refused",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_a_key_with_no_scopes_is_served",
]

[[unit]]
text = "data-require-consent | The script waits for controlvar.visual.consent() before it reads, stores or sends anything about the visitor."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::before it, nothing is read, stored or sent; after it, the keys are exactly the ones the script writes",
    "test:sdk/visual/__tests__/consent.test.ts::before it, a tag that waits reads, stores and sends nothing; after it, the page is asked for",
]

[[unit]]
text = "data-timeout-ms | How long the page may stay hidden while its changes are applied: 0 to 4000 milliseconds, 1000 by default; 0 never hides it."
by = [
    "test:frontend/tests/e2e/runtime/hide.runtime.spec.ts::shows the page at ${timeout} ms when the API never answers (data-timeout-ms ${attribute ?? \"absent\"})",
    "test:sdk/visual/__tests__/runtime.test.ts::holds <html> hidden while the answer is awaited, and data-timeout-ms=0 never hides",
]

[[unit]]
text = "data-user-id | Your own id for the visitor, at most 255 characters. Use an id that does not identify a person, such as an account number, not an email address: anyone with your page's key can ask what that id is assigned to."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::is data-user-id when set, with no cookie, and one warning when it holds an @",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_an_assigned_visitor_gets_the_changes_the_goals_and_one_exposure_per_view",
]

[[unit]]
text = "data-cookie-name | Without data-user-id, the script keeps a random id in a cookie of this name, controlvar_uid by default."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::is a new random id in the cookie, for 30 days",
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::revokeConsent() on a tag that ${mode}: the cookie and every key go, nothing more is sent, and the next page follows the tag",
]

[[unit]]
text = "data-attributes | A JSON object of at most 4 KB about the visitor (4096 bytes, as written and as sent), sent with each call for the experiments' audiences. Its keys that start with web_ are ignored, with one console warning: the script sets those itself."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::sends the visitor, the host and the path, never the query, with the key and no cookies",
    "test:sdk/visual/__tests__/details.test.ts::is limited to 4096 UTF-8 bytes, so text in another script counts every byte",
    "test:sdk/visual/__tests__/details.test.ts::is also limited as sent: a short text that is larger as JSON is refused",
    "test:sdk/visual/__tests__/details.test.ts::cannot set a web_ key: those are dropped, with one warning for the tag",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_a_context_over_the_limits_is_refused",
]

[[unit]]
text = "data-collect | The website details the script sends, separated by commas: device, browser, language, visitor, referrer, utm, landing, or none. Without it the script sends all of them but landing. See What the script reads about visitors."
by = [
    "test:sdk/visual/__tests__/contexts.test.ts::every vector: the script sends exactly its details, and no other context",
    "test:frontend/tests/e2e/runtime/details.runtime.spec.ts::none sends no website detail and stores no visit",
    "test:sdk/visual/__tests__/details.test.ts::names every key the script sends, in the order it sends them, and the data-collect values",
]
[[unit]]
text = "If your site sends a Content-Security-Policy, allow the script's address in script-src and your Controlvar API in connect-src."
by = ["test:frontend/tests/e2e/runtime/csp.runtime.spec.ts::the documented snippet loads under a strict policy and, waiting for consent, sends nothing"]

[[unit]]
text = "The script needs no 'unsafe-inline' and no 'unsafe-eval', and it writes styles through the CSSOM, which style-src does not restrict:"
by = ["test:frontend/tests/e2e/runtime/csp.runtime.spec.ts::every change and the hide apply under ${name}, with no violation"]

[[unit]]
text = "What the script sends"
by = ["exempt:label"]

[[unit]]
text = "On each page an experiment covers, the script makes one call to your Controlvar API with the visitor's id, the page's host and path, the website details described in What the script reads about visitors (as data-collect sets them), and data-attributes if the tag has it."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::sends the visitor, the host and the path, never the query, with the key and no cookies",
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::every operation applies, with the key and nothing about the page but its host and path",
    "test:sdk/visual/__tests__/details.test.ts::only in the call for the page's changes, after data-attributes; never in track()'s events or a report",
]
[[unit]]
text = "It never sends the query string, except three campaign (utm_) values, or the part of the address after #."
by = [
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::every operation applies, with the key and nothing about the page but its host and path",
    "test:frontend/tests/e2e/runtime/spa.runtime.spec.ts::each kind of change after # re-evaluates exactly once, with no call and no page view",
    "test:frontend/tests/e2e/runtime/details.runtime.spec.ts::the referring site's host, the landing path and the campaign; never the referrer's query, gclid or email",
]
[[unit]]
text = "It keeps the page rules of the running experiments for 60 seconds, and a page none of them covers makes no call and is never hidden."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::are kept for at most 60 seconds from the answer",
    "test:sdk/visual/__tests__/runtime.test.ts::when fresh and none covers the page: no call, no cookie, no hide",
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::fresh page rules that cover nothing: the next page makes no call",
]

[[unit]]
text = "The answer also names the goals of each experiment the visitor is assigned to, the control's visitors included, and the script records them on any page of your site for 30 days after the answer that named them."
by = [
    "test:frontend/tests/e2e/runtime/real-api-goals.runtime.spec.ts::a control visitor and a B visitor each click once, and each arm counts one conversion",
    "test:sdk/visual/__tests__/goals.test.ts::a goal on a page no experiment covers counts there, from the goals kept on an earlier page",
    "test:sdk/visual/__tests__/goals.test.ts::uses only what it can check: an experiment older than 30 days, or with one goal out of its form, counts nothing",
    "test:backend/tests/integration/api/test_visual_goal_events.py::test_each_goal_counts_only_for_its_own_metric_in_the_visitors_own_arm",
]

[[unit]]
text = "A page-view goal records one event for each page view of the goal's page: each page load, and each path change the script follows; a change of only the query, or only the part after #, is not a page view."
by = [
    "test:frontend/tests/e2e/runtime/goals.runtime.spec.ts::one per page load and per path change: a hash, a query and Next's pushState then replaceState add none",
    "test:sdk/visual/__tests__/goals.test.ts::a page_view goal counts once per page load and per path change; never for a hash, a query or a replaceState of the same path",
]

[[unit]]
text = "A click goal records one event per page view when a click a person makes, or Enter or Space on the element, lands on the one element its selector matches, or inside it; a click made by a script counts nothing, and so does a click anywhere else."
by = [
    "test:frontend/tests/e2e/runtime/goals.runtime.spec.ts::a click a person makes on the element or inside it counts, and Enter and Space on it; a click from a script does not",
    "test:sdk/visual/__tests__/goals.test.ts::a click a person makes on the element or inside it counts, once per page view; a click elsewhere or one a script makes does not",
]

[[unit]]
text = "A goal counts at most once per page view, and one click counts once for each experiment whose goal it is."
by = [
    "test:frontend/tests/e2e/runtime/goals.runtime.spec.ts::is added once: three path changes, a popstate and consent() add none, and one click counts once for each assigned experiment",
    "test:sdk/visual/__tests__/goals.test.ts::a click a person makes on the element or inside it counts, once per page view; a click elsewhere or one a script makes does not",
]

[[unit]]
text = "Each event carries the goal's event name, the visitor's id, the experiment's key, an event_id made of the page view's random id and the event name, and the page view's website details (as data-collect sets them), and nothing else: never the page's address, its text or data-attributes."
by = [
    "test:sdk/visual/__tests__/goals.test.ts::an event carries the goal's name, the visitor, the experiment, the page view's id and its website details, and nothing else",
    "test:sdk/visual/__tests__/goals.test.ts::with data-collect none an event carries no details",
    "test:backend/tests/integration/api/test_visual_goal_events.py::test_each_goal_counts_only_for_its_own_metric_in_the_visitors_own_arm",
]

[[unit]]
text = "The script keeps each event in localStorage until your Controlvar API accepts it: at most 50 events, the oldest dropped first, each for at most 24 hours."
by = [
    "test:sdk/visual/__tests__/outbox.test.ts::keeps at most 50 events, the newest, when nothing gets through",
    "test:sdk/visual/__tests__/outbox.test.ts::drops an event 24 hours after it was made",
    "test:sdk/visual/__tests__/outbox.test.ts::a 2xx removes the call's events",
]

[[unit]]
text = "An event is dropped if the server refuses it (any 4xx answer but 429); after a 429, a 5xx or a failed call it is sent again with the next goal event or from the next page, with the same event_id, and the API stores it once."
by = [
    "test:sdk/visual/__tests__/outbox.test.ts::a %i drops the call's events, and they are never sent again",
    "test:sdk/visual/__tests__/outbox.test.ts::%s keeps the call's events, and the next flush sends them again exactly once",
    "test:frontend/tests/e2e/runtime/real-api-goals.runtime.spec.ts::an event whose answer was lost is sent again from the next page, and stored once",
    "test:sdk/visual/__tests__/goals.test.ts::an event the API did not accept is sent again, with the same event_id, by the next page",
]

[[unit]]
text = "Events are sent with keepalive, so a click that takes the visitor to another page is still sent as the page goes away."
by = [
    "test:frontend/tests/e2e/runtime/real-api-goals.runtime.spec.ts::a click on a link to another site is recorded as the page goes away",
    "test:sdk/visual/__tests__/outbox.test.ts::sends each new event at once through the one send function, with the key and keepalive",
]

[[unit]]
text = "When a change cannot be applied, the script sends an error report with the experiment's key, a fixed message, the change's position and the reason."
by = [
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::a selector that matches nothing changes nothing, shows the page and is reported",
    "test:sdk/visual/__tests__/runtime.test.ts::carry exactly the four keys, never a feature flag key, and stop at five per page view",
]

[[unit]]
text = "When a click goal's selector matches no element, or more than one, on a click on its page, the script sends one report for that goal per page view, with the goal's position."
by = [
    "test:sdk/visual/__tests__/goals.test.ts::a selector that matches no element or several counts nothing and is reported once per page view, with the goal's position",
    "test:frontend/tests/e2e/runtime/goals.runtime.spec.ts::a selector that matches no element or two counts nothing, and is reported once each",
    "test:backend/tests/integration/api/test_visual_error_reports.py::test_reports_sent_with_a_website_key_never_count_toward_a_flag_keyed_like_the_experiment",
]

[[unit]]

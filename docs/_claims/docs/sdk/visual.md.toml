    "test:frontend/tests/e2e/runtime/preview.runtime.spec.ts::shows its variant with the banner, other experiments off, the address clean and nothing recorded",
    "test:sdk/visual/__tests__/consent.test.ts::a change on <html> or on the banner is never applied, and is reported as own_ui",

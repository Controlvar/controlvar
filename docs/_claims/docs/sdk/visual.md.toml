document = "docs/sdk/visual.md"

[[unit]]
text = "Visual experiments: the browser script"
by = ["exempt:label"]

[[unit]]
text = "Not yet available"
by = ["mechanism:visual-not-yet-available"]

[[unit]]
text = "The visual editor is not yet available in Controlvar, and nothing in Controlvar offers this script yet."
by = ["mechanism:visual-not-yet-available"]

[[unit]]
text = "This page describes what the script does on your pages, so that it can be reviewed before it is offered."
by = ["exempt:navigation"]

[[unit]]
text = "The tag"
by = ["exempt:label"]

[[unit]]
text = "Put the tag first in the <head> of each page an experiment may change:"
by = ["exempt:instruction"]

[[unit]]
text = "Placed anywhere else (in <body>, with defer or async, or added by a tag manager), the script may not hide the page, so visitors can see the original page before its changes."
by = ["test:sdk/visual/__tests__/runtime.test.ts::a script that starts once the page has a <body> never hides it, and still applies the changes"]

[[unit]]
text = "Attribute | What it does"
by = ["exempt:label"]

[[unit]]
text = "data-api-url | Your Controlvar API's address. Without it, or without the key, the script logs one error and does nothing."
by = [
    "test:sdk/visual/__tests__/package.test.ts::a tag without data-api-url or data-api-key gets one console error and sends nothing",
    "test:sdk/visual/__tests__/requests.test.ts::sends nothing at all without the API URL or key, the editor link included",
]

[[unit]]
text = "data-api-key | An API key with no scopes, made for your website. A key with any scope is refused, because anyone who opens the page can read it, and so is a staging or development key, because experiments run in production only."
by = [
    "test:backend/tests/integration/api/test_key_environment_routes.py::test_a_production_only_route_refuses_another_key_and_writes_nothing",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_a_key_with_any_scope_is_refused",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_a_key_with_no_scopes_is_served",
]

[[unit]]
text = "data-require-consent | The script waits for controlvar.visual.consent() before it reads, stores or sends anything about the visitor."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::before it, nothing is read, stored or sent; after it, the keys are exactly the ones the script writes",
    "test:sdk/visual/__tests__/consent.test.ts::before it, a tag that waits reads, stores and sends nothing; after it, the page is asked for",
]

[[unit]]
text = "data-timeout-ms | How long the page may stay hidden while its changes are applied: 0 to 4000 milliseconds, 1000 by default; 0 never hides it."
by = [
    "test:frontend/tests/e2e/runtime/hide.runtime.spec.ts::shows the page at ${timeout} ms when the API never answers (data-timeout-ms ${attribute ?? \"absent\"})",
    "test:sdk/visual/__tests__/runtime.test.ts::holds <html> hidden while the answer is awaited, and data-timeout-ms=0 never hides",
]

[[unit]]
text = "data-user-id | Your own id for the visitor, at most 255 characters. Use an id that does not identify a person, such as an account number, not an email address: anyone with your page's key can ask what that id is assigned to."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::is data-user-id when set, with no cookie, and one warning when it holds an @",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_an_assigned_visitor_gets_the_changes_the_goals_and_one_exposure_per_view",
]

[[unit]]
text = "data-cookie-name | Without data-user-id, the script keeps a random id in a cookie of this name, controlvar_uid by default."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::is a new random id in the cookie, for 30 days",
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::revokeConsent() on a tag that ${mode}: the cookie and every key go, nothing more is sent, and the next page follows the tag",
]

[[unit]]
text = "data-attributes | A JSON object of at most 4 KB about the visitor, sent with each call for the experiments' audiences."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::sends the visitor, the host and the path, never the query, with the key and no cookies",
    "test:backend/tests/integration/api/test_visual_tracking_api.py::test_a_context_over_the_limits_is_refused",
]

[[unit]]
text = "If your site sends a Content-Security-Policy, allow the script's address in script-src and your Controlvar API in connect-src."
by = ["test:frontend/tests/e2e/runtime/csp.runtime.spec.ts::the documented snippet loads under a strict policy and, waiting for consent, sends nothing"]

[[unit]]
text = "The script needs no 'unsafe-inline' and no 'unsafe-eval', and it writes styles through the CSSOM, which style-src does not restrict:"
by = ["test:frontend/tests/e2e/runtime/csp.runtime.spec.ts::every change and the hide apply under ${name}, with no violation"]

[[unit]]
text = "What the script sends"
by = ["exempt:label"]

[[unit]]
text = "On each page an experiment covers, the script makes one call to your Controlvar API with the visitor's id, the page's host and path, and data-attributes if the tag has it."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::sends the visitor, the host and the path, never the query, with the key and no cookies",
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::every operation applies, with the key and nothing about the page but its host and path",
]

[[unit]]
text = "It never sends the query string or the part of the address after #."
by = [
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::every operation applies, with the key and nothing about the page but its host and path",
    "test:frontend/tests/e2e/runtime/spa.runtime.spec.ts::each kind of change after # re-evaluates exactly once, with no call and no page view",
]

[[unit]]
text = "It keeps the page rules of the running experiments for 60 seconds, and a page none of them covers makes no call and is never hidden."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::are kept for at most 60 seconds from the answer",
    "test:sdk/visual/__tests__/runtime.test.ts::when fresh and none covers the page: no call, no cookie, no hide",
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::fresh page rules that cover nothing: the next page makes no call",
]

[[unit]]
text = "When a change cannot be applied, the script sends an error report with the experiment's key, a fixed message, the change's position and the reason."
by = [
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::a selector that matches nothing changes nothing, shows the page and is reported",
    "test:sdk/visual/__tests__/runtime.test.ts::carry exactly the four keys, never a feature flag key, and stop at five per page view",
]

[[unit]]
text = "A report never holds a feature flag key, the visitor's id, the page's address or anything from the page, so it never counts toward a flag's safety rollback."
by = [
    "test:backend/tests/integration/api/test_visual_error_reports.py::test_reports_sent_with_a_website_key_never_count_toward_a_flag_keyed_like_the_experiment",
    "test:backend/tests/integration/api/test_visual_error_reports.py::test_the_report_keys_are_the_documented_four_and_no_flag_key",
    "test:backend/tests/unit/sdk/test_sdk_error_reports_and_retries.py::test_the_visual_scripts_reports_never_carry_a_feature_flag_key",
]

[[unit]]
text = "At most 5 reports are sent per page load."
by = [
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::at most five reports per page view",
    "test:sdk/visual/__tests__/runtime.test.ts::carry exactly the four keys, never a feature flag key, and stop at five per page view",
]

[[unit]]
text = "controlvar.visual.track(event, { value }) sends one event for each experiment the visitor was assigned to in the last 30 days, so a purchase on another page counts for the experiment the visitor saw first."
by = [
    "test:sdk/visual/__tests__/runtime.test.ts::sends one batch call for the experiments assigned in the last 30 days",
    "test:frontend/tests/e2e/runtime/real-api-preview.runtime.spec.ts::an event sent on another page counts for the experiment the visitor saw first",
]

[[unit]]
text = "Requests carry no cookies and no Referer."
by = [
    "test:frontend/tests/e2e/runtime/apply.runtime.spec.ts::carry no Referer and no cookie, even from a page that asks for unsafe-url",
    "test:sdk/visual/__tests__/requests.test.ts::call fetch in exactly one place, which sets credentials omit and referrerPolicy no-referrer",
]

[[unit]]
text = "What it stores in the browser"
by = ["exempt:label"]

[[unit]]
text = "Key | Where | What it holds | How long"
by = ["exempt:label"]

[[unit]]
text = "controlvar_uid | cookie | The visitor's random id, when the page sets no data-user-id. Its name is data-cookie-name's default. | 30 days (Max-Age=2592000, Path=/, SameSite=Lax, Secure on https)"
by = ["mechanism:visual-stored-keys"]

[[unit]]
text = "controlvar_assigned | localStorage | The keys of the experiments this visitor was assigned to, each with the time it was last seen, so track() can name them. | 30 days per experiment"
by = ["mechanism:visual-stored-keys"]

[[unit]]
text = "controlvar_pages | localStorage | The page rules of the running visual experiments on this site (match and path), so a page none of them covers makes no call. | 60 seconds"
by = ["mechanism:visual-stored-keys"]

[[unit]]
text = "controlvar_backoff | sessionStorage | The time until which the script sends nothing, set after a refused or failed call. | 5 minutes, in this tab"
by = ["mechanism:visual-stored-keys"]

[[unit]]
text = "controlvar_preview | sessionStorage | A preview link's token, so the preview lasts for the tab. | this tab"
by = ["mechanism:visual-stored-keys"]

[[unit]]
text = "controlvar_editor_open | sessionStorage | \"1\" once a visual editor link was opened in this tab. | this tab"
by = ["mechanism:visual-stored-keys"]

[[unit]]
text = "Every key starts with controlvar_, and revokeConsent() deletes all of them, with the keys later versions of the script will use."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::revokeConsent() on a tag that ${mode}: the cookie and every key go, nothing more is sent, and the next page follows the tag",
    "test:sdk/visual/__tests__/consent.test.ts::deletes the cookie, the default-named one too, and every controlvar_ key, and keeps the site's own",
]

[[unit]]
text = "Consent"
by = ["exempt:label"]

[[unit]]
text = "If your page waits for consent (data-require-consent), the script reads, stores and sends nothing about your visitors before consent()."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::before it, nothing is read, stored or sent; after it, the keys are exactly the ones the script writes",
    "test:sdk/visual/__tests__/consent.test.ts::before it, a tag that waits reads, stores and sends nothing; after it, the page is asked for",
]

[[unit]]
text = "The one exception is a visual-editor link that someone on your team opens from Controlvar: the script then sends only that link's one-time sign-in, opens the editor's frame and stores the editor's own key, and nothing about any visitor."
by = ["test:frontend/tests/e2e/runtime/editor-link.runtime.spec.ts::before consent, the claim is the only request and the editor's key the only key"]

[[unit]]
text = "Call controlvar.visual.consent() once the visitor agrees, and the script applies the page's changes."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::before it, nothing is read, stored or sent; after it, the keys are exactly the ones the script writes",
    "test:sdk/visual/__tests__/consent.test.ts::before it, a tag that waits reads, stores and sends nothing; after it, the page is asked for",
]

[[unit]]
text = "A consent() made while the page's <head> is still loading (a stored consent read there) hides the page as usual; a later one applies the changes in view, without hiding the page."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::a consent() made while <head> loads hides the page as usual until the changes are applied",
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::a consent() after the page has rendered applies the changes without hiding it",
    "test:sdk/visual/__tests__/runtime.test.ts::a script that starts once the page has a <body> never hides it, and still applies the changes",
]

[[unit]]
text = "controlvar.visual.revokeConsent() stops the script: nothing more is sent from this page, and it deletes every cookie it set and every controlvar_ key in this site's localStorage and sessionStorage."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::revokeConsent() on a tag that ${mode}: the cookie and every key go, nothing more is sent, and the next page follows the tag",
    "test:sdk/visual/__tests__/consent.test.ts::stops every request from this page: track(), a new path and the page going away",
]

[[unit]]
text = "Changes already shown stay until the visitor leaves the page."
by = ["test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::revokeConsent() on a tag that ${mode}: the cookie and every key go, nothing more is sent, and the next page follows the tag"]

[[unit]]
text = "With data-require-consent, later pages wait for consent() again; without it the next page starts again, so a site that lets visitors withdraw consent sets data-require-consent."
by = [
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::revokeConsent() on a tag that ${mode}: the cookie and every key go, nothing more is sent, and the next page follows the tag",
    "test:sdk/visual/__tests__/consent.test.ts::with data-require-consent the script waits again, and a later consent() starts with a new id",
]

[[unit]]
text = "A Split URL server integration given a cookie domain sets controlvar_uid for that parent domain, which revokeConsent() does not delete, so a later consent() uses the same id."
by = [
    "test:modules/backend/tests/integration/split_url/test_split_url_reference_integration.py::test_the_cookie_is_exact",
    "test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::a controlvar_uid a server set for the parent domain stays after revokeConsent(), and the next consent() uses its id",
]

[[unit]]
text = "Have your server expire that cookie too when a visitor withdraws consent."
by = ["exempt:advice"]

[[unit]]
text = "Events already sent are not deleted; they stay in your Controlvar database."
by = ["test:frontend/tests/e2e/runtime/consent.runtime.spec.ts::revokeConsent() on a tag that ${mode}: the cookie and every key go, nothing more is sent, and the next page follows the tag"]

[[unit]]
text = "While the page is hidden"
by = ["exempt:label"]

[[unit]]
text = "While the script hides the page (until its changes are applied, and at most data-timeout-ms, 1 second by default), the browser paints nothing, so First Contentful Paint and Largest Contentful Paint are reported that much later."
by = [
    "test:frontend/tests/e2e/runtime/hide.runtime.spec.ts::while hidden the page paints nothing: every paint, and the largest, comes after it shows",
    "test:frontend/tests/e2e/runtime/hide.runtime.spec.ts::shows the page at ${timeout} ms when the API never answers (data-timeout-ms ${attribute ?? \"absent\"})",
]

[[unit]]
text = "Clicks and Tab reach none of the page's controls until it shows."
by = ["test:frontend/tests/e2e/runtime/hide.runtime.spec.ts::while hidden, a click or Tab reaches none of the page's controls"]

[[unit]]
text = "On Next.js's App Router, React places the framework's own scripts ahead of this one in <head>, and in development React logs \"Encountered a script tag\" for it."
by = ["exempt:third-party"]

[[unit]]
text = "Preview links"
by = ["exempt:label"]

[[unit]]
text = "A preview link opens your page with one variant's changes and a banner with an Exit preview button."
by = [
    "test:frontend/tests/e2e/runtime/preview.runtime.spec.ts::shows its variant with the banner, other experiments off, the address clean and nothing recorded",
    "test:frontend/tests/e2e/runtime/preview.runtime.spec.ts::[Exit preview] puts the page back, takes the banner away and ends the preview for the tab",

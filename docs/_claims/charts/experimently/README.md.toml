# What verifies each unit of charts/experimently/README.md (#1142).
# The contract is scripts/doc_claims.py's docstring; check with
# `python scripts/doc_claims.py check`.
document = "charts/experimently/README.md"

[[unit]]
text = "Controlvar Helm chart"
by = ["exempt:label"]

[[unit]]
text = "This chart installs Controlvar on Kubernetes: the API, the dashboard and, by default, a bundled PostgreSQL and Redis."
by = [
    "workflow:chart-kind.yml",
    "test:backend/tests/unit/chart/test_chart_render.py::test_the_bundled_postgres_and_redis_are_one_replica_each_and_never_backed_up",
]

[[unit]]
text = "Install it with the four blocks of Kubernetes (Helm): the chart-kind workflow runs those blocks as written on a kind cluster, for the core and full profiles, and runs helm test after the install."
by = ["workflow:chart-kind.yml"]

[[unit]]
text = "Resource names"
by = ["exempt:label"]

[[unit]]
text = "The chart names what it creates after the release."
by = ["test:backend/tests/unit/chart/test_chart_render.py::test_the_resources_are_named_after_the_release"]

[[unit]]
text = "With the guide's release, experimently in the namespace experimently, the API's Deployment and Service are experimently-api and the dashboard's are experimently-web."
by = [
    "test:backend/tests/unit/chart/test_chart_render.py::test_the_resources_are_named_after_the_release",
    "workflow:chart-kind.yml",
]

[[unit]]
text = "A release whose name does not contain experimently, such as prod, gets prod-experimently-api and prod-experimently-web."
by = ["test:backend/tests/unit/chart/test_chart_render.py::test_the_resources_are_named_after_the_release"]

[[unit]]
text = "After the install"
by = ["exempt:label"]

[[unit]]
text = "The API's migrate init container creates or upgrades the database schema before the API starts."
by = [
    "test:backend/tests/unit/chart/test_chart_render.py::test_migrations_run_in_the_init_container_only",
    "workflow:chart-kind.yml",
]

[[unit]]
text = "If a pod stays in Init, read that container's log; for the guide's release: kubectl logs -n experimently deploy/experimently-api -c migrate."
by = [
    "test:backend/tests/unit/chart/test_chart_render.py::test_the_resources_are_named_after_the_release",
    "test:backend/tests/unit/chart/test_chart_render.py::test_migrations_run_in_the_init_container_only",
]

[[unit]]
text = "helm test experimently -n experimently checks that the API answers on your public host and refuses another host name."
by = [
    "test:backend/tests/unit/chart/test_chart_render.py::test_helm_test_checks_the_public_host_and_refuses_another",
    "test:backend/tests/unit/chart/test_chart_render.py::test_the_resources_are_named_after_the_release",
    "workflow:chart-kind.yml",
]

[[unit]]
text = "The health probes do not check the host name, so they stay healthy when publicBaseUrl is wrong."
by = [
    "test:backend/tests/unit/middleware/test_trusted_host.py::test_infrastructure_probes_are_exempt",
    "test:backend/tests/unit/chart/test_chart_render.py::test_probe_paths",
]

[[unit]]
text = "Sign in at publicBaseUrl as firstSuperuser, with the FIRST_SUPERUSER_PASSWORD of your Secret."
by = ["workflow:chart-kind.yml"]

[[unit]]
text = "That password is read only while the database has no users: changing it later does nothing."
by = ["test:backend/tests/integration/database/test_bootstrap_concurrency.py::test_the_bootstrap_says_whether_it_created_the_first_administrator"]

[[unit]]
text = "Without the Ingress"
by = ["exempt:label"]

[[unit]]
text = "With ingress.enabled=false, route /api, /ws and /health to the API's Service (experimently-api for the guide's release) and everything else to the dashboard's (experimently-web), as the chart's Ingress does."
by = [
    "test:backend/tests/unit/chart/test_chart_render.py::test_the_ingress_host_is_the_public_base_url_hostname",
    "test:backend/tests/unit/chart/test_chart_render.py::test_the_resources_are_named_after_the_release",
]

[[unit]]
text = "Pass the Host header unchanged: the API answers only for the host name of publicBaseUrl."
by = [
    "test:backend/tests/unit/middleware/test_trusted_host.py::test_host_is_checked",
    "test:backend/tests/unit/core/test_config_allowed_hosts.py::TestDerivation::test_it_derives_from_public_base_url",
    "test:backend/tests/unit/chart/test_chart_render.py::test_the_ingress_host_is_the_public_base_url_hostname",
]

[[unit]]
text = "The bundled PostgreSQL and Redis"
by = ["exempt:label"]

[[unit]]
text = "They are for evaluation and small installs: each is one replica, the chart does not back them up, and it never moves them to a new major version (PostgreSQL 16 and Redis 7)."
by = ["test:backend/tests/unit/chart/test_chart_render.py::test_the_bundled_postgres_and_redis_are_one_replica_each_and_never_backed_up"]

[[unit]]
text = "Back up the database before every upgrade."
by = ["exempt:advice"]

    "journey:demo-streampulse-simulator#step-one",
    "journey:demo-streampulse-simulator#critical",
]

[[unit]]
text = "File | What it is"
by = ["exempt:label"]

[[unit]]
text = "devices.py | Deterministic population of simulated devices (seeded RNG) following the spec mix: iOS 55% (16.x/17.x/18.x = 20/60/20), Android 45% (12.x/13.x/14.x = 25/35/40), regions US 45 · GB 15 · DE 12 · IN 18 · BR 10, premium 30%, employee 1%, app 3.1.0/3.2.0/3.2.1 = 30/50/20. Device.attributes() is the targeting context (os, os_version, app_version, region, tier, employee, device_model, device_id). PRESET_DEVICES has a device for each of the app's five presets, with ids of its own (preset-…)."
by = [
    "test:demo/streampulse/simulator/test_traffic.py::test_population_is_deterministic_and_matches_the_spec_mix",
    "test:demo/streampulse/simulator/test_traffic.py::test_evaluate_and_assign_calls_carry_the_device_context",
    "test:backend/tests/unit/scripts/test_demo_apps_catalogues.py::test_the_streampulse_simulator_has_each_app_preset_with_an_id_of_its_own",
]

[[unit]]
text = "traffic.py | Ticks through app sessions: evaluates the 4 flags (GET /feature-flags/evaluate/{key}?user_id=&context=<url-encoded JSON>), assigns the 5 experiments (POST /tracking/assign with context), walks the screens with the spec's true rates and sends the §3 events through POST /tracking/batch. assigned: false (global holdout, mutual exclusion group, targeting) means no events for that experiment. Prints stats every 10 s."
by = [
    "test:demo/streampulse/simulator/test_traffic.py::test_evaluate_and_assign_calls_carry_the_device_context",
    "test:demo/streampulse/simulator/test_traffic.py::test_batch_payloads_use_spec_event_names_and_keys",
    "test:demo/streampulse/simulator/test_traffic.py::test_unassigned_experiments_get_no_events",
    "test:demo/streampulse/simulator/test_traffic.py::test_primary_metric_rates_match_spec_over_6000_sessions",
    "test:demo/streampulse/simulator/test_traffic.py::test_rate_and_duration_send_that_many_sessions_a_second_for_that_long",
]


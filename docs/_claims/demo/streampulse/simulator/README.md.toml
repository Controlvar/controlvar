[[unit]]
text = "StreamPulse device simulator + rollout story"
by = ["exempt:label"]

[[unit]]
text = "Python 3.11, stdlib only."
by = [
    "test:backend/tests/unit/scripts/test_demo_apps_catalogues.py::test_the_streampulse_simulator_needs_only_the_standard_library",
    "journey:demo-streampulse-simulator#dry-run",
    "journey:demo-streampulse-simulator#step-one",
]

[[unit]]
text = "Talks to the platform exactly like the app does: the public API with the streampulse-app API key (demo/streampulse/.api_key, written by backend/scripts/seed_streampulse.py) for devices, the StreamPulse server key (streampulse-server, scope sdk:ruleset, demo/streampulse/.api_key_server, written by the same seed) for the crash reports, and the dashboard API with a bearer token for the story."
by = [
    "test:demo/streampulse/simulator/test_traffic.py::test_api_client_request_shape_and_error_mapping",
    "test:demo/streampulse/simulator/test_traffic.py::test_the_server_key_is_read_from_its_file_and_passed_to_the_client",

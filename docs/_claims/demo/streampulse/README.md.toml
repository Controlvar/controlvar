document = "demo/streampulse/README.md"

[[unit]]
text = "StreamPulse — mobile feature-flag demo for Controlvar"
by = ["exempt:label"]

[[unit]]
text = "StreamPulse is a web page that renders a phone."
by = [
    "journey:demo-streampulse#app",
    "journey:demo-streampulse#premium-iphone",
]

[[unit]]
text = "Pick a simulated device (OS, OS version, app version, region, tier, employee) and the phone shows, screen by screen, which feature flags and experiments that device gets from the Controlvar platform — with the server's reason for each decision."
by = [
    "journey:demo-streampulse#premium-iphone",
    "journey:demo-streampulse#gb-iphone",
]

[[unit]]
text = "A Python simulator pretends to be thousands of devices, and a scripted \"rollout story\" walks a feature flag from internal testers to 100 % with a crash incident and an automatic rollback on the way."
by = [
    "test:demo/streampulse/simulator/test_traffic.py::test_population_is_deterministic_and_matches_the_spec_mix",
    "test:demo/streampulse/simulator/test_traffic.py::test_the_options_and_their_defaults",
    "journey:demo-streampulse-simulator#employee-by-rule",
    "journey:demo-streampulse-simulator#critical",
    "journey:demo-streampulse-simulator#rolled-back",
    "journey:demo-streampulse-simulator#full-rollout",
]

[[unit]]
text = "It exercises the feature-flag path of the platform: targeting rules with device context, gradual rollout schedules, safety monitoring + auto-rollback, kill switches, mutual exclusion groups, the global holdout and Bayesian A/B analysis."
by = [
    "journey:demo-streampulse#rule-matches-the-premium-iphone",
    "journey:demo-streampulse-simulator#at-25",

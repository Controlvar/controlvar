# AWS Amplify builds controlvar.com from this file, on every push to the
# PUBLIC repository's main branch. That is the whole deploy path -- there is no
# pipeline elsewhere.
#
# `npm run build` builds the PLATFORM: the dashboard, /admin/*, /experiments,
# /feature-flags, /results, /workspaces and three "Sign in" buttons. The public
# site has no API behind it, so every one of those 404s -- `POST
# /api/v1/auth/login` returns this site's own HTML with a 404 status -- and a
# visitor evaluating the project met a login form that silently fails.
#
# `build:marketing` builds the homepage, the docs hub and the power calculator
# (which computes in the browser), then prunes the dashboard from the export.
# See frontend/src/utils/site-mode.ts.
version: 1
frontend:
  phases:
    preBuild:
      commands:
        - cd frontend
        - npm ci
    build:
      commands:
        - npm run build:marketing
  artifacts:
    # `output: 'export'` in next.config.js, so the artefact is out/.
    baseDirectory: frontend/out
    files:
      - '**/*'
  cache:
    paths:
      - frontend/node_modules/**/*

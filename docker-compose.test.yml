# docker-compose.test.yml
# Lightweight test environment for CI/CD integration tests
version: '3.8'

services:
  postgres-test:
    image: postgres:15-alpine
    container_name: ep-postgres-test
    environment:
      POSTGRES_DB: experimentation_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis-test:
    image: redis:7-alpine
    container_name: ep-redis-test
    ports:
      - "127.0.0.1:6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  localstack-test:
    image: localstack/localstack:latest
    container_name: ep-localstack-test
    environment:
      SERVICES: dynamodb,s3,kinesis,sqs
      DEFAULT_REGION: us-east-1
      DEBUG: 0
    ports:
      - "127.0.0.1:4567:4566"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 10s
      retries: 5

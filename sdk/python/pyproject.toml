[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlvar"
version = "0.1.0"
description = "Python client for the Controlvar public API (experiments, feature flags, event tracking)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["experimentation", "a/b-testing", "feature-flags", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
]
# Deliberately empty: the client uses only the standard library (urllib).
dependencies = []

[project.urls]
Homepage = "https://github.com/Controlvar/controlvar/tree/main/sdk/python#readme"
Repository = "https://github.com/Controlvar/controlvar"
Issues = "https://github.com/Controlvar/controlvar/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools]
packages = ["experimentation"]

[tool.setuptools.package-data]
experimentation = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=84.2.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "controlvar-openfeature"
version = "0.1.0"
description = "OpenFeature provider for Controlvar (server-side flag evaluation)"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["openfeature", "feature-flags", "experimentation", "a/b-testing"]
classifiers = [
    "Development Status :: 4 - Beta",
]
dependencies = [
    # 0.9.0 introduced the tracking API (AbstractProvider.track / TrackingEventDetails).
    "openfeature-sdk>=0.10.0",
    # The Python SDK in sdk/python. Pre-1.0, a minor release may change the
    # API, so admit the current minor only; widen this when that SDK moves.
    # backend/tests/smoke/test_sdk_sibling_ranges.py fails if it stops
    # admitting sdk/python's manifest version (#668).
    "controlvar>=0.2.0,<0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

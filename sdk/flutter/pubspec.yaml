name: controlvar
description: Flutter SDK for Controlvar — server-decided feature flags, A/B experiment assignment and event tracking with per-user caching and offline fallback.
version: 0.2.0
homepage: https://github.com/Controlvar/controlvar

environment:
  sdk: '>=2.17.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shared_preferences: ^2.2.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0


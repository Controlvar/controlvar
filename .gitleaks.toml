title = "Controlvar gitleaks config"

# A config that defines no rules and does not extend the defaults scans with
# NO RULES -- which is what this file did from the day it was added (EP-018)
# until 2026-09-13. Every CI run, every core_build.sh secrets step and every
# local scan that loaded it found nothing because it could not find anything.
# Tamper-test any change here: plant an AWS key in a scratch commit and make
# sure the scan reports it -- but NOT the documentation one. `gitleaks` 8.30
# does not flag `AKIAIOSFODNN7EXAMPLE` /
# `wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY`, because the default rules
# allowlist AWS's own published examples. Probing with those and seeing "no
# leaks found" reads exactly like the rule-less config this file was written to
# fix. Use a random `AKIA` + 16 chars instead; verified 2026-09-19 that such a
# key is reported in `backend/app/`, is allowlisted under `backend/tests/`, and
# is NOT reported once `useDefault` is false -- which is what proves the
# `[extend]` block below is doing the work.
[extend]
useDefault = true

[allowlist]
description = "test fixtures and reviewed placeholder values"
paths = [
  'backend/tests/',
  'modules/backend/tests/',
  'frontend/src/tests/',
  'modules/frontend/src/tests/',
  'sdk/[^/]+/tests?/',
  'demo/[^/]+/src/__tests__/',
]
# Every value here is a visibly fake placeholder the default rules match in
# this tree or its history. The CI jobs run gitleaks with NO path allowlist
# over all history (security-scan.yml, release-gate.yml, pr-qa-gate.yml);
# this config is the local convenience, not the gate.
stopwords = [
  "your_access_token", "your_api_key", "your-api-key", "YOUR_API_KEY",
  "your_admin_token", "your-api-key-here", "expired_token",
  "sk-live-xxxx", "sk-prod-abc123", "sk-live-abc123", "sk_live_123abc",
  "ep_live_a1b2c3", "1234567890ABCDEF",
  "StrongPass123", "Str0ng-Passw0rd", "abcdef1234567890", "owner-flag-001",
  "dev-token-admin", "Ed25519PrivateKey",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9", "eyJjdHkiOiJKV1Q", "eyJraWQiOiJ",
  "eyJ0eXAiOiJKV1Q", "eyJhbGciOiJSUzI1NiIs",
  "num_buckets", "FLAG_KEYS", "default_variant",
  # RFC 6455 section 1.3's published sample Sec-WebSocket-Key (base64 of
  # "the sample nonce"), used by docs/websocket-streaming.md's handshake.
  "dGhlIHNhbXBsZSBub25jZQ==",
]
